  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
  button{font:inherit;color:inherit;cursor:pointer}
  code,.mono{font-family:var(--mono)}

  .app{display:flex;height:100vh;min-height:0}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{padding:14px 20px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
  .top h1{margin:0;font-size:19px;letter-spacing:-.01em}
  .top .sub{margin:2px 0 0;color:var(--ink-muted);font-size:13px}
  .top-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
  .tabs{display:flex;gap:6px}
  .tab{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:5px 14px;font-weight:600}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .tab[aria-selected="true"]{color:#06201b}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#06201b}}
  .spacer{flex:1}
  .btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:default}
  .stepper{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-muted)}
  .stepper b{color:var(--ink);min-width:42px;text-align:center}
  a.back{display:inline-block;margin-bottom:6px;border:1px solid var(--border);background:var(--surface);border-radius:8px;
    padding:4px 11px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
  a.back:hover,a.back:focus-visible{border-color:var(--accent);background:var(--accent-soft);outline:none}
  a.link{color:var(--accent);text-decoration:none;font-size:13px}
  a.link:hover{text-decoration:underline}

  .intro{margin:0;padding:10px 20px;color:var(--ink-muted);font-size:13px;border-bottom:1px solid var(--border);background:var(--surface-2)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 20px;font-size:12px;color:var(--ink-muted);border-bottom:1px solid var(--border)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .stage-wrap{flex:1;min-height:0;overflow:auto}
  .stage{position:relative;display:grid;gap:26px 46px;padding:22px 22px 60px;width:max-content;min-width:100%}
  .edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .edges path{fill:none;stroke:var(--edge);stroke-width:1.6}
  .edges path.call{stroke:var(--edge-call);stroke-dasharray:5 4}
  .edges path.active{stroke:var(--accent);stroke-width:2.4;stroke-dasharray:none}
  .edges .head{fill:var(--edge)}
  .edges .head-call{fill:var(--edge-call)}
  .elabel{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;
    background:var(--surface);border:1px solid var(--border);color:var(--ink-muted);white-space:nowrap;pointer-events:none}

  .colhead{font-size:12px;font-weight:700;color:var(--ink-muted);text-transform:none;border-bottom:2px solid var(--border);padding-bottom:6px;align-self:end}
  .cell{display:flex;flex-direction:column;gap:12px;align-self:center;justify-content:center;position:relative;z-index:1}

  .node{--k:var(--k-route);--ks:var(--k-route-soft);position:relative;background:var(--surface);border:1px solid var(--border);
    border-left:5px solid var(--k);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .08s, border-color .12s}
  .node:hover{transform:translateY(-1px);border-color:var(--k)}
  .node:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .node[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
  .node.screen{--k:var(--k-screen);--ks:var(--k-screen-soft)}
  .node.route{--k:var(--k-route);--ks:var(--k-route-soft)}
  .node.helper{--k:var(--k-helper);--ks:var(--k-helper-soft)}
  .node.db{--k:var(--k-db);--ks:var(--k-db-soft)}
  .node.config{--k:var(--k-config);--ks:var(--k-config-soft)}
  .node.later{--k:var(--k-later);--ks:var(--k-later-soft);background:var(--k-later-soft);box-shadow:none;border-style:dashed;border-left-style:solid;padding:8px 10px}
  .n-title{font-weight:700;font-size:13.5px;letter-spacing:-.01em}
  .n-plain{margin-top:3px;color:var(--ink-muted);font-size:12.5px}
  .n-reject{margin-top:6px;font-size:12px;color:var(--danger);background:var(--danger-soft);border-radius:6px;padding:3px 8px}
  .n-reject::before{content:"막히면 → ";font-weight:700}
  .n-items{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .n-item{display:flex;flex-direction:column;gap:3px}
  .n-call{overflow-wrap:anywhere;font-family:var(--mono);font-size:11.5px;color:var(--k);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{max-width:100%;text-align:left;overflow-wrap:anywhere;border:1px solid var(--border);background:var(--ks);color:var(--ink);border-radius:6px;padding:1px 7px;font-family:var(--mono);font-size:11px}
  .chip:hover{border-color:var(--k);color:var(--k)}
  .chip.file::before{content:"📄 "}
  .chip.fn::before{content:"ƒ ";color:var(--k);font-weight:700}
  .chip.snip::before{content:"▤ ";color:var(--k);font-weight:700}
  .tag-later{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--ink-muted);border:1px solid var(--border);border-radius:999px;padding:0 7px;background:var(--surface)}

  /* 코드 패널 */
  .panel{width:var(--panel-w);flex:none;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
  .p-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
  .p-head h2{margin:0;font-size:15.5px;letter-spacing:-.01em}
  .p-head p{margin:4px 0 0;color:var(--ink-muted);font-size:13px}
  .p-close{display:none}
  .p-body{flex:1;min-height:0;overflow:auto;padding:12px 16px 24px}
  .hint{color:var(--ink-muted);font-size:13px}
  .hint li{margin:4px 0}
  .itabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}

  .itab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .fileline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
  .fileline .path{font-family:var(--mono);font-size:12.5px;font-weight:700}
  .fileline .lines{font-family:var(--mono);font-size:12px;color:var(--ink-muted)}
  .alias{border:1px solid var(--border);background:var(--k-db-soft);border-radius:8px;padding:8px 10px;margin:0 0 10px;font-size:12.5px}

  .alias .route span.step{padding:1px 7px;border-radius:6px;border:1px solid var(--border);background:var(--surface)}
  .alias .route span.real{border-color:var(--k-db);color:var(--k-db);font-weight:700}
  .alias .arrow{color:var(--ink-muted)}
  .codebox{border:1px solid var(--border);border-radius:8px;background:var(--code-bg);overflow:auto;max-height:calc(100vh - 330px);min-height:240px}
  .codebox.wrap table.code td.tx{white-space:pre-wrap;overflow-wrap:anywhere}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  /* 흐름도 ↔ 코드 패널 사이 드래그 분할선 (겹쳐 놓아 레이아웃은 밀리지 않는다) */
  .splitter{flex:none;position:relative;z-index:6;width:11px;margin:0 -5px;cursor:col-resize;touch-action:none;outline:none}
  .splitter::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:1px;background:var(--border);transition:background .12s,width .12s,left .12s}
  .splitter::after{content:"";position:absolute;left:3px;top:50%;width:5px;height:44px;margin-top:-22px;border-radius:3px;background:var(--border);transition:background .12s}
  .splitter:hover::before,.splitter:focus-visible::before,body.dragging .splitter::before{background:var(--accent);width:3px;left:4px}
  .splitter:hover::after,.splitter:focus-visible::after,body.dragging .splitter::after{background:var(--accent)}
  body.dragging{user-select:none;cursor:col-resize}
  table.code{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.2px;line-height:1.6}

  table.code td.ln{position:sticky;left:0;text-align:right;color:var(--code-gutter);user-select:none;background:var(--code-bg);border-right:1px solid var(--border);min-width:44px;padding-right:8px}
  table.code tr.hl td{background:var(--code-hl)}

  .legend-hl{margin:8px 0 0;font-size:12px;color:var(--ink-muted)}
  .legend-hl b{background:var(--code-hl);color:var(--ink);padding:0 6px;border-radius:4px}
  .flist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
  .flist button{width:100%;text-align:left;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:6px 10px}
  .flist button:hover{border-color:var(--accent)}
  .flist small{display:block;color:var(--ink-muted)}
  details.hdr{margin-top:12px;font-size:13px}
  details.hdr pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px;font-family:var(--sans);font-size:12.5px;color:var(--ink-muted)}

  @media (max-width:900px){
    .splitter{display:none}
    .app{display:block;height:auto}
    .stage-wrap{max-height:none;overflow-x:auto}
    .panel{position:fixed;left:0;right:0;bottom:0;width:auto;height:62vh;border-left:0;border-top:2px solid var(--accent);

    body.open .panel{transform:none}
    .p-close{display:inline-block;position:absolute;right:12px;top:10px}
    .p-head{position:relative;padding-right:70px}
    .top{padding:12px 16px 8px}
    .stage{padding:16px 16px 70vh}
  }
  @media (prefers-reduced-motion: reduce){.node,.panel{transition:none}}

ts_page=, ?comments_page=, ?admin_log_page=,\n    ?security_events_page=, ?security_incidents_page=, ?access_requests_page=로\n    현재 보고 있는 페이지 번호를 받는다 —\n    dashboard/api.js가 board_list()와 동일한 페이지 번호 방식으로 표를 그릴 수 있도록,\n    각 표의 이번 페이지 데이터와 전체 페이지 수(*_total_pages)를 함께 내려준다\n    (예전에는 최근 N개만 고정으로 가져와서, 그 이상 쌓이면 오래된 항목이 화면에서\n    아예 사라졌었다).\n\n    db.list_*() 함수들은 (이번 페이지 데이터, 전체 개수) 튜플을 돌려준다 — 목록\n    조회와 개수 조회를 별도 쿼리 두 번으로 나누지 않고 한 번의 왕복으로 끝내기\n    위해서다(db.list_recent_attempts() 설명 참고).\n\n    그래도 여전히 서로 무관한 쿼리들(처음엔 9개, 지금은 표·카드·권한 조회까지 17개)을\n    하나씩 순서대로 기다리면, Supabase까지의 왕복 시간(쿼리 하나당 대략 150~500ms)이\n    그대로 다 더해진다 — 쿼리가 9개였던 시절에도 요청 하나가 2~3초까지 걸렸고, 특히\n    Vercel 서버리스 환경은 매 요청마다 커넥션을 새로 맺어야 해서 체감이 더 심했다.\n    ThreadPoolExecutor로 이 쿼리들을 동시에 보내면\n    전체 소요 시간이 \"가장 느린 쿼리 하나\" 수준으로 줄어든다(실측 약 5배 개선).\n    IP 위치 조회(_attach_locations)는 attempts 결과가 있어야 시작할 수 있는\n    후속 작업이라 별도로 남겨뒀지만, 나머지 futures가 백그라운드에서 계속\n    돌고 있는 동안 같이 실행되므로 추가 대기 시간은 거의 없다.\n\n    응답 속도(guide46):\n    - ?only=<표 이름>이면 그 표 하나만 돌려준다(_api_status_section) — 페이지 넘기기용.\n    - 만료된 잠금 정리는 정해진 간격마다만 한다(_release_expired_locks_if_due).\n    - 아래 조회는 전부 한 번에(동시 처리 한도 = 조회 개수) 보낸다. \"관리자 계정 관리\" 카드의\n      권한 확인과 목록도 같은 배치에 넣고, 권한이 없으면 목록은 버린다(응답에 싣지 않는다).\n    \"\"\"\n    only = request.args.get(\"only\")\n    if only is not None:\n        return _api_status_section(only)\n\n    ttl = config.ADMIN_STATUS_CACHE_SECONDS\n    cache_key = (g.admin[\"role\"], request.query_string)\n    if ttl > 0:\n        with _status_cache_lock:\n            hit = _status_cache.get(cache_key)\n        if hit and time.monotonic() - hit[0] < ttl:\n            return jsonify(hit[1])\n\n    _release_expired_locks_if_due()\n\n    attempts_page = _page_param(\"attempts_page\")\n    users_page = _page_param(\"users_page\")\n    posts_page = _page_param(\"posts_page\")\n    comments_page = _page_param(\"comments_page\")\n    admin_log_page = _page_param(\"admin_log_page\")\n    security_events_page = _page_param(\"security_events_page\")\n    security_incidents_page = _page_param(\"security_incidents_page\")\n    access_requests_page = _page_param(\"access_requests_page\")\n    # login_required가 세션을 확인하면서 계정(role 포함)을 이미 조회해 g.admin에 담아뒀다(guide37).\n    # 아래 스레드에서는 g를 쓸 수 없으므로 여기서 먼저 꺼내둔다.\n    role = g.admin[\"role\"]\n\n    # 동시 처리 한도 = 아래 조회 개수(20). 한도가 더 작으면 일부 조회가 앞 조회를 기다린다(guide46).\n    with ThreadPoolExecutor(max_workers=20) as executor:\n        attempts_future = executor.submit(db.list_recent_attempts, attempts_page, config.ADMIN_PAGE_SIZE)\n        lockouts_future = executor.submit(db.list_active_lockouts)\n        # \"현재 잠긴 IP / 계정\" 카드의 계정 잠금 목록 — IP 잠금 목록과 같은 배치로 병렬 조회.\n        account_lockouts_future = executor.submit(db.list_active_account_lockouts)\n        admin_account_lockouts_future = executor.submit(db.list_active_admin_account_lockouts)\n        admin_log_future = executor.submit(db.list_admin_login_log, admin_log_page, config.ADMIN_PAGE_SIZE)\n        users_future = executor.submit(db.list_users, users_page, config.ADMIN_PAGE_SIZE)\n        signup_future = executor.submit(db.get_signup_enabled)\n        posts_future = executor.submit(db.list_posts, posts_page, config.ADMIN_PAGE_SIZE)\n        comments_future = executor.submit(db.list_comments_admin, comments_page, config.ADMIN_PAGE_SIZE)\n        security_events_future = executor.submit(\n            db.list_security_events, security_events_page, config.ADMIN_PAGE_SIZE\n        )\n        # 연관 사건(SIEM 상관분석, Track C guide27) 표 — 위 보안 이벤트와 같은\n        # 페이지네이션 방식이다.\n        security_incidents_future = executor.submit(\n            db.list_security_incidents, security_incidents_page, config.ADMIN_PAGE_SIZE\n        )\n        # \"AI 조기 경보\" 표(Track A, guide31) — 위 표들과 같은 페이지네이션 방식이다.\n        access_requests_future = executor.submit(\n            db.list_pending_requests, access_requests_page, config.ADMIN_PAGE_SIZE\n        )\n        # 영구 잠금 + 이메일 복구(guide33/34-a) 카드용 데이터와, 화면이 어떤 버튼을 보여줄지\n        # 정하는 데 쓰는 \"현재 관리자의 권한 목록\" — 위 쿼리들과 같은 배치로 병렬 조회한다.\n        recovery_future = executor.submit(db.list_recent_recovery_requests, 20)\n        exemptions_future = executor.submit(db.list_active_ip_exemptions, 20)\n        permissions_future = executor.submit(db.list_role_permissions, role)\n        # \"관리자 계정 관리\" 카드 — 권한 확인과 목록을 같은 배치로 미리 보낸다(권한이 없으면 목록은 버림).\n        can_manage_admins_future = executor.submit(db.has_permission, role, \"manage_admin_users\")\n        admin_users_future = executor.submit(db.list_admin_users)\n        # Track D 관제 카드(C2-3, 계약서 K10) — 최근 네트워크 경보·L4 차단 목록·장비 생존 신호.\n        # 장비 신호는 이 PC(LW_NODE_NAME)가 정해져 있을 때만 조회한다(Vercel에는 장비가 없다).\n        net_events_future = executor.submit(db.list_recent_network_events, 50)\n        net_blocks_future = executor.submit(db.list_network_blocks_for_dashboard)\n        agent_heartbeats_future = (\n            executor.submit(db.get_agent_heartbeats, config.LW_NODE_NAME) if config.LW_NODE_NAME else None\n        )\n\n        attempts, attempts_count = attempts_future.result()\n        recent_attempts = _attach_locations(attempts)  # 다른 future들이 도는 동안 함께 실행됨\n        active_lockouts = lockouts_future.result()\n        active_account_lockouts = account_lockouts_future.result()\n        active_admin_account_lockouts = admin_account_lockouts_future.result()\n        admin_log, admin_log_count = admin_log_future.result()\n        users, users_count = users_future.result()\n        signup_enabled = signup_future.result()\n        posts, posts_count = posts_future.result()\n        comments, comments_count = comments_future.result()\n        security_events, security_events_count = security_events_future.result()\n        security_incidents, security_incidents_count = security_incidents_future.result()\n        access_requests, access_requests_count = access_requests_future.result()\n        recovery_requests = recovery_future.result()\n        ip_exemptions = exemptions_future.result()\n        permissions = permissions_future.result()\n        can_manage_admins = can_manage_admins_future.result()\n        # 권한이 없으면 결과를 꺼내지 않는다 — 실패했더라도 그 관리자의 화면과는 무관하다.\n        admin_users = admin_users_future.result() if can_manage_admins else None\n        network_events = [\n            e for e in net_events_future.result()\n            if e.get(\"category\") in _UNFILTERED_NET_CATEGORIES or _in_edge_subnet(e.get(\"src_ip\"))\n        ]\n        network_blocks = [\n            _network_block_for_dashboard(b)\n            for b in net_blocks_future.result()\n            if _in_edge_subnet(b.get(\"ip_address\"))\n        ]\n        agent_rows = agent_heartbeats_future.result() if agent_heartbeats_future else {}\n        agent_status = _build_agent_status(agent_rows, datetime.datetime.now(datetime.timezone.utc))\n\n    response_data = {\n            \"recent_attempts\": recent_attempts,\n            \"attempts_total_pages\": max(1, math.ceil(attempts_count / config.ADMIN_PAGE_SIZE)),\n            \"active_lockouts\": active_lockouts,\n            \"active_account_lockouts\": active_account_lockouts,\n            # 관리자 계정 단위 잠금(guide38) — 회원 계정 잠금과 같은 카드에 \"관리자\" 배지로 표시한다.\n            \"active_admin_account_lockouts\": active_admin_account_lockouts,\n            \"admin_login_log\": admin_log,\n            \"admin_log_total_pages\": max(1, math.ceil(admin_log_count / config.ADMIN_PAGE_SIZE)),\n            \"users\": users,\n            \"users_total_pages\": max(1, math.ceil(users_count / config.ADMIN_PAGE_SIZE)),\n            \"signup_enabled\": signup_enabled,\n            # 게시판 관리 섹션(관리자 대시보드)용 — recent_attempts 등과 같은 폴링\n            # 주기(dashboard/main.js, 5초)로 함께 갱신된다.\n            \"recent_posts\": posts,\n            \"posts_total_pages\": max(1, math.ceil(posts_count / config.ADMIN_PAGE_SIZE)),\n            \"recent_comments\": comments,\n            \"comments_total_pages\": max(1, math.ceil(comments_count / config.ADMIN_PAGE_SIZE)),\n            # 보안 이벤트(위험등급 통합) 섹션 — security-risk-response-summary.md 5절.\n            \"security_events\": security_events,\n            \"security_events_total_pages\": max(1, math.ceil(security_events_count / config.ADMIN_PAGE_SIZE)),\n            # 연관 사건(SIEM 상관분석) 섹션 — Track C guide27.\n            \"security_incidents\": security_incidents,\n            \"security_incidents_total_pages\": max(1, math.ceil(security_incidents_count / config.ADMIN_PAGE_SIZE)),\n            # AI 조기 경보(Track A guide31) 섹션 — 임계값을 아직 안 넘긴 코앞\n            # 구간에서 LLM이 위험하다고 판단해 등록한 PENDING 요청과, SIEM HIGH 사건의\n            # 영구 잠금 후보(guide33, security/lockdown.py)를 보여준다.\n            \"access_requests\": access_requests,\n            \"access_requests_total_pages\": max(1, math.ceil(access_requests_count / config.ADMIN_PAGE_SIZE)),\n            # 영구 잠금 + 이메일 복구(guide33/34-a): 영구 잠금 카드·복구 요청 카드·IP 예외\n            # 카드와, 현재 관리자가 가진 권한(버튼 노출용 — 실제 검사는 서버가 따로 한다).\n            \"permanent_locks\": _build_permanent_locks(active_lockouts, active_account_lockouts),\n            \"recovery_requests\": recovery_requests,\n            \"ip_exemptions\": ip_exemptions,\n            \"permissions\": permissions,\n            # Track D 관제 카드(C2-3, 계약서 K10). network_events·network_blocks는 이 PC 대역만.\n            \"network_events\": network_events,\n            \"network_blocks\": network_blocks,\n            \"agent_status\": agent_status,\n        }\n\n    # \"관리자 계정 관리\" 카드는 super_admin(manage_admin_users 권한 보유자)에게만\n    # 응답에 실어 보낸다 — viewer/security_admin의 화면에는 이 키 자체가 없어서\n    # dashboard/render/tables.js가 카드를 숨긴다(다른 관리자 계정 목록이 노출되지 않음).\n    if can_manage_admins:\n        response_data[\"admin_users\"] = admin_users\n\n    if ttl > 0:\n        with _status_cache_lock:\n            _status_cache[cache_key] = (time.monotonic(), response_data)\n            if len(_status_cache) > 64:  # 쪽 번호 조합이 무한히 늘지 않게\n                _status_cache.pop(next(iter(_status_cache)))\n    return jsonify(response_data)", "alias": null}, "db/network_events.py:list_recent_network_events": {"path": "db/network_events.py", "start": 137, "end": 143, "lang": "python", "code": "def list_recent_network_events(limit=50) -> list[dict]:\n    \"\"\"화면에 필요한 칸만 최신 관측 순으로 가져와 응답 크기를 제한한다.\"\"\"\n    return (\n        db.get_client().table(\"network_events\")\n        .select(\"id,observed_at,src_ip,layer,category,signature,packet_count,promoted\")\n        .order(\"observed_at\", desc=True).order(\"id\", desc=True).limit(limit).execute().data\n    )", "alias": null}, "db/network_blocks.py:list_network_blocks_for_dashboard": {"path": "db/network_blocks.py", "start": 106, "end": 119, "lang": "python", "code": "def list_network_blocks_for_dashboard() -> list[dict]:\n    cutoff = (datetime.now(timezone.utc) - timedelta(hours=24)).isoformat()\n    # REMOVED가 아니거나, removed_at이 최근 24시간 이내인 REMOVED 행\n    query = f\"status.neq.REMOVED,and(status.eq.REMOVED,removed_at.gte.{cutoff})\"\n    res = (\n        db.get_client()\n        .table(\"network_blocks\")\n        .select(\"*\")\n        .or_(query)\n        .order(\"requested_at\", desc=True)\n        .limit(100)\n        .execute()\n    )\n    return res.data or []", "alias": null}, "routes/admin/status.py:_in_edge_subnet": {"path": "routes/admin/status.py", "start": 183, "end": 199, "lang": "python", "code": "def _in_edge_subnet(ip: str | None) -> bool:\n    \"\"\"이 PC가 맡은 공격 대역(NET_EDGE_SUBNET) 안의 IP인지 본다.\n\n    세 PC가 같은 DB를 쓰므로, 거르지 않으면 남의 PC 경보·차단이 내 화면에 섞인다(01 D4).\n    설정이 비었거나 잘못됐으면 거르지 않는다 — 잘못된 설정 때문에 화면이 통째로 비면\n    관리자가 \"공격이 없다\"고 오해하기 쉬워서다(잘못된 값은 로그로 알린다).\"\"\"\n    if not config.NET_EDGE_SUBNET or not ip:\n        return True\n    try:\n        subnet = ipaddress.ip_network(config.NET_EDGE_SUBNET, strict=False)\n    except ValueError:\n        print(f\"[status] 잘못된 NET_EDGE_SUBNET 설정 — 거르지 않습니다: {config.NET_EDGE_SUBNET!r}\")\n        return True\n    try:\n        return ipaddress.ip_address(ip) in subnet\n    except ValueError:\n        return False", "alias": null}, "routes/admin/status.py:_build_agent_status": {"path": "routes/admin/status.py", "start": 216, "end": 261, "lang": "python", "code": "def _build_agent_status(rows: dict[str, dict], now: datetime.datetime) -> dict:\n    \"\"\"이 PC(LW_NODE_NAME)의 fw-agent·shipper 상태를 계약서 K10 agent_status 모양으로 만든다.\n\n    LW_NODE_NAME이 비어 있으면(Vercel 등 Docker 단지가 없는 환경) 감시할 장비가 없으므로 {}.\n    기록이 없거나 마지막 신호가 기준(FW_AGENT_STALE_SECONDS·SHIPPER_STALE_SECONDS)보다 오래되면\n    stale이다. 한 번이라도 신호를 보낸 장비가 멈췄을 때만 Slack으로 알린다 — 아직 켠 적 없는\n    장비까지 알리면 단지를 켜지 않은 PC에서 화면을 열 때마다 알림이 쌓인다. 쿨다운 키는 heartbeat\n    창구(C1-2)의 상대 장비 정지 알림과 같아서 알림이 두 번 가지 않는다.\"\"\"\n    if not config.LW_NODE_NAME:\n        return {}\n\n    result = {}\n    for agent, stale_seconds in (\n        (\"fw-agent\", config.FW_AGENT_STALE_SECONDS),\n        (\"shipper\", config.SHIPPER_STALE_SECONDS),\n    ):\n        row = rows.get(agent)\n        if not row or not row.get(\"last_seen_at\"):\n            result[agent] = {\"last_seen_at\": None, \"stale\": True, \"detail\": (row or {}).get(\"detail\") or {}}\n            continue\n\n        last_seen_str = row[\"last_seen_at\"]\n        detail = row.get(\"detail\") or {}\n        try:\n            last_seen_dt = datetime.datetime.fromisoformat(last_seen_str.replace(\"Z\", \"+00:00\"))\n            if last_seen_dt.tzinfo is None:\n                last_seen_dt = last_seen_dt.replace(tzinfo=datetime.timezone.utc)\n        except (TypeError, ValueError):\n            # 시각을 읽을 수 없으면 살아 있다고 보장할 수 없으므로 정지로 표시한다(알림은 보내지 않음).\n            result[agent] = {\"last_seen_at\": last_seen_str, \"stale\": True, \"detail\": detail}\n            continue\n\n        diff_sec = (now - last_seen_dt).total_seconds()\n        is_stale = diff_sec > stale_seconds\n        result[agent] = {\"last_seen_at\": last_seen_str, \"stale\": is_stale, \"detail\": detail}\n        if is_stale:\n            cooldown_key = f\"slack:stale:{config.LW_NODE_NAME}:{agent}\"\n            try:\n                if db.try_acquire_cooldown(cooldown_key, config.AGENT_ALERT_COOLDOWN_SECONDS):\n                    alert.send_component_alert(\n                        agent, f\"{int(diff_sec)}초 넘게 생존 신호가 없습니다 (PC: {config.LW_NODE_NAME})\"\n                    )\n            except Exception as e:\n                # 알림 실패가 관리자 화면 전체를 500으로 만들면 안 된다.\n                print(f\"[status] 장비 정지 알림 실패: {agent} — {e}\")\n    return result", "alias": null}, "routes/admin/status.py:_network_block_for_dashboard": {"path": "routes/admin/status.py", "start": 202, "end": 213, "lang": "python", "code": "def _network_block_for_dashboard(row: dict) -> dict:\n    \"\"\"network_blocks 행을 계약서 K10 모양으로 바꾼다. DB 칸 이름은 ip_address지만 화면 계약은 ip다.\"\"\"\n    return {\n        \"ip\": row.get(\"ip_address\"),\n        \"reason\": row.get(\"reason\"),\n        \"evidence\": row.get(\"evidence\"),\n        \"status\": row.get(\"status\"),\n        \"expires_at\": row.get(\"expires_at\"),\n        \"requested_by\": row.get(\"requested_by\"),\n        \"applied_at\": row.get(\"applied_at\"),\n        \"last_error\": row.get(\"last_error\"),\n    }", "alias": null}, "web/src/components/net/L4BlockCard.tsx:20-25": {"path": "web/src/components/net/L4BlockCard.tsx", "start": 20, "end": 25, "lang": "js", "code": "const STATUS: Record<NetworkBlockStatus, { label: string; tone: \"neutral\" | \"ok\" | \"warn\" | \"danger\" }> = {\n  PENDING_APPLY: { label: \"적용 대기\", tone: \"warn\" },\n  APPLIED: { label: \"차단 중\", tone: \"danger\" },\n  PENDING_REMOVE: { label: \"해제 대기\", tone: \"neutral\" },\n  REMOVED: { label: \"해제됨\", tone: \"ok\" },\n  FAILED: { label: \"실패\", tone: \"danger\" },", "alias": null}, "web/src/components/net/NetworkEventsCard.tsx:22-25": {"path": "web/src/components/net/NetworkEventsCard.tsx", "start": 22, "end": 25, "lang": "js", "code": "export function NetworkEventsCard() {\n  const { status } = useOps();\n  const rows = status?.network_events ?? [];\n  const { pageRows, page: current, totalPages, setPage } = useClientPages(rows, PAGE_SIZE);", "alias": null}, "web/src/components/net/AgentStatusBadges.tsx:28-28": {"path": "web/src/components/net/AgentStatusBadges.tsx", "start": 28, "end": 28, "lang": "js", "code": "        const stale = beat ? beat.stale : true;", "alias": null}, "db/stats.py:fetch_raw": {"path": "db/stats.py", "start": 132, "end": 174, "lang": "python", "code": "def fetch_raw(now: datetime | None = None) -> dict:\n    \"\"\"대시보드 집계에 필요한 원본 줄을 동시에 가져온다.\"\"\"\n    now = (now or datetime.now(KST)).astimezone(KST)\n    today_start = now.replace(hour=0, minute=0, second=0, microsecond=0)\n    week_ago_start = today_start - timedelta(days=RECENT_DAYS)  # 지난주 같은 요일 포함\n    events_since = today_start - timedelta(days=EVENT_WINDOW_DAYS)\n\n    jobs = {\n        \"events\": lambda: _fetch_rows(\n            \"security_events\",\n            \"id,event_type,severity,ip_address,path,count,action,username,detected_at,resolved_at\",\n            \"detected_at\",\n            events_since,\n        ),\n        \"failed_logins\": lambda: _fetch_rows(\n            \"login_attempts\", \"attempted_at\", \"attempted_at\", week_ago_start, success=False\n        ),\n        \"not_found\": lambda: _fetch_rows(\"not_found_attempts\", \"attempted_at\", \"attempted_at\", week_ago_start),\n        \"unauthorized\": lambda: _fetch_rows(\n            \"unauthorized_attempts\", \"attempted_at\", \"attempted_at\", week_ago_start\n        ),\n        \"incidents\": lambda: _fetch_rows(\n            \"security_incidents\",\n            \"id,ip_address,event_types,severity_max,status,first_event_at,last_event_at,resolved_by\",\n            \"last_event_at\",\n            events_since,\n        ),\n        \"summary\": lambda: _summary_rows((today_start - timedelta(days=RECENT_DAYS - 1)).date()),\n        # [C2-3] 네트워크 경보 종류별 개수 — 집계는 B의 db.count_network_events_by_category(계약서 K10).\n        # NET_EDGE_SUBNET으로 거르지 않는다(세 PC 합계, 발표 날에는 시연 PC만 돈다).\n        \"network_layer\": lambda: db.count_network_events_by_category(week_ago_start.isoformat()),\n    }\n    for source in LOG_SOURCES:\n        column = _LOG_TIME_COLUMN.get(source, \"attempted_at\")\n        jobs[f\"today:{source}\"] = lambda s=source, c=column: _count_since(s, c, today_start)\n\n    with ThreadPoolExecutor(max_workers=len(jobs)) as executor:\n        futures = {name: executor.submit(job) for name, job in jobs.items()}\n        raw = {name: future.result() for name, future in futures.items()}\n\n    raw[\"today_counts\"] = {source: raw.pop(f\"today:{source}\") for source in LOG_SOURCES}\n    raw[\"now\"] = now\n    return raw", "alias": null}, "db/network_events.py:count_network_events_by_category": {"path": "db/network_events.py", "start": 146, "end": 161, "lang": "python", "code": "def count_network_events_by_category(since_iso: str) -> list[dict]:\n    \"\"\"전체 PC의 경보 행을 최대 2만 건까지 세어 통계 조회 비용을 제한한다.\"\"\"\n    counts = Counter()\n    for start in range(0, _MAX_ROWS, _PAGE):\n        page = (\n            db.get_client().table(\"network_events\").select(\"category,layer\")\n            .gte(\"observed_at\", since_iso).order(\"observed_at\", desc=True).order(\"id\", desc=True)\n            .range(start, start + _PAGE - 1).execute().data\n        )\n        counts.update((row[\"category\"], row[\"layer\"]) for row in page)\n        if len(page) < _PAGE:\n            break\n    return [\n        {\"category\": category, \"layer\": layer, \"count\": count}\n        for (category, layer), count in sorted(counts.items(), key=lambda item: (-item[1], item[0]))\n    ]", "alias": null}, "scripts/net/run_all.py:main": {"path": "scripts/net/run_all.py", "start": 46, "end": 82, "lang": "python", "code": "def main(argv: list[str] | None = None) -> int:\n    parser = argparse.ArgumentParser(description=\"Track D 시연 시나리오 자동 점검 묶음 실행\")\n    parser.add_argument(\"--repeat\", type=int, default=3, help=\"시나리오들을 몇 번씩 돌릴지(기본 3)\")\n    parser.add_argument(\"--with-release\", action=\"store_true\",\n                        help=\"S4에서 영구 해제 후 재접속까지 확인(해제는 DB를 바꾼다)\")\n    args = parser.parse_args(argv)\n    # Windows 기본 콘솔(cp949)에 없는 글자가 섞여도 멈추지 않게 못 찍는 글자는 ?로 바꾼다(measure_* 와 같은 처리).\n    if hasattr(sys.stdout, \"reconfigure\"):\n        sys.stdout.reconfigure(errors=\"replace\")\n\n    cc.preflight()\n    prefix = cc.edge_prefix()\n    if not prefix:\n        print(\"  (!) LW_EDGE_PREFIX가 없어 대상 IP를 만들 수 없습니다. 점검을 중단합니다.\")\n        return 2\n\n    ctx = SimpleNamespace(client=cc.get_reader(), prefix=prefix, with_release=args.with_release)\n    rows: list[str] = []\n    results: list[cc.CheckResult] = []\n    repeat = max(1, args.repeat)\n\n    for round_no in range(1, repeat + 1):\n        print(f\"── 회차 {round_no}/{repeat} ──\")\n        for name, runner in CHECKS:\n            try:\n                result = runner(ctx)\n            except Exception as error:  # 한 시나리오가 터져도 나머지는 계속 돌린다.\n                result = cc.CheckResult(name, \"FAIL\", f\"점검 중 예외: {type(error).__name__}: {error}\", None)\n            _record(result, rows, results)\n\n    cc.append_rows(rows)\n\n    passed = sum(1 for r in results if r.status == \"PASS\")\n    failed = sum(1 for r in results if r.status == \"FAIL\")\n    skipped = sum(1 for r in results if r.status == \"SKIP\")\n    print(f\"── 끝: PASS {passed} · FAIL {failed} · SKIP {skipped} (표 {len(rows)}줄을 {cc.RESULTS.name}에 추가)\")\n    return 1 if failed else 0", "alias": null}, "scripts/net/run_all.py:35-43": {"path": "scripts/net/run_all.py", "start": 35, "end": 43, "lang": "python", "code": "CHECKS = [\n    (\"S4\", check_s4.run),\n    (\"S5\", check_s5.run),\n    (\"S5b\", check_s5b.run),\n    (\"S6\", check_s6.run),\n    (\"S7\", check_s7.run),\n    (\"S8\", check_s8.run),\n    (\"S9\", check_s9.run),\n]", "alias": null}, "scripts/net/check_s4.py:run": {"path": "scripts/net/check_s4.py", "start": 32, "end": 100, "lang": "python", "code": "def run(ctx) -> cc.CheckResult:\n    \"\"\"한 번 재현하고 확인한다. ctx는 run_all이 만든 (client, prefix).\"\"\"\n    client, prefix = ctx.client, ctx.prefix\n    ip = cc.choose_fresh_ip(client, prefix)\n    if ip is None:\n        return cc.CheckResult(SCENARIO, \"SKIP\", f\"점검용 IP({cc.CHECK_IP_LABEL})를 모두 썼음 — 오래된 차단·사건 정리 후 재시도\", None)\n\n    print(f\"  [{SCENARIO}] 출발지 {ip} — 정찰·웹스캔·무차별 대입(같은 IP)\")\n    # 세 단계를 순서대로 같은 IP로 보낸다. 각 컨테이너는 --rm으로 끝나며 IP를 놓으므로 다음 단계가 같은 --ip를 쓸 수 있다.\n    cc.run_oneshot(cc.SCAN, ip, prefix)\n    cc.run_oneshot(cc.WEBSCAN, ip, prefix)\n    cc.run_oneshot(cc.BRUTE, ip, prefix)\n\n    # CR-01 킬체인이 묶이고 영구 차단이 \"적용 완료\"될 때까지 기다린다. 시간이 다 되면 그 순간의 행으로\n    # 판정하되 아래 status·applied_at 조건에서 FAIL이 난다(요청만 있고 적용이 안 된 상태를 PASS로 보지 않음).\n    block = cc.wait_until(lambda: (b := cc.network_block(client, ip)) and _applied(b) and b)\n    rules = cc.latest_incident_rules(client, ip)\n    lock = cc.lockout(client, ip)\n    if block is None:\n        block = cc.network_block(client, ip) or {}\n\n    fails = []\n    if \"CR-01\" not in rules:\n        fails.append(f\"사건 matched_rules에 CR-01 없음(현재 {rules or '없음'})\")\n    if not (lock and lock.get(\"lock_type\") == \"PERMANENT\" and lock.get(\"recoverable\") == \"ADMIN_ONLY\"):\n        fails.append(f\"영구 잠금(ADMIN_ONLY) 아님(lockouts={_brief_lock(lock)})\")\n    if block.get(\"evidence\") != \"CONNECTED\":\n        fails.append(f\"network_blocks.evidence가 CONNECTED 아님(현재 {block.get('evidence') or '없음'})\")\n    if block.get(\"expires_at\") is not None:\n        fails.append(f\"network_blocks.expires_at이 영구(null) 아님(현재 {block.get('expires_at')})\")\n    if block.get(\"status\") != \"APPLIED\":\n        error = f\", last_error={block.get('last_error')}\" if block.get(\"last_error\") else \"\"\n        fails.append(f\"network_blocks.status가 APPLIED 아님(현재 {block.get('status') or '없음'}{error})\")\n    if not block.get(\"applied_at\"):\n        fails.append(\"network_blocks.applied_at 없음 — fw-agent의 적용 보고가 없음\")\n    if fails:\n        return cc.CheckResult(SCENARIO, \"FAIL\", \"; \".join(fails), ip)\n\n    # 장부가 APPLIED여도 실제 ipset·iptables가 빠져 있으면 막히지 않는다. 대상 IP와 대조 IP를 같은 방법으로\n    # 찔러 \"대상만 막히고 다른 IP는 열려 있음\"을 함께 확인한다(다른 IP까지 막히면 허용 목록·대역 설정 오류).\n    target_reachable = cc.probe_reachable(ip, prefix)\n    other_ip = cc.choose_fresh_ip(client, prefix)\n    other_reachable = cc.probe_reachable(other_ip, prefix) if other_ip else None\n    if target_reachable is not False:\n        fails.append(f\"대상 IP에서 gateway 연결이 막히지 않음(probe={_probe_text(target_reachable)})\")\n    if other_ip is None:\n        fails.append(\"대조용 정상 IP를 고르지 못함(점검 범위를 모두 씀)\")\n    elif other_reachable is not True:\n        fails.append(f\"대조 IP {other_ip}에서 gateway 연결이 안 됨(probe={_probe_text(other_reachable)})\")\n    if fails:\n        return cc.CheckResult(SCENARIO, \"FAIL\", \"; \".join(fails), ip)\n\n    if not getattr(ctx, \"with_release\", False):\n        return cc.CheckResult(SCENARIO, \"PASS\", f\"CR-01·영구 잠금·영구 L4 차단 적용·대상만 접속 차단(대조 {other_ip}) 확인\", ip)\n\n    released = subprocess.run(cc.fill(cc.RELEASE_IP, ip, prefix), cwd=cc.ROOT, capture_output=True,\n                              text=True, encoding=\"utf-8\", errors=\"replace\", timeout=120)\n    if released.returncode != 0:\n        reason = (released.stderr.strip().splitlines() or [\"원인 불명\"])[-1][:120]\n        return cc.CheckResult(SCENARIO, \"FAIL\", f\"영구 해제 스크립트 실패: {reason}\", ip)\n    removed = cc.wait_until(lambda: (b := cc.network_block(client, ip)) and b.get(\"status\") == \"REMOVED\" and b)\n    if removed is None:\n        now = cc.network_block(client, ip) or {}\n        return cc.CheckResult(SCENARIO, \"FAIL\", f\"해제 후 network_blocks.status가 REMOVED 아님(현재 {now.get('status') or '없음'})\", ip)\n    after = cc.probe_reachable(ip, prefix)\n    if after is not True:\n        return cc.CheckResult(SCENARIO, \"FAIL\", f\"해제 후에도 대상 IP에서 gateway 연결이 안 됨(probe={_probe_text(after)})\", ip)\n    return cc.CheckResult(SCENARIO, \"PASS\",\n                          f\"CR-01·영구 L4 차단 적용·대상만 접속 차단(대조 {other_ip})·해제 후 재접속 확인\", ip)", "alias": null}, "scripts/net/check_s5.py:run": {"path": "scripts/net/check_s5.py", "start": 24, "end": 52, "lang": "python", "code": "def run(ctx) -> cc.CheckResult:\n    client, prefix = ctx.client, ctx.prefix\n    ip = cc.choose_fresh_ip(client, prefix)\n    if ip is None:\n        return cc.CheckResult(SCENARIO, \"SKIP\", f\"점검용 IP({cc.CHECK_IP_LABEL})를 모두 썼음 — 오래된 차단·사건 정리 후 재시도\", None)\n\n    print(f\"  [{SCENARIO}] 출발지 {ip} — SYN 폭주\")\n    cc.run_oneshot(cc.SYNFLOOD, ip, prefix)\n\n    block = cc.wait_until(lambda: (b := cc.network_block(client, ip)) and b.get(\"status\") == \"APPLIED\" and b)\n    if block is None:\n        block = cc.network_block(client, ip) or {}\n    # NET_BLOCKED는 fw-agent가 APPLIED를 보고한 뒤 기록되므로 조금 더 기다린다.\n    blocked_events = cc.wait_until(lambda: cc.open_net_blocked(client, ip) or None, timeout=10) or []\n    lock = cc.lockout(client, ip)\n\n    fails = []\n    if block.get(\"status\") != \"APPLIED\":\n        fails.append(f\"network_blocks status가 APPLIED 아님(현재 {block.get('status') or '없음'})\")\n    if not block.get(\"expires_at\"):\n        fails.append(\"network_blocks.expires_at(TTL) 없음 — 위조 가능 증거는 TTL 차단이어야 함\")\n    if lock is not None:\n        fails.append(f\"앱 잠금(lockouts)이 생김(있으면 안 됨, lock_type={lock.get('lock_type')})\")\n    if not any(e.get(\"severity\") == \"CRITICAL\" for e in blocked_events):\n        fails.append(\"미해결 NET_BLOCKED(CRITICAL) 없음\")\n\n    if fails:\n        return cc.CheckResult(SCENARIO, \"FAIL\", \"; \".join(fails), ip)\n    return cc.CheckResult(SCENARIO, \"PASS\", \"TTL L4 차단·앱 잠금 없음·미해결 NET_BLOCKED 확인\", ip)", "alias": null}, "scripts/net/check_common.py:choose_fresh_ip": {"path": "scripts/net/check_common.py", "start": 174, "end": 201, "lang": "python", "code": "def choose_fresh_ip(client, prefix: str, start: int | None = None, end: int | None = None) -> str | None:\n    \"\"\"점검 범위에서 아직 쓰지 않은 새 출발지 IP 하나. 다 썼으면 None.\n\n    network_blocks에 한 번이라도 오른 IP, 그리고 사건이 한 번이라도 있었던 IP(닫힌 사건 포함)는 피한다.\n    차단·열린 사건이 남아 있으면 앞 실행에 막혀 같은 재현이 다시 일어나지 않고, 닫힌 사건의 IP라도 다시 쓰면\n    그 IP로 남은 옛 경고 메일·playbook_runs·NET_SCANNER_UA가 이번 판정에 섞이기 때문이다.\n    그만큼 범위가 빨리 떨어지므로, 다 쓰면 None을 돌려주고 시나리오는 SKIP한다(정리 후 재시도).\n    start·end를 주면 그 한 구간만, 안 주면 CHECK_IP_RANGES를 앞에서부터 차례로 본다.\n    \"\"\"\n    ranges = ((start, end),) if start is not None and end is not None else CHECK_IP_RANGES\n    blocked = client.table(\"network_blocks\").select(\"ip_address\").like(\"ip_address\", f\"{prefix}.%\").execute().data or []\n    used = {row[\"ip_address\"] for row in blocked}\n    incidents = (\n        client.table(\"security_incidents\")\n        .select(\"ip_address\")\n        .like(\"ip_address\", f\"{prefix}.%\")\n        .execute()\n        .data\n        or []\n    )\n    used |= {row[\"ip_address\"] for row in incidents}\n    used |= _USED_THIS_RUN\n    for range_start, range_end in ranges:\n        for last in range(range_start, range_end + 1):\n            ip = f\"{prefix}.{last}\"\n            if ip not in used:\n                return ip\n    return None", "alias": null}, "scripts/net/check_common.py:run_oneshot": {"path": "scripts/net/check_common.py", "start": 408, "end": 417, "lang": "python", "code": "def run_oneshot(template: list[str], ip: str, prefix: str, timeout: int = 180,\n                capture: bool = False) -> subprocess.CompletedProcess:\n    \"\"\"일회용 공격 컨테이너를 한 번 띄우고 끝날 때까지 기다린다.\n\n    capture=True면 컨테이너 stdout(lw.py가 내는 JSON 한 줄)을 받아 돌려준다. docker 출력은 UTF-8이라\n    encoding을 UTF-8로 고정한다(한국어 Windows에서 cp949로 읽다 깨지는 것 방지 — measure_* 와 같은 이유).\n    \"\"\"\n    cmd = fill(template, ip, prefix)\n    return subprocess.run(cmd, cwd=ROOT, capture_output=capture, text=True,\n                          encoding=\"utf-8\", errors=\"replace\", timeout=timeout)", "alias": null}, "netwatch/attacker/lw.py:command_synflood": {"path": "netwatch/attacker/lw.py", "start": 637, "end": 692, "lang": "python", "code": "def command_synflood(\n    target_host: str,\n    target_port: int,\n    target_url: str,\n    count: int,\n    runner: Callable[..., object],\n    stderr: TextIO,\n    *,\n    spoof_source: str | None = None,\n    rand_source: bool = False,\n    rotating_sender: Callable[..., int] | None = None,\n) -> tuple[dict, int]:\n    \"\"\"속도와 개수를 제한한 SYN 패킷을 전송한다.\n\n    spoof_source를 주면 hping3 -a로 그 출발지를 적어 보낸다(S7 ②③④). rand_source면 hping3 대신\n    send_rotating_syn으로 edge .200~.254 출발지를 돌려 쓴다(S7 ①, 출발지를 바꾸는 폭주).\n    \"\"\"\n    result = base_result(\"synflood\", target_url)\n\n    if rand_source:\n        sender = send_rotating_syn if rotating_sender is None else rotating_sender\n        try:\n            sent = sender(target_host, target_port, count)\n        except OSError as error:\n            stderr.write(f\"[FAIL] raw 소켓 전송 실패(NET_RAW 권한 확인): {type(error).__name__}\\n\")\n            result.update({\"error\": \"raw_socket\", \"mode\": \"rand-source\"})\n            return result, 1\n        result.update({\"ok\": True, \"sent\": sent, \"mode\": \"rand-source\",\n                       \"sources\": len(ROTATING_HOST_NUMBERS)})\n        return result, 0\n\n    command = [\n        \"hping3\",\n        \"-S\",\n        \"-p\",\n        str(target_port),\n        \"-i\",\n        \"u2000\",\n        \"-c\",\n        str(count),\n    ]\n    if spoof_source is not None:\n        command += [\"-a\", spoof_source]\n    command.append(target_host)\n    completed = run_process(command, runner, stderr)\n    exit_code = int(getattr(completed, \"returncode\", 1))\n\n    result.update(\n        {\n            \"ok\": exit_code == 0,\n            \"sent\": count,\n        }\n    )\n    if spoof_source is not None:\n        result[\"spoof_source\"] = spoof_source\n    return result, 0 if result[\"ok\"] else 1", "alias": null}, "scripts/net/check_common.py:wait_until": {"path": "scripts/net/check_common.py", "start": 150, "end": 164, "lang": "python", "code": "def wait_until(condition, timeout: float = WAIT_SECONDS, interval: float = WAIT_INTERVAL,\n               clock=time.monotonic, sleep=time.sleep):\n    \"\"\"condition()이 참 같은 값을 돌려줄 때까지 기다렸다가 그 값을 돌려준다. 시간이 다 되면 None.\n\n    센서→shipper→DB를 거쳐 몇 초 늦게 기록되는 결과(경보·차단·플레이북 실행)를 기다릴 때 쓴다.\n    시계·sleep을 바꿔 끼울 수 있게 두어, 혹시 테스트가 생겨도 실제로 기다리지 않게 한다.\n    \"\"\"\n    deadline = clock() + timeout\n    while True:\n        value = condition()\n        if value:\n            return value\n        if clock() >= deadline:\n            return None\n        sleep(interval)", "alias": null}, "scripts/net/run_all.py:_record": {"path": "scripts/net/run_all.py", "start": 85, "end": 88, "lang": "python", "code": "def _record(result: cc.CheckResult, rows: list[str], results: list[cc.CheckResult]) -> None:\n    rows.append(cc.format_row(datetime.now(timezone.utc), result))\n    results.append(result)\n    print(f\"  → {result.scenario} {result.status} {result.reason}\")", "alias": null}, "scripts/net/check_common.py:append_rows": {"path": "scripts/net/check_common.py", "start": 502, "end": 508, "lang": "python", "code": "def append_rows(lines: list[str]) -> None:\n    \"\"\"scenario-results.md 맨 아래에 결과 줄들을 덧붙인다. 파일이 없으면 머리말과 함께 만든다.\"\"\"\n    if not RESULTS.exists():\n        RESULTS.write_text(RESULTS_HEADER, encoding=\"utf-8\")\n    with RESULTS.open(\"a\", encoding=\"utf-8\") as handle:\n        for line in lines:\n            handle.write(line + \"\\n\")", "alias": null}, "scripts/net/measure_detect_to_block.py:run_once": {"path": "scripts/net/measure_detect_to_block.py", "start": 149, "end": 212, "lang": "python", "code": "def run_once(client, scenario: str, prefix: str, commands: list[list[str]], used: set[str]) -> tuple[str, dict, dict, str] | None:\n    \"\"\"한 번 재현하고 잰다. 쓸 IP가 없으면 None.\"\"\"\n    ip = mc.choose_fresh_ip(prefix, used)\n    if ip is None:\n        print(f\"  측정 범위(.{mc.MEASURE_IP_START}~.{mc.MEASURE_IP_END})의 IP를 모두 썼습니다. 오래된 차단 기록 정리 후 다시 하세요.\")\n        return None\n    used.add(ip)\n    since = (datetime.now(timezone.utc) - timedelta(seconds=SINCE_SLACK_SECONDS)).isoformat()\n    anchored = mc.needs_anchor(commands)\n    notes = []\n    t0, row, t3 = None, {}, None\n    try:\n        if anchored:\n            # S5b: 같은 IP를 두 공격이 함께 쓰도록 자리 잡기 컨테이너부터 띄운다(measure_common 주석 참고).\n            # 앞 실행이 끊겨 같은 이름이 남아 있으면 먼저 지운다. -d는 컨테이너가 시작된 뒤 돌아오므로 바로 이어 붙일 수 있다.\n            subprocess.run(mc.fill_command(mc.ANCHOR_REMOVE, ip, prefix), cwd=ROOT, capture_output=True, timeout=30)\n            anchor = subprocess.run(mc.fill_command(mc.ANCHOR_COMMAND, ip, prefix), cwd=ROOT, capture_output=True,\n                                    text=True, encoding=\"utf-8\", errors=\"replace\", timeout=60)\n            if anchor.returncode != 0:\n                # 공격을 띄우지 않고 \"못 잰 실행\"으로 남긴다. docker 오류 첫 줄만 비고에 적는다(비밀값이 나올 자리가 아님).\n                reason = (anchor.stderr.strip().splitlines() or [\"원인 불명\"])[0][:120]\n                notes.append(f\"자리 잡기 컨테이너 실패: {reason}\")\n                raise _AnchorFailed\n        print(f\"  [{scenario.upper()}] 출발지 {ip} — 공격 시작\")\n        # 시나리오의 명령을 동시에 띄운다(S5b는 SYN 폭주 + HTTP 폭주). 셸을 거치지 않는다.\n        procs = [subprocess.Popen(mc.fill_command(cmd, ip, prefix), cwd=ROOT, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL) for cmd in commands]\n\n        t0 = mc.wait_until(lambda: first_syn_flood(client, ip, since), timeout=WAIT_SECONDS)\n        row = mc.wait_until(lambda: (r := block_row(client, ip)) and r.get(\"applied_at\") and r, timeout=WAIT_SECONDS) or block_row(client, ip) or {}\n        t3 = mc.wait_until(lambda: net_blocked_at(client, ip, since), timeout=10)\n\n        for proc in procs:\n            try:\n                proc.wait(timeout=120)\n            except subprocess.TimeoutExpired:\n                proc.kill()\n            if proc.returncode not in (0, None):\n                # 공격 컨테이너가 바로 죽으면(예: 네트워크를 못 잡음) 출력이 버려져 아무도 모른다 → 비고에 남긴다\n                notes.append(f\"공격 컨테이너 종료 코드 {proc.returncode}\")\n    except _AnchorFailed:\n        pass\n    finally:\n        if anchored:\n            subprocess.run(mc.fill_command(mc.ANCHOR_REMOVE, ip, prefix), cwd=ROOT, capture_output=True, timeout=30)\n\n    # T1은 덮어써지지 않는 playbook_runs의 첫 block_l4_ttl 시각으로 잰다(measure_common.first_block_run_at 설명)\n    t1, t1_note = mc.choose_t1(mc.first_block_run_at(block_runs(client, ip)) if row else None, row.get(\"requested_at\"))\n    if t1_note:\n        notes.append(t1_note)\n    intervals = mc.compute_intervals(t0, t1, row.get(\"applied_at\"))\n    verdict = mc.judge(intervals)\n    if t0 is None:\n        notes.append(\"SYN_FLOOD 경보 없음\")\n    if not row:\n        notes.append(\"차단 요청 없음\")\n    elif not row.get(\"applied_at\"):\n        notes.append(f\"적용 안 됨({row.get('status')})\")\n    if t3 is None:\n        notes.append(\"NET_BLOCKED 기록 없음\")\n    if scenario == \"s5b\":\n        notes.append(\"CR-02 있음\" if has_cr02(client, ip) else \"CR-02 없음\")\n    note = \", \".join(notes)\n    print(f\"  → T0→T1 {intervals['t0_t1']}ms · T1→T2 {intervals['t1_t2']}ms · 전체 {intervals['t0_t2']}ms · {'통과' if verdict['all'] else '초과'} {note}\")\n    return ip, intervals, verdict, note", "alias": null}, "scripts/net/measure_detect_to_block.py:first_syn_flood": {"path": "scripts/net/measure_detect_to_block.py", "start": 79, "end": 91, "lang": "python", "code": "def first_syn_flood(client, ip: str, since_iso: str) -> str | None:\n    rows = (\n        client.table(\"network_events\")\n        .select(\"observed_at\")\n        .eq(\"src_ip\", ip)\n        .eq(\"category\", \"SYN_FLOOD\")\n        .gte(\"observed_at\", since_iso)\n        .order(\"observed_at\")\n        .limit(1)\n        .execute()\n        .data\n    )\n    return rows[0][\"observed_at\"] if rows else None", "alias": null}, "scripts/net/measure_detect_to_block.py:net_blocked_at": {"path": "scripts/net/measure_detect_to_block.py", "start": 116, "end": 128, "lang": "python", "code": "def net_blocked_at(client, ip: str, since_iso: str) -> str | None:\n    rows = (\n        client.table(\"security_events\")\n        .select(\"detected_at\")\n        .eq(\"ip_address\", ip)\n        .eq(\"event_type\", \"NET_BLOCKED\")\n        .gte(\"detected_at\", since_iso)\n        .order(\"detected_at\")\n        .limit(1)\n        .execute()\n        .data\n    )\n    return rows[0][\"detected_at\"] if rows else None", "alias": null}}, "files": {"routes/admin/status.py": {"role": "관리자 화면이 5초마다 부르는 상태 API. Track D 카드용 데이터(네트워크 이벤트·L4 차단·장비 상태)도 여기에 얹어 보낸다.", "header": "routes/admin/status.py — 관리자 대시보드 화면(/admin/dashboard)과 대시보드 폴링 API(/api/status)\n예전 routes/admin.py(798줄)를 기능 묶음별로 나눈 조각 중 하나다. Blueprint(admin_bp)는\nroutes/admin/__init__.py에서 하나만 만들고, 이 파일은 거기에 라우트를 붙이기만 한다\n— 그래서 엔드포인트 이름(url_for(\"admin.xxx\"))은 나누기 전과 똑같다.\n배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/admin/status.py"}, "db/network_events.py": {"role": "db/network_events.py — network_events 표: 센서 경보 원본 기록 (계약서 K4·K10·K11) 중복 event_id는 삽입 유니크 제약으로 처리하고 누적 수는 조건부 갱신으로 보호한다. 새 DB 함수는 이 파일에 만들고, 이름을 아래 __all__ 목록에 ", "header": "db/network_events.py — network_events 표: 센서 경보 원본 기록 (계약서 K4·K10·K11)\n중복 event_id는 삽입 유니크 제약으로 처리하고 누적 수는 조건부 갱신으로 보호한다.\n새 DB 함수는 이 파일에 만들고, 이름을 아래 __all__ 목록에 추가한다. 그러면\ndb/__init__.py가 \"from .network_events import *\"로 자동으로 다시 내보내므로, 다른 파일에서\n바로 db.함수이름(...)으로 쓸 수 있다 — 세 사람이 공용 파일(db/__init__.py)을 고치지\n않아도 되게 하려는 장치다(team-plan 01 3.2).\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고(import db 후 db.get_client()).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/network_events.py"}, "db/network_blocks.py": {"role": "db/network_blocks.py — network_blocks 표: L4 차단 요청·상태 전이 (계약서 K7·K9·K11) 담당: 역할 C. Track D 뼈대 PR(I0-1)이 빈 모듈로 만들고, C1-1~C2-1에서 함수를 채웠다. 새 DB 함수는 이 파일에 만들고, 이름을 아", "header": "db/network_blocks.py — network_blocks 표: L4 차단 요청·상태 전이 (계약서 K7·K9·K11)\n담당: 역할 C. Track D 뼈대 PR(I0-1)이 빈 모듈로 만들고, C1-1~C2-1에서 함수를 채웠다.\n새 DB 함수는 이 파일에 만들고, 이름을 아래 __all__ 목록에 추가한다. 그러면\ndb/__init__.py가 \"from .network_blocks import *\"로 자동으로 다시 내보내므로, 다른 파일에서\n바로 db.함수이름(...)으로 쓸 수 있다 — 세 사람이 공용 파일(db/__init__.py)을 고치지\n않아도 되게 하려는 장치다(team-plan 01 3.2).\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고(import db 후 db.get_client()).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/network_blocks.py"}, "web/src/components/net/L4BlockCard.tsx": {"role": "처리 작업대의 'L4 차단 목록' 카드. 차단을 걸고 푸는 버튼은 없고, 장부(network_blocks)를 읽어 보여 주는 창이다.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/web/src/components/net/L4BlockCard.tsx"}, "web/src/components/net/NetworkEventsCard.tsx": {"role": "처리 작업대의 '네트워크 이벤트' 카드. 이미 받은 /api/status 데이터에서 꺼내 쓰고 8줄씩 쪽으로 나눠 보여 준다.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/web/src/components/net/NetworkEventsCard.tsx"}, "web/src/components/net/AgentStatusBadges.tsx": {"role": "fw-agent·shipper 상태 배지. 정지 판단은 서버가 해 준 값을 그대로 쓴다.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/web/src/components/net/AgentStatusBadges.tsx"}, "db/stats.py": {"role": "차트용 집계. 네트워크 경보를 종류·계층별로 센 값(network_layer)을 만든다.", "header": "db/stats.py — 관제 대시보드(차트·히트맵·흐름도)용 집계\n관리자 대시보드의 화면 A(위협 현황)·B(공격 상세)가 쓰는 숫자를 한 번에 계산한다.\n표에서 원본 줄을 가져와 파이썬에서 묶는다 — 이 프로젝트의 로그는 하루 수천 줄 규모라\n별도 집계 쿼리·뷰를 DB에 새로 만들 필요가 없고, 새 마이그레이션 없이 배포할 수 있다.\n구조는 둘로 나눴다.\nfetch_raw()           — Supabase에서 원본 줄을 가져온다(여러 쿼리를 동시에).\nbuild_threat_stats()  — 가져온 줄로 화면용 숫자를 계산한다. DB 없이 테스트할 수 있는 순수 함수.\n시각은 전부 한국 시간(KST, UTC+9)으로 묶는다 — 관제 화면의 \"오늘\"은 한국 날짜 기준이고,\n일별 요약표(log_daily_summary)도 같은 기준으로 만들어진다. 한국은 서머타임이 없어 고정 오프셋이다.\nL3/L4(네트워크·전송 계층) 경보는 Track D 센서(로컬 Docker)가 network_events에 쌓는다(C2-3).\nnetwork_layer는 최근 RECENT_DAYS일을 category·layer로 센 값이고, 센서가 없는 환경(Vercel 등)에서는\n빈 목록이 되어 화면이 \"데이터 없음\" 상태로 그린다. 세 PC가 같은 DB를 쓰므로 공용 합계다(계약서 K10).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/stats.py"}, "scripts/net/run_all.py": {"role": "S4~S8 시나리오를 순서대로 N번 돌리고 PASS/FAIL/SKIP을 결과 표에 덧붙이는 묶음 실행기.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/net/run_all.py"}, "scripts/net/check_s4.py": {"role": "S4 점검: 정찰 → 웹 스캔 → 무차별 대입이 킬체인(CR-01)으로 묶여 영구 차단이 실제 적용되는지 확인한다.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/net/check_s4.py"}, "scripts/net/check_s5.py": {"role": "S5 점검: SYN 폭주가 앱 잠금 없이 시간 제한 L4 차단으로만 이어지는지 확인한다.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/net/check_s5.py"}, "scripts/net/check_common.py": {"role": "시나리오 점검들이 같이 쓰는 도구: 새 출발지 IP 고르기, 일회용 공격 컨테이너 실행, DB에서 결과 읽기, 기다리기.", "header": "scripts/net/check_common.py — 시연 시나리오 자동 점검(C3-1)이 쓰는 공용 부품\n각 시나리오(check_s4·s5·s5b·s6·s7·s8·s9)와 run_all이 함께 쓰는 조각을 모았다:\n- 시작 전 확인 출력(preflight)\n- 읽기 전용 DB 조회(db.get_client()로 select만 — 이 스크립트는 DB에 쓰지 않는다)\n- 기다리기(wait_until, 최대 30초·1초 간격)\n- 실행마다 새 출발지 IP 고르기(choose_fresh_ip)\n- 재현 명령 상수(netwatch/README.md 7.3의 \"일회용 새 IP 실행\" 형식을 그대로 옮긴 것)\n- Mailpit 조회, 결과 표 한 줄 만들기\n이 파일은 직접 실행하지 않는다(부품 모음). 실행 방법은 run_all.py·check_s*.py의 docstring 참고.\nscripts/net/measure_* 는 통합 담당자(I2-2) 것이라 읽지도 고치지도 않는다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/net/check_common.py"}, "netwatch/attacker/lw.py": {"role": "공격 상자의 명령 모음. 대상은 gateway 하나로 고정되고 횟수·속도에 상한이 있어 바깥 주소로는 쏠 수 없다.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/netwatch/attacker/lw.py"}, "scripts/net/measure_detect_to_block.py": {"role": "탐지에서 L4 차단까지 걸린 시간을 DB에 남은 시각끼리 빼서 재는 도구.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/net/measure_detect_to_block.py"}}}</script>
<script>
(function(){

  }

  function nodeById(id){ return scen().nodes.filter(function(n){ return n.id === id; })[0]; }

  /* ---------- 간단 문법 강조 ---------- */
  var PY = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?''')|([rbfRBF]{0,2}"(?:\\.|[^"\\\n])*"|[rbfRBF]{0,2}'(?:\\.|[^'\\\n])*')|\b(def|class|return|if|elif|else|for|while|import|from|as|try|except|finally|with|in|not|and|or|is|None|True|False|raise|pass|lambda|yield|global|nonlocal|assert|del|continue|break)\b|(@[A-Za-z_][\w.]*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(?=\()/g;
  var PYC = [null,"t-c","t-d","t-s","t-k","t-a","t-n","t-f"];

  /* ---------- 흐름도 ---------- */

  function buildNode(n){

      onclick:function(e){ if (e.target.closest(".chip")) return; selectNode(n.id, 0); },

    n.items.forEach(function(it, i){

  function rectIn(elm, host){
    var a = elm.getBoundingClientRect(), h = host.getBoundingClientRect();

  var raf = 0;

  function drawEdges(){
    var stage = $("stage"), svg = $("edges"), sc = scen();
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){ p.remove(); });
    Array.prototype.slice.call(stage.querySelectorAll(".elabel")).forEach(function(p){ p.remove(); });
    var svgNS = "http://www.w3.org/2000/svg";
    sc.edges.forEach(function(e){
      var a = nodeById(e.from), b = nodeById(e.to);
      var ea = nodeEls[e.from], eb = nodeEls[e.to]; if (!ea || !eb) return;
      var ra = rectIn(ea, stage), rb = rectIn(eb, stage), d, lx, ly;
      if (a.col === b.col){
        if (b.row - a.row <= 1){
          d = "M" + ra.cx + " " + ra.b + " V" + rb.t; lx = ra.cx; ly = (ra.b + rb.t) / 2;
        } else {
          var x = Math.min(ra.l, rb.l) - 30;
          d = "M" + ra.l + " " + ra.cy + " H" + x + " V" + rb.cy + " H" + rb.l; lx = x; ly = (ra.cy + rb.cy) / 2;

        stage.appendChild(lab);
      }
    });
    svg.setAttribute("width", stage.scrollWidth); svg.setAttribute("height", stage.scrollHeight);
    refreshSelection();
  }

  function refreshSelection(){

  /* ---------- 코드 패널 너비: 자동 기본값 + 드래그/키보드 조절 + 기억 ---------- */
  var MIN_PANEL = 360, MIN_MAIN = 420, SPLIT_KEY = "lw-panel-w";

  function clampPanel(w){ return Math.round(Math.min(maxPanel(), Math.max(MIN_PANEL, w))); }
  // 흐름도가 실제로 차지하는 너비(가장 넓은 탭 기준)를 빼고 남는 공간을 패널에 준다
  function autoPanelWidth(){
    var most = 1;
    D.scenarios.forEach(function(sc){ var u = {}; sc.nodes.forEach(function(n){ u[n.col] = 1; }); most = Math.max(most, Object.keys(u).length); });
    var natural = most * 196 + (most - 1) * 46 + 44 + 24;

    if (persist){ userSet = true; savePref(SPLIT_KEY, String(w)); }

  }

  setPanelW(userSet ? savedW : autoPanelWidth(), false);
  window.addEventListener("resize", function(){ setPanelW(userSet ? currentW() : autoPanelWidth(), false); });
  splitter.addEventListener("pointerdown", function(e){
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault(); splitter.setPointerCapture(e.pointerId); document.body.classList.add("dragging");
    function move(ev){ setPanelW(window.innerWidth - ev.clientX, false); }
    function up(ev){

  splitter.addEventListener("keydown", function(e){
    var step = (e.shiftKey ? 72 : 24);
    if (e.key === "ArrowLeft"){ e.preventDefault(); setPanelW(currentW() + step, true); }
    else if (e.key === "ArrowRight"){ e.preventDefault(); setPanelW(currentW() - step, true); }
    else if (e.key === "Home"){ e.preventDefault(); setPanelW(MIN_PANEL, true); }
    else if (e.key === "End"){ e.preventDefault(); setPanelW(maxPanel(), true); }
  });
  splitter.addEventListener("dblclick", function(){ userSet = false; savePref(SPLIT_KEY, null); setPanelW(autoPanelWidth(), false); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleEdges);

  var startId = (location.hash || "").replace("#", "");
  var startIdx = 0; D.scenarios.forEach(function(s, i){ if (s.id === startId) startIdx = i; });
  switchScenario(startIdx);
  // 화면 확인/테스트용 지름길: window.__flow.select("s7")
  window.__flow = { select: function(id, i){ selectNode(id, i || 0); }, file: selectFile, state: state };
})();
</script>
