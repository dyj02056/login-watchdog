<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12. 관리자 대시보드 — 코드 흐름도</title>
<style>
  :root{
    --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eaefe9; --ink:#12201c; --ink-muted:#5a6b63;
    --border:#d9e0da; --accent:#0f6f66; --accent-soft:#e2ede9; --danger:#bf3b2b; --danger-soft:#f8e6e2;
    --edge:#7b8a82; --edge-call:#8a97a0;
    --k-screen:#767f78; --k-screen-soft:#eef0ee;
    --k-route:#2f5fd6;  --k-route-soft:#e7edfb;
    --k-helper:#b56b0c; --k-helper-soft:#f7ecd9;
    --k-db:#7a4fce;     --k-db-soft:#efe8fa;
    --k-config:#0f6f66; --k-config-soft:#e2ede9;
    --k-later:#9aa39d;  --k-later-soft:#f4f6f3;
    --code-bg:#fbfcfb; --code-hl:#fff3c4; --code-hl-bar:#e0a800; --code-gutter:#8a978f;
    --c-comment:#6b7d73; --c-str:#a1470f; --c-kw:#7a3fc0; --c-fn:#1f5fd0; --c-num:#0b7a6c; --c-deco:#b0306e;
    --shadow:0 1px 2px rgba(18,32,28,.06), 0 6px 20px rgba(18,32,28,.07);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
      --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
      --edge:#6f8178; --edge-call:#5d6f67;
      --k-screen:#9aa39d; --k-screen-soft:#1a221e;
      --k-route:#7fa2f2;  --k-route-soft:#182236;
      --k-helper:#e8a94c; --k-helper-soft:#31260f;
      --k-db:#b49bee;     --k-db-soft:#241c34;
      --k-config:#4fc9b8; --k-config-soft:#17332d;
      --k-later:#6b7a72;  --k-later-soft:#111a16;
      --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
      --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
    --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
    --edge:#6f8178; --edge-call:#5d6f67;
    --k-screen:#9aa39d; --k-screen-soft:#1a221e;
    --k-route:#7fa2f2;  --k-route-soft:#182236;
    --k-helper:#e8a94c; --k-helper-soft:#31260f;
    --k-db:#b49bee;     --k-db-soft:#241c34;
    --k-config:#4fc9b8; --k-config-soft:#17332d;
    --k-later:#6b7a72;  --k-later-soft:#111a16;
    --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
    --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
  button{font:inherit;color:inherit;cursor:pointer}
  code,.mono{font-family:var(--mono)}

  .app{display:flex;height:100vh;min-height:0}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{padding:14px 20px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
  .top h1{margin:0;font-size:19px;letter-spacing:-.01em}
  .top .sub{margin:2px 0 0;color:var(--ink-muted);font-size:13px}
  .top-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
  .tabs{display:flex;gap:6px}
  .tab{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:5px 14px;font-weight:600}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .tab[aria-selected="true"]{color:#06201b}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#06201b}}
  .spacer{flex:1}
  .btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:default}
  .stepper{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-muted)}
  .stepper b{color:var(--ink);min-width:42px;text-align:center}
  a.link{color:var(--accent);text-decoration:none;font-size:13px}
  a.link:hover{text-decoration:underline}

  .intro{margin:0;padding:10px 20px;color:var(--ink-muted);font-size:13px;border-bottom:1px solid var(--border);background:var(--surface-2)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 20px;font-size:12px;color:var(--ink-muted);border-bottom:1px solid var(--border)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .stage-wrap{flex:1;min-height:0;overflow:auto}
  .stage{position:relative;display:grid;gap:26px 46px;padding:22px 22px 60px;width:max-content;min-width:100%}
  .edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .edges path{fill:none;stroke:var(--edge);stroke-width:1.6}
  .edges path.call{stroke:var(--edge-call);stroke-dasharray:5 4}
  .edges path.active{stroke:var(--accent);stroke-width:2.4;stroke-dasharray:none}
  .edges .head{fill:var(--edge)}
  .edges .head-call{fill:var(--edge-call)}
  .elabel{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;
    background:var(--surface);border:1px solid var(--border);color:var(--ink-muted);white-space:nowrap;pointer-events:none}

  .colhead{font-size:12px;font-weight:700;color:var(--ink-muted);text-transform:none;border-bottom:2px solid var(--border);padding-bottom:6px;align-self:end}
  .cell{display:flex;flex-direction:column;gap:12px;align-self:center;justify-content:center;position:relative;z-index:1}

  .node{--k:var(--k-route);--ks:var(--k-route-soft);position:relative;background:var(--surface);border:1px solid var(--border);
    border-left:5px solid var(--k);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .08s, border-color .12s}
  .node:hover{transform:translateY(-1px);border-color:var(--k)}
  .node:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .node[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
  .node.screen{--k:var(--k-screen);--ks:var(--k-screen-soft)}
  .node.route{--k:var(--k-route);--ks:var(--k-route-soft)}
  .node.helper{--k:var(--k-helper);--ks:var(--k-helper-soft)}
  .node.db{--k:var(--k-db);--ks:var(--k-db-soft)}
  .node.config{--k:var(--k-config);--ks:var(--k-config-soft)}
  .node.later{--k:var(--k-later);--ks:var(--k-later-soft);background:var(--k-later-soft);box-shadow:none;border-style:dashed;border-left-style:solid;padding:8px 10px}
  .n-title{font-weight:700;font-size:13.5px;letter-spacing:-.01em}
  .n-plain{margin-top:3px;color:var(--ink-muted);font-size:12.5px}
  .n-reject{margin-top:6px;font-size:12px;color:var(--danger);background:var(--danger-soft);border-radius:6px;padding:3px 8px}
  .n-reject::before{content:"막히면 → ";font-weight:700}
  .n-items{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .n-item{display:flex;flex-direction:column;gap:3px}
  .n-call{overflow-wrap:anywhere;font-family:var(--mono);font-size:11.5px;color:var(--k);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{max-width:100%;text-align:left;overflow-wrap:anywhere;border:1px solid var(--border);background:var(--ks);color:var(--ink);border-radius:6px;padding:1px 7px;font-family:var(--mono);font-size:11px}
  .chip:hover{border-color:var(--k);color:var(--k)}
  .chip.file::before{content:"📄 "}
  .chip.fn::before{content:"ƒ ";color:var(--k);font-weight:700}
  .chip.snip::before{content:"▤ ";color:var(--k);font-weight:700}
  .tag-later{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--ink-muted);border:1px solid var(--border);border-radius:999px;padding:0 7px;background:var(--surface)}

  /* 코드 패널 */
  .panel{width:440px;flex:none;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
  .p-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
  .p-head h2{margin:0;font-size:15.5px;letter-spacing:-.01em}
  .p-head p{margin:4px 0 0;color:var(--ink-muted);font-size:13px}
  .p-close{display:none}
  .p-body{flex:1;min-height:0;overflow:auto;padding:12px 16px 24px}
  .hint{color:var(--ink-muted);font-size:13px}
  .hint li{margin:4px 0}
  .itabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .itab{border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:2px 9px;font-family:var(--mono);font-size:12px}
  .itab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .fileline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
  .fileline .path{font-family:var(--mono);font-size:12.5px;font-weight:700}
  .fileline .lines{font-family:var(--mono);font-size:12px;color:var(--ink-muted)}
  .alias{border:1px solid var(--border);background:var(--k-db-soft);border-radius:8px;padding:8px 10px;margin:0 0 10px;font-size:12.5px}
  .alias .route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px;font-family:var(--mono);font-size:12px}
  .alias .route span.step{padding:1px 7px;border-radius:6px;border:1px solid var(--border);background:var(--surface)}
  .alias .route span.real{border-color:var(--k-db);color:var(--k-db);font-weight:700}
  .alias .arrow{color:var(--ink-muted)}
  .codebox{border:1px solid var(--border);border-radius:8px;background:var(--code-bg);overflow:auto;max-height:62vh}
  table.code{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.2px;line-height:1.6}
  table.code td{padding:0 10px;vertical-align:top;white-space:pre}
  table.code td.ln{position:sticky;left:0;text-align:right;color:var(--code-gutter);user-select:none;background:var(--code-bg);border-right:1px solid var(--border);min-width:44px;padding-right:8px}
  table.code tr.hl td{background:var(--code-hl)}
  table.code tr.hl td.ln{background:var(--code-hl);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--code-hl-bar)}
  .t-c{color:var(--c-comment);font-style:italic}.t-d{color:var(--c-comment)}.t-s{color:var(--c-str)}.t-k{color:var(--c-kw);font-weight:600}
  .t-f{color:var(--c-fn)}.t-n{color:var(--c-num)}.t-a{color:var(--c-deco)}
  .legend-hl{margin:8px 0 0;font-size:12px;color:var(--ink-muted)}
  .legend-hl b{background:var(--code-hl);color:var(--ink);padding:0 6px;border-radius:4px}
  .flist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
  .flist button{width:100%;text-align:left;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:6px 10px}
  .flist button:hover{border-color:var(--accent)}
  .flist small{display:block;color:var(--ink-muted)}
  details.hdr{margin-top:12px;font-size:13px}
  details.hdr pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px;font-family:var(--sans);font-size:12.5px;color:var(--ink-muted)}

  @media (max-width:900px){
    .app{display:block;height:auto}
    .stage-wrap{max-height:none;overflow-x:auto}
    .panel{position:fixed;left:0;right:0;bottom:0;width:auto;height:62vh;border-left:0;border-top:2px solid var(--accent);
      box-shadow:0 -10px 30px rgba(0,0,0,.25);z-index:20;transform:translateY(105%);transition:transform .18s}
    body.open .panel{transform:none}
    .p-close{display:inline-block;position:absolute;right:12px;top:10px}
    .p-head{position:relative;padding-right:70px}
    .top{padding:12px 16px 8px}
    .stage{padding:16px 16px 70vh}
  }
  @media (prefers-reduced-motion: reduce){.node,.panel{transition:none}}
</style>
</head>

    <header class="top">

    <div class="legend" aria-label="범례">

  <aside class="panel" id="panel" aria-live="polite">

지 않고 config.py 한 곳에서 관리한다(다른\n    상수들과 동일한 원칙 — 값을 바꾸려고 여러 파일을 찾아다닐 필요가 없게 함).\n    \"\"\"\n    return render_template(\"admin_dashboard.html\", poll_interval_ms=config.ADMIN_DASHBOARD_POLL_MS)", "alias": null}, "config.py:51-74": {"path": "config.py", "start": 51, "end": 74, "lang": "python", "code": "ADMIN_PAGE_SIZE = int(os.environ.get(\"ADMIN_PAGE_SIZE\", 10))\n\n# 게시글/댓글 작성 빈도 제한 — SIGNUP_RATE_LIMIT과 동일한 개념(성공/실패 무관,\n# DETECTION_WINDOW_SECONDS 안에 이 횟수 이상이면 거부). 댓글은 글보다 자주\n# 작성되는 게 자연스러워 기본값을 더 넉넉하게 잡았다 (결정 #7).\nPOST_RATE_LIMIT = int(os.environ.get(\"POST_RATE_LIMIT\", 5))\nCOMMENT_RATE_LIMIT = int(os.environ.get(\"COMMENT_RATE_LIMIT\", 10))\n\n# 클라이언트(브라우저)가 서버 상태를 다시 확인하는 폴링 주기(밀리초). 보안 경계가\n# 아니라 UX 튜닝값이다 — 이 숫자를 안다고 해서 할 수 있는 게 늘어나지 않는다\n# (실제 남용 방지는 위 *_RATE_LIMIT과 로그인 데코레이터가 서버 쪽에서 담당).\n# 그동안 board.js/dashboard.js 각 파일에 숫자로 흩어져 있던 걸 다른 상수들처럼\n# 한 곳에 모았다.\nBOARD_COMMENT_POLL_MS = int(os.environ.get(\"BOARD_COMMENT_POLL_MS\", 5000))\nADMIN_DASHBOARD_POLL_MS = int(os.environ.get(\"ADMIN_DASHBOARD_POLL_MS\", 5000))\n# 대시보드 상태 조회(/api/status)가 \"만료된 잠금 정리\"를 다시 하기까지의 최소 간격(초, guide46).\n# 매 갱신마다 정리하면 DB 왕복 한 단계가 늘 더해진다. 실제 차단 해제는 /login 요청마다 따로\n# 정리하므로 영향이 없고, 대시보드에 만료된 잠금이 이 시간만큼 더 보일 수 있을 뿐이다. 0이면 매번.\nADMIN_STATUS_RELEASE_INTERVAL_SECONDS = int(os.environ.get(\"ADMIN_STATUS_RELEASE_INTERVAL_SECONDS\", 15))\n\n# 관리자 화면 탭을 여러 개 열어 두면 탭마다 5초(처리 작업대)·15~30초(관제 보드)마다 같은 조회를 따로 보내\n# DB 조회가 탭 수만큼 곱해진다(처리 작업대 한 번에 약 21번, 관제 보드 한 번에 약 12번). 같은 내용을\n# 이 시간(초) 안에는 한 번만 조회해서 모든 탭이 나눠 쓴다. 0이면 캐시를 끈다.\nADMIN_STATUS_CACHE_SECONDS = float(os.environ.get(\"ADMIN_STATUS_CACHE_SECONDS\", 3))", "alias": null}, "helpers/auth.py:login_required": {"path": "helpers/auth.py", "start": 103, "end": 123, "lang": "python", "code": "def login_required(view):\n    \"\"\"\"관리자 로그인이 되어 있어야만 들어올 수 있는 방\"을 만들어주는 장치(데코레이터).\n\n    데코레이터란? 함수(방) 앞에 \"문지기\"를 하나 세워두는 것과 같다.\n    `@login_required`를 어떤 라우트 함수 위에 붙이면, 그 라우트가 실제로\n    실행되기 전에 이 문지기 코드가 먼저 실행되어 \"세션이 지금도 유효한 관리자\n    계정을 가리키는지\"부터 확인한다(_load_current_admin, guide37).\n\n    - 유효하지 않으면 _reject_admin_request()가 응답한다:\n        - 주소가 /api/로 시작하는 경우(JS가 fetch로 부르는 API) → 401(인증 필요) JSON 응답\n          (세션이 아예 없을 때만 unauthorized_attempts에 기록하고, 반복되면 Unauthorized\n          Access 의심 알림을 보낸다 — 21단계, attack_response_state.md 구현 대상 #2)\n        - 그 외(사람이 브라우저로 직접 들어온 화면) → 관리자 로그인 페이지로 강제 이동\n    - 유효하면: g.admin에 계정 정보를 담고 원래 요청했던 라우트 함수를 그대로 실행\n    \"\"\"\n    @wraps(view)  # 문지기를 씌워도 원래 함수의 이름 등 정보가 유지되게 해주는 파이썬 관례\n    def wrapped_view(*args, **kwargs):\n        if _load_current_admin() is None:\n            return _reject_admin_request()\n        return view(*args, **kwargs)\n    return wrapped_view", "alias": null}, "helpers/auth.py:_load_current_admin": {"path": "helpers/auth.py", "start": 45, "end": 66, "lang": "python", "code": "def _load_current_admin() -> dict | None:\n    \"\"\"세션이 아직 유효한 관리자 계정을 가리키면 그 계정({\"id\", \"username\", \"role\"})을\n    g.admin에 담아 돌려주고, 아니면 None을 돌려준다.\n\n    무효로 보는 경우: 세션 값 일부가 없음(이 기능 이전에 만들어진 세션 포함) /\n    로그인한 지 ADMIN_SESSION_MAX_HOURS가 지남 / DB에 그 id가 없음(삭제됨) /\n    id는 있는데 username이 다름. 수명은 \"마지막 활동\"이 아니라 \"로그인 시각\" 기준이다 —\n    대시보드가 5초마다 폴링하므로 활동이 없는 상태가 생기지 않기 때문이다.\n    \"\"\"\n    admin_id = session.get(\"admin_id\")\n    username = session.get(\"admin_username\")\n    login_at = session.get(\"admin_login_at\")\n    if admin_id is None or username is None or login_at is None:\n        return None\n    if time.time() - login_at > config.ADMIN_SESSION_MAX_HOURS * 3600:\n        return None\n\n    admin = db.get_admin_by_id(admin_id)\n    if admin is None or admin[\"username\"] != username:\n        return None\n    g.admin = admin\n    return admin", "alias": null}, "routes/admin/status.py:api_status": {"path": "routes/admin/status.py", "start": 206, "end": 371, "lang": "python", "code": "@admin_bp.route(\"/api/status\", methods=[\"GET\"])\n@login_required\ndef api_status():\n    \"\"\"대시보드가 5초마다 호출하는 API(탭이 보일 때만, guide45). 최신 상태를 JSON으로 돌려준다.\n\n    JSON이란? 파이썬의 딕셔너리(dict)와 거의 똑같이 생긴, 서버와 브라우저가\n    데이터를 주고받을 때 가장 널리 쓰이는 표준 형식이다. jsonify()는 파이썬\n    딕셔너리를 이 JSON 형식으로 자동 변환해서 브라우저에 보내주는 Flask 도구다.\n\n    관리자 대시보드의 페이지가 있는 표 8개(최근 로그인 시도/회원/게시글/댓글/관리자\n    로그인 기록/보안 이벤트/연관 사건/AI 조기 경보 — _PAGED_SECTIONS)는 각자\n    ?attempts_page=, ?users_page=, ?posts_page=, ?comments_page=, ?admin_log_page=,\n    ?security_events_page=, ?security_incidents_page=, ?access_requests_page=로\n    현재 보고 있는 페이지 번호를 받는다 —\n    dashboard/api.js가 board_list()와 동일한 페이지 번호 방식으로 표를 그릴 수 있도록,\n    각 표의 이번 페이지 데이터와 전체 페이지 수(*_total_pages)를 함께 내려준다\n    (예전에는 최근 N개만 고정으로 가져와서, 그 이상 쌓이면 오래된 항목이 화면에서\n    아예 사라졌었다).\n\n    db.list_*() 함수들은 (이번 페이지 데이터, 전체 개수) 튜플을 돌려준다 — 목록\n    조회와 개수 조회를 별도 쿼리 두 번으로 나누지 않고 한 번의 왕복으로 끝내기\n    위해서다(db.list_recent_attempts() 설명 참고).\n\n    그래도 여전히 서로 무관한 쿼리들(처음엔 9개, 지금은 표·카드·권한 조회까지 17개)을\n    하나씩 순서대로 기다리면, Supabase까지의 왕복 시간(쿼리 하나당 대략 150~500ms)이\n    그대로 다 더해진다 — 쿼리가 9개였던 시절에도 요청 하나가 2~3초까지 걸렸고, 특히\n    Vercel 서버리스 환경은 매 요청마다 커넥션을 새로 맺어야 해서 체감이 더 심했다.\n    ThreadPoolExecutor로 이 쿼리들을 동시에 보내면\n    전체 소요 시간이 \"가장 느린 쿼리 하나\" 수준으로 줄어든다(실측 약 5배 개선).\n    IP 위치 조회(_attach_locations)는 attempts 결과가 있어야 시작할 수 있는\n    후속 작업이라 별도로 남겨뒀지만, 나머지 futures가 백그라운드에서 계속\n    돌고 있는 동안 같이 실행되므로 추가 대기 시간은 거의 없다.\n\n    응답 속도(guide46):\n    - ?only=<표 이름>이면 그 표 하나만 돌려준다(_api_status_section) — 페이지 넘기기용.\n    - 만료된 잠금 정리는 정해진 간격마다만 한다(_release_expired_locks_if_due).\n    - 아래 조회는 전부 한 번에(동시 처리 한도 = 조회 개수) 보낸다. \"관리자 계정 관리\" 카드의\n      권한 확인과 목록도 같은 배치에 넣고, 권한이 없으면 목록은 버린다(응답에 싣지 않는다).\n    \"\"\"\n    only = request.args.get(\"only\")\n    if only is not None:\n        return _api_status_section(only)\n\n    ttl = config.ADMIN_STATUS_CACHE_SECONDS\n    cache_key = (g.admin[\"role\"], request.query_string)\n    if ttl > 0:\n        with _status_cache_lock:\n            hit = _status_cache.get(cache_key)\n        if hit and time.monotonic() - hit[0] < ttl:\n            return jsonify(hit[1])\n\n    _release_expired_locks_if_due()\n\n    attempts_page = _page_param(\"attempts_page\")\n    users_page = _page_param(\"users_page\")\n    posts_page = _page_param(\"posts_page\")\n    comments_page = _page_param(\"comments_page\")\n    admin_log_page = _page_param(\"admin_log_page\")\n    security_events_page = _page_param(\"security_events_page\")\n    security_incidents_page = _page_param(\"security_incidents_page\")\n    access_requests_page = _page_param(\"access_requests_page\")\n    # login_required가 세션을 확인하면서 계정(role 포함)을 이미 조회해 g.admin에 담아뒀다(guide37).\n    # 아래 스레드에서는 g를 쓸 수 없으므로 여기서 먼저 꺼내둔다.\n    role = g.admin[\"role\"]\n\n    with ThreadPoolExecutor(max_workers=17) as executor:\n        attempts_future = executor.submit(db.list_recent_attempts, attempts_page, config.ADMIN_PAGE_SIZE)\n        lockouts_future = executor.submit(db.list_active_lockouts)\n        # \"현재 잠긴 IP / 계정\" 카드의 계정 잠금 목록 — IP 잠금 목록과 같은 배치로 병렬 조회.\n        account_lockouts_future = executor.submit(db.list_active_account_lockouts)\n        admin_account_lockouts_future = executor.submit(db.list_active_admin_account_lockouts)\n        admin_log_future = executor.submit(db.list_admin_login_log, admin_log_page, config.ADMIN_PAGE_SIZE)\n        users_future = executor.submit(db.list_users, users_page, config.ADMIN_PAGE_SIZE)\n        signup_future = executor.submit(db.get_signup_enabled)\n        posts_future = executor.submit(db.list_posts, posts_page, config.ADMIN_PAGE_SIZE)\n        comments_future = executor.submit(db.list_comments_admin, comments_page, config.ADMIN_PAGE_SIZE)\n        security_events_future = executor.submit(\n            db.list_security_events, security_events_page, config.ADMIN_PAGE_SIZE\n        )\n        # 연관 사건(SIEM 상관분석, Track C guide27) 표 — 위 보안 이벤트와 같은\n        # 페이지네이션 방식이다.\n        security_incidents_future = executor.submit(\n            db.list_security_incidents, security_incidents_page, config.ADMIN_PAGE_SIZE\n        )\n        # \"AI 조기 경보\" 표(Track A, guide31) — 위 표들과 같은 페이지네이션 방식이다.\n        access_requests_future = executor.submit(\n            db.list_pending_requests, access_requests_page, config.ADMIN_PAGE_SIZE\n        )\n        # 영구 잠금 + 이메일 복구(guide33/34-a) 카드용 데이터와, 화면이 어떤 버튼을 보여줄지\n        # 정하는 데 쓰는 \"현재 관리자의 권한 목록\" — 위 쿼리들과 같은 배치로 병렬 조회한다.\n        recovery_future = executor.submit(db.list_recent_recovery_requests, 20)\n        exemptions_future = executor.submit(db.list_active_ip_exemptions, 20)\n        permissions_future = executor.submit(db.list_role_permissions, role)\n        # \"관리자 계정 관리\" 카드 — 권한 확인과 목록을 같은 배치로 미리 보낸다(권한이 없으면 목록은 버림).\n        can_manage_admins_future = executor.submit(db.has_permission, role, \"manage_admin_users\")\n        admin_users_future = executor.submit(db.list_admin_users)\n\n        attempts, attempts_count = attempts_future.result()\n        recent_attempts = _attach_locations(attempts)  # 다른 future들이 도는 동안 함께 실행됨\n        active_lockouts = lockouts_future.result()\n        active_account_lockouts = account_lockouts_future.result()\n        active_admin_account_lockouts = admin_account_lockouts_future.result()\n        admin_log, admin_log_count = admin_log_future.result()\n        users, users_count = users_future.result()\n        signup_enabled = signup_future.result()\n        posts, posts_count = posts_future.result()\n        comments, comments_count = comments_future.result()\n        security_events, security_events_count = security_events_future.result()\n        security_incidents, security_incidents_count = security_incidents_future.result()\n        access_requests, access_requests_count = access_requests_future.result()\n        recovery_requests = recovery_future.result()\n        ip_exemptions = exemptions_future.result()\n        permissions = permissions_future.result()\n        can_manage_admins = can_manage_admins_future.result()\n        # 권한이 없으면 결과를 꺼내지 않는다 — 실패했더라도 그 관리자의 화면과는 무관하다.\n        admin_users = admin_users_future.result() if can_manage_admins else None\n\n    response_data = {\n            \"recent_attempts\": recent_attempts,\n            \"attempts_total_pages\": max(1, math.ceil(attempts_count / config.ADMIN_PAGE_SIZE)),\n            \"active_lockouts\": active_lockouts,\n            \"active_account_lockouts\": active_account_lockouts,\n            # 관리자 계정 단위 잠금(guide38) — 회원 계정 잠금과 같은 카드에 \"관리자\" 배지로 표시한다.\n            \"active_admin_account_lockouts\": active_admin_account_lockouts,\n            \"admin_login_log\": admin_log,\n            \"admin_log_total_pages\": max(1, math.ceil(admin_log_count / config.ADMIN_PAGE_SIZE)),\n            \"users\": users,\n            \"users_total_pages\": max(1, math.ceil(users_count / config.ADMIN_PAGE_SIZE)),\n            \"signup_enabled\": signup_enabled,\n            # 게시판 관리 섹션(관리자 대시보드)용 — recent_attempts 등과 같은 폴링\n            # 주기(dashboard/main.js, 5초)로 함께 갱신된다.\n            \"recent_posts\": posts,\n            \"posts_total_pages\": max(1, math.ceil(posts_count / config.ADMIN_PAGE_SIZE)),\n            \"recent_comments\": comments,\n            \"comments_total_pages\": max(1, math.ceil(comments_count / config.ADMIN_PAGE_SIZE)),\n            # 보안 이벤트(위험등급 통합) 섹션 — security-risk-response-summary.md 5절.\n            \"security_events\": security_events,\n            \"security_events_total_pages\": max(1, math.ceil(security_events_count / config.ADMIN_PAGE_SIZE)),\n            # 연관 사건(SIEM 상관분석) 섹션 — Track C guide27.\n            \"security_incidents\": security_incidents,\n            \"security_incidents_total_pages\": max(1, math.ceil(security_incidents_count / config.ADMIN_PAGE_SIZE)),\n            # AI 조기 경보(Track A guide31) 섹션 — 임계값을 아직 안 넘긴 코앞\n            # 구간에서 LLM이 위험하다고 판단해 등록한 PENDING 요청과, SIEM HIGH 사건의\n            # 영구 잠금 후보(guide33, security/lockdown.py)를 보여준다.\n            \"access_requests\": access_requests,\n            \"access_requests_total_pages\": max(1, math.ceil(access_requests_count / config.ADMIN_PAGE_SIZE)),\n            # 영구 잠금 + 이메일 복구(guide33/34-a): 영구 잠금 카드·복구 요청 카드·IP 예외\n            # 카드와, 현재 관리자가 가진 권한(버튼 노출용 — 실제 검사는 서버가 따로 한다).\n            \"permanent_locks\": _build_permanent_locks(active_lockouts, active_account_lockouts),\n            \"recovery_requests\": recovery_requests,\n            \"ip_exemptions\": ip_exemptions,\n            \"permissions\": permissions,\n        }\n\n    # \"관리자 계정 관리\" 카드는 super_admin(manage_admin_users 권한 보유자)에게만\n    # 응답에 실어 보낸다 — viewer/security_admin의 화면에는 이 키 자체가 없어서\n    # dashboard/render/tables.js가 카드를 숨긴다(다른 관리자 계정 목록이 노출되지 않음).\n    if can_manage_admins:\n        response_data[\"admin_users\"] = admin_users\n\n    if ttl > 0:\n        with _status_cache_lock:\n            _status_cache[cache_key] = (time.monotonic(), response_data)\n            if len(_status_cache) > 64:  # 쪽 번호 조합이 무한히 늘지 않게\n                _status_cache.pop(next(iter(_status_cache)))\n    return jsonify(response_data)", "alias": null}, "routes/admin/status.py:_release_expired_locks_if_due": {"path": "routes/admin/status.py", "start": 109, "end": 130, "lang": "python", "code": "def _release_expired_locks_if_due() -> None:\n    \"\"\"만료된 잠금 정리 3종(IP·회원 계정·관리자 계정)을 정해진 간격마다 동시에 돌린다.\n\n    서로 무관하므로 동시에 돌리고(guide45), 호출한 쪽의 목록 조회보다는 먼저 끝난다 — 같이 돌리면\n    방금 풀린 잠금이 한 주기 동안 \"잠김\"으로 보일 수 있다. 예외는 .result()가 그대로 다시 일으킨다.\n    \"\"\"\n    interval = config.ADMIN_STATUS_RELEASE_INTERVAL_SECONDS\n    now = time.monotonic()\n    with _expiry_release_lock:\n        last = _expiry_release_state[\"at\"]\n        if interval > 0 and last is not None and now - last < interval:\n            return\n        _expiry_release_state[\"at\"] = now\n\n    with ThreadPoolExecutor(max_workers=3) as executor:\n        release_futures = [\n            executor.submit(soar.try_release_expired_lockouts),\n            executor.submit(soar.try_release_expired_account_lockouts),\n            executor.submit(soar.try_release_expired_admin_account_lockouts),\n        ]\n        for future in release_futures:\n            future.result()", "alias": null}, "security/soar/lockouts.py:try_release_expired_lockouts": {"path": "security/soar/lockouts.py", "start": 156, "end": 169, "lang": "python", "code": "def try_release_expired_lockouts() -> None:\n    \"\"\"\"5분이 지났는데 아직 안 풀린\" 잠금들을 찾아서 전부 풀어준다.\n\n    이 프로젝트는 \"정해진 시각이 되면 자동으로 실행되는 타이머 프로그램\"을\n    따로 두지 않는다(구현이 복잡해지므로 이번 계획 범위 밖). 대신 이 함수를\n    `/login` 요청이 들어올 때, 그리고 대시보드가 상태를 갱신할 때(정해진 간격마다 —\n    config.ADMIN_STATUS_RELEASE_INTERVAL_SECONDS, guide46) 호출해서\n    \"혹시 지금 풀어줘야 할 게 있나?\"를 그때그때 확인하는 방식으로 \"자동 해제\"를\n    흉내낸다. 트래픽(요청)이 없으면 실제 해제 반영이 살짝 늦어질 수 있지만,\n    이 프로젝트 규모에서는 문제되지 않는다.\n    \"\"\"\n    for lockout in db.list_expired_active_lockouts():\n        db.release_lockout(lockout[\"ip_address\"])\n        db.resolve_security_events_for_ip(lockout[\"ip_address\"])", "alias": {"call": "soar.try_release_expired_lockouts()", "via": "security/soar/__init__.py", "real": "security/soar/lockouts.py"}}, "db/attempts.py:list_recent_attempts": {"path": "db/attempts.py", "start": 121, "end": 141, "lang": "python", "code": "def list_recent_attempts(page: int = 1, page_size: int = 50) -> tuple[list[dict], int]:\n    \"\"\"로그인 시도 기록을 최신순으로 `page`번째 페이지만 가져오고, 전체 건수도 함께 돌려준다.\n\n    관리자 대시보드 화면의 \"최근 로그인 시도\" 표에 쓰인다. select(..., count=\"exact\")에\n    range()를 함께 쓰면 PostgREST가 \"이번 페이지 데이터\"와 \"range와 무관한 전체 개수\"를\n    한 번의 요청으로 같이 돌려준다 — 예전에는 목록 조회와 개수 조회를 별도 쿼리 두 번으로\n    나눠서 했는데, 페이지네이션을 표 5개에 다 붙이고 나니 /api/status 한 번에 왕복이\n    10번(표마다 목록+개수)까지 늘어나 관리자 대시보드 응답이 눈에 띄게 느려졌다. 이렇게\n    합치면 표 하나당 왕복이 1번으로 줄어든다.\n    \"\"\"\n    start = (page - 1) * page_size\n    end = start + page_size - 1\n    res = (\n        db.get_client()\n        .table(\"login_attempts\")\n        .select(\"*\", count=\"exact\")       # 이 줄의 모든 칸(id, ip, username 등) 전부 요청\n        .order(\"attempted_at\", desc=True) # 시각 기준으로 내림차순(최신이 맨 위) 정렬\n        .range(start, end)\n        .execute()\n    )\n    return res.data, res.count or 0", "alias": {"call": "db.list_recent_attempts()", "via": "db/__init__.py", "real": "db/attempts.py"}}, "db/lockouts.py:list_active_lockouts": {"path": "db/lockouts.py", "start": 211, "end": 224, "lang": "python", "code": "def list_active_lockouts() -> list[dict]:\n    \"\"\"지금 잠겨있는(active=True) IP 목록 전체를 가져온다.\n\n    관리자 대시보드에서 \"현재 잠긴 IP 카드\" 목록을 보여줄 때 쓰인다.\n    \"\"\"\n    res = (\n        db.get_client()\n        .table(\"lockouts\")\n        .select(\"*\")\n        .eq(\"active\", True)\n        .order(\"locked_at\", desc=True)  # 가장 최근에 잠긴 것부터 보여줌\n        .execute()\n    )\n    return res.data", "alias": {"call": "db.list_active_lockouts()", "via": "db/__init__.py", "real": "db/lockouts.py"}}, "db/users.py:list_users": {"path": "db/users.py", "start": 149, "end": 169, "lang": "python", "code": "def list_users(page: int = 1, page_size: int = 100) -> tuple[list[dict], int]:\n    \"\"\"가입된 회원 목록을 최신 가입순으로 `page`번째 페이지만 가져오고, 전체 회원 수도\n    함께 돌려준다 (1부터 시작). select(..., count=\"exact\") + range()를 한 번에 써서\n    목록 조회와 전체 개수 조회를 별도 쿼리 두 번이 아니라 한 번의 왕복으로 끝낸다\n    (list_recent_attempts() 참고 — 관리자 대시보드 응답 속도 개선).\n\n    password_hash 칸은 일부러 요청하지 않는다 — 암호화된 값이라 그 자체로는\n    안전하지만, 화면에 굳이 내보낼 이유가 없는 값은 애초에 조회 단계에서부터\n    빼두는 게 \"혹시 모를 실수로 노출되는 사고\"를 막는 가장 확실한 방법이다.\n    \"\"\"\n    start = (page - 1) * page_size\n    end = start + page_size - 1\n    res = (\n        db.get_client()\n        .table(\"users\")\n        .select(\"id, username, email, email_status, created_at\", count=\"exact\")\n        .order(\"created_at\", desc=True)\n        .range(start, end)\n        .execute()\n    )\n    return res.data, res.count or 0", "alias": {"call": "db.list_users()", "via": "db/__init__.py", "real": "db/users.py"}}, "db/security_events.py:list_security_events": {"path": "db/security_events.py", "start": 48, "end": 64, "lang": "python", "code": "def list_security_events(page: int = 1, page_size: int = 20) -> tuple[list[dict], int]:\n    \"\"\"보안 이벤트를 최신순으로 `page`번째 페이지만 가져오고, 전체 건수도 함께 돌려준다.\n\n    관리자 대시보드의 \"보안 이벤트\" 표에 쓰인다. list_recent_attempts()와 동일하게\n    select(..., count=\"exact\") + range()로 목록과 개수를 한 번의 왕복으로 가져온다.\n    \"\"\"\n    start = (page - 1) * page_size\n    end = start + page_size - 1\n    res = (\n        db.get_client()\n        .table(\"security_events\")\n        .select(\"*\", count=\"exact\")\n        .order(\"detected_at\", desc=True)\n        .range(start, end)\n        .execute()\n    )\n    return res.data, res.count or 0", "alias": {"call": "db.list_security_events()", "via": "db/__init__.py", "real": "db/security_events.py"}}, "db/incidents.py:list_security_incidents": {"path": "db/incidents.py", "start": 40, "end": 55, "lang": "python", "code": "def list_security_incidents(page: int = 1, page_size: int = 20) -> tuple[list[dict], int]:\n    \"\"\"상관된 사건을 최신 활동순으로 `page`번째 페이지만 가져오고, 전체 건수도\n    함께 돌려준다. db.list_security_events()와 동일한 페이지네이션 방식이다 —\n    관리자 대시보드의 \"연관 사건\" 표에 쓰인다.\n    \"\"\"\n    start = (page - 1) * page_size\n    end = start + page_size - 1\n    res = (\n        db.get_client()\n        .table(\"security_incidents\")\n        .select(\"*\", count=\"exact\")\n        .order(\"last_event_at\", desc=True)\n        .range(start, end)\n        .execute()\n    )\n    return res.data, res.count or 0", "alias": {"call": "db.list_security_incidents()", "via": "db/__init__.py", "real": "db/incidents.py"}}, "db/access_requests.py:list_pending_requests": {"path": "db/access_requests.py", "start": 118, "end": 134, "lang": "python", "code": "def list_pending_requests(page: int = 1, page_size: int = 20) -> tuple[list[dict], int]:\n    \"\"\"대시보드 \"AI 조기 경보\" 표에 보여줄 PENDING 요청을 최신순으로 가져온다.\n\n    db.list_security_events() 등과 동일한 페이지네이션 방식이다.\n    \"\"\"\n    start = (page - 1) * page_size\n    end = start + page_size - 1\n    res = (\n        db.get_client()\n        .table(\"access_requests\")\n        .select(\"*\", count=\"exact\")\n        .eq(\"status\", \"PENDING\")\n        .order(\"requested_at\", desc=True)\n        .range(start, end)\n        .execute()\n    )\n    return res.data, res.count or 0", "alias": {"call": "db.list_pending_requests()", "via": "db/__init__.py", "real": "db/access_requests.py"}}, "helpers/request_utils.py:_attach_locations": {"path": "helpers/request_utils.py", "start": 18, "end": 30, "lang": "python", "code": "def _attach_locations(attempts: list[dict]) -> list[dict]:\n    \"\"\"로그인 시도 목록 각 줄에 \"location\"이라는 새 칸을 추가해서 돌려준다.\n\n    geoip.get_locations()는 IP 목록을 한 번에 넘기면 IP 하나당 몇 번씩\n    조회하는 게 아니라 필요한 만큼만(캐시에 없는 것만) 조회해준다. 여기서는\n    그 결과를 각 시도 기록에 사람이 읽을 문자열(geoip.format_location())로\n    바꿔 붙여주기만 한다.\n    \"\"\"\n    ips = [attempt[\"ip_address\"] for attempt in attempts]\n    locations = geoip.get_locations(ips)\n    for attempt in attempts:\n        attempt[\"location\"] = geoip.format_location(locations[attempt[\"ip_address\"]])\n    return attempts", "alias": {"call": "helpers._attach_locations()", "via": "helpers/__init__.py", "real": "helpers/request_utils.py"}}, "db/roles.py:has_permission": {"path": "db/roles.py", "start": 12, "end": 29, "lang": "python", "code": "def has_permission(role: str, action: str) -> bool:\n    \"\"\"이 role이 이 action을 해도 되는지 permissions 표를 조회해서 확인한다.\n\n    db/settings.py의 get_signup_enabled()와 같은 이유로 캐싱하지 않고 매번\n    Supabase를 직접 조회한다 — 역할별 권한(permissions 표)은 운영 중에 Supabase에서\n    바뀔 수 있는 값이라(대시보드에는 권한 편집 화면이 없다), 한 번 메모리에 담아두면 다른 서버 인스턴스(로컬/Vercel)나\n    이미 로그인된 세션에서 권한 변경이 즉시 반영되지 않는다.\n    \"\"\"\n    res = (\n        db.get_client()\n        .table(\"permissions\")\n        .select(\"role\")\n        .eq(\"role\", role)\n        .eq(\"action\", action)\n        .limit(1)\n        .execute()\n    )\n    return bool(res.data)", "alias": {"call": "db.has_permission()", "via": "db/__init__.py", "real": "db/roles.py"}}, "routes/admin/status.py:_clear_status_cache_after_change": {"path": "routes/admin/status.py", "start": 198, "end": 203, "lang": "python", "code": "@admin_bp.after_request\ndef _clear_status_cache_after_change(response):\n    if request.method == \"POST\":\n        with _status_cache_lock:\n            _status_cache.clear()\n    return response", "alias": null}, "routes/admin/locks.py:api_unlock": {"path": "routes/admin/locks.py", "start": 25, "end": 43, "lang": "python", "code": "@admin_bp.route(\"/api/unlock\", methods=[\"POST\"])\n@require_permission(\"unlock_ip\")\ndef api_unlock():\n    \"\"\"대시보드의 \"즉시 해제\" 버튼을 눌렀을 때 브라우저가 호출하는 API.\n\n    이 라우트가 require_permission(\"unlock_ip\")로 보호되어 있으므로, 이 함수가 실행되는\n    시점엔 이미 \"IP 잠금 해제 권한이 있는 로그인된 관리자의 요청\"이라는 게 보장된 상태다\n    — 그래서 soar.manual_release는 권한 확인을 다시 하지 않고 바로 실행에만 집중할 수\n    있다(4단계 security/soar/ 설명 참고).\n    \"\"\"\n    data = request.get_json(silent=True) or {}\n    ip = data.get(\"ip\")\n    if not ip:\n        return jsonify({\"success\": False, \"error\": \"ip 값이 필요합니다.\"}), 400\n\n    released = soar.manual_release(ip)\n    if not released and lockdown.is_permanent_ip(ip):\n        return jsonify({\"success\": False, \"error\": \"영구 잠금은 '영구 해제'로만 풀 수 있습니다.\"}), 409\n    return jsonify({\"success\": released})", "alias": null}, "helpers/auth.py:require_permission": {"path": "helpers/auth.py", "start": 126, "end": 153, "lang": "python", "code": "def require_permission(action: str):\n    \"\"\"login_required보다 한 단계 더 세밀한 문지기 — \"로그인됐는가\"뿐 아니라\n    \"이 관리자의 역할이 정말 이 action을 해도 되는가\"까지 확인한다\n    (Track B guide26, RBAC 기본 구조).\n\n    login_required와 다르게 데코레이터 팩토리(괄호로 action을 받아 진짜\n    데코레이터를 만들어 돌려주는 함수) 형태다 — `@require_permission(\"delete_user\")`\n    처럼 라우트마다 어떤 액션을 확인할지 지정해야 하기 때문이다.\n\n    순서: 1) 세션 확인은 login_required와 완전히 동일하다(_load_current_admin /\n    _reject_admin_request). 2) 로그인은 됐지만 role이 이 action을 못 하면 403(권한 없음)\n    JSON을 돌려준다 — 이미 로그인된 상태에서 걸리는 경우이므로 화면 리다이렉트가 아니라\n    항상 JSON으로 응답한다(이 데코레이터가 보호하는 라우트는 전부 /api/* 뿐이라서).\n    role은 1)에서 계정을 조회할 때 함께 가져온 값을 쓴다 — 캐싱하지 않고 요청마다 DB에서\n    읽은 값이므로 role이 바뀌면 바로 다음 요청부터 적용된다.\n    \"\"\"\n    def decorator(view):\n        @wraps(view)\n        def wrapped_view(*args, **kwargs):\n            admin = _load_current_admin()\n            if admin is None:\n                return _reject_admin_request()\n            if not db.has_permission(admin[\"role\"], action):\n                return jsonify({\"error\": \"이 작업을 수행할 권한이 없습니다.\"}), 403\n\n            return view(*args, **kwargs)\n        return wrapped_view\n    return decorator", "alias": null}, "security/soar/lockouts.py:manual_release": {"path": "security/soar/lockouts.py", "start": 175, "end": 197, "lang": "python", "code": "def manual_release(ip: str) -> bool:\n    \"\"\"관리자가 대시보드의 \"즉시 해제\" 버튼을 눌렀을 때 호출되는 함수.\n\n    동작 순서:\n    1. 지금 잠겨있는 IP 목록을 전부 가져와서, 그 안에 이 ip가 있는지 확인한다.\n    2. 있다면 실제로 풀어주고 True(성공)를 돌려준다.\n    3. 애초에 잠긴 적이 없다면 아무것도 하지 않고 False(할 일 없음)를 돌려준다.\n\n    주의: 이 함수는 \"이 요청을 보낸 사람이 진짜 관리자인지\"는 전혀 확인하지 않는다.\n    그 권한 확인은 라우트의 require_permission 문지기(helpers/auth.py)가 미리 걸러주고, 이 함수는\n    \"이미 권한이 확인된 사람\"의 요청만 받는다고 가정하고 동작한다.\n    \"\"\"\n    active = {row[\"ip_address\"]: row for row in db.list_active_lockouts()}\n    if ip not in active:\n        return False\n    # 영구 잠금은 이 \"즉시 해제\"로 풀지 않는다 — 사유 기록과 권한 분리(release_permanent_lock,\n    # super_admin 전용)가 필요한 별도 경로(lockdown.release)로만 풀 수 있다(guide33).\n    if active[ip].get(\"lock_type\") == \"PERMANENT\":\n        return False\n    db.release_lockout(ip)\n    db.resolve_security_events_for_ip(ip)\n    # 연관 사건은 닫지 않는다 — try_release_expired_lockouts()의 같은 자리 주석 참고.\n    return True", "alias": {"call": "soar.manual_release()", "via": "security/soar/__init__.py", "real": "security/soar/lockouts.py"}}, "db/lockouts.py:release_lockout": {"path": "db/lockouts.py", "start": 201, "end": 208, "lang": "python", "code": "def release_lockout(ip: str) -> None:\n    \"\"\"이 IP의 잠금을 해제한다 (active 칸을 False로 바꿈).\n\n    줄을 지우는 게 아니라 \"해제됨\" 표시만 남겨서, 나중에 \"언제 잠겼다가 언제 풀렸는지\"\n    이력을 되짚어볼 수 있게 한다. 관리자가 수동으로 풀 때나, 5분이 지나 자동으로\n    풀릴 때나 똑같이 이 함수 하나를 쓴다.\n    \"\"\"\n    db.get_client().table(\"lockouts\").update({\"active\": False}).eq(\"ip_address\", ip).execute()", "alias": {"call": "db.release_lockout()", "via": "db/__init__.py", "real": "db/lockouts.py"}}, "db/security_events.py:resolve_security_events_for_ip": {"path": "db/security_events.py", "start": 115, "end": 124, "lang": "python", "code": "def resolve_security_events_for_ip(ip: str) -> None:\n    \"\"\"이 IP의 미해결 CRITICAL 이벤트를 전부 해결됨으로 표시한다.\n\n    CRITICAL(로그인 잠금)은 관리자가 따로 처리 완료를 누르지 않아도, 잠금이\n    풀리는 순간(자동 만료든 수동 해제든) 그 사건도 함께 끝난 것으로 본다\n    (soar.try_release_expired_lockouts/manual_release가 release_lockout 직후 호출).\n    \"\"\"\n    db.get_client().table(\"security_events\").update({\"resolved_at\": db._now_iso()}).eq(\n        \"ip_address\", ip\n    ).eq(\"severity\", \"CRITICAL\").is_(\"resolved_at\", \"null\").execute()", "alias": {"call": "db.resolve_security_events_for_ip()", "via": "db/__init__.py", "real": "db/security_events.py"}}}, "files": {"routes/admin/status.py": {"role": "관리자 대시보드 화면과 5초마다 부르는 /api/status(전체 상태) · /api/stats(집계) 입구 파일.", "header": "routes/admin/status.py — 관리자 대시보드 화면(/admin/dashboard)과 대시보드 폴링 API(/api/status)\n예전 routes/admin.py(798줄)를 기능 묶음별로 나눈 조각 중 하나다. Blueprint(admin_bp)는\nroutes/admin/__init__.py에서 하나만 만들고, 이 파일은 거기에 라우트를 붙이기만 한다\n— 그래서 엔드포인트 이름(url_for(\"admin.xxx\"))은 나누기 전과 똑같다.\n배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/admin/status.py"}, "config.py": {"role": "임계값·시간 창·잠금 시간·규칙값 등 프로젝트 공용 설정값을 한 곳에 모은 파일.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/config.py"}, "helpers/auth.py": {"role": "관리자 문지기(login_required)와 권한 문지기(require_permission)가 있는 파일.", "header": "helpers/auth.py — 관리자/회원 세션과 로그인·권한 문지기(데코레이터)\n예전 helpers.py(314줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from helpers import ...`로 가져다 쓴다(helpers/__init__.py가\n재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/helpers/auth.py"}, "security/soar/lockouts.py": {"role": "잠금 집행과 해제(자동 만료·관리자 수동)를 담당하는 집행관 파일.", "header": "security/soar/lockouts.py — 잠금 집행(IP/회원 계정/관리자 계정)과 자동·수동 해제\n예전 soar.py(497줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from security import soar` 후 `soar.enforce_lockout(...)`으로\n쓴다(security/soar/__init__.py가 재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/soar/lockouts.py"}, "db/attempts.py": {"role": "db/attempts.py — login_attempts 표 관련 함수 — \"누가 언제 어떤 IP에서 로그인에 성공/실패했는지\"를 기록하고 조회하는 기능 원래 db.py의 같은 이름 섹션을 그대로 옮겨왔다. 이 모듈은 내부에서 `import db`로 패키지 최상위(db/__init__.", "header": "db/attempts.py — login_attempts 표 관련 함수\n— \"누가 언제 어떤 IP에서 로그인에 성공/실패했는지\"를 기록하고 조회하는 기능\n원래 db.py의 같은 이름 섹션을 그대로 옮겨왔다. 이 모듈은 내부에서 `import db`로\n패키지 최상위(db/__init__.py)를 다시 참조해서 db.get_client()를 호출한다 —\ndb.attempts.get_client가 아니라 이렇게 해야, 테스트가\nmonkeypatch.setattr(db, \"get_client\", ...)로 db 패키지의 get_client를 바꿔치기\n했을 때 이 파일의 함수들도 그 가짜 버전을 그대로 쓰게 된다(값을 미리 복사해서\n이 파일 안에 별도 이름으로 묶어두면 그 바꿔치기가 안 먹는다).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/attempts.py"}, "db/lockouts.py": {"role": "IP 잠금(lockouts 표)을 읽고 쓰는 저장소 파일.", "header": "db/lockouts.py — lockouts 표 관련 함수\n— \"지금 어떤 IP가 잠겨있고, 언제 풀리는지\"라는 \"현재 상태\"를 관리하는 기능\n(login_attempts가 \"지나간 일의 기록\"이라면, lockouts는 \"지금 이 순간의 상태판\")\ndb.get_client()/db._now_iso()를 통해 호출하는 이유는 db/attempts.py 상단\n설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/lockouts.py"}, "db/users.py": {"role": "db/users.py — users 표 관련 함수 (회원가입 기능) — 감시 대상이 되는 가짜 로그인 화면(/login)에 실제로 가입해서 로그인하는 \"일반 사용자\" 계정을 관리하는 기능. 관리자(admin_users)와는 완전히 별개 개념. db.get_client() 호출 이유는 d", "header": "db/users.py — users 표 관련 함수 (회원가입 기능)\n— 감시 대상이 되는 가짜 로그인 화면(/login)에 실제로 가입해서 로그인하는\n\"일반 사용자\" 계정을 관리하는 기능. 관리자(admin_users)와는 완전히 별개 개념.\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/users.py"}, "db/security_events.py": {"role": "위험등급 이벤트 표를 읽고 쓰는 저장소 파일.", "header": "db/security_events.py — security_events 표 관련 함수\nsecurity_events는 MEDIUM/HIGH/CRITICAL 이상행위를 위험등급과 함께 기록하는\n공통 표다(security-risk-response-summary.md 5절 참고). LOW는 여기 저장하지 않고\n요청 로그 표(not_found/unauthorized/page_access_attempts — db/access_logs.py)\n조회로만 추세를 본다. 그 세 표의 함수는 원래 이 파일에 있었는데 2026-10-09에\ndb/access_logs.py로 나눴다.\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/security_events.py"}, "db/incidents.py": {"role": "db/incidents.py — security_incidents 표 관련 함수 (Track C guide27, SIEM 상관분석) security_events가 개별 신고서 한 장 한 장이라면, 이 표는 \"같은 IP가 짧은 시간 안에 서로 다른 event_type을 2개 이상 남겼을 ", "header": "db/incidents.py — security_incidents 표 관련 함수 (Track C guide27, SIEM 상관분석)\nsecurity_events가 개별 신고서 한 장 한 장이라면, 이 표는 \"같은 IP가 짧은 시간\n안에 서로 다른 event_type을 2개 이상 남겼을 때\" 그 신고들을 하나로 묶어두는\n사건철이다. security/correlate.py가 판단(묶어야 하는가?)만 하고, 실제 조회/삽입/병합은\n전부 이 파일이 맡는다(security/detector.py·security/soar/와 동일한 판단·실행 분리 원칙).\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/incidents.py"}, "db/access_requests.py": {"role": "db/access_requests.py — access_requests 표 관련 함수 (Track A, guide31) security_incidents가 \"여러 이벤트를 하나의 사건으로 묶는\" 표라면, 이 표는 \"규칙이 아직 발동하지 않은 임계값 코앞 구간에서 LLM이 위험하다고 판단", "header": "db/access_requests.py — access_requests 표 관련 함수 (Track A, guide31)\nsecurity_incidents가 \"여러 이벤트를 하나의 사건으로 묶는\" 표라면, 이 표는\n\"규칙이 아직 발동하지 않은 임계값 코앞 구간에서 LLM이 위험하다고 판단한\n건들을 관리자 승인 대기 목록으로 쌓아두는\" 표다. soar.consider_early_warning()이\n판단(위험한가?) 결과를 여기 등록하고, 실제 승인/반려 실행은 security/soar/의\nexecute_approved_request()/reject_pending_request()가 이 파일의 함수를\n통해서만 상태를 바꾼다 (security/detector.py·security/soar/와 동일한 판단·실행 분리 원칙).\nguide33 이후로는 LLM 판단이 아닌 항목도 하나 들어온다 — SIEM 상관분석 사건이 HIGH에\n도달했을 때의 영구 잠금 후보(SIEM_HIGH_INCIDENT, security/lockdown.py의\nconsider_incident_promotion 참고)도 같은 승인 대기 목록에 쌓인다.\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/access_requests.py"}, "helpers/request_utils.py": {"role": "시도 기록에 접속 위치(국가·도시)를 붙이는 공용 도구.", "header": "helpers/request_utils.py — 요청 정보(IP, 허니팟) 읽기와 화면용 작은 변환 함수\n예전 helpers.py(314줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from helpers import ...`로 가져다 쓴다(helpers/__init__.py가\n재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/helpers/request_utils.py"}, "db/roles.py": {"role": "역할별 허용 액션(permissions 표)을 조회하는 저장소 파일. (13단원)", "header": "db/roles.py — roles / permissions 표 관련 함수 (Track B guide26, RBAC 기본 구조)\nadmin_users.role이 \"이 관리자가 어떤 역할인지\"를 말해준다면, 이 파일의\nhas_permission()은 \"그 역할이 지금 하려는 일을 해도 되는지\"를 확인한다.\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/roles.py"}, "routes/admin/locks.py": {"role": "'즉시 해제'·영구 잠금·IP 예외·복구 요청 처리 버튼이 호출하는 API 입구 파일.", "header": "routes/admin/locks.py — 잠금 해제·영구 잠금·IP 예외·복구 요청 관리 API\n예전 routes/admin.py(798줄)를 기능 묶음별로 나눈 조각 중 하나다. Blueprint(admin_bp)는\nroutes/admin/__init__.py에서 하나만 만들고, 이 파일은 거기에 라우트를 붙이기만 한다\n— 그래서 엔드포인트 이름(url_for(\"admin.xxx\"))은 나누기 전과 똑같다.\n배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/admin/locks.py"}}}</script>

  var KIND_LABEL = {screen:"화면 · 도착지", route:"routes", helper:"판단", db:"db", config:"설정값", later:"다른 단원"};

  var state = { sc: 0, node: null, item: 0, file: null };

  function el(tag, attrs, kids){
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function brk(t){ return t.replace(/([\/._])/g, "$1\u200b"); }
  function scen(){ return D.scenarios[state.sc]; }
  function nodeById(id){ return scen().nodes.filter(function(n){ return n.id === id; })[0]; }
  function fnName(label){ return label; }

  /* ---------- 간단 문법 강조 ---------- */
  var PY = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?''')|([rbfRBF]{0,2}"(?:\\.|[^"\\\n])*"|[rbfRBF]{0,2}'(?:\\.|[^'\\\n])*')|\b(def|class|return|if|elif|else|for|while|import|from|as|try|except|finally|with|in|not|and|or|is|None|True|False|raise|pass|lambda|yield|global|nonlocal|assert|del|continue|break)\b|(@[A-Za-z_][\w.]*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(?=\()/g;
  var PYC = [null,"t-c","t-d","t-s","t-k","t-a","t-n","t-f"];
  var HT = /(<!--[\s\S]*?-->)|(\{[{%#][\s\S]*?[}%#]\})|(<\/?[A-Za-z][\w-]*)|("[^"\n]*")|(\/?>)/g;
  var HTC = [null,"t-c","t-a","t-k","t-s","t-k"];
  var JS = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\.|[^`\\])*`)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(const|let|var|function|return|if|else|for|while|import|from|export|default|async|await|try|catch|finally|new|class|extends|typeof|interface|type|null|undefined|true|false|throw|switch|case|break|continue|of|in|as)\b|(@[A-Za-z_]\w*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_$][\w$]*)(?=\()/g;
  var JSC = [null,"t-c","t-s","t-s","t-k","t-a","t-n","t-f"];
  var SQ = /(--[^\n]*|\/\*[\s\S]*?\*\/)|((?!))|('(?:''|[^'])*')|\b(select|from|where|insert|into|values|update|set|delete|create|table|index|alter|add|drop|on|conflict|do|nothing|and|or|not|null|default|primary|key|references|cascade|if|exists|as|order|by|group|limit|desc|asc|join|left|inner|count|returns|function|language|begin|end|return|with|union|all|distinct|in|is|true|false|unique|check|constraint|timestamptz|text|integer|bigint|boolean|interval|now|replace|trigger|view|policy|enable|row|level|security|using)\b|((?!))|\b(\d+(?:\.\d+)?)\b|\b([a-z_]\w*)(?=\()/gi;
  var SQC = [null,"t-c",null,"t-s","t-k",null,"t-n","t-f"];
  var SH = /(#[^\n]*)|((?!))|("(?:\\.|[^"\\\n])*"|'[^'\n]*')|\b(if|then|else|fi|for|do|done|while|case|esac|function|echo|export|python|pip|git|cd|run|name|on|jobs|steps|uses|with|env)\b|((?!))|\b(\d+)\b/g;
  var SHC = [null,"t-c",null,"t-s","t-k",null,"t-n"];
  function tokenize(code, lang){
    var re = PY, cls = PYC;
    if (lang === "html"){ re = HT; cls = HTC; }
    else if (lang === "js"){ re = JS; cls = JSC; }
    else if (lang === "sql"){ re = SQ; cls = SQC; }
    else if (lang === "sh"){ re = SH; cls = SHC; }
    var lines = [[]];
    function push(text, c){
      var parts = text.split("\n");
      parts.forEach(function(p, i){
        if (i > 0) lines.push([]);
        if (p) lines[lines.length-1].push([p, c]);
      });
    }
    var last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(code)) !== null){
      if (m.index > last) push(code.slice(last, m.index), null);
      var idx = 1; while (idx < m.length && m[idx] === undefined) idx++;
      push(m[0], cls[idx] || null);
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++;
    }
    if (last < code.length) push(code.slice(last), null);
    return lines;
  }

  function codeTable(block, hl){
    var lines = tokenize(block.code, block.lang);
    var tbody = el("tbody");
    var hlFirst = null;
    lines.forEach(function(segs, i){
      var no = block.start + i;
      var on = hl && no >= hl[0] && no <= hl[1];
      var td = el("td", {class:"tx"});
      segs.forEach(function(s){ td.appendChild(s[1] ? el("span", {class:s[1], text:s[0]}) : document.createTextNode(s[0])); });
      if (!segs.length) td.appendChild(document.createTextNode(" "));
      var tr = el("tr", on ? {class:"hl"} : null, [el("td", {class:"ln", text:String(no)}), td]);
      if (on && !hlFirst) hlFirst = tr;
      tbody.appendChild(tr);
    });
    var box = el("div", {class:"codebox"}, [el("table", {class:"code"}, [tbody])]);
    box._hlFirst = hlFirst;
    return box;
  }

  function copyText(text, btn){
    var done = function(){ var o = btn.textContent; btn.textContent = "복사됨 ✓"; setTimeout(function(){ btn.textContent = o; }, 1200); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
    function fallback(){
      var ta = el("textarea", {style:"position:fixed;opacity:0"}); ta.value = text; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); done(); } catch(e){} document.body.removeChild(ta);
    }
  }

  /* ---------- 패널 ---------- */
  function openPanel(){ document.body.classList.add("open"); }
  function closePanel(){ document.body.classList.remove("open"); }

  function showHint(){
    $("pTitle").textContent = "코드 보는 법";
    $("pSub").textContent = "카드나 파일 이름을 누르면 실제 코드가 여기에 열립니다.";
    var ul = el("ul", {class:"hint"}, [
      el("li", {text:"카드(상자)를 누르면 그 단계에서 실행되는 실제 함수 코드가 열려요."}),
      el("li", {text:"카드 안의 📄 파일 이름을 누르면 그 파일이 어떤 역할인지, 이 단원에서 쓰이는 함수가 무엇인지 보여줘요."}),
      el("li", {text:"ƒ 함수 이름을 누르면 해당 함수 코드로 바로 이동해요."}),
      el("li", {text:"노란색 줄이 지금 단계가 담당하는 부분이에요."}),
      el("li", {text:"db.함수() 처럼 적혀 있어도 실제 코드는 db/users.py 같은 다른 파일에 있어요. 카드에 그 '진짜 파일'을 표시하고, 코드 위에 찾아가는 길도 그려줘요."}),
      el("li", {text:"위쪽 ◀ ▶ 버튼으로 실행 순서대로 한 단계씩 따라갈 수 있어요."})
    ]);
    var b = $("pBody"); b.textContent = ""; b.appendChild(ul);
  }

  function renderAlias(a){
    if (!a) return null;
    return el("div", {class:"alias"}, [
      el("div", {text:"코드에는 이렇게 적혀 있지만, 실제 함수는 다른 파일에 있어요."}),
      el("div", {class:"route"}, [
        el("span", {class:"step", text:a.call}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step", text:a.via + " (창구)"}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step real", text:a.real})
      ])
    ]);
  }

  function selectNode(id, itemIdx){
    var n = nodeById(id); if (!n) return;
    state.node = id; state.item = itemIdx || 0; state.file = null;
    $("pTitle").textContent = n.title;
    $("pSub").textContent = n.plain;
    var body = $("pBody"); body.textContent = "";
    if (n.reject) body.appendChild(el("div", {class:"n-reject", text:n.reject, style:"margin:0 0 10px"}));
    if (n.items.length > 1){
      var tabs = el("div", {class:"itabs", role:"tablist"});
      n.items.forEach(function(it, i){
        tabs.appendChild(el("button", {class:"itab", role:"tab", "aria-selected":String(i === state.item), text:it.label,
          onclick:function(){ selectNode(id, i); }}));
      });
      body.appendChild(tabs);
    }
    var it = n.items[state.item];
    var block = D.blocks[it.block];
    var linesTxt = it.hl ? (it.hl[0] === it.hl[1] ? it.hl[0] + "줄" : it.hl[0] + "–" + it.hl[1] + "줄") : "";
    var fl = el("div", {class:"fileline"}, [
      el("button", {class:"chip file", onclick:function(){ selectFile(block.path); }, text:block.path}),
      el("span", {class:"lines", text: block.start + "–" + block.end + "줄 표시" + (linesTxt ? " · 노란색 " + linesTxt : "")}),
      el("span", {class:"spacer"}),
      el("button", {class:"btn", text:"복사", onclick:function(e){ copyText(block.code, e.currentTarget); }}),
      el("a", {class:"btn link", href:D.files[block.path].github + "#L" + block.start + "-L" + block.end, target:"_blank", rel:"noopener", text:"GitHub ↗"})
    ]);
    body.appendChild(fl);
    var al = renderAlias(block.alias); if (al) body.appendChild(al);
    var box = codeTable(block, it.hl);
    body.appendChild(box);
    if (it.hl) body.appendChild(el("p", {class:"legend-hl"}, [el("b", {text:"노란색"}), " = 이 카드가 담당하는 줄"]));
    refreshSelection();
    openPanel();
    if (box._hlFirst){
      var off = box._hlFirst.offsetTop - 60;
      box.scrollTop = Math.max(0, off);
    }
    updateStepper();
  }

  function selectFile(path){
    state.file = path; state.node = null;
    var f = D.files[path];
    $("pTitle").textContent = "📄 " + path;
    $("pSub").textContent = f.role;
    var body = $("pBody"); body.textContent = "";
    body.appendChild(el("div", {class:"fileline"}, [
      el("a", {class:"btn link", href:f.github, target:"_blank", rel:"noopener", text:"GitHub에서 파일 열기 ↗"})
    ]));
    body.appendChild(el("h3", {text:"이 단원에서 쓰이는 함수", style:"font-size:13.5px;margin:12px 0 0"}));
    var ul = el("ul", {class:"flist"}), seen = {};
    D.scenarios.forEach(function(sc, si){
      sc.nodes.forEach(function(n){
        n.items.forEach(function(it, ii){
          var b = D.blocks[it.block]; if (b.path !== path) return;
          var key = si + n.id + ii; if (seen[key]) return; seen[key] = 1;
          var li = el("li");
          li.appendChild(el("button", {onclick:function(){
            if (state.sc !== si) switchScenario(si);
            selectNode(n.id, ii); scrollToNode(n.id);
          }}, [
            el("span", {class:"mono", text:it.label}), el("small", {text:sc.name + " · " + n.title})
          ]));
          ul.appendChild(li);
        });
      });
    });
    body.appendChild(ul);
    if (f.header){
      var d = el("details", {class:"hdr"}, [el("summary", {text:"파일 맨 위 설명 주석 보기"}), el("pre", {text:f.header})]);
      body.appendChild(d);
    }
    refreshSelection();
    openPanel();
  }

  /* ---------- 흐름도 ---------- */
  var cols, colIndex, nodeEls = {};
  function renderStage(){
    var sc = scen();
    var used = {}; sc.nodes.forEach(function(n){ used[n.col] = 1; });
    cols = Object.keys(used).map(Number).sort(function(a,b){ return a-b; });
    colIndex = {}; cols.forEach(function(c, i){ colIndex[c] = i + 1; });
    var stage = $("stage");
    stage.textContent = "";
    stage.style.gridTemplateColumns = "repeat(" + cols.length + ", 196px)";
    nodeEls = {};

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "edges"); svg.id = "edges";
    svg.innerHTML = '<defs>' +
      '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-call" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '</defs>';
    stage.appendChild(svg);

    cols.forEach(function(c){
      stage.appendChild(el("div", {class:"colhead", style:"grid-column:" + colIndex[c] + ";grid-row:1", text:D.columns[c]}));
    });
    var cells = {};
    sc.nodes.forEach(function(n){
      var k = n.row + ":" + n.col;
      if (!cells[k]){
        cells[k] = el("div", {class:"cell", style:"grid-column:" + colIndex[n.col] + ";grid-row:" + (n.row + 2)});
        stage.appendChild(cells[k]);
      }
      var node = buildNode(n);
      nodeEls[n.id] = node;
      cells[k].appendChild(node);
    });
    $("intro").textContent = sc.intro;
    scheduleEdges();
  }

  function buildNode(n){
    var node = el("div", {class:"node " + n.kind, role:"button", tabindex:"0", "aria-pressed":"false", "data-id":n.id,
      onclick:function(e){ if (e.target.closest(".chip")) return; selectNode(n.id, 0); },
      onkeydown:function(e){ if ((e.key === "Enter" || e.key === " ") && !e.target.closest(".chip")){ e.preventDefault(); selectNode(n.id, 0); } }});
    var title = el("div", {class:"n-title", text:n.title});
    if (n.later) title.appendChild(el("span", {class:"tag-later", text:n.later + "에서 자세히"}));
    node.appendChild(title);
    if (n.kind !== "later" && n.plain) node.appendChild(el("div", {class:"n-plain", text:n.plain}));
    if (n.reject) node.appendChild(el("div", {class:"n-reject", text:n.reject}));
    var items = el("div", {class:"n-items"});
    // 같은 파일에 있는 함수는 파일 칩 하나 아래에 함수 칩을 나란히 놓는다
    var groups = [];
    n.items.forEach(function(it, i){
      var b = D.blocks[it.block], g = groups[groups.length - 1];
      if (g && g.path === b.path) g.list.push({it: it, i: i}); else groups.push({path: b.path, list: [{it: it, i: i}]});
    });
    groups.forEach(function(g){
      var row = el("div", {class:"n-item"});
      if (g.list.length === 1 && g.list[0].it.call) row.appendChild(el("div", {class:"n-call", text:brk(g.list[0].it.call)}));
      var chips = el("div", {class:"chips"}, [
        el("button", {class:"chip file", text:brk(g.path), title:"파일 설명 보기", onclick:function(){ selectFile(g.path); }})
      ]);
      g.list.forEach(function(x){
        chips.appendChild(el("button", {class:"chip " + (x.it.snippet ? "snip" : "fn"), text:x.it.label, title:(x.it.call ? x.it.call + " — " : "") + "코드 보기",
          onclick:function(){ selectNode(n.id, x.i); }}));
      });
      row.appendChild(chips);
      items.appendChild(row);
    });
    node.appendChild(items);
    return node;
  }

  function rectIn(elm, host){
    var a = elm.getBoundingClientRect(), h = host.getBoundingClientRect();
    return {l:a.left-h.left, r:a.right-h.left, t:a.top-h.top, b:a.bottom-h.top, cx:(a.left+a.right)/2-h.left, cy:(a.top+a.bottom)/2-h.top};
  }
  var raf = 0;
  function scheduleEdges(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(drawEdges); }
  function drawEdges(){
    var stage = $("stage"), svg = $("edges"), sc = scen();
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){ p.remove(); });
    Array.prototype.slice.call(stage.querySelectorAll(".elabel")).forEach(function(p){ p.remove(); });
    var svgNS = "http://www.w3.org/2000/svg";
    sc.edges.forEach(function(e){
      var a = nodeById(e.from), b = nodeById(e.to);
      var ea = nodeEls[e.from], eb = nodeEls[e.to]; if (!ea || !eb) return;
      var ra = rectIn(ea, stage), rb = rectIn(eb, stage), d, lx, ly;
      if (a.col === b.col){
        if (b.row - a.row <= 1){
          d = "M" + ra.cx + " " + ra.b + " V" + rb.t; lx = ra.cx; ly = (ra.b + rb.t) / 2;
        } else {
          var x = Math.min(ra.l, rb.l) - 30;
          d = "M" + ra.l + " " + ra.cy + " H" + x + " V" + rb.cy + " H" + rb.l; lx = x; ly = (ra.cy + rb.cy) / 2;
        }
      } else {
        var dir = b.col > a.col ? 1 : -1;
        var x1 = dir > 0 ? ra.r : ra.l, x2 = dir > 0 ? rb.l : rb.r;
        var xm = x2 - dir * 30;
        d = "M" + x1 + " " + ra.cy + " H" + xm + " V" + rb.cy + " H" + x2;
        lx = (x1 + x2) / 2; ly = ra.cy;
      }
      var kind = e.kind === "call" ? "call" : "flow";
      var p = document.createElementNS(svgNS, "path");
      p.setAttribute("d", d); p.setAttribute("class", "e " + kind);
      p.setAttribute("marker-end", "url(#" + (kind === "call" ? "ahc" : "ah") + ")");
      p.setAttribute("data-from", e.from); p.setAttribute("data-to", e.to);
      svg.appendChild(p);
      if (e.label && kind === "flow"){
        var lab = el("span", {class:"elabel", text:e.label});
        lab.style.left = lx + "px"; lab.style.top = ly + "px";
        stage.appendChild(lab);
      }
    });
    svg.setAttribute("width", stage.scrollWidth); svg.setAttribute("height", stage.scrollHeight);
    refreshSelection();
  }

  function refreshSelection(){
    Object.keys(nodeEls).forEach(function(id){ nodeEls[id].setAttribute("aria-pressed", String(id === state.node)); });
    var svg = $("edges"); if (!svg) return;
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){
      var on = state.node && (p.getAttribute("data-from") === state.node || p.getAttribute("data-to") === state.node);
      p.classList.toggle("active", !!on);
    });
  }
  function scrollToNode(id){
    var n = nodeEls[id]; if (n && n.scrollIntoView) n.scrollIntoView({block:"center", inline:"center", behavior:"smooth"});
  }

  /* ---------- 단계 이동 / 탭 ---------- */
  function stepIndex(){ return scen().steps.indexOf(state.node); }
  function updateStepper(){
    var steps = scen().steps, i = stepIndex();
    $("stepNo").textContent = i < 0 ? "– / " + steps.length : (i + 1) + " / " + steps.length;
    $("prev").disabled = i <= 0 && state.node !== null ? true : false;
    $("next").disabled = i >= steps.length - 1;
    if (state.node === null){ $("prev").disabled = true; $("next").disabled = false; }
  }
  function go(delta){
    var steps = scen().steps, i = stepIndex();
    var j = i < 0 ? 0 : Math.max(0, Math.min(steps.length - 1, i + delta));
    selectNode(steps[j], 0); scrollToNode(steps[j]);
  }
  function renderTabs(){
    var t = $("tabs"); t.textContent = "";
    D.scenarios.forEach(function(sc, i){
      t.appendChild(el("button", {class:"tab", role:"tab", "aria-selected":String(i === state.sc), text:sc.name, onclick:function(){ switchScenario(i); }}));
    });
  }
  function switchScenario(i){
    state.sc = i; state.node = null; state.file = null;
    renderTabs(); renderStage(); showHint(); updateStepper();
    try { history.replaceState(null, "", "#" + D.scenarios[i].id); } catch(e){}
  }

  /* ---------- 시작 ---------- */
  document.title = D.title + " — 코드 흐름도";
  $("title").textContent = D.title + " · 코드 흐름도";
  $("subtitle").textContent = D.subtitle;
  $("mdlink").setAttribute("href", D.mdFile);
  $("prev").addEventListener("click", function(){ go(-1); });
  $("next").addEventListener("click", function(){ go(1); });
  $("pClose").addEventListener("click", closePanel);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closePanel(); });
  $("theme").addEventListener("click", function(){
    var r = document.documentElement, cur = r.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  });
  window.addEventListener("resize", scheduleEdges);
  if (window.ResizeObserver) new ResizeObserver(scheduleEdges).observe($("stage"));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleEdges);

  var startId = (location.hash || "").replace("#", "");
  var startIdx = 0; D.scenarios.forEach(function(s, i){ if (s.id === startId) startIdx = i; });
  switchScenario(startIdx);
  // 화면 확인/테스트용 지름길: window.__flow.select("s7")
  window.__flow = { select: function(id, i){ selectNode(id, i || 0); }, file: selectFile, state: state };
})();
</script>
</body>
