<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>16. 영구 잠금 — 코드 흐름도</title>
<style>
  :root{
    --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eaefe9; --ink:#12201c; --ink-muted:#5a6b63;
    --border:#d9e0da; --accent:#0f6f66; --accent-soft:#e2ede9; --danger:#bf3b2b; --danger-soft:#f8e6e2;
    --edge:#7b8a82; --edge-call:#8a97a0;
    --k-screen:#767f78; --k-screen-soft:#eef0ee;
    --k-route:#2f5fd6;  --k-route-soft:#e7edfb;
    --k-helper:#b56b0c; --k-helper-soft:#f7ecd9;
    --k-db:#7a4fce;     --k-db-soft:#efe8fa;
    --k-config:#0f6f66; --k-config-soft:#e2ede9;
    --k-later:#9aa39d;  --k-later-soft:#f4f6f3;
    --code-bg:#fbfcfb; --code-hl:#fff3c4; --code-hl-bar:#e0a800; --code-gutter:#8a978f;
    --c-comment:#6b7d73; --c-str:#a1470f; --c-kw:#7a3fc0; --c-fn:#1f5fd0; --c-num:#0b7a6c; --c-deco:#b0306e;
    --shadow:0 1px 2px rgba(18,32,28,.06), 0 6px 20px rgba(18,32,28,.07);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
      --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
      --edge:#6f8178; --edge-call:#5d6f67;
      --k-screen:#9aa39d; --k-screen-soft:#1a221e;
      --k-route:#7fa2f2;  --k-route-soft:#182236;
      --k-helper:#e8a94c; --k-helper-soft:#31260f;
      --k-db:#b49bee;     --k-db-soft:#241c34;
      --k-config:#4fc9b8; --k-config-soft:#17332d;
      --k-later:#6b7a72;  --k-later-soft:#111a16;
      --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
      --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
    --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
    --edge:#6f8178; --edge-call:#5d6f67;
    --k-screen:#9aa39d; --k-screen-soft:#1a221e;
    --k-route:#7fa2f2;  --k-route-soft:#182236;
    --k-helper:#e8a94c; --k-helper-soft:#31260f;
    --k-db:#b49bee;     --k-db-soft:#241c34;
    --k-config:#4fc9b8; --k-config-soft:#17332d;
    --k-later:#6b7a72;  --k-later-soft:#111a16;
    --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
    --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
  button{font:inherit;color:inherit;cursor:pointer}
  code,.mono{font-family:var(--mono)}

  .app{display:flex;height:100vh;min-height:0}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{padding:14px 20px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
  .top h1{margin:0;font-size:19px;letter-spacing:-.01em}
  .top .sub{margin:2px 0 0;color:var(--ink-muted);font-size:13px}
  .top-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
  .tabs{display:flex;gap:6px}
  .tab{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:5px 14px;font-weight:600}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .tab[aria-selected="true"]{color:#06201b}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#06201b}}
  .spacer{flex:1}
  .btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:default}
  .stepper{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-muted)}
  .stepper b{color:var(--ink);min-width:42px;text-align:center}
  a.link{color:var(--accent);text-decoration:none;font-size:13px}
  a.link:hover{text-decoration:underline}

  .intro{margin:0;padding:10px 20px;color:var(--ink-muted);font-size:13px;border-bottom:1px solid var(--border);background:var(--surface-2)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 20px;font-size:12px;color:var(--ink-muted);border-bottom:1px solid var(--border)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .stage-wrap{flex:1;min-height:0;overflow:auto}
  .stage{position:relative;display:grid;gap:26px 46px;padding:22px 22px 60px;width:max-content;min-width:100%}
  .edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .edges path{fill:none;stroke:var(--edge);stroke-width:1.6}
  .edges path.call{stroke:var(--edge-call);stroke-dasharray:5 4}
  .edges path.active{stroke:var(--accent);stroke-width:2.4;stroke-dasharray:none}
  .edges .head{fill:var(--edge)}
  .edges .head-call{fill:var(--edge-call)}
  .elabel{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;
    background:var(--surface);border:1px solid var(--border);color:var(--ink-muted);white-space:nowrap;pointer-events:none}

  .colhead{font-size:12px;font-weight:700;color:var(--ink-muted);text-transform:none;border-bottom:2px solid var(--border);padding-bottom:6px;align-self:end}
  .cell{display:flex;flex-direction:column;gap:12px;align-self:center;justify-content:center;position:relative;z-index:1}

  .node{--k:var(--k-route);--ks:var(--k-route-soft);position:relative;background:var(--surface);border:1px solid var(--border);
    border-left:5px solid var(--k);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .08s, border-color .12s}
  .node:hover{transform:translateY(-1px);border-color:var(--k)}
  .node:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .node[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
  .node.screen{--k:var(--k-screen);--ks:var(--k-screen-soft)}
  .node.route{--k:var(--k-route);--ks:var(--k-route-soft)}
  .node.helper{--k:var(--k-helper);--ks:var(--k-helper-soft)}
  .node.db{--k:var(--k-db);--ks:var(--k-db-soft)}
  .node.config{--k:var(--k-config);--ks:var(--k-config-soft)}
  .node.later{--k:var(--k-later);--ks:var(--k-later-soft);background:var(--k-later-soft);box-shadow:none;border-style:dashed;border-left-style:solid;padding:8px 10px}
  .n-title{font-weight:700;font-size:13.5px;letter-spacing:-.01em}
  .n-plain{margin-top:3px;color:var(--ink-muted);font-size:12.5px}
  .n-reject{margin-top:6px;font-size:12px;color:var(--danger);background:var(--danger-soft);border-radius:6px;padding:3px 8px}
  .n-reject::before{content:"막히면 → ";font-weight:700}
  .n-items{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .n-item{display:flex;flex-direction:column;gap:3px}
  .n-call{overflow-wrap:anywhere;font-family:var(--mono);font-size:11.5px;color:var(--k);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{max-width:100%;text-align:left;overflow-wrap:anywhere;border:1px solid var(--border);background:var(--ks);color:var(--ink);border-radius:6px;padding:1px 7px;font-family:var(--mono);font-size:11px}
  .chip:hover{border-color:var(--k);color:var(--k)}
  .chip.file::before{content:"📄 "}
  .chip.fn::before{content:"ƒ ";color:var(--k);font-weight:700}
  .chip.snip::before{content:"▤ ";color:var(--k);font-weight:700}
  .tag-later{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--ink-muted);border:1px solid var(--border);border-radius:999px;padding:0 7px;background:var(--surface)}

  /* 코드 패널 */
  .panel{width:440px;flex:none;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
  .p-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
  .p-head h2{margin:0;font-size:15.5px;letter-spacing:-.01em}
  .p-head p{margin:4px 0 0;color:var(--ink-muted);font-size:13px}
  .p-close{display:none}
  .p-body{flex:1;min-height:0;overflow:auto;padding:12px 16px 24px}
  .hint{color:var(--ink-muted);font-size:13px}
  .hint li{margin:4px 0}
  .itabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .itab{border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:2px 9px;font-family:var(--mono);font-size:12px}
  .itab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .fileline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
  .fileline .path{font-family:var(--mono);font-size:12.5px;font-weight:700}
  .fileline .lines{font-family:var(--mono);font-size:12px;color:var(--ink-muted)}
  .alias{border:1px solid var(--border);background:var(--k-db-soft);border-radius:8px;padding:8px 10px;margin:0 0 10px;font-size:12.5px}
  .alias .route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px;font-family:var(--mono);font-size:12px}
  .alias .route span.step{padding:1px 7px;border-radius:6px;border:1px solid var(--border);background:var(--surface)}
  .alias .route span.real{border-color:var(--k-db);color:var(--k-db);font-weight:700}
  .alias .arrow{color:var(--ink-muted)}
  .codebox{border:1px solid var(--border);border-radius:8px;background:var(--code-bg);overflow:auto;max-height:62vh}
  table.code{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.2px;line-height:1.6}
  table.code td{padding:0 10px;vertical-align:top;white-space:pre}
  table.code td.ln{position:sticky;left:0;text-align:right;color:var(--code-gutter);user-select:none;background:var(--code-bg);border-right:1px solid var(--border);min-width:44px;padding-right:8px}
  table.code tr.hl td{background:var(--code-hl)}
  table.code tr.hl td.ln{background:var(--code-hl);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--code-hl-bar)}
  .t-c{color:var(--c-comment);font-style:italic}.t-d{color:var(--c-comment)}.t-s{color:var(--c-str)}.t-k{color:var(--c-kw);font-weight:600}
  .t-f{color:var(--c-fn)}.t-n{color:var(--c-num)}.t-a{color:var(--c-deco)}
  .legend-hl{margin:8px 0 0;font-size:12px;color:var(--ink-muted)}
  .legend-hl b{background:var(--code-hl);color:var(--ink);padding:0 6px;border-radius:4px}
  .flist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
  .flist button{width:100%;text-align:left;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:6px 10px}
  .flist button:hover{border-color:var(--accent)}
  .flist small{display:block;color:var(--ink-muted)}
  details.hdr{margin-top:12px;font-size:13px}
  details.hdr pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px;font-family:var(--sans);font-size:12.5px;color:var(--ink-muted)}

  @media (max-width:900px){
    .app{display:block;height:auto}
    .stage-wrap{max-height:none;overflow-x:auto}
    .panel{position:fixed;left:0;right:0;bottom:0;width:auto;height:62vh;border-left:0;border-top:2px solid var(--accent);
      box-shadow:0 -10px 30px rgba(0,0,0,.25);z-index:20;transform:translateY(105%);transition:transform .18s}
    body.open .panel{transform:none}
    .p-close{display:inline-block;position:absolute;right:12px;top:10px}
    .p-head{position:relative;padding-right:70px}
    .top{padding:12px 16px 8px}
    .stage{padding:16px 16px 70vh}
  }
  @media (prefers-reduced-motion: reduce){.node,.panel{transition:none}}
</style>
</head>

<div class="app">
  <div class="main">
    <header class="top">

        <div class="tabs" role="tablist" id="tabs"></div>

        <span class="spacer"></span>
        <a class="link" id="mdlink" href="#">📝 설명 문서 보기</a>

    <p class="intro" id="intro"></p>
    <div class="legend" aria-label="범례">
      <span><i style="background:var(--k-screen)"></i>화면 · 도착지</span>

      <span><i style="background:var(--k-helper)"></i>판단 (security · helpers)</span>

      <span><i style="background:var(--k-config)"></i>설정값</span>
      <span><i style="background:var(--k-later);opacity:.6"></i>다른 단원에서 자세히</span>

    </div>
    <div class="stage-wrap" id="stageWrap"><div class="stage" id="stage"></div></div>

  <aside class="panel" id="panel" aria-live="polite">

      <h2 id="pTitle"></h2><p id="pSub"></p>
      <button class="btn p-close" id="pClose">닫기</button>

    <div class="p-body" id="pBody"></div>
  </aside>

lert.send_lockout_alert()로 \"IP, 실패 횟수, 조치 내용\"을 담은 알림을 전송\n    3. _record_event()로 위험등급(CRITICAL)과 함께 security_events에 기록하고 상관분석 훅 호출\n       (security-risk-response-summary.md 5절 — 관리자 대시보드/이력 조회용)\n    4. lockdown.after_temporary_lock()으로 잠금 이력을 남기고 영구 잠금 승격 여부 판단(guide33)\n\n    알림을 \"잠그는 순간에 딱 한 번만\" 보내는 이유: 만약 잠긴 상태에서도 계속\n    로그인을 시도할 때마다 매번 알림을 보내면, 관리자가 알림 폭탄을 맞아 정작\n    중요한 알림을 놓치게 된다(이른바 \"알림 피로\"). 그래서 \"새로 잠기는 순간\"에만 알린다.\n\n    distinct_usernames는 detector.count_distinct_usernames()(또는 관리자용)가 센\n    \"이 IP가 최근에 시도한 서로 다른 아이디 개수\"다 — 1개면 계정 하나에 집중된\n    Brute Force, 2개 이상이면 여러 계정을 돌아가며 두드리는 Password Spraying으로\n    의심할 수 있으므로, notify/alert.py가 Slack 메시지에 이 값으로 패턴을 구분해 보여준다.\n\n    is_admin은 이 잠금이 /login이 아니라 /admin/login에서 발생했는지를 나타낸다 —\n    관리자 로그인 무차별 대입은 Brute Force/Password Spraying과 별도의 event_type으로\n    기록하고, notify/alert.py의 Slack 메시지에도 그대로 표시한다.\n    \"\"\"\n    db.create_lockout(ip, failure_count)\n    alert.send_lockout_alert(\n        ip, failure_count, datetime.now(timezone.utc), distinct_usernames, is_admin\n    )\n\n    if is_admin:\n        event_type = \"ADMIN_BRUTE_FORCE\"\n    elif distinct_usernames > 1:\n        event_type = \"PASSWORD_SPRAYING\"\n    else:\n        event_type = \"BRUTE_FORCE\"\n    _record_event(event_type, \"CRITICAL\", ip, None, failure_count, \"LOCKED\")\n\n    # 잠금 이력을 남기고, 최근 기간 안에 N번째 잠금이면 영구 잠금으로 승격한다\n    # (guide33, T1/T5). 임시 잠금 알림·이벤트 기록이 모두 끝난 뒤에 실행해서, 영구\n    # 잠금 이벤트(PERMANENT_LOCK)가 같은 사건의 \"그 다음 단계\"로 기록되게 한다.\n    lockdown.after_temporary_lock(\"ip\", ip, event_type, failure_count)", "alias": {"call": "soar.enforce_lockout()", "via": "security/soar/__init__.py", "real": "security/soar/lockouts.py"}}, "security/lockdown.py:after_temporary_lock": {"path": "security/lockdown.py", "start": 141, "end": 179, "lang": "python", "code": "def after_temporary_lock(\n    target_kind: str,\n    target_value: str,\n    source_event_type: str,\n    failure_count: int = 0,\n    triggering_ip: str = \"-\",\n) -> None:\n    \"\"\"임시 잠금이 방금 걸린 직후 호출된다: 이력을 한 줄 남기고, 최근 기간 안의 잠금\n    횟수가 기준 이상이면 영구 잠금으로 승격한다(T1/T2/T5).\n\n    횟수는 lock_history에서 센다 — lockouts는 같은 IP를 upsert로 덮어써서 횟수를 셀 수 없다.\n    \"\"\"\n    db.insert_lock_history(target_kind, target_value, \"TEMPORARY\", \"THRESHOLD\", source_event_type)\n    window = config.PERMANENT_LOCK_STRIKE_WINDOW_DAYS\n\n    if target_kind == \"ip\":\n        event_types = (\n            _ADMIN_LOGIN_EVENT_TYPES if source_event_type == \"ADMIN_BRUTE_FORCE\" else _USER_LOGIN_EVENT_TYPES\n        )\n        strikes = db.count_lock_history(\"ip\", target_value, window, event_types)\n        if strikes >= config.PERMANENT_LOCK_STRIKE_COUNT:\n            # 관리자 로그인 무차별 대입(T5)은 위험도가 가장 높아 이메일 복구 대상이 아니다.\n            recoverable = \"ADMIN_ONLY\" if source_event_type == \"ADMIN_BRUTE_FORCE\" else \"EXEMPTION\"\n            promote_ip(target_value, \"REPEAT_OFFENDER\", recoverable, strikes=strikes)\n        return\n\n    strikes = db.count_lock_history(\"account\", target_value, window)\n    row = db.get_account_lockout_row(target_value) or {}\n    # 이메일 복구 직후 보호관찰 기간(기본 24시간) 안에 다시 잠기면, 본인 인증 수단이\n    # 공격자에게 넘어갔을 수 있다고 보고 횟수와 무관하게 관리자 전용 영구 잠금으로 올린다.\n    if _in_probation(row):\n        promote_account(\n            target_value, \"REPEAT_OFFENDER\", \"ADMIN_ONLY\", triggering_ip=triggering_ip, strikes=strikes,\n            note=\"이메일 복구 보호관찰 기간 중 재잠금\",\n        )\n    elif strikes >= config.PERMANENT_LOCK_ACCOUNT_STRIKE_COUNT:\n        promote_account(\n            target_value, \"REPEAT_OFFENDER\", \"SELF\", triggering_ip=triggering_ip, strikes=strikes\n        )", "alias": null}, "db/lock_history.py:insert_lock_history": {"path": "db/lock_history.py", "start": 16, "end": 41, "lang": "python", "code": "def insert_lock_history(\n    target_kind: str,\n    target_value: str,\n    lock_type: str,\n    trigger_reason: str,\n    source_event_type: str | None = None,\n    incident_id: int | None = None,\n    trigger_note: str | None = None,\n) -> None:\n    \"\"\"잠금이 걸린 사실을 이력에 한 줄 추가한다.\n\n    target_kind는 'ip' / 'account' / 'admin_account'(관리자 계정, guide38), lock_type은 'TEMPORARY'/'PERMANENT',\n    trigger_reason은 THRESHOLD / REPEAT_OFFENDER / SIEM_CRITICAL / SIEM_HIGH /\n    NETWORK_IDS / ADMIN_MANUAL 중 하나다(docs/schema.sql의 CHECK 제약과 같다).\n    \"\"\"\n    db.get_client().table(\"lock_history\").insert(\n        {\n            \"target_kind\": target_kind,\n            \"target_value\": target_value,\n            \"lock_type\": lock_type,\n            \"trigger_reason\": trigger_reason,\n            \"source_event_type\": source_event_type,\n            \"incident_id\": incident_id,\n            \"trigger_note\": trigger_note,\n        }\n    ).execute()", "alias": {"call": "db.insert_lock_history()", "via": "db/__init__.py", "real": "db/lock_history.py"}}, "db/lock_history.py:count_lock_history": {"path": "db/lock_history.py", "start": 44, "end": 68, "lang": "python", "code": "def count_lock_history(\n    target_kind: str,\n    target_value: str,\n    days: int,\n    source_event_types: list[str] | None = None,\n) -> int:\n    \"\"\"이 대상이 최근 `days`일 안에 \"임시 잠금\"으로 몇 번 잠겼는지 센다.\n\n    TEMPORARY 이력만 센다 — 영구 승격 기록(PERMANENT)까지 세면 한 번의 승격이\n    \"잠금 1회 추가\"로 이중 계산된다. source_event_types를 주면 그 유형(예:\n    ADMIN_BRUTE_FORCE)으로 잠긴 횟수만 센다(T5는 관리자 로그인 잠금끼리만 센다).\n    \"\"\"\n    cutoff = (datetime.now(timezone.utc) - timedelta(days=days)).isoformat()\n    query = (\n        db.get_client()\n        .table(\"lock_history\")\n        .select(\"id\", count=\"exact\")\n        .eq(\"target_kind\", target_kind)\n        .eq(\"target_value\", target_value)\n        .eq(\"lock_type\", \"TEMPORARY\")\n        .gte(\"locked_at\", cutoff)\n    )\n    if source_event_types:\n        query = query.in_(\"source_event_type\", source_event_types)\n    return query.execute().count or 0", "alias": {"call": "db.count_lock_history()", "via": "db/__init__.py", "real": "db/lock_history.py"}}, "config.py:171-175": {"path": "config.py", "start": 171, "end": 175, "lang": "python", "code": "PERMANENT_LOCK_STRIKE_COUNT = int(os.environ.get(\"PERMANENT_LOCK_STRIKE_COUNT\", 2))\n# 계정(아이디) 영구 잠금 기준 횟수 — 공격자가 피해자 계정을 노려 일부러 영구 잠금을 일으킬\n# 수 있어서 IP와 따로 조절할 수 있게 분리했다(필요하면 3 이상으로 올린다).\nPERMANENT_LOCK_ACCOUNT_STRIKE_COUNT = int(os.environ.get(\"PERMANENT_LOCK_ACCOUNT_STRIKE_COUNT\", 2))\nPERMANENT_LOCK_STRIKE_WINDOW_DAYS = int(os.environ.get(\"PERMANENT_LOCK_STRIKE_WINDOW_DAYS\", 30))", "alias": null}, "security/lockdown.py:_in_probation": {"path": "security/lockdown.py", "start": 182, "end": 189, "lang": "python", "code": "def _in_probation(account_lockout_row: dict) -> bool:\n    until = account_lockout_row.get(\"probation_until\")\n    if not until:\n        return False\n    until_dt = datetime.fromisoformat(until)\n    if until_dt.tzinfo is None:\n        until_dt = until_dt.replace(tzinfo=timezone.utc)\n    return until_dt > datetime.now(timezone.utc)", "alias": null}, "security/lockdown.py:promote_ip": {"path": "security/lockdown.py", "start": 83, "end": 106, "lang": "python", "code": "def promote_ip(\n    ip: str,\n    reason: str,\n    recoverable: str,\n    incident_id: int | None = None,\n    strikes: int | None = None,\n    note: str | None = None,\n) -> bool:\n    \"\"\"이 IP를 영구 잠금으로 올린다. 실제로 바뀌었을 때만 True(알림·이벤트도 그때만 나간다).\n\n    허용 목록 IP는 거부한다. 이미 영구 잠금인 IP도 False를 돌려준다 — 같은 IP에 대해\n    사건 이벤트가 하나씩 더 붙을 때마다 알림이 반복되는 \"알림 피로\"를 막는다.\n    \"\"\"\n    if is_ip_allowlisted(ip):\n        return False\n    if not db.promote_lockout_permanent(ip, reason, recoverable, failure_count=strikes or 0):\n        return False\n\n    db.insert_lock_history(\n        \"ip\", ip, \"PERMANENT\", reason, incident_id=incident_id, trigger_note=note\n    )\n    _record_permanent_lock_event(ip, strikes or 1, None, correlate_event=True)\n    alert.send_permanent_lock_alert(\"ip\", ip, reason, recoverable, strikes)\n    return True", "alias": null}, "security/lockdown.py:is_ip_allowlisted": {"path": "security/lockdown.py", "start": 36, "end": 42, "lang": "python", "code": "def is_ip_allowlisted(ip: str) -> bool:\n    \"\"\"이 IP가 \"절대 영구 잠그지 않는 목록\"(관리자 PC 등)에 있는지.\n\n    양쪽을 같은 단위로 정규화해서 비교한다(guide42) — 요청 IP는 IPv6면 /64 대역 키로 들어오므로,\n    .env에 관리자 PC의 IPv6 전체 주소를 적어도 같은 대역이면 허용 목록으로 인정된다.\"\"\"\n    key = normalize_ip(ip)\n    return any(normalize_ip(entry) == key for entry in config.PERMANENT_LOCK_IP_ALLOWLIST)", "alias": null}, "db/lockouts.py:promote_lockout_permanent": {"path": "db/lockouts.py", "start": 64, "end": 114, "lang": "python", "code": "def promote_lockout_permanent(\n    ip: str, reason: str, recoverable: str, failure_count: int = 0\n) -> bool:\n    \"\"\"이 IP의 잠금을 영구 잠금(PERMANENT)으로 올린다. 실제로 바뀌었을 때만 True.\n\n    1) 지금 active인 TEMPORARY 행이 있으면 그 행을 조건부 UPDATE로 승격한다\n       (WHERE lock_type='TEMPORARY' AND active — 두 요청이 동시에 와도 먼저 온 쪽만\n       행을 바꾸고, 늦은 쪽은 0행이라 False를 받는다. recovery 토큰 소비와 같은 원리).\n    2) 그런 행이 없으면 — 이미 active인 영구 행이면 False, 행이 아예 없거나 풀린\n       상태(사건 기반 승격 T3/T4처럼 잠금 행이 없던 IP)면 영구 행을 새로 만든다.\n    \"\"\"\n    now_iso = db._now_iso()\n    res = (\n        db.get_client()\n        .table(\"lockouts\")\n        .update(\n            {\n                \"lock_type\": \"PERMANENT\",\n                \"unlock_at\": None,\n                \"recoverable\": recoverable,\n                \"permanent_reason\": reason,\n                \"promoted_at\": now_iso,\n            }\n        )\n        .eq(\"ip_address\", ip)\n        .eq(\"lock_type\", \"TEMPORARY\")\n        .eq(\"active\", True)\n        .execute()\n    )\n    if res.data:\n        return True\n\n    existing = get_lockout_row(ip)\n    if existing and existing.get(\"active\") and existing.get(\"lock_type\") == \"PERMANENT\":\n        return False\n\n    db.get_client().table(\"lockouts\").upsert(\n        {\n            \"ip_address\": ip,\n            \"locked_at\": now_iso,\n            \"unlock_at\": None,\n            \"failure_count\": (existing or {}).get(\"failure_count\", failure_count),\n            \"active\": True,\n            \"lock_type\": \"PERMANENT\",\n            \"recoverable\": recoverable,\n            \"permanent_reason\": reason,\n            \"promoted_at\": now_iso,\n        },\n        on_conflict=\"ip_address\",\n    ).execute()\n    return True", "alias": {"call": "db.promote_lockout_permanent()", "via": "db/__init__.py", "real": "db/lockouts.py"}}, "notify/alert.py:send_permanent_lock_alert": {"path": "notify/alert.py", "start": 270, "end": 285, "lang": "python", "code": "def send_permanent_lock_alert(\n    target_kind: str, target_value: str, reason: str, recoverable: str, strikes: int | None = None\n) -> None:\n    \"\"\"영구 잠금이 새로 걸렸을 때 Slack에 알린다. 승격은 조건부 UPDATE로 \"실제로 바뀐\n    순간\"에만 일어나므로(db.promote_lockout_permanent), 이 알림도 딱 한 번만 나간다.\"\"\"\n    kind_label = \"IP\" if target_kind == \"ip\" else \"계정\"\n    strikes_line = f\"\\n최근 잠금 횟수: {strikes}회\" if strikes else \"\"\n    message = (\n        \":no_entry: [CRITICAL] 로그인 워치독 영구 잠금 알림\\n\"\n        f\"대상({kind_label}): {target_value}\\n\"\n        f\"승격 사유: {_PERMANENT_REASON_LABELS.get(reason, reason)}\"\n        f\"{strikes_line}\\n\"\n        f\"복구 방식: {_RECOVERABLE_LABELS.get(recoverable, recoverable)}\\n\"\n        \"조치: 자동 만료 없는 영구 잠금, 관리자 대시보드 '현재 잠긴 IP / 계정' 카드에서 확인\"\n    )\n    _send_slack_message(message)", "alias": null}, "security/lockdown.py:promote_account": {"path": "security/lockdown.py", "start": 109, "end": 138, "lang": "python", "code": "def promote_account(\n    username: str,\n    reason: str,\n    recoverable: str,\n    triggering_ip: str = \"-\",\n    strikes: int | None = None,\n    note: str | None = None,\n) -> bool:\n    \"\"\"이 계정을 영구 잠금으로 올린다. 실제로 바뀌었을 때만 True.\n\n    - 가입되지 않은 아이디는 승격하지 않는다 — 공격자가 아무 아이디나 넣어서 영구 잠금\n      행을 무한히 만들어내는 걸 막는다(임시 잠금까지만 걸린다).\n    - 이메일을 신뢰할 수 없는 계정(email_status=UNDELIVERABLE)은 이메일로 풀 수 없게\n      recoverable을 ADMIN_ONLY로 올린다.\n    \"\"\"\n    user = db.get_user_by_username(username)\n    if user is None:\n        return False\n    if user.get(\"email_status\") == \"UNDELIVERABLE\":\n        recoverable = \"ADMIN_ONLY\"\n\n    if not db.promote_account_lockout_permanent(username, reason, recoverable, failure_count=strikes or 0):\n        return False\n\n    db.insert_lock_history(\"account\", username, \"PERMANENT\", reason, trigger_note=note)\n    # 계정 단위 이벤트는 특정 IP가 아니라 \"이 계정이 공격받았다\"는 뜻이라 상관분석에는\n    # 보내지 않는다(요청 IP를 사건에 끌어들이면 무관한 IP가 사건에 섞인다).\n    _record_permanent_lock_event(triggering_ip, strikes or 1, username, correlate_event=False)\n    alert.send_permanent_lock_alert(\"account\", username, reason, recoverable, strikes)\n    return True", "alias": null}, "db/account_lockouts.py:promote_account_lockout_permanent": {"path": "db/account_lockouts.py", "start": 66, "end": 110, "lang": "python", "code": "def promote_account_lockout_permanent(\n    username: str, reason: str, recoverable: str, failure_count: int = 0\n) -> bool:\n    \"\"\"이 계정의 잠금을 영구 잠금으로 올린다. 실제로 바뀌었을 때만 True\n    (db.promote_lockout_permanent()의 계정 버전).\"\"\"\n    now_iso = db._now_iso()\n    res = (\n        db.get_client()\n        .table(\"account_lockouts\")\n        .update(\n            {\n                \"lock_type\": \"PERMANENT\",\n                \"unlock_at\": None,\n                \"recoverable\": recoverable,\n                \"permanent_reason\": reason,\n                \"promoted_at\": now_iso,\n            }\n        )\n        .eq(\"username\", username)\n        .eq(\"lock_type\", \"TEMPORARY\")\n        .eq(\"active\", True)\n        .execute()\n    )\n    if res.data:\n        return True\n\n    existing = get_account_lockout_row(username)\n    if existing and existing.get(\"active\") and existing.get(\"lock_type\") == \"PERMANENT\":\n        return False\n\n    db.get_client().table(\"account_lockouts\").upsert(\n        {\n            \"username\": username,\n            \"locked_at\": now_iso,\n            \"unlock_at\": None,\n            \"failure_count\": (existing or {}).get(\"failure_count\", failure_count),\n            \"active\": True,\n            \"lock_type\": \"PERMANENT\",\n            \"recoverable\": recoverable,\n            \"permanent_reason\": reason,\n            \"promoted_at\": now_iso,\n        },\n        on_conflict=\"username\",\n    ).execute()\n    return True", "alias": {"call": "db.promote_account_lockout_permanent()", "via": "db/__init__.py", "real": "db/account_lockouts.py"}}, "security/correlate.py:check_and_correlate": {"path": "security/correlate.py", "start": 39, "end": 63, "lang": "python", "code": "def check_and_correlate(ip: str, event_type: str, severity: str) -> None:\n    \"\"\"방금 security_events에 기록된 이벤트를 계기로, 이 IP가 최근\n    config.INCIDENT_CORRELATION_WINDOW_MINUTES분 안에 서로 다른 event_type을\n    2개 이상 남겼는지 확인한다.\n\n    2개 미만(=이 이벤트 하나뿐)이면 아무 것도 하지 않는다 — 단발성 이벤트까지\n    전부 \"사건\"으로 묶으면 security_incidents가 security_events와 다를 바\n    없어진다. 2개 이상이면 db.record_incident()로 사건을 열거나 갱신하고,\n    그 결과가 에스컬레이션 조건을 넘는지 이어서 확인한다.\n    \"\"\"\n    distinct_types = db.get_recent_distinct_event_types(\n        ip, config.INCIDENT_CORRELATION_WINDOW_MINUTES\n    )\n    if len(distinct_types) < 2:\n        return\n    incident = db.record_incident(ip, distinct_types, severity)\n    _maybe_escalate(ip, incident)\n\n    # 영구 잠금(guide33). 영구 잠금 이벤트 자체는 사건의 \"결과\"이므로 다시 승격을 시도하지\n    # 않는다(승격이 승격을 부르는 재귀 방지) — 대신 설정이 켜져 있으면 사건을 자동으로 닫는다.\n    # 그 외 이벤트는 사건 위험등급(T3 CRITICAL / T4 HIGH)에 따라 승격을 판단한다.\n    if event_type == lockdown.PERMANENT_LOCK_EVENT_TYPE:\n        lockdown.close_incident_if_configured(incident)\n    else:\n        lockdown.consider_incident_promotion(ip, incident)", "alias": null}, "security/lockdown.py:close_incident_if_configured": {"path": "security/lockdown.py", "start": 223, "end": 227, "lang": "python", "code": "def close_incident_if_configured(incident: dict) -> None:\n    \"\"\"PERMANENT_LOCK_AUTO_CLOSE_INCIDENT가 true일 때만, 영구 잠금 이벤트가 병합된 사건을\n    시스템 계정으로 자동 CLOSED 처리한다(기본 false — 관리자가 직접 \"해결\"을 누른다).\"\"\"\n    if config.PERMANENT_LOCK_AUTO_CLOSE_INCIDENT:\n        db.close_incident_system(incident[\"id\"], \"system:permanent_lock\")", "alias": null}, "security/lockdown.py:consider_incident_promotion": {"path": "security/lockdown.py", "start": 192, "end": 220, "lang": "python", "code": "def consider_incident_promotion(ip: str, incident: dict) -> None:\n    \"\"\"상관분석 사건의 최고 위험등급에 따라 영구 잠금을 건다(T3/T4).\n\n    CRITICAL → 즉시 승격. HIGH → PERMANENT_LOCK_AUTO_ON_HIGH가 true면 승격, 아니면\n    관리자 승인 대기(access_requests)로 올린다(Human-in-the-loop). 이미 영구 잠금인\n    IP나 허용 목록 IP는 건너뛴다.\n    \"\"\"\n    severity = incident.get(\"severity_max\")\n    if severity not in (\"CRITICAL\", \"HIGH\") or is_ip_allowlisted(ip):\n        return\n\n    if severity == \"CRITICAL\":\n        promote_ip(ip, \"SIEM_CRITICAL\", \"EXEMPTION\", incident_id=incident.get(\"id\"))\n        return\n\n    if config.PERMANENT_LOCK_AUTO_ON_HIGH:\n        promote_ip(ip, \"SIEM_HIGH\", \"EXEMPTION\", incident_id=incident.get(\"id\"))\n        return\n\n    if is_permanent_ip(ip) or db.get_pending_request(\"SIEM_HIGH_INCIDENT\", \"ip\", ip) is not None:\n        return\n    event_types = incident.get(\"event_types\") or []\n    reason = f\"SIEM 상관분석 사건이 HIGH 등급에 도달 (관련 유형: {', '.join(event_types)})\"\n    db.insert_pending_request(\n        \"SIEM_HIGH_INCIDENT\", \"PERMANENT_LOCK_IP\", \"ip\", ip, len(event_types), 2, reason\n    )\n    alert.send_pending_approval_alert(\n        \"SIEM HIGH 사건 → 영구 잠금 후보\", \"ip\", ip, len(event_types), 2, reason\n    )", "alias": null}, "db/access_requests.py:insert_pending_request": {"path": "db/access_requests.py", "start": 76, "end": 115, "lang": "python", "code": "def insert_pending_request(\n    event_type: str,\n    pending_action: str,\n    target_kind: str,\n    target_value: str,\n    count: int,\n    threshold: int,\n    llm_reason: str,\n    path: str | None = None,\n    context_count: int | None = None,\n    context_ip: str | None = None,\n) -> None:\n    \"\"\"LLM이 \"지켜볼 필요가 있다\"고 판단한 건을 PENDING 요청으로 새로 등록한다.\n\n    idx_access_requests_open_target 부분 유니크 인덱스(docs/schema.sql)가\n    \"같은 유형·대상에는 PENDING이 동시에 2개 있을 수 없음\"을 DB가 직접\n    강제한다 — get_pending_request()로 미리 확인한 순간과 이 삽입 순간 사이의\n    아주 짧은 틈에 동시 요청이 겹치는 경쟁 조건을, db.record_incident()와\n    동일한 방식(23505 충돌을 붙잡아 조용히 무시)으로 막는다. 이미 같은 건이\n    있다는 뜻이므로 새로 만들지 않고 그냥 넘어가도 안전하다.\n    \"\"\"\n    try:\n        db.get_client().table(\"access_requests\").insert(\n            {\n                \"event_type\": event_type,\n                \"pending_action\": pending_action,\n                \"target_kind\": target_kind,\n                \"target_value\": target_value,\n                \"path\": path,\n                \"count\": count,\n                \"threshold\": threshold,\n                \"context_count\": context_count,\n                \"context_ip\": context_ip,\n                \"llm_reason\": llm_reason,\n                \"status\": \"PENDING\",\n            }\n        ).execute()\n    except APIError as e:\n        if e.code != \"23505\":\n            raise", "alias": {"call": "db.insert_pending_request()", "via": "db/__init__.py", "real": "db/access_requests.py"}}, "routes/auth.py:login_submit": {"path": "routes/auth.py", "start": 196, "end": 315, "lang": "python", "code": "@auth_bp.route(\"/login\", methods=[\"POST\"])\ndef login_submit():\n    \"\"\"로그인 폼 제출을 처리한다. 이 함수 하나가 이 프로젝트의 핵심 흐름을 담당한다.\n\n    처리 순서:\n    1. 혹시 자동으로 풀어줘야 할 만료된 잠금(IP 단위 + 계정 단위)이 있으면 먼저 정리한다.\n    2. 이번 요청을 보낸 IP와 입력된 아이디를 알아낸다.\n    3. 이 IP가 지금 잠긴 상태이거나, 이 계정 자체가 (다른 IP들이 나눠서 공격해서)\n       잠긴 상태라면 아이디/비밀번호를 확인하지도 않고 곧바로 거부한다. 단, 영구 잠금된\n       IP는 이메일 복구로 예외를 받은 \"본인 + 본인 기기\"만 통과시킨다(guide33/34-a).\n    4. 잠긴 상태가 아니라면 실제로 아이디/비밀번호를 확인하고, 그 시도를 기록한다.\n    5. 실패했다면 \"혹시 이 IP가 수상한 수준(5회 초과)이 됐는지\"를 먼저 보고,\n       아니라면 \"혹시 이 계정이 여러 IP에 걸쳐 총합으로 수상한 수준(8회 초과)이\n       됐는지\"도 본다 — 전자는 soar.enforce_lockout(IP 잠금), 후자는\n       soar.enforce_account_lockout(계정 잠금)이 알림까지 같이 보낸다\n       (L7 공격 보강 계획 Tier 1: 분산/저속 브루트포스 대응). 둘 다 아직 기준치 아래지만\n       코앞이면 LLM 조기 경보를 판단한다(guide31).\n    6. 성공했다면 회원 세션을 만들어서 회원 대시보드로 이동시킨다(12단계에서 추가).\n    \"\"\"\n    # 1) 시간이 지나 자동으로 풀려야 할 잠금들을 정리 (IP 단위 + 계정 단위)\n    soar.try_release_expired_lockouts()\n    soar.try_release_expired_account_lockouts()\n\n    ip = get_request_ip()\n    username = request.form.get(\"username\", \"\")\n    password = request.form.get(\"password\", \"\")\n\n    # 허니팟 필드가 채워져 있으면 사람이 아니라 자동화 스크립트라고 보고,\n    # 자격 증명 확인/시도 기록 없이 즉시 거부한다 (L7 공격 보강 계획 Tier 3).\n    if is_bot_submission():\n        soar.notify_bot_detected(ip, request.path)\n        flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n        return render_template(\"login_form.html\", form_action=url_for(\"auth.login_submit\"))\n\n    # 2) 이미 잠긴 IP이거나, 이미 잠긴 계정이라면 검증 자체를 건너뛰고 즉시 거부\n    #    — 단, 영구 잠금된 IP는 \"이메일 복구로 예외를 받은 본인+본인 기기\"만 통과시킨다(guide33).\n    exemption = None\n    if detector.is_locked(ip):\n        if detector.get_ip_lock_state(ip) != detector.LOCK_STATE_PERMANENT:\n            flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n            return _login_form()\n        exemption = _find_ip_exemption(ip, username)\n        if exemption is None:\n            flash(\"이 네트워크는 차단되어 있습니다. 본인이라면 아래 '본인 인증으로 접속 허용'을 이용해주세요.\")\n            return _login_form(recovery_link=True)\n        # 예외가 있으면 IP 잠금 안내 없이 아래 계정 잠금 확인과 정상적인 비밀번호 확인으로 계속 진행한다.\n\n    if detector.is_account_locked(username):\n        flash(ACCOUNT_LOCKED_MESSAGE)\n        return _login_form(recovery_link=True)\n\n    success = db.verify_user_credentials(username, password)\n    db.log_attempt(ip, username, success)\n\n    if success:\n        # 관리자 세션(\"admin_username\")과는 완전히 다른 키(\"username\")를 쓴다 —\n        # 그래야 같은 브라우저에서 관리자 세션이 있더라도 서로 섞이지 않는다.\n        # user_id도 같이 저장해두는 이유는 member_login_required 문지기 뒤에서\n        # \"아이디\"가 아니라 변하지 않는 \"번호\"로 본인 행을 정확히 찾기 위해서다.\n        user = db.get_user_by_username(username)\n        session[\"username\"] = username\n        session[\"user_id\"] = user[\"id\"]\n        # 세션 세대 번호 — 나중에 비밀번호가 바뀌면 이 세션을 끊는 데 쓴다(guide35).\n        session[\"session_version\"] = user.get(\"session_version\") or 0\n        return redirect(url_for(\"member.member_dashboard\"))\n\n    # 영구 잠금 예외로 통과한 사용자가 연달아 실패하면 그 예외를 회수한다 — 예외는 \"본인이\n    # 비밀번호를 아는 상황\"을 전제로 한 출입증이라, 계속 틀리는 건 도용 신호로 본다.\n    # (예외 통과자의 실패는 IP 임계값 판정으로 넘기지 않는다 — 이 IP는 이미 영구 잠금 중이라\n    # enforce_lockout()이 5분 잠금 알림을 또 보내는 일이 없도록 하기 위해서다.)\n    if exemption is not None:\n        if db.count_recent_failures(ip) >= config.IP_EXEMPTION_MAX_FAILURES:\n            db.revoke_ip_exemption(exemption[\"id\"], \"예외 통과 후 연속 로그인 실패\")\n        flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n        return _login_form()\n\n    # 실패했다면, 먼저 이 IP가 방금 임계값을 넘었는지 확인한다.\n    suspicious, failure_count = detector.is_suspicious(ip)\n    if suspicious:\n        # 최근 실패에 쓰인 아이디가 몇 개였는지도 함께 세서, Slack 알림이 Brute\n        # Force(계정 1개 집중)와 Password Spraying(계정 여러 개 순회)을 구분해\n        # 표시할 수 있게 한다 (attack_response_state.md 구현 대상 #5).\n        distinct_usernames = detector.count_distinct_usernames(ip)\n        soar.enforce_lockout(ip, failure_count, distinct_usernames)\n        flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n    else:\n        # 아직 기준치(FAILURE_THRESHOLD)는 안 넘었지만 코앞이면, LLM에게 조기\n        # 경보 여부를 물어본다 (Track A, guide31). 공격자가 임계값을 살짝\n        # 피해 가려고 실패 횟수를 일부러 코앞에서 멈추는 패턴을 이 구간에서 잡는다.\n        if failure_count >= config.FAILURE_THRESHOLD - config.EARLY_WARNING_BAND:\n            distinct_usernames = detector.count_distinct_usernames(ip)\n            soar.consider_early_warning(\n                \"BRUTE_FORCE\", \"LOCK_IP\", \"ip\", ip, failure_count, config.FAILURE_THRESHOLD,\n                context_count=distinct_usernames,\n            )\n\n        # IP 단위로는 아직 수상하지 않더라도, 이 계정이 여러 IP에 걸쳐 나뉘어서\n        # 총합 기준으로 수상한 수준이 됐는지 확인한다 — 공격자가 IP를 돌려가며\n        # (봇넷/프록시 로테이션) 한 계정만 노리는 분산 브루트포스를 잡아낸다.\n        account_suspicious, account_failure_count = detector.is_account_suspicious(username)\n        if account_suspicious:\n            distinct_ips = detector.count_distinct_ips_by_username(username)\n            soar.enforce_account_lockout(username, account_failure_count, distinct_ips, ip)\n            flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n        else:\n            # 이 계정도 마찬가지로 임계값(ACCOUNT_FAILURE_THRESHOLD) 코앞이면\n            # 조기 경보 대상이다 — 여러 IP에 나눠 시도하되 각 IP·계정 총합\n            # 모두를 임계값 아래로 유지하려는 패턴을 잡아낸다.\n            if account_failure_count >= config.ACCOUNT_FAILURE_THRESHOLD - config.EARLY_WARNING_BAND:\n                distinct_ips = detector.count_distinct_ips_by_username(username)\n                soar.consider_early_warning(\n                    \"DISTRIBUTED_BRUTE_FORCE\", \"LOCK_ACCOUNT\", \"account\", username,\n                    account_failure_count, config.ACCOUNT_FAILURE_THRESHOLD,\n                    context_count=distinct_ips, context_ip=ip,\n                )\n            # 사용자 존재 여부(아이디가 없는지, 비밀번호만 틀렸는지)를 구분해서\n            # 알려주면 공격자에게 힌트를 주게 되므로, 항상 똑같은 문구로만 실패를 알린다.\n            flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n\n    return render_template(\"login_form.html\", form_action=url_for(\"auth.login_submit\"))", "alias": null}, "db/lockouts.py:get_active_lockout": {"path": "db/lockouts.py", "start": 176, "end": 198, "lang": "python", "code": "def get_active_lockout(ip: str) -> dict | None:\n    \"\"\"이 IP가 \"지금 이 순간\" 실제로 잠겨있는지 확인하고, 잠겨있다면 그 잠금 정보를 돌려준다.\n\n    조건이 두 가지 다 맞아야 \"진짜로 잠긴 상태\"로 인정한다:\n    - active가 True (아직 해제되지 않았고)\n    - 영구 잠금(lock_type='PERMANENT', unlock_at이 NULL)이거나, unlock_at(풀리는\n      시각)이 지금보다 미래 (아직 시간이 안 지났고)\n\n    unlock_at만 보면 영구 잠금(NULL)이 \"안 잠김\"으로 판정되므로 or_ 조건이 필수다(guide33).\n\n    두 조건을 만족하는 기록이 없으면 None(없음)을 돌려준다.\n    \"\"\"\n    res = (\n        db.get_client()\n        .table(\"lockouts\")\n        .select(\"*\")\n        .eq(\"ip_address\", ip)\n        .eq(\"active\", True)\n        .or_(f\"lock_type.eq.PERMANENT,unlock_at.gt.{db._now_iso()}\")  # gt = \"~보다 미래\"\n        .limit(1)\n        .execute()\n    )\n    return res.data[0] if res.data else None  # 결과가 있으면 첫 번째 줄, 없으면 None", "alias": {"call": "db.get_active_lockout()", "via": "db/__init__.py", "real": "db/lockouts.py"}}, "security/detector.py:get_ip_lock_state": {"path": "security/detector.py", "start": 241, "end": 243, "lang": "python", "code": "def get_ip_lock_state(ip: str) -> str:\n    \"\"\"이 IP의 잠금 상태를 NONE / TEMPORARY / PERMANENT 중 하나로 알려준다.\"\"\"\n    return _state_from_row(db.get_active_lockout(ip))", "alias": null}, "routes/auth.py:signup_submit": {"path": "routes/auth.py", "start": 64, "end": 153, "lang": "python", "code": "@auth_bp.route(\"/signup\", methods=[\"POST\"])\ndef signup_submit():\n    \"\"\"회원가입 폼에서 \"가입하기\" 버튼을 눌렀을 때 실제로 처리하는 부분.\n\n    GET(화면 보여주기)과 POST(데이터 제출 처리)를 같은 주소(/signup)에 대해\n    따로 등록해두는 것이 Flask에서 아주 흔한 패턴이다 — \"이 주소를 그냥 방문하면\n    빈 폼을 보여주고, 이 주소로 폼 데이터를 제출하면 그때는 처리 로직을 실행해라\"\n    는 뜻이다.\n    \"\"\"\n    # 화면에서 폼 자체를 숨겨뒀더라도, 누군가 개발자 도구 등으로 이 주소에 직접\n    # 요청을 보낼 수 있으므로 서버 쪽에서도 다시 한번 막아준다(이중 안전장치).\n    if not db.get_signup_enabled():\n        flash(\"현재 회원가입이 잠시 중단되어 있습니다.\")\n        return render_template(\"signup.html\", signup_enabled=False)\n\n    ip = get_request_ip()\n\n    # 허니팟 필드가 채워져 있으면 사람이 아니라 자동화 스크립트라고 보고,\n    # 시도 기록조차 남기지 않고 즉시 거부한다 (L7 공격 보강 계획 Tier 3).\n    if is_bot_submission():\n        soar.notify_bot_detected(ip, request.path)\n        flash(\"일시적인 오류가 발생했습니다. 다시 시도해주세요.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    # 영구 잠금된 IP는 가입도 막는다 — 공격자가 새 계정을 만들어 자기 IP의 예외를\n    # 받아내는 경로를 차단한다(guide33). 일반 임시 잠금(5분)은 가입을 막지 않는다.\n    if detector.get_ip_lock_state(ip) == detector.LOCK_STATE_PERMANENT:\n        flash(\"현재 이 네트워크에서는 회원가입을 할 수 없습니다. 관리자에게 문의해주세요.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    # 같은 IP가 짧은 시간에 너무 많이 가입을 시도하면 거부한다 — 이전에는 이 주소에\n    # 요청 빈도 제한이 전혀 없어서, 스크립트로 계정을 무제한 찍어낼 수 있었다\n    # (18단계 보안 점검에서 발견 및 보완). 성공/실패와 무관하게 시도 자체를 세므로,\n    # 검증에서 계속 걸러지는 값을 반복 제출하는 남용도 함께 막는다.\n    rate_limited, signup_count = detector.is_signup_rate_limited(ip)\n    if rate_limited:\n        soar.record_rejection(\"SIGNUP_RATE_LIMIT\", ip, request.path, config.SIGNUP_RATE_LIMIT)\n        flash(\"너무 많은 가입 시도가 감지되었습니다. 잠시 후 다시 시도해주세요.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n    # 아직 기준치(SIGNUP_RATE_LIMIT)는 안 넘었지만 코앞이면, LLM에게 조기 경보\n    # 여부를 물어본다 (Track A, guide31 — config.EARLY_WARNING_BAND 설명 참고).\n    if signup_count >= config.SIGNUP_RATE_LIMIT - config.EARLY_WARNING_BAND:\n        soar.consider_early_warning(\n            \"SIGNUP_RATE_LIMIT\", \"ALERT_ONLY\", \"ip\", ip, signup_count, config.SIGNUP_RATE_LIMIT,\n            path=request.path,\n        )\n    db.log_signup_attempt(ip)\n\n    username = request.form.get(\"username\", \"\").strip()\n    email = request.form.get(\"email\", \"\").strip()\n    password = request.form.get(\"password\", \"\")\n    password_confirm = request.form.get(\"password_confirm\", \"\")\n\n    if not username or not email or not password:\n        flash(\"아이디, 이메일, 비밀번호를 모두 입력해주세요.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    if not config.USERNAME_PATTERN.match(username):\n        flash(\"아이디는 영문자, 숫자, 밑줄(_)만 사용해 3~20자로 입력해주세요.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    if not config.EMAIL_PATTERN.match(email):\n        flash(\"올바른 이메일 형식이 아닙니다.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    if len(password) < config.MIN_PASSWORD_LENGTH:\n        flash(f\"비밀번호는 최소 {config.MIN_PASSWORD_LENGTH}자 이상이어야 합니다.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    if password != password_confirm:\n        flash(\"비밀번호와 비밀번호 확인이 일치하지 않습니다.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    created = db.create_user(username, email, password)\n    if not created:\n        flash(\"이미 사용 중인 아이디 또는 이메일입니다.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    # 가입 이메일로 인증 링크를 보낸다(guide40). 메일이 실패해도 가입은 그대로 유지한다 —\n    # 로그인한 뒤 대시보드에서 다시 보낼 수 있다.\n    try:\n        verification = email_verification.send_verification(created, ip)\n    except Exception as e:  # noqa: BLE001\n        mailer.report_failure(mailer.FAIL_INTERNAL, f\"가입 인증 메일 처리 중 오류: {type(e).__name__}\")\n        verification = email_verification.UNAVAILABLE\n    if verification == email_verification.SENT:\n        flash(\"회원가입이 완료되었습니다. 가입 이메일로 인증 메일을 보냈습니다. 로그인해주세요.\")\n    else:\n        flash(\"회원가입이 완료되었습니다. 로그인해주세요. 이메일 인증은 로그인 후 대시보드에서 할 수 있습니다.\")\n    return redirect(url_for(\"auth.login\"))", "alias": null}, "routes/admin/locks.py:api_permanent_locks_release": {"path": "routes/admin/locks.py", "start": 134, "end": 154, "lang": "python", "code": "@admin_bp.route(\"/api/permanent-locks/release\", methods=[\"POST\"])\n@require_permission(\"release_permanent_lock\")\ndef api_permanent_locks_release():\n    \"\"\"대시보드 영구 잠금 카드의 \"영구 해제\" 버튼이 호출하는 API(super_admin 전용).\n\n    사유(note)가 비어 있으면 거부한다 — \"누가 언제 왜 풀었는지\"가 lock_history에 남아야 하기\n    때문이다. 해제한 관리자는 요청 본문이 아니라 로그인 세션에서 가져온다(본문은 위조 가능).\n    \"\"\"\n    data = request.get_json(silent=True) or {}\n    kind = data.get(\"target_kind\")\n    value = (data.get(\"target_value\") or \"\").strip()\n    note = (data.get(\"note\") or \"\").strip()\n    if kind not in _PERMANENT_LOCK_KINDS or not value:\n        return jsonify({\"success\": False, \"error\": \"target_kind(ip/account)와 target_value가 필요합니다.\"}), 400\n    if not note:\n        return jsonify({\"success\": False, \"error\": \"해제 사유(note)를 입력해야 합니다.\"}), 400\n\n    released = lockdown.release(kind, value, f\"admin:{session['admin_username']}\", note)\n    if not released:\n        return jsonify({\"success\": False, \"error\": \"영구 잠금 상태가 아닌 대상입니다.\"}), 404\n    return jsonify({\"success\": True})", "alias": null}, "security/lockdown.py:release": {"path": "security/lockdown.py", "start": 234, "end": 258, "lang": "python", "code": "def release(target_kind: str, target_value: str, actor: str, note: str) -> bool:\n    \"\"\"관리자(또는 운영 스크립트)가 영구 잠금을 완전히 푼다. 실제로 풀렸을 때만 True.\n\n    actor는 호출부가 형식을 정해서 넘긴다 — 대시보드는 'admin:<관리자 아이디>',\n    터미널 스크립트는 'script:unlock_ip' 같은 값이다(lock_history.released_by에 그대로 기록).\n\n    영구 잠금이 아닌 대상(이미 풀렸거나 임시 잠금)이면 False — 호출부가 404/409로 응답한다.\n    푼 사람(actor)과 사유를 lock_history에 남기고 Slack에도 알린다.\n    연관 보안 이벤트는 정리하지만, 연관 사건(security_incidents)은 닫지 않는다 —\n    사건 해결은 관리자의 \"검토 끝\" 판단이라 별개다(guide32).\n    \"\"\"\n    if target_kind == \"ip\":\n        released = db.release_permanent_lockout(target_value)\n        if released:\n            db.resolve_security_events_for_ip(target_value)\n    else:\n        released = db.release_permanent_account_lockout(target_value)\n        if released:\n            db.resolve_security_events_for_username(target_value)\n    if not released:\n        return False\n\n    db.mark_lock_released(target_kind, target_value, actor, note)\n    alert.send_permanent_release_alert(target_kind, target_value, actor, note)\n    return True", "alias": null}, "db/lockouts.py:release_permanent_lockout": {"path": "db/lockouts.py", "start": 117, "end": 133, "lang": "python", "code": "def release_permanent_lockout(ip: str) -> bool:\n    \"\"\"active인 영구 잠금 행을 해제한다(active=False). 실제로 풀렸을 때만 True.\n\n    release_lockout()과 달리 PERMANENT인 행만 대상으로 하므로, 영구 잠금이 아닌\n    IP에 호출해도 아무 일도 일어나지 않는다(lockdown.release가 이 반환값으로 \"대상이\n    영구 잠금이 맞았는지\"를 판단한다).\n    \"\"\"\n    res = (\n        db.get_client()\n        .table(\"lockouts\")\n        .update({\"active\": False})\n        .eq(\"ip_address\", ip)\n        .eq(\"lock_type\", \"PERMANENT\")\n        .eq(\"active\", True)\n        .execute()\n    )\n    return bool(res.data)", "alias": {"call": "db.release_permanent_lockout()", "via": "db/__init__.py", "real": "db/lockouts.py"}}, "db/lock_history.py:mark_lock_released": {"path": "db/lock_history.py", "start": 71, "end": 89, "lang": "python", "code": "def mark_lock_released(\n    target_kind: str,\n    target_value: str,\n    released_by: str,\n    release_note: str | None = None,\n    lock_type: str = \"PERMANENT\",\n) -> None:\n    \"\"\"이 대상의 아직 해제 기록이 없는 `lock_type` 이력에 해제 시각·해제자를 기록한다.\n\n    released_by는 'EMAIL_RECOVERY' / 'admin:<이름>' / 'script:<이름>' 형식이다. 줄을 지우지\n    않고 \"누가 언제 풀었는가\"만 덧붙여서 감사 추적에 쓴다. 기본적으로 영구 잠금 이력만\n    대상으로 한다 — 같은 대상의 지난 5분 임시 잠금 이력까지 같이 찍으면 \"관리자가 임시\n    잠금을 풀었다\"는 잘못된 기록이 된다(실제 E2E 테스트에서 발견).\n    \"\"\"\n    db.get_client().table(\"lock_history\").update(\n        {\"released_at\": db._now_iso(), \"released_by\": released_by, \"release_note\": release_note}\n    ).eq(\"target_kind\", target_kind).eq(\"target_value\", target_value).eq(\n        \"lock_type\", lock_type\n    ).is_(\"released_at\", \"null\").execute()", "alias": {"call": "db.mark_lock_released()", "via": "db/__init__.py", "real": "db/lock_history.py"}}, "routes/admin/locks.py:api_permanent_locks_promote": {"path": "routes/admin/locks.py", "start": 100, "end": 131, "lang": "python", "code": "@admin_bp.route(\"/api/permanent-locks/promote\", methods=[\"POST\"])\n@require_permission(\"promote_permanent_lock\")\ndef api_permanent_locks_promote():\n    \"\"\"대시보드 \"영구 잠금 수동 승격\" 폼이 호출하는 API — IP나 계정을 관리자가 직접 영구 잠금한다.\n\n    수동 승격은 이메일 복구 대상이 아니라 관리자만 풀 수 있게(ADMIN_ONLY) 건다.\n    허용 목록 IP(관리자 PC 등)와 가입되지 않은 아이디는 거부한다.\n    \"\"\"\n    data = request.get_json(silent=True) or {}\n    kind = data.get(\"target_kind\")\n    value = (data.get(\"target_value\") or \"\").strip()\n    reason = (data.get(\"reason\") or \"\").strip()\n    if kind not in _PERMANENT_LOCK_KINDS or not value or not reason:\n        return jsonify({\"success\": False, \"error\": \"target_kind(ip/account), target_value, reason이 필요합니다.\"}), 400\n\n    note = f\"{session['admin_username']}: {reason}\"\n    if kind == \"ip\":\n        try:\n            ipaddress.ip_address(value)\n        except ValueError:\n            return jsonify({\"success\": False, \"error\": \"올바른 IP 주소가 아닙니다.\"}), 400\n        if lockdown.is_ip_allowlisted(value):\n            return jsonify({\"success\": False, \"error\": \"허용 목록의 IP는 영구 잠금할 수 없습니다.\"}), 400\n        promoted = lockdown.promote_ip(value, \"ADMIN_MANUAL\", \"ADMIN_ONLY\", note=note)\n    else:\n        if db.get_user_by_username(value) is None:\n            return jsonify({\"success\": False, \"error\": \"가입되지 않은 아이디입니다.\"}), 404\n        promoted = lockdown.promote_account(value, \"ADMIN_MANUAL\", \"ADMIN_ONLY\", note=note)\n\n    if not promoted:\n        return jsonify({\"success\": False, \"error\": \"이미 영구 잠금 상태입니다.\"}), 409\n    return jsonify({\"success\": True})", "alias": null}}, "files": {"security/soar/lockouts.py": {"role": "임시 잠금 집행 파일. 잠금 직후 lockdown 에 '승격 여부 판단'을 맡긴다.", "header": "security/soar/lockouts.py — 잠금 집행(IP/회원 계정/관리자 계정)과 자동·수동 해제\n예전 soar.py(497줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from security import soar` 후 `soar.enforce_lockout(...)`으로\n쓴다(security/soar/__init__.py가 재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/soar/lockouts.py"}, "security/lockdown.py": {"role": "임시 잠금을 영구 잠금으로 올리고(승격), 영구 잠금을 푸는(관리자 해제·이메일 복구) 로직 본체.", "header": "security/lockdown.py — \"영구 출입금지 담당 부서\": 임시 잠금을 영구 잠금으로 올리고(승격),\n영구 잠금을 풀어주는(관리자 해제 / 이메일 복구) 로직 본체 (guide33 / guide34-a)\n왜 별도 모듈인가: security/soar/가 이미 security/correlate.py를 import하고 있어서, security/correlate.py가\nsecurity/soar/의 승격 함수를 직접 부르면 순환 import가 된다. 그래서 승격·해제 로직을 이\n파일 하나로 모으고, security/soar/와 security/correlate.py가 둘 다 이 파일만 import하게 한다.\n이 파일은 모듈 수준에서 db / alert / config / ip_utils만 import한다. 영구 잠금 이벤트를\n상관분석(correlate)에 흘려보내는 부분만 함수 안에서 늦게 import한다(순환 방지).\n설계 원칙 (docs의 permanent-lock 계획서 1.1 참고)\n- \"영구\"는 시간이 아니라 해제 조건의 문제다: 자동 만료가 없고 이메일 인증이나\n관리자 수동 해제로만 풀린다.\n- IP 영구 잠금은 이메일로 \"해제\"하지 않고 본인+본인 기기에게만 \"예외\"를 발급한다.\n- 허용 목록(PERMANENT_LOCK_IP_ALLOWLIST)의 IP는 절대 영구 잠그지 않는다(자충수 방지).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/lockdown.py"}, "db/lock_history.py": {"role": "잠금 이력(lock_history 표)을 '추가만' 하는 저장소 파일. 반복 횟수를 세는 근거.", "header": "db/lock_history.py — lock_history 표 관련 함수 (guide33, 영구 잠금)\nlockouts/account_lockouts는 같은 IP·계정이 다시 잠기면 같은 행에 덮어쓰는(upsert)\n\"현재 상태판\"이라서 \"최근 30일 안에 몇 번 잠겼는가\"를 셀 수 없다. 이 표는 잠금이\n걸릴 때마다 한 줄씩 추가만 하는(append-only) 이력이라 그 횟수를 센다.\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/lock_history.py"}, "config.py": {"role": "임계값·시간 창·잠금 시간·규칙값 등 프로젝트 공용 설정값을 한 곳에 모은 파일.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/config.py"}, "db/lockouts.py": {"role": "IP 잠금 표. 임시 → 영구 승격(조건부 UPDATE)과 영구 잠금 조회를 담당한다.", "header": "db/lockouts.py — lockouts 표 관련 함수\n— \"지금 어떤 IP가 잠겨있고, 언제 풀리는지\"라는 \"현재 상태\"를 관리하는 기능\n(login_attempts가 \"지나간 일의 기록\"이라면, lockouts는 \"지금 이 순간의 상태판\")\ndb.get_client()/db._now_iso()를 통해 호출하는 이유는 db/attempts.py 상단\n설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/lockouts.py"}, "notify/alert.py": {"role": "Slack 알림 전송 파일.", "header": "notify/alert.py — \"전화 교환원\" 역할: Slack에 실제로 메시지를 전송한다\n이 파일이 하는 일은 딱 하나, \"메시지를 조립해서 Slack 웹훅 주소로 던지는 것\"뿐이다.\n\"언제 알림을 보낼지\"를 결정하는 판단은 이 파일의 몫이 아니고 security/soar/(대부분),\nsecurity/correlate.py·lockdown.py, notify/mailer.py(메일 발송 실패)가 결정해서\n이 파일의 함수를 호출해줄 때만 동작한다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/notify/alert.py"}, "db/account_lockouts.py": {"role": "계정 잠금 표. 영구 승격·해제를 담당한다.", "header": "db/account_lockouts.py — account_lockouts 표 관련 함수\n— \"지금 어떤 계정(아이디)이 잠겨있고, 언제 풀리는지\"라는 \"현재 상태\"를 관리한다.\ndb/lockouts.py(IP 단위 잠금)와 짝을 이루는 계정 단위 잠금이다 — 공격자가 여러\nIP로 나눠서(또는 느린 속도로) 같은 계정만 노리면 IP당 실패 횟수는 임계값을\n넘지 않아 lockouts로는 못 잡는다. 이 표는 IP와 무관하게 \"이 계정이 총 몇 번\n실패했는가\"를 기준으로 잠근다 (L7 공격 보강 계획 Tier 1).\ndb.get_client()를 통해 호출하는 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/account_lockouts.py"}, "security/correlate.py": {"role": "상관분석 파일. 사건 위험등급에 따라 영구 잠금 승격을 판단하도록 부른다.", "header": "security/correlate.py — \"형사\" 역할: 흩어진 개별 신고(security_events)들을 보고\n\"이거 같은 출처가 벌인 하나의 사건 아니야?\"를 판단한다 (Track C guide27, SIEM 상관분석)\nsecurity/soar/가 security_events에 새 이벤트를 기록할 때마다 이 모듈의\ncheck_and_correlate()를 호출한다. security/detector.py와 동일한 원칙으로, 이 파일도\n\"판단\"만 하고(사건으로 묶어야 하는가?) 실제 저장/병합은 db 패키지(db/incidents.py)에\n맡긴다 — security/soar/가 db에게 조치를 맡기는 것과 같은 구조다.\nPLAYBOOKS(Track C guide28, SOAR 플레이북)도 이 파일에 둔다. security/soar/가 이미\nsecurity/correlate.py를 import하고 있어서, 플레이북 실행을 security/soar/ 쪽에 두고\nsecurity/correlate.py가 그걸 호출하게 하면 반대 방향 import가 생겨 순환 참조가 된다.\nsecurity/correlate.py는 사건이 얼마나 심각해졌는지 이미 알고 있는 유일한 곳이므로,\n여기서 곧바로 notify/alert.py를 불러 실행하는 것이 security/soar/가 notify/alert.py를 직접\n부르는 것과 같은 자연스러운 구조다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/correlate.py"}, "db/access_requests.py": {"role": "db/access_requests.py — access_requests 표 관련 함수 (Track A, guide31) security_incidents가 \"여러 이벤트를 하나의 사건으로 묶는\" 표라면, 이 표는 \"규칙이 아직 발동하지 않은 임계값 코앞 구간에서 LLM이 위험하다고 판단", "header": "db/access_requests.py — access_requests 표 관련 함수 (Track A, guide31)\nsecurity_incidents가 \"여러 이벤트를 하나의 사건으로 묶는\" 표라면, 이 표는\n\"규칙이 아직 발동하지 않은 임계값 코앞 구간에서 LLM이 위험하다고 판단한\n건들을 관리자 승인 대기 목록으로 쌓아두는\" 표다. soar.consider_early_warning()이\n판단(위험한가?) 결과를 여기 등록하고, 실제 승인/반려 실행은 security/soar/의\nexecute_approved_request()/reject_pending_request()가 이 파일의 함수를\n통해서만 상태를 바꾼다 (security/detector.py·security/soar/와 동일한 판단·실행 분리 원칙).\nguide33 이후로는 LLM 판단이 아닌 항목도 하나 들어온다 — SIEM 상관분석 사건이 HIGH에\n도달했을 때의 영구 잠금 후보(SIEM_HIGH_INCIDENT, security/lockdown.py의\nconsider_incident_promotion 참고)도 같은 승인 대기 목록에 쌓인다.\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/access_requests.py"}, "routes/auth.py": {"role": "로그인·회원가입 입구 파일. 영구 잠긴 IP·계정을 막고 복구 링크를 보여준다.", "header": "routes/auth.py — 회원가입(/signup) + 감시 대상 로그인(/login)\n원래 app.py의 \"회원가입 입력 검증 규칙\" / \"회원가입\" / \"감시 대상 로그인\"\n세 섹션을 그대로 옮겨왔다. 배경은 docs/refactor/2026-09-15-file-split.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/auth.py"}, "security/detector.py": {"role": "잠금 상태(없음/임시/영구)를 판정만 하는 판사 파일.", "header": "security/detector.py — \"판사\" 역할: 지금 이 IP가 수상한지, 지금 잠겨있는지만 판단한다\n이 파일은 데이터베이스의 상태를 절대 바꾸지 않는다(아무것도 저장/수정/삭제하지 않음).\n오직 db에게 \"지금 상태가 어때?\"라고 물어보고, 그 답을 바탕으로\nTrue/False 같은 \"판정 결과\"만 돌려준다.\n실제로 잠그거나 알림을 보내는 \"실행\"은 이 파일이 아니라 security/soar/가 담당한다\n(판단과 실행을 분리해두면, \"판단 기준만 바꾸고 싶다\" 같은 수정이 훨씬 쉬워진다).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/detector.py"}, "routes/admin/locks.py": {"role": "영구 잠금 수동 승격·해제 API 입구 파일. 해제는 super_admin 전용.", "header": "routes/admin/locks.py — 잠금 해제·영구 잠금·IP 예외·복구 요청 관리 API\n예전 routes/admin.py(798줄)를 기능 묶음별로 나눈 조각 중 하나다. Blueprint(admin_bp)는\nroutes/admin/__init__.py에서 하나만 만들고, 이 파일은 거기에 라우트를 붙이기만 한다\n— 그래서 엔드포인트 이름(url_for(\"admin.xxx\"))은 나누기 전과 똑같다.\n배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/admin/locks.py"}}}</script>
<script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var $ = function(id){ return document.getElementById(id); };
  var KIND_LABEL = {screen:"화면 · 도착지", route:"routes", helper:"판단", db:"db", config:"설정값", later:"다른 단원"};

  var state = { sc: 0, node: null, item: 0, file: null };

  function el(tag, attrs, kids){
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function brk(t){ return t.replace(/([\/._])/g, "$1\u200b"); }
  function scen(){ return D.scenarios[state.sc]; }
  function nodeById(id){ return scen().nodes.filter(function(n){ return n.id === id; })[0]; }
  function fnName(label){ return label; }

  /* ---------- 간단 문법 강조 ---------- */
  var PY = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?''')|([rbfRBF]{0,2}"(?:\\.|[^"\\\n])*"|[rbfRBF]{0,2}'(?:\\.|[^'\\\n])*')|\b(def|class|return|if|elif|else|for|while|import|from|as|try|except|finally|with|in|not|and|or|is|None|True|False|raise|pass|lambda|yield|global|nonlocal|assert|del|continue|break)\b|(@[A-Za-z_][\w.]*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(?=\()/g;
  var PYC = [null,"t-c","t-d","t-s","t-k","t-a","t-n","t-f"];
  var HT = /(<!--[\s\S]*?-->)|(\{[{%#][\s\S]*?[}%#]\})|(<\/?[A-Za-z][\w-]*)|("[^"\n]*")|(\/?>)/g;
  var HTC = [null,"t-c","t-a","t-k","t-s","t-k"];
  var JS = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\.|[^`\\])*`)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(const|let|var|function|return|if|else|for|while|import|from|export|default|async|await|try|catch|finally|new|class|extends|typeof|interface|type|null|undefined|true|false|throw|switch|case|break|continue|of|in|as)\b|(@[A-Za-z_]\w*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_$][\w$]*)(?=\()/g;
  var JSC = [null,"t-c","t-s","t-s","t-k","t-a","t-n","t-f"];
  var SQ = /(--[^\n]*|\/\*[\s\S]*?\*\/)|((?!))|('(?:''|[^'])*')|\b(select|from|where|insert|into|values|update|set|delete|create|table|index|alter|add|drop|on|conflict|do|nothing|and|or|not|null|default|primary|key|references|cascade|if|exists|as|order|by|group|limit|desc|asc|join|left|inner|count|returns|function|language|begin|end|return|with|union|all|distinct|in|is|true|false|unique|check|constraint|timestamptz|text|integer|bigint|boolean|interval|now|replace|trigger|view|policy|enable|row|level|security|using)\b|((?!))|\b(\d+(?:\.\d+)?)\b|\b([a-z_]\w*)(?=\()/gi;
  var SQC = [null,"t-c",null,"t-s","t-k",null,"t-n","t-f"];
  var SH = /(#[^\n]*)|((?!))|("(?:\\.|[^"\\\n])*"|'[^'\n]*')|\b(if|then|else|fi|for|do|done|while|case|esac|function|echo|export|python|pip|git|cd|run|name|on|jobs|steps|uses|with|env)\b|((?!))|\b(\d+)\b/g;
  var SHC = [null,"t-c",null,"t-s","t-k",null,"t-n"];
  function tokenize(code, lang){
    var re = PY, cls = PYC;
    if (lang === "html"){ re = HT; cls = HTC; }
    else if (lang === "js"){ re = JS; cls = JSC; }
    else if (lang === "sql"){ re = SQ; cls = SQC; }
    else if (lang === "sh"){ re = SH; cls = SHC; }
    var lines = [[]];
    function push(text, c){
      var parts = text.split("\n");
      parts.forEach(function(p, i){
        if (i > 0) lines.push([]);
        if (p) lines[lines.length-1].push([p, c]);
      });
    }
    var last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(code)) !== null){
      if (m.index > last) push(code.slice(last, m.index), null);
      var idx = 1; while (idx < m.length && m[idx] === undefined) idx++;
      push(m[0], cls[idx] || null);
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++;
    }
    if (last < code.length) push(code.slice(last), null);
    return lines;
  }

  function codeTable(block, hl){
    var lines = tokenize(block.code, block.lang);
    var tbody = el("tbody");
    var hlFirst = null;
    lines.forEach(function(segs, i){
      var no = block.start + i;
      var on = hl && no >= hl[0] && no <= hl[1];
      var td = el("td", {class:"tx"});
      segs.forEach(function(s){ td.appendChild(s[1] ? el("span", {class:s[1], text:s[0]}) : document.createTextNode(s[0])); });
      if (!segs.length) td.appendChild(document.createTextNode(" "));
      var tr = el("tr", on ? {class:"hl"} : null, [el("td", {class:"ln", text:String(no)}), td]);
      if (on && !hlFirst) hlFirst = tr;
      tbody.appendChild(tr);
    });
    var box = el("div", {class:"codebox"}, [el("table", {class:"code"}, [tbody])]);
    box._hlFirst = hlFirst;
    return box;
  }

  function copyText(text, btn){
    var done = function(){ var o = btn.textContent; btn.textContent = "복사됨 ✓"; setTimeout(function(){ btn.textContent = o; }, 1200); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
    function fallback(){
      var ta = el("textarea", {style:"position:fixed;opacity:0"}); ta.value = text; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); done(); } catch(e){} document.body.removeChild(ta);
    }
  }

  /* ---------- 패널 ---------- */
  function openPanel(){ document.body.classList.add("open"); }
  function closePanel(){ document.body.classList.remove("open"); }

  function showHint(){
    $("pTitle").textContent = "코드 보는 법";
    $("pSub").textContent = "카드나 파일 이름을 누르면 실제 코드가 여기에 열립니다.";
    var ul = el("ul", {class:"hint"}, [
      el("li", {text:"카드(상자)를 누르면 그 단계에서 실행되는 실제 함수 코드가 열려요."}),
      el("li", {text:"카드 안의 📄 파일 이름을 누르면 그 파일이 어떤 역할인지, 이 단원에서 쓰이는 함수가 무엇인지 보여줘요."}),
      el("li", {text:"ƒ 함수 이름을 누르면 해당 함수 코드로 바로 이동해요."}),
      el("li", {text:"노란색 줄이 지금 단계가 담당하는 부분이에요."}),
      el("li", {text:"db.함수() 처럼 적혀 있어도 실제 코드는 db/users.py 같은 다른 파일에 있어요. 카드에 그 '진짜 파일'을 표시하고, 코드 위에 찾아가는 길도 그려줘요."}),
      el("li", {text:"위쪽 ◀ ▶ 버튼으로 실행 순서대로 한 단계씩 따라갈 수 있어요."})
    ]);
    var b = $("pBody"); b.textContent = ""; b.appendChild(ul);
  }

  function renderAlias(a){
    if (!a) return null;
    return el("div", {class:"alias"}, [
      el("div", {text:"코드에는 이렇게 적혀 있지만, 실제 함수는 다른 파일에 있어요."}),
      el("div", {class:"route"}, [
        el("span", {class:"step", text:a.call}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step", text:a.via + " (창구)"}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step real", text:a.real})
      ])
    ]);
  }

  function selectNode(id, itemIdx){
    var n = nodeById(id); if (!n) return;
    state.node = id; state.item = itemIdx || 0; state.file = null;
    $("pTitle").textContent = n.title;
    $("pSub").textContent = n.plain;
    var body = $("pBody"); body.textContent = "";
    if (n.reject) body.appendChild(el("div", {class:"n-reject", text:n.reject, style:"margin:0 0 10px"}));
    if (n.items.length > 1){
      var tabs = el("div", {class:"itabs", role:"tablist"});
      n.items.forEach(function(it, i){
        tabs.appendChild(el("button", {class:"itab", role:"tab", "aria-selected":String(i === state.item), text:it.label,
          onclick:function(){ selectNode(id, i); }}));
      });
      body.appendChild(tabs);
    }
    var it = n.items[state.item];
    var block = D.blocks[it.block];
    var linesTxt = it.hl ? (it.hl[0] === it.hl[1] ? it.hl[0] + "줄" : it.hl[0] + "–" + it.hl[1] + "줄") : "";
    var fl = el("div", {class:"fileline"}, [
      el("button", {class:"chip file", onclick:function(){ selectFile(block.path); }, text:block.path}),
      el("span", {class:"lines", text: block.start + "–" + block.end + "줄 표시" + (linesTxt ? " · 노란색 " + linesTxt : "")}),
      el("span", {class:"spacer"}),
      el("button", {class:"btn", text:"복사", onclick:function(e){ copyText(block.code, e.currentTarget); }}),
      el("a", {class:"btn link", href:D.files[block.path].github + "#L" + block.start + "-L" + block.end, target:"_blank", rel:"noopener", text:"GitHub ↗"})
    ]);
    body.appendChild(fl);
    var al = renderAlias(block.alias); if (al) body.appendChild(al);
    var box = codeTable(block, it.hl);
    body.appendChild(box);
    if (it.hl) body.appendChild(el("p", {class:"legend-hl"}, [el("b", {text:"노란색"}), " = 이 카드가 담당하는 줄"]));
    refreshSelection();
    openPanel();
    if (box._hlFirst){
      var off = box._hlFirst.offsetTop - 60;
      box.scrollTop = Math.max(0, off);
    }
    updateStepper();
  }

  function selectFile(path){
    state.file = path; state.node = null;
    var f = D.files[path];
    $("pTitle").textContent = "📄 " + path;
    $("pSub").textContent = f.role;
    var body = $("pBody"); body.textContent = "";
    body.appendChild(el("div", {class:"fileline"}, [
      el("a", {class:"btn link", href:f.github, target:"_blank", rel:"noopener", text:"GitHub에서 파일 열기 ↗"})
    ]));
    body.appendChild(el("h3", {text:"이 단원에서 쓰이는 함수", style:"font-size:13.5px;margin:12px 0 0"}));
    var ul = el("ul", {class:"flist"}), seen = {};
    D.scenarios.forEach(function(sc, si){
      sc.nodes.forEach(function(n){
        n.items.forEach(function(it, ii){
          var b = D.blocks[it.block]; if (b.path !== path) return;
          var key = si + n.id + ii; if (seen[key]) return; seen[key] = 1;
          var li = el("li");
          li.appendChild(el("button", {onclick:function(){
            if (state.sc !== si) switchScenario(si);
            selectNode(n.id, ii); scrollToNode(n.id);
          }}, [
            el("span", {class:"mono", text:it.label}), el("small", {text:sc.name + " · " + n.title})
          ]));
          ul.appendChild(li);
        });
      });
    });
    body.appendChild(ul);
    if (f.header){
      var d = el("details", {class:"hdr"}, [el("summary", {text:"파일 맨 위 설명 주석 보기"}), el("pre", {text:f.header})]);
      body.appendChild(d);
    }
    refreshSelection();
    openPanel();
  }

  /* ---------- 흐름도 ---------- */
  var cols, colIndex, nodeEls = {};
  function renderStage(){
    var sc = scen();
    var used = {}; sc.nodes.forEach(function(n){ used[n.col] = 1; });
    cols = Object.keys(used).map(Number).sort(function(a,b){ return a-b; });
    colIndex = {}; cols.forEach(function(c, i){ colIndex[c] = i + 1; });
    var stage = $("stage");
    stage.textContent = "";
    stage.style.gridTemplateColumns = "repeat(" + cols.length + ", 196px)";
    nodeEls = {};

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "edges"); svg.id = "edges";
    svg.innerHTML = '<defs>' +
      '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-call" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '</defs>';
    stage.appendChild(svg);

    cols.forEach(function(c){
      stage.appendChild(el("div", {class:"colhead", style:"grid-column:" + colIndex[c] + ";grid-row:1", text:D.columns[c]}));
    });
    var cells = {};
    sc.nodes.forEach(function(n){
      var k = n.row + ":" + n.col;
      if (!cells[k]){
        cells[k] = el("div", {class:"cell", style:"grid-column:" + colIndex[n.col] + ";grid-row:" + (n.row + 2)});
        stage.appendChild(cells[k]);
      }
      var node = buildNode(n);
      nodeEls[n.id] = node;
      cells[k].appendChild(node);
    });
    $("intro").textContent = sc.intro;
    scheduleEdges();
  }

  function buildNode(n){
    var node = el("div", {class:"node " + n.kind, role:"button", tabindex:"0", "aria-pressed":"false", "data-id":n.id,
      onclick:function(e){ if (e.target.closest(".chip")) return; selectNode(n.id, 0); },
      onkeydown:function(e){ if ((e.key === "Enter" || e.key === " ") && !e.target.closest(".chip")){ e.preventDefault(); selectNode(n.id, 0); } }});
    var title = el("div", {class:"n-title", text:n.title});
    if (n.later) title.appendChild(el("span", {class:"tag-later", text:n.later + "에서 자세히"}));
    node.appendChild(title);
    if (n.kind !== "later" && n.plain) node.appendChild(el("div", {class:"n-plain", text:n.plain}));
    if (n.reject) node.appendChild(el("div", {class:"n-reject", text:n.reject}));
    var items = el("div", {class:"n-items"});
    // 같은 파일에 있는 함수는 파일 칩 하나 아래에 함수 칩을 나란히 놓는다
    var groups = [];
    n.items.forEach(function(it, i){
      var b = D.blocks[it.block], g = groups[groups.length - 1];
      if (g && g.path === b.path) g.list.push({it: it, i: i}); else groups.push({path: b.path, list: [{it: it, i: i}]});
    });
    groups.forEach(function(g){
      var row = el("div", {class:"n-item"});
      if (g.list.length === 1 && g.list[0].it.call) row.appendChild(el("div", {class:"n-call", text:brk(g.list[0].it.call)}));
      var chips = el("div", {class:"chips"}, [
        el("button", {class:"chip file", text:brk(g.path), title:"파일 설명 보기", onclick:function(){ selectFile(g.path); }})
      ]);
      g.list.forEach(function(x){
        chips.appendChild(el("button", {class:"chip " + (x.it.snippet ? "snip" : "fn"), text:x.it.label, title:(x.it.call ? x.it.call + " — " : "") + "코드 보기",
          onclick:function(){ selectNode(n.id, x.i); }}));
      });
      row.appendChild(chips);
      items.appendChild(row);
    });
    node.appendChild(items);
    return node;
  }

  function rectIn(elm, host){
    var a = elm.getBoundingClientRect(), h = host.getBoundingClientRect();
    return {l:a.left-h.left, r:a.right-h.left, t:a.top-h.top, b:a.bottom-h.top, cx:(a.left+a.right)/2-h.left, cy:(a.top+a.bottom)/2-h.top};
  }
  var raf = 0;
  function scheduleEdges(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(drawEdges); }
  function drawEdges(){
    var stage = $("stage"), svg = $("edges"), sc = scen();
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){ p.remove(); });
    Array.prototype.slice.call(stage.querySelectorAll(".elabel")).forEach(function(p){ p.remove(); });
    var svgNS = "http://www.w3.org/2000/svg";
    sc.edges.forEach(function(e){
      var a = nodeById(e.from), b = nodeById(e.to);
      var ea = nodeEls[e.from], eb = nodeEls[e.to]; if (!ea || !eb) return;
      var ra = rectIn(ea, stage), rb = rectIn(eb, stage), d, lx, ly;
      if (a.col === b.col){
        if (b.row - a.row <= 1){
          d = "M" + ra.cx + " " + ra.b + " V" + rb.t; lx = ra.cx; ly = (ra.b + rb.t) / 2;
        } else {
          var x = Math.min(ra.l, rb.l) - 30;
          d = "M" + ra.l + " " + ra.cy + " H" + x + " V" + rb.cy + " H" + rb.l; lx = x; ly = (ra.cy + rb.cy) / 2;
        }
      } else {
        var dir = b.col > a.col ? 1 : -1;
        var x1 = dir > 0 ? ra.r : ra.l, x2 = dir > 0 ? rb.l : rb.r;
        var xm = x2 - dir * 30;
        d = "M" + x1 + " " + ra.cy + " H" + xm + " V" + rb.cy + " H" + x2;
        lx = (x1 + x2) / 2; ly = ra.cy;
      }
      var kind = e.kind === "call" ? "call" : "flow";
      var p = document.createElementNS(svgNS, "path");
      p.setAttribute("d", d); p.setAttribute("class", "e " + kind);
      p.setAttribute("marker-end", "url(#" + (kind === "call" ? "ahc" : "ah") + ")");
      p.setAttribute("data-from", e.from); p.setAttribute("data-to", e.to);
      svg.appendChild(p);
      if (e.label && kind === "flow"){
        var lab = el("span", {class:"elabel", text:e.label});
        lab.style.left = lx + "px"; lab.style.top = ly + "px";
        stage.appendChild(lab);
      }
    });
    svg.setAttribute("width", stage.scrollWidth); svg.setAttribute("height", stage.scrollHeight);
    refreshSelection();
  }

  function refreshSelection(){
    Object.keys(nodeEls).forEach(function(id){ nodeEls[id].setAttribute("aria-pressed", String(id === state.node)); });
    var svg = $("edges"); if (!svg) return;
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){
      var on = state.node && (p.getAttribute("data-from") === state.node || p.getAttribute("data-to") === state.node);
      p.classList.toggle("active", !!on);
    });
  }
  function scrollToNode(id){
    var n = nodeEls[id]; if (n && n.scrollIntoView) n.scrollIntoView({block:"center", inline:"center", behavior:"smooth"});
  }

  /* ---------- 단계 이동 / 탭 ---------- */
  function stepIndex(){ return scen().steps.indexOf(state.node); }
  function updateStepper(){
    var steps = scen().steps, i = stepIndex();
    $("stepNo").textContent = i < 0 ? "– / " + steps.length : (i + 1) + " / " + steps.length;
    $("prev").disabled = i <= 0 && state.node !== null ? true : false;
    $("next").disabled = i >= steps.length - 1;
    if (state.node === null){ $("prev").disabled = true; $("next").disabled = false; }
  }
  function go(delta){
    var steps = scen().steps, i = stepIndex();
    var j = i < 0 ? 0 : Math.max(0, Math.min(steps.length - 1, i + delta));
    selectNode(steps[j], 0); scrollToNode(steps[j]);
  }
  function renderTabs(){
    var t = $("tabs"); t.textContent = "";
    D.scenarios.forEach(function(sc, i){
      t.appendChild(el("button", {class:"tab", role:"tab", "aria-selected":String(i === state.sc), text:sc.name, onclick:function(){ switchScenario(i); }}));
    });
  }
  function switchScenario(i){
    state.sc = i; state.node = null; state.file = null;
    renderTabs(); renderStage(); showHint(); updateStepper();
    try { history.replaceState(null, "", "#" + D.scenarios[i].id); } catch(e){}
  }

  /* ---------- 시작 ---------- */
  document.title = D.title + " — 코드 흐름도";
  $("title").textContent = D.title + " · 코드 흐름도";
  $("subtitle").textContent = D.subtitle;
  $("mdlink").setAttribute("href", D.mdFile);
  $("prev").addEventListener("click", function(){ go(-1); });
  $("next").addEventListener("click", function(){ go(1); });
  $("pClose").addEventListener("click", closePanel);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closePanel(); });
  $("theme").addEventListener("click", function(){
    var r = document.documentElement, cur = r.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  });
  window.addEventListener("resize", scheduleEdges);
  if (window.ResizeObserver) new ResizeObserver(scheduleEdges).observe($("stage"));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleEdges);

  var startId = (location.hash || "").replace("#", "");
  var startIdx = 0; D.scenarios.forEach(function(s, i){ if (s.id === startId) startIdx = i; });
  switchScenario(startIdx);
  // 화면 확인/테스트용 지름길: window.__flow.select("s7")
  window.__flow = { select: function(id, i){ selectNode(id, i || 0); }, file: selectFile, state: state };
})();
</script>
</body>
