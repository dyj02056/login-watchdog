<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>17. 이메일 인증 복구 — 코드 흐름도</title>
<style>
  :root{
    --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eaefe9; --ink:#12201c; --ink-muted:#5a6b63;
    --border:#d9e0da; --accent:#0f6f66; --accent-soft:#e2ede9; --danger:#bf3b2b; --danger-soft:#f8e6e2;
    --edge:#7b8a82; --edge-call:#8a97a0;
    --k-screen:#767f78; --k-screen-soft:#eef0ee;
    --k-route:#2f5fd6;  --k-route-soft:#e7edfb;
    --k-helper:#b56b0c; --k-helper-soft:#f7ecd9;
    --k-db:#7a4fce;     --k-db-soft:#efe8fa;
    --k-config:#0f6f66; --k-config-soft:#e2ede9;
    --k-later:#9aa39d;  --k-later-soft:#f4f6f3;
    --code-bg:#fbfcfb; --code-hl:#fff3c4; --code-hl-bar:#e0a800; --code-gutter:#8a978f;
    --c-comment:#6b7d73; --c-str:#a1470f; --c-kw:#7a3fc0; --c-fn:#1f5fd0; --c-num:#0b7a6c; --c-deco:#b0306e;
    --shadow:0 1px 2px rgba(18,32,28,.06), 0 6px 20px rgba(18,32,28,.07);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
      --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
      --edge:#6f8178; --edge-call:#5d6f67;
      --k-screen:#9aa39d; --k-screen-soft:#1a221e;
      --k-route:#7fa2f2;  --k-route-soft:#182236;
      --k-helper:#e8a94c; --k-helper-soft:#31260f;
      --k-db:#b49bee;     --k-db-soft:#241c34;
      --k-config:#4fc9b8; --k-config-soft:#17332d;
      --k-later:#6b7a72;  --k-later-soft:#111a16;
      --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
      --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
    --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
    --edge:#6f8178; --edge-call:#5d6f67;
    --k-screen:#9aa39d; --k-screen-soft:#1a221e;
    --k-route:#7fa2f2;  --k-route-soft:#182236;
    --k-helper:#e8a94c; --k-helper-soft:#31260f;
    --k-db:#b49bee;     --k-db-soft:#241c34;
    --k-config:#4fc9b8; --k-config-soft:#17332d;
    --k-later:#6b7a72;  --k-later-soft:#111a16;
    --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
    --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
  button{font:inherit;color:inherit;cursor:pointer}
  code,.mono{font-family:var(--mono)}

  .app{display:flex;height:100vh;min-height:0}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{padding:14px 20px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
  .top h1{margin:0;font-size:19px;letter-spacing:-.01em}
  .top .sub{margin:2px 0 0;color:var(--ink-muted);font-size:13px}
  .top-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
  .tabs{display:flex;gap:6px}
  .tab{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:5px 14px;font-weight:600}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .tab[aria-selected="true"]{color:#06201b}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#06201b}}
  .spacer{flex:1}
  .btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:default}
  .stepper{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-muted)}
  .stepper b{color:var(--ink);min-width:42px;text-align:center}
  a.link{color:var(--accent);text-decoration:none;font-size:13px}
  a.link:hover{text-decoration:underline}

  .intro{margin:0;padding:10px 20px;color:var(--ink-muted);font-size:13px;border-bottom:1px solid var(--border);background:var(--surface-2)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 20px;font-size:12px;color:var(--ink-muted);border-bottom:1px solid var(--border)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .stage-wrap{flex:1;min-height:0;overflow:auto}
  .stage{position:relative;display:grid;gap:26px 46px;padding:22px 22px 60px;width:max-content;min-width:100%}
  .edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .edges path{fill:none;stroke:var(--edge);stroke-width:1.6}
  .edges path.call{stroke:var(--edge-call);stroke-dasharray:5 4}
  .edges path.active{stroke:var(--accent);stroke-width:2.4;stroke-dasharray:none}
  .edges .head{fill:var(--edge)}
  .edges .head-call{fill:var(--edge-call)}
  .elabel{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;
    background:var(--surface);border:1px solid var(--border);color:var(--ink-muted);white-space:nowrap;pointer-events:none}

  .colhead{font-size:12px;font-weight:700;color:var(--ink-muted);text-transform:none;border-bottom:2px solid var(--border);padding-bottom:6px;align-self:end}
  .cell{display:flex;flex-direction:column;gap:12px;align-self:center;justify-content:center;position:relative;z-index:1}

  .node{--k:var(--k-route);--ks:var(--k-route-soft);position:relative;background:var(--surface);border:1px solid var(--border);
    border-left:5px solid var(--k);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .08s, border-color .12s}
  .node:hover{transform:translateY(-1px);border-color:var(--k)}
  .node:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .node[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
  .node.screen{--k:var(--k-screen);--ks:var(--k-screen-soft)}
  .node.route{--k:var(--k-route);--ks:var(--k-route-soft)}
  .node.helper{--k:var(--k-helper);--ks:var(--k-helper-soft)}
  .node.db{--k:var(--k-db);--ks:var(--k-db-soft)}
  .node.config{--k:var(--k-config);--ks:var(--k-config-soft)}
  .node.later{--k:var(--k-later);--ks:var(--k-later-soft);background:var(--k-later-soft);box-shadow:none;border-style:dashed;border-left-style:solid;padding:8px 10px}
  .n-title{font-weight:700;font-size:13.5px;letter-spacing:-.01em}
  .n-plain{margin-top:3px;color:var(--ink-muted);font-size:12.5px}
  .n-reject{margin-top:6px;font-size:12px;color:var(--danger);background:var(--danger-soft);border-radius:6px;padding:3px 8px}
  .n-reject::before{content:"막히면 → ";font-weight:700}
  .n-items{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .n-item{display:flex;flex-direction:column;gap:3px}
  .n-call{overflow-wrap:anywhere;font-family:var(--mono);font-size:11.5px;color:var(--k);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{max-width:100%;text-align:left;overflow-wrap:anywhere;border:1px solid var(--border);background:var(--ks);color:var(--ink);border-radius:6px;padding:1px 7px;font-family:var(--mono);font-size:11px}
  .chip:hover{border-color:var(--k);color:var(--k)}
  .chip.file::before{content:"📄 "}
  .chip.fn::before{content:"ƒ ";color:var(--k);font-weight:700}
  .chip.snip::before{content:"▤ ";color:var(--k);font-weight:700}
  .tag-later{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--ink-muted);border:1px solid var(--border);border-radius:999px;padding:0 7px;background:var(--surface)}

  /* 코드 패널 */
  .panel{width:440px;flex:none;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
  .p-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
  .p-head h2{margin:0;font-size:15.5px;letter-spacing:-.01em}
  .p-head p{margin:4px 0 0;color:var(--ink-muted);font-size:13px}
  .p-close{display:none}
  .p-body{flex:1;min-height:0;overflow:auto;padding:12px 16px 24px}
  .hint{color:var(--ink-muted);font-size:13px}
  .hint li{margin:4px 0}
  .itabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .itab{border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:2px 9px;font-family:var(--mono);font-size:12px}
  .itab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .fileline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
  .fileline .path{font-family:var(--mono);font-size:12.5px;font-weight:700}
  .fileline .lines{font-family:var(--mono);font-size:12px;color:var(--ink-muted)}
  .alias{border:1px solid var(--border);background:var(--k-db-soft);border-radius:8px;padding:8px 10px;margin:0 0 10px;font-size:12.5px}
  .alias .route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px;font-family:var(--mono);font-size:12px}
  .alias .route span.step{padding:1px 7px;border-radius:6px;border:1px solid var(--border);background:var(--surface)}
  .alias .route span.real{border-color:var(--k-db);color:var(--k-db);font-weight:700}
  .alias .arrow{color:var(--ink-muted)}
  .codebox{border:1px solid var(--border);border-radius:8px;background:var(--code-bg);overflow:auto;max-height:62vh}
  table.code{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.2px;line-height:1.6}
  table.code td{padding:0 10px;vertical-align:top;white-space:pre}
  table.code td.ln{position:sticky;left:0;text-align:right;color:var(--code-gutter);user-select:none;background:var(--code-bg);border-right:1px solid var(--border);min-width:44px;padding-right:8px}
  table.code tr.hl td{background:var(--code-hl)}
  table.code tr.hl td.ln{background:var(--code-hl);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--code-hl-bar)}
  .t-c{color:var(--c-comment);font-style:italic}.t-d{color:var(--c-comment)}.t-s{color:var(--c-str)}.t-k{color:var(--c-kw);font-weight:600}
  .t-f{color:var(--c-fn)}.t-n{color:var(--c-num)}.t-a{color:var(--c-deco)}
  .legend-hl{margin:8px 0 0;font-size:12px;color:var(--ink-muted)}
  .legend-hl b{background:var(--code-hl);color:var(--ink);padding:0 6px;border-radius:4px}
  .flist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
  .flist button{width:100%;text-align:left;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:6px 10px}
  .flist button:hover{border-color:var(--accent)}
  .flist small{display:block;color:var(--ink-muted)}
  details.hdr{margin-top:12px;font-size:13px}
  details.hdr pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px;font-family:var(--sans);font-size:12.5px;color:var(--ink-muted)}

  @media (max-width:900px){
    .app{display:block;height:auto}
    .stage-wrap{max-height:none;overflow-x:auto}
    .panel{position:fixed;left:0;right:0;bottom:0;width:auto;height:62vh;border-left:0;border-top:2px solid var(--accent);
      box-shadow:0 -10px 30px rgba(0,0,0,.25);z-index:20;transform:translateY(105%);transition:transform .18s}
    body.open .panel{transform:none}
    .p-close{display:inline-block;position:absolute;right:12px;top:10px}
    .p-head{position:relative;padding-right:70px}
    .top{padding:12px 16px 8px}
    .stage{padding:16px 16px 70vh}
  }
  @media (prefers-reduced-motion: reduce){.node,.panel{transition:none}}
</style>
</head>

    <header class="top">

"}, {"from": "verify_n6", "to": "verify_n8", "label": "", "kind": "flow"}, {"from": "verify_n8", "to": "verify_n9", "label": "", "kind": "call"}, {"from": "verify_n8", "to": "verify_n10", "label": "", "kind": "call"}, {"from": "verify_n8", "to": "verify_n11", "label": "", "kind": "call"}, {"from": "verify_n8", "to": "verify_n12", "label": "", "kind": "flow"}, {"from": "verify_n12", "to": "verify_n13", "label": "", "kind": "call"}], "steps": ["verify_n1", "verify_n2", "verify_n4", "verify_n6", "verify_n8", "verify_n12"]}, {"id": "login", "name": "예외로 로그인 (영구 잠긴 IP)", "intro": "IP 는 여러 사람이 함께 쓸 수 있어서, 이메일로 'IP 를 풀지' 않고 '그 회원 + 그 기기'만 통과시킵니다. 같은 IP 의 다른 기기는 계속 차단됩니다.", "nodes": [{"id": "login_n1", "col": 0, "row": 0, "kind": "screen", "title": "영구 잠긴 IP 에서 로그인", "plain": "로그인 입구가 영구 잠금을 보고 예외 여부를 확인합니다.", "reject": "", "later": "", "items": [{"block": "routes/auth.py:login_submit", "hl": [232, 241], "label": "login_submit()", "call": null, "snippet": false}]}, {"id": "login_n2", "col": 1, "row": 1, "kind": "route", "title": "① 회원 + 기기 쿠키가 모두 맞아야 예외", "plain": "기기 쿠키가 없거나 그 회원이 없으면 항상 None 입니다. 공격자는 둘 다 갖지 못합니다.", "reject": "", "later": "", "items": [{"block": "routes/auth.py:_find_ip_exemption", "hl": [174, 180], "label": "_find_ip_exemption()", "call": null, "snippet": false}]}, {"id": "login_n3", "col": 3, "row": 1, "kind": "db", "title": "유효한 예외 찾기", "plain": "IP · 회원 번호 · 기기 해시 · 만료일이 모두 맞는 ACTIVE 한 줄.", "reject": "", "later": "", "items": [{"block": "db/ip_exemptions.py:get_active_ip_exemption", "hl": null, "label": "get_active_ip_exemption()", "call": "db.get_active_ip_exemption()", "snippet": false}]}, {"id": "login_n4", "col": 1, "row": 2, "kind": "route", "title": "② 예외로 들어온 회원이 연달아 틀리면 예외 회수", "plain": "예외는 '본인이 비밀번호를 아는 상황'을 전제로 한 출입증이라, 계속 틀리면 도용 신호로 보고 회수합니다.", "reject": "", "later": "", "items": [{"block": "routes/auth.py:login_submit", "hl": [266, 270], "label": "login_submit()", "call": null, "snippet": false}]}, {"id": "login_n5", "col": 3, "row": 2, "kind": "db", "title": "예외 회수", "plain": "사유와 함께 REVOKED 로 바꿉니다.", "reject": "", "later": "", "items": [{"block": "db/ip_exemptions.py:revoke_ip_exemption", "hl": null, "label": "revoke_ip_exemption()", "call": "db.revoke_ip_exemption()", "snippet": false}]}], "edges": [{"from": "login_n1", "to": "login_n2", "label": "", "kind": "flow"}, {"from": "login_n2", "to": "login_n3", "label": "", "kind": "call"}, {"from": "login_n2", "to": "login_n4", "label": "", "kind": "flow"}, {"from": "login_n4", "to": "login_n5", "label": "", "kind": "call"}], "steps": ["login_n1", "login_n2", "login_n4"]}], "blocks": {"routes/recovery.py:recovery_request_submit": {"path": "routes/recovery.py", "start": 160, "end": 198, "lang": "python", "code": "@recovery_bp.route(\"/recovery/request\", methods=[\"POST\"])\ndef recovery_request_submit():\n    \"\"\"복구 메일을 요청한다. 결과와 무관하게 항상 같은 안내 문구로 응답한다.\"\"\"\n    started = time.monotonic()\n    ip = get_request_ip()\n\n    # 요청 기기를 구분하는 쿠키 — 이 기기에서만 IP 복구를 마칠 수 있다. 항상 (재)발급해서\n    # 응답이 계정 존재 여부와 무관하게 똑같이 보이게 한다.\n    device_token = request.cookies.get(config.DEVICE_COOKIE_NAME) or new_device_token()\n\n    if is_bot_submission():\n        soar.notify_bot_detected(ip, request.path)\n        message = GENERIC_SENT_MESSAGE\n    else:\n        message = GENERIC_SENT_MESSAGE\n        username = request.form.get(\"username\", \"\").strip()\n\n        def work():\n            # 서로 무관한 조회(만료 정리, IP 빈도, 사용자)는 동시에 보낸다(_issue_recovery 설명 참고).\n            valid_username = bool(config.USERNAME_PATTERN.match(username))\n            with ThreadPoolExecutor(max_workers=3) as executor:\n                executor.submit(db.expire_old_recovery_requests)\n                ip_count_future = executor.submit(db.count_recovery_requests_by_ip, ip, 1)\n                user_future = executor.submit(db.get_user_by_username, username) if valid_username else None\n                ip_count = ip_count_future.result()\n                user = user_future.result() if user_future else None\n            if ip_count >= config.RECOVERY_MAX_PER_IP_PER_HOUR:\n                return RATE_LIMITED_MESSAGE\n            _issue_recovery(ip, user, device_token)\n            return GENERIC_SENT_MESSAGE\n\n        result = {}\n        run_with_fixed_response_time(lambda: result.update(message=work()), started)\n        # IP 빈도 제한에 걸렸을 때만 다른 문구를 보여준다(IP 기준이라 계정 존재 여부와 무관).\n        # 처리가 고정 시간 안에 끝나지 않았다면 기본 안내 문구로 응답한다.\n        message = result.get(\"message\", GENERIC_SENT_MESSAGE)\n\n    response = make_response(render_template(\"recovery_request.html\", message=message))\n    return set_device_cookie(response, device_token)", "alias": null}, "helpers/device.py:new_device_token": {"path": "helpers/device.py", "start": 38, "end": 40, "lang": "python", "code": "def new_device_token() -> str:\n    \"\"\"추측 불가능한 새 기기 쿠키 값을 만든다(secrets는 보안용 난수 — random은 예측 가능해 쓰면 안 된다).\"\"\"\n    return secrets.token_urlsafe(32)", "alias": null}, "helpers/device.py:set_device_cookie": {"path": "helpers/device.py", "start": 43, "end": 54, "lang": "python", "code": "def set_device_cookie(response, token: str):\n    \"\"\"응답에 기기 쿠키를 심는다. HttpOnly(자바스크립트가 못 읽음) + SameSite=Lax이고,\n    운영(HTTPS)에서는 Secure도 붙인다.\"\"\"\n    response.set_cookie(\n        config.DEVICE_COOKIE_NAME,\n        token,\n        max_age=config.DEVICE_COOKIE_MAX_AGE_SECONDS,\n        httponly=True,\n        samesite=\"Lax\",\n        secure=config.IS_PRODUCTION,\n    )\n    return response", "alias": null}, "security/soar/observe.py:notify_bot_detected": {"path": "security/soar/observe.py", "start": 15, "end": 23, "lang": "python", "code": "def notify_bot_detected(ip: str, path: str) -> None:\n    \"\"\"허니팟 필드가 채워진 요청(자동화 스크립트/봇 의심)을 MEDIUM 이벤트로 기록한다.\n\n    Slack 알림은 보내지 않는다 — 로그인 실패 반복이나 게시글 도배처럼 그 자체로\n    실제 피해로 이어지는 사건이 아니라 \"이 트래픽에 자동화 스크립트가 섞여\n    있다\"는 관찰 정보이므로, notify_web_scanning() 등과 같은 급의 MEDIUM으로\n    로그에만 남긴다 (L7 공격 보강 계획 Tier 3).\n    \"\"\"\n    _record_event(\"BOT_DETECTED\", \"MEDIUM\", ip, path, 1, \"REJECTED\")", "alias": {"call": "soar.notify_bot_detected()", "via": "security/soar/__init__.py", "real": "security/soar/observe.py"}}, "helpers/timing.py:run_with_fixed_response_time": {"path": "helpers/timing.py", "start": 35, "end": 95, "lang": "python", "code": "def run_with_fixed_response_time(work, started: float) -> None:\n    \"\"\"`work()`를 실행하고, 처리가 빨리 끝났든 오래 걸렸든 응답 시점이 항상\n    RECOVERY_MIN_RESPONSE_SECONDS로 같아지게 맞춘다(타이밍 사이드채널 방지).\n    복구 요청(routes/recovery.py, guide34-a)과 비밀번호 찾기 요청(routes/password.py, guide41)이\n    같은 이유로 이 함수를 쓴다 — 그래서 한 라우트 파일이 다른 라우트 파일을 import하지 않도록\n    공용 helpers로 옮겼다.\n\n    \"아이디 없음\"은 DB 조회 한두 번으로 끝나고 \"실제 복구 메일\"은 조회 여러 번 + SMTP까지\n    거치므로, 그냥 두면 응답 시간 차이로 아이디 존재 여부가 드러난다.\n\n    - 기본(RECOVERY_BACKGROUND_WORK=false): 요청 안에서 처리(메일 발송 포함)를 끝낸 뒤\n      남은 시간만큼 기다리고 응답한다. Vercel 같은 서버리스는 응답을 보내는 순간 함수를\n      멈추므로, 메일 발송을 응답 뒤로 미루면 끝나기 전에 끊길 수 있다.\n    - RECOVERY_BACKGROUND_WORK=true(상시 실행 서버): 처리를 스레드로 돌리고 고정 시간까지만\n      기다린 뒤 응답한다(처리가 더 걸리면 응답 뒤에도 스레드가 마무리한다).\n    - 고정 시간이 0이면(테스트) 기다림 없이 그 자리에서 처리한다.\n\n    어느 쪽이든 처리 중 예외는 로그만 남기고 삼킨다 — 예외가 500으로 새면 \"이 아이디는\n    처리 중 오류가 났다\"는 신호가 되어 계정 존재 여부가 드러난다.\n\n    고정 시간이 0보다 크면 처리가 끝난 시점까지 걸린 시간을 `[timing]` 로그로 남긴다(guide43).\n    \"\"\"\n    target = config.RECOVERY_MIN_RESPONSE_SECONDS\n    path = request.path if has_request_context() else \"-\"\n\n    def safe_work():\n        # 서버리스에서 한동안 쉬던 DB 연결을 재사용하면 첫 요청이 \"Server disconnected\" 같은\n        # 일시적 전송 오류로 실패한다(실제 배포 테스트에서 복구 요청이 이 오류로 조용히 사라졌다).\n        # 이런 오류만 한 번 더 시도한다 — work()는 메일을 보내기 전까지의 DB 작업이 다시 해도\n        # 안전하게 짜여 있고(기존 PENDING 요청을 취소하고 새로 만든다), 메일 발송 실패는\n        # mailer가 예외 없이 처리하므로 재시도해도 메일이 두 번 나가지 않는다.\n        for attempt in (1, 2):\n            try:\n                work()\n                return\n            except httpx.TransportError as e:\n                if attempt == 1:\n                    continue\n                report_internal_error(e)\n            except Exception as e:  # noqa: BLE001\n                report_internal_error(e)\n            return\n\n    if target <= 0:\n        safe_work()\n        return\n\n    def timed_work():\n        safe_work()\n        _log_timing(path, time.monotonic() - started, target)\n\n    if config.RECOVERY_BACKGROUND_WORK:\n        thread = threading.Thread(target=timed_work, daemon=True)\n        thread.start()\n        thread.join(timeout=max(0.0, target - (time.monotonic() - started)))\n    else:\n        timed_work()\n\n    remaining = target - (time.monotonic() - started)\n    if remaining > 0:\n        time.sleep(remaining)", "alias": null}, "db/recovery.py:count_recovery_requests_by_ip": {"path": "db/recovery.py", "start": 202, "end": 213, "lang": "python", "code": "def count_recovery_requests_by_ip(ip: str, hours: int = 1) -> int:\n    \"\"\"이 IP가 최근 `hours`시간 안에 만든 복구 요청 수(메일 폭탄 방지용 빈도 제한).\"\"\"\n    cutoff = (datetime.now(timezone.utc) - timedelta(hours=hours)).isoformat()\n    res = (\n        db.get_client()\n        .table(\"recovery_requests\")\n        .select(\"id\", count=\"exact\")\n        .eq(\"requested_ip\", ip)\n        .gte(\"created_at\", cutoff)\n        .execute()\n    )\n    return res.count or 0", "alias": {"call": "db.count_recovery_requests_by_ip()", "via": "db/__init__.py", "real": "db/recovery.py"}}, "routes/recovery.py:_issue_recovery": {"path": "routes/recovery.py", "start": 98, "end": 151, "lang": "python", "code": "def _issue_recovery(ip: str, user: dict | None, device_token: str) -> None:\n    \"\"\"복구 요청 한 건을 처리한다 — 조건에 맞지 않으면 아무것도 하지 않고(메일 없음) 조용히 끝낸다.\n\n    원격 DB 왕복이 느려서(쿼리 하나에 수백 ms) 서로 무관한 조회 3개(최근 요청 이력, 계정 잠금,\n    IP 잠금)는 동시에 보낸다. 응답을 보내기 전에 메일 발송까지 끝내야 하는 서버리스 환경에서\n    Vercel 함수 시간 제한 안에 들어오게 하려는 것이다.\n    \"\"\"\n    if user is None:\n        return\n\n    with ThreadPoolExecutor(max_workers=3) as executor:\n        activity_future = executor.submit(db.get_recovery_activity, user[\"id\"], 24)\n        account_lock_future = executor.submit(db.get_active_account_lockout, user[\"username\"])\n        ip_lock_future = executor.submit(db.get_active_lockout, ip)\n        recent_count, latest = activity_future.result()\n        account_lock = account_lock_future.result()\n        ip_lock = ip_lock_future.result()\n\n    if recent_count >= config.RECOVERY_MAX_PER_USER_PER_DAY:\n        return\n    if latest:\n        latest_dt = datetime.fromisoformat(latest)\n        if latest_dt.tzinfo is None:\n            latest_dt = latest_dt.replace(tzinfo=timezone.utc)\n        if datetime.now(timezone.utc) - latest_dt < timedelta(seconds=config.RECOVERY_COOLDOWN_SECONDS):\n            return\n\n    target = _eligible_target(user, account_lock, ip_lock, ip)\n    if target is None:\n        return\n    base_url = public_base_url()\n    if not base_url:\n        mailer.report_failure(mailer.FAIL_CONFIG, \"PUBLIC_BASE_URL이 설정되지 않아 복구 메일을 보내지 않았습니다.\")\n        return\n\n    kind, value = target\n    token = secrets.token_urlsafe(32)\n    code = f\"{secrets.randbelow(10**6):06d}\"\n    expires_at = datetime.now(timezone.utc) + timedelta(minutes=config.RECOVERY_TOKEN_TTL_MINUTES)\n    created = db.create_recovery_request(\n        user[\"id\"], kind, value, hash_secret(token), hash_secret(code),\n        hash_secret(device_token), ip, expires_at.isoformat(),\n    )\n    if created is None:\n        return\n\n    link = f\"{base_url}/recovery/verify?t={token}\"\n    result = mailer.send_recovery_email(user[\"email\"], link, code, kind)\n    if result == mailer.SENT:\n        return\n    # 메일이 못 나갔다면 쓸 수 없는 요청이므로 취소한다. 사용자에게는 항상 같은 안내만 보인다.\n    db.revoke_recovery_request(created[\"id\"])\n    if result == mailer.REFUSED:\n        _flag_undeliverable(user, ip)", "alias": null}, "db/recovery.py:get_recovery_activity": {"path": "db/recovery.py", "start": 244, "end": 263, "lang": "python", "code": "def get_recovery_activity(user_id: int, hours: int = 24) -> tuple[int, str | None]:\n    \"\"\"이 사용자의 최근 `hours`시간 복구 요청 (건수, 가장 최근 요청 시각)을 한 번의 조회로 가져온다.\n\n    하루 요청 한도와 쿨다운 판단에 쓴다. 예전에는 건수 조회와 최근 시각 조회를 따로 했는데,\n    원격 Supabase는 쿼리 하나에 수백 ms가 걸리고 복구 요청 응답은 시간이 정해진 안에 끝나야\n    해서(Vercel 함수 제한 + 응답 시간 고정) 왕복 횟수를 줄였다.\n    \"\"\"\n    cutoff = (datetime.now(timezone.utc) - timedelta(hours=hours)).isoformat()\n    res = (\n        db.get_client()\n        .table(\"recovery_requests\")\n        .select(\"created_at\")\n        .eq(\"user_id\", user_id)\n        .gte(\"created_at\", cutoff)\n        .order(\"created_at\", desc=True)\n        .limit(50)\n        .execute()\n    )\n    rows = res.data\n    return len(rows), (rows[0][\"created_at\"] if rows else None)", "alias": {"call": "db.get_recovery_activity()", "via": "db/__init__.py", "real": "db/recovery.py"}}, "db/account_lockouts.py:get_active_account_lockout": {"path": "db/account_lockouts.py", "start": 147, "end": 163, "lang": "python", "code": "def get_active_account_lockout(username: str) -> dict | None:\n    \"\"\"이 계정이 \"지금 이 순간\" 실제로 잠겨있는지 확인하고, 잠겨있다면 그 잠금 정보를 돌려준다.\n\n    db.get_active_lockout()과 동일한 두 조건(active=True, 그리고 영구 잠금이거나\n    unlock_at이 미래)을 본다.\n    \"\"\"\n    res = (\n        db.get_client()\n        .table(\"account_lockouts\")\n        .select(\"*\")\n        .eq(\"username\", username)\n        .eq(\"active\", True)\n        .or_(f\"lock_type.eq.PERMANENT,unlock_at.gt.{db._now_iso()}\")\n        .limit(1)\n        .execute()\n    )\n    return res.data[0] if res.data else None", "alias": {"call": "db.get_active_account_lockout()", "via": "db/__init__.py", "real": "db/account_lockouts.py"}}, "db/lockouts.py:get_active_lockout": {"path": "db/lockouts.py", "start": 176, "end": 198, "lang": "python", "code": "def get_active_lockout(ip: str) -> dict | None:\n    \"\"\"이 IP가 \"지금 이 순간\" 실제로 잠겨있는지 확인하고, 잠겨있다면 그 잠금 정보를 돌려준다.\n\n    조건이 두 가지 다 맞아야 \"진짜로 잠긴 상태\"로 인정한다:\n    - active가 True (아직 해제되지 않았고)\n    - 영구 잠금(lock_type='PERMANENT', unlock_at이 NULL)이거나, unlock_at(풀리는\n      시각)이 지금보다 미래 (아직 시간이 안 지났고)\n\n    unlock_at만 보면 영구 잠금(NULL)이 \"안 잠김\"으로 판정되므로 or_ 조건이 필수다(guide33).\n\n    두 조건을 만족하는 기록이 없으면 None(없음)을 돌려준다.\n    \"\"\"\n    res = (\n        db.get_client()\n        .table(\"lockouts\")\n        .select(\"*\")\n        .eq(\"ip_address\", ip)\n        .eq(\"active\", True)\n        .or_(f\"lock_type.eq.PERMANENT,unlock_at.gt.{db._now_iso()}\")  # gt = \"~보다 미래\"\n        .limit(1)\n        .execute()\n    )\n    return res.data[0] if res.data else None  # 결과가 있으면 첫 번째 줄, 없으면 None", "alias": {"call": "db.get_active_lockout()", "via": "db/__init__.py", "real": "db/lockouts.py"}}, "routes/recovery.py:_eligible_target": {"path": "routes/recovery.py", "start": 63, "end": 81, "lang": "python", "code": "def _eligible_target(user: dict, account_lock: dict | None, ip_lock: dict | None, ip: str) -> tuple[str, str] | None:\n    \"\"\"이 요청으로 풀 수 있는 대상(kind, value)을 정한다. 없으면 None(메일을 보내지 않음).\n\n    계정이 영구 잠금이고 복구 방식이 SELF면 'account' — 단 이메일을 신뢰할 수 없는\n    계정(UNDELIVERABLE)은 제외한다. 아니면 요청 IP가 영구 잠금이고 복구 방식이\n    EXEMPTION이면 'ip'(예외만 발급, 허용 목록 IP는 애초에 영구 잠금되지 않는다).\n    account_lock/ip_lock은 호출부가 미리(병렬로) 조회해 넘긴 active 잠금 행이다.\n    \"\"\"\n    if (\n        account_lock\n        and account_lock.get(\"lock_type\") == \"PERMANENT\"\n        and account_lock.get(\"recoverable\") == \"SELF\"\n        and user.get(\"email_status\") != \"UNDELIVERABLE\"\n    ):\n        return \"account\", user[\"username\"]\n\n    if ip_lock and ip_lock.get(\"lock_type\") == \"PERMANENT\" and ip_lock.get(\"recoverable\") == \"EXEMPTION\":\n        return \"ip\", ip\n    return None", "alias": null}, "db/recovery.py:create_recovery_request": {"path": "db/recovery.py", "start": 35, "end": 74, "lang": "python", "code": "def create_recovery_request(\n    user_id: int,\n    target_kind: str,\n    target_value: str,\n    token_hash: str,\n    code_hash: str,\n    device_hash: str | None,\n    requested_ip: str,\n    expires_at_iso: str,\n) -> dict | None:\n    \"\"\"복구 요청 한 건을 새로 만든다. 같은 (사용자, 대상)의 기존 PENDING 요청은 먼저\n    REVOKED로 바꾼다 — idx_recovery_requests_one_pending(부분 유니크 인덱스)가 \"같은\n    대상에 PENDING은 1건\"을 DB 차원에서 강제하기 때문이다. 두 요청이 거의 동시에 들어와\n    인덱스가 두 번째 삽입을 막으면(23505) None을 돌려준다.\"\"\"\n    db.get_client().table(\"recovery_requests\").update({\"status\": \"REVOKED\"}).eq(\n        \"user_id\", user_id\n    ).eq(\"target_kind\", target_kind).eq(\"target_value\", target_value).eq(\"status\", \"PENDING\").execute()\n    try:\n        res = (\n            db.get_client()\n            .table(\"recovery_requests\")\n            .insert(\n                {\n                    \"user_id\": user_id,\n                    \"target_kind\": target_kind,\n                    \"target_value\": target_value,\n                    \"token_hash\": token_hash,\n                    \"code_hash\": code_hash,\n                    \"device_hash\": device_hash,\n                    \"requested_ip\": requested_ip,\n                    \"expires_at\": expires_at_iso,\n                }\n            )\n            .execute()\n        )\n    except APIError as e:\n        if e.code != \"23505\":\n            raise\n        return None\n    return res.data[0] if res.data else None", "alias": {"call": "db.create_recovery_request()", "via": "db/__init__.py", "real": "db/recovery.py"}}, "helpers/device.py:hash_secret": {"path": "helpers/device.py", "start": 26, "end": 29, "lang": "python", "code": "def hash_secret(value: str) -> str:\n    \"\"\"토큰·코드·기기 쿠키를 DB에 저장하기 전에 SHA-256 지문(해시)으로 바꾼다.\n    지문에서 원래 값을 되돌릴 수 없으므로 DB가 유출돼도 진짜 값은 새지 않는다.\"\"\"\n    return hashlib.sha256(value.encode(\"utf-8\")).hexdigest()", "alias": null}, "notify/mailer.py:send_recovery_email": {"path": "notify/mailer.py", "start": 163, "end": 178, "lang": "python", "code": "def send_recovery_email(to_address: str, link: str, code: str, kind: str) -> str:\n    \"\"\"복구 링크와 6자리 코드가 담긴 메일을 보낸다. kind는 'account'(계정 잠금 해제) 또는\n    'ip'(이 네트워크에서 본인·본인 기기만 접속 허용)다.\"\"\"\n    if kind == \"account\":\n        purpose = \"계정 영구 잠금을 해제\"\n    else:\n        purpose = \"이 네트워크에서 회원님과 요청하신 기기의 접속을 허용\"\n    body = (\n        f\"로그인 워치독에서 {purpose}하기 위한 본인 확인 요청이 접수되었습니다.\\n\\n\"\n        f\"아래 링크를 열어 확인 화면에서 [해제] 버튼을 눌러주세요 \"\n        f\"(유효시간 {config.RECOVERY_TOKEN_TTL_MINUTES}분, 1회용):\\n{link}\\n\\n\"\n        f\"링크를 열 수 없는 기기라면, 복구를 요청하신 기기의 /recovery/verify 화면에서 \"\n        f\"아래 6자리 코드를 입력하세요:\\n{code}\\n\\n\"\n        \"본인이 요청하지 않았다면 이 메일을 무시하세요. 링크를 누르지 않으면 아무 일도 일어나지 않습니다.\"\n    )\n    return _send_mail(to_address, \"[로그인 워치독] 본인 확인 및 잠금 해제 안내\", body)", "alias": null}, "routes/recovery.py:_flag_undeliverable": {"path": "routes/recovery.py", "start": 84, "end": 95, "lang": "python", "code": "def _flag_undeliverable(user: dict, ip: str) -> None:\n    \"\"\"메일 서버가 수신자를 영구 거부(존재하지 않는 이메일)했을 때의 위험 상향 처리.\n\n    users.email_status를 UNDELIVERABLE로 표시하고, 그 계정의 영구 잠금이 있으면 이메일로는\n    풀 수 없게(ADMIN_ONLY) 올린다. 이벤트는 MEDIUM으로만 기록하고 상관분석에는 보내지 않는다\n    — 요청한 IP가 HIGH 사건에 묶여 영구 잠금 후보가 되는 부작용을 피하기 위해서다.\n    \"\"\"\n    db.set_user_email_status(user[\"id\"], \"UNDELIVERABLE\")\n    db.insert_security_event(\n        \"EMAIL_UNDELIVERABLE\", \"MEDIUM\", ip, None, 1, \"FLAGGED\", username=user[\"username\"]\n    )\n    db.set_account_lockout_recoverable(user[\"username\"], \"ADMIN_ONLY\")", "alias": null}, "routes/recovery.py:recovery_verify_form": {"path": "routes/recovery.py", "start": 227, "end": 239, "lang": "python", "code": "@recovery_bp.route(\"/recovery/verify\", methods=[\"GET\"])\ndef recovery_verify_form():\n    \"\"\"메일 링크(?t=토큰)가 여는 확인 화면. 토큰을 소비하지 않는다 — 메일 보안 스캐너가\n    링크를 미리 열어도 사용자가 나중에 정상적으로 쓸 수 있어야 하기 때문이다.\n    토큰 없이 들어오면 6자리 코드 입력 폼을 보여준다.\"\"\"\n    token = request.args.get(\"t\", \"\")\n    if not token:\n        return render_template(\"recovery_verify.html\", mode=\"code\", message=None)\n\n    req = db.get_pending_recovery_by_token_hash(hash_secret(token))\n    if req is None:\n        return render_template(\"recovery_verify.html\", mode=\"invalid\", message=INVALID_LINK_MESSAGE)\n    return _confirm_page(req, token)", "alias": null}, "routes/recovery.py:recovery_verify_submit": {"path": "routes/recovery.py", "start": 266, "end": 312, "lang": "python", "code": "@recovery_bp.route(\"/recovery/verify\", methods=[\"POST\"])\ndef recovery_verify_submit():\n    \"\"\"확인 버튼(토큰) 또는 6자리 코드 입력으로 복구를 완료한다.\"\"\"\n    token = request.form.get(\"t\", \"\")\n    if token:\n        req = db.get_pending_recovery_by_token_hash(hash_secret(token))\n        if req is None:\n            return render_template(\"recovery_verify.html\", mode=\"invalid\", message=INVALID_LINK_MESSAGE)\n        # IP 복구는 요청한 기기에서만 — 다른 기기에서 누른 확인은 소비하지 않고 거부한다.\n        if req[\"target_kind\"] == \"ip\" and not _device_matches(req):\n            return _confirm_page(req, token)\n        return _finish(req)\n\n    username = request.form.get(\"username\", \"\").strip()\n    code = request.form.get(\"code\", \"\").strip()\n    req = (\n        db.get_latest_pending_recovery_for_username(username)\n        if code and config.USERNAME_PATTERN.match(username)\n        else None\n    )\n\n    # 코드는 복구 종류와 무관하게 \"복구를 요청한 기기\"에서만 받는다(guide39, 이전에는 IP 복구만).\n    # 아이디 없음 / 요청 없음 / 다른 기기를 같은 문구로 답하고 시도권도 쓰지 않는다 — 그래서\n    # 다른 기기에서는 (1) 이 아이디에 복구가 진행 중인지 알 수 없고 (2) 틀린 코드를 넣어 남의\n    # 복구 요청을 취소시킬 수도 없다. 메일 링크(토큰) 경로는 계정 복구라면 어느 기기에서나\n    # 동작한다(IP 복구 링크는 위 토큰 분기에서 보듯 요청한 기기에서만).\n    if req is None or not _device_matches(req):\n        return render_template(\"recovery_verify.html\", mode=\"code\", message=CODE_GENERIC_FAILURE_MESSAGE)\n\n    # 비교하기 \"전에\" 시도권부터 예약한다(guide37). 동시에 수백 개를 보내도 한도를 넘는\n    # 요청은 코드를 비교조차 하지 못한다 — 예약 실패(None)면 맞는 코드여도 통과시키지 않는다.\n    attempt = db.reserve_recovery_code_attempt(\n        req[\"id\"], req[\"code_attempts\"], config.RECOVERY_MAX_CODE_ATTEMPTS\n    )\n    if attempt is None:\n        return render_template(\"recovery_verify.html\", mode=\"code\", message=CODE_EXHAUSTED_MESSAGE)\n\n    if not hmac.compare_digest(hash_secret(code), req[\"code_hash\"]):\n        remaining = config.RECOVERY_MAX_CODE_ATTEMPTS - attempt\n        if remaining <= 0:\n            db.revoke_recovery_request(req[\"id\"])\n            return render_template(\"recovery_verify.html\", mode=\"code\", message=CODE_EXHAUSTED_MESSAGE)\n        return render_template(\n            \"recovery_verify.html\", mode=\"code\", message=f\"코드가 올바르지 않습니다. (남은 시도 {remaining}회)\"\n        )\n\n    return _finish(req)", "alias": null}, "routes/recovery.py:_device_matches": {"path": "routes/recovery.py", "start": 220, "end": 224, "lang": "python", "code": "def _device_matches(req: dict) -> bool:\n    \"\"\"지금 이 기기의 쿠키가 복구를 요청했던 기기와 같은지(타이밍 안전 비교).\"\"\"\n    current = get_device_hash()\n    stored = req.get(\"device_hash\")\n    return bool(current and stored) and hmac.compare_digest(current, stored)", "alias": null}, "db/recovery.py:reserve_recovery_code_attempt": {"path": "db/recovery.py", "start": 136, "end": 179, "lang": "python", "code": "def reserve_recovery_code_attempt(request_id: int, current_attempts: int, max_attempts: int) -> int | None:\n    \"\"\"6자리 코드를 비교하기 \"전에\" 시도권 1회를 원자적으로 예약하고, 예약된 시도 번호(1부터)를\n    돌려준다. 한도에 도달했거나, 요청이 더 이상 PENDING이 아니거나, 경쟁이 계속돼 예약하지\n    못하면 None — 호출부는 None이면 코드를 비교하지 않는다(실패 쪽으로 닫힌다).\n\n    왜 비교 전에 예약하나: 코드는 경우의 수가 100만 개뿐이라 횟수 제한이 유일한 방어선이다.\n    \"비교 → 틀리면 +1\" 순서면 동시에 보낸 요청 1000개가 횟수가 오르기 전에 전부 비교를\n    마쳐버린다. 먼저 시도권을 받아야만 비교할 수 있게 하면, 동시에 몇 개를 보내든 한도\n    이상은 비교되지 않는다.\n\n    예약은 \"읽은 횟수 그대로일 때만\" 올리는 조건부 UPDATE다(db.update_user_password와 같은\n    방식). 경쟁에서 지면(0행) 다시 읽고 재시도한다. 한도에 닿아도 여기서 REVOKED로 바꾸지\n    않는다 — 마지막 시도권으로 맞는 코드를 넣은 사용자는 성공해야 하기 때문이다. 마지막\n    시도마저 틀렸을 때의 취소는 호출부가 revoke_recovery_request()로 한다.\n    \"\"\"\n    current = current_attempts\n    for _ in range(_RESERVE_RETRIES):\n        if current >= max_attempts:\n            return None\n        res = (\n            db.get_client()\n            .table(\"recovery_requests\")\n            .update({\"code_attempts\": current + 1})\n            .eq(\"id\", request_id)\n            .eq(\"status\", \"PENDING\")\n            .eq(\"code_attempts\", current)\n            .gt(\"expires_at\", db._now_iso())\n            .execute()\n        )\n        if res.data:\n            return current + 1\n\n        latest = (\n            db.get_client()\n            .table(\"recovery_requests\")\n            .select(\"code_attempts, status\")\n            .eq(\"id\", request_id)\n            .limit(1)\n            .execute()\n        )\n        if not latest.data or latest.data[0][\"status\"] != \"PENDING\":\n            return None\n        current = latest.data[0][\"code_attempts\"]\n    return None", "alias": {"call": "db.reserve_recovery_code_attempt()", "via": "db/__init__.py", "real": "db/recovery.py"}}, "routes/recovery.py:_finish": {"path": "routes/recovery.py", "start": 242, "end": 263, "lang": "python", "code": "def _finish(req: dict):\n    \"\"\"검증을 통과한 요청을 원자적으로 소비하고 실제 조치(해제/예외 발급)를 반영한다.\"\"\"\n    consumed = db.consume_recovery_request(req[\"id\"])\n    if consumed is None:\n        return render_template(\"recovery_verify.html\", mode=\"invalid\", message=INVALID_LINK_MESSAGE)\n\n    user = db.get_user_by_id(consumed[\"user_id\"])\n    if user is None or not lockdown.apply_recovery(consumed, user[\"username\"]):\n        return render_template(\n            \"recovery_done.html\",\n            success=False,\n            kind=consumed[\"target_kind\"],\n            message=\"이미 해제되었거나 이메일 인증으로 풀 수 없는 상태입니다. 관리자에게 문의해주세요.\",\n        )\n\n    # 복구 메일의 링크·코드를 썼다 = 그 메일함의 주인이라는 증거이므로 이메일 인증으로도 친다(guide40).\n    try:\n        email_verification.mark_verified_after_recovery(user)\n    except Exception as e:  # noqa: BLE001\n        report_internal_error(e)\n    mailer.send_recovery_done_notice(user[\"email\"], consumed[\"target_kind\"])\n    return render_template(\"recovery_done.html\", success=True, kind=consumed[\"target_kind\"], message=None)", "alias": null}, "db/recovery.py:consume_recovery_request": {"path": "db/recovery.py", "start": 114, "end": 130, "lang": "python", "code": "def consume_recovery_request(request_id: int) -> dict | None:\n    \"\"\"복구 요청을 VERIFIED로 바꿔 \"소비\"한다 — 원자적 1회용 소비.\n\n    같은 요청이 거의 동시에 두 번 들어와도 DB가 한 행을 한 번에 하나씩만 고치므로,\n    먼저 온 쪽만 PENDING→VERIFIED로 바꾸고 늦게 온 쪽은 조건(status='PENDING')에 맞는\n    행이 없어 None(0행)을 받는다. 만료된 요청도 expires_at 조건으로 걸러진다.\n    \"\"\"\n    res = (\n        db.get_client()\n        .table(\"recovery_requests\")\n        .update({\"status\": \"VERIFIED\", \"verified_at\": db._now_iso()})\n        .eq(\"id\", request_id)\n        .eq(\"status\", \"PENDING\")\n        .gt(\"expires_at\", db._now_iso())\n        .execute()\n    )\n    return res.data[0] if res.data else None", "alias": {"call": "db.consume_recovery_request()", "via": "db/__init__.py", "real": "db/recovery.py"}}, "security/lockdown.py:apply_recovery": {"path": "security/lockdown.py", "start": 261, "end": 296, "lang": "python", "code": "def apply_recovery(recovery_request: dict, username: str) -> bool:\n    \"\"\"이메일 인증이 끝난 복구 요청을 실제 조치로 반영한다. 실제로 반영됐을 때만 True.\n\n    - account: SELF 복구 방식인 영구 계정 잠금을 풀고(ADMIN_ONLY는 풀지 않음), 보호관찰\n      기간을 시작한다.\n    - ip: 그 IP가 지금도 EXEMPTION 복구 방식의 영구 잠금일 때만, \"요청한 사용자 + 요청한\n      기기\"에게 예외를 발급한다(IP 자체는 계속 잠긴 상태다).\n    \"\"\"\n    target_kind = recovery_request[\"target_kind\"]\n    target_value = recovery_request[\"target_value\"]\n\n    if target_kind == \"account\":\n        if not db.release_permanent_account_lockout(target_value, only_recoverable=\"SELF\"):\n            return False\n        db.resolve_security_events_for_username(target_value)\n        db.mark_lock_released(\"account\", target_value, \"EMAIL_RECOVERY\", \"이메일 인증으로 해제\")\n        probation_until = datetime.now(timezone.utc) + timedelta(hours=config.RECOVERY_PROBATION_HOURS)\n        db.set_account_probation(target_value, probation_until.isoformat())\n        alert.send_recovery_completed_alert(\"account\", target_value, username)\n        return True\n\n    row = db.get_active_lockout(target_value)\n    if not row or row.get(\"lock_type\") != \"PERMANENT\" or row.get(\"recoverable\") != \"EXEMPTION\":\n        return False\n    if not recovery_request.get(\"device_hash\"):\n        return False\n    expires_at = datetime.now(timezone.utc) + timedelta(days=config.IP_EXEMPTION_DAYS)\n    db.insert_ip_exemption(\n        target_value,\n        recovery_request[\"user_id\"],\n        recovery_request[\"device_hash\"],\n        \"EMAIL_RECOVERY\",\n        expires_at.isoformat(),\n    )\n    alert.send_recovery_completed_alert(\"ip\", target_value, username)\n    return True", "alias": null}, "db/account_lockouts.py:release_permanent_account_lockout": {"path": "db/account_lockouts.py", "start": 113, "end": 130, "lang": "python", "code": "def release_permanent_account_lockout(username: str, only_recoverable: str | None = None) -> bool:\n    \"\"\"active인 영구 계정 잠금을 해제한다. 실제로 풀렸을 때만 True.\n\n    only_recoverable을 주면 그 복구 방식(예: 'SELF')인 행만 푼다 — 이메일 복구\n    (lockdown.apply_recovery)가 \"관리자만 풀 수 있게 올려둔(ADMIN_ONLY) 잠금\"을\n    실수로 풀지 않도록, 조건을 UPDATE 문 안에 넣어 확인과 해제를 한 번에 한다.\n    \"\"\"\n    query = (\n        db.get_client()\n        .table(\"account_lockouts\")\n        .update({\"active\": False})\n        .eq(\"username\", username)\n        .eq(\"lock_type\", \"PERMANENT\")\n        .eq(\"active\", True)\n    )\n    if only_recoverable is not None:\n        query = query.eq(\"recoverable\", only_recoverable)\n    return bool(query.execute().data)", "alias": {"call": "db.release_permanent_account_lockout()", "via": "db/__init__.py", "real": "db/account_lockouts.py"}}, "db/account_lockouts.py:set_account_probation": {"path": "db/account_lockouts.py", "start": 140, "end": 144, "lang": "python", "code": "def set_account_probation(username: str, until_iso: str) -> None:\n    \"\"\"이메일 복구로 풀린 계정에 보호관찰 종료 시각을 기록한다(그 전에 다시 잠기면 관리자 전용).\"\"\"\n    db.get_client().table(\"account_lockouts\").update({\"probation_until\": until_iso}).eq(\n        \"username\", username\n    ).execute()", "alias": {"call": "db.set_account_probation()", "via": "db/__init__.py", "real": "db/account_lockouts.py"}}, "db/ip_exemptions.py:insert_ip_exemption": {"path": "db/ip_exemptions.py", "start": 17, "end": 46, "lang": "python", "code": "def insert_ip_exemption(\n    ip: str, user_id: int, device_hash: str, granted_via: str, expires_at_iso: str\n) -> None:\n    \"\"\"IP 영구 잠금 예외(출입증)를 발급한다. 같은 (ip, 사용자, 기기)의 ACTIVE 예외가 이미\n    있으면 새로 만들지 않고 만료 시각만 연장한다(부분 유니크 인덱스 idx_ip_lock_exemptions_active).\"\"\"\n    res = (\n        db.get_client()\n        .table(\"ip_lock_exemptions\")\n        .update({\"expires_at\": expires_at_iso})\n        .eq(\"ip_address\", ip)\n        .eq(\"user_id\", user_id)\n        .eq(\"device_hash\", device_hash)\n        .eq(\"status\", \"ACTIVE\")\n        .execute()\n    )\n    if res.data:\n        return\n    try:\n        db.get_client().table(\"ip_lock_exemptions\").insert(\n            {\n                \"ip_address\": ip,\n                \"user_id\": user_id,\n                \"device_hash\": device_hash,\n                \"granted_via\": granted_via,\n                \"expires_at\": expires_at_iso,\n            }\n        ).execute()\n    except APIError as e:\n        if e.code != \"23505\":\n            raise", "alias": {"call": "db.insert_ip_exemption()", "via": "db/__init__.py", "real": "db/ip_exemptions.py"}}, "notify/mailer.py:send_recovery_done_notice": {"path": "notify/mailer.py", "start": 181, "end": 194, "lang": "python", "code": "def send_recovery_done_notice(to_address: str, kind: str) -> str:\n    \"\"\"복구가 완료됐다는 사실을 계정 이메일로 알린다 — 본인이 한 일이 아니라면 바로 알 수 있게 한다.\"\"\"\n    if kind == \"account\":\n        what = \"계정 영구 잠금이 해제되었습니다. 이후 24시간은 보호관찰 기간이라 다시 잠기면 관리자만 해제할 수 있습니다.\"\n    else:\n        what = \"이 네트워크에서 회원님과 복구를 요청하신 기기의 접속이 허용되었습니다.\"\n    body = (\n        f\"{what}\\n\\n\"\n        \"본인이 한 일이 아니라면 관리자에게 알려주세요.\\n\"\n        \"계정이 공격받아 잠겼던 것이므로, 로그인한 뒤 '내 프로필' 화면에서 비밀번호를 바꾸는 것을 권장합니다\"\n        f\"{_profile_link_line()}\\n\"\n        \"비밀번호를 바꾸면 다른 기기의 로그인은 모두 해제됩니다.\"\n    )\n    return _send_mail(to_address, \"[로그인 워치독] 잠금 해제가 완료되었습니다\", body)", "alias": null}, "routes/auth.py:login_submit": {"path": "routes/auth.py", "start": 196, "end": 315, "lang": "python", "code": "@auth_bp.route(\"/login\", methods=[\"POST\"])\ndef login_submit():\n    \"\"\"로그인 폼 제출을 처리한다. 이 함수 하나가 이 프로젝트의 핵심 흐름을 담당한다.\n\n    처리 순서:\n    1. 혹시 자동으로 풀어줘야 할 만료된 잠금(IP 단위 + 계정 단위)이 있으면 먼저 정리한다.\n    2. 이번 요청을 보낸 IP와 입력된 아이디를 알아낸다.\n    3. 이 IP가 지금 잠긴 상태이거나, 이 계정 자체가 (다른 IP들이 나눠서 공격해서)\n       잠긴 상태라면 아이디/비밀번호를 확인하지도 않고 곧바로 거부한다. 단, 영구 잠금된\n       IP는 이메일 복구로 예외를 받은 \"본인 + 본인 기기\"만 통과시킨다(guide33/34-a).\n    4. 잠긴 상태가 아니라면 실제로 아이디/비밀번호를 확인하고, 그 시도를 기록한다.\n    5. 실패했다면 \"혹시 이 IP가 수상한 수준(5회 초과)이 됐는지\"를 먼저 보고,\n       아니라면 \"혹시 이 계정이 여러 IP에 걸쳐 총합으로 수상한 수준(8회 초과)이\n       됐는지\"도 본다 — 전자는 soar.enforce_lockout(IP 잠금), 후자는\n       soar.enforce_account_lockout(계정 잠금)이 알림까지 같이 보낸다\n       (L7 공격 보강 계획 Tier 1: 분산/저속 브루트포스 대응). 둘 다 아직 기준치 아래지만\n       코앞이면 LLM 조기 경보를 판단한다(guide31).\n    6. 성공했다면 회원 세션을 만들어서 회원 대시보드로 이동시킨다(12단계에서 추가).\n    \"\"\"\n    # 1) 시간이 지나 자동으로 풀려야 할 잠금들을 정리 (IP 단위 + 계정 단위)\n    soar.try_release_expired_lockouts()\n    soar.try_release_expired_account_lockouts()\n\n    ip = get_request_ip()\n    username = request.form.get(\"username\", \"\")\n    password = request.form.get(\"password\", \"\")\n\n    # 허니팟 필드가 채워져 있으면 사람이 아니라 자동화 스크립트라고 보고,\n    # 자격 증명 확인/시도 기록 없이 즉시 거부한다 (L7 공격 보강 계획 Tier 3).\n    if is_bot_submission():\n        soar.notify_bot_detected(ip, request.path)\n        flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n        return render_template(\"login_form.html\", form_action=url_for(\"auth.login_submit\"))\n\n    # 2) 이미 잠긴 IP이거나, 이미 잠긴 계정이라면 검증 자체를 건너뛰고 즉시 거부\n    #    — 단, 영구 잠금된 IP는 \"이메일 복구로 예외를 받은 본인+본인 기기\"만 통과시킨다(guide33).\n    exemption = None\n    if detector.is_locked(ip):\n        if detector.get_ip_lock_state(ip) != detector.LOCK_STATE_PERMANENT:\n            flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n            return _login_form()\n        exemption = _find_ip_exemption(ip, username)\n        if exemption is None:\n            flash(\"이 네트워크는 차단되어 있습니다. 본인이라면 아래 '본인 인증으로 접속 허용'을 이용해주세요.\")\n            return _login_form(recovery_link=True)\n        # 예외가 있으면 IP 잠금 안내 없이 아래 계정 잠금 확인과 정상적인 비밀번호 확인으로 계속 진행한다.\n\n    if detector.is_account_locked(username):\n        flash(ACCOUNT_LOCKED_MESSAGE)\n        return _login_form(recovery_link=True)\n\n    success = db.verify_user_credentials(username, password)\n    db.log_attempt(ip, username, success)\n\n    if success:\n        # 관리자 세션(\"admin_username\")과는 완전히 다른 키(\"username\")를 쓴다 —\n        # 그래야 같은 브라우저에서 관리자 세션이 있더라도 서로 섞이지 않는다.\n        # user_id도 같이 저장해두는 이유는 member_login_required 문지기 뒤에서\n        # \"아이디\"가 아니라 변하지 않는 \"번호\"로 본인 행을 정확히 찾기 위해서다.\n        user = db.get_user_by_username(username)\n        session[\"username\"] = username\n        session[\"user_id\"] = user[\"id\"]\n        # 세션 세대 번호 — 나중에 비밀번호가 바뀌면 이 세션을 끊는 데 쓴다(guide35).\n        session[\"session_version\"] = user.get(\"session_version\") or 0\n        return redirect(url_for(\"member.member_dashboard\"))\n\n    # 영구 잠금 예외로 통과한 사용자가 연달아 실패하면 그 예외를 회수한다 — 예외는 \"본인이\n    # 비밀번호를 아는 상황\"을 전제로 한 출입증이라, 계속 틀리는 건 도용 신호로 본다.\n    # (예외 통과자의 실패는 IP 임계값 판정으로 넘기지 않는다 — 이 IP는 이미 영구 잠금 중이라\n    # enforce_lockout()이 5분 잠금 알림을 또 보내는 일이 없도록 하기 위해서다.)\n    if exemption is not None:\n        if db.count_recent_failures(ip) >= config.IP_EXEMPTION_MAX_FAILURES:\n            db.revoke_ip_exemption(exemption[\"id\"], \"예외 통과 후 연속 로그인 실패\")\n        flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n        return _login_form()\n\n    # 실패했다면, 먼저 이 IP가 방금 임계값을 넘었는지 확인한다.\n    suspicious, failure_count = detector.is_suspicious(ip)\n    if suspicious:\n        # 최근 실패에 쓰인 아이디가 몇 개였는지도 함께 세서, Slack 알림이 Brute\n        # Force(계정 1개 집중)와 Password Spraying(계정 여러 개 순회)을 구분해\n        # 표시할 수 있게 한다 (attack_response_state.md 구현 대상 #5).\n        distinct_usernames = detector.count_distinct_usernames(ip)\n        soar.enforce_lockout(ip, failure_count, distinct_usernames)\n        flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n    else:\n        # 아직 기준치(FAILURE_THRESHOLD)는 안 넘었지만 코앞이면, LLM에게 조기\n        # 경보 여부를 물어본다 (Track A, guide31). 공격자가 임계값을 살짝\n        # 피해 가려고 실패 횟수를 일부러 코앞에서 멈추는 패턴을 이 구간에서 잡는다.\n        if failure_count >= config.FAILURE_THRESHOLD - config.EARLY_WARNING_BAND:\n            distinct_usernames = detector.count_distinct_usernames(ip)\n            soar.consider_early_warning(\n                \"BRUTE_FORCE\", \"LOCK_IP\", \"ip\", ip, failure_count, config.FAILURE_THRESHOLD,\n                context_count=distinct_usernames,\n            )\n\n        # IP 단위로는 아직 수상하지 않더라도, 이 계정이 여러 IP에 걸쳐 나뉘어서\n        # 총합 기준으로 수상한 수준이 됐는지 확인한다 — 공격자가 IP를 돌려가며\n        # (봇넷/프록시 로테이션) 한 계정만 노리는 분산 브루트포스를 잡아낸다.\n        account_suspicious, account_failure_count = detector.is_account_suspicious(username)\n        if account_suspicious:\n            distinct_ips = detector.count_distinct_ips_by_username(username)\n            soar.enforce_account_lockout(username, account_failure_count, distinct_ips, ip)\n            flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n        else:\n            # 이 계정도 마찬가지로 임계값(ACCOUNT_FAILURE_THRESHOLD) 코앞이면\n            # 조기 경보 대상이다 — 여러 IP에 나눠 시도하되 각 IP·계정 총합\n            # 모두를 임계값 아래로 유지하려는 패턴을 잡아낸다.\n            if account_failure_count >= config.ACCOUNT_FAILURE_THRESHOLD - config.EARLY_WARNING_BAND:\n                distinct_ips = detector.count_distinct_ips_by_username(username)\n                soar.consider_early_warning(\n                    \"DISTRIBUTED_BRUTE_FORCE\", \"LOCK_ACCOUNT\", \"account\", username,\n                    account_failure_count, config.ACCOUNT_FAILURE_THRESHOLD,\n                    context_count=distinct_ips, context_ip=ip,\n                )\n            # 사용자 존재 여부(아이디가 없는지, 비밀번호만 틀렸는지)를 구분해서\n            # 알려주면 공격자에게 힌트를 주게 되므로, 항상 똑같은 문구로만 실패를 알린다.\n            flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n\n    return render_template(\"login_form.html\", form_action=url_for(\"auth.login_submit\"))", "alias": null}, "routes/auth.py:_find_ip_exemption": {"path": "routes/auth.py", "start": 171, "end": 180, "lang": "python", "code": "def _find_ip_exemption(ip: str, username: str) -> dict | None:\n    \"\"\"이 IP에서 이 사용자가 \"이 기기\"로 유효한 영구 잠금 예외를 가졌는지 찾는다.\n    사용자가 없거나 기기 쿠키가 없으면 항상 None이다(공격자는 둘 다 갖지 못한다).\"\"\"\n    device_hash = get_device_hash()\n    if not device_hash:\n        return None\n    user = db.get_user_by_username(username)\n    if user is None:\n        return None\n    return db.get_active_ip_exemption(ip, user[\"id\"], device_hash)", "alias": null}, "db/ip_exemptions.py:get_active_ip_exemption": {"path": "db/ip_exemptions.py", "start": 49, "end": 66, "lang": "python", "code": "def get_active_ip_exemption(ip: str, user_id: int, device_hash: str | None) -> dict | None:\n    \"\"\"이 IP·사용자·기기에 유효한(ACTIVE + 만료 전) 예외가 있으면 그 행을 돌려준다.\n    기기 쿠키가 없으면(device_hash=None) 항상 없음 — 공격자는 이 쿠키를 갖고 있지 않다.\"\"\"\n    if not device_hash:\n        return None\n    res = (\n        db.get_client()\n        .table(\"ip_lock_exemptions\")\n        .select(\"*\")\n        .eq(\"ip_address\", ip)\n        .eq(\"user_id\", user_id)\n        .eq(\"device_hash\", device_hash)\n        .eq(\"status\", \"ACTIVE\")\n        .gt(\"expires_at\", db._now_iso())\n        .limit(1)\n        .execute()\n    )\n    return res.data[0] if res.data else None", "alias": {"call": "db.get_active_ip_exemption()", "via": "db/__init__.py", "real": "db/ip_exemptions.py"}}, "db/ip_exemptions.py:revoke_ip_exemption": {"path": "db/ip_exemptions.py", "start": 69, "end": 79, "lang": "python", "code": "def revoke_ip_exemption(exemption_id: int, reason: str) -> bool:\n    \"\"\"예외를 회수한다(관리자 회수 또는 예외 통과 사용자의 연속 로그인 실패). 실제로 회수됐을 때만 True.\"\"\"\n    res = (\n        db.get_client()\n        .table(\"ip_lock_exemptions\")\n        .update({\"status\": \"REVOKED\", \"revoked_reason\": reason})\n        .eq(\"id\", exemption_id)\n        .eq(\"status\", \"ACTIVE\")\n        .execute()\n    )\n    return bool(res.data)", "alias": {"call": "db.revoke_ip_exemption()", "via": "db/__init__.py", "real": "db/ip_exemptions.py"}}}, "files": {"routes/recovery.py": {"role": "복구 화면 4개(요청 폼 · 메일 요청 · 확인 화면 · 완료)의 입구 파일. 계정 존재 여부를 숨기는 것이 핵심 원칙.", "header": "routes/recovery.py — 이메일 인증으로 영구 잠금을 풀거나(계정) 본인 기기만 통과시키는(IP)\n복구 화면 4개 (guide34-a)\nGET  /recovery           아이디 입력 폼\nPOST /recovery/request   복구 메일 발송 (항상 같은 응답)\nGET  /recovery/verify    메일 링크가 여는 확인 화면 (토큰을 소비하지 않음)\nPOST /recovery/verify    토큰/6자리 코드를 소비하고 실제로 해제·예외 발급\n보안 원칙 (계획서 1.3-C)\n- 계정 존재 여부를 숨긴다: 아이디가 없든, 잠기지 않았든, 복구 대상이 아니든 항상 같은\n문구·비슷한 응답 시간으로 답한다.\n- 메일 보안 스캐너가 링크를 먼저 GET으로 열어도 토큰이 닳지 않게, GET은 확인 화면만\n보여주고 토큰은 POST에서만 소비한다.\n- 링크는 request.host_url(공격자가 조작 가능한 Host 헤더)이 아니라 PUBLIC_BASE_URL로만 만든다.\n- 토큰·코드는 SHA-256 해시만 저장하고, 비교는 hmac.compare_digest로 한다.\n- IP 복구는 \"복구를 요청한 그 기기\"에서만 완료된다(피해자의 메일 링크를 공격자의 요청과\n엮어서 공격자 기기에 예외를 발급받는 시나리오 차단).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/recovery.py"}, "helpers/device.py": {"role": "복구를 요청한 브라우저를 구분하는 기기 쿠키를 다루는 도구.", "header": "helpers/device.py — 비밀값 해시와 기기 쿠키(lw_dev)\n예전 helpers.py(314줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from helpers import ...`로 가져다 쓴다(helpers/__init__.py가\n재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/helpers/device.py"}, "security/soar/observe.py": {"role": "security/soar/observe.py — 잠그지 않고 관찰만 하는 조치(알림 + 이벤트 기록)와 요청 거부 기록 예전 soar.py(497줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접 가리키지 않고 예전처럼 `from security import soa", "header": "security/soar/observe.py — 잠그지 않고 관찰만 하는 조치(알림 + 이벤트 기록)와 요청 거부 기록\n예전 soar.py(497줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from security import soar` 후 `soar.enforce_lockout(...)`으로\n쓴다(security/soar/__init__.py가 재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/soar/observe.py"}, "helpers/timing.py": {"role": "응답 시간을 항상 같게 맞추는 도구. 응답이 빠르냐 느리냐로 아이디 존재 여부가 새지 않게 한다.", "header": "helpers/timing.py — 응답 시간 고정(타이밍 사이드채널 방지) — 원래 routes/recovery.py에 있던 함수\n예전 helpers.py(314줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from helpers import ...`로 가져다 쓴다(helpers/__init__.py가\n재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/helpers/timing.py"}, "db/recovery.py": {"role": "복구 요청(recovery_requests 표)을 만들고, 토큰·코드를 해시로 비교·1회 소비하는 저장소 파일.", "header": "db/recovery.py — recovery_requests 표 + users.email_status 관련 함수\n(guide34-a, 이메일 인증 복구). ip_lock_exemptions 표 함수는 2026-10-09에\ndb/ip_exemptions.py로 나눴다.\nrecovery_requests는 \"이메일로 보낸 1회용 복구 링크/코드\" 한 건 한 건이다. 토큰과\n코드는 원문이 아니라 SHA-256 해시만 저장한다(DB가 유출돼도 진짜 토큰은 못 얻도록).\nSupabase REST에서는 파이썬이 BEGIN/COMMIT을 쓸 수 없으므로, 동시에 같은 토큰이\n두 번 들어와도 한 번만 처리되게 \"조건부 UPDATE(WHERE status='PENDING')\"를 쓴다 —\ndb.decide_request()와 같은 방식이다.\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/recovery.py"}, "db/account_lockouts.py": {"role": "db/account_lockouts.py — account_lockouts 표 관련 함수 — \"지금 어떤 계정(아이디)이 잠겨있고, 언제 풀리는지\"라는 \"현재 상태\"를 관리한다. db/lockouts.py(IP 단위 잠금)와 짝을 이루는 계정 단위 잠금이다 — 공격자가 여러 IP로 나눠", "header": "db/account_lockouts.py — account_lockouts 표 관련 함수\n— \"지금 어떤 계정(아이디)이 잠겨있고, 언제 풀리는지\"라는 \"현재 상태\"를 관리한다.\ndb/lockouts.py(IP 단위 잠금)와 짝을 이루는 계정 단위 잠금이다 — 공격자가 여러\nIP로 나눠서(또는 느린 속도로) 같은 계정만 노리면 IP당 실패 횟수는 임계값을\n넘지 않아 lockouts로는 못 잡는다. 이 표는 IP와 무관하게 \"이 계정이 총 몇 번\n실패했는가\"를 기준으로 잠근다 (L7 공격 보강 계획 Tier 1).\ndb.get_client()를 통해 호출하는 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/account_lockouts.py"}, "db/lockouts.py": {"role": "db/lockouts.py — lockouts 표 관련 함수 — \"지금 어떤 IP가 잠겨있고, 언제 풀리는지\"라는 \"현재 상태\"를 관리하는 기능 (login_attempts가 \"지나간 일의 기록\"이라면, lockouts는 \"지금 이 순간의 상태판\") db.get_client()/db._", "header": "db/lockouts.py — lockouts 표 관련 함수\n— \"지금 어떤 IP가 잠겨있고, 언제 풀리는지\"라는 \"현재 상태\"를 관리하는 기능\n(login_attempts가 \"지나간 일의 기록\"이라면, lockouts는 \"지금 이 순간의 상태판\")\ndb.get_client()/db._now_iso()를 통해 호출하는 이유는 db/attempts.py 상단\n설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/lockouts.py"}, "notify/mailer.py": {"role": "복구·완료 메일 발송과, 발송 실패 원인 분류 후 관리자 알림을 담당한다.", "header": "notify/mailer.py — \"우체부\" 역할: 사용자에게 가는 메일을 실제로 보낸다\n(영구 잠금 복구 guide34-a, 비밀번호 변경 알림 guide35, 이메일 인증·변경 guide40,\n비밀번호 재설정 guide41)\nnotify/alert.py(Slack)와 같은 구조다 — 메시지를 조립하는 함수(send_recovery_email 등)와\n실제로 내보내는 함수 하나(_send_mail)로 나뉜다. \"언제 보낼지\"는 이 파일이 아니라\nroutes/recovery.py, routes/member.py, services/email_verification.py가 결정한다.\n전송 결과는 예외가 아니라 세 가지 문자열 중 하나로 돌려준다:\nSENT    — 메일 서버가 받아줬다\nREFUSED — 메일 서버가 \"그런 수신자는 없다\"고 영구적으로 거부했다(5xx).\n존재하지 않는 이메일 주소일 가능성이 높다 → 호출부가 계정의\nemail_status를 UNDELIVERABLE로 올린다\nFAILED  — 설정이 없거나 네트워크/일시 장애라 못 보냈다(이메일 문제라고 단정할 수 없음)\n(Gmail처럼 일단 받고 나중에 반송하는 비동기 반송은 SMTP 응답만으로는 알 수 없다.)\nFAILED일 때는 원인을 네 가지로 나눠 기록하고(설정/인증/연결/기타) 관리자에게 Slack으로\n알린다. 사용자 화면은 계정 존재 여부가 드러나지 않게 항상 같은 안내를 보여주기 때문에,\n알림이 없으면 메일 설정이 틀려도 아무도 모른 채 \"메일을 보냈습니다\"만 계속 뜨게 된다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/notify/mailer.py"}, "security/lockdown.py": {"role": "복구가 끝나면 계정 잠금 해제(+보호관찰) 또는 IP '본인 + 본인 기기' 예외 발급을 실제로 반영한다.", "header": "security/lockdown.py — \"영구 출입금지 담당 부서\": 임시 잠금을 영구 잠금으로 올리고(승격),\n영구 잠금을 풀어주는(관리자 해제 / 이메일 복구) 로직 본체 (guide33 / guide34-a)\n왜 별도 모듈인가: security/soar/가 이미 security/correlate.py를 import하고 있어서, security/correlate.py가\nsecurity/soar/의 승격 함수를 직접 부르면 순환 import가 된다. 그래서 승격·해제 로직을 이\n파일 하나로 모으고, security/soar/와 security/correlate.py가 둘 다 이 파일만 import하게 한다.\n이 파일은 모듈 수준에서 db / alert / config / ip_utils만 import한다. 영구 잠금 이벤트를\n상관분석(correlate)에 흘려보내는 부분만 함수 안에서 늦게 import한다(순환 방지).\n설계 원칙 (docs의 permanent-lock 계획서 1.1 참고)\n- \"영구\"는 시간이 아니라 해제 조건의 문제다: 자동 만료가 없고 이메일 인증이나\n관리자 수동 해제로만 풀린다.\n- IP 영구 잠금은 이메일로 \"해제\"하지 않고 본인+본인 기기에게만 \"예외\"를 발급한다.\n- 허용 목록(PERMANENT_LOCK_IP_ALLOWLIST)의 IP는 절대 영구 잠그지 않는다(자충수 방지).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/lockdown.py"}, "db/ip_exemptions.py": {"role": "영구 잠금 IP 에서 본인 기기만 통과시키는 예외(출입증) 표를 다루는 저장소 파일.", "header": "db/ip_exemptions.py — ip_lock_exemptions 표 관련 함수 (guide34-a)\nip_lock_exemptions는 IP 영구 잠금에서 \"본인 + 본인 기기\"만 통과시키는 출입증이다.\n이메일 인증 복구가 IP 복구를 끝낼 때(security/lockdown.py의 apply_recovery) 여기에 발급한다. 원래\ndb/recovery.py에 같이 있었는데 2026-10-09에 나눴다(docs/refactor/2026-10-09-module-plan.md).\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/ip_exemptions.py"}, "routes/auth.py": {"role": "로그인 입구 파일. 영구 잠긴 IP 에서 '회원 + 기기'가 맞는 예외만 통과시킨다.", "header": "routes/auth.py — 회원가입(/signup) + 감시 대상 로그인(/login)\n원래 app.py의 \"회원가입 입력 검증 규칙\" / \"회원가입\" / \"감시 대상 로그인\"\n세 섹션을 그대로 옮겨왔다. 배경은 docs/refactor/2026-09-15-file-split.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/auth.py"}}}</script>
<script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var $ = function(id){ return document.getElementById(id); };
  var KIND_LABEL = {screen:"화면 · 도착지", route:"routes", helper:"판단", db:"db", config:"설정값", later:"다른 단원"};

  var state = { sc: 0, node: null, item: 0, file: null };

  function el(tag, attrs, kids){
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function brk(t){ return t.replace(/([\/._])/g, "$1\u200b"); }
  function scen(){ return D.scenarios[state.sc]; }
  function nodeById(id){ return scen().nodes.filter(function(n){ return n.id === id; })[0]; }
  function fnName(label){ return label; }

  /* ---------- 간단 문법 강조 ---------- */
  var PY = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?''')|([rbfRBF]{0,2}"(?:\\.|[^"\\\n])*"|[rbfRBF]{0,2}'(?:\\.|[^'\\\n])*')|\b(def|class|return|if|elif|else|for|while|import|from|as|try|except|finally|with|in|not|and|or|is|None|True|False|raise|pass|lambda|yield|global|nonlocal|assert|del|continue|break)\b|(@[A-Za-z_][\w.]*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(?=\()/g;
  var PYC = [null,"t-c","t-d","t-s","t-k","t-a","t-n","t-f"];
  var HT = /(<!--[\s\S]*?-->)|(\{[{%#][\s\S]*?[}%#]\})|(<\/?[A-Za-z][\w-]*)|("[^"\n]*")|(\/?>)/g;
  var HTC = [null,"t-c","t-a","t-k","t-s","t-k"];
  var JS = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\.|[^`\\])*`)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(const|let|var|function|return|if|else|for|while|import|from|export|default|async|await|try|catch|finally|new|class|extends|typeof|interface|type|null|undefined|true|false|throw|switch|case|break|continue|of|in|as)\b|(@[A-Za-z_]\w*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_$][\w$]*)(?=\()/g;
  var JSC = [null,"t-c","t-s","t-s","t-k","t-a","t-n","t-f"];
  var SQ = /(--[^\n]*|\/\*[\s\S]*?\*\/)|((?!))|('(?:''|[^'])*')|\b(select|from|where|insert|into|values|update|set|delete|create|table|index|alter|add|drop|on|conflict|do|nothing|and|or|not|null|default|primary|key|references|cascade|if|exists|as|order|by|group|limit|desc|asc|join|left|inner|count|returns|function|language|begin|end|return|with|union|all|distinct|in|is|true|false|unique|check|constraint|timestamptz|text|integer|bigint|boolean|interval|now|replace|trigger|view|policy|enable|row|level|security|using)\b|((?!))|\b(\d+(?:\.\d+)?)\b|\b([a-z_]\w*)(?=\()/gi;
  var SQC = [null,"t-c",null,"t-s","t-k",null,"t-n","t-f"];
  var SH = /(#[^\n]*)|((?!))|("(?:\\.|[^"\\\n])*"|'[^'\n]*')|\b(if|then|else|fi|for|do|done|while|case|esac|function|echo|export|python|pip|git|cd|run|name|on|jobs|steps|uses|with|env)\b|((?!))|\b(\d+)\b/g;
  var SHC = [null,"t-c",null,"t-s","t-k",null,"t-n"];
  function tokenize(code, lang){
    var re = PY, cls = PYC;
    if (lang === "html"){ re = HT; cls = HTC; }
    else if (lang === "js"){ re = JS; cls = JSC; }
    else if (lang === "sql"){ re = SQ; cls = SQC; }
    else if (lang === "sh"){ re = SH; cls = SHC; }
    var lines = [[]];
    function push(text, c){
      var parts = text.split("\n");
      parts.forEach(function(p, i){
        if (i > 0) lines.push([]);
        if (p) lines[lines.length-1].push([p, c]);
      });
    }
    var last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(code)) !== null){
      if (m.index > last) push(code.slice(last, m.index), null);
      var idx = 1; while (idx < m.length && m[idx] === undefined) idx++;
      push(m[0], cls[idx] || null);
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++;
    }
    if (last < code.length) push(code.slice(last), null);
    return lines;
  }

  function codeTable(block, hl){
    var lines = tokenize(block.code, block.lang);
    var tbody = el("tbody");
    var hlFirst = null;
    lines.forEach(function(segs, i){
      var no = block.start + i;
      var on = hl && no >= hl[0] && no <= hl[1];
      var td = el("td", {class:"tx"});
      segs.forEach(function(s){ td.appendChild(s[1] ? el("span", {class:s[1], text:s[0]}) : document.createTextNode(s[0])); });
      if (!segs.length) td.appendChild(document.createTextNode(" "));
      var tr = el("tr", on ? {class:"hl"} : null, [el("td", {class:"ln", text:String(no)}), td]);
      if (on && !hlFirst) hlFirst = tr;
      tbody.appendChild(tr);
    });
    var box = el("div", {class:"codebox"}, [el("table", {class:"code"}, [tbody])]);
    box._hlFirst = hlFirst;
    return box;
  }

  function copyText(text, btn){
    var done = function(){ var o = btn.textContent; btn.textContent = "복사됨 ✓"; setTimeout(function(){ btn.textContent = o; }, 1200); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
    function fallback(){
      var ta = el("textarea", {style:"position:fixed;opacity:0"}); ta.value = text; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); done(); } catch(e){} document.body.removeChild(ta);
    }
  }

  /* ---------- 패널 ---------- */
  function openPanel(){ document.body.classList.add("open"); }
  function closePanel(){ document.body.classList.remove("open"); }

  function showHint(){
    $("pTitle").textContent = "코드 보는 법";
    $("pSub").textContent = "카드나 파일 이름을 누르면 실제 코드가 여기에 열립니다.";
    var ul = el("ul", {class:"hint"}, [
      el("li", {text:"카드(상자)를 누르면 그 단계에서 실행되는 실제 함수 코드가 열려요."}),
      el("li", {text:"카드 안의 📄 파일 이름을 누르면 그 파일이 어떤 역할인지, 이 단원에서 쓰이는 함수가 무엇인지 보여줘요."}),
      el("li", {text:"ƒ 함수 이름을 누르면 해당 함수 코드로 바로 이동해요."}),
      el("li", {text:"노란색 줄이 지금 단계가 담당하는 부분이에요."}),
      el("li", {text:"db.함수() 처럼 적혀 있어도 실제 코드는 db/users.py 같은 다른 파일에 있어요. 카드에 그 '진짜 파일'을 표시하고, 코드 위에 찾아가는 길도 그려줘요."}),
      el("li", {text:"위쪽 ◀ ▶ 버튼으로 실행 순서대로 한 단계씩 따라갈 수 있어요."})
    ]);
    var b = $("pBody"); b.textContent = ""; b.appendChild(ul);
  }

  function renderAlias(a){
    if (!a) return null;
    return el("div", {class:"alias"}, [
      el("div", {text:"코드에는 이렇게 적혀 있지만, 실제 함수는 다른 파일에 있어요."}),
      el("div", {class:"route"}, [
        el("span", {class:"step", text:a.call}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step", text:a.via + " (창구)"}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step real", text:a.real})
      ])
    ]);
  }

  function selectNode(id, itemIdx){
    var n = nodeById(id); if (!n) return;
    state.node = id; state.item = itemIdx || 0; state.file = null;
    $("pTitle").textContent = n.title;
    $("pSub").textContent = n.plain;
    var body = $("pBody"); body.textContent = "";
    if (n.reject) body.appendChild(el("div", {class:"n-reject", text:n.reject, style:"margin:0 0 10px"}));
    if (n.items.length > 1){
      var tabs = el("div", {class:"itabs", role:"tablist"});
      n.items.forEach(function(it, i){
        tabs.appendChild(el("button", {class:"itab", role:"tab", "aria-selected":String(i === state.item), text:it.label,
          onclick:function(){ selectNode(id, i); }}));
      });
      body.appendChild(tabs);
    }
    var it = n.items[state.item];
    var block = D.blocks[it.block];
    var linesTxt = it.hl ? (it.hl[0] === it.hl[1] ? it.hl[0] + "줄" : it.hl[0] + "–" + it.hl[1] + "줄") : "";
    var fl = el("div", {class:"fileline"}, [
      el("button", {class:"chip file", onclick:function(){ selectFile(block.path); }, text:block.path}),
      el("span", {class:"lines", text: block.start + "–" + block.end + "줄 표시" + (linesTxt ? " · 노란색 " + linesTxt : "")}),
      el("span", {class:"spacer"}),
      el("button", {class:"btn", text:"복사", onclick:function(e){ copyText(block.code, e.currentTarget); }}),
      el("a", {class:"btn link", href:D.files[block.path].github + "#L" + block.start + "-L" + block.end, target:"_blank", rel:"noopener", text:"GitHub ↗"})
    ]);
    body.appendChild(fl);
    var al = renderAlias(block.alias); if (al) body.appendChild(al);
    var box = codeTable(block, it.hl);
    body.appendChild(box);
    if (it.hl) body.appendChild(el("p", {class:"legend-hl"}, [el("b", {text:"노란색"}), " = 이 카드가 담당하는 줄"]));
    refreshSelection();
    openPanel();
    if (box._hlFirst){
      var off = box._hlFirst.offsetTop - 60;
      box.scrollTop = Math.max(0, off);
    }
    updateStepper();
  }

  function selectFile(path){
    state.file = path; state.node = null;
    var f = D.files[path];
    $("pTitle").textContent = "📄 " + path;
    $("pSub").textContent = f.role;
    var body = $("pBody"); body.textContent = "";
    body.appendChild(el("div", {class:"fileline"}, [
      el("a", {class:"btn link", href:f.github, target:"_blank", rel:"noopener", text:"GitHub에서 파일 열기 ↗"})
    ]));
    body.appendChild(el("h3", {text:"이 단원에서 쓰이는 함수", style:"font-size:13.5px;margin:12px 0 0"}));
    var ul = el("ul", {class:"flist"}), seen = {};
    D.scenarios.forEach(function(sc, si){
      sc.nodes.forEach(function(n){
        n.items.forEach(function(it, ii){
          var b = D.blocks[it.block]; if (b.path !== path) return;
          var key = si + n.id + ii; if (seen[key]) return; seen[key] = 1;
          var li = el("li");
          li.appendChild(el("button", {onclick:function(){
            if (state.sc !== si) switchScenario(si);
            selectNode(n.id, ii); scrollToNode(n.id);
          }}, [
            el("span", {class:"mono", text:it.label}), el("small", {text:sc.name + " · " + n.title})
          ]));
          ul.appendChild(li);
        });
      });
    });
    body.appendChild(ul);
    if (f.header){
      var d = el("details", {class:"hdr"}, [el("summary", {text:"파일 맨 위 설명 주석 보기"}), el("pre", {text:f.header})]);
      body.appendChild(d);
    }
    refreshSelection();
    openPanel();
  }

  /* ---------- 흐름도 ---------- */
  var cols, colIndex, nodeEls = {};
  function renderStage(){
    var sc = scen();
    var used = {}; sc.nodes.forEach(function(n){ used[n.col] = 1; });
    cols = Object.keys(used).map(Number).sort(function(a,b){ return a-b; });
    colIndex = {}; cols.forEach(function(c, i){ colIndex[c] = i + 1; });
    var stage = $("stage");
    stage.textContent = "";
    stage.style.gridTemplateColumns = "repeat(" + cols.length + ", 196px)";
    nodeEls = {};

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "edges"); svg.id = "edges";
    svg.innerHTML = '<defs>' +
      '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-call" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '</defs>';
    stage.appendChild(svg);

    cols.forEach(function(c){
      stage.appendChild(el("div", {class:"colhead", style:"grid-column:" + colIndex[c] + ";grid-row:1", text:D.columns[c]}));
    });
    var cells = {};
    sc.nodes.forEach(function(n){
      var k = n.row + ":" + n.col;
      if (!cells[k]){
        cells[k] = el("div", {class:"cell", style:"grid-column:" + colIndex[n.col] + ";grid-row:" + (n.row + 2)});
        stage.appendChild(cells[k]);
      }
      var node = buildNode(n);
      nodeEls[n.id] = node;
      cells[k].appendChild(node);
    });
    $("intro").textContent = sc.intro;
    scheduleEdges();
  }

  function buildNode(n){
    var node = el("div", {class:"node " + n.kind, role:"button", tabindex:"0", "aria-pressed":"false", "data-id":n.id,
      onclick:function(e){ if (e.target.closest(".chip")) return; selectNode(n.id, 0); },
      onkeydown:function(e){ if ((e.key === "Enter" || e.key === " ") && !e.target.closest(".chip")){ e.preventDefault(); selectNode(n.id, 0); } }});
    var title = el("div", {class:"n-title", text:n.title});
    if (n.later) title.appendChild(el("span", {class:"tag-later", text:n.later + "에서 자세히"}));
    node.appendChild(title);
    if (n.kind !== "later" && n.plain) node.appendChild(el("div", {class:"n-plain", text:n.plain}));
    if (n.reject) node.appendChild(el("div", {class:"n-reject", text:n.reject}));
    var items = el("div", {class:"n-items"});
    // 같은 파일에 있는 함수는 파일 칩 하나 아래에 함수 칩을 나란히 놓는다
    var groups = [];
    n.items.forEach(function(it, i){
      var b = D.blocks[it.block], g = groups[groups.length - 1];
      if (g && g.path === b.path) g.list.push({it: it, i: i}); else groups.push({path: b.path, list: [{it: it, i: i}]});
    });
    groups.forEach(function(g){
      var row = el("div", {class:"n-item"});
      if (g.list.length === 1 && g.list[0].it.call) row.appendChild(el("div", {class:"n-call", text:brk(g.list[0].it.call)}));
      var chips = el("div", {class:"chips"}, [
        el("button", {class:"chip file", text:brk(g.path), title:"파일 설명 보기", onclick:function(){ selectFile(g.path); }})
      ]);
      g.list.forEach(function(x){
        chips.appendChild(el("button", {class:"chip " + (x.it.snippet ? "snip" : "fn"), text:x.it.label, title:(x.it.call ? x.it.call + " — " : "") + "코드 보기",
          onclick:function(){ selectNode(n.id, x.i); }}));
      });
      row.appendChild(chips);
      items.appendChild(row);
    });
    node.appendChild(items);
    return node;
  }

  function rectIn(elm, host){
    var a = elm.getBoundingClientRect(), h = host.getBoundingClientRect();
    return {l:a.left-h.left, r:a.right-h.left, t:a.top-h.top, b:a.bottom-h.top, cx:(a.left+a.right)/2-h.left, cy:(a.top+a.bottom)/2-h.top};
  }
  var raf = 0;
  function scheduleEdges(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(drawEdges); }
  function drawEdges(){
    var stage = $("stage"), svg = $("edges"), sc = scen();
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){ p.remove(); });
    Array.prototype.slice.call(stage.querySelectorAll(".elabel")).forEach(function(p){ p.remove(); });
    var svgNS = "http://www.w3.org/2000/svg";
    sc.edges.forEach(function(e){
      var a = nodeById(e.from), b = nodeById(e.to);
      var ea = nodeEls[e.from], eb = nodeEls[e.to]; if (!ea || !eb) return;
      var ra = rectIn(ea, stage), rb = rectIn(eb, stage), d, lx, ly;
      if (a.col === b.col){
        if (b.row - a.row <= 1){
          d = "M" + ra.cx + " " + ra.b + " V" + rb.t; lx = ra.cx; ly = (ra.b + rb.t) / 2;
        } else {
          var x = Math.min(ra.l, rb.l) - 30;
          d = "M" + ra.l + " " + ra.cy + " H" + x + " V" + rb.cy + " H" + rb.l; lx = x; ly = (ra.cy + rb.cy) / 2;
        }
      } else {
        var dir = b.col > a.col ? 1 : -1;
        var x1 = dir > 0 ? ra.r : ra.l, x2 = dir > 0 ? rb.l : rb.r;
        var xm = x2 - dir * 30;
        d = "M" + x1 + " " + ra.cy + " H" + xm + " V" + rb.cy + " H" + x2;
        lx = (x1 + x2) / 2; ly = ra.cy;
      }
      var kind = e.kind === "call" ? "call" : "flow";
      var p = document.createElementNS(svgNS, "path");
      p.setAttribute("d", d); p.setAttribute("class", "e " + kind);
      p.setAttribute("marker-end", "url(#" + (kind === "call" ? "ahc" : "ah") + ")");
      p.setAttribute("data-from", e.from); p.setAttribute("data-to", e.to);
      svg.appendChild(p);
      if (e.label && kind === "flow"){
        var lab = el("span", {class:"elabel", text:e.label});
        lab.style.left = lx + "px"; lab.style.top = ly + "px";
        stage.appendChild(lab);
      }
    });
    svg.setAttribute("width", stage.scrollWidth); svg.setAttribute("height", stage.scrollHeight);
    refreshSelection();
  }

  function refreshSelection(){
    Object.keys(nodeEls).forEach(function(id){ nodeEls[id].setAttribute("aria-pressed", String(id === state.node)); });
    var svg = $("edges"); if (!svg) return;
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){
      var on = state.node && (p.getAttribute("data-from") === state.node || p.getAttribute("data-to") === state.node);
      p.classList.toggle("active", !!on);
    });
  }
  function scrollToNode(id){
    var n = nodeEls[id]; if (n && n.scrollIntoView) n.scrollIntoView({block:"center", inline:"center", behavior:"smooth"});
  }

  /* ---------- 단계 이동 / 탭 ---------- */
  function stepIndex(){ return scen().steps.indexOf(state.node); }
  function updateStepper(){
    var steps = scen().steps, i = stepIndex();
    $("stepNo").textContent = i < 0 ? "– / " + steps.length : (i + 1) + " / " + steps.length;
    $("prev").disabled = i <= 0 && state.node !== null ? true : false;
    $("next").disabled = i >= steps.length - 1;
    if (state.node === null){ $("prev").disabled = true; $("next").disabled = false; }
  }
  function go(delta){
    var steps = scen().steps, i = stepIndex();
    var j = i < 0 ? 0 : Math.max(0, Math.min(steps.length - 1, i + delta));
    selectNode(steps[j], 0); scrollToNode(steps[j]);
  }
  function renderTabs(){
    var t = $("tabs"); t.textContent = "";
    D.scenarios.forEach(function(sc, i){
      t.appendChild(el("button", {class:"tab", role:"tab", "aria-selected":String(i === state.sc), text:sc.name, onclick:function(){ switchScenario(i); }}));
    });
  }
  function switchScenario(i){
    state.sc = i; state.node = null; state.file = null;
    renderTabs(); renderStage(); showHint(); updateStepper();
    try { history.replaceState(null, "", "#" + D.scenarios[i].id); } catch(e){}
  }

  /* ---------- 시작 ---------- */
  document.title = D.title + " — 코드 흐름도";
  $("title").textContent = D.title + " · 코드 흐름도";
  $("subtitle").textContent = D.subtitle;
  $("mdlink").setAttribute("href", D.mdFile);
  $("prev").addEventListener("click", function(){ go(-1); });
  $("next").addEventListener("click", function(){ go(1); });
  $("pClose").addEventListener("click", closePanel);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closePanel(); });
  $("theme").addEventListener("click", function(){
    var r = document.documentElement, cur = r.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  });
  window.addEventListener("resize", scheduleEdges);
  if (window.ResizeObserver) new ResizeObserver(scheduleEdges).observe($("stage"));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleEdges);

  var startId = (location.hash || "").replace("#", "");
  var startIdx = 0; D.scenarios.forEach(function(s, i){ if (s.id === startId) startIdx = i; });
  switchScenario(startIdx);
  // 화면 확인/테스트용 지름길: window.__flow.select("s7")
  window.__flow = { select: function(id, i){ selectNode(id, i || 0); }, file: selectFile, state: state };
})();
</script>
</body>
</html>
