<html lang="ko">
<head>
<meta charset="utf-8">

<title>23. 이메일 인증 + 이메일 변경 보호 — 코드 흐름도</title>
<style>
  :root{
    --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eaefe9; --ink:#12201c; --ink-muted:#5a6b63;
    --border:#d9e0da; --accent:#0f6f66; --accent-soft:#e2ede9; --danger:#bf3b2b; --danger-soft:#f8e6e2;
    --edge:#7b8a82; --edge-call:#8a97a0;
    --k-screen:#767f78; --k-screen-soft:#eef0ee;
    --k-route:#2f5fd6;  --k-route-soft:#e7edfb;
    --k-helper:#b56b0c; --k-helper-soft:#f7ecd9;
    --k-db:#7a4fce;     --k-db-soft:#efe8fa;
    --k-config:#0f6f66; --k-config-soft:#e2ede9;
    --k-later:#9aa39d;  --k-later-soft:#f4f6f3;
    --code-bg:#fbfcfb; --code-hl:#fff3c4; --code-hl-bar:#e0a800; --code-gutter:#8a978f;
    --c-comment:#6b7d73; --c-str:#a1470f; --c-kw:#7a3fc0; --c-fn:#1f5fd0; --c-num:#0b7a6c; --c-deco:#b0306e;
    --shadow:0 1px 2px rgba(18,32,28,.06), 0 6px 20px rgba(18,32,28,.07);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
      --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
      --edge:#6f8178; --edge-call:#5d6f67;
      --k-screen:#9aa39d; --k-screen-soft:#1a221e;
      --k-route:#7fa2f2;  --k-route-soft:#182236;
      --k-helper:#e8a94c; --k-helper-soft:#31260f;
      --k-db:#b49bee;     --k-db-soft:#241c34;
      --k-config:#4fc9b8; --k-config-soft:#17332d;
      --k-later:#6b7a72;  --k-later-soft:#111a16;
      --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
      --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
    --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
    --edge:#6f8178; --edge-call:#5d6f67;
    --k-screen:#9aa39d; --k-screen-soft:#1a221e;
    --k-route:#7fa2f2;  --k-route-soft:#182236;
    --k-helper:#e8a94c; --k-helper-soft:#31260f;
    --k-db:#b49bee;     --k-db-soft:#241c34;
    --k-config:#4fc9b8; --k-config-soft:#17332d;
    --k-later:#6b7a72;  --k-later-soft:#111a16;
    --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
    --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
  button{font:inherit;color:inherit;cursor:pointer}
  code,.mono{font-family:var(--mono)}

  .app{display:flex;height:100vh;min-height:0}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{padding:14px 20px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
  .top h1{margin:0;font-size:19px;letter-spacing:-.01em}
  .top .sub{margin:2px 0 0;color:var(--ink-muted);font-size:13px}
  .top-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
  .tabs{display:flex;gap:6px}
  .tab{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:5px 14px;font-weight:600}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .tab[aria-selected="true"]{color:#06201b}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#06201b}}
  .spacer{flex:1}
  .btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:default}
  .stepper{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-muted)}
  .stepper b{color:var(--ink);min-width:42px;text-align:center}
  a.link{color:var(--accent);text-decoration:none;font-size:13px}
  a.link:hover{text-decoration:underline}

  .intro{margin:0;padding:10px 20px;color:var(--ink-muted);font-size:13px;border-bottom:1px solid var(--border);background:var(--surface-2)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 20px;font-size:12px;color:var(--ink-muted);border-bottom:1px solid var(--border)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .stage-wrap{flex:1;min-height:0;overflow:auto}
  .stage{position:relative;display:grid;gap:26px 46px;padding:22px 22px 60px;width:max-content;min-width:100%}
  .edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .edges path{fill:none;stroke:var(--edge);stroke-width:1.6}
  .edges path.call{stroke:var(--edge-call);stroke-dasharray:5 4}
  .edges path.active{stroke:var(--accent);stroke-width:2.4;stroke-dasharray:none}
  .edges .head{fill:var(--edge)}
  .edges .head-call{fill:var(--edge-call)}
  .elabel{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;
    background:var(--surface);border:1px solid var(--border);color:var(--ink-muted);white-space:nowrap;pointer-events:none}

  .colhead{font-size:12px;font-weight:700;color:var(--ink-muted);text-transform:none;border-bottom:2px solid var(--border);padding-bottom:6px;align-self:end}
  .cell{display:flex;flex-direction:column;gap:12px;align-self:center;justify-content:center;position:relative;z-index:1}

  .node{--k:var(--k-route);--ks:var(--k-route-soft);position:relative;background:var(--surface);border:1px solid var(--border);
    border-left:5px solid var(--k);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .08s, border-color .12s}
  .node:hover{transform:translateY(-1px);border-color:var(--k)}
  .node:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .node[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
  .node.screen{--k:var(--k-screen);--ks:var(--k-screen-soft)}
  .node.route{--k:var(--k-route);--ks:var(--k-route-soft)}
  .node.helper{--k:var(--k-helper);--ks:var(--k-helper-soft)}
  .node.db{--k:var(--k-db);--ks:var(--k-db-soft)}
  .node.config{--k:var(--k-config);--ks:var(--k-config-soft)}
  .node.later{--k:var(--k-later);--ks:var(--k-later-soft);background:var(--k-later-soft);box-shadow:none;border-style:dashed;border-left-style:solid;padding:8px 10px}
  .n-title{font-weight:700;font-size:13.5px;letter-spacing:-.01em}
  .n-plain{margin-top:3px;color:var(--ink-muted);font-size:12.5px}
  .n-reject{margin-top:6px;font-size:12px;color:var(--danger);background:var(--danger-soft);border-radius:6px;padding:3px 8px}
  .n-reject::before{content:"막히면 → ";font-weight:700}
  .n-items{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .n-item{display:flex;flex-direction:column;gap:3px}
  .n-call{overflow-wrap:anywhere;font-family:var(--mono);font-size:11.5px;color:var(--k);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{max-width:100%;text-align:left;overflow-wrap:anywhere;border:1px solid var(--border);background:var(--ks);color:var(--ink);border-radius:6px;padding:1px 7px;font-family:var(--mono);font-size:11px}
  .chip:hover{border-color:var(--k);color:var(--k)}
  .chip.file::before{content:"📄 "}
  .chip.fn::before{content:"ƒ ";color:var(--k);font-weight:700}
  .chip.snip::before{content:"▤ ";color:var(--k);font-weight:700}
  .tag-later{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--ink-muted);border:1px solid var(--border);border-radius:999px;padding:0 7px;background:var(--surface)}

  /* 코드 패널 */
  .panel{width:440px;flex:none;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
  .p-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
  .p-head h2{margin:0;font-size:15.5px;letter-spacing:-.01em}
  .p-head p{margin:4px 0 0;color:var(--ink-muted);font-size:13px}
  .p-close{display:none}
  .p-body{flex:1;min-height:0;overflow:auto;padding:12px 16px 24px}
  .hint{color:var(--ink-muted);font-size:13px}
  .hint li{margin:4px 0}
  .itabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .itab{border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:2px 9px;font-family:var(--mono);font-size:12px}
  .itab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .fileline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
  .fileline .path{font-family:var(--mono);font-size:12.5px;font-weight:700}
  .fileline .lines{font-family:var(--mono);font-size:12px;color:var(--ink-muted)}
  .alias{border:1px solid var(--border);background:var(--k-db-soft);border-radius:8px;padding:8px 10px;margin:0 0 10px;font-size:12.5px}
  .alias .route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px;font-family:var(--mono);font-size:12px}
  .alias .route span.step{padding:1px 7px;border-radius:6px;border:1px solid var(--border);background:var(--surface)}
  .alias .route span.real{border-color:var(--k-db);color:var(--k-db);font-weight:700}
  .alias .arrow{color:var(--ink-muted)}
  .codebox{border:1px solid var(--border);border-radius:8px;background:var(--code-bg);overflow:auto;max-height:62vh}
  table.code{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.2px;line-height:1.6}
  table.code td{padding:0 10px;vertical-align:top;white-space:pre}
  table.code td.ln{position:sticky;left:0;text-align:right;color:var(--code-gutter);user-select:none;background:var(--code-bg);border-right:1px solid var(--border);min-width:44px;padding-right:8px}
  table.code tr.hl td{background:var(--code-hl)}
  table.code tr.hl td.ln{background:var(--code-hl);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--code-hl-bar)}
  .t-c{color:var(--c-comment);font-style:italic}.t-d{color:var(--c-comment)}.t-s{color:var(--c-str)}.t-k{color:var(--c-kw);font-weight:600}
  .t-f{color:var(--c-fn)}.t-n{color:var(--c-num)}.t-a{color:var(--c-deco)}
  .legend-hl{margin:8px 0 0;font-size:12px;color:var(--ink-muted)}
  .legend-hl b{background:var(--code-hl);color:var(--ink);padding:0 6px;border-radius:4px}
  .flist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
  .flist button{width:100%;text-align:left;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:6px 10px}
  .flist button:hover{border-color:var(--accent)}
  .flist small{display:block;color:var(--ink-muted)}
  details.hdr{margin-top:12px;font-size:13px}
  details.hdr pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px;font-family:var(--sans);font-size:12.5px;color:var(--ink-muted)}

  @media (max-width:900px){
    .app{display:block;height:auto}
    .stage-wrap{max-height:none;overflow-x:auto}
    .panel{position:fixed;left:0;right:0;bottom:0;width:auto;height:62vh;border-left:0;border-top:2px solid var(--accent);
      box-shadow:0 -10px 30px rgba(0,0,0,.25);z-index:20;transform:translateY(105%);transition:transform .18s}
    body.open .panel{transform:none}
    .p-close{display:inline-block;position:absolute;right:12px;top:10px}
    .p-head{position:relative;padding-right:70px}
    .top{padding:12px 16px 8px}
    .stage{padding:16px 16px 70vh}
  }
  @media (prefers-reduced-motion: reduce){.node,.panel{transition:none}}
</style>
</head>

주소로 변경 알림", "plain": "새 주소는 가려서(a***e@…) 알려줍니다.", "reject": "", "later": "", "items": [{"block": "notify/mailer.py:send_email_changed_notice", "hl": null, "label": "send_email_changed_notice()", "call": null, "snippet": false}]}], "edges": [{"from": "change_n1", "to": "change_n2", "label": "", "kind": "flow"}, {"from": "change_n2", "to": "change_n3", "label": "", "kind": "call"}, {"from": "change_n2", "to": "change_n4", "label": "", "kind": "flow"}, {"from": "change_n4", "to": "change_n5", "label": "", "kind": "call"}, {"from": "change_n4", "to": "change_n6", "label": "", "kind": "flow"}, {"from": "change_n6", "to": "change_n7", "label": "", "kind": "call"}, {"from": "change_n6", "to": "change_n8", "label": "", "kind": "call"}], "steps": ["change_n1", "change_n2", "change_n4", "change_n6"]}], "blocks": {"routes/auth.py:signup_submit": {"path": "routes/auth.py", "start": 64, "end": 153, "lang": "python", "code": "@auth_bp.route(\"/signup\", methods=[\"POST\"])\ndef signup_submit():\n    \"\"\"회원가입 폼에서 \"가입하기\" 버튼을 눌렀을 때 실제로 처리하는 부분.\n\n    GET(화면 보여주기)과 POST(데이터 제출 처리)를 같은 주소(/signup)에 대해\n    따로 등록해두는 것이 Flask에서 아주 흔한 패턴이다 — \"이 주소를 그냥 방문하면\n    빈 폼을 보여주고, 이 주소로 폼 데이터를 제출하면 그때는 처리 로직을 실행해라\"\n    는 뜻이다.\n    \"\"\"\n    # 화면에서 폼 자체를 숨겨뒀더라도, 누군가 개발자 도구 등으로 이 주소에 직접\n    # 요청을 보낼 수 있으므로 서버 쪽에서도 다시 한번 막아준다(이중 안전장치).\n    if not db.get_signup_enabled():\n        flash(\"현재 회원가입이 잠시 중단되어 있습니다.\")\n        return render_template(\"signup.html\", signup_enabled=False)\n\n    ip = get_request_ip()\n\n    # 허니팟 필드가 채워져 있으면 사람이 아니라 자동화 스크립트라고 보고,\n    # 시도 기록조차 남기지 않고 즉시 거부한다 (L7 공격 보강 계획 Tier 3).\n    if is_bot_submission():\n        soar.notify_bot_detected(ip, request.path)\n        flash(\"일시적인 오류가 발생했습니다. 다시 시도해주세요.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    # 영구 잠금된 IP는 가입도 막는다 — 공격자가 새 계정을 만들어 자기 IP의 예외를\n    # 받아내는 경로를 차단한다(guide33). 일반 임시 잠금(5분)은 가입을 막지 않는다.\n    if detector.get_ip_lock_state(ip) == detector.LOCK_STATE_PERMANENT:\n        flash(\"현재 이 네트워크에서는 회원가입을 할 수 없습니다. 관리자에게 문의해주세요.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    # 같은 IP가 짧은 시간에 너무 많이 가입을 시도하면 거부한다 — 이전에는 이 주소에\n    # 요청 빈도 제한이 전혀 없어서, 스크립트로 계정을 무제한 찍어낼 수 있었다\n    # (18단계 보안 점검에서 발견 및 보완). 성공/실패와 무관하게 시도 자체를 세므로,\n    # 검증에서 계속 걸러지는 값을 반복 제출하는 남용도 함께 막는다.\n    rate_limited, signup_count = detector.is_signup_rate_limited(ip)\n    if rate_limited:\n        soar.record_rejection(\"SIGNUP_RATE_LIMIT\", ip, request.path, config.SIGNUP_RATE_LIMIT)\n        flash(\"너무 많은 가입 시도가 감지되었습니다. 잠시 후 다시 시도해주세요.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n    # 아직 기준치(SIGNUP_RATE_LIMIT)는 안 넘었지만 코앞이면, LLM에게 조기 경보\n    # 여부를 물어본다 (Track A, guide31 — config.EARLY_WARNING_BAND 설명 참고).\n    if signup_count >= config.SIGNUP_RATE_LIMIT - config.EARLY_WARNING_BAND:\n        soar.consider_early_warning(\n            \"SIGNUP_RATE_LIMIT\", \"ALERT_ONLY\", \"ip\", ip, signup_count, config.SIGNUP_RATE_LIMIT,\n            path=request.path,\n        )\n    db.log_signup_attempt(ip)\n\n    username = request.form.get(\"username\", \"\").strip()\n    email = request.form.get(\"email\", \"\").strip()\n    password = request.form.get(\"password\", \"\")\n    password_confirm = request.form.get(\"password_confirm\", \"\")\n\n    if not username or not email or not password:\n        flash(\"아이디, 이메일, 비밀번호를 모두 입력해주세요.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    if not config.USERNAME_PATTERN.match(username):\n        flash(\"아이디는 영문자, 숫자, 밑줄(_)만 사용해 3~20자로 입력해주세요.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    if not config.EMAIL_PATTERN.match(email):\n        flash(\"올바른 이메일 형식이 아닙니다.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    if len(password) < config.MIN_PASSWORD_LENGTH:\n        flash(f\"비밀번호는 최소 {config.MIN_PASSWORD_LENGTH}자 이상이어야 합니다.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    if password != password_confirm:\n        flash(\"비밀번호와 비밀번호 확인이 일치하지 않습니다.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    created = db.create_user(username, email, password)\n    if not created:\n        flash(\"이미 사용 중인 아이디 또는 이메일입니다.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    # 가입 이메일로 인증 링크를 보낸다(guide40). 메일이 실패해도 가입은 그대로 유지한다 —\n    # 로그인한 뒤 대시보드에서 다시 보낼 수 있다.\n    try:\n        verification = email_verification.send_verification(created, ip)\n    except Exception as e:  # noqa: BLE001\n        mailer.report_failure(mailer.FAIL_INTERNAL, f\"가입 인증 메일 처리 중 오류: {type(e).__name__}\")\n        verification = email_verification.UNAVAILABLE\n    if verification == email_verification.SENT:\n        flash(\"회원가입이 완료되었습니다. 가입 이메일로 인증 메일을 보냈습니다. 로그인해주세요.\")\n    else:\n        flash(\"회원가입이 완료되었습니다. 로그인해주세요. 이메일 인증은 로그인 후 대시보드에서 할 수 있습니다.\")\n    return redirect(url_for(\"auth.login\"))", "alias": null}, "routes/member.py:member_email_verify_resend": {"path": "routes/member.py", "start": 164, "end": 181, "lang": "python", "code": "@member_bp.route(\"/dashboard/email/verify/resend\", methods=[\"POST\"])\n@member_login_required\ndef member_email_verify_resend():\n    \"\"\"대시보드·프로필의 \"인증 메일 다시 보내기\"(guide40). 쿨다운·하루 한도는 email_verification이 본다.\"\"\"\n    user = db.get_user_by_id(session[\"user_id\"])\n    if user is None:\n        return _logout_missing_member()\n    result = email_verification.send_verification(user, get_request_ip())\n    if result == email_verification.SENT:\n        flash(f\"{email_verification.mask_email(user['email'])}(으)로 인증 메일을 보냈습니다. 메일의 링크를 눌러주세요.\")\n    elif result == email_verification.ALREADY_VERIFIED:\n        flash(\"이미 인증된 이메일입니다.\")\n    else:\n        flash(_EMAIL_REQUEST_MESSAGES[result])\n    # 대시보드 배너에서 눌렀으면 대시보드로, 프로필에서 눌렀으면 프로필로 돌아간다.\n    if request.form.get(\"next\") == \"dashboard\":\n        return redirect(url_for(\"member.member_dashboard\"))\n    return redirect(url_for(\"member.member_profile\"))", "alias": null}, "services/email_verification.py:send_verification": {"path": "services/email_verification.py", "start": 99, "end": 110, "lang": "python", "code": "def send_verification(user: dict, ip: str) -> str:\n    \"\"\"이 회원의 현재 이메일로 인증 링크를 보낸다(가입 직후, 대시보드 \"다시 보내기\").\"\"\"\n    if user.get(\"email_status\") == \"VERIFIED\":\n        return ALREADY_VERIFIED\n    purpose = db.email_tokens.PURPOSE_EMAIL_VERIFY\n    if _rate_limited(user[\"id\"], purpose):\n        return RATE_LIMITED\n    issued = _issue(user[\"id\"], purpose, user[\"email\"], ip)\n    if issued is None:\n        return UNAVAILABLE\n    row, link = issued\n    return _after_send(user[\"id\"], row, mailer.send_email_verification(user[\"email\"], link))", "alias": null}, "services/email_verification.py:_rate_limited": {"path": "services/email_verification.py", "start": 58, "end": 69, "lang": "python", "code": "def _rate_limited(user_id: int, purpose: str, max_per_day: int | None = None) -> bool:\n    \"\"\"같은 회원·용도로 최근 쿨다운 안에 보냈거나, 하루 한도를 채웠으면 True.\"\"\"\n    count, latest = db.get_email_token_activity(user_id, purpose, 24)\n    if count >= (max_per_day if max_per_day is not None else config.EMAIL_TOKEN_MAX_PER_DAY):\n        return True\n    if latest:\n        latest_dt = datetime.fromisoformat(latest)\n        if latest_dt.tzinfo is None:\n            latest_dt = latest_dt.replace(tzinfo=timezone.utc)\n        if datetime.now(timezone.utc) - latest_dt < timedelta(seconds=config.EMAIL_TOKEN_COOLDOWN_SECONDS):\n            return True\n    return False", "alias": null}, "db/email_tokens.py:get_email_token_activity": {"path": "db/email_tokens.py", "start": 110, "end": 126, "lang": "python", "code": "def get_email_token_activity(user_id: int, purpose: str, hours: int = 24) -> tuple[int, str | None]:\n    \"\"\"이 회원·용도의 최근 `hours`시간 토큰 (건수, 가장 최근 생성 시각)을 한 번의 조회로 가져온다.\n    상태와 무관하게 센다 — 취소된 요청도 메일 발송 시도였으므로 하루 한도와 쿨다운에 들어간다.\"\"\"\n    cutoff = (datetime.now(timezone.utc) - timedelta(hours=hours)).isoformat()\n    res = (\n        db.get_client()\n        .table(\"email_tokens\")\n        .select(\"created_at\")\n        .eq(\"user_id\", user_id)\n        .eq(\"purpose\", purpose)\n        .gte(\"created_at\", cutoff)\n        .order(\"created_at\", desc=True)\n        .limit(50)\n        .execute()\n    )\n    rows = res.data\n    return len(rows), (rows[0][\"created_at\"] if rows else None)", "alias": {"call": "db.get_email_token_activity()", "via": "db/__init__.py", "real": "db/email_tokens.py"}}, "services/email_verification.py:_issue": {"path": "services/email_verification.py", "start": 72, "end": 84, "lang": "python", "code": "def _issue(user_id: int, purpose: str, email: str, ip: str, path: str = \"/email/confirm\") -> tuple[dict, str] | None:\n    \"\"\"토큰을 만들어 저장하고 (행, 메일에 넣을 링크)를 돌려준다. 링크를 만들 수 없거나(운영에서\n    PUBLIC_BASE_URL 없음) 동시 요청에 밀렸으면 None.\"\"\"\n    base_url = public_base_url()\n    if not base_url:\n        mailer.report_failure(mailer.FAIL_CONFIG, \"PUBLIC_BASE_URL이 설정되지 않아 이메일 인증 메일을 보내지 않았습니다.\")\n        return None\n    token = secrets.token_urlsafe(32)\n    expires_at = datetime.now(timezone.utc) + timedelta(minutes=config.EMAIL_TOKEN_TTL_MINUTES)\n    row = db.create_email_token(user_id, purpose, email, hash_secret(token), ip, expires_at.isoformat())\n    if row is None:\n        return None\n    return row, f\"{base_url}{path}?t={token}\"", "alias": null}, "db/email_tokens.py:create_email_token": {"path": "db/email_tokens.py", "start": 25, "end": 53, "lang": "python", "code": "def create_email_token(\n    user_id: int, purpose: str, email: str, token_hash: str, requested_ip: str, expires_at_iso: str\n) -> dict | None:\n    \"\"\"토큰 한 건을 새로 만든다. 같은 (회원, 용도)의 기존 PENDING은 먼저 REVOKED로 바꾼다.\n    두 요청이 거의 동시에 들어와 부분 유니크 인덱스가 두 번째 삽입을 막으면(23505) None.\"\"\"\n    db.get_client().table(\"email_tokens\").update({\"status\": \"REVOKED\"}).eq(\"user_id\", user_id).eq(\n        \"purpose\", purpose\n    ).eq(\"status\", \"PENDING\").execute()\n    try:\n        res = (\n            db.get_client()\n            .table(\"email_tokens\")\n            .insert(\n                {\n                    \"user_id\": user_id,\n                    \"purpose\": purpose,\n                    \"email\": email,\n                    \"token_hash\": token_hash,\n                    \"requested_ip\": requested_ip,\n                    \"expires_at\": expires_at_iso,\n                }\n            )\n            .execute()\n        )\n    except APIError as e:\n        if e.code != \"23505\":\n            raise\n        return None\n    return res.data[0] if res.data else None", "alias": {"call": "db.create_email_token()", "via": "db/__init__.py", "real": "db/email_tokens.py"}}, "services/email_verification.py:_after_send": {"path": "services/email_verification.py", "start": 87, "end": 96, "lang": "python", "code": "def _after_send(user_id: int, row: dict, result: str) -> str:\n    \"\"\"메일 발송 결과를 반영한다 — 못 보냈으면 토큰을 취소하고, 수신자 영구 거부면 반송 표시.\"\"\"\n    if result == mailer.SENT:\n        return SENT\n    db.revoke_email_token(row[\"id\"])\n    # 회원 자신의 주소로 보낸 메일(인증·재설정)이 영구 거부되면 그 주소는 더 이상 믿을 수 없다.\n    # 이메일 변경 확인은 \"새 주소\"로 보낸 것이라 지금 주소의 상태와는 무관하다.\n    if result == mailer.REFUSED and row[\"purpose\"] != db.email_tokens.PURPOSE_EMAIL_CHANGE:\n        db.set_user_email_status(user_id, \"UNDELIVERABLE\")\n    return UNAVAILABLE", "alias": null}, "notify/mailer.py:send_email_verification": {"path": "notify/mailer.py", "start": 216, "end": 225, "lang": "python", "code": "def send_email_verification(to_address: str, link: str) -> str:\n    \"\"\"가입 직후 또는 대시보드 \"인증 메일 다시 보내기\"로 보내는 이메일 인증 메일.\"\"\"\n    body = (\n        \"로그인 워치독 가입 이메일을 확인하기 위한 메일입니다.\\n\\n\"\n        f\"아래 링크를 열어 확인 화면에서 [인증] 버튼을 눌러주세요 \"\n        f\"(유효시간 {config.EMAIL_TOKEN_TTL_MINUTES}분, 1회용):\\n{link}\\n\\n\"\n        \"인증된 이메일로만 비밀번호 재설정 메일을 보내드립니다.\\n\"\n        \"본인이 가입하지 않았다면 이 메일을 무시하세요. 링크를 누르지 않으면 아무 일도 일어나지 않습니다.\"\n    )\n    return _send_mail(to_address, \"[로그인 워치독] 이메일 인증 안내\", body)", "alias": null}, "db/email_tokens.py:revoke_email_token": {"path": "db/email_tokens.py", "start": 103, "end": 107, "lang": "python", "code": "def revoke_email_token(token_id: int) -> None:\n    \"\"\"메일을 보내지 못했거나 보내지 않기로 한 토큰을 취소한다(PENDING일 때만).\"\"\"\n    db.get_client().table(\"email_tokens\").update({\"status\": \"REVOKED\"}).eq(\"id\", token_id).eq(\n        \"status\", \"PENDING\"\n    ).execute()", "alias": {"call": "db.revoke_email_token()", "via": "db/__init__.py", "real": "db/email_tokens.py"}}, "routes/email.py:email_confirm_form": {"path": "routes/email.py", "start": 44, "end": 63, "lang": "python", "code": "@email_bp.route(\"/email/confirm\", methods=[\"GET\"])\ndef email_confirm_form():\n    \"\"\"메일 링크(?t=토큰)가 여는 확인 화면. 토큰은 소비하지 않는다.\"\"\"\n    token = request.args.get(\"t\", \"\")\n    row = email_verification.get_pending_email_token(token)\n    if row is None:\n        return _invalid()\n    user = db.get_user_by_id(row[\"user_id\"])\n    if user is None:\n        return _invalid()\n    return render_template(\n        \"email_confirm.html\",\n        mode=\"confirm\",\n        title=email_verification.PURPOSE_LABELS.get(row[\"purpose\"], \"이메일 확인\"),\n        message=None,\n        token=token,\n        purpose=row[\"purpose\"],\n        masked_username=mask_username(user[\"username\"]),\n        masked_email=email_verification.mask_email(row[\"email\"]),\n    )", "alias": null}, "routes/email.py:email_confirm_submit": {"path": "routes/email.py", "start": 66, "end": 73, "lang": "python", "code": "@email_bp.route(\"/email/confirm\", methods=[\"POST\"])\ndef email_confirm_submit():\n    \"\"\"확인 버튼 — 토큰을 1회 소비하고 이메일 인증 또는 이메일 변경을 반영한다.\"\"\"\n    result, _user = email_verification.confirm(request.form.get(\"t\", \"\"))\n    if result == email_verification.CONFIRM_INVALID:\n        return _invalid()\n    title, message = _RESULT_MESSAGES[result]\n    return render_template(\"email_confirm.html\", mode=\"done\", title=title, message=message)", "alias": null}, "services/email_verification.py:confirm": {"path": "services/email_verification.py", "start": 149, "end": 175, "lang": "python", "code": "def confirm(token: str) -> tuple[str, dict | None]:\n    \"\"\"확인 버튼(POST)으로 토큰을 소비하고 용도에 맞게 반영한다. (결과, 회원 행)을 돌려준다.\"\"\"\n    row = get_pending_email_token(token)\n    if row is None:\n        return CONFIRM_INVALID, None\n    consumed = db.consume_email_token(row[\"id\"])\n    if consumed is None:\n        return CONFIRM_INVALID, None\n    user = db.get_user_by_id(consumed[\"user_id\"])\n    if user is None:\n        return CONFIRM_INVALID, None\n\n    if consumed[\"purpose\"] == db.email_tokens.PURPOSE_EMAIL_VERIFY:\n        # 메일을 보낸 뒤 이메일을 바꿨다면 옛 주소로 간 링크는 새 주소를 인증하지 못한다.\n        if not db.mark_user_email_verified(user[\"id\"], consumed[\"email\"]):\n            return CONFIRM_STALE, user\n        return CONFIRMED_VERIFIED, user\n\n    if consumed[\"purpose\"] == db.email_tokens.PURPOSE_EMAIL_CHANGE:\n        old_email = user[\"email\"]\n        if not db.change_user_email(user[\"id\"], consumed[\"email\"]):\n            return CONFIRM_TAKEN, user\n        # 바뀐 사실을 옛 주소로 알린다 — 세션을 탈취한 사람이 바꿨다면 원래 주인이 알아챈다.\n        mailer.send_email_changed_notice(old_email, mask_email(consumed[\"email\"]))\n        return CONFIRMED_CHANGED, {**user, \"email\": consumed[\"email\"], \"email_status\": \"VERIFIED\"}\n\n    return CONFIRM_INVALID, None", "alias": null}, "db/email_tokens.py:consume_email_token": {"path": "db/email_tokens.py", "start": 88, "end": 100, "lang": "python", "code": "def consume_email_token(token_id: int) -> dict | None:\n    \"\"\"토큰을 USED로 바꿔 소비한다 — 원자적 1회용. 동시에 두 번 들어와도 먼저 온 쪽만\n    PENDING→USED로 바꾸고, 늦게 온 쪽(또는 만료된 토큰)은 0행이라 None을 받는다.\"\"\"\n    res = (\n        db.get_client()\n        .table(\"email_tokens\")\n        .update({\"status\": \"USED\", \"used_at\": db._now_iso()})\n        .eq(\"id\", token_id)\n        .eq(\"status\", \"PENDING\")\n        .gt(\"expires_at\", db._now_iso())\n        .execute()\n    )\n    return res.data[0] if res.data else None", "alias": {"call": "db.consume_email_token()", "via": "db/__init__.py", "real": "db/email_tokens.py"}}, "db/users.py:mark_user_email_verified": {"path": "db/users.py", "start": 132, "end": 146, "lang": "python", "code": "def mark_user_email_verified(user_id: int, email: str) -> bool:\n    \"\"\"이 회원의 이메일이 아직 `email`일 때만 VERIFIED로 표시한다(guide40). 실제로 바뀌었으면 True.\n\n    조건에 email을 넣는 이유: 인증 메일을 보낸 뒤 회원이 이메일을 바꿨다면, 옛 주소로 간\n    인증 링크가 새 주소를 \"인증됨\"으로 만들면 안 되기 때문이다.\n    \"\"\"\n    res = (\n        db.get_client()\n        .table(\"users\")\n        .update({\"email_status\": \"VERIFIED\", \"email_status_checked_at\": db._now_iso()})\n        .eq(\"id\", user_id)\n        .eq(\"email\", email)\n        .execute()\n    )\n    return bool(res.data)", "alias": {"call": "db.mark_user_email_verified()", "via": "db/__init__.py", "real": "db/users.py"}}, "routes/member.py:member_email_change_submit": {"path": "routes/member.py", "start": 117, "end": 161, "lang": "python", "code": "@member_bp.route(\"/dashboard/email/change\", methods=[\"POST\"])\n@member_login_required\ndef member_email_change_submit():\n    \"\"\"이메일 변경 요청(guide40). 현재 비밀번호를 확인한 뒤 새 주소로 확인 링크를 보낸다 —\n    링크를 눌러야(routes/email.py) 실제로 바뀌고, 바뀌면 기존 주소로 알림이 간다.\n\n    현재 비밀번호를 틀리면 비밀번호 변경(guide35)과 똑같이 로그인 실패로 기록하고 같은 기준으로\n    잠근다. 그 주소를 다른 계정이 쓰고 있어도 화면 응답은 똑같다(email_verification 참고).\n    \"\"\"\n    ip = get_request_ip()\n    username = session[\"username\"]\n\n    if is_bot_submission():\n        soar.notify_bot_detected(ip, request.path)\n        flash(\"일시적인 오류가 발생했습니다. 다시 시도해주세요.\")\n        return redirect(url_for(\"member.member_profile\"))\n\n    user = db.get_user_by_id(session[\"user_id\"])\n    if user is None:\n        return _logout_missing_member()\n\n    new_email = request.form.get(\"new_email\", \"\").strip()\n    current_password = request.form.get(\"current_password\", \"\")\n    if not new_email or not current_password:\n        flash(\"새 이메일과 현재 비밀번호를 모두 입력해주세요.\")\n        return redirect(url_for(\"member.member_profile\"))\n    if not config.EMAIL_PATTERN.match(new_email):\n        flash(\"올바른 이메일 형식이 아닙니다.\")\n        return redirect(url_for(\"member.member_profile\"))\n    if new_email.lower() == user[\"email\"].lower():\n        flash(\"지금 쓰고 있는 이메일과 같습니다.\")\n        return redirect(url_for(\"member.member_profile\"))\n\n    if not db.verify_user_credentials(username, current_password):\n        db.log_attempt(ip, username, False)\n        if _lock_if_suspicious(ip, username):\n            clear_member_session()\n            flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n            return redirect(url_for(\"auth.login\"))\n        flash(\"현재 비밀번호가 올바르지 않습니다.\")\n        return redirect(url_for(\"member.member_profile\"))\n\n    result = email_verification.request_email_change(user, new_email, ip)\n    flash(_EMAIL_REQUEST_MESSAGES.get(result, _EMAIL_CHANGE_SENT_MESSAGE))\n    return redirect(url_for(\"member.member_profile\"))", "alias": null}, "services/email_verification.py:request_email_change": {"path": "services/email_verification.py", "start": 113, "end": 132, "lang": "python", "code": "def request_email_change(user: dict, new_email: str, ip: str) -> str:\n    \"\"\"새 주소로 변경 확인 링크를 보낸다. 이메일은 링크를 눌러야 바뀐다.\n\n    그 주소를 다른 계정이 이미 쓰고 있으면 링크 대신 \"이미 등록된 주소\" 안내 메일을 보낸다.\n    어느 쪽이든 토큰 행은 똑같이 만들고(하루 한도·쿨다운에 들어가게, 처리 시간도 비슷하게),\n    호출부(화면)에는 똑같이 SENT를 돌려준다 — 화면으로는 남의 이메일 가입 여부를 알 수 없다.\n    \"\"\"\n    purpose = db.email_tokens.PURPOSE_EMAIL_CHANGE\n    if _rate_limited(user[\"id\"], purpose):\n        return RATE_LIMITED\n    issued = _issue(user[\"id\"], purpose, new_email, ip)\n    if issued is None:\n        return UNAVAILABLE\n    row, link = issued\n\n    if db.is_email_taken(new_email, exclude_user_id=user[\"id\"]):\n        db.revoke_email_token(row[\"id\"])\n        mailer.send_email_in_use_notice(new_email)\n        return SENT\n    return _after_send(user[\"id\"], row, mailer.send_email_change_confirmation(new_email, link))", "alias": null}, "notify/mailer.py:send_email_change_confirmation": {"path": "notify/mailer.py", "start": 228, "end": 236, "lang": "python", "code": "def send_email_change_confirmation(to_address: str, link: str) -> str:\n    \"\"\"프로필에서 이메일 변경을 요청했을 때 \"새 주소\"로 보내는 확인 메일 — 링크를 눌러야 바뀐다.\"\"\"\n    body = (\n        \"로그인 워치독 계정의 이메일을 이 주소로 바꾸는 요청이 접수되었습니다.\\n\\n\"\n        f\"아래 링크를 열어 확인 화면에서 [이메일 변경] 버튼을 눌러야 변경됩니다 \"\n        f\"(유효시간 {config.EMAIL_TOKEN_TTL_MINUTES}분, 1회용):\\n{link}\\n\\n\"\n        \"본인이 요청하지 않았다면 이 메일을 무시하세요. 링크를 누르지 않으면 아무 일도 일어나지 않습니다.\"\n    )\n    return _send_mail(to_address, \"[로그인 워치독] 이메일 변경 확인\", body)", "alias": null}, "notify/mailer.py:send_email_in_use_notice": {"path": "notify/mailer.py", "start": 239, "end": 250, "lang": "python", "code": "def send_email_in_use_notice(to_address: str) -> str:\n    \"\"\"이미 다른 계정이 쓰고 있는 주소로 이메일 변경을 요청했을 때 그 주소로 보내는 안내.\n\n    화면 응답은 \"확인 메일을 보냈습니다\"로 항상 같게 두고(그 주소의 가입 여부를 화면으로 알\n    수 없게), 실제 안내는 메일함 주인에게만 간다 — 이 메일을 받는 사람이 곧 그 주소의 주인이다.\n    \"\"\"\n    body = (\n        \"로그인 워치독에서 이 주소로 이메일을 변경하려는 요청이 있었지만, \"\n        \"이 주소는 이미 다른 계정에 등록되어 있어 변경할 수 없습니다.\\n\\n\"\n        \"본인이 요청하지 않았다면 이 메일을 무시하세요. 아무것도 바뀌지 않았습니다.\"\n    )\n    return _send_mail(to_address, \"[로그인 워치독] 이메일 변경 요청 안내\", body)", "alias": null}, "db/users.py:change_user_email": {"path": "db/users.py", "start": 112, "end": 129, "lang": "python", "code": "def change_user_email(user_id: int, new_email: str) -> bool:\n    \"\"\"새 주소로 보낸 확인 링크를 누른 뒤에만 불린다(guide40) — 이메일을 바꾸고, 링크를 눌렀다는\n    것 자체가 메일함 주인이라는 증거이므로 VERIFIED로 표시한다.\n\n    링크를 누르기 전에 다른 사람이 그 주소로 가입했을 수 있으므로 여기서 다시 확인하고, 그래도\n    두 요청이 겹쳐 unique 제약에 걸리면(23505) False를 돌려준다.\n    \"\"\"\n    if is_email_taken(new_email, exclude_user_id=user_id):\n        return False\n    try:\n        db.get_client().table(\"users\").update(\n            {\"email\": new_email, \"email_status\": \"VERIFIED\", \"email_status_checked_at\": db._now_iso()}\n        ).eq(\"id\", user_id).execute()\n    except APIError as e:\n        if e.code != \"23505\":\n            raise\n        return False\n    return True", "alias": {"call": "db.change_user_email()", "via": "db/__init__.py", "real": "db/users.py"}}, "notify/mailer.py:send_email_changed_notice": {"path": "notify/mailer.py", "start": 253, "end": 262, "lang": "python", "code": "def send_email_changed_notice(old_address: str, masked_new_address: str) -> str:\n    \"\"\"이메일 변경이 완료됐다는 사실을 \"기존 주소\"로 알린다 — 세션을 탈취한 사람이 이메일을\n    바꿨다면 원래 주인이 바로 알아챌 수 있게 하는 장치다. 새 주소는 가려서 보낸다.\"\"\"\n    body = (\n        f\"로그인 워치독 계정의 이메일이 {masked_new_address}(으)로 변경되었습니다.\\n\"\n        \"앞으로 비밀번호 재설정 등 안내 메일은 새 주소로 갑니다.\\n\\n\"\n        \"본인이 변경한 것이 아니라면 즉시 로그인해 비밀번호를 바꾸고 관리자에게 알려주세요\"\n        f\"{_profile_link_line()}\"\n    )\n    return _send_mail(old_address, \"[로그인 워치독] 이메일이 변경되었습니다\", body)", "alias": null}}, "files": {"routes/auth.py": {"role": "회원가입 입구 파일. 가입 직후 인증 메일을 보낸다.", "header": "routes/auth.py — 회원가입(/signup) + 감시 대상 로그인(/login)\n원래 app.py의 \"회원가입 입력 검증 규칙\" / \"회원가입\" / \"감시 대상 로그인\"\n세 섹션을 그대로 옮겨왔다. 배경은 docs/refactor/2026-09-15-file-split.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/auth.py"}, "routes/member.py": {"role": "회원 화면 입구 파일. 이메일 변경 요청이 여기 있다.", "header": "routes/member.py — 회원 대시보드 (/dashboard) — 전부 member_login_required로 보호됨\n이름이 \"/admin/dashboard\"와 비슷해 보이지만 완전히 다른 화면이다. 회원은\n본인 계정에 관한 정보만 볼 수 있고, 다른 회원 정보나 관리자 기능(잠긴 IP,\n전체 회원 목록 등)에는 접근할 수 없다 — member_login_required와\nlogin_required가 서로 다른 세션 키를 확인하기 때문에 이 구분이 코드 수준에서\n강제된다.\n원래 app.py의 \"회원 대시보드\" 섹션을 그대로 옮겨왔다. 배경은\ndocs/refactor/2026-09-15-file-split.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/member.py"}, "services/email_verification.py": {"role": "'이메일 담당'. 인증·변경 확인 링크를 만들고 처리한다. 결과를 예외 대신 값으로 돌려준다.", "header": "services/email_verification.py — \"이메일 담당\": 이메일 인증 / 이메일 변경 확인 링크를 만들고 처리한다 (guide40)\n왜 필요한가: 비밀번호 재설정(guide41)은 \"계정을 되찾는 메일\"이라 확인된 주소로만 보내야 한다.\n그런데 지금까지 가입 이메일은 형식만 검사했고(오타·남의 주소 그대로 저장), 이메일 변경은 세션만\n있으면 비밀번호 확인도 없이 바로 됐다(세션 탈취 → 이메일 바꿔치기 → 계정 탈취). 이 모듈이\n1) 가입 직후·대시보드에서 인증 링크를 보내고(EMAIL_VERIFY → users.email_status = VERIFIED)\n2) 이메일 변경을 \"새 주소로 보낸 링크를 눌러야 반영\"되게 하고(EMAIL_CHANGE), 바뀌면 옛 주소로 알린다.\n원칙은 영구 잠금 복구(routes/recovery.py)와 같다 — 토큰은 해시만 저장, 링크는 PUBLIC_BASE_URL로만,\nGET은 확인 화면만(메일 스캐너가 미리 열어도 안 닳게) 실제 처리는 POST에서 조건부 1회 소비.\n메일 링크를 눌렀다는 것 자체가 그 메일함의 주인이라는 증거라서, 처리하면 VERIFIED가 된다.\n비밀번호 재설정(guide41)도 같은 표(email_tokens, PASSWORD_RESET)와 같은 원칙으로 이 파일이 처리한다 —\n단, 재설정 메일은 \"계정을 되찾는 메일\"이라 VERIFIED 주소에만 보낸다.\n라우트(routes/member.py, routes/email.py, routes/auth.py, routes/password.py, routes/recovery.py)는 \"언제\" 부를지만 정하고, 실제\n판단·발송은 전부 이 파일이 한다 — notify/alert.py·notify/mailer.py처럼 결과를 예외 대신 값으로 돌려준다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/services/email_verification.py"}, "db/email_tokens.py": {"role": "email_tokens 표 저장소. 토큰은 해시만 저장하고 조건부 UPDATE 로 1회 소비한다.", "header": "db/email_tokens.py — email_tokens 표 (guide40, 이메일 인증 / 이메일 변경 확인 / 비밀번호 재설정)\n메일로 보내는 1회용 링크 한 건 한 건이다. 영구 잠금 복구(recovery_requests)와 같은 원칙을\n따르지만 표는 나눴다 — 복구의 하루 한도·대시보드 카드·기기 쿠키·6자리 코드 흐름과 섞이지\n않게 하기 위해서다.\n- 토큰은 원문이 아니라 SHA-256 해시만 저장한다(DB가 유출돼도 링크는 못 만든다).\n- 같은 (회원, 용도)에 PENDING은 1건만(idx_email_tokens_one_pending) — 새로 만들면 이전 것은 REVOKED.\n- 소비는 조건부 UPDATE(WHERE status='PENDING' AND 만료 전)로 딱 한 번만 일어난다.\ndb.get_client()를 통해 호출하는 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/email_tokens.py"}, "notify/mailer.py": {"role": "메일 발송 파일. 인증·변경 확인·알림 메일을 만든다.", "header": "notify/mailer.py — \"우체부\" 역할: 사용자에게 가는 메일을 실제로 보낸다\n(영구 잠금 복구 guide34-a, 비밀번호 변경 알림 guide35, 이메일 인증·변경 guide40,\n비밀번호 재설정 guide41)\nnotify/alert.py(Slack)와 같은 구조다 — 메시지를 조립하는 함수(send_recovery_email 등)와\n실제로 내보내는 함수 하나(_send_mail)로 나뉜다. \"언제 보낼지\"는 이 파일이 아니라\nroutes/recovery.py, routes/member.py, services/email_verification.py가 결정한다.\n전송 결과는 예외가 아니라 세 가지 문자열 중 하나로 돌려준다:\nSENT    — 메일 서버가 받아줬다\nREFUSED — 메일 서버가 \"그런 수신자는 없다\"고 영구적으로 거부했다(5xx).\n존재하지 않는 이메일 주소일 가능성이 높다 → 호출부가 계정의\nemail_status를 UNDELIVERABLE로 올린다\nFAILED  — 설정이 없거나 네트워크/일시 장애라 못 보냈다(이메일 문제라고 단정할 수 없음)\n(Gmail처럼 일단 받고 나중에 반송하는 비동기 반송은 SMTP 응답만으로는 알 수 없다.)\nFAILED일 때는 원인을 네 가지로 나눠 기록하고(설정/인증/연결/기타) 관리자에게 Slack으로\n알린다. 사용자 화면은 계정 존재 여부가 드러나지 않게 항상 같은 안내를 보여주기 때문에,\n알림이 없으면 메일 설정이 틀려도 아무도 모른 채 \"메일을 보냈습니다\"만 계속 뜨게 된다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/notify/mailer.py"}, "routes/email.py": {"role": "메일 링크가 여는 확인 화면 2개. GET 은 화면만, POST 에서 토큰을 1회 소비한다. 로그인 불필요.", "header": "routes/email.py — 메일 링크가 여는 이메일 확인 화면 2개 (guide40)\nGET  /email/confirm?t=...   확인 화면만 보여준다(토큰을 소비하지 않음)\nPOST /email/confirm         토큰을 1회 소비하고 이메일 인증 / 이메일 변경을 반영한다\n로그인을 요구하지 않는다 — 메일은 휴대폰에서 여는 경우가 많고, 링크에 담긴 추측할 수 없는\n토큰을 가진 사람이 곧 그 메일함의 주인이기 때문이다. GET에서 소비하지 않는 이유는 메일 보안\n스캐너가 링크를 미리 열어도 토큰이 닳지 않게 하기 위해서다(routes/recovery.py와 같은 원칙).\nPOST에는 app.py가 IP당 분당 한도(EMAIL_CONFIRM_RATE_LIMIT_PER_MINUTE)를 따로 건다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/email.py"}, "db/users.py": {"role": "회원 표 저장소. 이메일 변경·인증 표시를 담당한다.", "header": "db/users.py — users 표 관련 함수 (회원가입 기능)\n— 감시 대상이 되는 가짜 로그인 화면(/login)에 실제로 가입해서 로그인하는\n\"일반 사용자\" 계정을 관리하는 기능. 관리자(admin_users)와는 완전히 별개 개념.\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/users.py"}}}</script>
<script>
(function(){

  var KIND_LABEL = {screen:"화면 · 도착지", route:"routes", helper:"판단", db:"db", config:"설정값", later:"다른 단원"};

  var state = { sc: 0, node: null, item: 0, file: null };

  function el(tag, attrs, kids){
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);

    });
    (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function brk(t){ return t.replace(/([\/._])/g, "$1\u200b"); }
  function scen(){ return D.scenarios[state.sc]; }
  function nodeById(id){ return scen().nodes.filter(function(n){ return n.id === id; })[0]; }
  function fnName(label){ return label; }

  /* ---------- 간단 문법 강조 ---------- */
  var PY = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?''')|([rbfRBF]{0,2}"(?:\\.|[^"\\\n])*"|[rbfRBF]{0,2}'(?:\\.|[^'\\\n])*')|\b(def|class|return|if|elif|else|for|while|import|from|as|try|except|finally|with|in|not|and|or|is|None|True|False|raise|pass|lambda|yield|global|nonlocal|assert|del|continue|break)\b|(@[A-Za-z_][\w.]*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(?=\()/g;
  var PYC = [null,"t-c","t-d","t-s","t-k","t-a","t-n","t-f"];
  var HT = /(<!--[\s\S]*?-->)|(\{[{%#][\s\S]*?[}%#]\})|(<\/?[A-Za-z][\w-]*)|("[^"\n]*")|(\/?>)/g;
  var HTC = [null,"t-c","t-a","t-k","t-s","t-k"];
  var JS = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\.|[^`\\])*`)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(const|let|var|function|return|if|else|for|while|import|from|export|default|async|await|try|catch|finally|new|class|extends|typeof|interface|type|null|undefined|true|false|throw|switch|case|break|continue|of|in|as)\b|(@[A-Za-z_]\w*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_$][\w$]*)(?=\()/g;
  var JSC = [null,"t-c","t-s","t-s","t-k","t-a","t-n","t-f"];
  var SQ = /(--[^\n]*|\/\*[\s\S]*?\*\/)|((?!))|('(?:''|[^'])*')|\b(select|from|where|insert|into|values|update|set|delete|create|table|index|alter|add|drop|on|conflict|do|nothing|and|or|not|null|default|primary|key|references|cascade|if|exists|as|order|by|group|limit|desc|asc|join|left|inner|count|returns|function|language|begin|end|return|with|union|all|distinct|in|is|true|false|unique|check|constraint|timestamptz|text|integer|bigint|boolean|interval|now|replace|trigger|view|policy|enable|row|level|security|using)\b|((?!))|\b(\d+(?:\.\d+)?)\b|\b([a-z_]\w*)(?=\()/gi;
  var SQC = [null,"t-c",null,"t-s","t-k",null,"t-n","t-f"];
  var SH = /(#[^\n]*)|((?!))|("(?:\\.|[^"\\\n])*"|'[^'\n]*')|\b(if|then|else|fi|for|do|done|while|case|esac|function|echo|export|python|pip|git|cd|run|name|on|jobs|steps|uses|with|env)\b|((?!))|\b(\d+)\b/g;
  var SHC = [null,"t-c",null,"t-s","t-k",null,"t-n"];
  function tokenize(code, lang){
    var re = PY, cls = PYC;
    if (lang === "html"){ re = HT; cls = HTC; }
    else if (lang === "js"){ re = JS; cls = JSC; }
    else if (lang === "sql"){ re = SQ; cls = SQC; }
    else if (lang === "sh"){ re = SH; cls = SHC; }
    var lines = [[]];
    function push(text, c){
      var parts = text.split("\n");
      parts.forEach(function(p, i){
        if (i > 0) lines.push([]);
        if (p) lines[lines.length-1].push([p, c]);
      });
    }
    var last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(code)) !== null){
      if (m.index > last) push(code.slice(last, m.index), null);
      var idx = 1; while (idx < m.length && m[idx] === undefined) idx++;
      push(m[0], cls[idx] || null);
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++;
    }
    if (last < code.length) push(code.slice(last), null);
    return lines;
  }

  function codeTable(block, hl){
    var lines = tokenize(block.code, block.lang);
    var tbody = el("tbody");
    var hlFirst = null;
    lines.forEach(function(segs, i){
      var no = block.start + i;
      var on = hl && no >= hl[0] && no <= hl[1];
      var td = el("td", {class:"tx"});
      segs.forEach(function(s){ td.appendChild(s[1] ? el("span", {class:s[1], text:s[0]}) : document.createTextNode(s[0])); });
      if (!segs.length) td.appendChild(document.createTextNode(" "));
      var tr = el("tr", on ? {class:"hl"} : null, [el("td", {class:"ln", text:String(no)}), td]);
      if (on && !hlFirst) hlFirst = tr;
      tbody.appendChild(tr);
    });
    var box = el("div", {class:"codebox"}, [el("table", {class:"code"}, [tbody])]);
    box._hlFirst = hlFirst;
    return box;
  }

  function copyText(text, btn){
    var done = function(){ var o = btn.textContent; btn.textContent = "복사됨 ✓"; setTimeout(function(){ btn.textContent = o; }, 1200); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
    function fallback(){
      var ta = el("textarea", {style:"position:fixed;opacity:0"}); ta.value = text; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); done(); } catch(e){} document.body.removeChild(ta);
    }
  }

  /* ---------- 패널 ---------- */
  function openPanel(){ document.body.classList.add("open"); }
  function closePanel(){ document.body.classList.remove("open"); }

  function showHint(){
    $("pTitle").textContent = "코드 보는 법";
    $("pSub").textContent = "카드나 파일 이름을 누르면 실제 코드가 여기에 열립니다.";
    var ul = el("ul", {class:"hint"}, [
      el("li", {text:"카드(상자)를 누르면 그 단계에서 실행되는 실제 함수 코드가 열려요."}),
      el("li", {text:"카드 안의 📄 파일 이름을 누르면 그 파일이 어떤 역할인지, 이 단원에서 쓰이는 함수가 무엇인지 보여줘요."}),
      el("li", {text:"ƒ 함수 이름을 누르면 해당 함수 코드로 바로 이동해요."}),
      el("li", {text:"노란색 줄이 지금 단계가 담당하는 부분이에요."}),
      el("li", {text:"db.함수() 처럼 적혀 있어도 실제 코드는 db/users.py 같은 다른 파일에 있어요. 카드에 그 '진짜 파일'을 표시하고, 코드 위에 찾아가는 길도 그려줘요."}),
      el("li", {text:"위쪽 ◀ ▶ 버튼으로 실행 순서대로 한 단계씩 따라갈 수 있어요."})
    ]);
    var b = $("pBody"); b.textContent = ""; b.appendChild(ul);
  }

  function renderAlias(a){
    if (!a) return null;
    return el("div", {class:"alias"}, [
      el("div", {text:"코드에는 이렇게 적혀 있지만, 실제 함수는 다른 파일에 있어요."}),
      el("div", {class:"route"}, [
        el("span", {class:"step", text:a.call}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step", text:a.via + " (창구)"}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step real", text:a.real})
      ])
    ]);
  }

  function selectNode(id, itemIdx){
    var n = nodeById(id); if (!n) return;
    state.node = id; state.item = itemIdx || 0; state.file = null;
    $("pTitle").textContent = n.title;
    $("pSub").textContent = n.plain;
    var body = $("pBody"); body.textContent = "";
    if (n.reject) body.appendChild(el("div", {class:"n-reject", text:n.reject, style:"margin:0 0 10px"}));
    if (n.items.length > 1){
      var tabs = el("div", {class:"itabs", role:"tablist"});
      n.items.forEach(function(it, i){
        tabs.appendChild(el("button", {class:"itab", role:"tab", "aria-selected":String(i === state.item), text:it.label,
          onclick:function(){ selectNode(id, i); }}));
      });
      body.appendChild(tabs);
    }
    var it = n.items[state.item];
    var block = D.blocks[it.block];
    var linesTxt = it.hl ? (it.hl[0] === it.hl[1] ? it.hl[0] + "줄" : it.hl[0] + "–" + it.hl[1] + "줄") : "";
    var fl = el("div", {class:"fileline"}, [
      el("button", {class:"chip file", onclick:function(){ selectFile(block.path); }, text:block.path}),
      el("span", {class:"lines", text: block.start + "–" + block.end + "줄 표시" + (linesTxt ? " · 노란색 " + linesTxt : "")}),
      el("span", {class:"spacer"}),
      el("button", {class:"btn", text:"복사", onclick:function(e){ copyText(block.code, e.currentTarget); }}),
      el("a", {class:"btn link", href:D.files[block.path].github + "#L" + block.start + "-L" + block.end, target:"_blank", rel:"noopener", text:"GitHub ↗"})
    ]);
    body.appendChild(fl);
    var al = renderAlias(block.alias); if (al) body.appendChild(al);
    var box = codeTable(block, it.hl);
    body.appendChild(box);
    if (it.hl) body.appendChild(el("p", {class:"legend-hl"}, [el("b", {text:"노란색"}), " = 이 카드가 담당하는 줄"]));
    refreshSelection();
    openPanel();
    if (box._hlFirst){
      var off = box._hlFirst.offsetTop - 60;
      box.scrollTop = Math.max(0, off);
    }
    updateStepper();
  }

  function selectFile(path){
    state.file = path; state.node = null;
    var f = D.files[path];
    $("pTitle").textContent = "📄 " + path;
    $("pSub").textContent = f.role;
    var body = $("pBody"); body.textContent = "";
    body.appendChild(el("div", {class:"fileline"}, [
      el("a", {class:"btn link", href:f.github, target:"_blank", rel:"noopener", text:"GitHub에서 파일 열기 ↗"})
    ]));
    body.appendChild(el("h3", {text:"이 단원에서 쓰이는 함수", style:"font-size:13.5px;margin:12px 0 0"}));
    var ul = el("ul", {class:"flist"}), seen = {};
    D.scenarios.forEach(function(sc, si){
      sc.nodes.forEach(function(n){
        n.items.forEach(function(it, ii){
          var b = D.blocks[it.block]; if (b.path !== path) return;
          var key = si + n.id + ii; if (seen[key]) return; seen[key] = 1;
          var li = el("li");
          li.appendChild(el("button", {onclick:function(){
            if (state.sc !== si) switchScenario(si);
            selectNode(n.id, ii); scrollToNode(n.id);
          }}, [
            el("span", {class:"mono", text:it.label}), el("small", {text:sc.name + " · " + n.title})
          ]));
          ul.appendChild(li);
        });
      });
    });
    body.appendChild(ul);
    if (f.header){
      var d = el("details", {class:"hdr"}, [el("summary", {text:"파일 맨 위 설명 주석 보기"}), el("pre", {text:f.header})]);
      body.appendChild(d);
    }
    refreshSelection();
    openPanel();
  }

  /* ---------- 흐름도 ---------- */
  var cols, colIndex, nodeEls = {};
  function renderStage(){
    var sc = scen();
    var used = {}; sc.nodes.forEach(function(n){ used[n.col] = 1; });
    cols = Object.keys(used).map(Number).sort(function(a,b){ return a-b; });
    colIndex = {}; cols.forEach(function(c, i){ colIndex[c] = i + 1; });
    var stage = $("stage");
    stage.textContent = "";
    stage.style.gridTemplateColumns = "repeat(" + cols.length + ", 196px)";
    nodeEls = {};

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "edges"); svg.id = "edges";
    svg.innerHTML = '<defs>' +
      '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-call" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '</defs>';
    stage.appendChild(svg);

    cols.forEach(function(c){
      stage.appendChild(el("div", {class:"colhead", style:"grid-column:" + colIndex[c] + ";grid-row:1", text:D.columns[c]}));
    });
    var cells = {};
    sc.nodes.forEach(function(n){
      var k = n.row + ":" + n.col;
      if (!cells[k]){
        cells[k] = el("div", {class:"cell", style:"grid-column:" + colIndex[n.col] + ";grid-row:" + (n.row + 2)});
        stage.appendChild(cells[k]);
      }
      var node = buildNode(n);
      nodeEls[n.id] = node;
      cells[k].appendChild(node);
    });
    $("intro").textContent = sc.intro;
    scheduleEdges();
  }

  function buildNode(n){
    var node = el("div", {class:"node " + n.kind, role:"button", tabindex:"0", "aria-pressed":"false", "data-id":n.id,
      onclick:function(e){ if (e.target.closest(".chip")) return; selectNode(n.id, 0); },
      onkeydown:function(e){ if ((e.key === "Enter" || e.key === " ") && !e.target.closest(".chip")){ e.preventDefault(); selectNode(n.id, 0); } }});
    var title = el("div", {class:"n-title", text:n.title});
    if (n.later) title.appendChild(el("span", {class:"tag-later", text:n.later + "에서 자세히"}));
    node.appendChild(title);
    if (n.kind !== "later" && n.plain) node.appendChild(el("div", {class:"n-plain", text:n.plain}));
    if (n.reject) node.appendChild(el("div", {class:"n-reject", text:n.reject}));
    var items = el("div", {class:"n-items"});
    // 같은 파일에 있는 함수는 파일 칩 하나 아래에 함수 칩을 나란히 놓는다
    var groups = [];
    n.items.forEach(function(it, i){
      var b = D.blocks[it.block], g = groups[groups.length - 1];
      if (g && g.path === b.path) g.list.push({it: it, i: i}); else groups.push({path: b.path, list: [{it: it, i: i}]});
    });
    groups.forEach(function(g){
      var row = el("div", {class:"n-item"});
      if (g.list.length === 1 && g.list[0].it.call) row.appendChild(el("div", {class:"n-call", text:brk(g.list[0].it.call)}));
      var chips = el("div", {class:"chips"}, [
        el("button", {class:"chip file", text:brk(g.path), title:"파일 설명 보기", onclick:function(){ selectFile(g.path); }})
      ]);
      g.list.forEach(function(x){
        chips.appendChild(el("button", {class:"chip " + (x.it.snippet ? "snip" : "fn"), text:x.it.label, title:(x.it.call ? x.it.call + " — " : "") + "코드 보기",
          onclick:function(){ selectNode(n.id, x.i); }}));
      });
      row.appendChild(chips);
      items.appendChild(row);
    });
    node.appendChild(items);
    return node;
  }

  function rectIn(elm, host){
    var a = elm.getBoundingClientRect(), h = host.getBoundingClientRect();
    return {l:a.left-h.left, r:a.right-h.left, t:a.top-h.top, b:a.bottom-h.top, cx:(a.left+a.right)/2-h.left, cy:(a.top+a.bottom)/2-h.top};
  }
  var raf = 0;
  function scheduleEdges(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(drawEdges); }
  function drawEdges(){
    var stage = $("stage"), svg = $("edges"), sc = scen();
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){ p.remove(); });
    Array.prototype.slice.call(stage.querySelectorAll(".elabel")).forEach(function(p){ p.remove(); });
    var svgNS = "http://www.w3.org/2000/svg";
    sc.edges.forEach(function(e){
      var a = nodeById(e.from), b = nodeById(e.to);
      var ea = nodeEls[e.from], eb = nodeEls[e.to]; if (!ea || !eb) return;
      var ra = rectIn(ea, stage), rb = rectIn(eb, stage), d, lx, ly;
      if (a.col === b.col){
        if (b.row - a.row <= 1){
          d = "M" + ra.cx + " " + ra.b + " V" + rb.t; lx = ra.cx; ly = (ra.b + rb.t) / 2;
        } else {
          var x = Math.min(ra.l, rb.l) - 30;
          d = "M" + ra.l + " " + ra.cy + " H" + x + " V" + rb.cy + " H" + rb.l; lx = x; ly = (ra.cy + rb.cy) / 2;
        }
      } else {
        var dir = b.col > a.col ? 1 : -1;
        var x1 = dir > 0 ? ra.r : ra.l, x2 = dir > 0 ? rb.l : rb.r;
        var xm = x2 - dir * 30;
        d = "M" + x1 + " " + ra.cy + " H" + xm + " V" + rb.cy + " H" + x2;
        lx = (x1 + x2) / 2; ly = ra.cy;
      }
      var kind = e.kind === "call" ? "call" : "flow";
      var p = document.createElementNS(svgNS, "path");
      p.setAttribute("d", d); p.setAttribute("class", "e " + kind);
      p.setAttribute("marker-end", "url(#" + (kind === "call" ? "ahc" : "ah") + ")");
      p.setAttribute("data-from", e.from); p.setAttribute("data-to", e.to);
      svg.appendChild(p);
      if (e.label && kind === "flow"){
        var lab = el("span", {class:"elabel", text:e.label});
        lab.style.left = lx + "px"; lab.style.top = ly + "px";
        stage.appendChild(lab);
      }
    });
    svg.setAttribute("width", stage.scrollWidth); svg.setAttribute("height", stage.scrollHeight);
    refreshSelection();
  }

  function refreshSelection(){
    Object.keys(nodeEls).forEach(function(id){ nodeEls[id].setAttribute("aria-pressed", String(id === state.node)); });
    var svg = $("edges"); if (!svg) return;
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){
      var on = state.node && (p.getAttribute("data-from") === state.node || p.getAttribute("data-to") === state.node);
      p.classList.toggle("active", !!on);
    });
  }
  function scrollToNode(id){
    var n = nodeEls[id]; if (n && n.scrollIntoView) n.scrollIntoView({block:"center", inline:"center", behavior:"smooth"});
  }

  /* ---------- 단계 이동 / 탭 ---------- */
  function stepIndex(){ return scen().steps.indexOf(state.node); }
  function updateStepper(){
    var steps = scen().steps, i = stepIndex();
    $("stepNo").textContent = i < 0 ? "– / " + steps.length : (i + 1) + " / " + steps.length;
    $("prev").disabled = i <= 0 && state.node !== null ? true : false;
    $("next").disabled = i >= steps.length - 1;
    if (state.node === null){ $("prev").disabled = true; $("next").disabled = false; }
  }
  function go(delta){
    var steps = scen().steps, i = stepIndex();
    var j = i < 0 ? 0 : Math.max(0, Math.min(steps.length - 1, i + delta));
    selectNode(steps[j], 0); scrollToNode(steps[j]);
  }
  function renderTabs(){
    var t = $("tabs"); t.textContent = "";
    D.scenarios.forEach(function(sc, i){
      t.appendChild(el("button", {class:"tab", role:"tab", "aria-selected":String(i === state.sc), text:sc.name, onclick:function(){ switchScenario(i); }}));
    });
  }
  function switchScenario(i){
    state.sc = i; state.node = null; state.file = null;
    renderTabs(); renderStage(); showHint(); updateStepper();
    try { history.replaceState(null, "", "#" + D.scenarios[i].id); } catch(e){}
  }

  /* ---------- 시작 ---------- */
  document.title = D.title + " — 코드 흐름도";
  $("title").textContent = D.title + " · 코드 흐름도";
  $("subtitle").textContent = D.subtitle;
  $("mdlink").setAttribute("href", D.mdFile);
  $("prev").addEventListener("click", function(){ go(-1); });
  $("next").addEventListener("click", function(){ go(1); });
  $("pClose").addEventListener("click", closePanel);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closePanel(); });
  $("theme").addEventListener("click", function(){
    var r = document.documentElement, cur = r.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  });
  window.addEventListener("resize", scheduleEdges);
  if (window.ResizeObserver) new ResizeObserver(scheduleEdges).observe($("stage"));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleEdges);

  var startId = (location.hash || "").replace("#", "");
  var startIdx = 0; D.scenarios.forEach(function(s, i){ if (s.id === startId) startIdx = i; });
  switchScenario(startIdx);
  // 화면 확인/테스트용 지름길: window.__flow.select("s7")
  window.__flow = { select: function(id, i){ selectNode(id, i || 0); }, file: selectFile, state: state };
})();
</script>
</body>
</html>
