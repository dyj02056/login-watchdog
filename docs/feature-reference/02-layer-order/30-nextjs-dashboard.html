<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30. Next.js 관제 화면과 집계 API — 코드 흐름도</title>
<style>
  :root{
    --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eaefe9; --ink:#12201c; --ink-muted:#5a6b63;
    --border:#d9e0da; --accent:#0f6f66; --accent-soft:#e2ede9; --danger:#bf3b2b; --danger-soft:#f8e6e2;
    --edge:#7b8a82; --edge-call:#8a97a0;
    --k-screen:#767f78; --k-screen-soft:#eef0ee;
    --k-route:#2f5fd6;  --k-route-soft:#e7edfb;
    --k-helper:#b56b0c; --k-helper-soft:#f7ecd9;
    --k-db:#7a4fce;     --k-db-soft:#efe8fa;
    --k-config:#0f6f66; --k-config-soft:#e2ede9;
    --k-later:#9aa39d;  --k-later-soft:#f4f6f3;
    --code-bg:#fbfcfb; --code-hl:#fff3c4; --code-hl-bar:#e0a800; --code-gutter:#8a978f;
    --c-comment:#6b7d73; --c-str:#a1470f; --c-kw:#7a3fc0; --c-fn:#1f5fd0; --c-num:#0b7a6c; --c-deco:#b0306e;
    --shadow:0 1px 2px rgba(18,32,28,.06), 0 6px 20px rgba(18,32,28,.07);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
      --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
      --edge:#6f8178; --edge-call:#5d6f67;
      --k-screen:#9aa39d; --k-screen-soft:#1a221e;
      --k-route:#7fa2f2;  --k-route-soft:#182236;
      --k-helper:#e8a94c; --k-helper-soft:#31260f;
      --k-db:#b49bee;     --k-db-soft:#241c34;
      --k-config:#4fc9b8; --k-config-soft:#17332d;
      --k-later:#6b7a72;  --k-later-soft:#111a16;
      --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
      --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
    --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
    --edge:#6f8178; --edge-call:#5d6f67;
    --k-screen:#9aa39d; --k-screen-soft:#1a221e;
    --k-route:#7fa2f2;  --k-route-soft:#182236;
    --k-helper:#e8a94c; --k-helper-soft:#31260f;
    --k-db:#b49bee;     --k-db-soft:#241c34;
    --k-config:#4fc9b8; --k-config-soft:#17332d;
    --k-later:#6b7a72;  --k-later-soft:#111a16;
    --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
    --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
  button{font:inherit;color:inherit;cursor:pointer}
  code,.mono{font-family:var(--mono)}

  .app{display:flex;height:100vh;min-height:0}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{padding:14px 20px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
  .top h1{margin:0;font-size:19px;letter-spacing:-.01em}
  .top .sub{margin:2px 0 0;color:var(--ink-muted);font-size:13px}
  .top-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
  .tabs{display:flex;gap:6px}
  .tab{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:5px 14px;font-weight:600}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .tab[aria-selected="true"]{color:#06201b}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#06201b}}
  .spacer{flex:1}
  .btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:default}
  .stepper{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-muted)}
  .stepper b{color:var(--ink);min-width:42px;text-align:center}
  a.link{color:var(--accent);text-decoration:none;font-size:13px}
  a.link:hover{text-decoration:underline}

  .intro{margin:0;padding:10px 20px;color:var(--ink-muted);font-size:13px;border-bottom:1px solid var(--border);background:var(--surface-2)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 20px;font-size:12px;color:var(--ink-muted);border-bottom:1px solid var(--border)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .stage-wrap{flex:1;min-height:0;overflow:auto}
  .stage{position:relative;display:grid;gap:26px 46px;padding:22px 22px 60px;width:max-content;min-width:100%}
  .edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .edges path{fill:none;stroke:var(--edge);stroke-width:1.6}
  .edges path.call{stroke:var(--edge-call);stroke-dasharray:5 4}
  .edges path.active{stroke:var(--accent);stroke-width:2.4;stroke-dasharray:none}
  .edges .head{fill:var(--edge)}
  .edges .head-call{fill:var(--edge-call)}
  .elabel{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;
    background:var(--surface);border:1px solid var(--border);color:var(--ink-muted);white-space:nowrap;pointer-events:none}

  .colhead{font-size:12px;font-weight:700;color:var(--ink-muted);text-transform:none;border-bottom:2px solid var(--border);padding-bottom:6px;align-self:end}
  .cell{display:flex;flex-direction:column;gap:12px;align-self:center;justify-content:center;position:relative;z-index:1}

  .node{--k:var(--k-route);--ks:var(--k-route-soft);position:relative;background:var(--surface);border:1px solid var(--border);
    border-left:5px solid var(--k);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .08s, border-color .12s}
  .node:hover{transform:translateY(-1px);border-color:var(--k)}
  .node:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .node[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
  .node.screen{--k:var(--k-screen);--ks:var(--k-screen-soft)}
  .node.route{--k:var(--k-route);--ks:var(--k-route-soft)}
  .node.helper{--k:var(--k-helper);--ks:var(--k-helper-soft)}
  .node.db{--k:var(--k-db);--ks:var(--k-db-soft)}
  .node.config{--k:var(--k-config);--ks:var(--k-config-soft)}
  .node.later{--k:var(--k-later);--ks:var(--k-later-soft);background:var(--k-later-soft);box-shadow:none;border-style:dashed;border-left-style:solid;padding:8px 10px}
  .n-title{font-weight:700;font-size:13.5px;letter-spacing:-.01em}
  .n-plain{margin-top:3px;color:var(--ink-muted);font-size:12.5px}
  .n-reject{margin-top:6px;font-size:12px;color:var(--danger);background:var(--danger-soft);border-radius:6px;padding:3px 8px}
  .n-reject::before{content:"막히면 → ";font-weight:700}
  .n-items{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .n-item{display:flex;flex-direction:column;gap:3px}
  .n-call{overflow-wrap:anywhere;font-family:var(--mono);font-size:11.5px;color:var(--k);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{max-width:100%;text-align:left;overflow-wrap:anywhere;border:1px solid var(--border);background:var(--ks);color:var(--ink);border-radius:6px;padding:1px 7px;font-family:var(--mono);font-size:11px}
  .chip:hover{border-color:var(--k);color:var(--k)}
  .chip.file::before{content:"📄 "}
  .chip.fn::before{content:"ƒ ";color:var(--k);font-weight:700}
  .chip.snip::before{content:"▤ ";color:var(--k);font-weight:700}
  .tag-later{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--ink-muted);border:1px solid var(--border);border-radius:999px;padding:0 7px;background:var(--surface)}

  /* 코드 패널 */
  .panel{width:440px;flex:none;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
  .p-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
  .p-head h2{margin:0;font-size:15.5px;letter-spacing:-.01em}
  .p-head p{margin:4px 0 0;color:var(--ink-muted);font-size:13px}
  .p-close{display:none}
  .p-body{flex:1;min-height:0;overflow:auto;padding:12px 16px 24px}
  .hint{color:var(--ink-muted);font-size:13px}
  .hint li{margin:4px 0}
  .itabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .itab{border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:2px 9px;font-family:var(--mono);font-size:12px}
  .itab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .fileline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
  .fileline .path{font-family:var(--mono);font-size:12.5px;font-weight:700}
  .fileline .lines{font-family:var(--mono);font-size:12px;color:var(--ink-muted)}
  .alias{border:1px solid var(--border);background:var(--k-db-soft);border-radius:8px;padding:8px 10px;margin:0 0 10px;font-size:12.5px}
  .alias .route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px;font-family:var(--mono);font-size:12px}
  .alias .route span.step{padding:1px 7px;border-radius:6px;border:1px solid var(--border);background:var(--surface)}
  .alias .route span.real{border-color:var(--k-db);color:var(--k-db);font-weight:700}
  .alias .arrow{color:var(--ink-muted)}
  .codebox{border:1px solid var(--border);border-radius:8px;background:var(--code-bg);overflow:auto;max-height:62vh}
  table.code{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.2px;line-height:1.6}
  table.code td{padding:0 10px;vertical-align:top;white-space:pre}
  table.code td.ln{position:sticky;left:0;text-align:right;color:var(--code-gutter);user-select:none;background:var(--code-bg);border-right:1px solid var(--border);min-width:44px;padding-right:8px}
  table.code tr.hl td{background:var(--code-hl)}
  table.code tr.hl td.ln{background:var(--code-hl);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--code-hl-bar)}
  .t-c{color:var(--c-comment);font-style:italic}.t-d{color:var(--c-comment)}.t-s{color:var(--c-str)}.t-k{color:var(--c-kw);font-weight:600}
  .t-f{color:var(--c-fn)}.t-n{color:var(--c-num)}.t-a{color:var(--c-deco)}
  .legend-hl{margin:8px 0 0;font-size:12px;color:var(--ink-muted)}
  .legend-hl b{background:var(--code-hl);color:var(--ink);padding:0 6px;border-radius:4px}
  .flist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
  .flist button{width:100%;text-align:left;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:6px 10px}
  .flist button:hover{border-color:var(--accent)}
  .flist small{display:block;color:var(--ink-muted)}
  details.hdr{margin-top:12px;font-size:13px}
  details.hdr pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px;font-family:var(--sans);font-size:12.5px;color:var(--ink-muted)}

  @media (max-width:900px){
    .app{display:block;height:auto}
    .stage-wrap{max-height:none;overflow-x:auto}
    .panel{position:fixed;left:0;right:0;bottom:0;width:auto;height:62vh;border-left:0;border-top:2px solid var(--accent);
      box-shadow:0 -10px 30px rgba(0,0,0,.25);z-index:20;transform:translateY(105%);transition:transform .18s}
    body.open .panel{transform:none}
    .p-close{display:inline-block;position:absolute;right:12px;top:10px}
    .p-head{position:relative;padding-right:70px}
    .top{padding:12px 16px 8px}
    .stage{padding:16px 16px 70vh}
  }
  @media (prefers-reduced-motion: reduce){.node,.panel{transition:none}}
</style>
</head>

 {"id": "stats_n8", "col": 1, "row": 4, "kind": "route", "title": "④ 순수 계산 — DB 없이 테스트할 수 있다", "plain": "시간대별 건수·7일 로그량·공격자 히트맵·신규/반복 공격자·국가별 흐름·미처리 이벤트 정렬 등을 계산합니다. 계산부가 DB 와 분리되어 있어 테스트가 쉽습니다.", "reject": "", "later": "", "items": [{"block": "db/stats.py:build_threat_stats", "hl": [196, 196], "label": "build_threat_stats()", "call": null, "snippet": false}]}, {"id": "stats_n9", "col": 2, "row": 4, "kind": "later", "title": "상위 IP 의 국가 정보", "plain": "4단원의 위치 캐시를 재사용합니다.", "reject": "", "later": "4단원", "items": [{"block": "db/geoip_cache.py:get_cached_ip_locations", "hl": null, "label": "get_cached_ip_locations()", "call": "db.get_cached_ip_locations()", "snippet": false}]}], "edges": [{"from": "stats_n1", "to": "stats_n2", "label": "", "kind": "flow"}, {"from": "stats_n2", "to": "stats_n3", "label": "", "kind": "call"}, {"from": "stats_n2", "to": "stats_n4", "label": "", "kind": "flow"}, {"from": "stats_n4", "to": "stats_n5", "label": "", "kind": "call"}, {"from": "stats_n4", "to": "stats_n6", "label": "", "kind": "flow"}, {"from": "stats_n6", "to": "stats_n7", "label": "", "kind": "call"}, {"from": "stats_n6", "to": "stats_n8", "label": "", "kind": "flow"}, {"from": "stats_n8", "to": "stats_n9", "label": "", "kind": "call"}], "steps": ["stats_n1", "stats_n2", "stats_n4", "stats_n6", "stats_n8"]}], "blocks": {"helpers/spa.py:serve_shell": {"path": "helpers/spa.py", "start": 159, "end": 173, "lang": "python", "code": "def serve_shell():\n    \"\"\"before_request: 화면이 있는 GET 주소를 브라우저가 직접 열면 정적 HTML을 내려준다.\"\"\"\n    if request.method != \"GET\" or is_spa_request() or not is_enabled():\n        return None\n    filename = SPA_PAGES.get(request.endpoint or \"\")\n    if filename is None:\n        return None\n    html_path = SPA_DIR / filename\n    if not html_path.is_file():\n        return None\n    response = send_file(html_path, mimetype=\"text/html\", max_age=0)\n    response.headers[\"Cache-Control\"] = \"no-store\"\n    response.headers[\"X-Spa-Shell\"] = filename\n    response.headers[\"X-Spa-Script-Hashes\"] = \" \".join(inline_script_hashes(html_path))\n    return response", "alias": null}, "helpers/spa.py:is_enabled": {"path": "helpers/spa.py", "start": 88, "end": 92, "lang": "python", "code": "def is_enabled() -> bool:\n    \"\"\"정적 빌드가 있고 꺼져 있지 않으면 켠다. SPA_ENABLED=false로 강제로 끌 수 있다.\"\"\"\n    if os.environ.get(\"SPA_ENABLED\", \"true\").lower() == \"false\":\n        return False\n    return SPA_DIR.is_dir() and any(SPA_DIR.rglob(\"*.html\"))", "alias": null}, "helpers/spa.py:apply_script_hashes": {"path": "helpers/spa.py", "start": 242, "end": 252, "lang": "python", "code": "def apply_script_hashes(response: Response) -> Response:\n    \"\"\"껍데기 응답에만, 그 페이지의 인라인 스크립트 해시를 CSP script-src에 더한다.\"\"\"\n    hashes = response.headers.pop(\"X-Spa-Script-Hashes\", None)\n    response.headers.pop(\"X-Spa-Shell\", None)\n    if hashes is None:\n        return response\n    csp = response.headers.get(\"Content-Security-Policy\", \"\")\n    if hashes and \"script-src 'self'\" in csp:\n        csp = csp.replace(\"script-src 'self'\", f\"script-src 'self' {hashes}\", 1)\n        response.headers[\"Content-Security-Policy\"] = csp\n    return response", "alias": null}, "helpers/spa.py:inline_script_hashes": {"path": "helpers/spa.py", "start": 99, "end": 114, "lang": "python", "code": "def inline_script_hashes(html_path: Path) -> list[str]:\n    \"\"\"정적 HTML 안의 인라인 <script>마다 CSP 해시('sha256-...')를 계산한다.\n\n    Next 정적 빌드는 화면 데이터를 인라인 스크립트로 심어 두는데, 이 사이트의 CSP는\n    script-src 'self'라서 그대로는 막힌다. 'unsafe-inline'으로 풀면 XSS 방어가 사라지므로,\n    우리가 빌드한 그 스크립트 내용만 해시로 허용한다(내용이 바뀌면 해시도 바뀌어 막힌다).\n    \"\"\"\n    key = f\"{html_path}:{html_path.stat().st_mtime_ns}\"  # 다시 빌드하면 해시도 새로 계산한다\n    if key not in _csp_cache:\n        text = html_path.read_text(encoding=\"utf-8\")\n        _csp_cache[key] = [\n            \"'sha256-\" + base64.b64encode(hashlib.sha256(m.encode(\"utf-8\")).digest()).decode() + \"'\"\n            for m in _INLINE_SCRIPT.findall(text)\n            if m.strip()\n        ]\n    return _csp_cache[key]", "alias": null}, "web/src/lib/api.ts:63-77": {"path": "web/src/lib/api.ts", "start": 63, "end": 77, "lang": "js", "code": "export async function getPage<T = Record<string, unknown>>(path: string): Promise<Envelope<T> | null> {\n  try {\n    const response = await fetch(path, { headers: SPA_HEADERS, cache: \"no-store\" });\n    const body = await readJson<Envelope<T>>(response);\n    if (!body) return { messages: [\"응답을 읽지 못했습니다.\"], status: response.status };\n    remember(body);\n    if (body.redirect && body.status !== 400) {\n      go(body.redirect);\n      return null;\n    }\n    return body;\n  } catch {\n    return networkError<T>();\n  }\n}", "alias": null}, "web/src/lib/api.ts:27-29": {"path": "web/src/lib/api.ts", "start": 27, "end": 29, "lang": "js", "code": "export function go(path: string) {\n  window.location.assign(path);\n}", "alias": null}, "helpers/spa.py:_capture_context": {"path": "helpers/spa.py", "start": 148, "end": 156, "lang": "python", "code": "def _capture_context(sender, template, context, **extra):\n    if not is_spa_request():\n        return\n    data = {\n        k: _scrub(v)\n        for k, v in context.items()\n        if k not in _CONTEXT_SKIP and not callable(v) and _json_safe(v)\n    }\n    g._spa_page = (template.name, data)", "alias": null}, "helpers/spa.py:_scrub": {"path": "helpers/spa.py", "start": 122, "end": 132, "lang": "python", "code": "def _scrub(value):\n    \"\"\"JSON으로 바꿀 수 있는 값만 남기고, 비밀 칸은 지운다(함수·객체는 버린다).\"\"\"\n    if isinstance(value, dict):\n        return {\n            k: _scrub(v)\n            for k, v in value.items()\n            if not any(part in str(k).lower() for part in _SECRET_KEY_PARTS)\n        }\n    if isinstance(value, (list, tuple)):\n        return [_scrub(v) for v in value]\n    return value", "alias": null}, "helpers/spa.py:119-119": {"path": "helpers/spa.py", "start": 119, "end": 119, "lang": "python", "code": "_SECRET_KEY_PARTS = (\"password\", \"hash\", \"token\", \"secret\", \"session_version\")", "alias": null}, "helpers/spa.py:convert_response": {"path": "helpers/spa.py", "start": 196, "end": 239, "lang": "python", "code": "def convert_response(response: Response) -> Response:\n    \"\"\"after_request: 어댑터 헤더가 붙은 요청의 응답을 JSON으로 바꾼다.\"\"\"\n    if not is_spa_request():\n        return response\n\n    response.headers[\"Cache-Control\"] = \"no-store\"\n\n    if response.mimetype == \"application/json\":\n        return response\n\n    # flash는 두 곳에 있을 수 있다. 템플릿이 렌더링하며 꺼냈다면 Flask가 요청 안에 기억해 두므로\n    # get_flashed_messages()가 같은 목록을 다시 돌려주고, 아직 안 꺼냈다면 지금 꺼낸다.\n    messages: list[str] = []\n    is_redirect = response.status_code in _REDIRECT_STATUSES and bool(response.headers.get(\"Location\"))\n    if is_redirect:\n        # 리다이렉트로 가는 화면이 그 문장을 보여주도록 세션에 남겨 둔다(꺼내면 사라진다).\n        messages += [message for _category, message in session.get(\"_flashes\", [])]\n    else:\n        messages += get_flashed_messages()\n\n    payload: dict = {\"messages\": messages, \"csrf\": generate_csrf()}\n    status = 200\n\n    if is_redirect:\n        # 리다이렉트는 HTTP 상태 대신 본문으로 알린다(fetch가 따라가 버리지 않게).\n        payload[\"redirect\"] = _path_with_query(response.headers[\"Location\"])\n        if response.status_code == 400:\n            payload[\"status\"] = 400  # CSRF 오류 핸들러처럼 400과 함께 돌려보내는 리다이렉트\n        response.headers.pop(\"Location\", None)\n    elif getattr(g, \"_spa_page\", None) is not None:\n        payload[\"page\"], payload[\"data\"] = g._spa_page\n        payload[\"status\"] = response.status_code\n        status = response.status_code\n    else:\n        payload[\"status\"] = response.status_code\n        status = response.status_code\n        if status >= 400 and not messages:\n            payload[\"messages\"] = [_STATUS_MESSAGES.get(status, \"요청을 처리하지 못했습니다.\")]\n\n    response.set_data(json.dumps(payload, ensure_ascii=False))\n    response.status_code = status\n    response.headers[\"Content-Type\"] = \"application/json; charset=utf-8\"\n    response.headers[\"Content-Length\"] = str(len(response.get_data()))\n    return response", "alias": null}, "helpers/spa.py:_path_with_query": {"path": "helpers/spa.py", "start": 143, "end": 145, "lang": "python", "code": "def _path_with_query(location: str) -> str:\n    parts = urlsplit(location)\n    return parts.path + (f\"?{parts.query}\" if parts.query else \"\")", "alias": null}, "web/src/lib/api.ts:80-102": {"path": "web/src/lib/api.ts", "start": 80, "end": 102, "lang": "js", "code": "export async function postForm<T = Record<string, unknown>>(\n  path: string,\n  fields: Record<string, string>,\n): Promise<Envelope<T> | null> {\n  try {\n    const token = await sessionCsrf();\n    const response = await fetch(path, {\n      method: \"POST\",\n      headers: { ...SPA_HEADERS, \"X-CSRFToken\": token, \"Content-Type\": \"application/x-www-form-urlencoded\" },\n      body: new URLSearchParams({ website: \"\", ...fields }),\n    });\n    const body = await readJson<Envelope<T>>(response);\n    if (!body) return { messages: [\"응답을 읽지 못했습니다.\"], status: response.status };\n    remember(body);\n    if (body.redirect && body.status !== 400) {\n      go(body.redirect);\n      return null;\n    }\n    return body;\n  } catch {\n    return networkError<T>();\n  }\n}", "alias": null}, "helpers/spa.py:register": {"path": "helpers/spa.py", "start": 255, "end": 276, "lang": "python", "code": "def register(app) -> None:\n    \"\"\"app.py에서 한 번 호출한다. Limiter 뒤, register_request_hooks 앞에 등록해야 한다\n    (껍데기 응답은 전역 요청 한도는 받되, 반복 접근 관찰에는 잡히지 않는다).\"\"\"\n    template_rendered.connect(_capture_context, app)\n    app.before_request(serve_shell)\n    # after_request는 등록의 역순으로 돈다 — 보안 헤더(hooks)가 먼저 붙은 뒤 해시를 더하려면 이 둘이 뒤에 와야 한다.\n    app.after_request(convert_response)\n    app.after_request(apply_script_hashes)\n\n    @app.route(\"/api/spa/session\", methods=[\"GET\"])\n    def spa_session():\n        \"\"\"화면이 처음 열릴 때 CSRF 토큰과 로그인 상태를 알아가는 곳(조회만, DB 접근 없음).\"\"\"\n        return jsonify(\n            {\n                \"csrf\": generate_csrf(),\n                \"member\": \"user_id\" in session,\n                \"admin\": \"admin_id\" in session,\n                # 화면 머리줄에 \"누구로 로그인했는지\" 보여주는 데만 쓴다(본인 아이디, 세션에서 바로 읽음)\n                \"username\": session.get(\"username\"),\n                \"admin_username\": session.get(\"admin_username\"),\n            }\n        )", "alias": null}, "routes/admin/status.py:api_stats": {"path": "routes/admin/status.py", "start": 171, "end": 188, "lang": "python", "code": "@admin_bp.route(\"/api/stats\", methods=[\"GET\"])\n@login_required\ndef api_stats():\n    \"\"\"관제 화면(위협 현황·공격 상세)의 차트·히트맵·표 숫자를 한 번에 돌려준다(db/stats.py).\n\n    /api/status와 달리 목록 전체가 아니라 집계만 내려보낸다. 조회만 하므로 권한은 로그인 확인이면 충분하다.\n    \"\"\"\n    with ThreadPoolExecutor(max_workers=4) as executor:\n        locks = executor.submit(db.list_active_lockouts)\n        account_locks = executor.submit(db.list_active_account_lockouts)\n        admin_locks = executor.submit(db.list_active_admin_account_lockouts)\n        pending = executor.submit(db.list_pending_requests, 1, 1)\n        ip_locks, member_locks, admin_account_locks = locks.result(), account_locks.result(), admin_locks.result()\n        active = len(ip_locks) + len(member_locks) + len(admin_account_locks)\n        pending_count = pending.result()[1]\n    stats = db_stats.get_threat_stats(active_locks=active, pending_ai=pending_count)\n    # 잠금 목록은 건수가 같아도 내용이 바뀔 수 있어서(풀림·재잠금) 보관된 집계에 매번 새로 얹는다.\n    return jsonify({**stats, **db_stats.build_locks(ip_locks, member_locks, admin_account_locks)})", "alias": null}, "db/lockouts.py:list_active_lockouts": {"path": "db/lockouts.py", "start": 211, "end": 224, "lang": "python", "code": "def list_active_lockouts() -> list[dict]:\n    \"\"\"지금 잠겨있는(active=True) IP 목록 전체를 가져온다.\n\n    관리자 대시보드에서 \"현재 잠긴 IP 카드\" 목록을 보여줄 때 쓰인다.\n    \"\"\"\n    res = (\n        db.get_client()\n        .table(\"lockouts\")\n        .select(\"*\")\n        .eq(\"active\", True)\n        .order(\"locked_at\", desc=True)  # 가장 최근에 잠긴 것부터 보여줌\n        .execute()\n    )\n    return res.data", "alias": {"call": "db.list_active_lockouts()", "via": "db/__init__.py", "real": "db/lockouts.py"}}, "db/account_lockouts.py:list_active_account_lockouts": {"path": "db/account_lockouts.py", "start": 176, "end": 186, "lang": "python", "code": "def list_active_account_lockouts() -> list[dict]:\n    \"\"\"지금 잠겨있는(active=True) 계정 목록 전체를 가져온다.\"\"\"\n    res = (\n        db.get_client()\n        .table(\"account_lockouts\")\n        .select(\"*\")\n        .eq(\"active\", True)\n        .order(\"locked_at\", desc=True)\n        .execute()\n    )\n    return res.data", "alias": {"call": "db.list_active_account_lockouts()", "via": "db/__init__.py", "real": "db/account_lockouts.py"}}, "db/admin_lockouts.py:list_active_admin_account_lockouts": {"path": "db/admin_lockouts.py", "start": 104, "end": 114, "lang": "python", "code": "def list_active_admin_account_lockouts() -> list[dict]:\n    \"\"\"지금 잠겨 있는(active=True) 관리자 아이디 목록(대시보드 표시용).\"\"\"\n    res = (\n        db.get_client()\n        .table(\"admin_account_lockouts\")\n        .select(\"*\")\n        .eq(\"active\", True)\n        .order(\"locked_at\", desc=True)\n        .execute()\n    )\n    return res.data", "alias": {"call": "db.list_active_admin_account_lockouts()", "via": "db/__init__.py", "real": "db/admin_lockouts.py"}}, "db/access_requests.py:list_pending_requests": {"path": "db/access_requests.py", "start": 118, "end": 134, "lang": "python", "code": "def list_pending_requests(page: int = 1, page_size: int = 20) -> tuple[list[dict], int]:\n    \"\"\"대시보드 \"AI 조기 경보\" 표에 보여줄 PENDING 요청을 최신순으로 가져온다.\n\n    db.list_security_events() 등과 동일한 페이지네이션 방식이다.\n    \"\"\"\n    start = (page - 1) * page_size\n    end = start + page_size - 1\n    res = (\n        db.get_client()\n        .table(\"access_requests\")\n        .select(\"*\", count=\"exact\")\n        .eq(\"status\", \"PENDING\")\n        .order(\"requested_at\", desc=True)\n        .range(start, end)\n        .execute()\n    )\n    return res.data, res.count or 0", "alias": {"call": "db.list_pending_requests()", "via": "db/__init__.py", "real": "db/access_requests.py"}}, "db/stats.py:get_threat_stats": {"path": "db/stats.py", "start": 437, "end": 451, "lang": "python", "code": "def get_threat_stats(active_locks: int, pending_ai: int) -> dict:\n    \"\"\"관리자 화면이 부르는 진입점: 원본을 가져와 계산하고, 상위 IP의 나라 정보를 붙인다.\n\n    config.ADMIN_STATS_CACHE_SECONDS 안에 같은 요청이 또 오면 계산해 둔 값을 돌려준다. 락을 잡은 채로\n    계산하므로, 동시에 들어온 다른 탭은 기다렸다가 같은 결과를 받는다(DB를 N번 두드리지 않는다).\n    \"\"\"\n    ttl = config.ADMIN_STATS_CACHE_SECONDS\n    if ttl <= 0:\n        return _compute(active_locks, pending_ai)\n    key = (active_locks, pending_ai)\n    with _cache_lock:\n        fresh = _cache[\"at\"] is not None and time.monotonic() - _cache[\"at\"] < ttl and _cache[\"key\"] == key\n        if not fresh:\n            _cache.update(value=_compute(active_locks, pending_ai), key=key, at=time.monotonic())\n        return _cache[\"value\"]", "alias": null}, "db/stats.py:build_locks": {"path": "db/stats.py", "start": 56, "end": 72, "lang": "python", "code": "def build_locks(ip_locks: list[dict], account_locks: list[dict], admin_locks: list[dict]) -> dict:\n    \"\"\"지금 잠긴 IP·회원 계정·관리자 계정을 영구 잠금과 함께 한 목록으로 합친다(영구가 먼저, 그다음 최근순).\"\"\"\n    rows = []\n    for kind, source, key in ((\"ip\", ip_locks, \"ip_address\"), (\"account\", account_locks, \"username\"), (\"admin\", admin_locks, \"username\")):\n        for row in source:\n            rows.append(\n                {\n                    \"kind\": kind,\n                    \"target\": row.get(key),\n                    \"permanent\": row.get(\"lock_type\") == \"PERMANENT\",\n                    \"locked_at\": row.get(\"locked_at\"),\n                    \"unlock_at\": row.get(\"unlock_at\"),\n                }\n            )\n    rows.sort(key=lambda r: r[\"locked_at\"] or \"\", reverse=True)\n    rows.sort(key=lambda r: not r[\"permanent\"])  # 안정 정렬이라 영구끼리·임시끼리는 최근순이 유지된다\n    return {\"locks\": rows[:LOCK_LIMIT], \"locks_total\": len(rows), \"locks_permanent\": sum(1 for r in rows if r[\"permanent\"])}", "alias": null}, "db/stats.py:fetch_raw": {"path": "db/stats.py", "start": 131, "end": 170, "lang": "python", "code": "def fetch_raw(now: datetime | None = None) -> dict:\n    \"\"\"대시보드 집계에 필요한 원본 줄을 동시에 가져온다.\"\"\"\n    now = (now or datetime.now(KST)).astimezone(KST)\n    today_start = now.replace(hour=0, minute=0, second=0, microsecond=0)\n    week_ago_start = today_start - timedelta(days=RECENT_DAYS)  # 지난주 같은 요일 포함\n    events_since = today_start - timedelta(days=EVENT_WINDOW_DAYS)\n\n    jobs = {\n        \"events\": lambda: _fetch_rows(\n            \"security_events\",\n            \"id,event_type,severity,ip_address,path,count,action,username,detected_at,resolved_at\",\n            \"detected_at\",\n            events_since,\n        ),\n        \"failed_logins\": lambda: _fetch_rows(\n            \"login_attempts\", \"attempted_at\", \"attempted_at\", week_ago_start, success=False\n        ),\n        \"not_found\": lambda: _fetch_rows(\"not_found_attempts\", \"attempted_at\", \"attempted_at\", week_ago_start),\n        \"unauthorized\": lambda: _fetch_rows(\n            \"unauthorized_attempts\", \"attempted_at\", \"attempted_at\", week_ago_start\n        ),\n        \"incidents\": lambda: _fetch_rows(\n            \"security_incidents\",\n            \"id,ip_address,event_types,severity_max,status,first_event_at,last_event_at,resolved_by\",\n            \"last_event_at\",\n            events_since,\n        ),\n        \"summary\": lambda: _summary_rows((today_start - timedelta(days=RECENT_DAYS - 1)).date()),\n    }\n    for source in LOG_SOURCES:\n        column = _LOG_TIME_COLUMN.get(source, \"attempted_at\")\n        jobs[f\"today:{source}\"] = lambda s=source, c=column: _count_since(s, c, today_start)\n\n    with ThreadPoolExecutor(max_workers=len(jobs)) as executor:\n        futures = {name: executor.submit(job) for name, job in jobs.items()}\n        raw = {name: future.result() for name, future in futures.items()}\n\n    raw[\"today_counts\"] = {source: raw.pop(f\"today:{source}\") for source in LOG_SOURCES}\n    raw[\"now\"] = now\n    return raw", "alias": null}, "db/stats.py:_fetch_rows": {"path": "db/stats.py", "start": 81, "end": 101, "lang": "python", "code": "def _fetch_rows(table: str, columns: str, time_column: str, since: datetime, **filters) -> list[dict]:\n    \"\"\"`since` 이후의 줄을 최신순으로 페이지 단위로 모아 온다(최대 _MAX_ROWS줄).\"\"\"\n    rows: list[dict] = []\n    start = 0\n    while start < _MAX_ROWS:\n        query = (\n            db.get_client()\n            .table(table)\n            .select(columns)\n            .gte(time_column, since.isoformat())\n            .order(time_column, desc=True)\n            .range(start, start + _PAGE - 1)\n        )\n        for column, value in filters.items():\n            query = query.eq(column, value)\n        page = query.execute().data\n        rows.extend(page)\n        if len(page) < _PAGE:\n            break\n        start += _PAGE\n    return rows", "alias": null}, "db/stats.py:build_threat_stats": {"path": "db/stats.py", "start": 196, "end": 422, "lang": "python", "code": "def build_threat_stats(raw: dict, *, active_locks: int, pending_ai: int, locations: dict[str, dict]) -> dict:\n    \"\"\"원본 줄 → 화면용 숫자. `locations`는 {IP: {\"country\": ...}} (ip_locations 캐시).\"\"\"\n    now: datetime = raw[\"now\"]\n    today = now.date()\n    days = _day_labels(today)\n    day_set = set(days)\n\n    events = []\n    for row in raw[\"events\"]:\n        detected = _parse(row[\"detected_at\"])\n        if detected is not None:\n            events.append({**row, \"_t\": detected, \"_d\": detected.date()})\n    recent_events = [e for e in events if e[\"_d\"] in day_set]\n\n    # 1) 시간대별 탐지량 — 보안 이벤트 + 로그인 실패 + 404 + 미인증 접근을 한 줄로 합친다.\n    detection_times = [e[\"_t\"] for e in events if e[\"_d\"] >= today - timedelta(days=RECENT_DAYS)]\n    for key in (\"failed_logins\", \"not_found\", \"unauthorized\"):\n        detection_times += [t for t in (_parse(r[\"attempted_at\"]) for r in raw[key]) if t is not None]\n    hourly = {\n        \"today\": _hourly(detection_times, today, now.hour),\n        \"yesterday\": _hourly(detection_times, today - timedelta(days=1), None),\n        \"last_week\": _hourly(detection_times, today - timedelta(days=RECENT_DAYS), None),\n    }\n\n    # 2) 최근 7일 로그 발생량 — 지난 날은 일별 요약표, 오늘은 원본 표 개수.\n    summary_by_day: dict[str, int] = defaultdict(int)\n    for row in raw[\"summary\"]:\n        summary_by_day[row[\"day\"]] += row[\"count\"]\n    log_volume = [\n        {\n            \"day\": d.isoformat(),\n            \"count\": sum(raw[\"today_counts\"].values()) if d == today else summary_by_day.get(d.isoformat(), 0),\n            \"live\": d == today,\n        }\n        for d in days\n    ]\n\n    # 3) 공격자 IP × 날짜 히트맵 — 7일간 이벤트가 많은 IP 상위 8개.\n    per_ip: Counter = Counter(e[\"ip_address\"] for e in recent_events)\n    heat_ips = [ip for ip, _ in per_ip.most_common(8)]\n    per_ip_day: Counter = Counter((e[\"ip_address\"], e[\"_d\"]) for e in recent_events)\n    heatmap = {\n        \"days\": [d.isoformat() for d in days],\n        \"ips\": heat_ips,\n        \"cells\": [[per_ip_day.get((ip, d), 0) for d in days] for ip in heat_ips],\n    }\n\n    # 4) 흐름도: IP → 공격 유형 → 조치 (상위 IP 6개만, 나머지는 '그 외')\n    flow_ips = [ip for ip, _ in per_ip.most_common(6)]\n    flow_links: Counter = Counter()\n    for e in recent_events:\n        ip = e[\"ip_address\"] if e[\"ip_address\"] in flow_ips else \"(그 외)\"\n        flow_links[(ip, e[\"event_type\"], e[\"action\"])] += 1\n    sankey_links = []\n    for (ip, event_type, action), n in flow_links.items():\n        sankey_links.append({\"source\": ip, \"target\": event_type, \"value\": n})\n    action_links: Counter = Counter()\n    for (ip, event_type, action), n in flow_links.items():\n        action_links[(event_type, action)] += n\n    sankey_links += [{\"source\": t, \"target\": f\"조치:{a}\", \"value\": n} for (t, a), n in action_links.items()]\n\n    # 5) 신규 공격자 / 반복 공격자 / 미처리 / 복합 공격\n    first_seen: dict[str, date] = {}\n    days_seen: dict[str, set] = defaultdict(set)\n    last_seen: dict[str, datetime] = {}\n    types_by_ip: dict[str, set] = defaultdict(set)\n    count_by_ip: Counter = Counter()\n    for e in events:\n        ip = e[\"ip_address\"]\n        first_seen[ip] = min(first_seen.get(ip, e[\"_d\"]), e[\"_d\"])\n        days_seen[ip].add(e[\"_d\"])\n        last_seen[ip] = max(last_seen.get(ip, e[\"_t\"]), e[\"_t\"])\n        types_by_ip[ip].add(e[\"event_type\"])\n        if e[\"_d\"] in day_set:\n            count_by_ip[ip] += 1\n\n    new_cutoff = today - timedelta(days=RECENT_DAYS - 1)\n    new_attackers = sorted(\n        (ip for ip, d in first_seen.items() if d >= new_cutoff and count_by_ip[ip] > 0),\n        key=lambda ip: last_seen[ip],\n        reverse=True,\n    )\n    repeat_attackers = sorted(\n        (ip for ip in count_by_ip if len({d for d in days_seen[ip] if d in day_set}) >= 3),\n        key=lambda ip: count_by_ip[ip],\n        reverse=True,\n    )\n\n    def _ip_row(ip: str, **extra) -> dict:\n        return {\n            \"ip\": ip,\n            \"country\": (locations.get(ip) or {}).get(\"country\"),\n            \"count\": count_by_ip[ip],\n            \"types\": sorted(types_by_ip[ip]),\n            \"last_seen\": last_seen[ip].isoformat(),\n            **extra,\n        }\n\n    unresolved = sorted(\n        (e for e in events if e[\"resolved_at\"] is None),\n        key=lambda e: (SEVERITY_ORDER.get(e[\"severity\"], 9), -e[\"_t\"].timestamp()),\n    )\n    compound = [\n        {\n            \"ip\": i[\"ip_address\"],\n            \"types\": i[\"event_types\"],\n            \"type_count\": len(i[\"event_types\"]),\n            \"severity\": i[\"severity_max\"],\n            \"status\": i[\"status\"],\n            \"last_event_at\": i[\"last_event_at\"],\n            \"country\": (locations.get(i[\"ip_address\"]) or {}).get(\"country\"),\n        }\n        for i in raw[\"incidents\"]\n        if len(i[\"event_types\"]) >= 3 and (_parse(i[\"last_event_at\"]) or now).date() >= new_cutoff\n    ]\n    pending_incidents = sorted(\n        (\n            i\n            for i in raw[\"incidents\"]\n            if i[\"status\"] in (\"OPEN\", \"IDLE\") or (i[\"status\"] == \"CLOSED\" and str(i.get(\"resolved_by\") or \"\").startswith(\"system\"))\n        ),\n        key=lambda i: (\n            INCIDENT_STATUS_ORDER.get(i[\"status\"], 9),\n            SEVERITY_ORDER.get(i[\"severity_max\"], 9),\n            -(_parse(i[\"last_event_at\"]) or now).timestamp(),\n        ),\n    )\n\n    # 6) 상세 모니터링: Top 5들과 나라별 흐름\n    today_events = [e for e in events if e[\"_d\"] == today]\n    yesterday_events = [e for e in events if e[\"_d\"] == today - timedelta(days=1)]\n    top_sources = _top(Counter(e[\"ip_address\"] for e in recent_events), 5)\n    top_types = _top(Counter(e[\"event_type\"] for e in recent_events), 5)\n    # 경로가 있는 이벤트만 경로별로 센다. 경로가 없는 이벤트(브루트포스·스프레이 등 계정·행위 단위 탐지)는\n    # 한 덩어리로 섞이면 도넛을 지배하므로 공격 유형별로 따로 센다.\n    top_paths = _top(Counter(e[\"path\"] for e in recent_events if e[\"path\"]), 5)\n    pathless_by_type = Counter(e[\"event_type\"] for e in recent_events if not e[\"path\"])\n    pathless_types = _top(pathless_by_type, PATHLESS_TYPE_LIMIT)\n    pathless_rest = sum(pathless_by_type.values()) - sum(item[\"count\"] for item in pathless_types)\n    if pathless_rest > 0:\n        pathless_types.append({\"name\": \"기타\", \"count\": pathless_rest})\n    severity_counts = Counter(e[\"severity\"] for e in recent_events)\n\n    country_flow: Counter = Counter()\n    for e in recent_events:\n        country = (locations.get(e[\"ip_address\"]) or {}).get(\"country\") or \"위치 미확인\"\n        country_flow[(country, e[\"event_type\"])] += 1\n    country_links = [{\"source\": c, \"target\": t, \"value\": n} for (c, t), n in country_flow.items()]\n\n    live_events = [\n        {\n            \"id\": e[\"id\"],\n            \"detected_at\": e[\"detected_at\"],\n            \"severity\": e[\"severity\"],\n            \"event_type\": e[\"event_type\"],\n            \"ip\": e[\"ip_address\"],\n            \"country\": (locations.get(e[\"ip_address\"]) or {}).get(\"country\"),\n            \"path\": e[\"path\"],\n            \"count\": e[\"count\"],\n            \"action\": e[\"action\"],\n            \"resolved\": e[\"resolved_at\"] is not None,\n        }\n        for e in sorted(events, key=lambda e: e[\"_t\"], reverse=True)[:30]\n    ]\n\n    failed_today = sum(\n        1 for t in (_parse(r[\"attempted_at\"]) for r in raw[\"failed_logins\"]) if t is not None and t.date() == today\n    )\n\n    return {\n        \"generated_at\": now.isoformat(),\n        \"kpi\": {\n            \"events_today\": len(today_events),\n            \"events_yesterday\": len(yesterday_events),\n            \"failed_logins_today\": failed_today,\n            \"blocked_today\": sum(1 for e in today_events if any(k in (e[\"action\"] or \"\").upper() for k in (\"LOCK\", \"REJECT\"))),\n            \"active_locks\": active_locks,\n            \"pending_ai\": pending_ai,\n            \"unresolved_critical\": sum(1 for e in unresolved if e[\"severity\"] == \"CRITICAL\"),\n            \"unresolved_total\": len(unresolved),\n            \"severity_7d\": {k: severity_counts.get(k, 0) for k in (\"CRITICAL\", \"HIGH\", \"MEDIUM\")},\n        },\n        \"hourly\": hourly,\n        \"log_volume\": log_volume,\n        \"summary_available\": bool(raw[\"summary\"]),\n        \"heatmap\": heatmap,\n        \"flow\": {\"links\": sankey_links},\n        \"new_attackers\": [_ip_row(ip) for ip in new_attackers[:6]],\n        \"repeat_attackers\": [\n            _ip_row(ip, days=len({d for d in days_seen[ip] if d in day_set})) for ip in repeat_attackers[:6]\n        ],\n        \"unresolved\": [\n            {\n                \"id\": e[\"id\"],\n                \"severity\": e[\"severity\"],\n                \"event_type\": e[\"event_type\"],\n                \"ip\": e[\"ip_address\"],\n                \"country\": (locations.get(e[\"ip_address\"]) or {}).get(\"country\"),\n                \"path\": e[\"path\"],\n                \"detected_at\": e[\"detected_at\"],\n            }\n            for e in unresolved[:8]\n        ],\n        \"compound\": compound[:6],\n        \"open_incidents\": [\n            {\n                \"id\": i[\"id\"],\n                \"ip\": i[\"ip_address\"],\n                \"types\": i[\"event_types\"],\n                \"severity\": i[\"severity_max\"],\n                \"status\": i[\"status\"],\n                \"auto_closed\": i[\"status\"] == \"CLOSED\",\n                \"last_event_at\": i[\"last_event_at\"],\n            }\n            for i in pending_incidents[:OPEN_INCIDENT_LIMIT]\n        ],\n        \"open_incidents_total\": len(pending_incidents),\n        \"top_sources\": top_sources,\n        \"top_types\": top_types,\n        \"top_paths\": top_paths,\n        \"pathless_types\": pathless_types,\n        \"pathless_total\": sum(pathless_by_type.values()),\n        \"country_flow\": {\"links\": country_links},\n        \"events\": live_events,\n        # L3/L4 센서는 아직 없다 — 화면은 이 빈 목록을 \"수집 전\" 상태로 그린다.\n        \"network_layer\": [],\n    }", "alias": null}, "db/geoip_cache.py:get_cached_ip_locations": {"path": "db/geoip_cache.py", "start": 10, "end": 25, "lang": "python", "code": "def get_cached_ip_locations(ips: list[str]) -> dict[str, dict]:\n    \"\"\"IP 목록을 한꺼번에 캐시에서 찾아온다.\n\n    IP 하나마다 따로따로 물어보지 않고 .in_()으로 \"이 목록에 있는 IP들만 한\n    번에 줘\"라고 요청하는 이유: 관리자 대시보드는 5초마다 최근 로그인 시도\n    한 페이지(config.ADMIN_PAGE_SIZE, 기본 10건)를 다시 그리는데, 그 각각에 대해 캐시\n    조회를 따로 하면 Supabase 요청이 그 건수만큼 늘어난다(9단계에서 겪었던 쿼터 문제와 같은 유형의\n    실수). 딱 1번의 쿼리로 필요한 IP들을 전부 가져오면 이 문제를 피할 수 있다.\n\n    반환값은 {\"1.2.3.4\": {...캐시된 행...}, ...} 형태의 딕셔너리다 — \"이 IP는\n    캐시에 있는가?\"를 코드에서 바로 찾아보기 쉽게 하기 위해서다.\n    \"\"\"\n    if not ips:\n        return {}\n    res = db.get_client().table(\"ip_locations\").select(\"*\").in_(\"ip_address\", ips).execute()\n    return {row[\"ip_address\"]: row for row in res.data}", "alias": {"call": "db.get_cached_ip_locations()", "via": "db/__init__.py", "real": "db/geoip_cache.py"}}}, "files": {"helpers/spa.py": {"role": "Next.js 정적 화면과 기존 Flask 라우트를 이어주는 얇은 어댑터. 화면 껍데기를 내려주고, 라우트 결과를 JSON 봉투로 바꾼다.", "header": "helpers/spa.py — Next.js 정적 화면(web/)과 기존 Flask 라우트를 이어주는 어댑터\n배경: 화면을 Jinja 템플릿에서 Next.js로 옮기면서, 로그인·잠금·요청 한도·타이밍 방어 같은\n보안 로직이 들어 있는 기존 라우트(routes/*)를 다시 쓰지 않으려고 만든 얇은 층이다.\n두 가지 일을 한다.\n1) 화면(HTML) 요청 — 브라우저가 주소를 직접 열면(GET, 어댑터 헤더 없음) Next가 만든 정적\nHTML을 그대로 내려준다. 이 요청은 \"껍데기\"일 뿐이라 DB 조회·잠금 판정을 하지 않고,\n반복 접근 관찰 훅(helpers/hooks.py)에도 잡히지 않는다. 껍데기가 뜬 뒤 화면이\n같은 주소를 어댑터 헤더와 함께 다시 요청하고, 그때 기존 라우트가 평소처럼(로그인 확인,\n권한 확인, 요청 기록 포함) 실행된다.\n2) 데이터 요청 — 어댑터 헤더(X-Requested-With: login-watchdog-spa)가 붙은 요청은 기존 라우트가\n만든 응답을 JSON으로 바꿔서 돌려준다.\n- render_template(...)  → {\"page\": 템플릿 이름, \"data\": 템플릿에 넘긴 값, \"messages\": [...]}\n- redirect(...)         → {\"redirect\": \"/경로\", \"messages\": [...]}\n- flash(...)            → \"messages\"에 담긴다\n- 그 외 오류 응답(429 등) → {\"messages\": [...], \"status\": 코드}\n- JSON 응답(/api/*)은 손대지 않는다\n모든 어댑터 응답에는 CSRF 토큰(\"csrf\")이 들어 있어서 화면이 다음 POST에 쓴다.\n이 헤더는 다른 사이트가 보낼 수 없다(브라우저가 사전 검사 없이는 교차 출처 요청에\n임의 헤더를 붙이지 못한다) — CSRF 토큰 검사와는 별개의 보조 방어선이다.\n3) 404 화면 — 존재하지 않는 주소를 브라우저가 열면 not_found_page()가 spa/404.html을 404 상태로 내려준다\n(helpers/hooks.py의 handle_not_found가 기록·탐지를 끝낸 뒤 부른다).\nweb/out(Next 정적 빌드)이 없으면 아무것도 바꾸지 않는다 → 예전 Jinja 화면 그대로 동작한다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/helpers/spa.py"}, "web/src/lib/api.ts": {"role": "화면(브라우저) 쪽에서 Flask 와 대화하는 얇은 클라이언트. 어댑터 헤더를 붙여 기존 라우트를 JSON 으로 부른다.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/web/src/lib/api.ts"}, "routes/admin/status.py": {"role": "관리자 화면 라우트와 /api/stats(집계) 입구 파일.", "header": "routes/admin/status.py — 관리자 대시보드 화면(/admin/dashboard)과 대시보드 폴링 API(/api/status)\n예전 routes/admin.py(798줄)를 기능 묶음별로 나눈 조각 중 하나다. Blueprint(admin_bp)는\nroutes/admin/__init__.py에서 하나만 만들고, 이 파일은 거기에 라우트를 붙이기만 한다\n— 그래서 엔드포인트 이름(url_for(\"admin.xxx\"))은 나누기 전과 똑같다.\n배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/admin/status.py"}, "db/lockouts.py": {"role": "db/lockouts.py — lockouts 표 관련 함수 — \"지금 어떤 IP가 잠겨있고, 언제 풀리는지\"라는 \"현재 상태\"를 관리하는 기능 (login_attempts가 \"지나간 일의 기록\"이라면, lockouts는 \"지금 이 순간의 상태판\") db.get_client()/db._", "header": "db/lockouts.py — lockouts 표 관련 함수\n— \"지금 어떤 IP가 잠겨있고, 언제 풀리는지\"라는 \"현재 상태\"를 관리하는 기능\n(login_attempts가 \"지나간 일의 기록\"이라면, lockouts는 \"지금 이 순간의 상태판\")\ndb.get_client()/db._now_iso()를 통해 호출하는 이유는 db/attempts.py 상단\n설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/lockouts.py"}, "db/account_lockouts.py": {"role": "db/account_lockouts.py — account_lockouts 표 관련 함수 — \"지금 어떤 계정(아이디)이 잠겨있고, 언제 풀리는지\"라는 \"현재 상태\"를 관리한다. db/lockouts.py(IP 단위 잠금)와 짝을 이루는 계정 단위 잠금이다 — 공격자가 여러 IP로 나눠", "header": "db/account_lockouts.py — account_lockouts 표 관련 함수\n— \"지금 어떤 계정(아이디)이 잠겨있고, 언제 풀리는지\"라는 \"현재 상태\"를 관리한다.\ndb/lockouts.py(IP 단위 잠금)와 짝을 이루는 계정 단위 잠금이다 — 공격자가 여러\nIP로 나눠서(또는 느린 속도로) 같은 계정만 노리면 IP당 실패 횟수는 임계값을\n넘지 않아 lockouts로는 못 잡는다. 이 표는 IP와 무관하게 \"이 계정이 총 몇 번\n실패했는가\"를 기준으로 잠근다 (L7 공격 보강 계획 Tier 1).\ndb.get_client()를 통해 호출하는 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/account_lockouts.py"}, "db/admin_lockouts.py": {"role": "db/admin_lockouts.py — admin_account_lockouts 표 + 관리자 계정 단위 실패 집계 (guide38) db/account_lockouts.py(회원 계정 잠금)의 관리자 버전이다. 회원 표를 같이 쓰지 않는 이유: account_lockouts는 use", "header": "db/admin_lockouts.py — admin_account_lockouts 표 + 관리자 계정 단위 실패 집계 (guide38)\ndb/account_lockouts.py(회원 계정 잠금)의 관리자 버전이다. 회원 표를 같이 쓰지 않는 이유:\naccount_lockouts는 username이 기본키라 회원 \"alice\"와 관리자 \"alice\"가 같은 줄을 쓰게\n되고(관리자가 공격당하면 같은 이름의 회원까지 잠김), 회원 잠금에는 이메일 복구·보호관찰·\n영구 승격 흐름이 얽혀 있어서 관리자에게는 맞지 않는다. 관리자 계정 잠금은 항상 임시\n잠금뿐이라 표 구조도 처음 account_lockouts와 같은 단순한 형태다.\n실패 횟수는 admin_login_log에서 IP와 무관하게 \"이 아이디가 몇 번 실패했는가\"를 센다\n(db.count_recent_failures_by_username()의 관리자 버전). 아이디가 실제로 있든 없든 똑같이\n세고 똑같이 잠근다 — 그래야 \"잠겼다\"는 응답으로 관리자 아이디 존재 여부가 드러나지 않는다.\ndb.get_client()를 통해 호출하는 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/admin_lockouts.py"}, "db/access_requests.py": {"role": "db/access_requests.py — access_requests 표 관련 함수 (Track A, guide31) security_incidents가 \"여러 이벤트를 하나의 사건으로 묶는\" 표라면, 이 표는 \"규칙이 아직 발동하지 않은 임계값 코앞 구간에서 LLM이 위험하다고 판단", "header": "db/access_requests.py — access_requests 표 관련 함수 (Track A, guide31)\nsecurity_incidents가 \"여러 이벤트를 하나의 사건으로 묶는\" 표라면, 이 표는\n\"규칙이 아직 발동하지 않은 임계값 코앞 구간에서 LLM이 위험하다고 판단한\n건들을 관리자 승인 대기 목록으로 쌓아두는\" 표다. soar.consider_early_warning()이\n판단(위험한가?) 결과를 여기 등록하고, 실제 승인/반려 실행은 security/soar/의\nexecute_approved_request()/reject_pending_request()가 이 파일의 함수를\n통해서만 상태를 바꾼다 (security/detector.py·security/soar/와 동일한 판단·실행 분리 원칙).\nguide33 이후로는 LLM 판단이 아닌 항목도 하나 들어온다 — SIEM 상관분석 사건이 HIGH에\n도달했을 때의 영구 잠금 후보(SIEM_HIGH_INCIDENT, security/lockdown.py의\nconsider_incident_promotion 참고)도 같은 승인 대기 목록에 쌓인다.\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/access_requests.py"}, "db/stats.py": {"role": "대시보드 차트·히트맵 숫자를 기존 표에서 계산한다(새 표 없음). 계산부는 DB 없이 테스트할 수 있다.", "header": "db/stats.py — 관제 대시보드(차트·히트맵·흐름도)용 집계\n관리자 대시보드의 화면 A(위협 현황)·B(공격 상세)가 쓰는 숫자를 한 번에 계산한다.\n표에서 원본 줄을 가져와 파이썬에서 묶는다 — 이 프로젝트의 로그는 하루 수천 줄 규모라\n별도 집계 쿼리·뷰를 DB에 새로 만들 필요가 없고, 새 마이그레이션 없이 배포할 수 있다.\n구조는 둘로 나눴다.\nfetch_raw()           — Supabase에서 원본 줄을 가져온다(여러 쿼리를 동시에).\nbuild_threat_stats()  — 가져온 줄로 화면용 숫자를 계산한다. DB 없이 테스트할 수 있는 순수 함수.\n시각은 전부 한국 시간(KST, UTC+9)으로 묶는다 — 관제 화면의 \"오늘\"은 한국 날짜 기준이고,\n일별 요약표(log_daily_summary)도 같은 기준으로 만들어진다. 한국은 서머타임이 없어 고정 오프셋이다.\nL3/L4(네트워크·전송 계층) 공격은 아직 수집하지 않는다 — README \"알려진 제한사항\" 참고.\n그래서 응답의 network_layer는 항상 빈 목록이고, 화면은 이를 \"데이터 없음\" 상태로 그린다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/stats.py"}, "db/geoip_cache.py": {"role": "db/geoip_cache.py — ip_locations 표 관련 함수 — IP 위치 조회 결과 캐시 (13단계) db.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "header": "db/geoip_cache.py — ip_locations 표 관련 함수 — IP 위치 조회 결과 캐시 (13단계)\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/geoip_cache.py"}}}</script>
<script>
(function(){
  "use strict";

  var KIND_LABEL = {screen:"화면 · 도착지", route:"routes", helper:"판단", db:"db", config:"설정값", later:"다른 단원"};

  var state = { sc: 0, node: null, item: 0, file: null };

    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function brk(t){ return t.replace(/([\/._])/g, "$1\u200b"); }
  function scen(){ return D.scenarios[state.sc]; }
  function nodeById(id){ return scen().nodes.filter(function(n){ return n.id === id; })[0]; }
  function fnName(label){ return label; }

  /* ---------- 간단 문법 강조 ---------- */
  var PY = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?''')|([rbfRBF]{0,2}"(?:\\.|[^"\\\n])*"|[rbfRBF]{0,2}'(?:\\.|[^'\\\n])*')|\b(def|class|return|if|elif|else|for|while|import|from|as|try|except|finally|with|in|not|and|or|is|None|True|False|raise|pass|lambda|yield|global|nonlocal|assert|del|continue|break)\b|(@[A-Za-z_][\w.]*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(?=\()/g;
  var PYC = [null,"t-c","t-d","t-s","t-k","t-a","t-n","t-f"];
  var HT = /(<!--[\s\S]*?-->)|(\{[{%#][\s\S]*?[}%#]\})|(<\/?[A-Za-z][\w-]*)|("[^"\n]*")|(\/?>)/g;
  var HTC = [null,"t-c","t-a","t-k","t-s","t-k"];
  var JS = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\.|[^`\\])*`)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(const|let|var|function|return|if|else|for|while|import|from|export|default|async|await|try|catch|finally|new|class|extends|typeof|interface|type|null|undefined|true|false|throw|switch|case|break|continue|of|in|as)\b|(@[A-Za-z_]\w*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_$][\w$]*)(?=\()/g;
  var JSC = [null,"t-c","t-s","t-s","t-k","t-a","t-n","t-f"];
  var SQ = /(--[^\n]*|\/\*[\s\S]*?\*\/)|((?!))|('(?:''|[^'])*')|\b(select|from|where|insert|into|values|update|set|delete|create|table|index|alter|add|drop|on|conflict|do|nothing|and|or|not|null|default|primary|key|references|cascade|if|exists|as|order|by|group|limit|desc|asc|join|left|inner|count|returns|function|language|begin|end|return|with|union|all|distinct|in|is|true|false|unique|check|constraint|timestamptz|text|integer|bigint|boolean|interval|now|replace|trigger|view|policy|enable|row|level|security|using)\b|((?!))|\b(\d+(?:\.\d+)?)\b|\b([a-z_]\w*)(?=\()/gi;
  var SQC = [null,"t-c",null,"t-s","t-k",null,"t-n","t-f"];
  var SH = /(#[^\n]*)|((?!))|("(?:\\.|[^"\\\n])*"|'[^'\n]*')|\b(if|then|else|fi|for|do|done|while|case|esac|function|echo|export|python|pip|git|cd|run|name|on|jobs|steps|uses|with|env)\b|((?!))|\b(\d+)\b/g;
  var SHC = [null,"t-c",null,"t-s","t-k",null,"t-n"];
  function tokenize(code, lang){
    var re = PY, cls = PYC;
    if (lang === "html"){ re = HT; cls = HTC; }
    else if (lang === "js"){ re = JS; cls = JSC; }
    else if (lang === "sql"){ re = SQ; cls = SQC; }
    else if (lang === "sh"){ re = SH; cls = SHC; }
    var lines = [[]];
    function push(text, c){
      var parts = text.split("\n");
      parts.forEach(function(p, i){
        if (i > 0) lines.push([]);
        if (p) lines[lines.length-1].push([p, c]);
      });
    }
    var last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(code)) !== null){
      if (m.index > last) push(code.slice(last, m.index), null);
      var idx = 1; while (idx < m.length && m[idx] === undefined) idx++;
      push(m[0], cls[idx] || null);
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++;
    }
    if (last < code.length) push(code.slice(last), null);
    return lines;
  }

  function codeTable(block, hl){
    var lines = tokenize(block.code, block.lang);
    var tbody = el("tbody");
    var hlFirst = null;
    lines.forEach(function(segs, i){
      var no = block.start + i;
      var on = hl && no >= hl[0] && no <= hl[1];
      var td = el("td", {class:"tx"});
      segs.forEach(function(s){ td.appendChild(s[1] ? el("span", {class:s[1], text:s[0]}) : document.createTextNode(s[0])); });
      if (!segs.length) td.appendChild(document.createTextNode(" "));
      var tr = el("tr", on ? {class:"hl"} : null, [el("td", {class:"ln", text:String(no)}), td]);
      if (on && !hlFirst) hlFirst = tr;
      tbody.appendChild(tr);
    });
    var box = el("div", {class:"codebox"}, [el("table", {class:"code"}, [tbody])]);
    box._hlFirst = hlFirst;
    return box;
  }

  function copyText(text, btn){
    var done = function(){ var o = btn.textContent; btn.textContent = "복사됨 ✓"; setTimeout(function(){ btn.textContent = o; }, 1200); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
    function fallback(){
      var ta = el("textarea", {style:"position:fixed;opacity:0"}); ta.value = text; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); done(); } catch(e){} document.body.removeChild(ta);
    }
  }

  /* ---------- 패널 ---------- */
  function openPanel(){ document.body.classList.add("open"); }
  function closePanel(){ document.body.classList.remove("open"); }

  function showHint(){
    $("pTitle").textContent = "코드 보는 법";
    $("pSub").textContent = "카드나 파일 이름을 누르면 실제 코드가 여기에 열립니다.";
    var ul = el("ul", {class:"hint"}, [
      el("li", {text:"카드(상자)를 누르면 그 단계에서 실행되는 실제 함수 코드가 열려요."}),
      el("li", {text:"카드 안의 📄 파일 이름을 누르면 그 파일이 어떤 역할인지, 이 단원에서 쓰이는 함수가 무엇인지 보여줘요."}),
      el("li", {text:"ƒ 함수 이름을 누르면 해당 함수 코드로 바로 이동해요."}),
      el("li", {text:"노란색 줄이 지금 단계가 담당하는 부분이에요."}),
      el("li", {text:"db.함수() 처럼 적혀 있어도 실제 코드는 db/users.py 같은 다른 파일에 있어요. 카드에 그 '진짜 파일'을 표시하고, 코드 위에 찾아가는 길도 그려줘요."}),
      el("li", {text:"위쪽 ◀ ▶ 버튼으로 실행 순서대로 한 단계씩 따라갈 수 있어요."})
    ]);
    var b = $("pBody"); b.textContent = ""; b.appendChild(ul);
  }

  function renderAlias(a){
    if (!a) return null;
    return el("div", {class:"alias"}, [
      el("div", {text:"코드에는 이렇게 적혀 있지만, 실제 함수는 다른 파일에 있어요."}),
      el("div", {class:"route"}, [
        el("span", {class:"step", text:a.call}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step", text:a.via + " (창구)"}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step real", text:a.real})
      ])
    ]);
  }

  function selectNode(id, itemIdx){
    var n = nodeById(id); if (!n) return;
    state.node = id; state.item = itemIdx || 0; state.file = null;
    $("pTitle").textContent = n.title;
    $("pSub").textContent = n.plain;
    var body = $("pBody"); body.textContent = "";
    if (n.reject) body.appendChild(el("div", {class:"n-reject", text:n.reject, style:"margin:0 0 10px"}));
    if (n.items.length > 1){
      var tabs = el("div", {class:"itabs", role:"tablist"});
      n.items.forEach(function(it, i){
        tabs.appendChild(el("button", {class:"itab", role:"tab", "aria-selected":String(i === state.item), text:it.label,
          onclick:function(){ selectNode(id, i); }}));
      });
      body.appendChild(tabs);
    }
    var it = n.items[state.item];
    var block = D.blocks[it.block];
    var linesTxt = it.hl ? (it.hl[0] === it.hl[1] ? it.hl[0] + "줄" : it.hl[0] + "–" + it.hl[1] + "줄") : "";
    var fl = el("div", {class:"fileline"}, [
      el("button", {class:"chip file", onclick:function(){ selectFile(block.path); }, text:block.path}),
      el("span", {class:"lines", text: block.start + "–" + block.end + "줄 표시" + (linesTxt ? " · 노란색 " + linesTxt : "")}),
      el("span", {class:"spacer"}),
      el("button", {class:"btn", text:"복사", onclick:function(e){ copyText(block.code, e.currentTarget); }}),
      el("a", {class:"btn link", href:D.files[block.path].github + "#L" + block.start + "-L" + block.end, target:"_blank", rel:"noopener", text:"GitHub ↗"})
    ]);
    body.appendChild(fl);
    var al = renderAlias(block.alias); if (al) body.appendChild(al);
    var box = codeTable(block, it.hl);
    body.appendChild(box);
    if (it.hl) body.appendChild(el("p", {class:"legend-hl"}, [el("b", {text:"노란색"}), " = 이 카드가 담당하는 줄"]));
    refreshSelection();
    openPanel();
    if (box._hlFirst){
      var off = box._hlFirst.offsetTop - 60;
      box.scrollTop = Math.max(0, off);
    }
    updateStepper();
  }

  function selectFile(path){
    state.file = path; state.node = null;
    var f = D.files[path];
    $("pTitle").textContent = "📄 " + path;
    $("pSub").textContent = f.role;
    var body = $("pBody"); body.textContent = "";
    body.appendChild(el("div", {class:"fileline"}, [
      el("a", {class:"btn link", href:f.github, target:"_blank", rel:"noopener", text:"GitHub에서 파일 열기 ↗"})
    ]));
    body.appendChild(el("h3", {text:"이 단원에서 쓰이는 함수", style:"font-size:13.5px;margin:12px 0 0"}));
    var ul = el("ul", {class:"flist"}), seen = {};
    D.scenarios.forEach(function(sc, si){
      sc.nodes.forEach(function(n){
        n.items.forEach(function(it, ii){
          var b = D.blocks[it.block]; if (b.path !== path) return;
          var key = si + n.id + ii; if (seen[key]) return; seen[key] = 1;
          var li = el("li");
          li.appendChild(el("button", {onclick:function(){
            if (state.sc !== si) switchScenario(si);
            selectNode(n.id, ii); scrollToNode(n.id);
          }}, [
            el("span", {class:"mono", text:it.label}), el("small", {text:sc.name + " · " + n.title})
          ]));
          ul.appendChild(li);
        });
      });
    });
    body.appendChild(ul);
    if (f.header){
      var d = el("details", {class:"hdr"}, [el("summary", {text:"파일 맨 위 설명 주석 보기"}), el("pre", {text:f.header})]);
      body.appendChild(d);
    }
    refreshSelection();
    openPanel();
  }

  /* ---------- 흐름도 ---------- */
  var cols, colIndex, nodeEls = {};
  function renderStage(){
    var sc = scen();
    var used = {}; sc.nodes.forEach(function(n){ used[n.col] = 1; });
    cols = Object.keys(used).map(Number).sort(function(a,b){ return a-b; });
    colIndex = {}; cols.forEach(function(c, i){ colIndex[c] = i + 1; });
    var stage = $("stage");
    stage.textContent = "";
    stage.style.gridTemplateColumns = "repeat(" + cols.length + ", 196px)";
    nodeEls = {};

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "edges"); svg.id = "edges";
    svg.innerHTML = '<defs>' +
      '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-call" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '</defs>';
    stage.appendChild(svg);

    cols.forEach(function(c){
      stage.appendChild(el("div", {class:"colhead", style:"grid-column:" + colIndex[c] + ";grid-row:1", text:D.columns[c]}));
    });
    var cells = {};
    sc.nodes.forEach(function(n){
      var k = n.row + ":" + n.col;
      if (!cells[k]){
        cells[k] = el("div", {class:"cell", style:"grid-column:" + colIndex[n.col] + ";grid-row:" + (n.row + 2)});
        stage.appendChild(cells[k]);
      }
      var node = buildNode(n);
      nodeEls[n.id] = node;
      cells[k].appendChild(node);
    });
    $("intro").textContent = sc.intro;
    scheduleEdges();
  }

  function buildNode(n){
    var node = el("div", {class:"node " + n.kind, role:"button", tabindex:"0", "aria-pressed":"false", "data-id":n.id,
      onclick:function(e){ if (e.target.closest(".chip")) return; selectNode(n.id, 0); },
      onkeydown:function(e){ if ((e.key === "Enter" || e.key === " ") && !e.target.closest(".chip")){ e.preventDefault(); selectNode(n.id, 0); } }});
    var title = el("div", {class:"n-title", text:n.title});
    if (n.later) title.appendChild(el("span", {class:"tag-later", text:n.later + "에서 자세히"}));
    node.appendChild(title);
    if (n.kind !== "later" && n.plain) node.appendChild(el("div", {class:"n-plain", text:n.plain}));
    if (n.reject) node.appendChild(el("div", {class:"n-reject", text:n.reject}));
    var items = el("div", {class:"n-items"});
    // 같은 파일에 있는 함수는 파일 칩 하나 아래에 함수 칩을 나란히 놓는다
    var groups = [];
    n.items.forEach(function(it, i){
      var b = D.blocks[it.block], g = groups[groups.length - 1];
      if (g && g.path === b.path) g.list.push({it: it, i: i}); else groups.push({path: b.path, list: [{it: it, i: i}]});
    });
    groups.forEach(function(g){
      var row = el("div", {class:"n-item"});
      if (g.list.length === 1 && g.list[0].it.call) row.appendChild(el("div", {class:"n-call", text:brk(g.list[0].it.call)}));
      var chips = el("div", {class:"chips"}, [
        el("button", {class:"chip file", text:brk(g.path), title:"파일 설명 보기", onclick:function(){ selectFile(g.path); }})
      ]);
      g.list.forEach(function(x){
        chips.appendChild(el("button", {class:"chip " + (x.it.snippet ? "snip" : "fn"), text:x.it.label, title:(x.it.call ? x.it.call + " — " : "") + "코드 보기",
          onclick:function(){ selectNode(n.id, x.i); }}));
      });
      row.appendChild(chips);
      items.appendChild(row);
    });
    node.appendChild(items);
    return node;
  }

  function rectIn(elm, host){
    var a = elm.getBoundingClientRect(), h = host.getBoundingClientRect();
    return {l:a.left-h.left, r:a.right-h.left, t:a.top-h.top, b:a.bottom-h.top, cx:(a.left+a.right)/2-h.left, cy:(a.top+a.bottom)/2-h.top};
  }
  var raf = 0;
  function scheduleEdges(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(drawEdges); }
  function drawEdges(){
    var stage = $("stage"), svg = $("edges"), sc = scen();
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){ p.remove(); });
    Array.prototype.slice.call(stage.querySelectorAll(".elabel")).forEach(function(p){ p.remove(); });
    var svgNS = "http://www.w3.org/2000/svg";
    sc.edges.forEach(function(e){
      var a = nodeById(e.from), b = nodeById(e.to);
      var ea = nodeEls[e.from], eb = nodeEls[e.to]; if (!ea || !eb) return;
      var ra = rectIn(ea, stage), rb = rectIn(eb, stage), d, lx, ly;
      if (a.col === b.col){
        if (b.row - a.row <= 1){
          d = "M" + ra.cx + " " + ra.b + " V" + rb.t; lx = ra.cx; ly = (ra.b + rb.t) / 2;
        } else {
          var x = Math.min(ra.l, rb.l) - 30;
          d = "M" + ra.l + " " + ra.cy + " H" + x + " V" + rb.cy + " H" + rb.l; lx = x; ly = (ra.cy + rb.cy) / 2;
        }
      } else {
        var dir = b.col > a.col ? 1 : -1;
        var x1 = dir > 0 ? ra.r : ra.l, x2 = dir > 0 ? rb.l : rb.r;
        var xm = x2 - dir * 30;
        d = "M" + x1 + " " + ra.cy + " H" + xm + " V" + rb.cy + " H" + x2;
        lx = (x1 + x2) / 2; ly = ra.cy;
      }
      var kind = e.kind === "call" ? "call" : "flow";
      var p = document.createElementNS(svgNS, "path");
      p.setAttribute("d", d); p.setAttribute("class", "e " + kind);
      p.setAttribute("marker-end", "url(#" + (kind === "call" ? "ahc" : "ah") + ")");
      p.setAttribute("data-from", e.from); p.setAttribute("data-to", e.to);
      svg.appendChild(p);
      if (e.label && kind === "flow"){
        var lab = el("span", {class:"elabel", text:e.label});
        lab.style.left = lx + "px"; lab.style.top = ly + "px";
        stage.appendChild(lab);
      }
    });
    svg.setAttribute("width", stage.scrollWidth); svg.setAttribute("height", stage.scrollHeight);
    refreshSelection();
  }

  function refreshSelection(){
    Object.keys(nodeEls).forEach(function(id){ nodeEls[id].setAttribute("aria-pressed", String(id === state.node)); });
    var svg = $("edges"); if (!svg) return;
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){
      var on = state.node && (p.getAttribute("data-from") === state.node || p.getAttribute("data-to") === state.node);
      p.classList.toggle("active", !!on);
    });
  }
  function scrollToNode(id){
    var n = nodeEls[id]; if (n && n.scrollIntoView) n.scrollIntoView({block:"center", inline:"center", behavior:"smooth"});
  }

  /* ---------- 단계 이동 / 탭 ---------- */
  function stepIndex(){ return scen().steps.indexOf(state.node); }
  function updateStepper(){
    var steps = scen().steps, i = stepIndex();
    $("stepNo").textContent = i < 0 ? "– / " + steps.length : (i + 1) + " / " + steps.length;
    $("prev").disabled = i <= 0 && state.node !== null ? true : false;
    $("next").disabled = i >= steps.length - 1;
    if (state.node === null){ $("prev").disabled = true; $("next").disabled = false; }
  }
  function go(delta){
    var steps = scen().steps, i = stepIndex();
    var j = i < 0 ? 0 : Math.max(0, Math.min(steps.length - 1, i + delta));
    selectNode(steps[j], 0); scrollToNode(steps[j]);
  }
  function renderTabs(){
    var t = $("tabs"); t.textContent = "";
    D.scenarios.forEach(function(sc, i){
      t.appendChild(el("button", {class:"tab", role:"tab", "aria-selected":String(i === state.sc), text:sc.name, onclick:function(){ switchScenario(i); }}));
    });
  }
  function switchScenario(i){
    state.sc = i; state.node = null; state.file = null;
    renderTabs(); renderStage(); showHint(); updateStepper();
    try { history.replaceState(null, "", "#" + D.scenarios[i].id); } catch(e){}
  }

  /* ---------- 시작 ---------- */
  document.title = D.title + " — 코드 흐름도";
  $("title").textContent = D.title + " · 코드 흐름도";
  $("subtitle").textContent = D.subtitle;
  $("mdlink").setAttribute("href", D.mdFile);
  $("prev").addEventListener("click", function(){ go(-1); });
  $("next").addEventListener("click", function(){ go(1); });
  $("pClose").addEventListener("click", closePanel);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closePanel(); });
  $("theme").addEventListener("click", function(){
    var r = document.documentElement, cur = r.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  });
  window.addEventListener("resize", scheduleEdges);
  if (window.ResizeObserver) new ResizeObserver(scheduleEdges).observe($("stage"));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleEdges);

  var startId = (location.hash || "").replace("#", "");
  var startIdx = 0; D.scenarios.forEach(function(s, i){ if (s.id === startId) startIdx = i; });
  switchScenario(startIdx);
  // 화면 확인/테스트용 지름길: window.__flow.select("s7")
  window.__flow = { select: function(id, i){ selectNode(id, i || 0); }, file: selectFile, state: state };
})();
</script>
</body>
