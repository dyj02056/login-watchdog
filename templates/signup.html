<!--
  signup.html — 회원가입 화면 (감시 대상 /login에 로그인할 계정을 새로 만드는 곳)
  login_form.html과 거의 같은 구조이므로, Jinja2 템플릿 문법 설명은 login_form.html 주석 참고.
-->
<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>로그인 워치독 — 회원가입</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
    <button id="theme-toggle" type="button" class="theme-toggle theme-toggle--floating">다크 모드</button>

    <div class="auth-card">
        <h1>회원가입</h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flash-list">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <!-- signup_enabled : app.py가 db.get_signup_enabled()로 Supabase에서 읽어와
             넘겨주는 값. 관리자가 대시보드에서 회원가입을 꺼뒀으면(False), 폼 대신
             안내 문구만 보여준다 — 조건문으로 "이 조건일 때만 이 부분을 보여줘라"를
             표현한다. -->
        {% if signup_enabled %}
            <!-- 이 폼을 제출하면 /signup 주소로 POST 요청이 가고,
                 app.py의 signup_submit() 함수가 아이디/이메일 중복 확인 후 계정을 생성한다. -->
            <form method="post" action="{{ url_for('signup_submit') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" required>

                <label for="email">이메일</label>
                <input type="email" id="email" name="email" required>

                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" required>

                <label for="password_confirm">비밀번호 확인</label>
                <input type="password" id="password_confirm" name="password_confirm" required>

                <button type="submit">가입하기</button>
            </form>
        {% else %}
            <p class="signup-disabled-notice">현재 관리자가 회원가입을 잠시 중단해뒀습니다. 잠시 후 다시 시도해주세요.</p>
        {% endif %}

        <div class="auth-links">
            <a href="{{ url_for('login') }}">이미 계정이 있으신가요? 로그인</a>
        </div>
    </div>
</body>
</html>
