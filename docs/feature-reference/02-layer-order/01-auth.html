<html lang="ko">
<head>

<title>1. 인증 (회원가입 / 로그인) — 코드 흐름도</title>
<style>
  :root{
    --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eaefe9; --ink:#12201c; --ink-muted:#5a6b63;
    --border:#d9e0da; --accent:#0f6f66; --accent-soft:#e2ede9; --danger:#bf3b2b; --danger-soft:#f8e6e2;
    --edge:#7b8a82; --edge-call:#8a97a0;
    --k-screen:#767f78; --k-screen-soft:#eef0ee;
    --k-route:#2f5fd6;  --k-route-soft:#e7edfb;
    --k-helper:#b56b0c; --k-helper-soft:#f7ecd9;
    --k-db:#7a4fce;     --k-db-soft:#efe8fa;
    --k-config:#0f6f66; --k-config-soft:#e2ede9;
    --k-later:#9aa39d;  --k-later-soft:#f4f6f3;
    --code-bg:#fbfcfb; --code-hl:#fff3c4; --code-hl-bar:#e0a800; --code-gutter:#8a978f;
    --c-comment:#6b7d73; --c-str:#a1470f; --c-kw:#7a3fc0; --c-fn:#1f5fd0; --c-num:#0b7a6c; --c-deco:#b0306e;
    --shadow:0 1px 2px rgba(18,32,28,.06), 0 6px 20px rgba(18,32,28,.07);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
      --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
      --edge:#6f8178; --edge-call:#5d6f67;
      --k-screen:#9aa39d; --k-screen-soft:#1a221e;
      --k-route:#7fa2f2;  --k-route-soft:#182236;
      --k-helper:#e8a94c; --k-helper-soft:#31260f;
      --k-db:#b49bee;     --k-db-soft:#241c34;
      --k-config:#4fc9b8; --k-config-soft:#17332d;
      --k-later:#6b7a72;  --k-later-soft:#111a16;
      --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
      --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
    --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
    --edge:#6f8178; --edge-call:#5d6f67;
    --k-screen:#9aa39d; --k-screen-soft:#1a221e;
    --k-route:#7fa2f2;  --k-route-soft:#182236;
    --k-helper:#e8a94c; --k-helper-soft:#31260f;
    --k-db:#b49bee;     --k-db-soft:#241c34;
    --k-config:#4fc9b8; --k-config-soft:#17332d;
    --k-later:#6b7a72;  --k-later-soft:#111a16;
    --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
    --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
  button{font:inherit;color:inherit;cursor:pointer}
  code,.mono{font-family:var(--mono)}

  .app{display:flex;height:100vh;min-height:0}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{padding:14px 20px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
  .top h1{margin:0;font-size:19px;letter-spacing:-.01em}
  .top .sub{margin:2px 0 0;color:var(--ink-muted);font-size:13px}
  .top-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
  .tabs{display:flex;gap:6px}
  .tab{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:5px 14px;font-weight:600}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .tab[aria-selected="true"]{color:#06201b}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#06201b}}
  .spacer{flex:1}
  .btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:default}
  .stepper{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-muted)}
  .stepper b{color:var(--ink);min-width:42px;text-align:center}
  a.link{color:var(--accent);text-decoration:none;font-size:13px}
  a.link:hover{text-decoration:underline}

  .intro{margin:0;padding:10px 20px;color:var(--ink-muted);font-size:13px;border-bottom:1px solid var(--border);background:var(--surface-2)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 20px;font-size:12px;color:var(--ink-muted);border-bottom:1px solid var(--border)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .stage-wrap{flex:1;min-height:0;overflow:auto}
  .stage{position:relative;display:grid;gap:26px 46px;padding:22px 22px 60px;width:max-content;min-width:100%}
  .edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .edges path{fill:none;stroke:var(--edge);stroke-width:1.6}
  .edges path.call{stroke:var(--edge-call);stroke-dasharray:5 4}
  .edges path.active{stroke:var(--accent);stroke-width:2.4;stroke-dasharray:none}
  .edges .head{fill:var(--edge)}
  .edges .head-call{fill:var(--edge-call)}
  .elabel{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;
    background:var(--surface);border:1px solid var(--border);color:var(--ink-muted);white-space:nowrap;pointer-events:none}

  .colhead{font-size:12px;font-weight:700;color:var(--ink-muted);text-transform:none;border-bottom:2px solid var(--border);padding-bottom:6px;align-self:end}
  .cell{display:flex;flex-direction:column;gap:12px;align-self:center;justify-content:center;position:relative;z-index:1}

  .node{--k:var(--k-route);--ks:var(--k-route-soft);position:relative;background:var(--surface);border:1px solid var(--border);
    border-left:5px solid var(--k);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .08s, border-color .12s}
  .node:hover{transform:translateY(-1px);border-color:var(--k)}
  .node:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .node[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
  .node.screen{--k:var(--k-screen);--ks:var(--k-screen-soft)}
  .node.route{--k:var(--k-route);--ks:var(--k-route-soft)}
  .node.helper{--k:var(--k-helper);--ks:var(--k-helper-soft)}
  .node.db{--k:var(--k-db);--ks:var(--k-db-soft)}
  .node.config{--k:var(--k-config);--ks:var(--k-config-soft)}
  .node.later{--k:var(--k-later);--ks:var(--k-later-soft);background:var(--k-later-soft);box-shadow:none;border-style:dashed;border-left-style:solid;padding:8px 10px}
  .n-title{font-weight:700;font-size:13.5px;letter-spacing:-.01em}
  .n-plain{margin-top:3px;color:var(--ink-muted);font-size:12.5px}
  .n-reject{margin-top:6px;font-size:12px;color:var(--danger);background:var(--danger-soft);border-radius:6px;padding:3px 8px}
  .n-reject::before{content:"막히면 → ";font-weight:700}
  .n-items{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .n-item{display:flex;flex-direction:column;gap:3px}
  .n-call{overflow-wrap:anywhere;font-family:var(--mono);font-size:11.5px;color:var(--k);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{max-width:100%;text-align:left;overflow-wrap:anywhere;border:1px solid var(--border);background:var(--ks);color:var(--ink);border-radius:6px;padding:1px 7px;font-family:var(--mono);font-size:11px}
  .chip:hover{border-color:var(--k);color:var(--k)}
  .chip.file::before{content:"📄 "}
  .chip.fn::before{content:"ƒ ";color:var(--k);font-weight:700}
  .chip.snip::before{content:"▤ ";color:var(--k);font-weight:700}
  .tag-later{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--ink-muted);border:1px solid var(--border);border-radius:999px;padding:0 7px;background:var(--surface)}

  /* 코드 패널 */
  .panel{width:440px;flex:none;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
  .p-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
  .p-head h2{margin:0;font-size:15.5px;letter-spacing:-.01em}
  .p-head p{margin:4px 0 0;color:var(--ink-muted);font-size:13px}
  .p-close{display:none}
  .p-body{flex:1;min-height:0;overflow:auto;padding:12px 16px 24px}
  .hint{color:var(--ink-muted);font-size:13px}
  .hint li{margin:4px 0}
  .itabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .itab{border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:2px 9px;font-family:var(--mono);font-size:12px}
  .itab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .fileline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
  .fileline .path{font-family:var(--mono);font-size:12.5px;font-weight:700}
  .fileline .lines{font-family:var(--mono);font-size:12px;color:var(--ink-muted)}
  .alias{border:1px solid var(--border);background:var(--k-db-soft);border-radius:8px;padding:8px 10px;margin:0 0 10px;font-size:12.5px}
  .alias .route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px;font-family:var(--mono);font-size:12px}
  .alias .route span.step{padding:1px 7px;border-radius:6px;border:1px solid var(--border);background:var(--surface)}
  .alias .route span.real{border-color:var(--k-db);color:var(--k-db);font-weight:700}
  .alias .arrow{color:var(--ink-muted)}
  .codebox{border:1px solid var(--border);border-radius:8px;background:var(--code-bg);overflow:auto;max-height:62vh}
  table.code{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.2px;line-height:1.6}
  table.code td{padding:0 10px;vertical-align:top;white-space:pre}
  table.code td.ln{position:sticky;left:0;text-align:right;color:var(--code-gutter);user-select:none;background:var(--code-bg);border-right:1px solid var(--border);min-width:44px;padding-right:8px}
  table.code tr.hl td{background:var(--code-hl)}
  table.code tr.hl td.ln{background:var(--code-hl);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--code-hl-bar)}
  .t-c{color:var(--c-comment);font-style:italic}.t-d{color:var(--c-comment)}.t-s{color:var(--c-str)}.t-k{color:var(--c-kw);font-weight:600}
  .t-f{color:var(--c-fn)}.t-n{color:var(--c-num)}.t-a{color:var(--c-deco)}
  .legend-hl{margin:8px 0 0;font-size:12px;color:var(--ink-muted)}
  .legend-hl b{background:var(--code-hl);color:var(--ink);padding:0 6px;border-radius:4px}
  .flist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
  .flist button{width:100%;text-align:left;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:6px 10px}
  .flist button:hover{border-color:var(--accent)}
  .flist small{display:block;color:var(--ink-muted)}
  details.hdr{margin-top:12px;font-size:13px}
  details.hdr pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px;font-family:var(--sans);font-size:12.5px;color:var(--ink-muted)}

  @media (max-width:900px){
    .app{display:block;height:auto}
    .stage-wrap{max-height:none;overflow-x:auto}
    .panel{position:fixed;left:0;right:0;bottom:0;width:auto;height:62vh;border-left:0;border-top:2px solid var(--accent);
      box-shadow:0 -10px 30px rgba(0,0,0,.25);z-index:20;transform:translateY(105%);transition:transform .18s}
    body.open .panel{transform:none}
    .p-close{display:inline-block;position:absolute;right:12px;top:10px}
    .p-head{position:relative;padding-right:70px}
    .top{padding:12px 16px 8px}
    .stage{padding:16px 16px 70vh}
  }
  @media (prefers-reduced-motion: reduce){.node,.panel{transition:none}}
</style>
</head>

s": [{"block": "db/attempts.py:log_attempt", "hl": null, "label": "log_attempt()", "call": "db.log_attempt()", "snippet": false}]}, {"id": "l7", "col": 1, "row": 7, "kind": "route", "title": "⑦ 성공했나?", "plain": "⑤의 결과로 길이 둘로 갈라집니다.", "reject": "", "later": "", "items": [{"block": "routes/auth.py:login_submit", "hl": [250, 250], "label": "login_submit()", "call": null, "snippet": false}]}, {"id": "l8", "col": 1, "row": 8, "kind": "route", "title": "✅ 성공 → 세션 만들고 대시보드로", "plain": "브라우저에 '로그인된 상태'를 기억시키는 세션을 만들고 회원 대시보드로 보냅니다. 관리자 세션과는 다른 키를 씁니다.", "reject": "", "later": "", "items": [{"block": "routes/auth.py:login_submit", "hl": [255, 260], "label": "login_submit()", "call": null, "snippet": false}]}, {"id": "l8d", "col": 3, "row": 8, "kind": "db", "title": "회원 정보 조회", "plain": "세션에 담을 회원 번호(id)와 세션 세대 번호를 읽어옵니다.", "reject": "", "later": "", "items": [{"block": "db/users.py:get_user_by_username", "hl": null, "label": "get_user_by_username()", "call": "db.get_user_by_username()", "snippet": false}]}, {"id": "l8m", "col": 0, "row": 8, "kind": "later", "title": "회원 대시보드", "plain": "로그인한 회원의 첫 화면.", "reject": "", "later": "2단원", "items": [{"block": "routes/member.py:member_dashboard", "hl": null, "label": "member_dashboard()", "call": null, "snippet": false}]}, {"id": "l9", "col": 1, "row": 9, "kind": "route", "title": "❌ 실패 → 같은 문구 + 위험 판정", "plain": "'아이디 없음'과 '비밀번호 틀림'을 구분해 알려주면 공격자에게 힌트가 되므로 항상 같은 문구로 안내합니다. 이어서 이 IP·계정의 실패가 기준치를 넘었는지 판정하고 필요하면 잠급니다.", "reject": "아이디 또는 비밀번호가 올바르지 않습니다.", "later": "", "items": [{"block": "routes/auth.py:login_submit", "hl": [272, 313], "label": "login_submit()", "call": null, "snippet": false}]}, {"id": "l9d", "col": 2, "row": 9, "kind": "later", "title": "수상한가? 판정", "plain": "최근 실패 횟수가 기준치를 넘었는지 판정만 합니다.", "reject": "", "later": "5단원", "items": [{"block": "security/detector.py:is_suspicious", "hl": null, "label": "is_suspicious()", "call": null, "snippet": false}, {"block": "security/detector.py:is_account_suspicious", "hl": null, "label": "is_account_suspicious()", "call": null, "snippet": false}]}, {"id": "l9s", "col": 2, "row": 9, "kind": "later", "title": "IP·계정 잠금 집행", "plain": "판정 결과대로 실제로 잠그고 알림을 보냅니다.", "reject": "", "later": "10단원", "items": [{"block": "security/soar/lockouts.py:enforce_lockout", "hl": null, "label": "enforce_lockout()", "call": "soar.enforce_lockout()", "snippet": false}, {"block": "security/soar/lockouts.py:enforce_account_lockout", "hl": null, "label": "enforce_account_lockout()", "call": "soar.enforce_account_lockout()", "snippet": false}]}, {"id": "l9e", "col": 2, "row": 9, "kind": "later", "title": "AI 조기 경보", "plain": "기준치 코앞이면 AI에게 조기 경보 여부를 묻습니다.", "reject": "", "later": "11단원", "items": [{"block": "security/soar/early_warning.py:consider_early_warning", "hl": null, "label": "consider_early_warning()", "call": "soar.consider_early_warning()", "snippet": false}]}], "edges": [{"from": "l0", "to": "l1", "label": "POST /login", "kind": "flow"}, {"from": "l1", "to": "l1s", "label": "soar.try_release_expired_*()", "kind": "call"}, {"from": "l1", "to": "l2", "label": "", "kind": "flow"}, {"from": "l2", "to": "l2h", "label": "is_bot_submission()", "kind": "call"}, {"from": "l2", "to": "l2n", "label": "soar.notify_bot_detected()", "kind": "call"}, {"from": "l2", "to": "l3", "label": "", "kind": "flow"}, {"from": "l3", "to": "l3d", "label": "detector.is_locked()", "kind": "call"}, {"from": "l3d", "to": "l3b", "label": "db.get_active_lockout()", "kind": "call"}, {"from": "l3", "to": "l4", "label": "", "kind": "flow"}, {"from": "l4", "to": "l4d", "label": "detector.is_account_locked()", "kind": "call"}, {"from": "l4d", "to": "l4b", "label": "db.get_active_account_lockout()", "kind": "call"}, {"from": "l4", "to": "l5", "label": "", "kind": "flow"}, {"from": "l5", "to": "l5d", "label": "db.verify_user_credentials()", "kind": "call"}, {"from": "l5", "to": "l6", "label": "", "kind": "flow"}, {"from": "l6", "to": "l6b", "label": "db.log_attempt()", "kind": "call"}, {"from": "l6", "to": "l7", "label": "", "kind": "flow"}, {"from": "l7", "to": "l8", "label": "성공", "kind": "flow"}, {"from": "l7", "to": "l9", "label": "실패", "kind": "flow"}, {"from": "l8", "to": "l8d", "label": "db.get_user_by_username()", "kind": "call"}, {"from": "l8", "to": "l8m", "label": "redirect", "kind": "call"}, {"from": "l9", "to": "l9d", "label": "detector.is_suspicious() 등", "kind": "call"}, {"from": "l9", "to": "l9s", "label": "soar.enforce_*()", "kind": "call"}, {"from": "l9", "to": "l9e", "label": "soar.consider_early_warning()", "kind": "call"}], "steps": ["l0", "l1", "l2", "l3", "l4", "l5", "l6", "l7", "l8", "l9"]}], "blocks": {"templates/signup.html:37-60": {"path": "templates/signup.html", "start": 37, "end": 60, "lang": "html", "code": "            <form method=\"post\" action=\"{{ url_for('auth.signup_submit') }}\">\n                <input type=\"hidden\" name=\"csrf_token\" value=\"{{ csrf_token() }}\">\n\n                <\u0021-- 허니팟(봇 탐지)용 숨김 필드 — helpers.is_bot_submission() 참고.\n                     사람에게는 안 보이므로 절대 채우면 안 된다. -->\n                <div class=\"hp-field\" aria-hidden=\"true\">\n                    <label for=\"website\">웹사이트<\/label>\n                    <input type=\"text\" id=\"website\" name=\"website\" tabindex=\"-1\" autocomplete=\"off\">\n                <\/div>\n\n                <label for=\"username\">아이디<\/label>\n                <input type=\"text\" id=\"username\" name=\"username\" required>\n\n                <label for=\"email\">이메일<\/label>\n                <input type=\"email\" id=\"email\" name=\"email\" required>\n\n                <label for=\"password\">비밀번호<\/label>\n                <input type=\"password\" id=\"password\" name=\"password\" required>\n\n                <label for=\"password_confirm\">비밀번호 확인<\/label>\n                <input type=\"password\" id=\"password_confirm\" name=\"password_confirm\" required>\n\n                <button type=\"submit\">가입하기<\/button>\n            <\/form>", "alias": null}, "routes/auth.py:signup_submit": {"path": "routes/auth.py", "start": 64, "end": 153, "lang": "python", "code": "@auth_bp.route(\"/signup\", methods=[\"POST\"])\ndef signup_submit():\n    \"\"\"회원가입 폼에서 \"가입하기\" 버튼을 눌렀을 때 실제로 처리하는 부분.\n\n    GET(화면 보여주기)과 POST(데이터 제출 처리)를 같은 주소(/signup)에 대해\n    따로 등록해두는 것이 Flask에서 아주 흔한 패턴이다 — \"이 주소를 그냥 방문하면\n    빈 폼을 보여주고, 이 주소로 폼 데이터를 제출하면 그때는 처리 로직을 실행해라\"\n    는 뜻이다.\n    \"\"\"\n    # 화면에서 폼 자체를 숨겨뒀더라도, 누군가 개발자 도구 등으로 이 주소에 직접\n    # 요청을 보낼 수 있으므로 서버 쪽에서도 다시 한번 막아준다(이중 안전장치).\n    if not db.get_signup_enabled():\n        flash(\"현재 회원가입이 잠시 중단되어 있습니다.\")\n        return render_template(\"signup.html\", signup_enabled=False)\n\n    ip = get_request_ip()\n\n    # 허니팟 필드가 채워져 있으면 사람이 아니라 자동화 스크립트라고 보고,\n    # 시도 기록조차 남기지 않고 즉시 거부한다 (L7 공격 보강 계획 Tier 3).\n    if is_bot_submission():\n        soar.notify_bot_detected(ip, request.path)\n        flash(\"일시적인 오류가 발생했습니다. 다시 시도해주세요.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    # 영구 잠금된 IP는 가입도 막는다 — 공격자가 새 계정을 만들어 자기 IP의 예외를\n    # 받아내는 경로를 차단한다(guide33). 일반 임시 잠금(5분)은 가입을 막지 않는다.\n    if detector.get_ip_lock_state(ip) == detector.LOCK_STATE_PERMANENT:\n        flash(\"현재 이 네트워크에서는 회원가입을 할 수 없습니다. 관리자에게 문의해주세요.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    # 같은 IP가 짧은 시간에 너무 많이 가입을 시도하면 거부한다 — 이전에는 이 주소에\n    # 요청 빈도 제한이 전혀 없어서, 스크립트로 계정을 무제한 찍어낼 수 있었다\n    # (18단계 보안 점검에서 발견 및 보완). 성공/실패와 무관하게 시도 자체를 세므로,\n    # 검증에서 계속 걸러지는 값을 반복 제출하는 남용도 함께 막는다.\n    rate_limited, signup_count = detector.is_signup_rate_limited(ip)\n    if rate_limited:\n        soar.record_rejection(\"SIGNUP_RATE_LIMIT\", ip, request.path, config.SIGNUP_RATE_LIMIT)\n        flash(\"너무 많은 가입 시도가 감지되었습니다. 잠시 후 다시 시도해주세요.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n    # 아직 기준치(SIGNUP_RATE_LIMIT)는 안 넘었지만 코앞이면, LLM에게 조기 경보\n    # 여부를 물어본다 (Track A, guide31 — config.EARLY_WARNING_BAND 설명 참고).\n    if signup_count >= config.SIGNUP_RATE_LIMIT - config.EARLY_WARNING_BAND:\n        soar.consider_early_warning(\n            \"SIGNUP_RATE_LIMIT\", \"ALERT_ONLY\", \"ip\", ip, signup_count, config.SIGNUP_RATE_LIMIT,\n            path=request.path,\n        )\n    db.log_signup_attempt(ip)\n\n    username = request.form.get(\"username\", \"\").strip()\n    email = request.form.get(\"email\", \"\").strip()\n    password = request.form.get(\"password\", \"\")\n    password_confirm = request.form.get(\"password_confirm\", \"\")\n\n    if not username or not email or not password:\n        flash(\"아이디, 이메일, 비밀번호를 모두 입력해주세요.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    if not config.USERNAME_PATTERN.match(username):\n        flash(\"아이디는 영문자, 숫자, 밑줄(_)만 사용해 3~20자로 입력해주세요.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    if not config.EMAIL_PATTERN.match(email):\n        flash(\"올바른 이메일 형식이 아닙니다.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    if len(password) < config.MIN_PASSWORD_LENGTH:\n        flash(f\"비밀번호는 최소 {config.MIN_PASSWORD_LENGTH}자 이상이어야 합니다.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    if password != password_confirm:\n        flash(\"비밀번호와 비밀번호 확인이 일치하지 않습니다.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    created = db.create_user(username, email, password)\n    if not created:\n        flash(\"이미 사용 중인 아이디 또는 이메일입니다.\")\n        return render_template(\"signup.html\", signup_enabled=True)\n\n    # 가입 이메일로 인증 링크를 보낸다(guide40). 메일이 실패해도 가입은 그대로 유지한다 —\n    # 로그인한 뒤 대시보드에서 다시 보낼 수 있다.\n    try:\n        verification = email_verification.send_verification(created, ip)\n    except Exception as e:  # noqa: BLE001\n        mailer.report_failure(mailer.FAIL_INTERNAL, f\"가입 인증 메일 처리 중 오류: {type(e).__name__}\")\n        verification = email_verification.UNAVAILABLE\n    if verification == email_verification.SENT:\n        flash(\"회원가입이 완료되었습니다. 가입 이메일로 인증 메일을 보냈습니다. 로그인해주세요.\")\n    else:\n        flash(\"회원가입이 완료되었습니다. 로그인해주세요. 이메일 인증은 로그인 후 대시보드에서 할 수 있습니다.\")\n    return redirect(url_for(\"auth.login\"))", "alias": null}, "db/settings.py:get_signup_enabled": {"path": "db/settings.py", "start": 17, "end": 29, "lang": "python", "code": "def get_signup_enabled() -> bool:\n    \"\"\"지금 회원가입을 받고 있는지(True) 막아뒀는지(False) 확인한다.\n\n    이 값을 파이썬 변수(메모리)에만 저장해두면 안 되는 이유: 이 프로젝트는\n    로컬 컴퓨터, Vercel 등 여러 곳에서 서버가 동시에 돌아갈 수 있는데, 메모리는\n    각 서버(프로세스)마다 따로따로 존재한다. 관리자가 한 곳에서 \"회원가입 끄기\"를\n    눌러도 다른 곳에서 돌고 있는 서버는 그 사실을 전혀 모른다. 그래서 모두가\n    공유해서 보는 단 하나의 장소인 Supabase에 이 값을 저장해둔다.\n    \"\"\"\n    res = db.get_client().table(\"app_settings\").select(\"signup_enabled\").eq(\"id\", 1).limit(1).execute()\n    if not res.data:\n        return True  # 설정 행이 아직 없다면(예외 상황) 기본값은 \"허용\"으로 안전하게 처리\n    return res.data[0][\"signup_enabled\"]", "alias": {"call": "db.get_signup_enabled()", "via": "db/__init__.py", "real": "db/settings.py"}}, "helpers/request_utils.py:is_bot_submission": {"path": "helpers/request_utils.py", "start": 43, "end": 45, "lang": "python", "code": "def is_bot_submission() -> bool:\n    \"\"\"이번 폼 제출에 허니팟 필드가 채워져 있으면 True(봇 의심)를 돌려준다.\"\"\"\n    return bool(request.form.get(HONEYPOT_FIELD_NAME, \"\").strip())", "alias": {"call": "helpers.is_bot_submission()", "via": "helpers/__init__.py", "real": "helpers/request_utils.py"}}, "security/soar/observe.py:notify_bot_detected": {"path": "security/soar/observe.py", "start": 15, "end": 23, "lang": "python", "code": "def notify_bot_detected(ip: str, path: str) -> None:\n    \"\"\"허니팟 필드가 채워진 요청(자동화 스크립트/봇 의심)을 MEDIUM 이벤트로 기록한다.\n\n    Slack 알림은 보내지 않는다 — 로그인 실패 반복이나 게시글 도배처럼 그 자체로\n    실제 피해로 이어지는 사건이 아니라 \"이 트래픽에 자동화 스크립트가 섞여\n    있다\"는 관찰 정보이므로, notify_web_scanning() 등과 같은 급의 MEDIUM으로\n    로그에만 남긴다 (L7 공격 보강 계획 Tier 3).\n    \"\"\"\n    _record_event(\"BOT_DETECTED\", \"MEDIUM\", ip, path, 1, \"REJECTED\")", "alias": {"call": "soar.notify_bot_detected()", "via": "security/soar/__init__.py", "real": "security/soar/observe.py"}}, "security/detector.py:get_ip_lock_state": {"path": "security/detector.py", "start": 241, "end": 243, "lang": "python", "code": "def get_ip_lock_state(ip: str) -> str:\n    \"\"\"이 IP의 잠금 상태를 NONE / TEMPORARY / PERMANENT 중 하나로 알려준다.\"\"\"\n    return _state_from_row(db.get_active_lockout(ip))", "alias": null}, "db/lockouts.py:get_active_lockout": {"path": "db/lockouts.py", "start": 176, "end": 198, "lang": "python", "code": "def get_active_lockout(ip: str) -> dict | None:\n    \"\"\"이 IP가 \"지금 이 순간\" 실제로 잠겨있는지 확인하고, 잠겨있다면 그 잠금 정보를 돌려준다.\n\n    조건이 두 가지 다 맞아야 \"진짜로 잠긴 상태\"로 인정한다:\n    - active가 True (아직 해제되지 않았고)\n    - 영구 잠금(lock_type='PERMANENT', unlock_at이 NULL)이거나, unlock_at(풀리는\n      시각)이 지금보다 미래 (아직 시간이 안 지났고)\n\n    unlock_at만 보면 영구 잠금(NULL)이 \"안 잠김\"으로 판정되므로 or_ 조건이 필수다(guide33).\n\n    두 조건을 만족하는 기록이 없으면 None(없음)을 돌려준다.\n    \"\"\"\n    res = (\n        db.get_client()\n        .table(\"lockouts\")\n        .select(\"*\")\n        .eq(\"ip_address\", ip)\n        .eq(\"active\", True)\n        .or_(f\"lock_type.eq.PERMANENT,unlock_at.gt.{db._now_iso()}\")  # gt = \"~보다 미래\"\n        .limit(1)\n        .execute()\n    )\n    return res.data[0] if res.data else None  # 결과가 있으면 첫 번째 줄, 없으면 None", "alias": {"call": "db.get_active_lockout()", "via": "db/__init__.py", "real": "db/lockouts.py"}}, "security/detector.py:is_signup_rate_limited": {"path": "security/detector.py", "start": 111, "end": 125, "lang": "python", "code": "def is_signup_rate_limited(ip: str) -> tuple[bool, int]:\n    \"\"\"이 IP가 최근 회원가입을 너무 자주 시도해서 더 막아야 하는 상태인지 판단한다.\n\n    is_suspicious()와 달리 \"초과\"가 아니라 \"이상\"을 기준으로 삼는다 — 로그인\n    실패는 정상 사용자도 몇 번은 겪을 수 있는 일이라 여유(초과)를 주지만,\n    회원가입 요청 자체는 정상 사용자가 짧은 시간에 여러 번 반복할 이유가\n    거의 없으므로 더 엄격하게(기준치에 도달하면 즉시) 차단한다.\n\n    원래는 bool 하나만 돌려줬지만, is_suspicious()처럼 (판단, 실제 시도 횟수)\n    튜플로 바꿨다 — routes/auth.py가 \"아직 기준치는 안 넘었지만 코앞인지\"\n    (Track A 조기 경보, config.EARLY_WARNING_BAND)도 판단해야 해서 실제\n    횟수가 필요해졌다.\n    \"\"\"\n    count = db.count_recent_signup_attempts(ip)\n    return count >= SIGNUP_RATE_LIMIT, count", "alias": null}, "db/settings.py:count_recent_signup_attempts": {"path": "db/settings.py", "start": 42, "end": 53, "lang": "python", "code": "def count_recent_signup_attempts(ip: str, window_seconds: int = config.DETECTION_WINDOW_SECONDS) -> int:\n    \"\"\"이 IP가 최근 몇 초(기본 60초) 안에 회원가입을 몇 번이나 시도했는지 센다.\"\"\"\n    cutoff = (datetime.now(timezone.utc) - timedelta(seconds=window_seconds)).isoformat()\n    res = (\n        db.get_client()\n        .table(\"signup_attempts\")\n        .select(\"id\", count=\"exact\")\n        .eq(\"ip_address\", ip)\n        .gte(\"attempted_at\", cutoff)\n        .execute()\n    )\n    return res.count or 0", "alias": {"call": "db.count_recent_signup_attempts()", "via": "db/__init__.py", "real": "db/settings.py"}}, "db/settings.py:log_signup_attempt": {"path": "db/settings.py", "start": 37, "end": 39, "lang": "python", "code": "def log_signup_attempt(ip: str) -> None:\n    \"\"\"회원가입 POST 요청 한 건을 signup_attempts 표에 기록한다 (성공/실패 무관).\"\"\"\n    db.get_client().table(\"signup_attempts\").insert({\"ip_address\": ip}).execute()", "alias": {"call": "db.log_signup_attempt()", "via": "db/__init__.py", "real": "db/settings.py"}}, "config.py:8-15": {"path": "config.py", "start": 8, "end": 15, "lang": "python", "code": "USERNAME_PATTERN = re.compile(r\"^[A-Za-z0-9_]{3,20}$\")\nMIN_PASSWORD_LENGTH = 8\n\n# 이메일 형식 규칙(회원가입 routes/auth.py, 이메일 변경 routes/member.py가 같이 쓴다).\n# \"글자@글자.글자\" 형태의 아주 기본적인 모양만 확인한다. 완벽한 RFC 5322\n# 검증은 아니지만(그런 정규식은 매우 복잡하다), \"이메일처럼 안 생긴 값\"을 걸러내는\n# 데는 충분하고, 실제 도달 가능 여부는 어차피 별도의 인증 메일 없이는 확인할 수 없다.\nEMAIL_PATTERN = re.compile(r\"^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$\")", "alias": null}, "db/users.py:create_user": {"path": "db/users.py", "start": 44, "end": 70, "lang": "python", "code": "def create_user(username: str, email: str, password: str) -> dict | None:\n    \"\"\"새 사용자 계정을 만든다 (회원가입).\n\n    같은 아이디나 같은 이메일로 이미 가입한 사람이 있으면 실패(None)를 돌려주고\n    아무것도 저장하지 않는다. 문제없으면 비밀번호를 암호화해서 저장하고 새 회원 행을 돌려준다.\n\n    반환값:\n        새로 만든 회원 행(dict) - 회원가입 성공 (가입 인증 메일을 보낼 때 id·email이 필요하다, guide40)\n        None                    - 아이디 또는 이메일이 이미 사용 중이라 가입 실패\n    \"\"\"\n    # 1) 아이디 중복 확인\n    existing_username = (\n        db.get_client().table(\"users\").select(\"id\").eq(\"username\", username).limit(1).execute()\n    )\n    if existing_username.data:\n        return None\n    # 2) 이메일 중복 확인\n    existing_email = (\n        db.get_client().table(\"users\").select(\"id\").eq(\"email\", email).limit(1).execute()\n    )\n    if existing_email.data:\n        return None\n    # 3) 문제 없으면 비밀번호를 암호화해서 새 계정 저장\n    res = db.get_client().table(\"users\").insert(\n        {\"username\": username, \"email\": email, \"password_hash\": generate_password_hash(password)}\n    ).execute()\n    return res.data[0] if res.data else None", "alias": {"call": "db.create_user()", "via": "db/__init__.py", "real": "db/users.py"}}, "services/email_verification.py:send_verification": {"path": "services/email_verification.py", "start": 99, "end": 110, "lang": "python", "code": "def send_verification(user: dict, ip: str) -> str:\n    \"\"\"이 회원의 현재 이메일로 인증 링크를 보낸다(가입 직후, 대시보드 \"다시 보내기\").\"\"\"\n    if user.get(\"email_status\") == \"VERIFIED\":\n        return ALREADY_VERIFIED\n    purpose = db.email_tokens.PURPOSE_EMAIL_VERIFY\n    if _rate_limited(user[\"id\"], purpose):\n        return RATE_LIMITED\n    issued = _issue(user[\"id\"], purpose, user[\"email\"], ip)\n    if issued is None:\n        return UNAVAILABLE\n    row, link = issued\n    return _after_send(user[\"id\"], row, mailer.send_email_verification(user[\"email\"], link))", "alias": null}, "routes/auth.py:login": {"path": "routes/auth.py", "start": 183, "end": 193, "lang": "python", "code": "@auth_bp.route(\"/login\", methods=[\"GET\"])\ndef login():\n    \"\"\"감시 대상 로그인 화면을 보여준다. 이미 로그인된 상태라면 회원 대시보드로 바로 보낸다.\n\n    화면 자체는 관리자 로그인과 똑같은 login_form.html을 공유하지만(겉보기로는\n    구분이 안 됨), form_action만 이 라우트로(\"/login\") 지정해서 실제 제출은\n    login_submit()이 처리하게 한다.\n    \"\"\"\n    if \"username\" in session:\n        return redirect(url_for(\"member.member_dashboard\"))\n    return render_template(\"login_form.html\", form_action=url_for(\"auth.login_submit\"))", "alias": null}, "templates/login_form.html:46-63": {"path": "templates/login_form.html", "start": 46, "end": 63, "lang": "html", "code": "        <form method=\"post\" action=\"{{ form_action }}\">\n            <input type=\"hidden\" name=\"csrf_token\" value=\"{{ csrf_token() }}\">\n\n            <\u0021-- 허니팟(봇 탐지)용 숨김 필드 — helpers.is_bot_submission() 참고.\n                 사람에게는 안 보이므로 절대 채우면 안 된다. -->\n            <div class=\"hp-field\" aria-hidden=\"true\">\n                <label for=\"website\">웹사이트<\/label>\n                <input type=\"text\" id=\"website\" name=\"website\" tabindex=\"-1\" autocomplete=\"off\">\n            <\/div>\n\n            <label for=\"username\">아이디<\/label>\n            <input type=\"text\" id=\"username\" name=\"username\" required>\n\n            <label for=\"password\">비밀번호<\/label>\n            <input type=\"password\" id=\"password\" name=\"password\" required>\n\n            <button type=\"submit\">로그인<\/button>\n        <\/form>", "alias": null}, "routes/auth.py:login_submit": {"path": "routes/auth.py", "start": 196, "end": 315, "lang": "python", "code": "@auth_bp.route(\"/login\", methods=[\"POST\"])\ndef login_submit():\n    \"\"\"로그인 폼 제출을 처리한다. 이 함수 하나가 이 프로젝트의 핵심 흐름을 담당한다.\n\n    처리 순서:\n    1. 혹시 자동으로 풀어줘야 할 만료된 잠금(IP 단위 + 계정 단위)이 있으면 먼저 정리한다.\n    2. 이번 요청을 보낸 IP와 입력된 아이디를 알아낸다.\n    3. 이 IP가 지금 잠긴 상태이거나, 이 계정 자체가 (다른 IP들이 나눠서 공격해서)\n       잠긴 상태라면 아이디/비밀번호를 확인하지도 않고 곧바로 거부한다. 단, 영구 잠금된\n       IP는 이메일 복구로 예외를 받은 \"본인 + 본인 기기\"만 통과시킨다(guide33/34-a).\n    4. 잠긴 상태가 아니라면 실제로 아이디/비밀번호를 확인하고, 그 시도를 기록한다.\n    5. 실패했다면 \"혹시 이 IP가 수상한 수준(5회 초과)이 됐는지\"를 먼저 보고,\n       아니라면 \"혹시 이 계정이 여러 IP에 걸쳐 총합으로 수상한 수준(8회 초과)이\n       됐는지\"도 본다 — 전자는 soar.enforce_lockout(IP 잠금), 후자는\n       soar.enforce_account_lockout(계정 잠금)이 알림까지 같이 보낸다\n       (L7 공격 보강 계획 Tier 1: 분산/저속 브루트포스 대응). 둘 다 아직 기준치 아래지만\n       코앞이면 LLM 조기 경보를 판단한다(guide31).\n    6. 성공했다면 회원 세션을 만들어서 회원 대시보드로 이동시킨다(12단계에서 추가).\n    \"\"\"\n    # 1) 시간이 지나 자동으로 풀려야 할 잠금들을 정리 (IP 단위 + 계정 단위)\n    soar.try_release_expired_lockouts()\n    soar.try_release_expired_account_lockouts()\n\n    ip = get_request_ip()\n    username = request.form.get(\"username\", \"\")\n    password = request.form.get(\"password\", \"\")\n\n    # 허니팟 필드가 채워져 있으면 사람이 아니라 자동화 스크립트라고 보고,\n    # 자격 증명 확인/시도 기록 없이 즉시 거부한다 (L7 공격 보강 계획 Tier 3).\n    if is_bot_submission():\n        soar.notify_bot_detected(ip, request.path)\n        flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n        return render_template(\"login_form.html\", form_action=url_for(\"auth.login_submit\"))\n\n    # 2) 이미 잠긴 IP이거나, 이미 잠긴 계정이라면 검증 자체를 건너뛰고 즉시 거부\n    #    — 단, 영구 잠금된 IP는 \"이메일 복구로 예외를 받은 본인+본인 기기\"만 통과시킨다(guide33).\n    exemption = None\n    if detector.is_locked(ip):\n        if detector.get_ip_lock_state(ip) != detector.LOCK_STATE_PERMANENT:\n            flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n            return _login_form()\n        exemption = _find_ip_exemption(ip, username)\n        if exemption is None:\n            flash(\"이 네트워크는 차단되어 있습니다. 본인이라면 아래 '본인 인증으로 접속 허용'을 이용해주세요.\")\n            return _login_form(recovery_link=True)\n        # 예외가 있으면 IP 잠금 안내 없이 아래 계정 잠금 확인과 정상적인 비밀번호 확인으로 계속 진행한다.\n\n    if detector.is_account_locked(username):\n        flash(ACCOUNT_LOCKED_MESSAGE)\n        return _login_form(recovery_link=True)\n\n    success = db.verify_user_credentials(username, password)\n    db.log_attempt(ip, username, success)\n\n    if success:\n        # 관리자 세션(\"admin_username\")과는 완전히 다른 키(\"username\")를 쓴다 —\n        # 그래야 같은 브라우저에서 관리자 세션이 있더라도 서로 섞이지 않는다.\n        # user_id도 같이 저장해두는 이유는 member_login_required 문지기 뒤에서\n        # \"아이디\"가 아니라 변하지 않는 \"번호\"로 본인 행을 정확히 찾기 위해서다.\n        user = db.get_user_by_username(username)\n        session[\"username\"] = username\n        session[\"user_id\"] = user[\"id\"]\n        # 세션 세대 번호 — 나중에 비밀번호가 바뀌면 이 세션을 끊는 데 쓴다(guide35).\n        session[\"session_version\"] = user.get(\"session_version\") or 0\n        return redirect(url_for(\"member.member_dashboard\"))\n\n    # 영구 잠금 예외로 통과한 사용자가 연달아 실패하면 그 예외를 회수한다 — 예외는 \"본인이\n    # 비밀번호를 아는 상황\"을 전제로 한 출입증이라, 계속 틀리는 건 도용 신호로 본다.\n    # (예외 통과자의 실패는 IP 임계값 판정으로 넘기지 않는다 — 이 IP는 이미 영구 잠금 중이라\n    # enforce_lockout()이 5분 잠금 알림을 또 보내는 일이 없도록 하기 위해서다.)\n    if exemption is not None:\n        if db.count_recent_failures(ip) >= config.IP_EXEMPTION_MAX_FAILURES:\n            db.revoke_ip_exemption(exemption[\"id\"], \"예외 통과 후 연속 로그인 실패\")\n        flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n        return _login_form()\n\n    # 실패했다면, 먼저 이 IP가 방금 임계값을 넘었는지 확인한다.\n    suspicious, failure_count = detector.is_suspicious(ip)\n    if suspicious:\n        # 최근 실패에 쓰인 아이디가 몇 개였는지도 함께 세서, Slack 알림이 Brute\n        # Force(계정 1개 집중)와 Password Spraying(계정 여러 개 순회)을 구분해\n        # 표시할 수 있게 한다 (attack_response_state.md 구현 대상 #5).\n        distinct_usernames = detector.count_distinct_usernames(ip)\n        soar.enforce_lockout(ip, failure_count, distinct_usernames)\n        flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n    else:\n        # 아직 기준치(FAILURE_THRESHOLD)는 안 넘었지만 코앞이면, LLM에게 조기\n        # 경보 여부를 물어본다 (Track A, guide31). 공격자가 임계값을 살짝\n        # 피해 가려고 실패 횟수를 일부러 코앞에서 멈추는 패턴을 이 구간에서 잡는다.\n        if failure_count >= config.FAILURE_THRESHOLD - config.EARLY_WARNING_BAND:\n            distinct_usernames = detector.count_distinct_usernames(ip)\n            soar.consider_early_warning(\n                \"BRUTE_FORCE\", \"LOCK_IP\", \"ip\", ip, failure_count, config.FAILURE_THRESHOLD,\n                context_count=distinct_usernames,\n            )\n\n        # IP 단위로는 아직 수상하지 않더라도, 이 계정이 여러 IP에 걸쳐 나뉘어서\n        # 총합 기준으로 수상한 수준이 됐는지 확인한다 — 공격자가 IP를 돌려가며\n        # (봇넷/프록시 로테이션) 한 계정만 노리는 분산 브루트포스를 잡아낸다.\n        account_suspicious, account_failure_count = detector.is_account_suspicious(username)\n        if account_suspicious:\n            distinct_ips = detector.count_distinct_ips_by_username(username)\n            soar.enforce_account_lockout(username, account_failure_count, distinct_ips, ip)\n            flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n        else:\n            # 이 계정도 마찬가지로 임계값(ACCOUNT_FAILURE_THRESHOLD) 코앞이면\n            # 조기 경보 대상이다 — 여러 IP에 나눠 시도하되 각 IP·계정 총합\n            # 모두를 임계값 아래로 유지하려는 패턴을 잡아낸다.\n            if account_failure_count >= config.ACCOUNT_FAILURE_THRESHOLD - config.EARLY_WARNING_BAND:\n                distinct_ips = detector.count_distinct_ips_by_username(username)\n                soar.consider_early_warning(\n                    \"DISTRIBUTED_BRUTE_FORCE\", \"LOCK_ACCOUNT\", \"account\", username,\n                    account_failure_count, config.ACCOUNT_FAILURE_THRESHOLD,\n                    context_count=distinct_ips, context_ip=ip,\n                )\n            # 사용자 존재 여부(아이디가 없는지, 비밀번호만 틀렸는지)를 구분해서\n            # 알려주면 공격자에게 힌트를 주게 되므로, 항상 똑같은 문구로만 실패를 알린다.\n            flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n\n    return render_template(\"login_form.html\", form_action=url_for(\"auth.login_submit\"))", "alias": null}, "security/soar/lockouts.py:try_release_expired_lockouts": {"path": "security/soar/lockouts.py", "start": 156, "end": 169, "lang": "python", "code": "def try_release_expired_lockouts() -> None:\n    \"\"\"\"5분이 지났는데 아직 안 풀린\" 잠금들을 찾아서 전부 풀어준다.\n\n    이 프로젝트는 \"정해진 시각이 되면 자동으로 실행되는 타이머 프로그램\"을\n    따로 두지 않는다(구현이 복잡해지므로 이번 계획 범위 밖). 대신 이 함수를\n    `/login` 요청이 들어올 때, 그리고 대시보드가 상태를 갱신할 때(정해진 간격마다 —\n    config.ADMIN_STATUS_RELEASE_INTERVAL_SECONDS, guide46) 호출해서\n    \"혹시 지금 풀어줘야 할 게 있나?\"를 그때그때 확인하는 방식으로 \"자동 해제\"를\n    흉내낸다. 트래픽(요청)이 없으면 실제 해제 반영이 살짝 늦어질 수 있지만,\n    이 프로젝트 규모에서는 문제되지 않는다.\n    \"\"\"\n    for lockout in db.list_expired_active_lockouts():\n        db.release_lockout(lockout[\"ip_address\"])\n        db.resolve_security_events_for_ip(lockout[\"ip_address\"])", "alias": {"call": "soar.try_release_expired_lockouts()", "via": "security/soar/__init__.py", "real": "security/soar/lockouts.py"}}, "security/soar/lockouts.py:try_release_expired_account_lockouts": {"path": "security/soar/lockouts.py", "start": 145, "end": 153, "lang": "python", "code": "def try_release_expired_account_lockouts() -> None:\n    \"\"\"5분이 지났는데 아직 안 풀린 계정 잠금들을 찾아서 전부 풀어준다.\n\n    try_release_expired_lockouts()(IP 잠금)와 동일하게, 별도의 타이머 프로그램\n    없이 요청이 들어올 때마다 확인하는 방식으로 \"자동 해제\"를 흉내낸다.\n    \"\"\"\n    for lockout in db.list_expired_active_account_lockouts():\n        db.release_account_lockout(lockout[\"username\"])\n        db.resolve_security_events_for_username(lockout[\"username\"])", "alias": {"call": "soar.try_release_expired_account_lockouts()", "via": "security/soar/__init__.py", "real": "security/soar/lockouts.py"}}, "security/detector.py:is_locked": {"path": "security/detector.py", "start": 212, "end": 219, "lang": "python", "code": "def is_locked(ip: str) -> bool:\n    \"\"\"이 IP가 지금 이 순간 잠긴 상태인지 True/False로 알려준다.\n\n    실제 \"잠겨있는지\" 판단은 db.get_active_lockout()이 이미 하고 있으므로\n    (active=True 이면서 아직 풀릴 시각이 안 지난 것만 찾아줌),\n    여기서는 그 결과가 있는지(None이 아닌지)만 확인한다.\n    \"\"\"\n    return db.get_active_lockout(ip) is not None", "alias": null}, "security/detector.py:is_account_locked": {"path": "security/detector.py", "start": 73, "end": 79, "lang": "python", "code": "def is_account_locked(username: str) -> bool:\n    \"\"\"이 계정이 지금 이 순간 잠긴 상태인지 True/False로 알려준다.\n\n    is_locked(ip)의 계정 버전 — db.get_active_account_lockout()의 결과가\n    있는지(None이 아닌지)만 확인한다.\n    \"\"\"\n    return db.get_active_account_lockout(username) is not None", "alias": null}, "db/account_lockouts.py:get_active_account_lockout": {"path": "db/account_lockouts.py", "start": 147, "end": 163, "lang": "python", "code": "def get_active_account_lockout(username: str) -> dict | None:\n    \"\"\"이 계정이 \"지금 이 순간\" 실제로 잠겨있는지 확인하고, 잠겨있다면 그 잠금 정보를 돌려준다.\n\n    db.get_active_lockout()과 동일한 두 조건(active=True, 그리고 영구 잠금이거나\n    unlock_at이 미래)을 본다.\n    \"\"\"\n    res = (\n        db.get_client()\n        .table(\"account_lockouts\")\n        .select(\"*\")\n        .eq(\"username\", username)\n        .eq(\"active\", True)\n        .or_(f\"lock_type.eq.PERMANENT,unlock_at.gt.{db._now_iso()}\")\n        .limit(1)\n        .execute()\n    )\n    return res.data[0] if res.data else None", "alias": {"call": "db.get_active_account_lockout()", "via": "db/__init__.py", "real": "db/account_lockouts.py"}}, "db/users.py:verify_user_credentials": {"path": "db/users.py", "start": 73, "end": 90, "lang": "python", "code": "def verify_user_credentials(username: str, password: str) -> bool:\n    \"\"\"사용자가 로그인 화면에 입력한 아이디/비밀번호가 맞는지 확인한다.\n\n    동작 원리는 verify_admin_credentials와 동일 — 저장된 암호문과\n    \"지금 입력한 비밀번호를 암호화한 결과\"가 일치하는지만 비교한다.\n\n    타이밍 사이드채널 방지 (L7 공격 보강 계획 Tier 3): 예전에는 아이디가 없으면\n    check_password_hash()를 아예 건너뛰고 바로 False를 돌려줬다. 이 해시 비교는\n    일부러 느리게 설계된 연산이라, \"즉시 반환(아이디 없음)\"과 \"해시 비교 후\n    반환(비밀번호만 틀림)\" 사이에 응답 시간 차이가 생겨 공격자가 그 차이만으로\n    \"이 아이디가 존재하는가\"를 추측할 수 있었다(화면 메시지는 이미 통일돼\n    있었지만 타이밍까지는 못 가렸다). 아이디가 없을 때도 미리 만들어둔 더미\n    해시로 항상 같은 비교 연산을 거치게 해서 응답 시간을 균일화한다.\n    \"\"\"\n    user = get_user_by_username(username)\n    password_hash = user[\"password_hash\"] if user else _DUMMY_PASSWORD_HASH\n    result = check_password_hash(password_hash, password)\n    return result if user else False", "alias": {"call": "db.verify_user_credentials()", "via": "db/__init__.py", "real": "db/users.py"}}, "db/users.py:get_user_by_username": {"path": "db/users.py", "start": 20, "end": 30, "lang": "python", "code": "def get_user_by_username(username: str) -> dict | None:\n    \"\"\"아이디로 사용자 한 명을 찾는다. 없으면 None을 돌려준다.\"\"\"\n    res = (\n        db.get_client()\n        .table(\"users\")\n        .select(\"*\")\n        .eq(\"username\", username)\n        .limit(1)\n        .execute()\n    )\n    return res.data[0] if res.data else None", "alias": {"call": "db.get_user_by_username()", "via": "db/__init__.py", "real": "db/users.py"}}, "db/attempts.py:log_attempt": {"path": "db/attempts.py", "start": 19, "end": 26, "lang": "python", "code": "def log_attempt(ip: str, username: str, success: bool) -> None:\n    \"\"\"로그인 시도 한 건을 login_attempts 표에 새 줄로 저장한다.\n\n    CCTV처럼 \"누가 지나갔다\"는 기록을 계속 쌓기만 하고, 절대 지우거나 덮어쓰지 않는다.\n    \"\"\"\n    db.get_client().table(\"login_attempts\").insert(\n        {\"ip_address\": ip, \"username\": username, \"success\": success}\n    ).execute()", "alias": {"call": "db.log_attempt()", "via": "db/__init__.py", "real": "db/attempts.py"}}, "routes/member.py:member_dashboard": {"path": "routes/member.py", "start": 52, "end": 69, "lang": "python", "code": "@member_bp.route(\"/dashboard\", methods=[\"GET\"])\n@member_login_required\ndef member_dashboard():\n    \"\"\"로그인한 회원 본인을 위한 첫 화면. 인사말, 이동 링크 3개(로그인 기록·프로필·게시판),\n    그리고 이메일이 아직 인증되지 않았으면 인증 안내 배너(guide40)를 보여준다.\n\n    인사말에는 \"표시 이름\"(user.name)이 설정돼 있으면 그걸 쓰고, 아직 프로필을\n    한 번도 안 고쳐서 비어있으면(기본값 '') 로그인 아이디로 대신 보여준다.\n    (예전 버전은 항상 아이디만 보여줬는데, 프로필에서 이름을 바꿔도 인사말에\n    반영되지 않는 것처럼 보이는 문제가 있었다 — 이번에 고쳤다.)\n    \"\"\"\n    user = db.get_user_by_id(session[\"user_id\"])\n    if user is None:\n        return _logout_missing_member()\n    display_name = user[\"name\"] if user[\"name\"] else session[\"username\"]\n    return render_template(\n        \"member_dashboard.html\", display_name=display_name, email_status=user.get(\"email_status\")\n    )", "alias": null}, "security/detector.py:is_suspicious": {"path": "security/detector.py", "start": 27, "end": 38, "lang": "python", "code": "def is_suspicious(ip: str) -> tuple[bool, int]:\n    \"\"\"이 IP가 \"수상한 상태\"인지 판단한다.\n\n    판단 기준: 최근 60초(config.DETECTION_WINDOW_SECONDS) 안에 실패한 횟수가\n    기준치(FAILURE_THRESHOLD, 기본 5회)를 \"초과\"했는가?\n\n    반환값은 (수상한가?, 실제 실패 횟수) 형태의 튜플(값 2개를 한 번에 묶어서 돌려주는 것).\n    예: (True, 6)  → \"수상함, 지금까지 6번 실패했음\"\n        (False, 3) → \"아직 수상하지 않음, 3번 실패했음\"\n    \"\"\"\n    failure_count = db.count_recent_failures(ip)\n    return failure_count > FAILURE_THRESHOLD, failure_count", "alias": null}, "security/detector.py:is_account_suspicious": {"path": "security/detector.py", "start": 54, "end": 63, "lang": "python", "code": "def is_account_suspicious(username: str) -> tuple[bool, int]:\n    \"\"\"이 계정(아이디)이 여러 IP에 걸쳐 분산 공격당하고 있는 상태인지 판단한다.\n\n    is_suspicious(ip)는 \"한 IP가 얼마나 실패했는가\"만 보므로, 공격자가 IP를\n    나눠 쓰면(봇넷/프록시 로테이션) 각 IP는 임계값을 넘기지 않는다. 이 함수는\n    IP와 무관하게 \"이 계정이 총 몇 번 실패당했는가\"(ACCOUNT_FAILURE_THRESHOLD,\n    기본 8회)를 기준으로 판단해서 그 빈틈을 메운다 (L7 공격 보강 계획 Tier 1).\n    \"\"\"\n    failure_count = db.count_recent_failures_by_username(username)\n    return failure_count > ACCOUNT_FAILURE_THRESHOLD, failure_count", "alias": null}, "security/soar/lockouts.py:enforce_lockout": {"path": "security/soar/lockouts.py", "start": 17, "end": 58, "lang": "python", "code": "def enforce_lockout(\n    ip: str, failure_count: int, distinct_usernames: int, is_admin: bool = False\n) -> None:\n    \"\"\"이 IP에 실제로 잠금을 걸고, 그 사실을 Slack으로 알리고, CRITICAL 이벤트로 기록한다.\n\n    네 단계로 이루어진다:\n    1. db.create_lockout()으로 \"이 IP는 지금부터 5분간 잠김\"을 데이터베이스에 저장\n    2. alert.send_lockout_alert()로 \"IP, 실패 횟수, 조치 내용\"을 담은 알림을 전송\n    3. _record_event()로 위험등급(CRITICAL)과 함께 security_events에 기록하고 상관분석 훅 호출\n       (security-risk-response-summary.md 5절 — 관리자 대시보드/이력 조회용)\n    4. lockdown.after_temporary_lock()으로 잠금 이력을 남기고 영구 잠금 승격 여부 판단(guide33)\n\n    알림을 \"잠그는 순간에 딱 한 번만\" 보내는 이유: 만약 잠긴 상태에서도 계속\n    로그인을 시도할 때마다 매번 알림을 보내면, 관리자가 알림 폭탄을 맞아 정작\n    중요한 알림을 놓치게 된다(이른바 \"알림 피로\"). 그래서 \"새로 잠기는 순간\"에만 알린다.\n\n    distinct_usernames는 detector.count_distinct_usernames()(또는 관리자용)가 센\n    \"이 IP가 최근에 시도한 서로 다른 아이디 개수\"다 — 1개면 계정 하나에 집중된\n    Brute Force, 2개 이상이면 여러 계정을 돌아가며 두드리는 Password Spraying으로\n    의심할 수 있으므로, notify/alert.py가 Slack 메시지에 이 값으로 패턴을 구분해 보여준다.\n\n    is_admin은 이 잠금이 /login이 아니라 /admin/login에서 발생했는지를 나타낸다 —\n    관리자 로그인 무차별 대입은 Brute Force/Password Spraying과 별도의 event_type으로\n    기록하고, notify/alert.py의 Slack 메시지에도 그대로 표시한다.\n    \"\"\"\n    db.create_lockout(ip, failure_count)\n    alert.send_lockout_alert(\n        ip, failure_count, datetime.now(timezone.utc), distinct_usernames, is_admin\n    )\n\n    if is_admin:\n        event_type = \"ADMIN_BRUTE_FORCE\"\n    elif distinct_usernames > 1:\n        event_type = \"PASSWORD_SPRAYING\"\n    else:\n        event_type = \"BRUTE_FORCE\"\n    _record_event(event_type, \"CRITICAL\", ip, None, failure_count, \"LOCKED\")\n\n    # 잠금 이력을 남기고, 최근 기간 안에 N번째 잠금이면 영구 잠금으로 승격한다\n    # (guide33, T1/T5). 임시 잠금 알림·이벤트 기록이 모두 끝난 뒤에 실행해서, 영구\n    # 잠금 이벤트(PERMANENT_LOCK)가 같은 사건의 \"그 다음 단계\"로 기록되게 한다.\n    lockdown.after_temporary_lock(\"ip\", ip, event_type, failure_count)", "alias": {"call": "soar.enforce_lockout()", "via": "security/soar/__init__.py", "real": "security/soar/lockouts.py"}}, "security/soar/lockouts.py:enforce_account_lockout": {"path": "security/soar/lockouts.py", "start": 61, "end": 91, "lang": "python", "code": "def enforce_account_lockout(\n    username: str, failure_count: int, distinct_ip_count: int, triggering_ip: str\n) -> None:\n    \"\"\"이 계정에 실제로 잠금을 걸고, Slack으로 알리고, CRITICAL 이벤트로 기록한다.\n\n    enforce_lockout()(IP 잠금)과 짝을 이루는 계정 잠금 버전이다 — 공격이 여러\n    IP에 나뉘어 있어 IP 잠금만으로는 못 잡을 때, 계정 자체를 잠가서 막는다\n    (L7 공격 보강 계획 Tier 1: 분산/저속 브루트포스 대응).\n\n    triggering_ip는 \"잠금을 유발한 마지막 시도의 IP\"다 — 실제 잠금 판단\n    기준(계정 전체 실패 횟수, IP와 무관)과는 별개로, security_events에서\n    이벤트를 훑어보는 관리자가 \"가장 최근엔 어디서 왔는지\" 참고할 수 있게\n    남겨둔다.\n    \"\"\"\n    db.create_account_lockout(username, failure_count)\n    alert.send_account_lockout_alert(\n        username, failure_count, datetime.now(timezone.utc), distinct_ip_count\n    )\n    _record_event(\n        \"DISTRIBUTED_BRUTE_FORCE\",\n        \"CRITICAL\",\n        triggering_ip,\n        None,\n        failure_count,\n        \"ACCOUNT_LOCKED\",\n        username=username,\n    )\n    # 계정 잠금 이력 + 영구 승격 판단(guide33, T2). enforce_lockout()의 같은 자리 주석 참고.\n    lockdown.after_temporary_lock(\n        \"account\", username, \"DISTRIBUTED_BRUTE_FORCE\", failure_count, triggering_ip=triggering_ip\n    )", "alias": {"call": "soar.enforce_account_lockout()", "via": "security/soar/__init__.py", "real": "security/soar/lockouts.py"}}, "security/soar/early_warning.py:consider_early_warning": {"path": "security/soar/early_warning.py", "start": 41, "end": 104, "lang": "python", "code": "def consider_early_warning(\n    event_type: str,\n    pending_action: str,\n    target_kind: str,\n    target_value: str,\n    count: int,\n    threshold: int,\n    path: str | None = None,\n    context_count: int | None = None,\n    context_ip: str | None = None,\n) -> None:\n    \"\"\"임계값 코앞 구간에 진입한 대상 하나를 LLM에게 보여주고, 위험하다고\n    판단되면 access_requests에 PENDING 요청을 등록한다.\n\n    호출부(routes/auth.py, helpers/auth.py, helpers/hooks.py)는 전부 \"아직 suspicious가\n    False인\" 분기에서만 이 함수를 부른다 — 이미 규칙이 조치를 실행하는\n    경우와 절대 겹치지 않는다.\n\n    LLM 쪽이 실패해도 예외를 밖으로 던지지 않는다: LLM 호출이 실패하거나\n    GROQ_API_KEY가 없으면(llm_client.judge_early_warning이 None을 돌려줌)\n    그냥 조용히 넘어간다. 이 구간은 원래 Track A 이전에는 아무 조치도 없던\n    사각지대였으므로, \"덤으로 추가한 조기 경보 기능\"이 실패한다고 해서\n    로그인 흐름 자체가 막히거나 원래 있던 임계값 기반 방어가 약해지면\n    안 되기 때문이다.\n\n    같은 (event_type, target_kind, target_value)에 이미 PENDING 요청이 있으면\n    새로 LLM을 호출하지 않는다 — 관리자가 하나를 처리하기 전까지 매 요청마다\n    Groq를 부르고 Slack을 또 보내는 건 낭비이자 알림 피로다.\n\n    path/context_count/context_ip는 유형마다 의미가 다르다 — LOCK_IP(로그인\n    브루트포스)는 context_count에 distinct_usernames를, LOCK_ACCOUNT(분산\n    브루트포스)는 context_count에 distinct_ips·context_ip에 이번 시도의 IP를,\n    ALERT_ONLY 유형들은 path에 관련 경로를 담아 나중에 execute_approved_request()가\n    승인 시 실행할 조치에 그대로 넘겨준다. path/context_count는 access_requests에\n    저장하는 용도와 별개로, llm_client.judge_early_warning()에게 판단 근거로도\n    그대로 전달한다 — 처음 버전은 이 값들을 계산해두고도 LLM에게는 안 보여주고\n    있었다(login_watchdog_expansion_plan.md 논의).\n    \"\"\"\n    if db.get_pending_request(event_type, target_kind, target_value) is not None:\n        return\n\n    label = _EARLY_WARNING_LABELS.get(event_type, event_type)\n    prior_occurrences = db.count_recent_requests_for_target(event_type, target_kind, target_value)\n    judgment = llm_client.judge_early_warning(\n        label, target_kind, target_value, count, threshold,\n        path=path, context_count=context_count, prior_occurrences=prior_occurrences,\n    )\n    if judgment is None or not judgment.get(\"risky\"):\n        return\n\n    reason = judgment.get(\"reason\", \"\")\n    db.insert_pending_request(\n        event_type,\n        pending_action,\n        target_kind,\n        target_value,\n        count,\n        threshold,\n        reason,\n        path=path,\n        context_count=context_count,\n        context_ip=context_ip,\n    )\n    alert.send_pending_approval_alert(label, target_kind, target_value, count, threshold, reason)", "alias": {"call": "soar.consider_early_warning()", "via": "security/soar/__init__.py", "real": "security/soar/early_warning.py"}}}, "files": {"templates/signup.html": {"role": "회원가입 화면. 아이디·이메일·비밀번호 입력칸과 '가입하기' 버튼이 있다.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/templates/signup.html"}, "routes/auth.py": {"role": "회원가입(/signup)과 로그인(/login) 요청을 받아 처리 순서를 지휘하는 '입구' 파일.", "header": "routes/auth.py — 회원가입(/signup) + 감시 대상 로그인(/login)\n원래 app.py의 \"회원가입 입력 검증 규칙\" / \"회원가입\" / \"감시 대상 로그인\"\n세 섹션을 그대로 옮겨왔다. 배경은 docs/refactor/2026-09-15-file-split.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/auth.py"}, "db/settings.py": {"role": "앱 설정값(회원가입 허용 여부)과 가입 시도 기록·집계를 다루는 저장소 파일.", "header": "db/settings.py — app_settings / signup_attempts 표 관련 함수\n— app_settings: 서버 전체가 공유하는 설정값 (지금은 회원가입 On/Off 하나)\n— signup_attempts: 회원가입 요청 빈도 제한 (18단계 보안 점검 보완). login_attempts와\n별도 표를 쓰는 이유: 회원가입은 성공/아이디 값과 무관하게 \"이 IP가 얼마나\n자주 두드렸는가\"만 세면 되므로, 더 가벼운 구조로 분리했다.\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/settings.py"}, "helpers/request_utils.py": {"role": "요청에서 IP 주소를 알아내거나 봇 함정(허니팟)을 확인하는 공용 도구.", "header": "helpers/request_utils.py — 요청 정보(IP, 허니팟) 읽기와 화면용 작은 변환 함수\n예전 helpers.py(314줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from helpers import ...`로 가져다 쓴다(helpers/__init__.py가\n재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/helpers/request_utils.py"}, "security/soar/observe.py": {"role": "잠그지 않고 알림·기록만 남기는 집행관 파일. (10단원)", "header": "security/soar/observe.py — 잠그지 않고 관찰만 하는 조치(알림 + 이벤트 기록)와 요청 거부 기록\n예전 soar.py(497줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from security import soar` 후 `soar.enforce_lockout(...)`으로\n쓴다(security/soar/__init__.py가 재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/soar/observe.py"}, "security/detector.py": {"role": "'수상한가?'를 판정만 하는 판사 역할 파일. 조치는 하지 않는다. (5·6단원에서 자세히)", "header": "security/detector.py — \"판사\" 역할: 지금 이 IP가 수상한지, 지금 잠겨있는지만 판단한다\n이 파일은 데이터베이스의 상태를 절대 바꾸지 않는다(아무것도 저장/수정/삭제하지 않음).\n오직 db에게 \"지금 상태가 어때?\"라고 물어보고, 그 답을 바탕으로\nTrue/False 같은 \"판정 결과\"만 돌려준다.\n실제로 잠그거나 알림을 보내는 \"실행\"은 이 파일이 아니라 security/soar/가 담당한다\n(판단과 실행을 분리해두면, \"판단 기준만 바꾸고 싶다\" 같은 수정이 훨씬 쉬워진다).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/detector.py"}, "db/lockouts.py": {"role": "IP 잠금 현재 상태를 읽고 쓰는 저장소 파일.", "header": "db/lockouts.py — lockouts 표 관련 함수\n— \"지금 어떤 IP가 잠겨있고, 언제 풀리는지\"라는 \"현재 상태\"를 관리하는 기능\n(login_attempts가 \"지나간 일의 기록\"이라면, lockouts는 \"지금 이 순간의 상태판\")\ndb.get_client()/db._now_iso()를 통해 호출하는 이유는 db/attempts.py 상단\n설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/lockouts.py"}, "config.py": {"role": "아이디·이메일·비밀번호 규칙, 임계값 등 프로젝트 공용 설정값 모음.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/config.py"}, "db/users.py": {"role": "회원(users 표) 가입·조회·비밀번호 확인을 담당하는 저장소 파일.", "header": "db/users.py — users 표 관련 함수 (회원가입 기능)\n— 감시 대상이 되는 가짜 로그인 화면(/login)에 실제로 가입해서 로그인하는\n\"일반 사용자\" 계정을 관리하는 기능. 관리자(admin_users)와는 완전히 별개 개념.\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/users.py"}, "services/email_verification.py": {"role": "가입 이메일로 인증 링크를 보내는 파일. (23단원)", "header": "services/email_verification.py — \"이메일 담당\": 이메일 인증 / 이메일 변경 확인 링크를 만들고 처리한다 (guide40)\n왜 필요한가: 비밀번호 재설정(guide41)은 \"계정을 되찾는 메일\"이라 확인된 주소로만 보내야 한다.\n그런데 지금까지 가입 이메일은 형식만 검사했고(오타·남의 주소 그대로 저장), 이메일 변경은 세션만\n있으면 비밀번호 확인도 없이 바로 됐다(세션 탈취 → 이메일 바꿔치기 → 계정 탈취). 이 모듈이\n1) 가입 직후·대시보드에서 인증 링크를 보내고(EMAIL_VERIFY → users.email_status = VERIFIED)\n2) 이메일 변경을 \"새 주소로 보낸 링크를 눌러야 반영\"되게 하고(EMAIL_CHANGE), 바뀌면 옛 주소로 알린다.\n원칙은 영구 잠금 복구(routes/recovery.py)와 같다 — 토큰은 해시만 저장, 링크는 PUBLIC_BASE_URL로만,\nGET은 확인 화면만(메일 스캐너가 미리 열어도 안 닳게) 실제 처리는 POST에서 조건부 1회 소비.\n메일 링크를 눌렀다는 것 자체가 그 메일함의 주인이라는 증거라서, 처리하면 VERIFIED가 된다.\n비밀번호 재설정(guide41)도 같은 표(email_tokens, PASSWORD_RESET)와 같은 원칙으로 이 파일이 처리한다 —\n단, 재설정 메일은 \"계정을 되찾는 메일\"이라 VERIFIED 주소에만 보낸다.\n라우트(routes/member.py, routes/email.py, routes/auth.py, routes/password.py, routes/recovery.py)는 \"언제\" 부를지만 정하고, 실제\n판단·발송은 전부 이 파일이 한다 — notify/alert.py·notify/mailer.py처럼 결과를 예외 대신 값으로 돌려준다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/services/email_verification.py"}, "templates/login_form.html": {"role": "로그인 화면. 회원 로그인과 관리자 로그인이 같은 화면 틀을 같이 쓴다.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/templates/login_form.html"}, "security/soar/lockouts.py": {"role": "판정 결과를 받아 IP·계정을 실제로 잠그거나 푸는 집행관 파일. (10단원)", "header": "security/soar/lockouts.py — 잠금 집행(IP/회원 계정/관리자 계정)과 자동·수동 해제\n예전 soar.py(497줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from security import soar` 후 `soar.enforce_lockout(...)`으로\n쓴다(security/soar/__init__.py가 재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/soar/lockouts.py"}, "db/account_lockouts.py": {"role": "계정 단위 잠금 상태를 읽고 쓰는 저장소 파일.", "header": "db/account_lockouts.py — account_lockouts 표 관련 함수\n— \"지금 어떤 계정(아이디)이 잠겨있고, 언제 풀리는지\"라는 \"현재 상태\"를 관리한다.\ndb/lockouts.py(IP 단위 잠금)와 짝을 이루는 계정 단위 잠금이다 — 공격자가 여러\nIP로 나눠서(또는 느린 속도로) 같은 계정만 노리면 IP당 실패 횟수는 임계값을\n넘지 않아 lockouts로는 못 잡는다. 이 표는 IP와 무관하게 \"이 계정이 총 몇 번\n실패했는가\"를 기준으로 잠근다 (L7 공격 보강 계획 Tier 1).\ndb.get_client()를 통해 호출하는 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/account_lockouts.py"}, "db/attempts.py": {"role": "로그인 시도(login_attempts 표)를 기록·집계하는 저장소 파일.", "header": "db/attempts.py — login_attempts 표 관련 함수\n— \"누가 언제 어떤 IP에서 로그인에 성공/실패했는지\"를 기록하고 조회하는 기능\n원래 db.py의 같은 이름 섹션을 그대로 옮겨왔다. 이 모듈은 내부에서 `import db`로\n패키지 최상위(db/__init__.py)를 다시 참조해서 db.get_client()를 호출한다 —\ndb.attempts.get_client가 아니라 이렇게 해야, 테스트가\nmonkeypatch.setattr(db, \"get_client\", ...)로 db 패키지의 get_client를 바꿔치기\n했을 때 이 파일의 함수들도 그 가짜 버전을 그대로 쓰게 된다(값을 미리 복사해서\n이 파일 안에 별도 이름으로 묶어두면 그 바꿔치기가 안 먹는다).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/attempts.py"}, "routes/member.py": {"role": "로그인한 회원이 보는 화면(대시보드·프로필 등)의 입구. (2단원에서 자세히)", "header": "routes/member.py — 회원 대시보드 (/dashboard) — 전부 member_login_required로 보호됨\n이름이 \"/admin/dashboard\"와 비슷해 보이지만 완전히 다른 화면이다. 회원은\n본인 계정에 관한 정보만 볼 수 있고, 다른 회원 정보나 관리자 기능(잠긴 IP,\n전체 회원 목록 등)에는 접근할 수 없다 — member_login_required와\nlogin_required가 서로 다른 세션 키를 확인하기 때문에 이 구분이 코드 수준에서\n강제된다.\n원래 app.py의 \"회원 대시보드\" 섹션을 그대로 옮겨왔다. 배경은\ndocs/refactor/2026-09-15-file-split.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/member.py"}, "security/soar/early_warning.py": {"role": "기준치 코앞일 때 AI에게 조기 경보 여부를 묻는 파일. (11단원)", "header": "security/soar/early_warning.py — LLM 조기 경보와 관리자 승인/반려 (Track A, guide31)\n예전 soar.py(497줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from security import soar` 후 `soar.enforce_lockout(...)`으로\n쓴다(security/soar/__init__.py가 재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/soar/early_warning.py"}}}</script>
<script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var $ = function(id){ return document.getElementById(id); };
  var KIND_LABEL = {screen:"화면 · 도착지", route:"routes", helper:"판단", db:"db", config:"설정값", later:"다른 단원"};

  var state = { sc: 0, node: null, item: 0, file: null };

  function el(tag, attrs, kids){
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function brk(t){ return t.replace(/([\/._])/g, "$1\u200b"); }
  function scen(){ return D.scenarios[state.sc]; }
  function nodeById(id){ return scen().nodes.filter(function(n){ return n.id === id; })[0]; }
  function fnName(label){ return label; }

  /* ---------- 간단 문법 강조 ---------- */
  var PY = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?''')|([rbfRBF]{0,2}"(?:\\.|[^"\\\n])*"|[rbfRBF]{0,2}'(?:\\.|[^'\\\n])*')|\b(def|class|return|if|elif|else|for|while|import|from|as|try|except|finally|with|in|not|and|or|is|None|True|False|raise|pass|lambda|yield|global|nonlocal|assert|del|continue|break)\b|(@[A-Za-z_][\w.]*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(?=\()/g;
  var PYC = [null,"t-c","t-d","t-s","t-k","t-a","t-n","t-f"];
  var HT = /(<!--[\s\S]*?-->)|(\{[{%#][\s\S]*?[}%#]\})|(<\/?[A-Za-z][\w-]*)|("[^"\n]*")|(\/?>)/g;
  var HTC = [null,"t-c","t-a","t-k","t-s","t-k"];
  function tokenize(code, lang){
    var re = lang === "html" ? HT : PY, cls = lang === "html" ? HTC : PYC;
    var lines = [[]];
    function push(text, c){
      var parts = text.split("\n");
      parts.forEach(function(p, i){
        if (i > 0) lines.push([]);
        if (p) lines[lines.length-1].push([p, c]);
      });
    }
    var last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(code)) !== null){
      if (m.index > last) push(code.slice(last, m.index), null);
      var idx = 1; while (idx < m.length && m[idx] === undefined) idx++;
      push(m[0], cls[idx] || null);
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++;
    }
    if (last < code.length) push(code.slice(last), null);
    return lines;
  }

  function codeTable(block, hl){
    var lines = tokenize(block.code, block.lang);
    var tbody = el("tbody");
    var hlFirst = null;
    lines.forEach(function(segs, i){
      var no = block.start + i;
      var on = hl && no >= hl[0] && no <= hl[1];
      var td = el("td", {class:"tx"});
      segs.forEach(function(s){ td.appendChild(s[1] ? el("span", {class:s[1], text:s[0]}) : document.createTextNode(s[0])); });
      if (!segs.length) td.appendChild(document.createTextNode(" "));
      var tr = el("tr", on ? {class:"hl"} : null, [el("td", {class:"ln", text:String(no)}), td]);
      if (on && !hlFirst) hlFirst = tr;
      tbody.appendChild(tr);
    });
    var box = el("div", {class:"codebox"}, [el("table", {class:"code"}, [tbody])]);
    box._hlFirst = hlFirst;
    return box;
  }

  function copyText(text, btn){
    var done = function(){ var o = btn.textContent; btn.textContent = "복사됨 ✓"; setTimeout(function(){ btn.textContent = o; }, 1200); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
    function fallback(){
      var ta = el("textarea", {style:"position:fixed;opacity:0"}); ta.value = text; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); done(); } catch(e){} document.body.removeChild(ta);
    }
  }

  /* ---------- 패널 ---------- */
  function openPanel(){ document.body.classList.add("open"); }
  function closePanel(){ document.body.classList.remove("open"); }

  function showHint(){
    $("pTitle").textContent = "코드 보는 법";
    $("pSub").textContent = "카드나 파일 이름을 누르면 실제 코드가 여기에 열립니다.";
    var ul = el("ul", {class:"hint"}, [
      el("li", {text:"카드(상자)를 누르면 그 단계에서 실행되는 실제 함수 코드가 열려요."}),
      el("li", {text:"카드 안의 📄 파일 이름을 누르면 그 파일이 어떤 역할인지, 이 단원에서 쓰이는 함수가 무엇인지 보여줘요."}),
      el("li", {text:"ƒ 함수 이름을 누르면 해당 함수 코드로 바로 이동해요."}),
      el("li", {text:"노란색 줄이 지금 단계가 담당하는 부분이에요."}),
      el("li", {text:"db.함수() 처럼 적혀 있어도 실제 코드는 db/users.py 같은 다른 파일에 있어요. 카드에 그 '진짜 파일'을 표시하고, 코드 위에 찾아가는 길도 그려줘요."}),
      el("li", {text:"위쪽 ◀ ▶ 버튼으로 실행 순서대로 한 단계씩 따라갈 수 있어요."})
    ]);
    var b = $("pBody"); b.textContent = ""; b.appendChild(ul);
  }

  function renderAlias(a){
    if (!a) return null;
    return el("div", {class:"alias"}, [
      el("div", {text:"코드에는 이렇게 적혀 있지만, 실제 함수는 다른 파일에 있어요."}),
      el("div", {class:"route"}, [
        el("span", {class:"step", text:a.call}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step", text:a.via + " (창구)"}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step real", text:a.real})
      ])
    ]);
  }

  function selectNode(id, itemIdx){
    var n = nodeById(id); if (!n) return;
    state.node = id; state.item = itemIdx || 0; state.file = null;
    $("pTitle").textContent = n.title;
    $("pSub").textContent = n.plain;
    var body = $("pBody"); body.textContent = "";
    if (n.reject) body.appendChild(el("div", {class:"n-reject", text:n.reject, style:"margin:0 0 10px"}));
    if (n.items.length > 1){
      var tabs = el("div", {class:"itabs", role:"tablist"});
      n.items.forEach(function(it, i){
        tabs.appendChild(el("button", {class:"itab", role:"tab", "aria-selected":String(i === state.item), text:it.label,
          onclick:function(){ selectNode(id, i); }}));
      });
      body.appendChild(tabs);
    }
    var it = n.items[state.item];
    var block = D.blocks[it.block];
    var linesTxt = it.hl ? (it.hl[0] === it.hl[1] ? it.hl[0] + "줄" : it.hl[0] + "–" + it.hl[1] + "줄") : "";
    var fl = el("div", {class:"fileline"}, [
      el("button", {class:"chip file", onclick:function(){ selectFile(block.path); }, text:block.path}),
      el("span", {class:"lines", text: block.start + "–" + block.end + "줄 표시" + (linesTxt ? " · 노란색 " + linesTxt : "")}),
      el("span", {class:"spacer"}),
      el("button", {class:"btn", text:"복사", onclick:function(e){ copyText(block.code, e.currentTarget); }}),
      el("a", {class:"btn link", href:D.files[block.path].github + "#L" + block.start + "-L" + block.end, target:"_blank", rel:"noopener", text:"GitHub ↗"})
    ]);
    body.appendChild(fl);
    var al = renderAlias(block.alias); if (al) body.appendChild(al);
    var box = codeTable(block, it.hl);
    body.appendChild(box);
    if (it.hl) body.appendChild(el("p", {class:"legend-hl"}, [el("b", {text:"노란색"}), " = 이 카드가 담당하는 줄"]));
    refreshSelection();
    openPanel();
    if (box._hlFirst){
      var off = box._hlFirst.offsetTop - 60;
      box.scrollTop = Math.max(0, off);
    }
    updateStepper();
  }

  function selectFile(path){
    state.file = path; state.node = null;
    var f = D.files[path];
    $("pTitle").textContent = "📄 " + path;
    $("pSub").textContent = f.role;
    var body = $("pBody"); body.textContent = "";
    body.appendChild(el("div", {class:"fileline"}, [
      el("a", {class:"btn link", href:f.github, target:"_blank", rel:"noopener", text:"GitHub에서 파일 열기 ↗"})
    ]));
    body.appendChild(el("h3", {text:"이 단원에서 쓰이는 함수", style:"font-size:13.5px;margin:12px 0 0"}));
    var ul = el("ul", {class:"flist"}), seen = {};
    D.scenarios.forEach(function(sc, si){
      sc.nodes.forEach(function(n){
        n.items.forEach(function(it, ii){
          var b = D.blocks[it.block]; if (b.path !== path) return;
          var key = si + n.id + ii; if (seen[key]) return; seen[key] = 1;
          var li = el("li");
          li.appendChild(el("button", {onclick:function(){
            if (state.sc !== si) switchScenario(si);
            selectNode(n.id, ii); scrollToNode(n.id);
          }}, [
            el("span", {class:"mono", text:it.label}), el("small", {text:sc.name + " · " + n.title})
          ]));
          ul.appendChild(li);
        });
      });
    });
    body.appendChild(ul);
    if (f.header){
      var d = el("details", {class:"hdr"}, [el("summary", {text:"파일 맨 위 설명 주석 보기"}), el("pre", {text:f.header})]);
      body.appendChild(d);
    }
    refreshSelection();
    openPanel();
  }

  /* ---------- 흐름도 ---------- */
  var cols, colIndex, nodeEls = {};
  function renderStage(){
    var sc = scen();
    var used = {}; sc.nodes.forEach(function(n){ used[n.col] = 1; });
    cols = Object.keys(used).map(Number).sort(function(a,b){ return a-b; });
    colIndex = {}; cols.forEach(function(c, i){ colIndex[c] = i + 1; });
    var stage = $("stage");
    stage.textContent = "";
    stage.style.gridTemplateColumns = "repeat(" + cols.length + ", 196px)";
    nodeEls = {};

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "edges"); svg.id = "edges";
    svg.innerHTML = '<defs>' +
      '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-call" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '</defs>';
    stage.appendChild(svg);

    cols.forEach(function(c){
      stage.appendChild(el("div", {class:"colhead", style:"grid-column:" + colIndex[c] + ";grid-row:1", text:D.columns[c]}));
    });
    var cells = {};
    sc.nodes.forEach(function(n){
      var k = n.row + ":" + n.col;
      if (!cells[k]){
        cells[k] = el("div", {class:"cell", style:"grid-column:" + colIndex[n.col] + ";grid-row:" + (n.row + 2)});
        stage.appendChild(cells[k]);
      }
      var node = buildNode(n);
      nodeEls[n.id] = node;
      cells[k].appendChild(node);
    });
    $("intro").textContent = sc.intro;
    scheduleEdges();
  }

  function buildNode(n){
    var node = el("div", {class:"node " + n.kind, role:"button", tabindex:"0", "aria-pressed":"false", "data-id":n.id,
      onclick:function(e){ if (e.target.closest(".chip")) return; selectNode(n.id, 0); },
      onkeydown:function(e){ if ((e.key === "Enter" || e.key === " ") && !e.target.closest(".chip")){ e.preventDefault(); selectNode(n.id, 0); } }});
    var title = el("div", {class:"n-title", text:n.title});
    if (n.later) title.appendChild(el("span", {class:"tag-later", text:n.later + "에서 자세히"}));
    node.appendChild(title);
    if (n.kind !== "later" && n.plain) node.appendChild(el("div", {class:"n-plain", text:n.plain}));
    if (n.reject) node.appendChild(el("div", {class:"n-reject", text:n.reject}));
    var items = el("div", {class:"n-items"});
    n.items.forEach(function(it, i){
      var b = D.blocks[it.block];
      var row = el("div", {class:"n-item"});
      if (it.call) row.appendChild(el("div", {class:"n-call", text:brk(it.call)}));
      var chips = el("div", {class:"chips"}, [
        el("button", {class:"chip file", text:brk(b.path), title:"파일 설명 보기", onclick:function(){ selectFile(b.path); }}),
        el("button", {class:"chip " + (it.snippet ? "snip" : "fn"), text:it.label, title:"코드 보기", onclick:function(){ selectNode(n.id, i); }})
      ]);
      row.appendChild(chips);
      items.appendChild(row);
    });
    node.appendChild(items);
    return node;
  }

  function rectIn(elm, host){
    var a = elm.getBoundingClientRect(), h = host.getBoundingClientRect();
    return {l:a.left-h.left, r:a.right-h.left, t:a.top-h.top, b:a.bottom-h.top, cx:(a.left+a.right)/2-h.left, cy:(a.top+a.bottom)/2-h.top};
  }
  var raf = 0;
  function scheduleEdges(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(drawEdges); }
  function drawEdges(){
    var stage = $("stage"), svg = $("edges"), sc = scen();
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){ p.remove(); });
    Array.prototype.slice.call(stage.querySelectorAll(".elabel")).forEach(function(p){ p.remove(); });
    var svgNS = "http://www.w3.org/2000/svg";
    sc.edges.forEach(function(e){
      var a = nodeById(e.from), b = nodeById(e.to);
      var ea = nodeEls[e.from], eb = nodeEls[e.to]; if (!ea || !eb) return;
      var ra = rectIn(ea, stage), rb = rectIn(eb, stage), d, lx, ly;
      if (a.col === b.col){
        if (b.row - a.row <= 1){
          d = "M" + ra.cx + " " + ra.b + " V" + rb.t; lx = ra.cx; ly = (ra.b + rb.t) / 2;
        } else {
          var x = Math.min(ra.l, rb.l) - 30;
          d = "M" + ra.l + " " + ra.cy + " H" + x + " V" + rb.cy + " H" + rb.l; lx = x; ly = (ra.cy + rb.cy) / 2;
        }
      } else {
        var dir = b.col > a.col ? 1 : -1;
        var x1 = dir > 0 ? ra.r : ra.l, x2 = dir > 0 ? rb.l : rb.r;
        var xm = x2 - dir * 30;
        d = "M" + x1 + " " + ra.cy + " H" + xm + " V" + rb.cy + " H" + x2;
        lx = (x1 + x2) / 2; ly = ra.cy;
      }
      var kind = e.kind === "call" ? "call" : "flow";
      var p = document.createElementNS(svgNS, "path");
      p.setAttribute("d", d); p.setAttribute("class", "e " + kind);
      p.setAttribute("marker-end", "url(#" + (kind === "call" ? "ahc" : "ah") + ")");
      p.setAttribute("data-from", e.from); p.setAttribute("data-to", e.to);
      svg.appendChild(p);
      if (e.label && kind === "flow"){
        var lab = el("span", {class:"elabel", text:e.label});
        lab.style.left = lx + "px"; lab.style.top = ly + "px";
        stage.appendChild(lab);
      }
    });
    svg.setAttribute("width", stage.scrollWidth); svg.setAttribute("height", stage.scrollHeight);
    refreshSelection();
  }

  function refreshSelection(){
    Object.keys(nodeEls).forEach(function(id){ nodeEls[id].setAttribute("aria-pressed", String(id === state.node)); });
    var svg = $("edges"); if (!svg) return;
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){
      var on = state.node && (p.getAttribute("data-from") === state.node || p.getAttribute("data-to") === state.node);
      p.classList.toggle("active", !!on);
    });
  }
  function scrollToNode(id){
    var n = nodeEls[id]; if (n && n.scrollIntoView) n.scrollIntoView({block:"center", inline:"center", behavior:"smooth"});
  }

  /* ---------- 단계 이동 / 탭 ---------- */
  function stepIndex(){ return scen().steps.indexOf(state.node); }
  function updateStepper(){
    var steps = scen().steps, i = stepIndex();
    $("stepNo").textContent = i < 0 ? "– / " + steps.length : (i + 1) + " / " + steps.length;
    $("prev").disabled = i <= 0 && state.node !== null ? true : false;
    $("next").disabled = i >= steps.length - 1;
    if (state.node === null){ $("prev").disabled = true; $("next").disabled = false; }
  }
  function go(delta){
    var steps = scen().steps, i = stepIndex();
    var j = i < 0 ? 0 : Math.max(0, Math.min(steps.length - 1, i + delta));
    selectNode(steps[j], 0); scrollToNode(steps[j]);
  }
  function renderTabs(){
    var t = $("tabs"); t.textContent = "";
    D.scenarios.forEach(function(sc, i){
      t.appendChild(el("button", {class:"tab", role:"tab", "aria-selected":String(i === state.sc), text:sc.name, onclick:function(){ switchScenario(i); }}));
    });
  }
  function switchScenario(i){
    state.sc = i; state.node = null; state.file = null;
    renderTabs(); renderStage(); showHint(); updateStepper();
    try { history.replaceState(null, "", "#" + D.scenarios[i].id); } catch(e){}
  }

  /* ---------- 시작 ---------- */
  document.title = D.title + " — 코드 흐름도";
  $("title").textContent = D.title + " · 코드 흐름도";
  $("subtitle").textContent = D.subtitle;
  $("mdlink").setAttribute("href", D.mdFile);
  $("prev").addEventListener("click", function(){ go(-1); });
  $("next").addEventListener("click", function(){ go(1); });
  $("pClose").addEventListener("click", closePanel);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closePanel(); });
  $("theme").addEventListener("click", function(){
    var r = document.documentElement, cur = r.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  });
  window.addEventListener("resize", scheduleEdges);
  if (window.ResizeObserver) new ResizeObserver(scheduleEdges).observe($("stage"));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleEdges);

  var startId = (location.hash || "").replace("#", "");
  var startIdx = 0; D.scenarios.forEach(function(s, i){ if (s.id === startId) startIdx = i; });
  switchScenario(startIdx);
  // 화면 확인/테스트용 지름길: window.__flow.select("s7")
  window.__flow = { select: function(id, i){ selectNode(id, i || 0); }, file: selectFile, state: state };
})();
</script>
</body>
</html>
