<!--
  board_form.html — 글쓰기/수정 공용 폼 (주소: /board/new, /board/<id>/edit)

  login_form.html이 /login과 /admin/login 화면을 하나로 공유하는 것과 동일한
  패턴 — post가 None이면 "새 글쓰기", 값이 있으면 "수정" 화면으로 스스로
  판단한다. 실제로 어디로 제출할지는 app.py가 form_action으로 넘겨준다.
-->
<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>로그인 워치독 — {{ '게시글 수정' if post else '새 게시글 작성' }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/member.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/board.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
    <header class="topbar">
        <h1>로그인 워치독</h1>
        <div class="topbar-actions">
            <button id="theme-toggle" type="button" class="theme-toggle">다크 모드</button>
            <form method="post" action="{{ url_for('member_logout') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="logout-btn">로그아웃</button>
            </form>
        </div>
    </header>

    <main>
        <div class="member-card board-card">
            <h2>{{ '게시글 수정' if post else '새 게시글 작성' }}</h2>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <ul class="flash-list">
                        {% for message in messages %}
                            <li>{{ message }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            {% endwith %}

            <form method="post" action="{{ form_action }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label for="title">제목</label>
                <input type="text" id="title" name="title" maxlength="100"
                       value="{{ post.title if post else '' }}" required>

                <label for="body">내용</label>
                <textarea id="body" name="body" rows="10" maxlength="5000"
                          required>{{ post.body if post else '' }}</textarea>

                <button type="submit">{{ '수정 완료' if post else '등록하기' }}</button>
            </form>

            <a class="back-link"
               href="{{ url_for('board_detail', post_id=post.id) if post else url_for('board_list') }}">← 돌아가기</a>
        </div>
    </main>
</body>
</html>
