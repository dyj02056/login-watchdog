  .edges path{fill:none;stroke:var(--edge);stroke-width:1.6}
  .edges path.call{stroke:var(--edge-call);stroke-dasharray:5 4}
  .edges path.active{stroke:var(--accent);stroke-width:2.4;stroke-dasharray:none}
  .edges .head{fill:var(--edge)}
  .edges .head-call{fill:var(--edge-call)}
  .elabel{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;
    background:var(--surface);border:1px solid var(--border);color:var(--ink-muted);white-space:nowrap;pointer-events:none}

  .colhead{font-size:12px;font-weight:700;color:var(--ink-muted);text-transform:none;border-bottom:2px solid var(--border);padding-bottom:6px;align-self:end}

  .node.db{--k:var(--k-db);--ks:var(--k-db-soft)}

  .n-items{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .n-item{display:flex;flex-direction:column;gap:3px}
  .n-call{overflow-wrap:anywhere;font-family:var(--mono);font-size:11.5px;color:var(--k);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:5px}

  .chip:hover{border-color:var(--k);color:var(--k)}
  .chip.file::before{content:"📄 "}
  .chip.fn::before{content:"ƒ ";color:var(--k);font-weight:700}
  .chip.snip::before{content:"▤ ";color:var(--k);font-weight:700}
  .tag-later{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--ink-muted);border:1px solid var(--border);border-radius:999px;padding:0 7px;background:var(--surface)}

  .splitter{flex:none;position:relative;z-index:6;width:11px;margin:0 -5px;cursor:col-resize;touch-action:none;outline:none}
  .splitter::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:1px;background:var(--border);transition:background .12s,width .12s,left .12s}
  .splitter::after{content:"";position:absolute;left:3px;top:50%;width:5px;height:44px;margin-top:-22px;border-radius:3px;background:var(--border);transition:background .12s}

ain": "두 로그가 모두 120초 넘게 늘지 않으면 stalled 로 표시해 30초 heartbeat에 실어 보냅니다. 한 파일만 보면 공격이 없을 때 l4.json이 원래 안 늘어 오판하기 때문에 두 파일을 함께 봅니다(39단원).", "reject": "", "later": "", "items": [{"block": "netwatch/shipper/eve_shipper.py:StallWatch.observe", "hl": [451, 459], "label": "StallWatch.observe()", "call": null, "snippet": false}]}], "edges": [{"from": "ship_n1", "to": "ship_n2", "label": "", "kind": "flow"}, {"from": "ship_n2", "to": "ship_n3", "label": "", "kind": "call"}, {"from": "ship_n2", "to": "ship_n4", "label": "", "kind": "flow"}, {"from": "ship_n4", "to": "ship_n5", "label": "", "kind": "call"}, {"from": "ship_n4", "to": "ship_n6", "label": "", "kind": "flow"}, {"from": "ship_n6", "to": "ship_n7", "label": "", "kind": "call"}, {"from": "ship_n6", "to": "ship_n8", "label": "", "kind": "flow"}], "steps": ["ship_n1", "ship_n2", "ship_n4", "ship_n6", "ship_n8"]}], "blocks": {"netwatch/nginx/nginx.conf:50-60": {"path": "netwatch/nginx/nginx.conf", "start": 50, "end": 60, "lang": "python", "code": "        location / {\n            proxy_pass http://app:5000;\n            proxy_http_version 1.1;\n\n            # Flask 앱에 원래 요청 정보를 전달한다.\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n\n            # 사용자가 보낸 값을 이어 붙이지 않고 실제 연결 IP로 덮어쓴다.\n            proxy_set_header X-Forwarded-For $remote_addr;\n            proxy_set_header X-Forwarded-Proto $scheme;", "alias": null}, "netwatch/nginx/nginx.conf:46-47": {"path": "netwatch/nginx/nginx.conf", "start": 46, "end": 47, "lang": "python", "code": "        location ^~ /api/internal/ {\n            return 404;", "alias": null}, "netwatch/suricata/rules/local.rules:19-19": {"path": "netwatch/suricata/rules/local.rules", "start": 19, "end": 19, "lang": "python", "code": "alert tcp any any -> $HOME_NET 8080 (msg:\"LW SYN flood suspected\"; flags:S,12; threshold:type both, track by_src, count 100, seconds 5; classtype:attempted-dos; sid:9000001; rev:1;)", "alias": null}, "netwatch/suricata/rules/local.rules:23-23": {"path": "netwatch/suricata/rules/local.rules", "start": 23, "end": 23, "lang": "python", "code": "alert http any any -> $HOME_NET 8080 (msg:\"LW scanner user-agent\"; flow:to_server,established; http.user_agent; pcre:\"/(sqlmap|nikto|nmap|masscan|dirbuster|gobuster)/i\"; classtype:web-application-attack; sid:9000004; rev:1;)", "alias": null}, "netwatch/l4_detector/detector_core.py:L4Detector.observe": {"path": "netwatch/l4_detector/detector_core.py", "start": 546, "end": 643, "lang": "python", "code": "    def observe(\n        self,\n        src_ip: str,\n        dst_port: int,\n        flags: object,\n    ) -> list[dict]:\n        \"\"\"TCP 패킷 하나를 반영하고 새로 발생한 경보를 반환한다.\"\"\"\n        now = float(self.clock())\n        self.packets_seen += 1\n        self._maybe_prune(now)\n\n        if self._is_excluded_source(src_ip):\n            return []\n\n        if not isinstance(dst_port, int) or not 0 <= dst_port <= 65535:\n            return []\n\n        is_syn = has_syn_without_ack(flags)\n        if is_syn:\n            # 출발지 상한과 상관없이 전체 합계에는 항상 넣는다 — 위조 출발지 폭주를 보는 유일한 숫자다.\n            self._prune_global(now)\n            self._global_syn.append((now, src_ip))\n            self._global_sources[src_ip] += 1\n            self._check_global(now)\n\n        self._prune_source(src_ip, now)\n\n        if src_ip not in self._port_events and len(self._port_events) >= self.max_sources:\n            # 확인 안 된(SYN만 본) 출발지를 하나 내보내고 자리를 만든다. 이미 추적 중인 활발한 공격자는\n            # 오래 쉰 순서에서 뒤라 밀려나지 않는다. 내보낼 출발지가 없을 때(전부 확인됨)만 새 출발지를 버린다.\n            if not self._evict_unconfirmed():\n                if self._can_emit(GLOBAL_KEY, \"SOURCE_LIMIT\", now):\n                    self._last_emitted[(GLOBAL_KEY, \"SOURCE_LIMIT\")] = now\n                    self.on_warning(\n                        f\"기록 중인 출발지가 모두 확인된 출발지로 상한 {self.max_sources:,}곳에 도달해 \"\n                        \"새 출발지는 출발지별 판정에서 빠집니다(전체 SYN 합계에는 포함).\"\n                    )\n                return []\n            if self._can_emit(GLOBAL_KEY, \"SOURCE_EVICT\", now):\n                self._last_emitted[(GLOBAL_KEY, \"SOURCE_EVICT\")] = now\n                self.on_warning(\n                    f\"기록 중인 출발지가 상한 {self.max_sources:,}곳에 도달해 확인 안 된 출발지를 \"\n                    f\"밀어냅니다(누적 {self._evicted_count:,}곳). 출발지 위조 폭주일 수 있습니다.\"\n                )\n\n        if has_ack_without_syn(flags):\n            # SYN 뒤 handshake 응답을 받아야 보낼 수 있는 패킷이라 단순 SYN 위조보다 믿을 만하다.\n            self._unconfirmed.pop(src_ip, None)\n            self._confirmed.add(src_ip)\n        elif src_ip not in self._confirmed:\n            self._unconfirmed[src_ip] = None\n            self._unconfirmed.move_to_end(src_ip)\n\n        ports = self._port_events.setdefault(src_ip, {})\n        ports[dst_port] = now\n\n        if is_syn:\n            timestamps = self._syn_events.setdefault(\n                src_ip,\n                deque(),\n            )\n            timestamps.append(now)\n\n        syn_per_sec = len(self._syn_events.get(src_ip, ()))\n        distinct_ports = len(self._port_events.get(src_ip, {}))\n        events: list[dict] = []\n\n        if (\n            syn_per_sec >= self.syn_threshold_per_sec\n            and self._can_emit(src_ip, \"SYN_FLOOD\", now)\n        ):\n            events.append(\n                self._make_event(\n                    timestamp=now,\n                    src_ip=src_ip,\n                    category=\"SYN_FLOOD\",\n                    syn_per_sec=syn_per_sec,\n                    distinct_ports=distinct_ports,\n                )\n            )\n            self._last_emitted[(src_ip, \"SYN_FLOOD\")] = now\n\n        if (\n            distinct_ports >= self.distinct_ports_threshold\n            and self._can_emit(src_ip, \"PORT_SCAN\", now)\n        ):\n            events.append(\n                self._make_event(\n                    timestamp=now,\n                    src_ip=src_ip,\n                    category=\"PORT_SCAN\",\n                    syn_per_sec=syn_per_sec,\n                    distinct_ports=distinct_ports,\n                )\n            )\n            self._last_emitted[(src_ip, \"PORT_SCAN\")] = now\n\n        return events", "alias": null}, "netwatch/l4_detector/detector_core.py:has_syn_without_ack": {"path": "netwatch/l4_detector/detector_core.py", "start": 110, "end": 120, "lang": "python", "code": "def has_syn_without_ack(flags: object) -> bool:\n    \"\"\"TCP 플래그가 SYN을 포함하고 ACK는 포함하지 않는지 확인한다.\"\"\"\n    try:\n        numeric_flags = int(flags)\n    except (TypeError, ValueError):\n        text_flags = str(flags).upper()\n        return \"S\" in text_flags and \"A\" not in text_flags\n\n    return bool(numeric_flags & SYN_FLAG) and not bool(\n        numeric_flags & ACK_FLAG\n    )", "alias": null}, "netwatch/l4_detector/detector_core.py:L4Detector._can_emit": {"path": "netwatch/l4_detector/detector_core.py", "start": 498, "end": 510, "lang": "python", "code": "    def _can_emit(\n        self,\n        src_ip: str,\n        category: str,\n        now: float,\n    ) -> bool:\n        \"\"\"같은 출발지와 경보가 cooldown 안에 출력됐는지 확인한다.\"\"\"\n        last_emitted = self._last_emitted.get((src_ip, category))\n\n        if last_emitted is None:\n            return True\n\n        return now - last_emitted >= self.cooldown_seconds", "alias": null}, "netwatch/l4_detector/detector_core.py:L4Detector._is_excluded_source": {"path": "netwatch/l4_detector/detector_core.py", "start": 395, "end": 405, "lang": "python", "code": "    def _is_excluded_source(self, src_ip: str) -> bool:\n        \"\"\"Gateway 자신과 core 대역의 패킷인지 확인한다.\"\"\"\n        try:\n            address = ipaddress.ip_address(src_ip)\n        except ValueError:\n            return True\n\n        if address in CORE_NETWORK:\n            return True\n\n        return self.gateway_ip is not None and address == self.gateway_ip", "alias": null}, "netwatch/l4_detector/l4_detector.py:write_events": {"path": "netwatch/l4_detector/l4_detector "\",\n    ).strip()\n\n    if not ingest_url:\n        print(\n            \"[FAIL] NET_INGEST_URL이 없어 shipper를 시작하지 않습니다.\",\n            file=sys.stderr,\n        )\n        return 2\n\n    if not ingest_secret:\n        print(\n            \"[FAIL] NET_INGEST_SECRET이 없어 shipper를 시작하지 않습니다.\",\n            file=sys.stderr,\n        )\n        return 2\n\n    app_internal_url = active_environ.get(\n        \"APP_INTERNAL_URL\",\n        DEFAULT_APP_INTERNAL_URL,\n    ).rstrip(\"/\")\n    heartbeat_url = (\n        f\"{app_internal_url}/api/internal/heartbeat\"\n    )\n\n    eve_path = active_environ.get(\n        \"EVE_PATH\",\n        DEFAULT_EVE_PATH,\n    )\n    l4_path = active_environ.get(\n        \"L4_PATH\",\n        DEFAULT_L4_PATH,\n    )\n    try:\n        stall_seconds = float(\n            active_environ.get(\n                \"SHIPPER_STALL_SECONDS\",\n                str(DEFAULT_SHIPPER_STALL_SECONDS),\n            )\n        )\n    except ValueError:\n        print(\n            \"[FAIL] SHIPPER_STALL_SECONDS는 숫자여야 합니다.\",\n            file=sys.stderr,\n        )\n        return 2\n\n    if stall_seconds <= 0:\n        print(\n            \"[FAIL] SHIPPER_STALL_SECONDS는 0보다 커야 합니다.\",\n            file=sys.stderr,\n        )\n        return 2\n\n    # requests는 컨테이너 실행 시에만 필요하다.\n    import requests\n\n    eve_tailer = Tailer(eve_path)\n    l4_tailer = Tailer(l4_path)\n    aggregator = Aggregator(clock)\n    capture_stats = CaptureStats()\n    stall_watch = StallWatch(\n        clock=clock,\n        threshold_seconds=stall_seconds,\n    )\n\n    event_sender = Sender(\n        ingest_url,\n        ingest_secret,\n        requests.Session(),\n        clock,\n        sleeper=sleeper,\n    )\n    heartbeat_sender = Sender(\n        heartbeat_url,\n        ingest_secret,\n        requests.Session(),\n        clock,\n        sleeper=sleeper,\n        max_queue_size=10,\n    )\n\n    event_sender.start()\n    heartbeat_sender.start()\n\n    last_heartbeat = clock()\n\n    print(\n        \"[*] shipper를 시작합니다: \"\n        f\"eve={eve_path}, l4={l4_path}\",\n        flush=True,\n    )\n\n    try:\n        while True:\n            try:\n                process_tailer(\n                    eve_tailer,\n                    \"eve\",\n                    aggregator,\n                    event_sender,\n                    capture_stats,\n                )\n                process_tailer(\n                    l4_tailer,\n                    \"l4\",\n                    aggregator,\n                    event_sender,\n                )\n                previous_stalled = stall_watch.stalled\n\n                stalled, stalled_seconds = stall_watch.observe(\n                    eve_bytes=eve_tailer.last_size,\n                    l4_bytes=l4_tailer.last_size,\n                )\n\n                if stalled != previous_stalled:\n                    if stalled:\n                        print(\n                            \"[WARN] 두 센서 출력이 \"\n                            f\"{stalled_seconds}초 동안 증가하지 않아 \"\n                            \"정지 상태로 판단합니다.\",\n                            file=sys.stderr,\n                            flush=True,\n                        )\n                    else:\n                        print(\n                            \"[OK] 센서 출력 증가를 확인하여 \"\n                            \"정지 상태가 해제되었습니다.\",\n                            flush=True,\n                        )\n\n                for body in aggregator.tick():\n                    event_sender.send(body)\n\n                now = clock()\n\n                if (\n                    now - last_heartbeat\n                    >= HEARTBEAT_INTERVAL_SECONDS\n                ):\n                    heartbeat_sender.send(\n                        heartbeat_body(\n                            eve_tailer,\n                            l4_tailer,\n                            event_sender,\n                            stalled=stall_watch.stalled,\n _dict.get(\"proto\") or \"\").upper()\n            category = \"OTHER\"\n            layer = \"L3\" if proto_name in L3_PROTOCOLS else \"L4\"\n\n        observed_at = utc_iso(\n            line_dict.get(\"timestamp\", time.time())\n        )\n        severity = optional_int(alert.get(\"severity\"))\n\n        if severity not in (1, 2, 3):\n            severity = None\n\n        proto_value = line_dict.get(\"proto\")\n        proto = (\n            str(proto_value).upper()\n            if proto_value is not None\n            else None\n        )\n\n        return {\n            \"sensor\": \"suricata\",\n            \"layer\": layer,\n            \"src_ip\": str(line_dict.get(\"src_ip\", \"\")),\n            \"dst_port\": optional_int(\n                line_dict.get(\n                    \"dest_port\",\n                    line_dict.get(\"dst_port\"),\n                )\n            ),\n            \"proto\": proto,\n            \"category\": category,\n            \"signature_id\": signature_id,\n            \"signature\": str(\n                alert.get(\"signature\") or \"Suricata alert\"\n            )[:200],\n            \"sensor_severity\": severity,\n            \"packet_count\": 1,\n            \"observed_at\": observed_at,\n        }\n\n    if normalized_source in {\"l4\", \"scapy\"}:\n        category = str(\n            line_dict.get(\"category\", \"\")\n        ).upper()\n        signature_info = SCAPY_SIGNATURES.get(category)\n\n        if signature_info is None:\n            return None\n\n        packet_count = optional_int(\n            line_dict.get(signature_info[\"count_field\"])\n        )\n\n        if packet_count is None or packet_count < 1:\n            packet_count = 1\n\n        signature = signature_info[\"signature\"]\n        distinct_sources = optional_int(line_dict.get(\"distinct_sources\"))\n        if distinct_sources is not None:\n            signature = f\"{signature} (sources={distinct_sources})\"\n\n        return {\n            \"sensor\": \"scapy\",\n            \"layer\": signature_info[\"layer\"],\n            \"src_ip\": str(line_dict.get(\"src_ip\", \"\")),\n            \"dst_port\": None,\n            \"proto\": signature_info[\"proto\"],\n            \"category\": category,\n            \"signature_id\": signature_info[\"signature_id\"],\n            \"signature\": signature[:200],\n            \"sensor_severity\": 1,\n            \"packet_count\": packet_count,\n            \"observed_at\": utc_iso(\n                line_dict.get(\"timestamp\", time.time())\n            ),\n        }\n\n    return None", "alias": null}, "netwatch/shipper/eve_shipper.py:70-76": {"path": "netwatch/shipper/eve_shipper.py", "start": 70, "end": 76, "lang": "python", "code": "SURICATA_SID_MAPPING = {\n    9000001: (\"SYN_FLOOD\", \"L4\"),\n    9000003: (\"LOGIN_BURST\", \"L7\"),\n    9000004: (\"SCANNER_UA\", \"L7\"),\n    # guide57 L3 경보 — local.rules의 ICMP echo 폭주 규칙.\n    9000005: (\"ICMP_FLOOD\", \"L3\"),\n}", "alias": null}, "netwatch/shipper/eve_shipper.py:Aggregator.add": {"path": "netwatch/shipper/eve_shipper.py", "start": 529, "end": 568, "lang": "python", "code": "    def add(self, event: dict) -> list[dict]:\n        \"\"\"이벤트를 창에 추가하고 첫 건이면 즉시 반환한다.\"\"\"\n        body = dict(event)\n        window_start = minute_window_start(\n            body[\"observed_at\"]\n        )\n        body[\"window_start\"] = window_start\n        body[\"event_id\"] = make_event_id(\n            body[\"sensor\"],\n            body[\"src_ip\"],\n            body[\"category\"],\n            int(body[\"signature_id\"]),\n            window_start,\n        )\n\n        key = (\n            body[\"sensor\"],\n            body[\"src_ip\"],\n            body[\"category\"],\n            int(body[\"signature_id\"]),\n            window_start,\n        )\n\n        state = self._windows.get(key)\n\n        if state is None:\n            self._windows[key] = {\n                \"body\": body,\n                \"dirty\": False,\n            }\n            return [dict(body)]\n\n        existing = state[\"body\"]\n        existing[\"packet_count\"] += max(\n            1,\n            int(body.get(\"packet_count\", 1)),\n        )\n        existing[\"observed_at\"] = body[\"observed_at\"]\n        state[\"dirty\"] = True\n        return []", "alias": null}, "netwatch/shipper/eve_shipper.py:make_event_id": {"path": "netwatch/shipper/eve_shipper.py", "start": 135, "end": 147, "lang": "python", "code": "def make_event_id(\n    sensor: str,\n    src_ip: str,\n    category: str,\n    signature_id: int,\n    window_start: str,\n) -> str:\n    \"\"\"계약서 K4 순서로 안정적인 64자 event_id를 만든다.\"\"\"\n    source = (\n        f\"{sensor}|{src_ip}|{category}|\"\n        f\"{signature_id}|{window_start}\"\n    )\n    return hashlib.sha256(source.encode(\"utf-8\")).hexdigest()", "alias": null}, "netwatch/shipper/eve_shipper.py:sign_headers": {"path": "netwatch/shipper/eve_shipper.py", "start": 150, "end": 169, "lang": "python", "code": "def sign_headers(\n    secret: str,\n    body: bytes,\n    now: float | int | Callable[[], float],\n) -> dict[str, str]:\n    \"\"\"계약서 K3 규칙으로 shipper 요청 헤더를 만든다.\"\"\"\n    current = now() if callable(now) else now\n    timestamp = str(int(current))\n    message = timestamp.encode(\"ascii\") + b\".\" + body\n    signature = hmac.new(\n        secret.encode(\"utf-8\"),\n        message,\n        hashlib.sha256,\n    ).hexdigest()\n\n    return {\n        \"X-LW-Sender\": \"shipper\",\n        \"X-LW-Timestamp\": timestamp,\n        \"X-LW-Signature\": signature,\n    }", "alias": null}, "netwatch/shipper/eve_shipper.py:Sender._deliver": {"path": "netwatch/shipper/eve_shipper.py", "start": 648, "end": 727, "lang": "python", "code": "    def _deliver(self, body: dict) -> bool:\n        \"\"\"한 본문을 K3 서명과 함께 최대 5회 전송한다.\"\"\"\n        raw_body = json.dumps(\n            body,\n            ensure_ascii=False,\n            separators=(\",\", \":\"),\n        ).encode(\"utf-8\")\n\n        for attempt in range(MAX_SEND_ATTEMPTS):\n            retry_after: int | None = None\n            headers = sign_headers(\n                self.secret,\n                raw_body,\n                self.clock,\n            )\n            headers[\"Content-Type\"] = \"application/json\"\n            try:\n                response = self.session.post(\n                    self.url,\n                    data=raw_body,\n                    headers=headers,\n                    timeout=5,\n                )\n                status_code = int(response.status_code)\n\n                if 200 <= status_code < 300:\n                    return True\n\n                # 429는 \"형식이 틀림\"이 아니라 \"지금 바쁨\"이다. 다른 4xx처럼 바로 버리면 한도에 걸린\n                # 공격 경보가 영영 앱에 닿지 않으므로(10/26 강사 피드백 1), 5xx처럼 물러났다가 다시 보낸다.\n                # 서명은 매 시도마다 새 시각으로 다시 만들므로 오래 기다려도 시각 오차에 걸리지 않는다.\n                retry_after = _retry_after_seconds(response) if status_code == 429 else None\n\n                if 400 <= status_code < 500 and status_code != 429:\n                    print(\n                        \"[WARN] shipper 요청이 재시도할 수 없는 \"\n                        f\"HTTP {status_code}로 거부됐습니다.\",\n                        file=sys.stderr,\n                        flush=True,\n                    )\n                    return False\n\n                retryable = status_code == 429 or 500 <= status_code < 600\n\n                if not retryable:\n                    print(\n                        \"[WARN] shipper 요청이 예상하지 못한 \"\n                        f\"HTTP {status_code}를 받았습니다.\",\n                        file=sys.stderr,\n                        flush=True,\n                    )\n                    return False\n\n                error_text = f\"HTTP {status_code}\"\n\n            except Exception as error:\n                # requests 예외를 import하지 않고 연결 실패 전체를 재시도한다.\n                error_text = type(error).__name__\n\n            if attempt >= len(RETRY_DELAYS_SECONDS):\n                print(\n                    \"[FAIL] shipper 전송을 최대 횟수까지 \"\n                    f\"재시도했지만 실패했습니다: {error_text}\",\n                    file=sys.stderr,\n                    flush=True,\n                )\n                return False\n\n            delay = RETRY_DELAYS_SECONDS[attempt]\n            if retry_after is not None:\n                delay = max(delay, retry_after)\n            print(\n                \"[WARN] shipper 전송 실패, \"\n                f\"{delay}초 후 재시도합니다: {error_text}\",\n                file=sys.stderr,\n                flush=True,\n            )\n            self.sleeper(delay)\n\n        return False", "alias": null}, "netwatch/shipper/eve_shipper.py:StallWatch.observe": {"path": "netwatch/shipper/eve_shipper.py", "start": 419, "end": 463, "lang": "python", "code": "    def observe(\n        self,\n        eve_bytes: int,\n        l4_bytes: int,\n    ) -> tuple[bool, int]:\n        \"\"\"현재 파일 크기를 반영하고 정지 상태와 정지 시간을 반환한다.\"\"\"\n        now = self.clock()\n\n        current_sizes = {\n            \"eve\": max(0, int(eve_bytes)),\n            \"l4\": max(0, int(l4_bytes)),\n        }\n\n        for name, current_size in current_sizes.items():\n            previous_size = self._last_sizes.get(name)\n\n            # 첫 관찰, 파일 증가, 로그 순환·재생성에 따른 크기 감소를\n            # 모두 해당 센서 파일의 활동으로 처리한다.\n            if (\n                previous_size is None\n                or current_size != previous_size\n            ):\n                self._last_change_times[name] = now\n\n            self._last_sizes[name] = current_size\n\n        if len(self._last_change_times) < 2:\n            self.stalled = False\n            self.stalled_seconds = 0\n            return self.stalled, self.stalled_seconds\n\n        # 두 파일 중 더 최근에 바뀐 시각부터 두 파일 모두 멈춘 것이다.\n        most_recent_change = max(\n            self._last_change_times.values()\n        )\n\n        self.stalled_seconds = max(\n            0,\n            int(now - most_recent_change),\n        )\n        self.stalled = (\n            self.stalled_seconds >= self.threshold_seconds\n        )\n\n        return self.stalled, self.stalled_seconds", "alias": null}}, "files": {"netwatch/nginx/nginx.conf": {"role": "정문(gateway). 바깥 요청은 여기서만 받아 앱으로 넘기고, 내부 API 주소는 바깥에서 닿지 않게 404로 막는다.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/netwatch/nginx/nginx.conf"}, "netwatch/suricata/rules/local.rules": {"role": "Suricata(센서)가 보는 우리 규칙 3개. SID 번호는 shipper의 분류 표와 짝이라 바꾸면 안 된다.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/netwatch/suricata/rules/local.rules"}, "netwatch/l4_detector/detector_core.py": {"role": "Scapy 패킷을 하나씩 받아 'SYN 다발'과 '포트 스캔'을 판정하는 순수 로직(캡처와 분리해 테스트하기 쉽다).", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/netwatch/l4_detector/detector_core.py"}, "netwatch/l4_detector/l4_detector.py": {"role": "네트워크 인터페이스에서 TCP 패킷을 캡처해 L4Detector에 넘기고, 경보를 l4.json에 한 줄씩 쓰는 실행 파일.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/netwatch/l4_detector/l4_detector.py"}, "netwatch/shipper/eve_shipper.py": {"role": "센서 로그(eve.json·l4.json)를 읽어 경보로 바꾸고, 같은 분(分)의 경보를 합쳐 서명한 뒤 앱으로 보내는 배달원.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/netwatch/shipper/eve_shipper.py"}}}</script>
<script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var $ = function(id){ return document.getElementById(id); };
  var KIND_LABEL = {screen:"화면 · 도착지", route:"routes", helper:"판단", db:"db", config:"설정값", later:"다른 단원"};

  var state = { sc: 0, node: null, item: 0, file: null };

  /* ---------- 사용자 설정(브라우저에 기억 · 막혀 있어도 동작) ---------- */
  function loadPref(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }
  function savePref(k, v){ try { if (v === null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, v); } catch(e){} }
  var prefs = { wrap: loadPref("lw-code-wrap") !== "0" };   // 기본: 줄바꿈 켜짐

  function el(tag, attrs, kids){
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function brk(t){ return t.replace(/([\/._])/g, "$1\u200b"); }
  function scen(){ return D.scenarios[state.sc]; }
  function nodeById(id){ return scen().nodes.filter(function(n){ return n.id === id; })[0]; }
  function fnName(label){ return label; }

  /* ---------- 간단 문법 강조 ---------- */
  var PY = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?''')|([rbfRBF]{0,2}"(?:\\.|[^"\\\n])*"|[rbfRBF]{0,2}'(?:\\.|[^'\\\n])*')|\b(def|class|return|if|elif|else|for|while|import|from|as|try|except|finally|with|in|not|and|or|is|None|True|False|raise|pass|lambda|yield|global|nonlocal|assert|del|continue|break)\b|(@[A-Za-z_][\w.]*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(?=\()/g;
  var PYC = [null,"t-c","t-d","t-s","t-k","t-a","t-n","t-f"];
  var HT = /(<!--[\s\S]*?-->)|(\{[{%#][\s\S]*?[}%#]\})|(<\/?[A-Za-z][\w-]*)|("[^"\n]*")|(\/?>)/g;
  var HTC = [null,"t-c","t-a","t-k","t-s","t-k"];
  var JS = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\.|[^`\\])*`)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(const|let|var|function|return|if|else|for|while|import|from|export|default|async|await|try|catch|finally|new|class|extends|typeof|interface|type|null|undefined|true|false|throw|switch|case|break|continue|of|in|as)\b|(@[A-Za-z_]\w*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_$][\w$]*)(?=\()/g;
  var JSC = [null,"t-c","t-s","t-s","t-k","t-a","t-n","t-f"];
  var SQ = /(--[^\n]*|\/\*[\s\S]*?\*\/)|((?!))|('(?:''|[^'])*')|\b(select|from|where|insert|into|values|update|set|delete|create|table|index|alter|add|drop|on|conflict|do|nothing|and|or|not|null|default|primary|key|references|cascade|if|exists|as|order|by|group|limit|desc|asc|join|left|inner|count|returns|function|language|begin|end|return|with|union|all|distinct|in|is|true|false|unique|check|constraint|timestamptz|text|integer|bigint|boolean|interval|now|replace|trigger|view|policy|enable|row|level|security|using)\b|((?!))|\b(\d+(?:\.\d+)?)\b|\b([a-z_]\w*)(?=\()/gi;
  var SQC = [null,"t-c",null,"t-s","t-k",null,"t-n","t-f"];
  var SH = /(#[^\n]*)|((?!))|("(?:\\.|[^"\\\n])*"|'[^'\n]*')|\b(if|then|else|fi|for|do|done|while|case|esac|function|echo|export|python|pip|git|cd|run|name|on|jobs|steps|uses|with|env)\b|((?!))|\b(\d+)\b/g;
  var SHC = [null,"t-c",null,"t-s","t-k",null,"t-n"];
  function tokenize(code, lang){
    var re = PY, cls = PYC;
    if (lang === "html"){ re = HT; cls = HTC; }
    else if (lang === "js"){ re = JS; cls = JSC; }
    else if (lang === "sql"){ re = SQ; cls = SQC; }
    else if (lang === "sh"){ re = SH; cls = SHC; }
    var lines = [[]];
    function push(text, c){
      var parts = text.split("\n");
      parts.forEach(function(p, i){
        if (i > 0) lines.push([]);
        if (p) lines[lines.length-1].push([p, c]);
      });
    }
    var last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(code)) !== null){
      if (m.index > last) push(code.slice(last, m.index), null);
      var idx = 1; while (idx < m.length && m[idx] === undefined) idx++;
      push(m[0], cls[idx] || null);
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++;
    }
    if (last < code.length) push(code.slice(last), null);
    return lines;
  }

  function codeTable(block, hl){
    var lines = tokenize(block.code, block.lang);
    var tbody = el("tbody");
    var hlFirst = null;
    lines.forEach(function(segs, i){
      var no = block.start + i;
      var on = hl && no >= hl[0] && no <= hl[1];
      var td = el("td", {class:"tx"});
      segs.forEach(function(s){ td.appendChild(s[1] ? el("span", {class:s[1], text:s[0]}) : document.createTextNode(s[0])); });
      if (!segs.length) td.appendChild(document.createTextNode(" "));
      var tr = el("tr", on ? {class:"hl"} : null, [el("td", {class:"ln", text:String(no)}), td]);
      if (on && !hlFirst) hlFirst = tr;
      tbody.appendChild(tr);
    });
    var box = el("div", {class:"codebox"}, [el("table", {class:"code"}, [tbody])]);
    box._hlFirst = hlFirst;
    return box;
  }

  function copyText(text, btn){
    var done = function(){ var o = btn.textContent; btn.textContent = "복사됨 ✓"; setTimeout(function(){ btn.textContent = o; }, 1200); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
    function fallback(){
      var ta = el("textarea", {style:"position:fixed;opacity:0"}); ta.value = text; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); done(); } catch(e){} document.body.removeChild(ta);
    }
  }

  /* ---------- 패널 ---------- */
  function openPanel(){ document.body.classList.add("open"); }
  function closePanel(){ document.body.classList.remove("open"); }

  function showHint(){
    $("pTitle").textContent = "코드 보는 법";
    $("pSub").textContent = "카드나 파일 이름을 누르면 실제 코드가 여기에 열립니다.";
    var ul = el("ul", {class:"hint"}, [
      el("li", {text:"카드(상자)를 누르면 그 단계에서 실행되는 실제 함수 코드가 열려요."}),
      el("li", {text:"카드 안의 📄 파일 이름을 누르면 그 파일이 어떤 역할인지, 이 단원에서 쓰이는 함수가 무엇인지 보여줘요."}),
      el("li", {text:"ƒ 함수 이름을 누르면 해당 함수 코드로 바로 이동해요."}),
      el("li", {text:"노란색 줄이 지금 단계가 담당하는 부분이에요."}),
      el("li", {text:"db.함수() 처럼 적혀 있어도 실제 코드는 db/users.py 같은 다른 파일에 있어요. 카드에 그 '진짜 파일'을 표시하고, 코드 위에 찾아가는 길도 그려줘요."}),
      el("li", {text:"위쪽 ◀ ▶ 버튼으로 실행 순서대로 한 단계씩 따라갈 수 있어요."})
    ]);
    var b = $("pBody"); b.textContent = ""; b.appendChild(ul);
  }

  function renderAlias(a){
    if (!a) return null;
    return el("div", {class:"alias"}, [
      el("div", {text:"코드에는 이렇게 적혀 있지만, 실제 함수는 다른 파일에 있어요."}),
      el("div", {class:"route"}, [
        el("span", {class:"step", text:a.call}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step", text:a.via + " (창구)"}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step real", text:a.real})
      ])
    ]);
  }

  function selectNode(id, itemIdx){
    var n = nodeById(id); if (!n) return;
    state.node = id; state.item = itemIdx || 0; state.file = null;
    $("pTitle").textContent = n.title;
    $("pSub").textContent = n.plain;
    var body = $("pBody"); body.textContent = "";
    if (n.reject) body.appendChild(el("div", {class:"n-reject", text:n.reject, style:"margin:0 0 10px"}));
    if (n.items.length > 1){
      var tabs = el("div", {class:"itabs", role:"tablist"});
      n.items.forEach(function(it, i){
        tabs.appendChild(el("button", {class:"itab", role:"tab", "aria-selected":String(i === state.item), text:it.label,
          onclick:function(){ selectNode(id, i); }}));
      });
      body.appendChild(tabs);
    }
    var it = n.items[state.item];
    var block = D.blocks[it.block];
    var linesTxt = it.hl ? (it.hl[0] === it.hl[1] ? it.hl[0] + "줄" : it.hl[0] + "–" + it.hl[1] + "줄") : "";
    var fl = el("div", {class:"fileline"}, [
      el("button", {class:"chip file", onclick:function(){ selectFile(block.path); }, text:block.path}),
      el("span", {class:"lines", text: block.start + "–" + block.end + "줄 표시" + (linesTxt ? " · 노란색 " + linesTxt : "")}),
      el("span", {class:"spacer"}),
      el("button", {class:"btn", id:"wrapBtn", "aria-pressed":String(prefs.wrap), title:"긴 줄을 화면 너비에 맞춰 줄바꿈", text:"줄바꿈", onclick:function(e){
        prefs.wrap = !prefs.wrap; savePref("lw-code-wrap", prefs.wrap ? "1" : "0");
        e.currentTarget.setAttribute("aria-pressed", String(prefs.wrap));
        var bx = document.querySelector("#pBody .codebox"); if (bx) bx.classList.toggle("wrap", prefs.wrap);
      }}),
      el("button", {class:"btn", text:"복사", onclick:function(e){ copyText(block.code, e.currentTarget); }}),
      el("a", {class:"btn link", href:D.files[block.path].github + "#L" + block.start + "-L" + block.end, target:"_blank", rel:"noopener", text:"GitHub ↗"})
    ]);
    body.appendChild(fl);
    var al = renderAlias(block.alias); if (al) body.appendChild(al);
    var box = codeTable(block, it.hl);
    if (prefs.wrap) box.classList.add("wrap");
    body.appendChild(box);
    if (it.hl) body.appendChild(el("p", {class:"legend-hl"}, [el("b", {text:"노란색"}), " = 이 카드가 담당하는 줄"]));
    refreshSelection();
    openPanel();
    if (box._hlFirst){
      var off = box._hlFirst.offsetTop - 60;
      box.scrollTop = Math.max(0, off);
    }
    updateStepper();
  }

  function selectFile(path){
    state.file = path; state.node = null;
    var f = D.files[path];
    $("pTitle").textContent = "📄 " + path;
    $("pSub").textContent = f.role;
    var body = $("pBody"); body.textContent = "";
    body.appendChild(el("div", {class:"fileline"}, [
      el("a", {class:"btn link", href:f.github, target:"_blank", rel:"noopener", text:"GitHub에서 파일 열기 ↗"})
    ]));
    body.appendChild(el("h3", {text:"이 단원에서 쓰이는 함수", style:"font-size:13.5px;margin:12px 0 0"}));
    var ul = el("ul", {class:"flist"}), seen = {};
    D.scenarios.forEach(function(sc, si){
      sc.nodes.forEach(function(n){
        n.items.forEach(function(it, ii){
          var b = D.blocks[it.block]; if (b.path !== path) return;
          var key = si + n.id + ii; if (seen[key]) return; seen[key] = 1;
          var li = el("li");
          li.appendChild(el("button", {onclick:function(){
            if (state.sc !== si) switchScenario(si);
            selectNode(n.id, ii); scrollToNode(n.id);
          }}, [
            el("span", {class:"mono", text:it.label}), el("small", {text:sc.name + " · " + n.title})
          ]));
          ul.appendChild(li);
        });
      });
    });
    body.appendChild(ul);
    if (f.header){
      var d = el("details", {class:"hdr"}, [el("summary", {text:"파일 맨 위 설명 주석 보기"}), el("pre", {text:f.header})]);
      body.appendChild(d);
    }
    refreshSelection();
    openPanel();
  }

  /* ---------- 흐름도 ---------- */
  var cols, colIndex, nodeEls = {};
  function renderStage(){
    var sc = scen();
    var used = {}; sc.nodes.forEach(function(n){ used[n.col] = 1; });
    cols = Object.keys(used).map(Number).sort(function(a,b){ return a-b; });
    colIndex = {}; cols.forEach(function(c, i){ colIndex[c] = i + 1; });
    var stage = $("stage");
    stage.textContent = "";
    stage.style.gridTemplateColumns = "repeat(" + cols.length + ", 196px)";
    nodeEls = {};

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "edges"); svg.id = "edges";
    svg.innerHTML = '<defs>' +
      '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-call" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '</defs>';
    stage.appendChild(svg);

    cols.forEach(function(c){
      stage.appendChild(el("div", {class:"colhead", style:"grid-column:" + colIndex[c] + ";grid-row:1", text:D.columns[c]}));
    });
    var cells = {};
    sc.nodes.forEach(function(n){
      var k = n.row + ":" + n.col;
      if (!cells[k]){
        cells[k] = el("div", {class:"cell", style:"grid-column:" + colIndex[n.col] + ";grid-row:" + (n.row + 2)});
        stage.appendChild(cells[k]);
      }
      var node = buildNode(n);
      nodeEls[n.id] = node;
      cells[k].appendChild(node);
    });
    $("intro").textContent = sc.intro;
    scheduleEdges();
  }

  function buildNode(n){
    var node = el("div", {class:"node " + n.kind, role:"button", tabindex:"0", "aria-pressed":"false", "data-id":n.id,
      onclick:function(e){ if (e.target.closest(".chip")) return; selectNode(n.id, 0); },
      onkeydown:function(e){ if ((e.key === "Enter" || e.key === " ") && !e.target.closest(".chip")){ e.preventDefault(); selectNode(n.id, 0); } }});
    var title = el("div", {class:"n-title", text:n.title});
    if (n.later) title.appendChild(el("span", {class:"tag-later", text:n.later + "에서 자세히"}));
    node.appendChild(title);
    if (n.kind !== "later" && n.plain) node.appendChild(el("div", {class:"n-plain", text:n.plain}));
    if (n.reject) node.appendChild(el("div", {class:"n-reject", text:n.reject}));
    var items = el("div", {class:"n-items"});
    // 같은 파일에 있는 함수는 파일 칩 하나 아래에 함수 칩을 나란히 놓는다
    var groups = [];
    n.items.forEach(function(it, i){
      var b = D.blocks[it.block], g = groups[groups.length - 1];
      if (g && g.path === b.path) g.list.push({it: it, i: i}); else groups.push({path: b.path, list: [{it: it, i: i}]});
    });
    groups.forEach(function(g){
      var row = el("div", {class:"n-item"});
      if (g.list.length === 1 && g.list[0].it.call) row.appendChild(el("div", {class:"n-call", text:brk(g.list[0].it.call)}));
      var chips = el("div", {class:"chips"}, [
        el("button", {class:"chip file", text:brk(g.path), title:"파일 설명 보기", onclick:function(){ selectFile(g.path); }})
      ]);
      g.list.forEach(function(x){
        chips.appendChild(el("button", {class:"chip " + (x.it.snippet ? "snip" : "fn"), text:x.it.label, title:(x.it.call ? x.it.call + " — " : "") + "코드 보기",
          onclick:function(){ selectNode(n.id, x.i); }}));
      });
      row.appendChild(chips);
      items.appendChild(row);
    });
    node.appendChild(items);
    return node;
  }

  function rectIn(elm, host){
    var a = elm.getBoundingClientRect(), h = host.getBoundingClientRect();
    return {l:a.left-h.left, r:a.right-h.left, t:a.top-h.top, b:a.bottom-h.top, cx:(a.left+a.right)/2-h.left, cy:(a.top+a.bottom)/2-h.top};
  }
  var raf = 0;
  function scheduleEdges(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(drawEdges); }
  function drawEdges(){
    var stage = $("stage"), svg = $("edges"), sc = scen();
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){ p.remove(); });
    Array.prototype.slice.call(stage.querySelectorAll(".elabel")).forEach(function(p){ p.remove(); });
    var svgNS = "http://www.w3.org/2000/svg";
    sc.edges.forEach(function(e){
      var a = nodeById(e.from), b = nodeById(e.to);
      var ea = nodeEls[e.from], eb = nodeEls[e.to]; if (!ea || !eb) return;
      var ra = rectIn(ea, stage), rb = rectIn(eb, stage), d, lx, ly;
      if (a.col === b.col){
        if (b.row - a.row <= 1){
          d = "M" + ra.cx + " " + ra.b + " V" + rb.t; lx = ra.cx; ly = (ra.b + rb.t) / 2;
        } else {
          var x = Math.min(ra.l, rb.l) - 30;
          d = "M" + ra.l + " " + ra.cy + " H" + x + " V" + rb.cy + " H" + rb.l; lx = x; ly = (ra.cy + rb.cy) / 2;
        }
      } else {
        var dir = b.col > a.col ? 1 : -1;
        var x1 = dir > 0 ? ra.r : ra.l, x2 = dir > 0 ? rb.l : rb.r;
        var xm = x2 - dir * 30;
        d = "M" + x1 + " " + ra.cy + " H" + xm + " V" + rb.cy + " H" + x2;
        lx = (x1 + x2) / 2; ly = ra.cy;
      }
      var kind = e.kind === "call" ? "call" : "flow";
      var p = document.createElementNS(svgNS, "path");
      p.setAttribute("d", d); p.setAttribute("class", "e " + kind);
      p.setAttribute("marker-end", "url(#" + (kind === "call" ? "ahc" : "ah") + ")");
      p.setAttribute("data-from", e.from); p.setAttribute("data-to", e.to);
      svg.appendChild(p);
      if (e.label && kind === "flow"){
        var lab = el("span", {class:"elabel", text:e.label});
        lab.style.left = lx + "px"; lab.style.top = ly + "px";
        stage.appendChild(lab);
      }
    });
    svg.setAttribute("width", stage.scrollWidth); svg.setAttribute("height", stage.scrollHeight);
    refreshSelection();
  }

  function refreshSelection(){
    Object.keys(nodeEls).forEach(function(id){ nodeEls[id].setAttribute("aria-pressed", String(id === state.node)); });
    var svg = $("edges"); if (!svg) return;
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){
      var on = state.node && (p.getAttribute("data-from") === state.node || p.getAttribute("data-to") === state.node);
      p.classList.toggle("active", !!on);
    });
  }
  function scrollToNode(id){
    var n = nodeEls[id]; if (n && n.scrollIntoView) n.scrollIntoView({block:"center", inline:"center", behavior:"smooth"});
  }

  /* ---------- 단계 이동 / 탭 ---------- */
  function stepIndex(){ return scen().steps.indexOf(state.node); }
  function updateStepper(){
    var steps = scen().steps, i = stepIndex();
    $("stepNo").textContent = i < 0 ? "– / " + steps.length : (i + 1) + " / " + steps.length;
    $("prev").disabled = i <= 0 && state.node !== null ? true : false;
    $("next").disabled = i >= steps.length - 1;
    if (state.node === null){ $("prev").disabled = true; $("next").disabled = false; }
  }
  function go(delta){
    var steps = scen().steps, i = stepIndex();
    var j = i < 0 ? 0 : Math.max(0, Math.min(steps.length - 1, i + delta));
    selectNode(steps[j], 0); scrollToNode(steps[j]);
  }
  function renderTabs(){
    var t = $("tabs"); t.textContent = "";
    D.scenarios.forEach(function(sc, i){
      t.appendChild(el("button", {class:"tab", role:"tab", "aria-selected":String(i === state.sc), text:sc.name, onclick:function(){ switchScenario(i); }}));
    });
  }
  function switchScenario(i){
    state.sc = i; state.node = null; state.file = null;
    renderTabs(); renderStage(); showHint(); updateStepper();
    try { history.replaceState(null, "", "#" + D.scenarios[i].id); } catch(e){}
  }

  /* ---------- 시작 ---------- */
  document.title = D.title + " — 코드 흐름도";
  $("title").textContent = D.title + " · 코드 흐름도";
  $("subtitle").textContent = D.subtitle;
  $("mdlink").setAttribute("href", D.mdFile);
  $("prev").addEventListener("click", function(){ go(-1); });
  $("next").addEventListener("click", function(){ go(1); });
  $("pClose").addEventListener("click", closePanel);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closePanel(); });
  $("theme").addEventListener("click", function(){
    var r = document.documentElement, cur = r.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  });
  window.addEventListener("resize", scheduleEdges);
  if (window.ResizeObserver){ var ro = new ResizeObserver(scheduleEdges); ro.observe($("stage")); ro.observe($("stageWrap")); }

  /* ---------- 코드 패널 너비: 자동 기본값 + 드래그/키보드 조절 + 기억 ---------- */
  var MIN_PANEL = 360, MIN_MAIN = 420, SPLIT_KEY = "lw-panel-w";
  var splitter = $("splitter");
  function maxPanel(){ return Math.max(MIN_PANEL, Math.min(window.innerWidth * 0.75, window.innerWidth - MIN_MAIN - 6)); }
  function clampPanel(w){ return Math.round(Math.min(maxPanel(), Math.max(MIN_PANEL, w))); }
  // 흐름도가 실제로 차지하는 너비(가장 넓은 탭 기준)를 빼고 남는 공간을 패널에 준다
  function autoPanelWidth(){
    var most = 1;
    D.scenarios.forEach(function(sc){ var u = {}; sc.nodes.forEach(function(n){ u[n.col] = 1; }); most = Math.max(most, Object.keys(u).length); });
    var natural = most * 196 + (most - 1) * 46 + 44 + 24;
    return clampPanel(Math.max(440, window.innerWidth - natural - 6));
  }
  var savedW = parseInt(loadPref(SPLIT_KEY), 10);
  var userSet = savedW > 0;
  function setPanelW(w, persist){
    w = clampPanel(w);
    document.documentElement.style.setProperty("--panel-w", w + "px");
    splitter.setAttribute("aria-valuenow", String(w)); splitter.setAttribute("aria-valuemin", String(MIN_PANEL)); splitter.setAttribute("aria-valuemax", String(Math.round(maxPanel())));
    if (persist){ userSet = true; savePref(SPLIT_KEY, String(w)); }
    scheduleEdges();
  }
  function currentW(){ return $("panel").getBoundingClientRect().width; }
  setPanelW(userSet ? savedW : autoPanelWidth(), false);
  window.addEventListener("resize", function(){ setPanelW(userSet ? currentW() : autoPanelWidth(), false); });
  splitter.addEventListener("pointerdown", function(e){
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault(); splitter.setPointerCapture(e.pointerId); document.body.classList.add("dragging");
    function move(ev){ setPanelW(window.innerWidth - ev.clientX, false); }
    function up(ev){
      splitter.removeEventListener("pointermove", move); splitter.removeEventListener("pointerup", up); splitter.removeEventListener("pointercancel", up);
      try { splitter.releasePointerCapture(ev.pointerId); } catch(x){}
      document.body.classList.remove("dragging"); setPanelW(currentW(), true);
    }
    splitter.addEventListener("pointermove", move); splitter.addEventListener("pointerup", up); splitter.addEventListener("pointercancel", up);
  });
  splitter.addEventListener("keydown", function(e){
    var step = (e.shiftKey ? 72 : 24);
    if (e.key === "ArrowLeft"){ e.preventDefault(); setPanelW(currentW() + step, true); }
    else if (e.key === "ArrowRight"){ e.preventDefault(); setPanelW(currentW() - step, true); }
    else if (e.key === "Home"){ e.preventDefault(); setPanelW(MIN_PANEL, true); }
    else if (e.key === "End"){ e.preventDefault(); setPanelW(maxPanel(), true); }
  });
  splitter.addEventListener("dblclick", function(){ userSet = false; savePref(SPLIT_KEY, null); setPanelW(autoPanelWidth(), false); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleEdges);

  var startId = (location.hash || "").replace("#", "");
  var startIdx = 0; D.scenarios.forEach(function(s, i){ if (s.id === startId) startIdx = i; });
  switchScenario(startIdx);
  // 화면 확인/테스트용 지름길: window.__flow.select("s7")
  window.__flow = { select: function(id, i){ selectNode(id, i || 0); }, file: selectFile, state: state };
})();
</script>
