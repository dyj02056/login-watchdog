<!--
  password_reset.html — 새 비밀번호 입력 화면 (guide41)

  mode 값에 따라 보여주는 내용이 달라진다:
    form     메일 링크로 들어옴 — 새 비밀번호 입력 (GET은 토큰을 소비하지 않는다.
             실제 소비는 이 폼의 POST에서, 새 비밀번호 형식 검사를 통과한 뒤에만 일어난다)
    invalid  만료되었거나 이미 사용된 링크
-->
<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>로그인 워치독 — 비밀번호 재설정</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
    <button id="theme-toggle" type="button" class="theme-toggle theme-toggle--floating">다크 모드</button>

    <div class="auth-card">
        <h1>비밀번호 재설정</h1>

        {% if message %}
            <ul class="flash-list">
                <li>{{ message }}</li>
            </ul>
        {% endif %}

        {% if mode == "form" %}
            <div class="recovery-detail">
                <div>대상 계정: <strong>{{ masked_username }}</strong></div>
                <div>바꾸면 모든 기기의 로그인이 해제되고, 이메일로 알림이 갑니다.</div>
            </div>
            <form method="post" action="{{ url_for('password.password_reset_submit') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="t" value="{{ token }}">

                <label for="new_password">새 비밀번호 ({{ min_length }}자 이상)</label>
                <input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="{{ min_length }}" required>

                <label for="new_password_confirm">새 비밀번호 확인</label>
                <input type="password" id="new_password_confirm" name="new_password_confirm" autocomplete="new-password" minlength="{{ min_length }}" required>

                <button type="submit">비밀번호 재설정</button>
            </form>
        {% endif %}

        <div class="auth-links">
            {% if mode == "invalid" %}
                <a href="{{ url_for('password.password_forgot_form') }}">비밀번호 찾기 다시 요청</a>
            {% endif %}
            <a href="{{ url_for('auth.login') }}">로그인으로 이동</a>
        </div>
    </div>
</body>
</html>
