%YAML 1.1
---

# ============================================================================
# Login Watchdog Suricata 설정
#
# __HOME_NET__과 __SENSOR_IFACE__는 컨테이너 시작 시 entrypoint.sh가
# 환경변수를 사용하여 실제 값으로 치환한다.
#
# HOME_NET은 gateway 한 주소만 지정하지 않고 edge·core 대역 전체를 포함한다.
# 이렇게 해야 PC별 LW_EDGE_PREFIX가 달라도 같은 설정을 사용할 수 있다.
# ============================================================================

vars:
  address-groups:
    HOME_NET: "__HOME_NET__"
    EXTERNAL_NET: "!$HOME_NET"

    # ET Open 규칙에서 사용하는 서버 주소 변수
    HTTP_SERVERS: "$HOME_NET"
    SMTP_SERVERS: "$HOME_NET"
    SQL_SERVERS: "$HOME_NET"
    DNS_SERVERS: "$HOME_NET"
    TELNET_SERVERS: "$HOME_NET"
    SSH_SERVERS: "$HOME_NET"
    DC_SERVERS: "$HOME_NET"
    DNP3_SERVER: "$HOME_NET"
    DNP3_CLIENT: "$HOME_NET"
    MODBUS_CLIENT: "$HOME_NET"
    MODBUS_SERVER: "$HOME_NET"
    ENIP_CLIENT: "$HOME_NET"
    ENIP_SERVER: "$HOME_NET"
    AIM_SERVERS: "$EXTERNAL_NET"

  port-groups:
    HTTP_PORTS: "80,8080"
    SHELLCODE_PORTS: "!80"
    ORACLE_PORTS: 1521
    SSH_PORTS: 22
    DNP3_PORTS: 20000
    MODBUS_PORTS: 502
    FILE_DATA_PORTS: "[$HTTP_PORTS,110,143]"
    FTP_PORTS: 21
    VXLAN_PORTS: 4789
    GENEVE_PORTS: 6081
    TEREDO_PORTS: 3544

default-log-dir: /var/log/suricata

# suricata-update가 ET Open 규칙을 저장하는 기본 경로
default-rule-path: /var/lib/suricata/rules

rule-files:
  # suricata-update로 받은 ET Open 규칙
  - suricata.rules

  # Login Watchdog 자체 규칙
  - /etc/suricata/custom/rules/local.rules

# Docker gateway 네임스페이스의 edge 인터페이스를 감시한다.
af-packet:
  - interface: "__SENSOR_IFACE__"
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
    use-mmap: yes
    tpacket-v3: yes

app-layer:
  protocols:
    http:
      enabled: yes

# Suricata 내부 통계를 60초마다 만든다(아래 eve-log의 stats가 이 값을 기록한다).
# 공격이 없어 alert·flow가 하나도 안 생겨도 Suricata가 살아 있으면 eve.json이 1분마다 커진다.
# shipper는 "두 센서 파일이 SHIPPER_STALL_SECONDS(기본 120초) 넘게 안 늘면 정지"로 보므로,
# 이 신호가 없으면 아무도 접속하지 않는 조용한 시간에도 정지로 잘못 알린다.
# 간격은 정지 기준(120초)보다 충분히 짧고, 기록이 너무 빨리 쌓이지 않게 60초로 둔다.
stats:
  enabled: yes
  interval: 60

outputs:
  - fast:
      enabled: no

  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json

      # 이벤트 한 건을 JSON 한 줄로 기록한다.
      types:
        - alert
        - flow
        - http:
            extended: yes
        # 생존 신호 겸 통계(위 stats 절 참고). 합계만 남겨 한 줄을 작게 유지한다.
        # shipper는 alert가 아닌 줄을 모두 건너뛰므로 경보로 잘못 보내지 않는다.
        - stats:
            totals: yes
            threads: no
            deltas: no

logging:
  default-log-level: notice

  outputs:
    - console:
        enabled: yes

    - file:
        enabled: no