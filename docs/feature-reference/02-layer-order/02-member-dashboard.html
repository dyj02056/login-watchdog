<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2. 회원 대시보드 — 코드 흐름도</title>
<style>
  :root{
    --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eaefe9; --ink:#12201c; --ink-muted:#5a6b63;
    --border:#d9e0da; --accent:#0f6f66; --accent-soft:#e2ede9; --danger:#bf3b2b; --danger-soft:#f8e6e2;
    --edge:#7b8a82; --edge-call:#8a97a0;
    --k-screen:#767f78; --k-screen-soft:#eef0ee;
    --k-route:#2f5fd6;  --k-route-soft:#e7edfb;
    --k-helper:#b56b0c; --k-helper-soft:#f7ecd9;
    --k-db:#7a4fce;     --k-db-soft:#efe8fa;
    --k-config:#0f6f66; --k-config-soft:#e2ede9;
    --k-later:#9aa39d;  --k-later-soft:#f4f6f3;
    --code-bg:#fbfcfb; --code-hl:#fff3c4; --code-hl-bar:#e0a800; --code-gutter:#8a978f;
    --c-comment:#6b7d73; --c-str:#a1470f; --c-kw:#7a3fc0; --c-fn:#1f5fd0; --c-num:#0b7a6c; --c-deco:#b0306e;
    --shadow:0 1px 2px rgba(18,32,28,.06), 0 6px 20px rgba(18,32,28,.07);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
      --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
      --edge:#6f8178; --edge-call:#5d6f67;
      --k-screen:#9aa39d; --k-screen-soft:#1a221e;
      --k-route:#7fa2f2;  --k-route-soft:#182236;
      --k-helper:#e8a94c; --k-helper-soft:#31260f;
      --k-db:#b49bee;     --k-db-soft:#241c34;
      --k-config:#4fc9b8; --k-config-soft:#17332d;
      --k-later:#6b7a72;  --k-later-soft:#111a16;
      --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
      --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
    --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
    --edge:#6f8178; --edge-call:#5d6f67;
    --k-screen:#9aa39d; --k-screen-soft:#1a221e;
    --k-route:#7fa2f2;  --k-route-soft:#182236;
    --k-helper:#e8a94c; --k-helper-soft:#31260f;
    --k-db:#b49bee;     --k-db-soft:#241c34;
    --k-config:#4fc9b8; --k-config-soft:#17332d;
    --k-later:#6b7a72;  --k-later-soft:#111a16;
    --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
    --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
  button{font:inherit;color:inherit;cursor:pointer}
  code,.mono{font-family:var(--mono)}

  .app{display:flex;height:100vh;min-height:0}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{padding:14px 20px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
  .top h1{margin:0;font-size:19px;letter-spacing:-.01em}
  .top .sub{margin:2px 0 0;color:var(--ink-muted);font-size:13px}
  .top-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
  .tabs{display:flex;gap:6px}
  .tab{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:5px 14px;font-weight:600}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .tab[aria-selected="true"]{color:#06201b}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#06201b}}
  .spacer{flex:1}
  .btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:default}
  .stepper{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-muted)}
  .stepper b{color:var(--ink);min-width:42px;text-align:center}
  a.link{color:var(--accent);text-decoration:none;font-size:13px}
  a.link:hover{text-decoration:underline}

  .intro{margin:0;padding:10px 20px;color:var(--ink-muted);font-size:13px;border-bottom:1px solid var(--border);background:var(--surface-2)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 20px;font-size:12px;color:var(--ink-muted);border-bottom:1px solid var(--border)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .stage-wrap{flex:1;min-height:0;overflow:auto}
  .stage{position:relative;display:grid;gap:26px 46px;padding:22px 22px 60px;width:max-content;min-width:100%}
  .edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .edges path{fill:none;stroke:var(--edge);stroke-width:1.6}
  .edges path.call{stroke:var(--edge-call);stroke-dasharray:5 4}
  .edges path.active{stroke:var(--accent);stroke-width:2.4;stroke-dasharray:none}
  .edges .head{fill:var(--edge)}
  .edges .head-call{fill:var(--edge-call)}
  .elabel{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;
    background:var(--surface);border:1px solid var(--border);color:var(--ink-muted);white-space:nowrap;pointer-events:none}

  .colhead{font-size:12px;font-weight:700;color:var(--ink-muted);text-transform:none;border-bottom:2px solid var(--border);padding-bottom:6px;align-self:end}
  .cell{display:flex;flex-direction:column;gap:12px;align-self:center;justify-content:center;position:relative;z-index:1}

  .node{--k:var(--k-route);--ks:var(--k-route-soft);position:relative;background:var(--surface);border:1px solid var(--border);
    border-left:5px solid var(--k);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .08s, border-color .12s}
  .node:hover{transform:translateY(-1px);border-color:var(--k)}
  .node:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .node[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
  .node.screen{--k:var(--k-screen);--ks:var(--k-screen-soft)}
  .node.route{--k:var(--k-route);--ks:var(--k-route-soft)}
  .node.helper{--k:var(--k-helper);--ks:var(--k-helper-soft)}
  .node.db{--k:var(--k-db);--ks:var(--k-db-soft)}
  .node.config{--k:var(--k-config);--ks:var(--k-config-soft)}
  .node.later{--k:var(--k-later);--ks:var(--k-later-soft);background:var(--k-later-soft);box-shadow:none;border-style:dashed;border-left-style:solid;padding:8px 10px}
  .n-title{font-weight:700;font-size:13.5px;letter-spacing:-.01em}
  .n-plain{margin-top:3px;color:var(--ink-muted);font-size:12.5px}
  .n-reject{margin-top:6px;font-size:12px;color:var(--danger);background:var(--danger-soft);border-radius:6px;padding:3px 8px}
  .n-reject::before{content:"막히면 → ";font-weight:700}
  .n-items{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .n-item{display:flex;flex-direction:column;gap:3px}
  .n-call{overflow-wrap:anywhere;font-family:var(--mono);font-size:11.5px;color:var(--k);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{max-width:100%;text-align:left;overflow-wrap:anywhere;border:1px solid var(--border);background:var(--ks);color:var(--ink);border-radius:6px;padding:1px 7px;font-family:var(--mono);font-size:11px}
  .chip:hover{border-color:var(--k);color:var(--k)}
  .chip.file::before{content:"📄 "}
  .chip.fn::before{content:"ƒ ";color:var(--k);font-weight:700}
  .chip.snip::before{content:"▤ ";color:var(--k);font-weight:700}
  .tag-later{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--ink-muted);border:1px solid var(--border);border-radius:999px;padding:0 7px;background:var(--surface)}

  /* 코드 패널 */
  .panel{width:440px;flex:none;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
  .p-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
  .p-head h2{margin:0;font-size:15.5px;letter-spacing:-.01em}
  .p-head p{margin:4px 0 0;color:var(--ink-muted);font-size:13px}
  .p-close{display:none}
  .p-body{flex:1;min-height:0;overflow:auto;padding:12px 16px 24px}
  .hint{color:var(--ink-muted);font-size:13px}
  .hint li{margin:4px 0}
  .itabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .itab{border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:2px 9px;font-family:var(--mono);font-size:12px}
  .itab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .fileline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
  .fileline .path{font-family:var(--mono);font-size:12.5px;font-weight:700}
  .fileline .lines{font-family:var(--mono);font-size:12px;color:var(--ink-muted)}
  .alias{border:1px solid var(--border);background:var(--k-db-soft);border-radius:8px;padding:8px 10px;margin:0 0 10px;font-size:12.5px}
  .alias .route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px;font-family:var(--mono);font-size:12px}
  .alias .route span.step{padding:1px 7px;border-radius:6px;border:1px solid var(--border);background:var(--surface)}
  .alias .route span.real{border-color:var(--k-db);color:var(--k-db);font-weight:700}
  .alias .arrow{color:var(--ink-muted)}
  .codebox{border:1px solid var(--border);border-radius:8px;background:var(--code-bg);overflow:auto;max-height:62vh}
  table.code{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.2px;line-height:1.6}
  table.code td{padding:0 10px;vertical-align:top;white-space:pre}
  table.code td.ln{position:sticky;left:0;text-align:right;color:var(--code-gutter);user-select:none;background:var(--code-bg);border-right:1px solid var(--border);min-width:44px;padding-right:8px}
  table.code tr.hl td{background:var(--code-hl)}
  table.code tr.hl td.ln{background:var(--code-hl);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--code-hl-bar)}
  .t-c{color:var(--c-comment);font-style:italic}.t-d{color:var(--c-comment)}.t-s{color:var(--c-str)}.t-k{color:var(--c-kw);font-weight:600}
  .t-f{color:var(--c-fn)}.t-n{color:var(--c-num)}.t-a{color:var(--c-deco)}
  .legend-hl{margin:8px 0 0;font-size:12px;color:var(--ink-muted)}
  .legend-hl b{background:var(--code-hl);color:var(--ink);padding:0 6px;border-radius:4px}
  .flist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
  .flist button{width:100%;text-align:left;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:6px 10px}
  .flist button:hover{border-color:var(--accent)}
  .flist small{display:block;color:var(--ink-muted)}
  details.hdr{margin-top:12px;font-size:13px}
  details.hdr pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px;font-family:var(--sans);font-size:12.5px;color:var(--ink-muted)}

  @media (max-width:900px){
    .app{display:block;height:auto}
    .stage-wrap{max-height:none;overflow-x:auto}
    .panel{position:fixed;left:0;right:0;bottom:0;width:auto;height:62vh;border-left:0;border-top:2px solid var(--accent);
      box-shadow:0 -10px 30px rgba(0,0,0,.25);z-index:20;transform:translateY(105%);transition:transform .18s}
    body.open .panel{transform:none}
    .p-close{display:inline-block;position:absolute;right:12px;top:10px}
    .p-head{position:relative;padding-right:70px}
    .top{padding:12px 16px 8px}
    .stage{padding:16px 16px 70vh}
  }
  @media (prefers-reduced-motion: reduce){.node,.panel{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <header class="top">
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>
      <div class="top-row">
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="stepper"><button class="btn" id="prev">◀ 이전</button><b id="stepNo">–</b><button class="btn" id="next">다음 ▶</button></div>
        <span class="spacer"></span>
        <a class="link" id="mdlink" href="#">📝 설명 문서 보기</a>
        <button class="btn" id="theme" title="라이트/다크 전환">🌓</button>
      </div>
    </header>
    <p class="intro" id="intro"></p>
    <div class="legend" aria-label="범례">
      <span><i style="background:var(--k-screen)"></i>화면 · 도착지</span>
      <span><i style="background:var(--k-route)"></i>routes (입구)</span>
      <span><i style="background:var(--k-helper)"></i>판단 (security · helpers)</span>
      <span><i style="background:var(--k-db)"></i>db (저장소)</span>
      <span><i style="background:var(--k-config)"></i>설정값</span>
      <span><i style="background:var(--k-later);opacity:.6"></i>다른 단원에서 자세히</span>

    </div>
    <div class="stage-wrap" id="stageWrap"><div class="stage" id="stage"></div></div>
  </div>

  <aside class="panel" id="panel" aria-live="polite">
    <div class="p-head">
      <h2 id="pTitle"></h2><p id="pSub"></p>
      <button class="btn p-close" id="pClose">닫기</button>
    </div>
    <div class="p-body" id="pBody"></div>
  </aside>

번도 안 고쳐서 비어있으면(기본값 '') 로그인 아이디로 대신 보여준다.\n    (예전 버전은 항상 아이디만 보여줬는데, 프로필에서 이름을 바꿔도 인사말에\n    반영되지 않는 것처럼 보이는 문제가 있었다 — 이번에 고쳤다.)\n    \"\"\"\n    user = db.get_user_by_id(session[\"user_id\"])\n    if user is None:\n        return _logout_missing_member()\n    display_name = user[\"name\"] if user[\"name\"] else session[\"username\"]\n    return render_template(\n        \"member_dashboard.html\", display_name=display_name, email_status=user.get(\"email_status\")\n    )", "alias": null}, "helpers/auth.py:member_login_required": {"path": "helpers/auth.py", "start": 156, "end": 178, "lang": "python", "code": "def member_login_required(view):\n    \"\"\"\"회원 로그인이 되어 있어야만 들어올 수 있는 방\" 문지기 — login_required와\n    같은 역할이지만, 확인하는 세션 값이 다르다(\"admin_username\"이 아니라\n    \"username\"). 세션에 아이디가 있는지에 더해, 세션 세대 번호(session_version)가\n    DB 값과 같은지도 요청마다 확인한다(guide35 — 아래 본문 주석 참고).\n    관리자 세션과 회원 세션은 서로 다른 키를 쓰기 때문에, 같은\n    브라우저에서 관리자로도 회원으로도 동시에 로그인된 상태가 될 수 있다 —\n    이 프로젝트에서는 문제가 되지 않는다(두 화면이 서로 다른 데이터를 다룸).\n    \"\"\"\n    @wraps(view)\n    def wrapped_view(*args, **kwargs):\n        if \"username\" not in session:\n            return redirect(url_for(\"auth.login\"))\n        # 세션 세대 번호 확인(guide35) — 다른 기기에서 비밀번호를 바꿨다면 DB의 번호가 올라가\n        # 있어서 이 세션은 더 이상 유효하지 않다. 회원이 삭제됐어도(None) 같은 방식으로 끊는다.\n        # 이 기능 이전에 만들어진 세션은 번호가 없으므로 0(기본값)으로 본다.\n        current = db.get_user_session_version(session.get(\"user_id\"))\n        if current is None or current != session.get(\"session_version\", 0):\n            clear_member_session()\n            flash(\"비밀번호가 변경되었거나 계정 정보가 바뀌어 로그아웃되었습니다. 다시 로그인해주세요.\")\n            return redirect(url_for(\"auth.login\"))\n        return view(*args, **kwargs)\n    return wrapped_view", "alias": {"call": "helpers.member_login_required()", "via": "helpers/__init__.py", "real": "helpers/auth.py"}}, "db/users.py:get_user_session_version": {"path": "db/users.py", "start": 195, "end": 200, "lang": "python", "code": "def get_user_session_version(user_id: int) -> int | None:\n    \"\"\"이 회원의 현재 세션 세대 번호. 회원이 없으면(삭제됨) None.\"\"\"\n    res = db.get_client().table(\"users\").select(\"session_version\").eq(\"id\", user_id).limit(1).execute()\n    if not res.data:\n        return None\n    return res.data[0].get(\"session_version\") or 0", "alias": {"call": "db.get_user_session_version()", "via": "db/__init__.py", "real": "db/users.py"}}, "helpers/auth.py:clear_member_session": {"path": "helpers/auth.py", "start": 181, "end": 184, "lang": "python", "code": "def clear_member_session() -> None:\n    \"\"\"회원 로그인 관련 세션 값만 지운다(같은 브라우저의 관리자 세션은 그대로 둔다).\"\"\"\n    for key in (\"username\", \"user_id\", \"session_version\"):\n        session.pop(key, None)", "alias": {"call": "helpers.clear_member_session()", "via": "helpers/__init__.py", "real": "helpers/auth.py"}}, "db/users.py:get_user_by_id": {"path": "db/users.py", "start": 33, "end": 41, "lang": "python", "code": "def get_user_by_id(user_id: int) -> dict | None:\n    \"\"\"회원 번호(id)로 사용자 한 명을 찾는다.\n\n    로그인 세션에는 아이디(username) 문자열뿐 아니라 이 id도 함께 저장해둔다\n    (routes/auth.py의 login_submit() 참고) — 프로필을 수정할 때 \"어느 행을 고칠지\"를\n    아이디가 아니라 변하지 않는 id로 정확히 짚어내기 위해서다.\n    \"\"\"\n    res = db.get_client().table(\"users\").select(\"*\").eq(\"id\", user_id).limit(1).execute()\n    return res.data[0] if res.data else None", "alias": {"call": "db.get_user_by_id()", "via": "db/__init__.py", "real": "db/users.py"}}, "routes/member.py:_logout_missing_member": {"path": "routes/member.py", "start": 38, "end": 49, "lang": "python", "code": "def _logout_missing_member():\n    \"\"\"세션은 남아있는데 실제 계정이 사라진 경우(예: 관리자가 회원 삭제 버튼을\n    눌렀는데 그 회원이 다른 탭에서 아직 로그인 상태였던 경우) 세션을 정리하고\n    로그인 화면으로 돌려보낸다.\n\n    member_login_required도 요청 시작 때 세션 세대 번호를 조회하면서 회원이 삭제됐으면\n    세션을 끊지만(guide35), 그 확인과 화면 처리 사이에 삭제되는 경우까지 대비해 회원용\n    화면들이 db.get_user_by_id()로 다시 한번 확인하고, 없으면 이 함수를 부른다.\n    \"\"\"\n    clear_member_session()\n    flash(\"계정 정보를 찾을 수 없습니다. 다시 로그인해주세요.\")\n    return redirect(url_for(\"auth.login\"))", "alias": null}, "routes/member.py:member_history": {"path": "routes/member.py", "start": 72, "end": 83, "lang": "python", "code": "@member_bp.route(\"/dashboard/history\", methods=[\"GET\"])\n@member_login_required\ndef member_history():\n    \"\"\"본인의 최근 로그인 시도 기록만 보여준다.\n\n    db.list_attempts_by_username()에 session[\"username\"]을 넘겨서, 다른 회원의\n    시도 기록은 애초에 조회조차 되지 않게 한다 — \"권한 확인 후 전체를 가져와서\n    화면에서 걸러낸다\"가 아니라 \"애초에 본인 것만 데이터베이스에 물어본다\"가\n    더 안전한 설계다.\n    \"\"\"\n    attempts = _attach_locations(db.list_attempts_by_username(session[\"username\"], 20))\n    return render_template(\"member_history.html\", attempts=attempts)", "alias": null}, "db/attempts.py:list_attempts_by_username": {"path": "db/attempts.py", "start": 179, "end": 195, "lang": "python", "code": "def list_attempts_by_username(username: str, limit: int = 20) -> list[dict]:\n    \"\"\"특정 아이디의 로그인 시도 기록만 최신순으로 가져온다.\n\n    list_recent_attempts()와 거의 똑같지만, 관리자용(전체 IP/전체 사용자)이 아니라\n    회원 본인이 \"내가 언제 로그인을 시도했는지\"만 볼 수 있게 아이디로 걸러낸다는\n    점이 다르다. 회원 대시보드의 \"최근 로그인 기록\" 화면에서 쓰인다.\n    \"\"\"\n    res = (\n        db.get_client()\n        .table(\"login_attempts\")\n        .select(\"*\")\n        .eq(\"username\", username)\n        .order(\"attempted_at\", desc=True)\n        .limit(limit)\n        .execute()\n    )\n    return res.data", "alias": {"call": "db.list_attempts_by_username()", "via": "db/__init__.py", "real": "db/attempts.py"}}, "helpers/request_utils.py:_attach_locations": {"path": "helpers/request_utils.py", "start": 18, "end": 30, "lang": "python", "code": "def _attach_locations(attempts: list[dict]) -> list[dict]:\n    \"\"\"로그인 시도 목록 각 줄에 \"location\"이라는 새 칸을 추가해서 돌려준다.\n\n    geoip.get_locations()는 IP 목록을 한 번에 넘기면 IP 하나당 몇 번씩\n    조회하는 게 아니라 필요한 만큼만(캐시에 없는 것만) 조회해준다. 여기서는\n    그 결과를 각 시도 기록에 사람이 읽을 문자열(geoip.format_location())로\n    바꿔 붙여주기만 한다.\n    \"\"\"\n    ips = [attempt[\"ip_address\"] for attempt in attempts]\n    locations = geoip.get_locations(ips)\n    for attempt in attempts:\n        attempt[\"location\"] = geoip.format_location(locations[attempt[\"ip_address\"]])\n    return attempts", "alias": {"call": "helpers._attach_locations()", "via": "helpers/__init__.py", "real": "helpers/request_utils.py"}}, "services/geoip.py:get_locations": {"path": "services/geoip.py", "start": 72, "end": 96, "lang": "python", "code": "def get_locations(ips: list[str]) -> dict[str, dict]:\n    \"\"\"여러 IP의 위치를 한 번에 조회한다. 캐시에 없는 IP만 새로 ip-api.com에 묻는다.\n\n    처리 순서:\n    1. 중복 IP를 제거한다(같은 IP가 로그에 여러 번 나타나는 건 흔한 일이라,\n       똑같은 IP를 두 번 조회하는 낭비를 막는다).\n    2. db.get_cached_ip_locations()로 \"이미 알고 있는 IP들\"을 한 번에 가져온다.\n    3. 캐시에 없는 IP만 하나씩 _fetch_location()으로 새로 조회하고, 결과를\n       db.save_ip_location()으로 캐시에 저장해서 다음에는 또 안 물어봐도 되게 한다.\n\n    반환값은 {\"1.2.3.4\": {\"country\": ..., \"region_name\": ..., \"city\": ..., \"lookup_failed\": ...}, ...}\n    형태다.\n    \"\"\"\n    unique_ips = list(dict.fromkeys(ips))  # 순서는 유지하면서 중복만 제거\n    cached = db.get_cached_ip_locations(unique_ips)\n\n    result = {}\n    for ip in unique_ips:\n        if ip in cached:\n            result[ip] = cached[ip]\n            continue\n        location = _fetch_location(ip)\n        db.save_ip_location(ip, location[\"country\"], location[\"region_name\"], location[\"city\"], location[\"lookup_failed\"])\n        result[ip] = location\n    return result", "alias": null}, "routes/member.py:member_profile_submit": {"path": "routes/member.py", "start": 99, "end": 114, "lang": "python", "code": "@member_bp.route(\"/dashboard/profile\", methods=[\"POST\"])\n@member_login_required\ndef member_profile_submit():\n    \"\"\"프로필(표시 이름) 수정 폼 제출을 처리한다.\n\n    이메일은 더 이상 이 폼에서 바꾸지 않는다(guide40) — 세션만 있으면 바로 바뀌던 구조라 세션을\n    탈취한 사람이 이메일을 자기 주소로 바꿔 계정을 가져갈 수 있었다. 이메일 변경은 아래\n    member_email_change_submit()이 현재 비밀번호 확인 + 새 주소 확인 링크로 처리한다.\n\n    처리가 끝나면 render_template으로 바로 화면을 그리지 않고 redirect()로\n    /dashboard/profile을 \"다시 방문\"하게 만든다(\"Post-Redirect-Get\" 패턴).\n    \"\"\"\n    name = request.form.get(\"name\", \"\").strip()\n    db.update_user_name(session[\"user_id\"], name)\n    flash(\"프로필이 수정되었습니다.\")\n    return redirect(url_for(\"member.member_profile\"))", "alias": null}, "db/users.py:update_user_name": {"path": "db/users.py", "start": 93, "end": 101, "lang": "python", "code": "def update_user_name(user_id: int, name: str) -> None:\n    \"\"\"회원 본인이 프로필 화면에서 \"표시 이름\"을 바꿀 때 쓰인다.\n\n    예전 update_user_profile()은 이메일도 함께 바로 바꿨다 — 세션만 있으면 비밀번호 확인도\n    메일 확인도 없이 이메일을 바꿀 수 있어서, 세션을 탈취한 사람이 이메일을 자기 주소로 바꿔\n    계정을 가져갈 수 있었다(guide40). 이메일 변경은 이제 현재 비밀번호 + 새 주소로 보낸 확인\n    링크를 거쳐 change_user_email()로만 일어난다.\n    \"\"\"\n    db.get_client().table(\"users\").update({\"name\": name}).eq(\"id\", user_id).execute()", "alias": {"call": "db.update_user_name()", "via": "db/__init__.py", "real": "db/users.py"}}, "routes/member.py:member_email_change_submit": {"path": "routes/member.py", "start": 117, "end": 161, "lang": "python", "code": "@member_bp.route(\"/dashboard/email/change\", methods=[\"POST\"])\n@member_login_required\ndef member_email_change_submit():\n    \"\"\"이메일 변경 요청(guide40). 현재 비밀번호를 확인한 뒤 새 주소로 확인 링크를 보낸다 —\n    링크를 눌러야(routes/email.py) 실제로 바뀌고, 바뀌면 기존 주소로 알림이 간다.\n\n    현재 비밀번호를 틀리면 비밀번호 변경(guide35)과 똑같이 로그인 실패로 기록하고 같은 기준으로\n    잠근다. 그 주소를 다른 계정이 쓰고 있어도 화면 응답은 똑같다(email_verification 참고).\n    \"\"\"\n    ip = get_request_ip()\n    username = session[\"username\"]\n\n    if is_bot_submission():\n        soar.notify_bot_detected(ip, request.path)\n        flash(\"일시적인 오류가 발생했습니다. 다시 시도해주세요.\")\n        return redirect(url_for(\"member.member_profile\"))\n\n    user = db.get_user_by_id(session[\"user_id\"])\n    if user is None:\n        return _logout_missing_member()\n\n    new_email = request.form.get(\"new_email\", \"\").strip()\n    current_password = request.form.get(\"current_password\", \"\")\n    if not new_email or not current_password:\n        flash(\"새 이메일과 현재 비밀번호를 모두 입력해주세요.\")\n        return redirect(url_for(\"member.member_profile\"))\n    if not config.EMAIL_PATTERN.match(new_email):\n        flash(\"올바른 이메일 형식이 아닙니다.\")\n        return redirect(url_for(\"member.member_profile\"))\n    if new_email.lower() == user[\"email\"].lower():\n        flash(\"지금 쓰고 있는 이메일과 같습니다.\")\n        return redirect(url_for(\"member.member_profile\"))\n\n    if not db.verify_user_credentials(username, current_password):\n        db.log_attempt(ip, username, False)\n        if _lock_if_suspicious(ip, username):\n            clear_member_session()\n            flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n            return redirect(url_for(\"auth.login\"))\n        flash(\"현재 비밀번호가 올바르지 않습니다.\")\n        return redirect(url_for(\"member.member_profile\"))\n\n    result = email_verification.request_email_change(user, new_email, ip)\n    flash(_EMAIL_REQUEST_MESSAGES.get(result, _EMAIL_CHANGE_SENT_MESSAGE))\n    return redirect(url_for(\"member.member_profile\"))", "alias": null}, "db/users.py:verify_user_credentials": {"path": "db/users.py", "start": 73, "end": 90, "lang": "python", "code": "def verify_user_credentials(username: str, password: str) -> bool:\n    \"\"\"사용자가 로그인 화면에 입력한 아이디/비밀번호가 맞는지 확인한다.\n\n    동작 원리는 verify_admin_credentials와 동일 — 저장된 암호문과\n    \"지금 입력한 비밀번호를 암호화한 결과\"가 일치하는지만 비교한다.\n\n    타이밍 사이드채널 방지 (L7 공격 보강 계획 Tier 3): 예전에는 아이디가 없으면\n    check_password_hash()를 아예 건너뛰고 바로 False를 돌려줬다. 이 해시 비교는\n    일부러 느리게 설계된 연산이라, \"즉시 반환(아이디 없음)\"과 \"해시 비교 후\n    반환(비밀번호만 틀림)\" 사이에 응답 시간 차이가 생겨 공격자가 그 차이만으로\n    \"이 아이디가 존재하는가\"를 추측할 수 있었다(화면 메시지는 이미 통일돼\n    있었지만 타이밍까지는 못 가렸다). 아이디가 없을 때도 미리 만들어둔 더미\n    해시로 항상 같은 비교 연산을 거치게 해서 응답 시간을 균일화한다.\n    \"\"\"\n    user = get_user_by_username(username)\n    password_hash = user[\"password_hash\"] if user else _DUMMY_PASSWORD_HASH\n    result = check_password_hash(password_hash, password)\n    return result if user else False", "alias": {"call": "db.verify_user_credentials()", "via": "db/__init__.py", "real": "db/users.py"}}, "db/attempts.py:log_attempt": {"path": "db/attempts.py", "start": 19, "end": 26, "lang": "python", "code": "def log_attempt(ip: str, username: str, success: bool) -> None:\n    \"\"\"로그인 시도 한 건을 login_attempts 표에 새 줄로 저장한다.\n\n    CCTV처럼 \"누가 지나갔다\"는 기록을 계속 쌓기만 하고, 절대 지우거나 덮어쓰지 않는다.\n    \"\"\"\n    db.get_client().table(\"login_attempts\").insert(\n        {\"ip_address\": ip, \"username\": username, \"success\": success}\n    ).execute()", "alias": {"call": "db.log_attempt()", "via": "db/__init__.py", "real": "db/attempts.py"}}, "routes/member.py:_lock_if_suspicious": {"path": "routes/member.py", "start": 245, "end": 261, "lang": "python", "code": "def _lock_if_suspicious(ip: str, username: str) -> bool:\n    \"\"\"비밀번호 변경·이메일 변경 화면에서 현재 비밀번호를 틀렸을 때, 로그인 실패와 같은 기준으로 잠근다.\n    이번 실패로 잠금이 걸렸으면 True. 이미 잠긴 IP(예: 영구 잠금 예외로 들어온 회원)는 다시\n    잠그지 않는다 — 같은 IP에 5분 잠금 알림이 중복으로 나가지 않게 하기 위해서다.\"\"\"\n    locked = False\n    if not detector.is_locked(ip):\n        suspicious, failure_count = detector.is_suspicious(ip)\n        if suspicious:\n            soar.enforce_lockout(ip, failure_count, detector.count_distinct_usernames(ip))\n            locked = True\n    account_suspicious, account_failure_count = detector.is_account_suspicious(username)\n    if account_suspicious:\n        soar.enforce_account_lockout(\n            username, account_failure_count, detector.count_distinct_ips_by_username(username), ip\n        )\n        locked = True\n    return locked", "alias": null}, "security/detector.py:is_suspicious": {"path": "security/detector.py", "start": 27, "end": 38, "lang": "python", "code": "def is_suspicious(ip: str) -> tuple[bool, int]:\n    \"\"\"이 IP가 \"수상한 상태\"인지 판단한다.\n\n    판단 기준: 최근 60초(config.DETECTION_WINDOW_SECONDS) 안에 실패한 횟수가\n    기준치(FAILURE_THRESHOLD, 기본 5회)를 \"초과\"했는가?\n\n    반환값은 (수상한가?, 실제 실패 횟수) 형태의 튜플(값 2개를 한 번에 묶어서 돌려주는 것).\n    예: (True, 6)  → \"수상함, 지금까지 6번 실패했음\"\n        (False, 3) → \"아직 수상하지 않음, 3번 실패했음\"\n    \"\"\"\n    failure_count = db.count_recent_failures(ip)\n    return failure_count > FAILURE_THRESHOLD, failure_count", "alias": null}, "security/soar/lockouts.py:enforce_lockout": {"path": "security/soar/lockouts.py", "start": 17, "end": 58, "lang": "python", "code": "def enforce_lockout(\n    ip: str, failure_count: int, distinct_usernames: int, is_admin: bool = False\n) -> None:\n    \"\"\"이 IP에 실제로 잠금을 걸고, 그 사실을 Slack으로 알리고, CRITICAL 이벤트로 기록한다.\n\n    네 단계로 이루어진다:\n    1. db.create_lockout()으로 \"이 IP는 지금부터 5분간 잠김\"을 데이터베이스에 저장\n    2. alert.send_lockout_alert()로 \"IP, 실패 횟수, 조치 내용\"을 담은 알림을 전송\n    3. _record_event()로 위험등급(CRITICAL)과 함께 security_events에 기록하고 상관분석 훅 호출\n       (security-risk-response-summary.md 5절 — 관리자 대시보드/이력 조회용)\n    4. lockdown.after_temporary_lock()으로 잠금 이력을 남기고 영구 잠금 승격 여부 판단(guide33)\n\n    알림을 \"잠그는 순간에 딱 한 번만\" 보내는 이유: 만약 잠긴 상태에서도 계속\n    로그인을 시도할 때마다 매번 알림을 보내면, 관리자가 알림 폭탄을 맞아 정작\n    중요한 알림을 놓치게 된다(이른바 \"알림 피로\"). 그래서 \"새로 잠기는 순간\"에만 알린다.\n\n    distinct_usernames는 detector.count_distinct_usernames()(또는 관리자용)가 센\n    \"이 IP가 최근에 시도한 서로 다른 아이디 개수\"다 — 1개면 계정 하나에 집중된\n    Brute Force, 2개 이상이면 여러 계정을 돌아가며 두드리는 Password Spraying으로\n    의심할 수 있으므로, notify/alert.py가 Slack 메시지에 이 값으로 패턴을 구분해 보여준다.\n\n    is_admin은 이 잠금이 /login이 아니라 /admin/login에서 발생했는지를 나타낸다 —\n    관리자 로그인 무차별 대입은 Brute Force/Password Spraying과 별도의 event_type으로\n    기록하고, notify/alert.py의 Slack 메시지에도 그대로 표시한다.\n    \"\"\"\n    db.create_lockout(ip, failure_count)\n    alert.send_lockout_alert(\n        ip, failure_count, datetime.now(timezone.utc), distinct_usernames, is_admin\n    )\n\n    if is_admin:\n        event_type = \"ADMIN_BRUTE_FORCE\"\n    elif distinct_usernames > 1:\n        event_type = \"PASSWORD_SPRAYING\"\n    else:\n        event_type = \"BRUTE_FORCE\"\n    _record_event(event_type, \"CRITICAL\", ip, None, failure_count, \"LOCKED\")\n\n    # 잠금 이력을 남기고, 최근 기간 안에 N번째 잠금이면 영구 잠금으로 승격한다\n    # (guide33, T1/T5). 임시 잠금 알림·이벤트 기록이 모두 끝난 뒤에 실행해서, 영구\n    # 잠금 이벤트(PERMANENT_LOCK)가 같은 사건의 \"그 다음 단계\"로 기록되게 한다.\n    lockdown.after_temporary_lock(\"ip\", ip, event_type, failure_count)", "alias": {"call": "soar.enforce_lockout()", "via": "security/soar/__init__.py", "real": "security/soar/lockouts.py"}}, "services/email_verification.py:request_email_change": {"path": "services/email_verification.py", "start": 113, "end": 132, "lang": "python", "code": "def request_email_change(user: dict, new_email: str, ip: str) -> str:\n    \"\"\"새 주소로 변경 확인 링크를 보낸다. 이메일은 링크를 눌러야 바뀐다.\n\n    그 주소를 다른 계정이 이미 쓰고 있으면 링크 대신 \"이미 등록된 주소\" 안내 메일을 보낸다.\n    어느 쪽이든 토큰 행은 똑같이 만들고(하루 한도·쿨다운에 들어가게, 처리 시간도 비슷하게),\n    호출부(화면)에는 똑같이 SENT를 돌려준다 — 화면으로는 남의 이메일 가입 여부를 알 수 없다.\n    \"\"\"\n    purpose = db.email_tokens.PURPOSE_EMAIL_CHANGE\n    if _rate_limited(user[\"id\"], purpose):\n        return RATE_LIMITED\n    issued = _issue(user[\"id\"], purpose, new_email, ip)\n    if issued is None:\n        return UNAVAILABLE\n    row, link = issued\n\n    if db.is_email_taken(new_email, exclude_user_id=user[\"id\"]):\n        db.revoke_email_token(row[\"id\"])\n        mailer.send_email_in_use_notice(new_email)\n        return SENT\n    return _after_send(user[\"id\"], row, mailer.send_email_change_confirmation(new_email, link))", "alias": null}, "routes/member.py:member_password_submit": {"path": "routes/member.py", "start": 184, "end": 242, "lang": "python", "code": "@member_bp.route(\"/dashboard/password\", methods=[\"POST\"])\n@member_login_required\ndef member_password_submit():\n    \"\"\"비밀번호 변경 폼 제출을 처리한다(guide35).\n\n    1) 새 비밀번호 형식을 먼저 확인한다 — 여기서 걸리는 건 본인 확인과 무관한 입력 실수라서\n       실패 횟수에 넣지 않는다.\n    2) 현재 비밀번호를 확인한다 — 세션만 탈취한 사람이 비밀번호를 바꾸지 못하게 하는 장치다.\n       틀리면 로그인 실패와 똑같이 기록하고 같은 임계값으로 잠근다. 그러지 않으면 이 화면이\n       \"로그인 잠금 없이 비밀번호를 무한히 맞춰보는\" 우회로가 된다.\n    3) 바꾸면 세션 세대 번호가 올라가 다른 기기의 로그인이 모두 끊긴다(이 기기는 유지).\n       계정 이메일로 변경 알림을 보내서, 본인이 한 일이 아니면 바로 알 수 있게 한다.\n    \"\"\"\n    ip = get_request_ip()\n    username = session[\"username\"]\n\n    if is_bot_submission():\n        soar.notify_bot_detected(ip, request.path)\n        flash(\"일시적인 오류가 발생했습니다. 다시 시도해주세요.\")\n        return redirect(url_for(\"member.member_profile\"))\n\n    user = db.get_user_by_id(session[\"user_id\"])\n    if user is None:\n        return _logout_missing_member()\n    if detector.is_account_locked(username):\n        clear_member_session()\n        flash(\"잠긴 계정입니다. 잠시 후 다시 로그인해주세요.\")\n        return redirect(url_for(\"auth.login\"))\n\n    current_password = request.form.get(\"current_password\", \"\")\n    new_password = request.form.get(\"new_password\", \"\")\n    new_password_confirm = request.form.get(\"new_password_confirm\", \"\")\n\n    if not current_password or not new_password:\n        flash(\"현재 비밀번호와 새 비밀번호를 모두 입력해주세요.\")\n        return redirect(url_for(\"member.member_profile\"))\n    if len(new_password) < config.MIN_PASSWORD_LENGTH:\n        flash(f\"새 비밀번호는 최소 {config.MIN_PASSWORD_LENGTH}자 이상이어야 합니다.\")\n        return redirect(url_for(\"member.member_profile\"))\n    if new_password != new_password_confirm:\n        flash(\"새 비밀번호와 확인이 일치하지 않습니다.\")\n        return redirect(url_for(\"member.member_profile\"))\n    if new_password == current_password:\n        flash(\"새 비밀번호가 현재 비밀번호와 같습니다.\")\n        return redirect(url_for(\"member.member_profile\"))\n\n    if not db.verify_user_credentials(username, current_password):\n        db.log_attempt(ip, username, False)\n        if _lock_if_suspicious(ip, username):\n            clear_member_session()\n            flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n            return redirect(url_for(\"auth.login\"))\n        flash(\"현재 비밀번호가 올바르지 않습니다.\")\n        return redirect(url_for(\"member.member_profile\"))\n\n    session[\"session_version\"] = db.update_user_password(user[\"id\"], new_password)\n    mailer.send_password_changed_notice(user[\"email\"])\n    flash(\"비밀번호가 변경되었습니다. 다른 기기의 로그인은 모두 해제되었습니다.\")\n    return redirect(url_for(\"member.member_profile\"))", "alias": null}, "db/users.py:update_user_password": {"path": "db/users.py", "start": 203, "end": 223, "lang": "python", "code": "def update_user_password(user_id: int, new_password: str) -> int:\n    \"\"\"비밀번호를 바꾸고 세션 세대 번호를 1 올린 뒤, 새 번호를 돌려준다.\n\n    번호는 \"읽은 값 그대로일 때만\" 올린다(조건부 UPDATE) — 두 기기에서 거의 동시에 바꾸는\n    드문 경우에도 번호가 한 번 덜 올라가 이전 세션이 살아남는 일이 없게, 경쟁에서 지면\n    다시 읽어서 한 번 더 시도한다.\n    \"\"\"\n    password_hash = generate_password_hash(new_password)\n    for _ in range(3):\n        current = get_user_session_version(user_id) or 0\n        res = (\n            db.get_client()\n            .table(\"users\")\n            .update({\"password_hash\": password_hash, \"session_version\": current + 1})\n            .eq(\"id\", user_id)\n            .eq(\"session_version\", current)\n            .execute()\n        )\n        if res.data:\n            return current + 1\n    raise RuntimeError(\"비밀번호 변경 중 세션 번호 갱신 경쟁이 반복되었습니다.\")", "alias": {"call": "db.update_user_password()", "via": "db/__init__.py", "real": "db/users.py"}}, "notify/mailer.py:send_password_changed_notice": {"path": "notify/mailer.py", "start": 202, "end": 209, "lang": "python", "code": "def send_password_changed_notice(to_address: str) -> str:\n    \"\"\"비밀번호가 바뀌었다는 사실을 계정 이메일로 알린다(guide35) — 세션을 탈취한 사람이 바꿨다면\n    본인이 바로 알아챌 수 있게 하는 장치다. 실패해도 비밀번호 변경 자체는 그대로 유지된다.\"\"\"\n    body = (\n        \"로그인 워치독 계정의 비밀번호가 변경되었습니다. 다른 기기의 로그인은 모두 해제되었습니다.\\n\\n\"\n        \"본인이 변경한 것이 아니라면 즉시 관리자에게 알려주세요.\"\n    )\n    return _send_mail(to_address, \"[로그인 워치독] 비밀번호가 변경되었습니다\", body)", "alias": null}}, "files": {"routes/member.py": {"role": "회원 전용 화면(/dashboard …)의 입구 파일. 모든 화면이 '회원 문지기'로 보호된다.", "header": "routes/member.py — 회원 대시보드 (/dashboard) — 전부 member_login_required로 보호됨\n이름이 \"/admin/dashboard\"와 비슷해 보이지만 완전히 다른 화면이다. 회원은\n본인 계정에 관한 정보만 볼 수 있고, 다른 회원 정보나 관리자 기능(잠긴 IP,\n전체 회원 목록 등)에는 접근할 수 없다 — member_login_required와\nlogin_required가 서로 다른 세션 키를 확인하기 때문에 이 구분이 코드 수준에서\n강제된다.\n원래 app.py의 \"회원 대시보드\" 섹션을 그대로 옮겨왔다. 배경은\ndocs/refactor/2026-09-15-file-split.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/member.py"}, "helpers/auth.py": {"role": "관리자·회원 문지기(로그인 확인 장치)와 세션 정리 함수 모음.", "header": "helpers/auth.py — 관리자/회원 세션과 로그인·권한 문지기(데코레이터)\n예전 helpers.py(314줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from helpers import ...`로 가져다 쓴다(helpers/__init__.py가\n재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/helpers/auth.py"}, "db/users.py": {"role": "회원(users 표) 조회·수정·비밀번호 확인을 담당하는 저장소 파일.", "header": "db/users.py — users 표 관련 함수 (회원가입 기능)\n— 감시 대상이 되는 가짜 로그인 화면(/login)에 실제로 가입해서 로그인하는\n\"일반 사용자\" 계정을 관리하는 기능. 관리자(admin_users)와는 완전히 별개 개념.\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/users.py"}, "db/attempts.py": {"role": "로그인 시도 기록을 쓰고 읽는 저장소 파일.", "header": "db/attempts.py — login_attempts 표 관련 함수\n— \"누가 언제 어떤 IP에서 로그인에 성공/실패했는지\"를 기록하고 조회하는 기능\n원래 db.py의 같은 이름 섹션을 그대로 옮겨왔다. 이 모듈은 내부에서 `import db`로\n패키지 최상위(db/__init__.py)를 다시 참조해서 db.get_client()를 호출한다 —\ndb.attempts.get_client가 아니라 이렇게 해야, 테스트가\nmonkeypatch.setattr(db, \"get_client\", ...)로 db 패키지의 get_client를 바꿔치기\n했을 때 이 파일의 함수들도 그 가짜 버전을 그대로 쓰게 된다(값을 미리 복사해서\n이 파일 안에 별도 이름으로 묶어두면 그 바꿔치기가 안 먹는다).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/attempts.py"}, "helpers/request_utils.py": {"role": "요청에서 IP를 알아내고, 시도 기록에 위치(국가·도시)를 붙이는 공용 도구.", "header": "helpers/request_utils.py — 요청 정보(IP, 허니팟) 읽기와 화면용 작은 변환 함수\n예전 helpers.py(314줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from helpers import ...`로 가져다 쓴다(helpers/__init__.py가\n재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/helpers/request_utils.py"}, "services/geoip.py": {"role": "IP 주소를 국가·도시로 바꿔주는 파일. (4단원)", "header": "services/geoip.py — IP 주소로 \"어느 나라, 어느 도시에서 접속했는지\" 알아내는 부품\nnotify/alert.py가 Slack이라는 외부 서비스와의 통신만 전담하는 것처럼, 이 파일은\nip-api.com이라는 외부 서비스와의 통신만 전담한다. db(Supabase)나\n화면 쪽(helpers/request_utils.py의 _attach_locations())은 이 파일이 내부적으로\n무엇을 하는지 몰라도, get_locations() 함수 하나만 부르면 위치 정보를 받을 수 있다.\n가장 중요한 설계 포인트는 \"캐싱\"이다. ip-api.com 무료 사용은 분당 45건까지만\n허용하는데, 대시보드가 5초마다 최근 로그인 시도를 다시 그리면서 그때마다\n새로 조회하면 순식간에 한도를 넘긴다. 그래서 한 번 조회한 IP는 db(db/geoip_cache.py)를 통해\nSupabase에 저장해두고, 다음부터는 외부 API 대신 그 저장값을 재사용한다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/services/geoip.py"}, "security/detector.py": {"role": "'수상한가?'를 판정만 하는 판사 역할 파일. (5단원)", "header": "security/detector.py — \"판사\" 역할: 지금 이 IP가 수상한지, 지금 잠겨있는지만 판단한다\n이 파일은 데이터베이스의 상태를 절대 바꾸지 않는다(아무것도 저장/수정/삭제하지 않음).\n오직 db에게 \"지금 상태가 어때?\"라고 물어보고, 그 답을 바탕으로\nTrue/False 같은 \"판정 결과\"만 돌려준다.\n실제로 잠그거나 알림을 보내는 \"실행\"은 이 파일이 아니라 security/soar/가 담당한다\n(판단과 실행을 분리해두면, \"판단 기준만 바꾸고 싶다\" 같은 수정이 훨씬 쉬워진다).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/detector.py"}, "security/soar/lockouts.py": {"role": "판정 결과대로 IP·계정을 실제로 잠그는 집행관 파일. (10단원)", "header": "security/soar/lockouts.py — 잠금 집행(IP/회원 계정/관리자 계정)과 자동·수동 해제\n예전 soar.py(497줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from security import soar` 후 `soar.enforce_lockout(...)`으로\n쓴다(security/soar/__init__.py가 재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/soar/lockouts.py"}, "services/email_verification.py": {"role": "인증 메일·이메일 변경 확인 메일을 다루는 파일. (23단원)", "header": "services/email_verification.py — \"이메일 담당\": 이메일 인증 / 이메일 변경 확인 링크를 만들고 처리한다 (guide40)\n왜 필요한가: 비밀번호 재설정(guide41)은 \"계정을 되찾는 메일\"이라 확인된 주소로만 보내야 한다.\n그런데 지금까지 가입 이메일은 형식만 검사했고(오타·남의 주소 그대로 저장), 이메일 변경은 세션만\n있으면 비밀번호 확인도 없이 바로 됐다(세션 탈취 → 이메일 바꿔치기 → 계정 탈취). 이 모듈이\n1) 가입 직후·대시보드에서 인증 링크를 보내고(EMAIL_VERIFY → users.email_status = VERIFIED)\n2) 이메일 변경을 \"새 주소로 보낸 링크를 눌러야 반영\"되게 하고(EMAIL_CHANGE), 바뀌면 옛 주소로 알린다.\n원칙은 영구 잠금 복구(routes/recovery.py)와 같다 — 토큰은 해시만 저장, 링크는 PUBLIC_BASE_URL로만,\nGET은 확인 화면만(메일 스캐너가 미리 열어도 안 닳게) 실제 처리는 POST에서 조건부 1회 소비.\n메일 링크를 눌렀다는 것 자체가 그 메일함의 주인이라는 증거라서, 처리하면 VERIFIED가 된다.\n비밀번호 재설정(guide41)도 같은 표(email_tokens, PASSWORD_RESET)와 같은 원칙으로 이 파일이 처리한다 —\n단, 재설정 메일은 \"계정을 되찾는 메일\"이라 VERIFIED 주소에만 보낸다.\n라우트(routes/member.py, routes/email.py, routes/auth.py, routes/password.py, routes/recovery.py)는 \"언제\" 부를지만 정하고, 실제\n판단·발송은 전부 이 파일이 한다 — notify/alert.py·notify/mailer.py처럼 결과를 예외 대신 값으로 돌려준다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/services/email_verification.py"}, "notify/mailer.py": {"role": "메일 발송 담당 파일. (17·18단원)", "header": "notify/mailer.py — \"우체부\" 역할: 사용자에게 가는 메일을 실제로 보낸다\n(영구 잠금 복구 guide34-a, 비밀번호 변경 알림 guide35, 이메일 인증·변경 guide40,\n비밀번호 재설정 guide41)\nnotify/alert.py(Slack)와 같은 구조다 — 메시지를 조립하는 함수(send_recovery_email 등)와\n실제로 내보내는 함수 하나(_send_mail)로 나뉜다. \"언제 보낼지\"는 이 파일이 아니라\nroutes/recovery.py, routes/member.py, services/email_verification.py가 결정한다.\n전송 결과는 예외가 아니라 세 가지 문자열 중 하나로 돌려준다:\nSENT    — 메일 서버가 받아줬다\nREFUSED — 메일 서버가 \"그런 수신자는 없다\"고 영구적으로 거부했다(5xx).\n존재하지 않는 이메일 주소일 가능성이 높다 → 호출부가 계정의\nemail_status를 UNDELIVERABLE로 올린다\nFAILED  — 설정이 없거나 네트워크/일시 장애라 못 보냈다(이메일 문제라고 단정할 수 없음)\n(Gmail처럼 일단 받고 나중에 반송하는 비동기 반송은 SMTP 응답만으로는 알 수 없다.)\nFAILED일 때는 원인을 네 가지로 나눠 기록하고(설정/인증/연결/기타) 관리자에게 Slack으로\n알린다. 사용자 화면은 계정 존재 여부가 드러나지 않게 항상 같은 안내를 보여주기 때문에,\n알림이 없으면 메일 설정이 틀려도 아무도 모른 채 \"메일을 보냈습니다\"만 계속 뜨게 된다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/notify/mailer.py"}}}</script>
<script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var $ = function(id){ return document.getElementById(id); };
  var KIND_LABEL = {screen:"화면 · 도착지", route:"routes", helper:"판단", db:"db", config:"설정값", later:"다른 단원"};

  var state = { sc: 0, node: null, item: 0, file: null };

  function el(tag, attrs, kids){
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function brk(t){ return t.replace(/([\/._])/g, "$1\u200b"); }
  function scen(){ return D.scenarios[state.sc]; }
  function nodeById(id){ return scen().nodes.filter(function(n){ return n.id === id; })[0]; }
  function fnName(label){ return label; }

  /* ---------- 간단 문법 강조 ---------- */
  var PY = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?''')|([rbfRBF]{0,2}"(?:\\.|[^"\\\n])*"|[rbfRBF]{0,2}'(?:\\.|[^'\\\n])*')|\b(def|class|return|if|elif|else|for|while|import|from|as|try|except|finally|with|in|not|and|or|is|None|True|False|raise|pass|lambda|yield|global|nonlocal|assert|del|continue|break)\b|(@[A-Za-z_][\w.]*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(?=\()/g;
  var PYC = [null,"t-c","t-d","t-s","t-k","t-a","t-n","t-f"];
  var HT = /(<!--[\s\S]*?-->)|(\{[{%#][\s\S]*?[}%#]\})|(<\/?[A-Za-z][\w-]*)|("[^"\n]*")|(\/?>)/g;
  var HTC = [null,"t-c","t-a","t-k","t-s","t-k"];
  var JS = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\.|[^`\\])*`)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(const|let|var|function|return|if|else|for|while|import|from|export|default|async|await|try|catch|finally|new|class|extends|typeof|interface|type|null|undefined|true|false|throw|switch|case|break|continue|of|in|as)\b|(@[A-Za-z_]\w*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_$][\w$]*)(?=\()/g;
  var JSC = [null,"t-c","t-s","t-s","t-k","t-a","t-n","t-f"];
  var SQ = /(--[^\n]*|\/\*[\s\S]*?\*\/)|((?!))|('(?:''|[^'])*')|\b(select|from|where|insert|into|values|update|set|delete|create|table|index|alter|add|drop|on|conflict|do|nothing|and|or|not|null|default|primary|key|references|cascade|if|exists|as|order|by|group|limit|desc|asc|join|left|inner|count|returns|function|language|begin|end|return|with|union|all|distinct|in|is|true|false|unique|check|constraint|timestamptz|text|integer|bigint|boolean|interval|now|replace|trigger|view|policy|enable|row|level|security|using)\b|((?!))|\b(\d+(?:\.\d+)?)\b|\b([a-z_]\w*)(?=\()/gi;
  var SQC = [null,"t-c",null,"t-s","t-k",null,"t-n","t-f"];
  var SH = /(#[^\n]*)|((?!))|("(?:\\.|[^"\\\n])*"|'[^'\n]*')|\b(if|then|else|fi|for|do|done|while|case|esac|function|echo|export|python|pip|git|cd|run|name|on|jobs|steps|uses|with|env)\b|((?!))|\b(\d+)\b/g;
  var SHC = [null,"t-c",null,"t-s","t-k",null,"t-n"];
  function tokenize(code, lang){
    var re = PY, cls = PYC;
    if (lang === "html"){ re = HT; cls = HTC; }
    else if (lang === "js"){ re = JS; cls = JSC; }
    else if (lang === "sql"){ re = SQ; cls = SQC; }
    else if (lang === "sh"){ re = SH; cls = SHC; }
    var lines = [[]];
    function push(text, c){
      var parts = text.split("\n");
      parts.forEach(function(p, i){
        if (i > 0) lines.push([]);
        if (p) lines[lines.length-1].push([p, c]);
      });
    }
    var last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(code)) !== null){
      if (m.index > last) push(code.slice(last, m.index), null);
      var idx = 1; while (idx < m.length && m[idx] === undefined) idx++;
      push(m[0], cls[idx] || null);
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++;
    }
    if (last < code.length) push(code.slice(last), null);
    return lines;
  }

  function codeTable(block, hl){
    var lines = tokenize(block.code, block.lang);
    var tbody = el("tbody");
    var hlFirst = null;
    lines.forEach(function(segs, i){
      var no = block.start + i;
      var on = hl && no >= hl[0] && no <= hl[1];
      var td = el("td", {class:"tx"});
      segs.forEach(function(s){ td.appendChild(s[1] ? el("span", {class:s[1], text:s[0]}) : document.createTextNode(s[0])); });
      if (!segs.length) td.appendChild(document.createTextNode(" "));
      var tr = el("tr", on ? {class:"hl"} : null, [el("td", {class:"ln", text:String(no)}), td]);
      if (on && !hlFirst) hlFirst = tr;
      tbody.appendChild(tr);
    });
    var box = el("div", {class:"codebox"}, [el("table", {class:"code"}, [tbody])]);
    box._hlFirst = hlFirst;
    return box;
  }

  function copyText(text, btn){
    var done = function(){ var o = btn.textContent; btn.textContent = "복사됨 ✓"; setTimeout(function(){ btn.textContent = o; }, 1200); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
    function fallback(){
      var ta = el("textarea", {style:"position:fixed;opacity:0"}); ta.value = text; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); done(); } catch(e){} document.body.removeChild(ta);
    }
  }

  /* ---------- 패널 ---------- */
  function openPanel(){ document.body.classList.add("open"); }
  function closePanel(){ document.body.classList.remove("open"); }

  function showHint(){
    $("pTitle").textContent = "코드 보는 법";
    $("pSub").textContent = "카드나 파일 이름을 누르면 실제 코드가 여기에 열립니다.";
    var ul = el("ul", {class:"hint"}, [
      el("li", {text:"카드(상자)를 누르면 그 단계에서 실행되는 실제 함수 코드가 열려요."}),
      el("li", {text:"카드 안의 📄 파일 이름을 누르면 그 파일이 어떤 역할인지, 이 단원에서 쓰이는 함수가 무엇인지 보여줘요."}),
      el("li", {text:"ƒ 함수 이름을 누르면 해당 함수 코드로 바로 이동해요."}),
      el("li", {text:"노란색 줄이 지금 단계가 담당하는 부분이에요."}),
      el("li", {text:"db.함수() 처럼 적혀 있어도 실제 코드는 db/users.py 같은 다른 파일에 있어요. 카드에 그 '진짜 파일'을 표시하고, 코드 위에 찾아가는 길도 그려줘요."}),
      el("li", {text:"위쪽 ◀ ▶ 버튼으로 실행 순서대로 한 단계씩 따라갈 수 있어요."})
    ]);
    var b = $("pBody"); b.textContent = ""; b.appendChild(ul);
  }

  function renderAlias(a){
    if (!a) return null;
    return el("div", {class:"alias"}, [
      el("div", {text:"코드에는 이렇게 적혀 있지만, 실제 함수는 다른 파일에 있어요."}),
      el("div", {class:"route"}, [
        el("span", {class:"step", text:a.call}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step", text:a.via + " (창구)"}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step real", text:a.real})
      ])
    ]);
  }

  function selectNode(id, itemIdx){
    var n = nodeById(id); if (!n) return;
    state.node = id; state.item = itemIdx || 0; state.file = null;
    $("pTitle").textContent = n.title;
    $("pSub").textContent = n.plain;
    var body = $("pBody"); body.textContent = "";
    if (n.reject) body.appendChild(el("div", {class:"n-reject", text:n.reject, style:"margin:0 0 10px"}));
    if (n.items.length > 1){
      var tabs = el("div", {class:"itabs", role:"tablist"});
      n.items.forEach(function(it, i){
        tabs.appendChild(el("button", {class:"itab", role:"tab", "aria-selected":String(i === state.item), text:it.label,
          onclick:function(){ selectNode(id, i); }}));
      });
      body.appendChild(tabs);
    }
    var it = n.items[state.item];
    var block = D.blocks[it.block];
    var linesTxt = it.hl ? (it.hl[0] === it.hl[1] ? it.hl[0] + "줄" : it.hl[0] + "–" + it.hl[1] + "줄") : "";
    var fl = el("div", {class:"fileline"}, [
      el("button", {class:"chip file", onclick:function(){ selectFile(block.path); }, text:block.path}),
      el("span", {class:"lines", text: block.start + "–" + block.end + "줄 표시" + (linesTxt ? " · 노란색 " + linesTxt : "")}),
      el("span", {class:"spacer"}),
      el("button", {class:"btn", text:"복사", onclick:function(e){ copyText(block.code, e.currentTarget); }}),
      el("a", {class:"btn link", href:D.files[block.path].github + "#L" + block.start + "-L" + block.end, target:"_blank", rel:"noopener", text:"GitHub ↗"})
    ]);
    body.appendChild(fl);
    var al = renderAlias(block.alias); if (al) body.appendChild(al);
    var box = codeTable(block, it.hl);
    body.appendChild(box);
    if (it.hl) body.appendChild(el("p", {class:"legend-hl"}, [el("b", {text:"노란색"}), " = 이 카드가 담당하는 줄"]));
    refreshSelection();
    openPanel();
    if (box._hlFirst){
      var off = box._hlFirst.offsetTop - 60;
      box.scrollTop = Math.max(0, off);
    }
    updateStepper();
  }

  function selectFile(path){
    state.file = path; state.node = null;
    var f = D.files[path];
    $("pTitle").textContent = "📄 " + path;
    $("pSub").textContent = f.role;
    var body = $("pBody"); body.textContent = "";
    body.appendChild(el("div", {class:"fileline"}, [
      el("a", {class:"btn link", href:f.github, target:"_blank", rel:"noopener", text:"GitHub에서 파일 열기 ↗"})
    ]));
    body.appendChild(el("h3", {text:"이 단원에서 쓰이는 함수", style:"font-size:13.5px;margin:12px 0 0"}));
    var ul = el("ul", {class:"flist"}), seen = {};
    D.scenarios.forEach(function(sc, si){
      sc.nodes.forEach(function(n){
        n.items.forEach(function(it, ii){
          var b = D.blocks[it.block]; if (b.path !== path) return;
          var key = si + n.id + ii; if (seen[key]) return; seen[key] = 1;
          var li = el("li");
          li.appendChild(el("button", {onclick:function(){
            if (state.sc !== si) switchScenario(si);
            selectNode(n.id, ii); scrollToNode(n.id);
          }}, [
            el("span", {class:"mono", text:it.label}), el("small", {text:sc.name + " · " + n.title})
          ]));
          ul.appendChild(li);
        });
      });
    });
    body.appendChild(ul);
    if (f.header){
      var d = el("details", {class:"hdr"}, [el("summary", {text:"파일 맨 위 설명 주석 보기"}), el("pre", {text:f.header})]);
      body.appendChild(d);
    }
    refreshSelection();
    openPanel();
  }

  /* ---------- 흐름도 ---------- */
  var cols, colIndex, nodeEls = {};
  function renderStage(){
    var sc = scen();
    var used = {}; sc.nodes.forEach(function(n){ used[n.col] = 1; });
    cols = Object.keys(used).map(Number).sort(function(a,b){ return a-b; });
    colIndex = {}; cols.forEach(function(c, i){ colIndex[c] = i + 1; });
    var stage = $("stage");
    stage.textContent = "";
    stage.style.gridTemplateColumns = "repeat(" + cols.length + ", 196px)";
    nodeEls = {};

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "edges"); svg.id = "edges";
    svg.innerHTML = '<defs>' +
      '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-call" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '</defs>';
    stage.appendChild(svg);

    cols.forEach(function(c){
      stage.appendChild(el("div", {class:"colhead", style:"grid-column:" + colIndex[c] + ";grid-row:1", text:D.columns[c]}));
    });
    var cells = {};
    sc.nodes.forEach(function(n){
      var k = n.row + ":" + n.col;
      if (!cells[k]){
        cells[k] = el("div", {class:"cell", style:"grid-column:" + colIndex[n.col] + ";grid-row:" + (n.row + 2)});
        stage.appendChild(cells[k]);
      }
      var node = buildNode(n);
      nodeEls[n.id] = node;
      cells[k].appendChild(node);
    });
    $("intro").textContent = sc.intro;
    scheduleEdges();
  }

  function buildNode(n){
    var node = el("div", {class:"node " + n.kind, role:"button", tabindex:"0", "aria-pressed":"false", "data-id":n.id,
      onclick:function(e){ if (e.target.closest(".chip")) return; selectNode(n.id, 0); },
      onkeydown:function(e){ if ((e.key === "Enter" || e.key === " ") && !e.target.closest(".chip")){ e.preventDefault(); selectNode(n.id, 0); } }});
    var title = el("div", {class:"n-title", text:n.title});
    if (n.later) title.appendChild(el("span", {class:"tag-later", text:n.later + "에서 자세히"}));
    node.appendChild(title);
    if (n.kind !== "later" && n.plain) node.appendChild(el("div", {class:"n-plain", text:n.plain}));
    if (n.reject) node.appendChild(el("div", {class:"n-reject", text:n.reject}));
    var items = el("div", {class:"n-items"});
    n.items.forEach(function(it, i){
      var b = D.blocks[it.block];
      var row = el("div", {class:"n-item"});
      if (it.call) row.appendChild(el("div", {class:"n-call", text:brk(it.call)}));
      var chips = el("div", {class:"chips"}, [
        el("button", {class:"chip file", text:brk(b.path), title:"파일 설명 보기", onclick:function(){ selectFile(b.path); }}),
        el("button", {class:"chip " + (it.snippet ? "snip" : "fn"), text:it.label, title:"코드 보기", onclick:function(){ selectNode(n.id, i); }})
      ]);
      row.appendChild(chips);
      items.appendChild(row);
    });
    node.appendChild(items);
    return node;
  }

  function rectIn(elm, host){
    var a = elm.getBoundingClientRect(), h = host.getBoundingClientRect();
    return {l:a.left-h.left, r:a.right-h.left, t:a.top-h.top, b:a.bottom-h.top, cx:(a.left+a.right)/2-h.left, cy:(a.top+a.bottom)/2-h.top};
  }
  var raf = 0;
  function scheduleEdges(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(drawEdges); }
  function drawEdges(){
    var stage = $("stage"), svg = $("edges"), sc = scen();
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){ p.remove(); });
    Array.prototype.slice.call(stage.querySelectorAll(".elabel")).forEach(function(p){ p.remove(); });
    var svgNS = "http://www.w3.org/2000/svg";
    sc.edges.forEach(function(e){
      var a = nodeById(e.from), b = nodeById(e.to);
      var ea = nodeEls[e.from], eb = nodeEls[e.to]; if (!ea || !eb) return;
      var ra = rectIn(ea, stage), rb = rectIn(eb, stage), d, lx, ly;
      if (a.col === b.col){
        if (b.row - a.row <= 1){
          d = "M" + ra.cx + " " + ra.b + " V" + rb.t; lx = ra.cx; ly = (ra.b + rb.t) / 2;
        } else {
          var x = Math.min(ra.l, rb.l) - 30;
          d = "M" + ra.l + " " + ra.cy + " H" + x + " V" + rb.cy + " H" + rb.l; lx = x; ly = (ra.cy + rb.cy) / 2;
        }
      } else {
        var dir = b.col > a.col ? 1 : -1;
        var x1 = dir > 0 ? ra.r : ra.l, x2 = dir > 0 ? rb.l : rb.r;
        var xm = x2 - dir * 30;
        d = "M" + x1 + " " + ra.cy + " H" + xm + " V" + rb.cy + " H" + x2;
        lx = (x1 + x2) / 2; ly = ra.cy;
      }
      var kind = e.kind === "call" ? "call" : "flow";
      var p = document.createElementNS(svgNS, "path");
      p.setAttribute("d", d); p.setAttribute("class", "e " + kind);
      p.setAttribute("marker-end", "url(#" + (kind === "call" ? "ahc" : "ah") + ")");
      p.setAttribute("data-from", e.from); p.setAttribute("data-to", e.to);
      svg.appendChild(p);
      if (e.label && kind === "flow"){
        var lab = el("span", {class:"elabel", text:e.label});
        lab.style.left = lx + "px"; lab.style.top = ly + "px";
        stage.appendChild(lab);
      }
    });
    svg.setAttribute("width", stage.scrollWidth); svg.setAttribute("height", stage.scrollHeight);
    refreshSelection();
  }

  function refreshSelection(){
    Object.keys(nodeEls).forEach(function(id){ nodeEls[id].setAttribute("aria-pressed", String(id === state.node)); });
    var svg = $("edges"); if (!svg) return;
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){
      var on = state.node && (p.getAttribute("data-from") === state.node || p.getAttribute("data-to") === state.node);
      p.classList.toggle("active", !!on);
    });
  }
  function scrollToNode(id){
    var n = nodeEls[id]; if (n && n.scrollIntoView) n.scrollIntoView({block:"center", inline:"center", behavior:"smooth"});
  }

  /* ---------- 단계 이동 / 탭 ---------- */
  function stepIndex(){ return scen().steps.indexOf(state.node); }
  function updateStepper(){
    var steps = scen().steps, i = stepIndex();
    $("stepNo").textContent = i < 0 ? "– / " + steps.length : (i + 1) + " / " + steps.length;
    $("prev").disabled = i <= 0 && state.node !== null ? true : false;
    $("next").disabled = i >= steps.length - 1;
    if (state.node === null){ $("prev").disabled = true; $("next").disabled = false; }
  }
  function go(delta){
    var steps = scen().steps, i = stepIndex();
    var j = i < 0 ? 0 : Math.max(0, Math.min(steps.length - 1, i + delta));
    selectNode(steps[j], 0); scrollToNode(steps[j]);
  }
  function renderTabs(){
    var t = $("tabs"); t.textContent = "";
    D.scenarios.forEach(function(sc, i){
      t.appendChild(el("button", {class:"tab", role:"tab", "aria-selected":String(i === state.sc), text:sc.name, onclick:function(){ switchScenario(i); }}));
    });
  }
  function switchScenario(i){
    state.sc = i; state.node = null; state.file = null;
    renderTabs(); renderStage(); showHint(); updateStepper();
    try { history.replaceState(null, "", "#" + D.scenarios[i].id); } catch(e){}
  }

  /* ---------- 시작 ---------- */
  document.title = D.title + " — 코드 흐름도";
  $("title").textContent = D.title + " · 코드 흐름도";
  $("subtitle").textContent = D.subtitle;
  $("mdlink").setAttribute("href", D.mdFile);
  $("prev").addEventListener("click", function(){ go(-1); });
  $("next").addEventListener("click", function(){ go(1); });
  $("pClose").addEventListener("click", closePanel);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closePanel(); });
  $("theme").addEventListener("click", function(){
    var r = document.documentElement, cur = r.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  });
  window.addEventListener("resize", scheduleEdges);
  if (window.ResizeObserver) new ResizeObserver(scheduleEdges).observe($("stage"));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleEdges);

  var startId = (location.hash || "").replace("#", "");
  var startIdx = 0; D.scenarios.forEach(function(s, i){ if (s.id === startId) startIdx = i; });
  switchScenario(startIdx);
  // 화면 확인/테스트용 지름길: window.__flow.select("s7")
  window.__flow = { select: function(id, i){ selectNode(id, i || 0); }, file: selectFile, state: state };
})();
</script>
</body>
</html>
