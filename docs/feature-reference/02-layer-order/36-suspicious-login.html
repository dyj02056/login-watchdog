<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>36. 의심 로그인 차단 (CR-03) — 코드 흐름도</title>
<style>
  :root{
    --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eaefe9; --ink:#12201c; --ink-muted:#5a6b63;
    --border:#d9e0da; --accent:#0f6f66; --accent-soft:#e2ede9; --danger:#bf3b2b; --danger-soft:#f8e6e2;
    --edge:#7b8a82; --edge-call:#8a97a0;
    --k-screen:#767f78; --k-screen-soft:#eef0ee;
    --k-route:#2f5fd6;  --k-route-soft:#e7edfb;
    --k-helper:#b56b0c; --k-helper-soft:#f7ecd9;
    --k-db:#7a4fce;     --k-db-soft:#efe8fa;
    --k-config:#0f6f66; --k-config-soft:#e2ede9;
    --k-later:#9aa39d;  --k-later-soft:#f4f6f3;
    --code-bg:#fbfcfb; --code-hl:#fff3c4; --code-hl-bar:#e0a800; --code-gutter:#8a978f;
    --c-comment:#6b7d73; --c-str:#a1470f; --c-kw:#7a3fc0; --c-fn:#1f5fd0; --c-num:#0b7a6c; --c-deco:#b0306e;
    --shadow:0 1px 2px rgba(18,32,28,.06), 0 6px 20px rgba(18,32,28,.07);
    --panel-w: 520px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
      --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
      --edge:#6f8178; --edge-call:#5d6f67;
      --k-screen:#9aa39d; --k-screen-soft:#1a221e;
      --k-route:#7fa2f2;  --k-route-soft:#182236;
      --k-helper:#e8a94c; --k-helper-soft:#31260f;
      --k-db:#b49bee;     --k-db-soft:#241c34;
      --k-config:#4fc9b8; --k-config-soft:#17332d;
      --k-later:#6b7a72;  --k-later-soft:#111a16;
      --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
      --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
    --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
    --edge:#6f8178; --edge-call:#5d6f67;
    --k-screen:#9aa39d; --k-screen-soft:#1a221e;
    --k-route:#7fa2f2;  --k-route-soft:#182236;
    --k-helper:#e8a94c; --k-helper-soft:#31260f;
    --k-db:#b49bee;     --k-db-soft:#241c34;
    --k-config:#4fc9b8; --k-config-soft:#17332d;
    --k-later:#6b7a72;  --k-later-soft:#111a16;
    --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
    --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
  button{font:inherit;color:inherit;cursor:pointer}
  code,.mono{font-family:var(--mono)}

  .app{display:flex;height:100vh;min-height:0}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{padding:14px 20px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
  .top h1{margin:0;font-size:19px;letter-spacing:-.01em}
  .top .sub{margin:2px 0 0;color:var(--ink-muted);font-size:13px}
  .top-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
  .tabs{display:flex;gap:6px}
  .tab{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:5px 14px;font-weight:600}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .tab[aria-selected="true"]{color:#06201b}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#06201b}}
  .spacer{flex:1}
  .btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:default}
  .stepper{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-muted)}
  .stepper b{color:var(--ink);min-width:42px;text-align:center}
  a.back{display:inline-block;margin-bottom:6px;border:1px solid var(--border);background:var(--surface);border-radius:8px;
    padding:4px 11px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
  a.back:hover,a.back:focus-visible{border-color:var(--accent);background:var(--accent-soft);outline:none}
  a.link{color:var(--accent);text-decoration:none;font-size:13px}
  a.link:hover{text-decoration:underline}

  .intro{margin:0;padding:10px 20px;color:var(--ink-muted);font-size:13px;border-bottom:1px solid var(--border);background:var(--surface-2)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 20px;font-size:12px;color:var(--ink-muted);border-bottom:1px solid var(--border)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .stage-wrap{flex:1;min-height:0;overflow:auto}
  .stage{position:relative;display:grid;gap:26px 46px;padding:22px 22px 60px;width:max-content;min-width:100%}
  .edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .edges path{fill:none;stroke:var(--edge);stroke-width:1.6}
  .edges path.call{stroke:var(--edge-call);stroke-dasharray:5 4}
  .edges path.active{stroke:var(--accent);stroke-width:2.4;stroke-dasharray:none}
  .edges .head{fill:var(--edge)}
  .edges .head-call{fill:var(--edge-call)}
  .elabel{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;
    background:var(--surface);border:1px solid var(--border);color:var(--ink-muted);white-space:nowrap;pointer-events:none}

  .colhead{font-size:12px;font-weight:700;color:var(--ink-muted);text-transform:none;border-bottom:2px solid var(--border);padding-bottom:6px;align-self:end}
  .cell{display:flex;flex-direction:column;gap:12px;align-self:center;justify-content:center;position:relative;z-index:1}

  .node{--k:var(--k-route);--ks:var(--k-route-soft);position:relative;background:var(--surface);border:1px solid var(--border);
    border-left:5px solid var(--k);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .08s, border-color .12s}
  .node:hover{transform:translateY(-1px);border-color:var(--k)}
  .node:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .node[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
  .node.screen{--k:var(--k-screen);--ks:var(--k-screen-soft)}
  .node.route{--k:var(--k-route);--ks:var(--k-route-soft)}
  .node.helper{--k:var(--k-helper);--ks:var(--k-helper-soft)}
  .node.db{--k:var(--k-db);--ks:var(--k-db-soft)}
  .node.config{--k:var(--k-config);--ks:var(--k-config-soft)}
  .node.later{--k:var(--k-later);--ks:var(--k-later-soft);background:var(--k-later-soft);box-shadow:none;border-style:dashed;border-left-style:solid;padding:8px 10px}
  .n-title{font-weight:700;font-size:13.5px;letter-spacing:-.01em}
  .n-plain{margin-top:3px;color:var(--ink-muted);font-size:12.5px}
  .n-reject{margin-top:6px;font-size:12px;color:var(--danger);background:var(--danger-soft);border-radius:6px;padding:3px 8px}
  .n-reject::before{content:"막히면 → ";font-weight:700}
  .n-items{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .n-item{display:flex;flex-direction:column;gap:3px}
  .n-call{overflow-wrap:anywhere;font-family:var(--mono);font-size:11.5px;color:var(--k);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{max-width:100%;text-align:left;overflow-wrap:anywhere;border:1px solid var(--border);background:var(--ks);color:var(--ink);border-radius:6px;padding:1px 7px;font-family:var(--mono);font-size:11px}
  .chip:hover{border-color:var(--k);color:var(--k)}
  .chip.file::before{content:"📄 "}
  .chip.fn::before{content:"ƒ ";color:var(--k);font-weight:700}
  .chip.snip::before{content:"▤ ";color:var(--k);font-weight:700}
  .tag-later{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--ink-muted);border:1px solid var(--border);border-radius:999px;padding:0 7px;background:var(--surface)}

  /* 코드 패널 */
  .panel{width:var(--panel-w);flex:none;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
  .p-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
  .p-head h2{margin:0;font-size:15.5px;letter-spacing:-.01em}
  .p-head p{margin:4px 0 0;color:var(--ink-muted);font-size:13px}
  .p-close{display:none}
  .p-body{flex:1;min-height:0;overflow:auto;padding:12px 16px 24px}
  .hint{color:var(--ink-muted);font-size:13px}
  .hint li{margin:4px 0}
  .itabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .itab{border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:2px 9px;font-family:var(--mono);font-size:12px}
  .itab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .fileline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
  .fileline .path{font-family:var(--mono);font-size:12.5px;font-weight:700}
  .fileline .lines{font-family:var(--mono);font-size:12px;color:var(--ink-muted)}
  .alias{border:1px solid var(--border);background:var(--k-db-soft);border-radius:8px;padding:8px 10px;margin:0 0 10px;font-size:12.5px}
  .alias .route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px;font-family:var(--mono);font-size:12px}
  .alias .route span.step{padding:1px 7px;border-radius:6px;border:1px solid var(--border);background:var(--surface)}
  .alias .route span.real{border-color:var(--k-db);color:var(--k-db);font-weight:700}
  .alias .arrow{color:var(--ink-muted)}
  .codebox{border:1px solid var(--border);border-radius:8px;background:var(--code-bg);overflow:auto;max-height:calc(100vh - 330px);min-height:240px}
  .codebox.wrap table.code td.tx{white-space:pre-wrap;overflow-wrap:anywhere}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  /* 흐름도 ↔ 코드 패널 사이 드래그 분할선 (겹쳐 놓아 레이아웃은 밀리지 않는다) */
  .splitter{flex:none;position:relative;z-index:6;width:11px;margin:0 -5px;cursor:col-resize;touch-action:none;outline:none}
  .splitter::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:1px;background:var(--border);transition:background .12s,width .12s,left .12s}
  .splitter::after{content:"";position:absolute;left:3px;top:50%;width:5px;height:44px;margin-top:-22px;border-radius:3px;background:var(--border);transition:background .12s}
  .splitter:hover::before,.splitter:focus-visible::before,body.dragging .splitter::before{background:var(--accent);width:3px;left:4px}
  .splitter:hover::after,.splitter:focus-visible::after,body.dragging .splitter::after{background:var(--accent)}
  body.dragging{user-select:none;cursor:col-resize}
  table.code{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.2px;line-height:1.6}
  table.code td{padding:0 10px;vertical-align:top;white-space:pre}
  table.code td.ln{position:sticky;left:0;text-align:right;color:var(--code-gutter);user-select:none;background:var(--code-bg);border-right:1px solid var(--border);min-width:44px;padding-right:8px}
  table.code tr.hl td{background:var(--code-hl)}
  table.code tr.hl td.ln{background:var(--code-hl);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--code-hl-bar)}
  .t-c{color:var(--c-comment);font-style:italic}.t-d{color:var(--c-comment)}.t-s{color:var(--c-str)}.t-k{color:var(--c-kw);font-weight:600}
  .t-f{color:var(--c-fn)}.t-n{color:var(--c-num)}.t-a{color:var(--c-deco)}
  .legend-hl{margin:8px 0 0;font-size:12px;color:var(--ink-muted)}
  .legend-hl b{background:var(--code-hl);color:var(--ink);padding:0 6px;border-radius:4px}
  .flist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
  .flist button{width:100%;text-align:left;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:6px 10px}
  .flist button:hover{border-color:var(--accent)}
  .flist small{display:block;color:var(--ink-muted)}
  details.hdr{margin-top:12px;font-size:13px}
  details.hdr pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px;font-family:var(--sans);font-size:12.5px;color:var(--ink-muted)}

  @media (max-width:900px){
    .splitter{display:none}
    .app{display:block;height:auto}
    .stage-wrap{max-height:none;overflow-x:auto}
    .panel{position:fixed;left:0;right:0;bottom:0;width:auto;height:62vh;border-left:0;border-top:2px solid var(--accent);
      box-shadow:0 -10px 30px rgba(0,0,0,.25);z-index:20;transform:translateY(105%);transition:transform .18s}
    body.open .panel{transform:none}
    .p-close{display:inline-block;position:absolute;right:12px;top:10px}
    .p-head{position:relative;padding-right:70px}
    .top{padding:12px 16px 8px}
    .stage{padding:16px 16px 70vh}
  }
  @media (prefers-reduced-motion: reduce){.node,.panel{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <header class="top">
      <a class="back" href="index.html" title="단원 목차로 돌아가기">← 목차로</a>
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>
      <div class="top-row">
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="stepper"><button class="btn" id="prev">◀ 이전</button><b id="stepNo">–</b><button class="btn" id="next">다음 ▶</button></div>
        <span class="spacer"></span>
        <a class="link" id="mdlink" href="#">📝 설명 문서 보기</a>
        <button class="btn" id="theme" title="라이트/다크 전환">🌓</button>
      </div>
    </header>
    <p class="intro" id="intro"></p>
    <div class="legend" aria-label="범례">
      <span><i style="background:var(--k-screen)"></i>화면 · 도착지</span>
      <span><i style="background:var(--k-route)"></i>routes (입구)</span>
      <span><i style="background:var(--k-helper)"></i>판단 (security · helpers)</span>
      <span><i style="background:var(--k-db)"></i>db (저장소)</span>
      <span><i style="background:var(--k-config)"></i>설정값</span>
      <span><i style="background:var(--k-later);opacity:.6"></i>다른 단원에서 자세히</span>
      <span>━ 다음 단계 &nbsp; ┅ 함수 호출</span>
    </div>
    <div class="stage-wrap" id="stageWrap"><div class="stage" id="stage"></div></div>
  </div>

  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="코드 패널 너비 조절 (드래그, 또는 좌우 화살표 키 · 더블클릭하면 기본 너비)" title="드래그해서 코드 패널 너비 조절 · 더블클릭: 기본 너비"></div>
  <aside class="panel" id="panel" aria-live="polite">
    <div class="p-head">
      <h2 id="pTitle"></h2><p id="pSub"></p>
      <button class="btn p-close" id="pClose">닫기</button>
    </div>
    <div class="p-body" id="pBody"></div>
  </aside>
</div>

 "col": 1, "row": 1, "kind": "helper", "title": "① 사건은 이미 처리됨 → 이번 로그인만 막는다", "plain": "메일·Slack은 사건당 한 번이면 충분해 다시 보내지 않습니다. 단, 오래 조용했던(IDLE) 사건이면 '이미 처리함'으로 보지 않고 새 사건으로 다시 판단합니다.", "reject": "", "later": "", "items": [{"block": "security/correlate.py:check_success_login", "hl": [179, 187], "label": "check_success_login()", "call": null, "snippet": false}]}, {"id": "again_n3", "col": 1, "row": 2, "kind": "helper", "title": "② 이 계정의 세션 끊기만 따로 실행", "plain": "실행 근거를 incident:<id>:CR-03:user:<회원 번호>로 따로 두고, 이 계정에서 invalidate_sessions가 성공한 기록이 있으면 건너뜁니다. 계정마다 한 번씩만 끊습니다. 어떤 오류도 '로그인 차단' 판정을 바꾸지 않게 안에서 삼킵니다.", "reject": "", "later": "", "items": [{"block": "security/correlate.py:_invalidate_sessions_once_per_user", "hl": [389, 404], "label": "_invalidate_sessions_once_per_user()", "call": null, "snippet": false}]}, {"id": "again_n4", "col": 3, "row": 2, "kind": "db", "title": "이 계정의 실행 기록", "plain": "OK 기록이 있으면 이미 끊은 계정입니다.", "reject": "", "later": "", "items": [{"block": "db/playbook_runs.py:list_playbook_runs", "hl": null, "label": "list_playbook_runs()", "call": null, "snippet": false}]}], "edges": [{"from": "again_n1", "to": "again_n2", "label": "", "kind": "flow"}, {"from": "again_n2", "to": "again_n3", "label": "", "kind": "flow"}, {"from": "again_n3", "to": "again_n4", "label": "", "kind": "call"}], "steps": ["again_n1", "again_n2", "again_n3"]}], "blocks": {"routes/auth.py:login_submit": {"path": "routes/auth.py", "start": 196, "end": 322, "lang": "python", "code": "@auth_bp.route(\"/login\", methods=[\"POST\"])\ndef login_submit():\n    \"\"\"로그인 폼 제출을 처리한다. 이 함수 하나가 이 프로젝트의 핵심 흐름을 담당한다.\n\n    처리 순서:\n    1. 혹시 자동으로 풀어줘야 할 만료된 잠금(IP 단위 + 계정 단위)이 있으면 먼저 정리한다.\n    2. 이번 요청을 보낸 IP와 입력된 아이디를 알아낸다.\n    3. 이 IP가 지금 잠긴 상태이거나, 이 계정 자체가 (다른 IP들이 나눠서 공격해서)\n       잠긴 상태라면 아이디/비밀번호를 확인하지도 않고 곧바로 거부한다. 단, 영구 잠금된\n       IP는 이메일 복구로 예외를 받은 \"본인 + 본인 기기\"만 통과시킨다(guide33/34-a).\n    4. 잠긴 상태가 아니라면 실제로 아이디/비밀번호를 확인하고, 그 시도를 기록한다.\n    5. 실패했다면 \"혹시 이 IP가 수상한 수준(5회 초과)이 됐는지\"를 먼저 보고,\n       아니라면 \"혹시 이 계정이 여러 IP에 걸쳐 총합으로 수상한 수준(8회 초과)이\n       됐는지\"도 본다 — 전자는 soar.enforce_lockout(IP 잠금), 후자는\n       soar.enforce_account_lockout(계정 잠금)이 알림까지 같이 보낸다\n       (L7 공격 보강 계획 Tier 1: 분산/저속 브루트포스 대응). 둘 다 아직 기준치 아래지만\n       코앞이면 LLM 조기 경보를 판단한다(guide31).\n    6. 성공했다면 회원 세션을 만들어서 회원 대시보드로 이동시킨다(12단계에서 추가).\n    \"\"\"\n    # 1) 시간이 지나 자동으로 풀려야 할 잠금들을 정리 (IP 단위 + 계정 단위)\n    soar.try_release_expired_lockouts()\n    soar.try_release_expired_account_lockouts()\n\n    ip = get_request_ip()\n    username = request.form.get(\"username\", \"\")\n    password = request.form.get(\"password\", \"\")\n\n    # 허니팟 필드가 채워져 있으면 사람이 아니라 자동화 스크립트라고 보고,\n    # 자격 증명 확인/시도 기록 없이 즉시 거부한다 (L7 공격 보강 계획 Tier 3).\n    if is_bot_submission():\n        soar.notify_bot_detected(ip, request.path)\n        flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n        return render_template(\"login_form.html\", form_action=url_for(\"auth.login_submit\"))\n\n    # 2) 이미 잠긴 IP이거나, 이미 잠긴 계정이라면 검증 자체를 건너뛰고 즉시 거부\n    #    — 단, 영구 잠금된 IP는 \"이메일 복구로 예외를 받은 본인+본인 기기\"만 통과시킨다(guide33).\n    exemption = None\n    if detector.is_locked(ip):\n        if detector.get_ip_lock_state(ip) != detector.LOCK_STATE_PERMANENT:\n            flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n            return _login_form()\n        exemption = _find_ip_exemption(ip, username)\n        if exemption is None:\n            flash(\"이 네트워크는 차단되어 있습니다. 본인이라면 아래 '본인 인증으로 접속 허용'을 이용해주세요.\")\n            return _login_form(recovery_link=True)\n        # 예외가 있으면 IP 잠금 안내 없이 아래 계정 잠금 확인과 정상적인 비밀번호 확인으로 계속 진행한다.\n\n    if detector.is_account_locked(username):\n        flash(ACCOUNT_LOCKED_MESSAGE)\n        return _login_form(recovery_link=True)\n\n    success = db.verify_user_credentials(username, password)\n    db.log_attempt(ip, username, success)\n\n    if success:\n        # Track D CR-03 — 웹 공격·스캐너 기록이 있는 IP라면 비밀번호가 맞아도 세션을 만들기 전에\n        # 멈춘다(세션 무효화·주인 경고 메일은 플레이북이 한다). 화면에는 실패와 같은 문구만 보여\n        # 공격자가 \"비밀번호는 맞았는데 탐지에 걸렸다\"는 사실을 알아채지 못하게 한다.\n        from security import correlate\n        if correlate.check_success_login(ip, username):\n            flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n            return _login_form()\n        # 관리자 세션(\"admin_username\")과는 완전히 다른 키(\"username\")를 쓴다 —\n        # 그래야 같은 브라우저에서 관리자 세션이 있더라도 서로 섞이지 않는다.\n        # user_id도 같이 저장해두는 이유는 member_login_required 문지기 뒤에서\n        # \"아이디\"가 아니라 변하지 않는 \"번호\"로 본인 행을 정확히 찾기 위해서다.\n        user = db.get_user_by_username(username)\n        session[\"username\"] = username\n        session[\"user_id\"] = user[\"id\"]\n        # 세션 세대 번호 — 나중에 비밀번호가 바뀌면 이 세션을 끊는 데 쓴다(guide35).\n        session[\"session_version\"] = user.get(\"session_version\") or 0\n        return redirect(url_for(\"member.member_dashboard\"))\n\n    # 영구 잠금 예외로 통과한 사용자가 연달아 실패하면 그 예외를 회수한다 — 예외는 \"본인이\n    # 비밀번호를 아는 상황\"을 전제로 한 출입증이라, 계속 틀리는 건 도용 신호로 본다.\n    # (예외 통과자의 실패는 IP 임계값 판정으로 넘기지 않는다 — 이 IP는 이미 영구 잠금 중이라\n    # enforce_lockout()이 5분 잠금 알림을 또 보내는 일이 없도록 하기 위해서다.)\n    if exemption is not None:\n        if db.count_recent_failures(ip) >= config.IP_EXEMPTION_MAX_FAILURES:\n            db.revoke_ip_exemption(exemption[\"id\"], \"예외 통과 후 연속 로그인 실패\")\n        flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n        return _login_form()\n\n    # 실패했다면, 먼저 이 IP가 방금 임계값을 넘었는지 확인한다.\n    suspicious, failure_count = detector.is_suspicious(ip)\n    if suspicious:\n        # 최근 실패에 쓰인 아이디가 몇 개였는지도 함께 세서, Slack 알림이 Brute\n        # Force(계정 1개 집중)와 Password Spraying(계정 여러 개 순회)을 구분해\n        # 표시할 수 있게 한다 (attack_response_state.md 구현 대상 #5).\n        distinct_usernames = detector.count_distinct_usernames(ip)\n        soar.enforce_lockout(ip, failure_count, distinct_usernames)\n        flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n    else:\n        # 아직 기준치(FAILURE_THRESHOLD)는 안 넘었지만 코앞이면, LLM에게 조기\n        # 경보 여부를 물어본다 (Track A, guide31). 공격자가 임계값을 살짝\n        # 피해 가려고 실패 횟수를 일부러 코앞에서 멈추는 패턴을 이 구간에서 잡는다.\n        if failure_count >= config.FAILURE_THRESHOLD - config.EARLY_WARNING_BAND:\n            distinct_usernames = detector.count_distinct_usernames(ip)\n            soar.consider_early_warning(\n                \"BRUTE_FORCE\", \"LOCK_IP\", \"ip\", ip, failure_count, config.FAILURE_THRESHOLD,\n                context_count=distinct_usernames,\n            )\n\n        # IP 단위로는 아직 수상하지 않더라도, 이 계정이 여러 IP에 걸쳐 나뉘어서\n        # 총합 기준으로 수상한 수준이 됐는지 확인한다 — 공격자가 IP를 돌려가며\n        # (봇넷/프록시 로테이션) 한 계정만 노리는 분산 브루트포스를 잡아낸다.\n        account_suspicious, account_failure_count = detector.is_account_suspicious(username)\n        if account_suspicious:\n            distinct_ips = detector.count_distinct_ips_by_username(username)\n            soar.enforce_account_lockout(username, account_failure_count, distinct_ips, ip)\n            flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n        else:\n            # 이 계정도 마찬가지로 임계값(ACCOUNT_FAILURE_THRESHOLD) 코앞이면\n            # 조기 경보 대상이다 — 여러 IP에 나눠 시도하되 각 IP·계정 총합\n            # 모두를 임계값 아래로 유지하려는 패턴을 잡아낸다.\n            if account_failure_count >= config.ACCOUNT_FAILURE_THRESHOLD - config.EARLY_WARNING_BAND:\n                distinct_ips = detector.count_distinct_ips_by_username(username)\n                soar.consider_early_warning(\n                    \"DISTRIBUTED_BRUTE_FORCE\", \"LOCK_ACCOUNT\", \"account\", username,\n                    account_failure_count, config.ACCOUNT_FAILURE_THRESHOLD,\n                    context_count=distinct_ips, context_ip=ip,\n                )\n            # 사용자 존재 여부(아이디가 없는지, 비밀번호만 틀렸는지)를 구분해서\n            # 알려주면 공격자에게 힌트를 주게 되므로, 항상 똑같은 문구로만 실패를 알린다.\n            flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n\n    return render_template(\"login_form.html\", form_action=url_for(\"auth.login_submit\"))", "alias": null}, "security/correlate.py:check_success_login": {"path": "security/correlate.py", "start": 166, "end": 216, "lang": "python", "code": "def check_success_login(ip: str, username: str) -> bool:\n    \"\"\"연결이 확인된 NET 경보 뒤의 로그인 성공을 막고 CR-03을 사건당 한 번 실행한다.\n\n    조회나 기록이 실패하면 검사 오류 때문에 정상 로그인을 막지 않는다.\n    \"\"\"\n    try:\n        evidence = db.list_recent_connected_net_events_for_login(\n            ip, config.NET_SUCCESS_LOGIN_LOOKBACK_MINUTES\n        )\n        if not evidence:\n            return False\n\n        existing = db.get_open_incident(ip)\n        if (\n            existing\n            and not db.incidents._is_idle(existing)\n            and \"CR-03\" in (existing.get(\"matched_rules\") or [])\n        ):\n            # 이번 로그인은 막는다. 다만 같은 IP에서 다른 계정이 들어왔다면 그 계정의 기존 세션도 끊어야\n            # 하므로, 사건이 이미 처리됐어도 계정마다 세션 끊기는 따로 확인한다(강사 피드백 추가 상황).\n            _invalidate_sessions_once_per_user(ip, existing, username)\n            return True\n\n        user = db.get_user_by_username(username)\n        event = evidence[0]\n        incident = db.record_incident(\n            ip, [event[\"event_type\"]], event.get(\"severity\") or \"MEDIUM\",\n            source=\"NET\", rule_id=\"CR-03\",\n        )\n        if incident.get(\"rule_added\", True):\n            ctx = {\n                \"ip\": ip,\n                \"incident_id\": incident[\"id\"],\n                \"rule_id\": \"CR-03\",\n                \"priority\": \"HIGH\",\n                \"matched_rules\": incident.get(\"matched_rules\") or [],\n                \"evidence\": \"CONNECTED\",\n                \"username\": username,\n                \"user_id\": user[\"id\"],\n                \"user_email\": user.get(\"email\"),\n            }\n            playbooks.run(\n                \"SUSPICIOUS_SUCCESS_LOGIN\", f\"incident:{incident['id']}:CR-03\", ctx\n            )\n        else:\n            # 같은 순간 다른 요청이 CR-03을 먼저 기록했다 — 그쪽은 그 계정만 처리하므로 이 계정은 따로 확인한다.\n            _invalidate_sessions_once_per_user(ip, incident, username)\n        return True\n    except Exception as error:\n        print(f\"[의심 로그인 검사 오류] {type(error).__name__}\")\n        return False", "alias": null}, "db/network_events.py:list_recent_connected_net_events_for_login": {"path": "db/network_events.py", "start": 55, "end": 71, "lang": "python", "code": "def list_recent_connected_net_events_for_login(ip: str, window_minutes: int) -> list[dict]:\n    \"\"\"의심 로그인 판단에 쓸 연결 완성 NET 증거만 UTC 창 안에서 읽는다.\n\n    SYN·포트 스캔은 출발지를 위조할 수 있으므로 DB 조회 단계부터 제외한다.\n    창의 위쪽 끝(앱의 현재 시각)은 걸지 않는다 — detected_at은 DB 시계(now())로 찍히는데\n    앱 컨테이너 시계가 DB보다 조금만 늦어도 방금 들어온 스캐너 경보가 \"미래 기록\"으로 빠져\n    CR-03이 맞지 않기 때문이다(list_recent_security_events_for_correlation과 같은 방식).\n    \"\"\"\n    cutoff = (datetime.now(timezone.utc) - timedelta(minutes=window_minutes)).isoformat()\n    return (\n        db.get_client().table(\"security_events\")\n        .select(\"event_type,severity,detected_at\")\n        .eq(\"ip_address\", ip).eq(\"source\", \"NET\")\n        .in_(\"event_type\", [\"NET_WEB_ATTACK\", \"NET_SCANNER_UA\"])\n        .gte(\"detected_at\", cutoff)\n        .order(\"detected_at\", desc=True).limit(1).execute().data\n    )", "alias": null}, "db/incidents.py:record_incident": {"path": "db/incidents.py", "start": 201, "end": 281, "lang": "python", "code": "def record_incident(\n    ip: str,\n    event_types: list[str],\n    severity: str,\n    source: str = \"APP\",\n    rule_id: str | None = None,\n) -> dict:\n    \"\"\"이 IP에 열린 사건이 있으면 event_types/최고 위험등급을 병합해서 갱신하고,\n    없으면 새로 연다. 병합/생성된 사건의 최종 상태(id/event_types/severity_max/\n    escalated)를 돌려준다 — security/correlate.py가 이 값을 보고 SOAR 플레이북(사건\n    에스컬레이션 알림, Track C guide28)을 실행할지 판단한다.\n\n    전체 등급과 별개로 APP 출처만 앱 등급을 올린다. rule_id가 있으면 REST에서\n    배열 원소만 추가할 수 없으므로 기존 matched_rules를 읽어 중복 없이 합쳐 쓴다.\n    이때 돌려주는 dict의 rule_added는 \"이번 호출이 그 규칙을 처음 기록했는지\"다 —\n    동시에 들어온 다른 요청이 먼저 기록했으면 False라서 호출한 쪽이 플레이북을 건너뛴다.\n    새 행의 앱 등급은 우선 NULL로 두어 출처 확인 전 NET 등급으로 잠금이 걸리지 않게 한다.\n\n    \"열려있는지 확인\" 후 \"새로 연다\" 사이의 아주 짧은 틈에 동시 요청 두 개가\n    겹치면(드문 경쟁 조건), docs/schema.sql의 idx_security_incidents_open_ip\n    부분 유니크 인덱스가 두 번째 삽입을 막아준다 — db.insert_security_event_or_bump()와\n    같은 방식으로, 그 충돌(Postgres 오류 코드 23505)을 여기서 붙잡아 새로 여는\n    대신 이미 삽입된 사건에 병합하는 것으로 대체한다.\n    \"\"\"\n    existing = get_open_incident(ip)\n    if existing and _is_idle(existing):\n        # 마지막 이벤트로부터 config.INCIDENT_MERGE_IDLE_MINUTES 넘게 조용했던 옛\n        # 사건 — 새 이벤트를 억지로 합치지 않고 IDLE(활동 없음, 아직 관리자\n        # 미해결)로 옮긴 뒤 새 사건을 연다. idx_security_incidents_open_ip는\n        # status='OPEN'에만 걸려 있으므로 옛 사건이 IDLE로 빠져야 새 OPEN 사건을\n        # 만들 수 있다. 새 사건은 escalated=False로 시작하므로, 이미 escalated\n        # 된 옛 사건이 새 공격의 에스컬레이션 알림을 삼키는 일이 없어진다.\n        mark_incident_idle(existing[\"id\"])\n        existing = None\n    if existing:\n        if rule_id is None:\n            incident = _merge_into_existing(existing, event_types, severity)\n        else:\n            incident = _merge_into_existing(existing, event_types, severity, rule_id)\n    else:\n        try:\n            if rule_id is None:\n                incident_id = _insert_incident(ip, event_types, severity)\n            else:\n                incident_id = _insert_incident(ip, event_types, severity, rule_id)\n            incident = {\n                \"id\": incident_id, \"event_types\": event_types, \"severity_max\": severity,\n                \"app_severity_max\": None,\n                \"matched_rules\": [rule_id] if rule_id else [],\n                \"escalated\": False,\n            }\n            if rule_id:\n                incident[\"rule_added\"] = True\n        except APIError as e:\n            if e.code != \"23505\":\n                raise\n            existing = get_open_incident(ip)\n            if rule_id is None:\n                incident = _merge_into_existing(existing, event_types, severity)\n            else:\n                incident = _merge_into_existing(existing, event_types, severity, rule_id)\n\n    if source == \"APP\":\n        # 조회 뒤 다른 요청이 더 높은 앱 등급을 저장해도 현재 값보다 낮게 덮어쓰지 않는다.\n        lower = [value for value, rank in _SEVERITY_RANK.items() if rank < _SEVERITY_RANK[severity]]\n        condition = \"app_severity_max.is.null\"\n        if lower:\n            condition += f\",app_severity_max.in.({','.join(lower)})\"\n        updated = (\n            db.get_client().table(\"security_incidents\").update({\"app_severity_max\": severity})\n            .eq(\"id\", incident[\"id\"]).or_(condition).execute().data\n        )\n        # 경합으로 이미 더 높은 값이 저장된 경우도 최신 앱 등급과 규칙 목록을 돌려준다.\n        current = updated or (\n            db.get_client().table(\"security_incidents\").select(\"app_severity_max, matched_rules\")\n            .eq(\"id\", incident[\"id\"]).limit(1).execute().data\n        )\n        if current:\n            incident[\"app_severity_max\"] = current[0].get(\"app_severity_max\")\n            incident[\"matched_rules\"] = current[0].get(\"matched_rules\") or []\n    return incident", "alias": null}, "security/playbooks.py:run": {"path": "security/playbooks.py", "start": 127, "end": 170, "lang": "python", "code": "def run(playbook: str, trigger_ref: str, ctx: dict, only_steps: list[str] | None = None) -> list[dict]:\n    \"\"\"단계별 결과를 반환하고 기록 실패도 격리하여 이미 수행한 차단을 보존한다.\n\n    조치 함수를 호출 시점에 찾아 monkeypatch를 지원하고, 실행 함수가 없는 단계(선택 과제 llm_postmortem)는 SKIPPED로 남긴다.\n    예외 메시지에 비밀값이 섞일 수 있으므로 기록에는 예외 종류만 남긴다.\n    only_steps를 주면 그 단계만 원래 순서대로 실행한다 — 실패한 단계만 이어서 처리할 때 쓴다(강사 피드백 3).\n    \"\"\"\n    results = []\n    for step in PLAYBOOKS.get(playbook, []):\n        if only_steps is not None and step not in only_steps:\n            continue\n        status, error = \"OK\", None\n        try:\n            args, kwargs = _ARGUMENTS[step](playbook, ctx, results)\n            module_name, function_name = ACTIONS[step].rsplit(\".\", 1)\n            try:\n                module = importlib.import_module(module_name)\n            except ModuleNotFoundError as exc:\n                if exc.name != module_name and not module_name.startswith(f\"{exc.name}.\"):\n                    raise\n                module = None\n            function = getattr(module, function_name, None)\n            if not callable(function):\n                status, error = \"SKIPPED\", \"조치 함수 없음\"\n            else:\n                value = function(*args, **kwargs)\n                # 멱등 차단의 False는 미실행이며 세션 무효화 False는 실패다.\n                if value is False:\n                    status = \"FAILED\" if step == \"invalidate_sessions\" else \"SKIPPED\"\n                elif step == \"notify_owner_email\" and value in (\"FAILED\", \"REFUSED\", \"SKIPPED\"):\n                    status = \"FAILED\" if value == \"FAILED\" else \"SKIPPED\"\n                if status != \"OK\":\n                    error = \"조치 미완료\" if status == \"FAILED\" else \"조치 미실행\"\n        except _MissingContext as exc:\n            status, error = \"SKIPPED\", f\"필수 값 없음: {exc}\"\n        except Exception as exc:\n            status, error = \"FAILED\", type(exc).__name__\n        result = {\"step\": step, \"status\": status, \"error\": error}\n        results.append(result)\n        try:\n            db.insert_playbook_run(playbook, trigger_ref, step, status, error)\n        except Exception as exc:\n            print(f\"[playbook record failed] {type(exc).__name__}\")\n    return results", "alias": null}, "db/users.py:bump_session_version": {"path": "db/users.py", "start": 226, "end": 258, "lang": "python", "code": "def bump_session_version(user_id: int) -> bool:\n    \"\"\"세션 세대 번호만 1 올려 이 회원의 모든 기존 세션을 끊는다(비밀번호는 그대로).\n\n    Track D CR-03(의심 로그인 성공)의 조치 함수다(계약서 K8). 역할 C가 C2-1에서\n    update_user_password()와 같은 조건부 UPDATE 방식으로 구현했다.\n\n    기존 db/*.py 중 Track D 뼈대 PR이 새 함수 자리를 만든 유일한 곳이다 — 세션 번호를\n    다루는 코드가 이 파일에 모여 있어서, 다른 모듈에 두면 같은 규칙이 두 군데로 갈라진다.\n\n    번호는 update_user_password()처럼 \"읽은 값 그대로일 때만\" 올린다(조건부 UPDATE) — 회원이\n    마침 비밀번호를 바꾸는 순간과 겹쳐도 번호가 한 번 덜 올라가 의심 세션이 살아남는 일이\n    없게, 경쟁에서 지면 다시 읽어서 최대 3번까지 시도한다.\n\n    update_user_password()와 달리 3번 다 지면 예외 대신 False를 돌려준다 — 플레이북의 한\n    단계라서, 예외로 멈추면 뒤의 메일·Slack 단계까지 사라진다. False면 호출부가 FAILED로 기록한다.\n\n    반환값: 실제로 번호를 올렸으면 True, 회원이 없거나(삭제됨) 경쟁에서 3번 다 졌으면 False.\n    \"\"\"\n    for _ in range(3):\n        current = get_user_session_version(user_id)\n        if current is None:\n            return False\n        res = (\n            db.get_client()\n            .table(\"users\")\n            .update({\"session_version\": current + 1})\n            .eq(\"id\", user_id)\n            .eq(\"session_version\", current)\n            .execute()\n        )\n        if res.data:\n            return True\n    return False", "alias": null}, "notify/mailer.py:send_suspicious_login_notice": {"path": "notify/mailer.py", "start": 216, "end": 249, "lang": "python", "code": "def send_suspicious_login_notice(to_address: str, ip: str, at_iso: str) -> str:\n    \"\"\"의심스러운 로그인이 차단됐다는 사실을 계정 이메일로 알린다(Track D CR-03, 계약서 K8).\n    반환: SENT / REFUSED / FAILED / SKIPPED.\n\n    같은 공격이 짧은 시간에 여러 번 탐지되면 플레이북도 여러 번 돌아 같은 경고가 메일함을\n    채운다. 그래서 같은 주소로는 SUSPICIOUS_LOGIN_MAIL_COOLDOWN_SECONDS에 한 번만 보내고,\n    그 안이면 보내지 않고 SKIPPED를 돌려준다. 쿨다운을 프로세스 메모리(_last_alert_at 방식)가\n    아니라 DB(db.try_acquire_cooldown)에 두는 이유는 여러 스레드·여러 PC·Vercel이 같은 주소를\n    함께 다루기 때문이다. 주소는 소문자로 맞춰 대소문자만 다른 주소가 쿨다운을 피하지 않게 한다.\n\n    발송이 FAILED(SMTP 장애 등 일시적 실패)면 잡았던 쿨다운을 db.release_cooldown으로 푼다 —\n    아무 메일도 가지 않았는데 쿨다운 시간 내내 SKIPPED가 되면, 장애가 풀린 뒤 같은 공격이 다시\n    탐지돼도 피해자가 경고를 받지 못하기 때문이다. REFUSED(수신자 없음, 영구 거부)는 다시 보내도\n    결과가 같으므로 쿨다운을 그대로 둔다. 쿨다운 해제가 실패해도 발송 결과(FAILED)는 그대로 돌려준다.\n    \"\"\"\n    cooldown_key = f\"mail:suspicious:{to_address.lower()}\"\n    if not db.try_acquire_cooldown(cooldown_key, config.SUSPICIOUS_LOGIN_MAIL_COOLDOWN_SECONDS):\n        return SKIPPED\n    body = (\n        \"로그인 워치독 계정에서 의심스러운 로그인이 감지되어 차단되었습니다.\\n\\n\"\n        f\"차단된 로그인 IP: {ip}\\n\"\n        f\"시각: {at_iso}\\n\\n\"\n        \"본인이 로그인한 것이 아니라면 즉시 로그인해 '내 프로필' 화면에서 비밀번호를 바꿔주세요\"\n        f\"{_profile_link_line()}\"\n    )\n    # 제목 앞머리는 다른 메일과 같은 \"[로그인 워치독]\"으로 맞춘다 — 회원이 같은 곳에서 온 메일로 알아보게.\n    result = _send_mail(to_address, \"[로그인 워치독] 의심스러운 로그인이 차단되었습니다\", body)\n    if result == FAILED:\n        try:\n            db.release_cooldown(cooldown_key)\n        except Exception as exc:\n            # 예외 메시지에 DB 주소 등이 섞일 수 있어 종류만 남긴다.\n            _safe_print(f\"[mailer] 경고: 의심 로그인 메일 쿨다운 해제 실패 ({type(exc).__name__})\")\n    return result", "alias": null}, "notify/alert.py:send_playbook_alert": {"path": "notify/alert.py", "start": 400, "end": 432, "lang": "python", "code": "def send_playbook_alert(\n    playbook: str, ip: str, matched_rules: list[str], results: list[dict], priority: str = \"HIGH\"\n) -> None:\n    \"\"\"Track D 플레이북 실행 결과를 Slack에 알린다(계약서 K8, C2-1). results 항목은\n    {\"step\", \"status\"(\"OK\"/\"FAILED\"/\"SKIPPED\"), \"error\"}다.\n\n    priority는 플레이북 ctx의 \"priority\"(\"CRITICAL\"/\"HIGH\")를 그대로 받는다 — KILL_CHAIN 같은\n    CRITICAL 사건이 [HIGH]로 보여 덜 급해 보이지 않게 하기 위해서다. 기본값이 있는 선택 인자라\n    priority를 넘기지 않는 기존 호출은 지금처럼 [HIGH]로 보낸다. 모르는 값도 [HIGH]로 보낸다.\n\n    실패한 단계가 하나라도 있으면 첫 줄을 \"⚠ 일부 조치 실패\"로 시작한다(V6) — 다른 알림처럼\n    \"조치 완료\"만 보고 넘어가면, 예를 들어 L4 차단이 실패해 공격이 계속 들어오는데도 관리자는\n    막힌 줄로 믿게 된다. 그래서 실패 여부를 메시지 맨 앞에서 바로 보이게 한다.\n    SKIPPED는 실패가 아니다(쿨다운 안이라 메일을 안 보냈거나, 아직 실행 함수가 없는 선택 단계).\n    \"\"\"\n    has_failure = any(r.get(\"status\") == \"FAILED\" for r in results)\n    lines = []\n    if has_failure:\n        lines.append(\"⚠ 일부 조치 실패\")\n    header = _PLAYBOOK_PRIORITY_HEADERS.get(priority, _PLAYBOOK_PRIORITY_HEADERS[\"HIGH\"])\n    lines.append(f\"{header} 로그인 워치독 플레이북 실행 알림: {playbook}\")\n    lines.append(f\"대상 IP: {ip}\")\n    lines.append(f\"일치한 규칙: {', '.join(matched_rules) if matched_rules else '-'}\")\n    lines.append(\"단계별 결과:\")\n    for r in results:\n        status = r.get(\"status\")\n        mark = _PLAYBOOK_STEP_MARKS.get(status, \"?\")\n        line = f\"{mark} {r.get('step')} ({status})\"\n        # 실패 원인은 실패한 단계에만 붙인다 — 관리자가 무엇을 고쳐야 할지 바로 알 수 있게 한다.\n        if status == \"FAILED\" and r.get(\"error\"):\n            line += f\": {r['error']}\"\n        lines.append(line)\n    _send_slack_message(\"\\n\".join(lines))", "alias": null}, "security/correlate.py:_invalidate_sessions_once_per_user": {"path": "security/correlate.py", "start": 375, "end": 406, "lang": "python", "code": "def _invalidate_sessions_once_per_user(ip: str, incident: dict, username: str) -> None:\n    \"\"\"CR-03 사건이 이미 처리된 IP에서 들어온 계정의 기존 세션을, 계정마다 한 번 끊는다.\n\n    사건 단위로 \"이미 처리함\"을 판단하면 같은 IP의 두 번째 계정은 이번 로그인만 막히고, 이미 발급된\n    세션은 그대로 남는다(10/26 강사 피드백 추가 상황). 그래서 계정별 실행 근거\n    incident:<id>:CR-03:user:<user_id> 로 세션 끊기 단계만 따로 기록·확인한다. 메일·Slack은 사건당\n    한 번이면 충분하므로 여기서는 보내지 않는다. 첫 계정도 다음 로그인 때 이 확인을 한 번 거치므로\n    session_version이 한 번 더 오를 수 있지만, 이미 끊긴 세션이라 결과는 같다.\n    어떤 오류도 로그인 차단 판정(True)을 바꾸지 않게 여기서 삼킨다.\n    \"\"\"\n    try:\n        user = db.get_user_by_username(username)\n        if not user:\n            return\n        trigger_ref = f\"incident:{incident['id']}:CR-03:user:{user['id']}\"\n        rows = db.list_playbook_runs(trigger_ref)\n        if any(row[\"step\"] == \"invalidate_sessions\" and row[\"status\"] == \"OK\" for row in rows):\n            return\n        ctx = {\n            \"ip\": ip,\n            \"incident_id\": incident[\"id\"],\n            \"rule_id\": \"CR-03\",\n            \"priority\": \"HIGH\",\n            \"matched_rules\": incident.get(\"matched_rules\") or [],\n            \"evidence\": \"CONNECTED\",\n            \"username\": username,\n            \"user_id\": user[\"id\"],\n            \"user_email\": user.get(\"email\"),\n        }\n        playbooks.run(\"SUSPICIOUS_SUCCESS_LOGIN\", trigger_ref, ctx, only_steps=[\"invalidate_sessions\"])\n    except Exception as error:\n        print(f\"[계정별 세션 끊기 오류] {type(error).__name__}\")", "alias": null}, "db/playbook_runs.py:list_playbook_runs": {"path": "db/playbook_runs.py", "start": 29, "end": 42, "lang": "python", "code": "def list_playbook_runs(trigger_ref: str) -> list[dict]:\n    \"\"\"같은 실행 근거(trigger_ref)의 단계 기록을 오래된 순으로 돌려준다.\n\n    \"규칙에 해당함(matched_rules)\"과 \"조치 완료\"를 구분하려고 쓴다 — 규칙은 기록됐는데 일시적인 오류로\n    실패한 단계가 있으면, 다음 경보 때 그 단계만 이어서 처리한다(10/26 강사 피드백 3).\n    \"\"\"\n    res = (\n        db.get_client().table(\"playbook_runs\")\n        .select(\"step, status, ran_at\")\n        .eq(\"trigger_ref\", trigger_ref)\n        .order(\"ran_at\")\n        .execute()\n    )\n    return res.data or []", "alias": null}}, "files": {"routes/auth.py": {"role": "회원가입·로그인 라우트. 비밀번호 확인 직후 CR-03 검사를 끼워 넣어 세션을 만들기 전에 멈춘다.", "header": "routes/auth.py — 회원가입(/signup) + 감시 대상 로그인(/login)\n원래 app.py의 \"회원가입 입력 검증 규칙\" / \"회원가입\" / \"감시 대상 로그인\"\n세 섹션을 그대로 옮겨왔다. 배경은 docs/refactor/2026-09-15-file-split.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/auth.py"}, "security/correlate.py": {"role": "상관분석 파일. check_success_login이 CR-03을 판정하고 대응 절차서를 부른다.", "header": "security/correlate.py — \"형사\" 역할: 흩어진 개별 신고(security_events)들을 보고\n\"이거 같은 출처가 벌인 하나의 사건 아니야?\"를 판단한다 (Track C guide27, SIEM 상관분석)\nsecurity/soar/가 security_events에 새 이벤트를 기록할 때마다 이 모듈의\ncheck_and_correlate()를 호출한다. security/detector.py와 동일한 원칙으로, 이 파일도\n\"판단\"만 하고(사건으로 묶어야 하는가?) 실제 저장/병합은 db 패키지(db/incidents.py)에\n맡긴다 — security/soar/가 db에게 조치를 맡기는 것과 같은 구조다.\nPLAYBOOKS(Track C guide28, SOAR 플레이북)도 이 파일에 둔다. security/soar/가 이미\nsecurity/correlate.py를 import하고 있어서, 플레이북 실행을 security/soar/ 쪽에 두고\nsecurity/correlate.py가 그걸 호출하게 하면 반대 방향 import가 생겨 순환 참조가 된다.\nsecurity/correlate.py는 사건이 얼마나 심각해졌는지 이미 알고 있는 유일한 곳이므로,\n여기서 곧바로 notify/alert.py를 불러 실행하는 것이 security/soar/가 notify/alert.py를 직접\n부르는 것과 같은 자연스러운 구조다.\nTrack D 교차 규칙은 다음 위험을 따로 다룬다.\nNET-01: 출발지 위조가 가능한 SYN Flood는 영구 잠금 대신 TTL 차단만 요청한다.\nCR-01: 네트워크 정찰 뒤 앱 침투가 이어질 때 연결이 확인된 킬체인으로 본다.\nCR-02: SYN Flood와 전역 HTTP 폭주가 겹칠 때만 다계층 폭주로 묶는다.\nCR-03: 웹 공격·스캐너 기록(연결 완성 증거)이 있는 IP의 로그인 성공은 세션 전에 막는다 —\n비밀번호를 이미 손에 넣은 공격자일 수 있고, SYN·포트 스캔은 위조 가능해 근거로 쓰지 않는다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/correlate.py"}, "db/network_events.py": {"role": "network_events(원본 경보) 표 조회·기록 모음.", "header": "db/network_events.py — network_events 표: 센서 경보 원본 기록 (계약서 K4·K10·K11)\n중복 event_id는 삽입 유니크 제약으로 처리하고 누적 수는 조건부 갱신으로 보호한다.\n새 DB 함수는 이 파일에 만들고, 이름을 아래 __all__ 목록에 추가한다. 그러면\ndb/__init__.py가 \"from .network_events import *\"로 자동으로 다시 내보내므로, 다른 파일에서\n바로 db.함수이름(...)으로 쓸 수 있다 — 세 사람이 공용 파일(db/__init__.py)을 고치지\n않아도 되게 하려는 장치다(team-plan 01 3.2).\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고(import db 후 db.get_client()).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/network_events.py"}, "db/incidents.py": {"role": "db/incidents.py — security_incidents 표 관련 함수 (Track C guide27, SIEM 상관분석) security_events가 개별 신고서 한 장 한 장이라면, 이 표는 \"같은 IP가 짧은 시간 안에 서로 다른 event_type을 2개 이상 남겼을 ", "header": "db/incidents.py — security_incidents 표 관련 함수 (Track C guide27, SIEM 상관분석)\nsecurity_events가 개별 신고서 한 장 한 장이라면, 이 표는 \"같은 IP가 짧은 시간\n안에 서로 다른 event_type을 2개 이상 남겼을 때\" 그 신고들을 하나로 묶어두는\n사건철이다. security/correlate.py가 판단(묶어야 하는가?)만 하고, 실제 조회/삽입/병합은\n전부 이 파일이 맡는다(security/detector.py·security/soar/와 동일한 판단·실행 분리 원칙).\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/incidents.py"}, "security/playbooks.py": {"role": "Track D 대응 절차서 실행기(37단원).", "header": "security/playbooks.py — Track D 대응 절차서(플레이북): 규칙이 맞으면 조치를 순서대로 실행한다\n담당: 역할 B (B2-2). 단계와 기록의 실패를 격리해 다음 조치를 보장한다.\n플레이북·단계 이름은 docs/track-d/contracts.md 계약서 K12, 넘겨받는 ctx 모양은 K8이 기준이다.\n판단(B)과 실행(C)을 나눈다: 이 파일은 \"어떤 조치를 어떤 순서로\"만 정하고, 실제 차단·메일·알림은\n역할 C의 조치 함수가 스스로 검증하며 실행한다.\n기존 복합 공격 알림(security/correlate.py의 PLAYBOOKS[\"CRITICAL_MULTI_STAGE\"])은 옮기지 않는다 —\n이 파일은 Track D 플레이북만 담당한다(계약서 K12).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/playbooks.py"}, "db/users.py": {"role": "회원 표 조회·수정 모음. session_version을 올려 모든 기기의 로그인을 끊는다.", "header": "db/users.py — users 표 관련 함수 (회원가입 기능)\n— 감시 대상이 되는 가짜 로그인 화면(/login)에 실제로 가입해서 로그인하는\n\"일반 사용자\" 계정을 관리하는 기능. 관리자(admin_users)와는 완전히 별개 개념.\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/users.py"}, "notify/mailer.py": {"role": "회원에게 가는 메일을 보내는 파일. 의심 로그인 경고 메일은 같은 주소로 1시간에 한 번만 보낸다.", "header": "notify/mailer.py — \"우체부\" 역할: 사용자에게 가는 메일을 실제로 보낸다\n(영구 잠금 복구 guide34-a, 비밀번호 변경 알림 guide35, 이메일 인증·변경 guide40,\n비밀번호 재설정 guide41)\nnotify/alert.py(Slack)와 같은 구조다 — 메시지를 조립하는 함수(send_recovery_email 등)와\n실제로 내보내는 함수 하나(_send_mail)로 나뉜다. \"언제 보낼지\"는 이 파일이 아니라\nroutes/recovery.py, routes/member.py, services/email_verification.py가 결정한다.\n전송 결과는 예외가 아니라 세 가지 문자열 중 하나로 돌려준다:\nSENT    — 메일 서버가 받아줬다\nREFUSED — 메일 서버가 \"그런 수신자는 없다\"고 영구적으로 거부했다(5xx).\n존재하지 않는 이메일 주소일 가능성이 높다 → 호출부가 계정의\nemail_status를 UNDELIVERABLE로 올린다\nFAILED  — 설정이 없거나 네트워크/일시 장애라 못 보냈다(이메일 문제라고 단정할 수 없음)\n(Gmail처럼 일단 받고 나중에 반송하는 비동기 반송은 SMTP 응답만으로는 알 수 없다.)\nFAILED일 때는 원인을 네 가지로 나눠 기록하고(설정/인증/연결/기타) 관리자에게 Slack으로\n알린다. 사용자 화면은 계정 존재 여부가 드러나지 않게 항상 같은 안내를 보여주기 때문에,\n알림이 없으면 메일 설정이 틀려도 아무도 모른 채 \"메일을 보냈습니다\"만 계속 뜨게 된다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/notify/mailer.py"}, "notify/alert.py": {"role": "Slack 알림 모음. 플레이북 결과를 한 번에 알린다.", "header": "notify/alert.py — \"전화 교환원\" 역할: Slack에 실제로 메시지를 전송한다\n이 파일이 하는 일은 딱 하나, \"메시지를 조립해서 Slack 웹훅 주소로 던지는 것\"뿐이다.\n\"언제 알림을 보낼지\"를 결정하는 판단은 이 파일의 몫이 아니고 security/soar/(대부분),\nsecurity/correlate.py·lockdown.py, notify/mailer.py(메일 발송 실패)가 결정해서\n이 파일의 함수를 호출해줄 때만 동작한다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/notify/alert.py"}, "db/playbook_runs.py": {"role": "db/playbook_runs.py — playbook_runs 표: 플레이북 단계별 실행 결과 (계약서 K11) 담당: 역할 B (B2-2). 단계별 기록으로 부분 실패를 확인할 수 있게 한다. 새 DB 함수는 이 파일에 만들고, 이름을 아래 __all__ 목록에 추가한다. 그러면 d", "header": "db/playbook_runs.py — playbook_runs 표: 플레이북 단계별 실행 결과 (계약서 K11)\n담당: 역할 B (B2-2). 단계별 기록으로 부분 실패를 확인할 수 있게 한다.\n새 DB 함수는 이 파일에 만들고, 이름을 아래 __all__ 목록에 추가한다. 그러면\ndb/__init__.py가 \"from .playbook_runs import *\"로 자동으로 다시 내보내므로, 다른 파일에서\n바로 db.함수이름(...)으로 쓸 수 있다 — 세 사람이 공용 파일(db/__init__.py)을 고치지\n않아도 되게 하려는 장치다(team-plan 01 3.2).\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고(import db 후 db.get_client()).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/playbook_runs.py"}}}</script>
<script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var $ = function(id){ return document.getElementById(id); };
  var KIND_LABEL = {screen:"화면 · 도착지", route:"routes", helper:"판단", db:"db", config:"설정값", later:"다른 단원"};

  var state = { sc: 0, node: null, item: 0, file: null };

  /* ---------- 사용자 설정(브라우저에 기억 · 막혀 있어도 동작) ---------- */
  function loadPref(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }
  function savePref(k, v){ try { if (v === null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, v); } catch(e){} }
  var prefs = { wrap: loadPref("lw-code-wrap") !== "0" };   // 기본: 줄바꿈 켜짐

  function el(tag, attrs, kids){
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function brk(t){ return t.replace(/([\/._])/g, "$1\u200b"); }
  function scen(){ return D.scenarios[state.sc]; }
  function nodeById(id){ return scen().nodes.filter(function(n){ return n.id === id; })[0]; }
  function fnName(label){ return label; }

  /* ---------- 간단 문법 강조 ---------- */
  var PY = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?''')|([rbfRBF]{0,2}"(?:\\.|[^"\\\n])*"|[rbfRBF]{0,2}'(?:\\.|[^'\\\n])*')|\b(def|class|return|if|elif|else|for|while|import|from|as|try|except|finally|with|in|not|and|or|is|None|True|False|raise|pass|lambda|yield|global|nonlocal|assert|del|continue|break)\b|(@[A-Za-z_][\w.]*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(?=\()/g;
  var PYC = [null,"t-c","t-d","t-s","t-k","t-a","t-n","t-f"];
  var HT = /(<!--[\s\S]*?-->)|(\{[{%#][\s\S]*?[}%#]\})|(<\/?[A-Za-z][\w-]*)|("[^"\n]*")|(\/?>)/g;
  var HTC = [null,"t-c","t-a","t-k","t-s","t-k"];
  var JS = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\.|[^`\\])*`)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(const|let|var|function|return|if|else|for|while|import|from|export|default|async|await|try|catch|finally|new|class|extends|typeof|interface|type|null|undefined|true|false|throw|switch|case|break|continue|of|in|as)\b|(@[A-Za-z_]\w*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_$][\w$]*)(?=\()/g;
  var JSC = [null,"t-c","t-s","t-s","t-k","t-a","t-n","t-f"];
  var SQ = /(--[^\n]*|\/\*[\s\S]*?\*\/)|((?!))|('(?:''|[^'])*')|\b(select|from|where|insert|into|values|update|set|delete|create|table|index|alter|add|drop|on|conflict|do|nothing|and|or|not|null|default|primary|key|references|cascade|if|exists|as|order|by|group|limit|desc|asc|join|left|inner|count|returns|function|language|begin|end|return|with|union|all|distinct|in|is|true|false|unique|check|constraint|timestamptz|text|integer|bigint|boolean|interval|now|replace|trigger|view|policy|enable|row|level|security|using)\b|((?!))|\b(\d+(?:\.\d+)?)\b|\b([a-z_]\w*)(?=\()/gi;
  var SQC = [null,"t-c",null,"t-s","t-k",null,"t-n","t-f"];
  var SH = /(#[^\n]*)|((?!))|("(?:\\.|[^"\\\n])*"|'[^'\n]*')|\b(if|then|else|fi|for|do|done|while|case|esac|function|echo|export|python|pip|git|cd|run|name|on|jobs|steps|uses|with|env)\b|((?!))|\b(\d+)\b/g;
  var SHC = [null,"t-c",null,"t-s","t-k",null,"t-n"];
  function tokenize(code, lang){
    var re = PY, cls = PYC;
    if (lang === "html"){ re = HT; cls = HTC; }
    else if (lang === "js"){ re = JS; cls = JSC; }
    else if (lang === "sql"){ re = SQ; cls = SQC; }
    else if (lang === "sh"){ re = SH; cls = SHC; }
    var lines = [[]];
    function push(text, c){
      var parts = text.split("\n");
      parts.forEach(function(p, i){
        if (i > 0) lines.push([]);
        if (p) lines[lines.length-1].push([p, c]);
      });
    }
    var last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(code)) !== null){
      if (m.index > last) push(code.slice(last, m.index), null);
      var idx = 1; while (idx < m.length && m[idx] === undefined) idx++;
      push(m[0], cls[idx] || null);
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++;
    }
    if (last < code.length) push(code.slice(last), null);
    return lines;
  }

  function codeTable(block, hl){
    var lines = tokenize(block.code, block.lang);
    var tbody = el("tbody");
    var hlFirst = null;
    lines.forEach(function(segs, i){
      var no = block.start + i;
      var on = hl && no >= hl[0] && no <= hl[1];
      var td = el("td", {class:"tx"});
      segs.forEach(function(s){ td.appendChild(s[1] ? el("span", {class:s[1], text:s[0]}) : document.createTextNode(s[0])); });
      if (!segs.length) td.appendChild(document.createTextNode(" "));
      var tr = el("tr", on ? {class:"hl"} : null, [el("td", {class:"ln", text:String(no)}), td]);
      if (on && !hlFirst) hlFirst = tr;
      tbody.appendChild(tr);
    });
    var box = el("div", {class:"codebox"}, [el("table", {class:"code"}, [tbody])]);
    box._hlFirst = hlFirst;
    return box;
  }

  function copyText(text, btn){
    var done = function(){ var o = btn.textContent; btn.textContent = "복사됨 ✓"; setTimeout(function(){ btn.textContent = o; }, 1200); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
    function fallback(){
      var ta = el("textarea", {style:"position:fixed;opacity:0"}); ta.value = text; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); done(); } catch(e){} document.body.removeChild(ta);
    }
  }

  /* ---------- 패널 ---------- */
  function openPanel(){ document.body.classList.add("open"); }
  function closePanel(){ document.body.classList.remove("open"); }

  function showHint(){
    $("pTitle").textContent = "코드 보는 법";
    $("pSub").textContent = "카드나 파일 이름을 누르면 실제 코드가 여기에 열립니다.";
    var ul = el("ul", {class:"hint"}, [
      el("li", {text:"카드(상자)를 누르면 그 단계에서 실행되는 실제 함수 코드가 열려요."}),
      el("li", {text:"카드 안의 📄 파일 이름을 누르면 그 파일이 어떤 역할인지, 이 단원에서 쓰이는 함수가 무엇인지 보여줘요."}),
      el("li", {text:"ƒ 함수 이름을 누르면 해당 함수 코드로 바로 이동해요."}),
      el("li", {text:"노란색 줄이 지금 단계가 담당하는 부분이에요."}),
      el("li", {text:"db.함수() 처럼 적혀 있어도 실제 코드는 db/users.py 같은 다른 파일에 있어요. 카드에 그 '진짜 파일'을 표시하고, 코드 위에 찾아가는 길도 그려줘요."}),
      el("li", {text:"위쪽 ◀ ▶ 버튼으로 실행 순서대로 한 단계씩 따라갈 수 있어요."})
    ]);
    var b = $("pBody"); b.textContent = ""; b.appendChild(ul);
  }

  function renderAlias(a){
    if (!a) return null;
    return el("div", {class:"alias"}, [
      el("div", {text:"코드에는 이렇게 적혀 있지만, 실제 함수는 다른 파일에 있어요."}),
      el("div", {class:"route"}, [
        el("span", {class:"step", text:a.call}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step", text:a.via + " (창구)"}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step real", text:a.real})
      ])
    ]);
  }

  function selectNode(id, itemIdx){
    var n = nodeById(id); if (!n) return;
    state.node = id; state.item = itemIdx || 0; state.file = null;
    $("pTitle").textContent = n.title;
    $("pSub").textContent = n.plain;
    var body = $("pBody"); body.textContent = "";
    if (n.reject) body.appendChild(el("div", {class:"n-reject", text:n.reject, style:"margin:0 0 10px"}));
    if (n.items.length > 1){
      var tabs = el("div", {class:"itabs", role:"tablist"});
      n.items.forEach(function(it, i){
        tabs.appendChild(el("button", {class:"itab", role:"tab", "aria-selected":String(i === state.item), text:it.label,
          onclick:function(){ selectNode(id, i); }}));
      });
      body.appendChild(tabs);
    }
    var it = n.items[state.item];
    var block = D.blocks[it.block];
    var linesTxt = it.hl ? (it.hl[0] === it.hl[1] ? it.hl[0] + "줄" : it.hl[0] + "–" + it.hl[1] + "줄") : "";
    var fl = el("div", {class:"fileline"}, [
      el("button", {class:"chip file", onclick:function(){ selectFile(block.path); }, text:block.path}),
      el("span", {class:"lines", text: block.start + "–" + block.end + "줄 표시" + (linesTxt ? " · 노란색 " + linesTxt : "")}),
      el("span", {class:"spacer"}),
      el("button", {class:"btn", id:"wrapBtn", "aria-pressed":String(prefs.wrap), title:"긴 줄을 화면 너비에 맞춰 줄바꿈", text:"줄바꿈", onclick:function(e){
        prefs.wrap = !prefs.wrap; savePref("lw-code-wrap", prefs.wrap ? "1" : "0");
        e.currentTarget.setAttribute("aria-pressed", String(prefs.wrap));
        var bx = document.querySelector("#pBody .codebox"); if (bx) bx.classList.toggle("wrap", prefs.wrap);
      }}),
      el("button", {class:"btn", text:"복사", onclick:function(e){ copyText(block.code, e.currentTarget); }}),
      el("a", {class:"btn link", href:D.files[block.path].github + "#L" + block.start + "-L" + block.end, target:"_blank", rel:"noopener", text:"GitHub ↗"})
    ]);
    body.appendChild(fl);
    var al = renderAlias(block.alias); if (al) body.appendChild(al);
    var box = codeTable(block, it.hl);
    if (prefs.wrap) box.classList.add("wrap");
    body.appendChild(box);
    if (it.hl) body.appendChild(el("p", {class:"legend-hl"}, [el("b", {text:"노란색"}), " = 이 카드가 담당하는 줄"]));
    refreshSelection();
    openPanel();
    if (box._hlFirst){
      var off = box._hlFirst.offsetTop - 60;
      box.scrollTop = Math.max(0, off);
    }
    updateStepper();
  }

  function selectFile(path){
    state.file = path; state.node = null;
    var f = D.files[path];
    $("pTitle").textContent = "📄 " + path;
    $("pSub").textContent = f.role;
    var body = $("pBody"); body.textContent = "";
    body.appendChild(el("div", {class:"fileline"}, [
      el("a", {class:"btn link", href:f.github, target:"_blank", rel:"noopener", text:"GitHub에서 파일 열기 ↗"})
    ]));
    body.appendChild(el("h3", {text:"이 단원에서 쓰이는 함수", style:"font-size:13.5px;margin:12px 0 0"}));
    var ul = el("ul", {class:"flist"}), seen = {};
    D.scenarios.forEach(function(sc, si){
      sc.nodes.forEach(function(n){
        n.items.forEach(function(it, ii){
          var b = D.blocks[it.block]; if (b.path !== path) return;
          var key = si + n.id + ii; if (seen[key]) return; seen[key] = 1;
          var li = el("li");
          li.appendChild(el("button", {onclick:function(){
            if (state.sc !== si) switchScenario(si);
            selectNode(n.id, ii); scrollToNode(n.id);
          }}, [
            el("span", {class:"mono", text:it.label}), el("small", {text:sc.name + " · " + n.title})
          ]));
          ul.appendChild(li);
        });
      });
    });
    body.appendChild(ul);
    if (f.header){
      var d = el("details", {class:"hdr"}, [el("summary", {text:"파일 맨 위 설명 주석 보기"}), el("pre", {text:f.header})]);
      body.appendChild(d);
    }
    refreshSelection();
    openPanel();
  }

  /* ---------- 흐름도 ---------- */
  var cols, colIndex, nodeEls = {};
  function renderStage(){
    var sc = scen();
    var used = {}; sc.nodes.forEach(function(n){ used[n.col] = 1; });
    cols = Object.keys(used).map(Number).sort(function(a,b){ return a-b; });
    colIndex = {}; cols.forEach(function(c, i){ colIndex[c] = i + 1; });
    var stage = $("stage");
    stage.textContent = "";
    stage.style.gridTemplateColumns = "repeat(" + cols.length + ", 196px)";
    nodeEls = {};

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "edges"); svg.id = "edges";
    svg.innerHTML = '<defs>' +
      '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-call" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '</defs>';
    stage.appendChild(svg);

    cols.forEach(function(c){
      stage.appendChild(el("div", {class:"colhead", style:"grid-column:" + colIndex[c] + ";grid-row:1", text:D.columns[c]}));
    });
    var cells = {};
    sc.nodes.forEach(function(n){
      var k = n.row + ":" + n.col;
      if (!cells[k]){
        cells[k] = el("div", {class:"cell", style:"grid-column:" + colIndex[n.col] + ";grid-row:" + (n.row + 2)});
        stage.appendChild(cells[k]);
      }
      var node = buildNode(n);
      nodeEls[n.id] = node;
      cells[k].appendChild(node);
    });
    $("intro").textContent = sc.intro;
    scheduleEdges();
  }

  function buildNode(n){
    var node = el("div", {class:"node " + n.kind, role:"button", tabindex:"0", "aria-pressed":"false", "data-id":n.id,
      onclick:function(e){ if (e.target.closest(".chip")) return; selectNode(n.id, 0); },
      onkeydown:function(e){ if ((e.key === "Enter" || e.key === " ") && !e.target.closest(".chip")){ e.preventDefault(); selectNode(n.id, 0); } }});
    var title = el("div", {class:"n-title", text:n.title});
    if (n.later) title.appendChild(el("span", {class:"tag-later", text:n.later + "에서 자세히"}));
    node.appendChild(title);
    if (n.kind !== "later" && n.plain) node.appendChild(el("div", {class:"n-plain", text:n.plain}));
    if (n.reject) node.appendChild(el("div", {class:"n-reject", text:n.reject}));
    var items = el("div", {class:"n-items"});
    // 같은 파일에 있는 함수는 파일 칩 하나 아래에 함수 칩을 나란히 놓는다
    var groups = [];
    n.items.forEach(function(it, i){
      var b = D.blocks[it.block], g = groups[groups.length - 1];
      if (g && g.path === b.path) g.list.push({it: it, i: i}); else groups.push({path: b.path, list: [{it: it, i: i}]});
    });
    groups.forEach(function(g){
      var row = el("div", {class:"n-item"});
      if (g.list.length === 1 && g.list[0].it.call) row.appendChild(el("div", {class:"n-call", text:brk(g.list[0].it.call)}));
      var chips = el("div", {class:"chips"}, [
        el("button", {class:"chip file", text:brk(g.path), title:"파일 설명 보기", onclick:function(){ selectFile(g.path); }})
      ]);
      g.list.forEach(function(x){
        chips.appendChild(el("button", {class:"chip " + (x.it.snippet ? "snip" : "fn"), text:x.it.label, title:(x.it.call ? x.it.call + " — " : "") + "코드 보기",
          onclick:function(){ selectNode(n.id, x.i); }}));
      });
      row.appendChild(chips);
      items.appendChild(row);
    });
    node.appendChild(items);
    return node;
  }

  function rectIn(elm, host){
    var a = elm.getBoundingClientRect(), h = host.getBoundingClientRect();
    return {l:a.left-h.left, r:a.right-h.left, t:a.top-h.top, b:a.bottom-h.top, cx:(a.left+a.right)/2-h.left, cy:(a.top+a.bottom)/2-h.top};
  }
  var raf = 0;
  function scheduleEdges(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(drawEdges); }
  function drawEdges(){
    var stage = $("stage"), svg = $("edges"), sc = scen();
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){ p.remove(); });
    Array.prototype.slice.call(stage.querySelectorAll(".elabel")).forEach(function(p){ p.remove(); });
    var svgNS = "http://www.w3.org/2000/svg";
    sc.edges.forEach(function(e){
      var a = nodeById(e.from), b = nodeById(e.to);
      var ea = nodeEls[e.from], eb = nodeEls[e.to]; if (!ea || !eb) return;
      var ra = rectIn(ea, stage), rb = rectIn(eb, stage), d, lx, ly;
      if (a.col === b.col){
        if (b.row - a.row <= 1){
          d = "M" + ra.cx + " " + ra.b + " V" + rb.t; lx = ra.cx; ly = (ra.b + rb.t) / 2;
        } else {
          var x = Math.min(ra.l, rb.l) - 30;
          d = "M" + ra.l + " " + ra.cy + " H" + x + " V" + rb.cy + " H" + rb.l; lx = x; ly = (ra.cy + rb.cy) / 2;
        }
      } else {
        var dir = b.col > a.col ? 1 : -1;
        var x1 = dir > 0 ? ra.r : ra.l, x2 = dir > 0 ? rb.l : rb.r;
        var xm = x2 - dir * 30;
        d = "M" + x1 + " " + ra.cy + " H" + xm + " V" + rb.cy + " H" + x2;
        lx = (x1 + x2) / 2; ly = ra.cy;
      }
      var kind = e.kind === "call" ? "call" : "flow";
      var p = document.createElementNS(svgNS, "path");
      p.setAttribute("d", d); p.setAttribute("class", "e " + kind);
      p.setAttribute("marker-end", "url(#" + (kind === "call" ? "ahc" : "ah") + ")");
      p.setAttribute("data-from", e.from); p.setAttribute("data-to", e.to);
      svg.appendChild(p);
      if (e.label && kind === "flow"){
        var lab = el("span", {class:"elabel", text:e.label});
        lab.style.left = lx + "px"; lab.style.top = ly + "px";
        stage.appendChild(lab);
      }
    });
    svg.setAttribute("width", stage.scrollWidth); svg.setAttribute("height", stage.scrollHeight);
    refreshSelection();
  }

  function refreshSelection(){
    Object.keys(nodeEls).forEach(function(id){ nodeEls[id].setAttribute("aria-pressed", String(id === state.node)); });
    var svg = $("edges"); if (!svg) return;
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){
      var on = state.node && (p.getAttribute("data-from") === state.node || p.getAttribute("data-to") === state.node);
      p.classList.toggle("active", !!on);
    });
  }
  function scrollToNode(id){
    var n = nodeEls[id]; if (n && n.scrollIntoView) n.scrollIntoView({block:"center", inline:"center", behavior:"smooth"});
  }

  /* ---------- 단계 이동 / 탭 ---------- */
  function stepIndex(){ return scen().steps.indexOf(state.node); }
  function updateStepper(){
    var steps = scen().steps, i = stepIndex();
    $("stepNo").textContent = i < 0 ? "– / " + steps.length : (i + 1) + " / " + steps.length;
    $("prev").disabled = i <= 0 && state.node !== null ? true : false;
    $("next").disabled = i >= steps.length - 1;
    if (state.node === null){ $("prev").disabled = true; $("next").disabled = false; }
  }
  function go(delta){
    var steps = scen().steps, i = stepIndex();
    var j = i < 0 ? 0 : Math.max(0, Math.min(steps.length - 1, i + delta));
    selectNode(steps[j], 0); scrollToNode(steps[j]);
  }
  function renderTabs(){
    var t = $("tabs"); t.textContent = "";
    D.scenarios.forEach(function(sc, i){
      t.appendChild(el("button", {class:"tab", role:"tab", "aria-selected":String(i === state.sc), text:sc.name, onclick:function(){ switchScenario(i); }}));
    });
  }
  function switchScenario(i){
    state.sc = i; state.node = null; state.file = null;
    renderTabs(); renderStage(); showHint(); updateStepper();
    try { history.replaceState(null, "", "#" + D.scenarios[i].id); } catch(e){}
  }

  /* ---------- 시작 ---------- */
  document.title = D.title + " — 코드 흐름도";
  $("title").textContent = D.title + " · 코드 흐름도";
  $("subtitle").textContent = D.subtitle;
  $("mdlink").setAttribute("href", D.mdFile);
  $("prev").addEventListener("click", function(){ go(-1); });
  $("next").addEventListener("click", function(){ go(1); });
  $("pClose").addEventListener("click", closePanel);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closePanel(); });
  $("theme").addEventListener("click", function(){
    var r = document.documentElement, cur = r.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  });
  window.addEventListener("resize", scheduleEdges);
  if (window.ResizeObserver){ var ro = new ResizeObserver(scheduleEdges); ro.observe($("stage")); ro.observe($("stageWrap")); }

  /* ---------- 코드 패널 너비: 자동 기본값 + 드래그/키보드 조절 + 기억 ---------- */
  var MIN_PANEL = 360, MIN_MAIN = 420, SPLIT_KEY = "lw-panel-w";
  var splitter = $("splitter");
  function maxPanel(){ return Math.max(MIN_PANEL, Math.min(window.innerWidth * 0.75, window.innerWidth - MIN_MAIN - 6)); }
  function clampPanel(w){ return Math.round(Math.min(maxPanel(), Math.max(MIN_PANEL, w))); }
  // 흐름도가 실제로 차지하는 너비(가장 넓은 탭 기준)를 빼고 남는 공간을 패널에 준다
  function autoPanelWidth(){
    var most = 1;
    D.scenarios.forEach(function(sc){ var u = {}; sc.nodes.forEach(function(n){ u[n.col] = 1; }); most = Math.max(most, Object.keys(u).length); });
    var natural = most * 196 + (most - 1) * 46 + 44 + 24;
    return clampPanel(Math.max(440, window.innerWidth - natural - 6));
  }
  var savedW = parseInt(loadPref(SPLIT_KEY), 10);
  var userSet = savedW > 0;
  function setPanelW(w, persist){
    w = clampPanel(w);
    document.documentElement.style.setProperty("--panel-w", w + "px");
    splitter.setAttribute("aria-valuenow", String(w)); splitter.setAttribute("aria-valuemin", String(MIN_PANEL)); splitter.setAttribute("aria-valuemax", String(Math.round(maxPanel())));
    if (persist){ userSet = true; savePref(SPLIT_KEY, String(w)); }
    scheduleEdges();
  }
  function currentW(){ return $("panel").getBoundingClientRect().width; }
  setPanelW(userSet ? savedW : autoPanelWidth(), false);
  window.addEventListener("resize", function(){ setPanelW(userSet ? currentW() : autoPanelWidth(), false); });
  splitter.addEventListener("pointerdown", function(e){
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault(); splitter.setPointerCapture(e.pointerId); document.body.classList.add("dragging");
    function move(ev){ setPanelW(window.innerWidth - ev.clientX, false); }
    function up(ev){
      splitter.removeEventListener("pointermove", move); splitter.removeEventListener("pointerup", up); splitter.removeEventListener("pointercancel", up);
      try { splitter.releasePointerCapture(ev.pointerId); } catch(x){}
      document.body.classList.remove("dragging"); setPanelW(currentW(), true);
    }
    splitter.addEventListener("pointermove", move); splitter.addEventListener("pointerup", up); splitter.addEventListener("pointercancel", up);
  });
  splitter.addEventListener("keydown", function(e){
    var step = (e.shiftKey ? 72 : 24);
    if (e.key === "ArrowLeft"){ e.preventDefault(); setPanelW(currentW() + step, true); }
    else if (e.key === "ArrowRight"){ e.preventDefault(); setPanelW(currentW() - step, true); }
    else if (e.key === "Home"){ e.preventDefault(); setPanelW(MIN_PANEL, true); }
    else if (e.key === "End"){ e.preventDefault(); setPanelW(maxPanel(), true); }
  });
  splitter.addEventListener("dblclick", function(){ userSet = false; savePref(SPLIT_KEY, null); setPanelW(autoPanelWidth(), false); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleEdges);

  var startId = (location.hash || "").replace("#", "");
  var startIdx = 0; D.scenarios.forEach(function(s, i){ if (s.id === startId) startIdx = i; });
  switchScenario(startIdx);
  // 화면 확인/테스트용 지름길: window.__flow.select("s7")
  window.__flow = { select: function(id, i){ selectNode(id, i || 0); }, file: selectFile, state: state };
})();
</script>
</body>
</html>
