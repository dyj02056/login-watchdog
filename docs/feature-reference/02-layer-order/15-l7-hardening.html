<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>15. L7 공격 방어 보강 — 코드 흐름도</title>
<style>
  :root{
    --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eaefe9; --ink:#12201c; --ink-muted:#5a6b63;
    --border:#d9e0da; --accent:#0f6f66; --accent-soft:#e2ede9; --danger:#bf3b2b; --danger-soft:#f8e6e2;
    --edge:#7b8a82; --edge-call:#8a97a0;
    --k-screen:#767f78; --k-screen-soft:#eef0ee;
    --k-route:#2f5fd6;  --k-route-soft:#e7edfb;
    --k-helper:#b56b0c; --k-helper-soft:#f7ecd9;
    --k-db:#7a4fce;     --k-db-soft:#efe8fa;
    --k-config:#0f6f66; --k-config-soft:#e2ede9;
    --k-later:#9aa39d;  --k-later-soft:#f4f6f3;
    --code-bg:#fbfcfb; --code-hl:#fff3c4; --code-hl-bar:#e0a800; --code-gutter:#8a978f;
    --c-comment:#6b7d73; --c-str:#a1470f; --c-kw:#7a3fc0; --c-fn:#1f5fd0; --c-num:#0b7a6c; --c-deco:#b0306e;
    --shadow:0 1px 2px rgba(18,32,28,.06), 0 6px 20px rgba(18,32,28,.07);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
      --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
      --edge:#6f8178; --edge-call:#5d6f67;
      --k-screen:#9aa39d; --k-screen-soft:#1a221e;
      --k-route:#7fa2f2;  --k-route-soft:#182236;
      --k-helper:#e8a94c; --k-helper-soft:#31260f;
      --k-db:#b49bee;     --k-db-soft:#241c34;
      --k-config:#4fc9b8; --k-config-soft:#17332d;
      --k-later:#6b7a72;  --k-later-soft:#111a16;
      --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
      --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
    --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
    --edge:#6f8178; --edge-call:#5d6f67;
    --k-screen:#9aa39d; --k-screen-soft:#1a221e;
    --k-route:#7fa2f2;  --k-route-soft:#182236;
    --k-helper:#e8a94c; --k-helper-soft:#31260f;
    --k-db:#b49bee;     --k-db-soft:#241c34;
    --k-config:#4fc9b8; --k-config-soft:#17332d;
    --k-later:#6b7a72;  --k-later-soft:#111a16;
    --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
    --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
  button{font:inherit;color:inherit;cursor:pointer}
  code,.mono{font-family:var(--mono)}

  .app{display:flex;height:100vh;min-height:0}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{padding:14px 20px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
  .top h1{margin:0;font-size:19px;letter-spacing:-.01em}
  .top .sub{margin:2px 0 0;color:var(--ink-muted);font-size:13px}
  .top-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
  .tabs{display:flex;gap:6px}
  .tab{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:5px 14px;font-weight:600}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .tab[aria-selected="true"]{color:#06201b}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#06201b}}
  .spacer{flex:1}
  .btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:default}
  .stepper{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-muted)}
  .stepper b{color:var(--ink);min-width:42px;text-align:center}
  a.link{color:var(--accent);text-decoration:none;font-size:13px}
  a.link:hover{text-decoration:underline}

  .intro{margin:0;padding:10px 20px;color:var(--ink-muted);font-size:13px;border-bottom:1px solid var(--border);background:var(--surface-2)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 20px;font-size:12px;color:var(--ink-muted);border-bottom:1px solid var(--border)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .stage-wrap{flex:1;min-height:0;overflow:auto}
  .stage{position:relative;display:grid;gap:26px 46px;padding:22px 22px 60px;width:max-content;min-width:100%}
  .edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .edges path{fill:none;stroke:var(--edge);stroke-width:1.6}
  .edges path.call{stroke:var(--edge-call);stroke-dasharray:5 4}
  .edges path.active{stroke:var(--accent);stroke-width:2.4;stroke-dasharray:none}
  .edges .head{fill:var(--edge)}
  .edges .head-call{fill:var(--edge-call)}
  .elabel{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;
    background:var(--surface);border:1px solid var(--border);color:var(--ink-muted);white-space:nowrap;pointer-events:none}

  .colhead{font-size:12px;font-weight:700;color:var(--ink-muted);text-transform:none;border-bottom:2px solid var(--border);padding-bottom:6px;align-self:end}
  .cell{display:flex;flex-direction:column;gap:12px;align-self:center;justify-content:center;position:relative;z-index:1}

  .node{--k:var(--k-route);--ks:var(--k-route-soft);position:relative;background:var(--surface);border:1px solid var(--border);
    border-left:5px solid var(--k);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .08s, border-color .12s}
  .node:hover{transform:translateY(-1px);border-color:var(--k)}
  .node:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .node[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
  .node.screen{--k:var(--k-screen);--ks:var(--k-screen-soft)}
  .node.route{--k:var(--k-route);--ks:var(--k-route-soft)}
  .node.helper{--k:var(--k-helper);--ks:var(--k-helper-soft)}
  .node.db{--k:var(--k-db);--ks:var(--k-db-soft)}
  .node.config{--k:var(--k-config);--ks:var(--k-config-soft)}
  .node.later{--k:var(--k-later);--ks:var(--k-later-soft);background:var(--k-later-soft);box-shadow:none;border-style:dashed;border-left-style:solid;padding:8px 10px}
  .n-title{font-weight:700;font-size:13.5px;letter-spacing:-.01em}
  .n-plain{margin-top:3px;color:var(--ink-muted);font-size:12.5px}
  .n-reject{margin-top:6px;font-size:12px;color:var(--danger);background:var(--danger-soft);border-radius:6px;padding:3px 8px}
  .n-reject::before{content:"막히면 → ";font-weight:700}
  .n-items{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .n-item{display:flex;flex-direction:column;gap:3px}
  .n-call{overflow-wrap:anywhere;font-family:var(--mono);font-size:11.5px;color:var(--k);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{max-width:100%;text-align:left;overflow-wrap:anywhere;border:1px solid var(--border);background:var(--ks);color:var(--ink);border-radius:6px;padding:1px 7px;font-family:var(--mono);font-size:11px}
  .chip:hover{border-color:var(--k);color:var(--k)}
  .chip.file::before{content:"📄 "}
  .chip.fn::before{content:"ƒ ";color:var(--k);font-weight:700}
  .chip.snip::before{content:"▤ ";color:var(--k);font-weight:700}
  .tag-later{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--ink-muted);border:1px solid var(--border);border-radius:999px;padding:0 7px;background:var(--surface)}

  /* 코드 패널 */
  .panel{width:440px;flex:none;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
  .p-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
  .p-head h2{margin:0;font-size:15.5px;letter-spacing:-.01em}
  .p-head p{margin:4px 0 0;color:var(--ink-muted);font-size:13px}
  .p-close{display:none}
  .p-body{flex:1;min-height:0;overflow:auto;padding:12px 16px 24px}
  .hint{color:var(--ink-muted);font-size:13px}
  .hint li{margin:4px 0}
  .itabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .itab{border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:2px 9px;font-family:var(--mono);font-size:12px}
  .itab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .fileline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
  .fileline .path{font-family:var(--mono);font-size:12.5px;font-weight:700}
  .fileline .lines{font-family:var(--mono);font-size:12px;color:var(--ink-muted)}
  .alias{border:1px solid var(--border);background:var(--k-db-soft);border-radius:8px;padding:8px 10px;margin:0 0 10px;font-size:12.5px}
  .alias .route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px;font-family:var(--mono);font-size:12px}
  .alias .route span.step{padding:1px 7px;border-radius:6px;border:1px solid var(--border);background:var(--surface)}
  .alias .route span.real{border-color:var(--k-db);color:var(--k-db);font-weight:700}
  .alias .arrow{color:var(--ink-muted)}
  .codebox{border:1px solid var(--border);border-radius:8px;background:var(--code-bg);overflow:auto;max-height:62vh}
  table.code{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.2px;line-height:1.6}
  table.code td{padding:0 10px;vertical-align:top;white-space:pre}
  table.code td.ln{position:sticky;left:0;text-align:right;color:var(--code-gutter);user-select:none;background:var(--code-bg);border-right:1px solid var(--border);min-width:44px;padding-right:8px}
  table.code tr.hl td{background:var(--code-hl)}
  table.code tr.hl td.ln{background:var(--code-hl);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--code-hl-bar)}
  .t-c{color:var(--c-comment);font-style:italic}.t-d{color:var(--c-comment)}.t-s{color:var(--c-str)}.t-k{color:var(--c-kw);font-weight:600}
  .t-f{color:var(--c-fn)}.t-n{color:var(--c-num)}.t-a{color:var(--c-deco)}
  .legend-hl{margin:8px 0 0;font-size:12px;color:var(--ink-muted)}
  .legend-hl b{background:var(--code-hl);color:var(--ink);padding:0 6px;border-radius:4px}
  .flist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
  .flist button{width:100%;text-align:left;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:6px 10px}
  .flist button:hover{border-color:var(--accent)}
  .flist small{display:block;color:var(--ink-muted)}
  details.hdr{margin-top:12px;font-size:13px}
  details.hdr pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px;font-family:var(--sans);font-size:12.5px;color:var(--ink-muted)}

  @media (max-width:900px){
    .app{display:block;height:auto}
    .stage-wrap{max-height:none;overflow-x:auto}
    .panel{position:fixed;left:0;right:0;bottom:0;width:auto;height:62vh;border-left:0;border-top:2px solid var(--accent);
      box-shadow:0 -10px 30px rgba(0,0,0,.25);z-index:20;transform:translateY(105%);transition:transform .18s}
    body.open .panel{transform:none}
    .p-close{display:inline-block;position:absolute;right:12px;top:10px}
    .p-head{position:relative;padding-right:70px}
    .top{padding:12px 16px 8px}
    .stage{padding:16px 16px 70vh}
  }
  @media (prefers-reduced-motion: reduce){.node,.panel{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <header class="top">
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>
      <div class="top-row">
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="stepper"><button class="btn" id="prev">◀ 이전</button><b id="stepNo">–</b><button class="btn" id="next">다음 ▶</button></div>
        <span class="spacer"></span>
        <a class="link" id="mdlink" href="#">📝 설명 문서 보기</a>
        <button class="btn" id="theme" title="라이트/다크 전환">🌓</button>
      </div>
    </header>
    <p class="intro" id="intro"></p>
    <div class="legend" aria-label="범례">
      <span><i style="background:var(--k-screen)"></i>화면 · 도착지</span>
      <span><i style="background:var(--k-route)"></i>routes (입구)</span>
      <span><i style="background:var(--k-helper)"></i>판단 (security · helpers)</span>
      <span><i style="background:var(--k-db)"></i>db (저장소)</span>
      <span><i style="background:var(--k-config)"></i>설정값</span>
      <span><i style="background:var(--k-later);opacity:.6"></i>다른 단원에서 자세히</span>
      <span>━ 다음 단계 &nbsp; ┅ 함수 호출</span>
    </div>
    <div class="stage-wrap" id="stageWrap"><div class="stage" id="stage"></div></div>
  </div>

  <aside class="panel" id="panel" aria-live="polite">
    <div class="p-head">
      <h2 id="pTitle"></h2><p id="pSub"></p>
      <button class="btn p-close" id="pClose">닫기</button>
    </div>
    <div class="p-body" id="pBody"></div>
  </aside>

ntro": "CSRF 오류가 났을 때 '이전 화면(referrer)'으로 돌려보내는데, 그 값은 요청한 쪽이 마음대로 정할 수 있어 공격자 사이트로 유도하는 데 악용될 수 있었습니다.", "nodes": [{"id": "low_n1", "col": 0, "row": 0, "kind": "screen", "title": "CSRF 토큰이 없거나 틀린 요청", "plain": "세션이 오래돼 토큰이 만료된 것이 실제 사용자에게 가장 흔한 원인입니다.", "reject": "", "later": "", "items": [{"block": "app.py:handle_csrf_error", "hl": [172, 172], "label": "handle_csrf_error()", "call": null, "snippet": false}]}, {"id": "low_n2", "col": 1, "row": 1, "kind": "route", "title": "① 안내 메시지", "plain": "다른 화면과 똑같이 flash 메시지로 안내합니다.", "reject": "", "later": "", "items": [{"block": "app.py:handle_csrf_error", "hl": [187, 187], "label": "handle_csrf_error()", "call": null, "snippet": false}]}, {"id": "low_n3", "col": 1, "row": 2, "kind": "route", "title": "② 이 사이트로 돌아가는 주소일 때만 되돌려 보낸다", "plain": "referrer 의 도메인이 이 사이트(request.host)와 같을 때만 그 주소로 보내고, 아니거나 없으면 로그인 화면으로 고정합니다.", "reject": "", "later": "", "items": [{"block": "app.py:handle_csrf_error", "hl": [188, 191], "label": "handle_csrf_error()", "call": null, "snippet": false}]}], "edges": [{"from": "low_n1", "to": "low_n2", "label": "", "kind": "flow"}, {"from": "low_n2", "to": "low_n3", "label": "", "kind": "flow"}], "steps": ["low_n1", "low_n2", "low_n3"]}], "blocks": {"helpers/hooks.py:register_request_hooks": {"path": "helpers/hooks.py", "start": 169, "end": 176, "lang": "python", "code": "def register_request_hooks(app) -> None:\n    \"\"\"위 함수들을 Flask 앱에 훅으로 등록한다. app.py가 Limiter를 만든 \"뒤\"에 불러야 한다 —\n    before_request는 등록한 순서대로 실행되므로, CSRF 검사·전역 요청 한도가 먼저 돌고\n    그다음에 관찰 훅이 돈다(app.py에 데코레이터로 직접 달려 있던 때와 같은 순서).\"\"\"\n    app.after_request(set_security_headers)\n    app.register_error_handler(404, handle_not_found)\n    app.before_request(track_page_access)\n    app.before_request(track_api_access)", "alias": null}, "helpers/hooks.py:set_security_headers": {"path": "helpers/hooks.py", "start": 37, "end": 69, "lang": "python", "code": "def set_security_headers(response):\n    \"\"\"모든 응답에 클릭재킹/콘텐츠 스니핑 방어용 보안 헤더를 추가한다 (L7 공격 보강 계획 Tier 2).\n\n    - X-Frame-Options / Content-Security-Policy(frame-ancestors): 이 사이트를\n      다른 사이트가 <iframe>에 몰래 끼워넣고 투명하게 겹친 뒤 클릭을 유도하는\n      클릭재킹을 막는다. \"즉시 해제\"/\"회원 삭제\" 같은 파괴적 버튼이 있는 관리자\n      대시보드일수록 이 방어가 중요하다. 두 헤더를 함께 쓰는 이유는\n      X-Frame-Options가 예전 브라우저 호환용이고, CSP의 frame-ancestors가 최신\n      표준이기 때문이다.\n    - Content-Security-Policy(그 외 지시문): 이 사이트가 직접 서빙하지 않는\n      스크립트/스타일/이미지가 끼어드는 것을 막는다. style-src/font-src에\n      Google Fonts 도메인만 예외로 열어둔 이유는 public/css/tokens.css가\n      @import로 그 폰트를 불러오기 때문이다 — 그 외 템플릿/정적 파일은\n      전부 이 사이트(\"'self'\")에서만 가져온다.\n    - X-Content-Type-Options: 브라우저가 응답의 Content-Type을 무시하고\n      내용만 보고 실행 방식을 \"추측\"하는 MIME 스니핑을 막는다.\n    - Referrer-Policy: 다른 사이트로 이동할 때 이 사이트의 전체 URL(쿼리스트링\n      포함)이 Referer 헤더로 그대로 넘어가는 것을 줄인다.\n    \"\"\"\n    response.headers[\"X-Frame-Options\"] = \"DENY\"\n    response.headers[\"Content-Security-Policy\"] = (\n        \"default-src 'self'; \"\n        \"script-src 'self'; \"\n        \"style-src 'self' https://fonts.googleapis.com; \"\n        \"font-src 'self' https://fonts.gstatic.com; \"\n        \"img-src 'self'; \"\n        \"frame-ancestors 'none'; \"\n        \"base-uri 'self'; \"\n        \"form-action 'self'\"\n    )\n    response.headers[\"X-Content-Type-Options\"] = \"nosniff\"\n    response.headers[\"Referrer-Policy\"] = \"strict-origin-when-cross-origin\"\n    return response", "alias": null}, "app.py:125-130": {"path": "app.py", "start": 125, "end": 130, "lang": "python", "code": "limiter = Limiter(\n    key_func=get_request_ip,\n    app=app,\n    default_limits=[f\"{config.GLOBAL_RATE_LIMIT_PER_MINUTE} per minute\"],\n    default_limits_exempt_when=lambda: request.endpoint in PAGE_ACCESS_EXCLUDED_ENDPOINTS,\n)", "alias": null}, "config.py:147-147": {"path": "config.py", "start": 147, "end": 147, "lang": "python", "code": "GLOBAL_RATE_LIMIT_PER_MINUTE = int(os.environ.get(\"GLOBAL_RATE_LIMIT_PER_MINUTE\", 120))", "alias": null}, "app.py:handle_rate_limit_exceeded": {"path": "app.py", "start": 156, "end": 168, "lang": "python", "code": "@app.errorhandler(RateLimitExceeded)\ndef handle_rate_limit_exceeded(error):\n    \"\"\"요청 한도를 넘긴 요청을 429로 거절하고 기록한다. 전역 한도(GLOBAL_RATE_LIMIT_PER_MINUTE)\n    뿐 아니라 위에서 따로 건 라우트별 좁은 한도(복구·이메일 확인·비밀번호 찾기)도 같은 예외로\n    여기에 온다 — 어느 쪽이든 HTTP_FLOOD 이벤트로 기록하고, count 칸에는 전역 한도 값을 넣는다.\n\n    soar.record_rejection()은 signup/post/comment 요청 거부와 동일한 HIGH 등급\n    \"상태 기반 중복 방지\" 패턴을 쓴다 — 같은 IP가 계속 도배해도 미해결 이벤트\n    하나의 count만 올리고, security_events가 HIGH로 도배되지 않게 한다.\n    \"\"\"\n    ip = get_request_ip()\n    soar.record_rejection(\"HTTP_FLOOD\", ip, request.path, config.GLOBAL_RATE_LIMIT_PER_MINUTE)\n    return error.get_response()", "alias": null}, "security/soar/observe.py:record_rejection": {"path": "security/soar/observe.py", "start": 77, "end": 107, "lang": "python", "code": "def record_rejection(event_type: str, ip: str, path: str, count: int) -> None:\n    \"\"\"가입·게시글·댓글 요청 거부와 요청 한도 초과(HTTP_FLOOD, app.py)를 HIGH로\n    security_events에 기록한다. Slack 알림은 보내지\n    않는다 — CRITICAL/MEDIUM과 달리 이 등급은 \"관리자가 나중에 대시보드에서 확인\"하는\n    선까지만 자동화하기로 했다(security-risk-response-summary.md 5절).\n\n    is_signup_rate_limited() 등은 차단되는 동안 시도 자체를 로그에 남기지 않아 count가\n    차단 기간 내내 고정된다 — MEDIUM의 is_first_over_threshold처럼 \"지금이 막 넘긴\n    순간\"이라는 신호가 없다는 뜻이다. 그래서 매 거부마다 새 행을 만드는 대신,\n    is_locked()와 같은 방식으로 \"이 IP·유형에 이미 미해결 이벤트가 있으면 새로 만들지\n    않는다\"는 상태 기반 중복 방지를 쓴다 — 없으면 봇 한 대가 60초 창 안에 거부당할\n    때마다 새 행이 쌓여 security_events가 HIGH로 도배되고 CRITICAL/MEDIUM이 묻힌다.\n\n    다만 \"새로 안 만든다\"고 끝내면 이미 열린 사건이 실제로 몇 번이나 반복됐는지\n    알 수 없다(count가 처음 거부됐을 때 값에 영원히 고정됨) — 그래서 미해결\n    이벤트가 있으면 무시하는 대신, 그 행의 count를 1 올린다. 관리자가 \"처리\n    완료\"를 누르면 다음 거부부터 다시 새 이벤트가 생긴다.\n\n    db.insert_security_event_or_bump()를 쓰는 이유: 여기서 \"미해결 이벤트가\n    있는지\" 확인한 바로 그 순간과 실제로 새로 삽입하는 순간 사이에 아주 잠깐의\n    틈이 있어서, 동시에 두 요청이 이 함수를 거의 같은 순간에 통과하면 둘 다\n    \"없음\"을 보고 각자 삽입해버릴 수 있다(경쟁 조건). insert_security_event_or_bump는\n    그 드문 경우에도 DB의 유니크 인덱스가 두 번째 삽입을 막아주면 count 증가로\n    자동 대체한다.\n    \"\"\"\n    existing = db.get_unresolved_security_event(ip, event_type)\n    if existing:\n        db.update_security_event_count(existing[\"id\"], existing[\"count\"] + 1)\n    else:\n        db.insert_security_event_or_bump(event_type, \"HIGH\", ip, path, count, \"REJECTED\")\n    correlate.check_and_correlate(ip, event_type, \"HIGH\")", "alias": {"call": "soar.record_rejection()", "via": "security/soar/__init__.py", "real": "security/soar/observe.py"}}, "templates/signup.html:42-45": {"path": "templates/signup.html", "start": 42, "end": 45, "lang": "html", "code": "                <div class=\"hp-field\" aria-hidden=\"true\">\n                    <label for=\"website\">웹사이트<\/label>\n                    <input type=\"text\" id=\"website\" name=\"website\" tabindex=\"-1\" autocomplete=\"off\">\n                <\/div>", "alias": null}, "helpers/request_utils.py:is_bot_submission": {"path": "helpers/request_utils.py", "start": 43, "end": 45, "lang": "python", "code": "def is_bot_submission() -> bool:\n    \"\"\"이번 폼 제출에 허니팟 필드가 채워져 있으면 True(봇 의심)를 돌려준다.\"\"\"\n    return bool(request.form.get(HONEYPOT_FIELD_NAME, \"\").strip())", "alias": null}, "helpers/request_utils.py:40-40": {"path": "helpers/request_utils.py", "start": 40, "end": 40, "lang": "python", "code": "HONEYPOT_FIELD_NAME = \"website\"", "alias": null}, "routes/auth.py:login_submit": {"path": "routes/auth.py", "start": 196, "end": 315, "lang": "python", "code": "@auth_bp.route(\"/login\", methods=[\"POST\"])\ndef login_submit():\n    \"\"\"로그인 폼 제출을 처리한다. 이 함수 하나가 이 프로젝트의 핵심 흐름을 담당한다.\n\n    처리 순서:\n    1. 혹시 자동으로 풀어줘야 할 만료된 잠금(IP 단위 + 계정 단위)이 있으면 먼저 정리한다.\n    2. 이번 요청을 보낸 IP와 입력된 아이디를 알아낸다.\n    3. 이 IP가 지금 잠긴 상태이거나, 이 계정 자체가 (다른 IP들이 나눠서 공격해서)\n       잠긴 상태라면 아이디/비밀번호를 확인하지도 않고 곧바로 거부한다. 단, 영구 잠금된\n       IP는 이메일 복구로 예외를 받은 \"본인 + 본인 기기\"만 통과시킨다(guide33/34-a).\n    4. 잠긴 상태가 아니라면 실제로 아이디/비밀번호를 확인하고, 그 시도를 기록한다.\n    5. 실패했다면 \"혹시 이 IP가 수상한 수준(5회 초과)이 됐는지\"를 먼저 보고,\n       아니라면 \"혹시 이 계정이 여러 IP에 걸쳐 총합으로 수상한 수준(8회 초과)이\n       됐는지\"도 본다 — 전자는 soar.enforce_lockout(IP 잠금), 후자는\n       soar.enforce_account_lockout(계정 잠금)이 알림까지 같이 보낸다\n       (L7 공격 보강 계획 Tier 1: 분산/저속 브루트포스 대응). 둘 다 아직 기준치 아래지만\n       코앞이면 LLM 조기 경보를 판단한다(guide31).\n    6. 성공했다면 회원 세션을 만들어서 회원 대시보드로 이동시킨다(12단계에서 추가).\n    \"\"\"\n    # 1) 시간이 지나 자동으로 풀려야 할 잠금들을 정리 (IP 단위 + 계정 단위)\n    soar.try_release_expired_lockouts()\n    soar.try_release_expired_account_lockouts()\n\n    ip = get_request_ip()\n    username = request.form.get(\"username\", \"\")\n    password = request.form.get(\"password\", \"\")\n\n    # 허니팟 필드가 채워져 있으면 사람이 아니라 자동화 스크립트라고 보고,\n    # 자격 증명 확인/시도 기록 없이 즉시 거부한다 (L7 공격 보강 계획 Tier 3).\n    if is_bot_submission():\n        soar.notify_bot_detected(ip, request.path)\n        flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n        return render_template(\"login_form.html\", form_action=url_for(\"auth.login_submit\"))\n\n    # 2) 이미 잠긴 IP이거나, 이미 잠긴 계정이라면 검증 자체를 건너뛰고 즉시 거부\n    #    — 단, 영구 잠금된 IP는 \"이메일 복구로 예외를 받은 본인+본인 기기\"만 통과시킨다(guide33).\n    exemption = None\n    if detector.is_locked(ip):\n        if detector.get_ip_lock_state(ip) != detector.LOCK_STATE_PERMANENT:\n            flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n            return _login_form()\n        exemption = _find_ip_exemption(ip, username)\n        if exemption is None:\n            flash(\"이 네트워크는 차단되어 있습니다. 본인이라면 아래 '본인 인증으로 접속 허용'을 이용해주세요.\")\n            return _login_form(recovery_link=True)\n        # 예외가 있으면 IP 잠금 안내 없이 아래 계정 잠금 확인과 정상적인 비밀번호 확인으로 계속 진행한다.\n\n    if detector.is_account_locked(username):\n        flash(ACCOUNT_LOCKED_MESSAGE)\n        return _login_form(recovery_link=True)\n\n    success = db.verify_user_credentials(username, password)\n    db.log_attempt(ip, username, success)\n\n    if success:\n        # 관리자 세션(\"admin_username\")과는 완전히 다른 키(\"username\")를 쓴다 —\n        # 그래야 같은 브라우저에서 관리자 세션이 있더라도 서로 섞이지 않는다.\n        # user_id도 같이 저장해두는 이유는 member_login_required 문지기 뒤에서\n        # \"아이디\"가 아니라 변하지 않는 \"번호\"로 본인 행을 정확히 찾기 위해서다.\n        user = db.get_user_by_username(username)\n        session[\"username\"] = username\n        session[\"user_id\"] = user[\"id\"]\n        # 세션 세대 번호 — 나중에 비밀번호가 바뀌면 이 세션을 끊는 데 쓴다(guide35).\n        session[\"session_version\"] = user.get(\"session_version\") or 0\n        return redirect(url_for(\"member.member_dashboard\"))\n\n    # 영구 잠금 예외로 통과한 사용자가 연달아 실패하면 그 예외를 회수한다 — 예외는 \"본인이\n    # 비밀번호를 아는 상황\"을 전제로 한 출입증이라, 계속 틀리는 건 도용 신호로 본다.\n    # (예외 통과자의 실패는 IP 임계값 판정으로 넘기지 않는다 — 이 IP는 이미 영구 잠금 중이라\n    # enforce_lockout()이 5분 잠금 알림을 또 보내는 일이 없도록 하기 위해서다.)\n    if exemption is not None:\n        if db.count_recent_failures(ip) >= config.IP_EXEMPTION_MAX_FAILURES:\n            db.revoke_ip_exemption(exemption[\"id\"], \"예외 통과 후 연속 로그인 실패\")\n        flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n        return _login_form()\n\n    # 실패했다면, 먼저 이 IP가 방금 임계값을 넘었는지 확인한다.\n    suspicious, failure_count = detector.is_suspicious(ip)\n    if suspicious:\n        # 최근 실패에 쓰인 아이디가 몇 개였는지도 함께 세서, Slack 알림이 Brute\n        # Force(계정 1개 집중)와 Password Spraying(계정 여러 개 순회)을 구분해\n        # 표시할 수 있게 한다 (attack_response_state.md 구현 대상 #5).\n        distinct_usernames = detector.count_distinct_usernames(ip)\n        soar.enforce_lockout(ip, failure_count, distinct_usernames)\n        flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n    else:\n        # 아직 기준치(FAILURE_THRESHOLD)는 안 넘었지만 코앞이면, LLM에게 조기\n        # 경보 여부를 물어본다 (Track A, guide31). 공격자가 임계값을 살짝\n        # 피해 가려고 실패 횟수를 일부러 코앞에서 멈추는 패턴을 이 구간에서 잡는다.\n        if failure_count >= config.FAILURE_THRESHOLD - config.EARLY_WARNING_BAND:\n            distinct_usernames = detector.count_distinct_usernames(ip)\n            soar.consider_early_warning(\n                \"BRUTE_FORCE\", \"LOCK_IP\", \"ip\", ip, failure_count, config.FAILURE_THRESHOLD,\n                context_count=distinct_usernames,\n            )\n\n        # IP 단위로는 아직 수상하지 않더라도, 이 계정이 여러 IP에 걸쳐 나뉘어서\n        # 총합 기준으로 수상한 수준이 됐는지 확인한다 — 공격자가 IP를 돌려가며\n        # (봇넷/프록시 로테이션) 한 계정만 노리는 분산 브루트포스를 잡아낸다.\n        account_suspicious, account_failure_count = detector.is_account_suspicious(username)\n        if account_suspicious:\n            distinct_ips = detector.count_distinct_ips_by_username(username)\n            soar.enforce_account_lockout(username, account_failure_count, distinct_ips, ip)\n            flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n        else:\n            # 이 계정도 마찬가지로 임계값(ACCOUNT_FAILURE_THRESHOLD) 코앞이면\n            # 조기 경보 대상이다 — 여러 IP에 나눠 시도하되 각 IP·계정 총합\n            # 모두를 임계값 아래로 유지하려는 패턴을 잡아낸다.\n            if account_failure_count >= config.ACCOUNT_FAILURE_THRESHOLD - config.EARLY_WARNING_BAND:\n                distinct_ips = detector.count_distinct_ips_by_username(username)\n                soar.consider_early_warning(\n                    \"DISTRIBUTED_BRUTE_FORCE\", \"LOCK_ACCOUNT\", \"account\", username,\n                    account_failure_count, config.ACCOUNT_FAILURE_THRESHOLD,\n                    context_count=distinct_ips, context_ip=ip,\n                )\n            # 사용자 존재 여부(아이디가 없는지, 비밀번호만 틀렸는지)를 구분해서\n            # 알려주면 공격자에게 힌트를 주게 되므로, 항상 똑같은 문구로만 실패를 알린다.\n            flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n\n    return render_template(\"login_form.html\", form_action=url_for(\"auth.login_submit\"))", "alias": null}, "security/soar/observe.py:notify_bot_detected": {"path": "security/soar/observe.py", "start": 15, "end": 23, "lang": "python", "code": "def notify_bot_detected(ip: str, path: str) -> None:\n    \"\"\"허니팟 필드가 채워진 요청(자동화 스크립트/봇 의심)을 MEDIUM 이벤트로 기록한다.\n\n    Slack 알림은 보내지 않는다 — 로그인 실패 반복이나 게시글 도배처럼 그 자체로\n    실제 피해로 이어지는 사건이 아니라 \"이 트래픽에 자동화 스크립트가 섞여\n    있다\"는 관찰 정보이므로, notify_web_scanning() 등과 같은 급의 MEDIUM으로\n    로그에만 남긴다 (L7 공격 보강 계획 Tier 3).\n    \"\"\"\n    _record_event(\"BOT_DETECTED\", \"MEDIUM\", ip, path, 1, \"REJECTED\")", "alias": {"call": "soar.notify_bot_detected()", "via": "security/soar/__init__.py", "real": "security/soar/observe.py"}}, "db/users.py:verify_user_credentials": {"path": "db/users.py", "start": 73, "end": 90, "lang": "python", "code": "def verify_user_credentials(username: str, password: str) -> bool:\n    \"\"\"사용자가 로그인 화면에 입력한 아이디/비밀번호가 맞는지 확인한다.\n\n    동작 원리는 verify_admin_credentials와 동일 — 저장된 암호문과\n    \"지금 입력한 비밀번호를 암호화한 결과\"가 일치하는지만 비교한다.\n\n    타이밍 사이드채널 방지 (L7 공격 보강 계획 Tier 3): 예전에는 아이디가 없으면\n    check_password_hash()를 아예 건너뛰고 바로 False를 돌려줬다. 이 해시 비교는\n    일부러 느리게 설계된 연산이라, \"즉시 반환(아이디 없음)\"과 \"해시 비교 후\n    반환(비밀번호만 틀림)\" 사이에 응답 시간 차이가 생겨 공격자가 그 차이만으로\n    \"이 아이디가 존재하는가\"를 추측할 수 있었다(화면 메시지는 이미 통일돼\n    있었지만 타이밍까지는 못 가렸다). 아이디가 없을 때도 미리 만들어둔 더미\n    해시로 항상 같은 비교 연산을 거치게 해서 응답 시간을 균일화한다.\n    \"\"\"\n    user = get_user_by_username(username)\n    password_hash = user[\"password_hash\"] if user else _DUMMY_PASSWORD_HASH\n    result = check_password_hash(password_hash, password)\n    return result if user else False", "alias": {"call": "db.verify_user_credentials()", "via": "db/__init__.py", "real": "db/users.py"}}, "db/users.py:17-17": {"path": "db/users.py", "start": 17, "end": 17, "lang": "python", "code": "_DUMMY_PASSWORD_HASH = generate_password_hash(\"dummy-password-for-timing-safety\")", "alias": null}, "db/admin.py:verify_admin_credentials": {"path": "db/admin.py", "start": 43, "end": 65, "lang": "python", "code": "def verify_admin_credentials(username: str, password: str) -> bool:\n    \"\"\"관리자가 로그인 화면에 입력한 아이디/비밀번호가 맞는지 확인한다.\n\n    비밀번호는 저장할 때 이미 암호화(해시)되어 있으므로, \"원래 글자를 복원\"해서\n    비교하는 게 아니라 \"입력한 비밀번호를 똑같은 방식으로 암호화했을 때 저장된\n    암호문과 글자가 일치하는가\"만 확인한다 (check_password_hash가 이 비교를 해줌).\n\n    타이밍 사이드채널 방지 (L7 공격 보강 계획 Tier 3, db/users.py의\n    verify_user_credentials와 동일한 이유): 아이디가 없을 때도 더미 해시로\n    항상 같은 비교 연산을 거치게 해서, \"즉시 반환\"과 \"해시 비교 후 반환\" 사이의\n    응답 시간 차이로 관리자 아이디 존재 여부를 추측하지 못하게 한다.\n    \"\"\"\n    res = (\n        db.get_client()\n        .table(\"admin_users\")\n        .select(\"password_hash\")\n        .eq(\"username\", username)\n        .limit(1)\n        .execute()\n    )\n    password_hash = res.data[0][\"password_hash\"] if res.data else _DUMMY_PASSWORD_HASH\n    result = check_password_hash(password_hash, password)\n    return result if res.data else False", "alias": {"call": "db.verify_admin_credentials()", "via": "db/__init__.py", "real": "db/admin.py"}}, "services/geoip.py:_fetch_location": {"path": "services/geoip.py", "start": 23, "end": 69, "lang": "python", "code": "def _fetch_location(ip: str) -> dict:\n    \"\"\"ip-api.com에 실제로 물어봐서 이 IP의 국가/지역/도시를 알아낸다.\n\n    이 함수는 캐시를 전혀 신경 쓰지 않는다 — \"무조건 새로 조회한다\"는 역할만\n    한다. 캐시를 먼저 확인할지 말지는 이 함수를 부르는 get_locations()가 결정한다.\n\n    실패하는 경우가 세 가지 있다:\n    1. ip가 애초에 올바른 IP 형식이 아닌 경우 (SSRF 방지, 아래 설명)\n    2. 네트워크 자체가 안 되거나 응답이 이상한 경우 (requests.RequestException)\n    3. 127.0.0.1 같은 사설/예약된 IP라서 애초에 위치가 없는 경우\n       (ip-api.com이 {\"status\": \"fail\", \"message\": \"reserved range\"} 같은\n       응답을 돌려준다)\n    세 경우 다 \"조회 실패\"로 취급하고, 국가/지역/도시는 전부 None으로 채운다.\n\n    SSRF 방지 (L7 공격 보강 계획 Tier 3): ip는 보통 helpers.get_request_ip()가\n    돌려준 값인데, config.TRUST_FORWARDED_FOR=true(데모 전용 설정)일 때는 그\n    값이 클라이언트가 보낸 X-Forwarded-For 헤더에서 그대로 온다. 이 함수가\n    ip 값을 검증 없이 _API_URL.format(ip=ip)에 그대로 꽂아 외부로 요청을\n    보내므로, 헤더에 URL 조작을 노린 문자열이 들어오면 그 문자열이 그대로\n    외부 요청 주소에 섞여 들어갈 수 있었다. ip_utils.lookup_address()로 \"진짜\n    IP(또는 IP 대역) 형식인가\"만 먼저 확인하고, 아니면 요청 자체를 보내지 않는다.\n    \"\"\"\n    # IPv6는 /64 대역 키로 들어온다(guide42) — 대역이면 대표 주소(네트워크 주소)로 조회한다.\n    # IP도 대역도 아니면 외부로 요청을 보내지 않는다(위 SSRF 방지 설명).\n    lookup_ip = lookup_address(ip)\n    if lookup_ip is None:\n        return {\"country\": None, \"region_name\": None, \"city\": None, \"lookup_failed\": True}\n\n    try:\n        response = requests.get(\n            _API_URL.format(ip=lookup_ip),\n            params={\"fields\": \"status,country,regionName,city\"},\n            timeout=5,\n        )\n        data = response.json()\n    except requests.RequestException:\n        return {\"country\": None, \"region_name\": None, \"city\": None, \"lookup_failed\": True}\n\n    if data.get(\"status\") != \"success\":\n        return {\"country\": None, \"region_name\": None, \"city\": None, \"lookup_failed\": True}\n\n    return {\n        \"country\": data.get(\"country\"),\n        \"region_name\": data.get(\"regionName\"),\n        \"city\": data.get(\"city\"),\n        \"lookup_failed\": False,\n    }", "alias": null}, "services/ip_utils.py:lookup_address": {"path": "services/ip_utils.py", "start": 57, "end": 68, "lang": "python", "code": "def lookup_address(key: str) -> str | None:\n    \"\"\"위치 조회(geoip)에 넘길 실제 주소. 대역 키면 대표 주소(네트워크 주소)를, IP면 그대로,\n    둘 다 아니면 None(조회하지 않음 — 외부 요청 주소에 이상한 문자열이 섞이지 않게).\"\"\"\n    if \"/\" in key:\n        try:\n            return str(ipaddress.ip_network(key, strict=False).network_address)\n        except ValueError:\n            return None\n    try:\n        return str(ipaddress.ip_address(key))\n    except ValueError:\n        return None", "alias": null}, "app.py:handle_csrf_error": {"path": "app.py", "start": 171, "end": 191, "lang": "python", "code": "@app.errorhandler(CSRFError)\ndef handle_csrf_error(error):\n    \"\"\"CSRF 토큰이 없거나 틀렸을 때 Flask-WTF가 던지는 예외를 붙잡아 처리한다.\n\n    기본 동작(그냥 400 에러 페이지)도 안전하긴 하지만, 이 프로젝트의 다른 화면들과\n    똑같이 flash 메시지 + 로그인 화면으로 안내하는 편이 사용자 경험상 자연스럽다.\n    (세션이 너무 오래돼 토큰이 만료된 경우가 실제 사용자에게 가장 흔한 원인이다.)\n\n    오픈 리다이렉트 방지 (L7 공격 보강 계획 Tier 4): request.referrer는 브라우저가\n    보내는 값이지만, 결국 요청을 보낸 클라이언트가 자유롭게 설정할 수 있는 헤더다.\n    예전에는 이 값을 검증 없이 그대로 redirect()에 넘겨서, 공격자 사이트에서 이\n    CSRF 에러 핸들러로 링크를 걸면 이론상 그 값을 우리 사이트가 신뢰하는 이동\n    경로처럼 돌려주는 경로가 있었다. urlparse로 \"이 사이트(request.host)로\n    돌아가는 주소인지\"부터 확인하고, 아니거나 아예 없으면 로그인 화면으로 고정\n    폴백한다.\n    \"\"\"\n    flash(\"보안 토큰이 만료되었거나 올바르지 않습니다. 다시 시도해주세요.\")\n    referrer = request.referrer\n    if referrer and urlparse(referrer).netloc == request.host:\n        return redirect(referrer), 400\n    return redirect(url_for(\"auth.login\")), 400", "alias": null}}, "files": {"helpers/hooks.py": {"role": "모든 응답에 보안 헤더를 붙이는 등, 요청마다 걸리는 공용 훅 파일.", "header": "helpers/hooks.py — 모든 요청에 걸리는 공용 훅: 보안 헤더, 404 기록(Web Scanning),\n반복 페이지 접근·매크로 API 패턴 관찰\n원래 app.py에 @app.after_request / @app.errorhandler(404) / @app.before_request\n데코레이터로 직접 달려 있었다. app.py가 앱 \"조립\"(설정·Blueprint 등록·요청 한도)에만\n집중하도록 이 파일로 옮겼고, app.py는 register_request_hooks(app) 한 줄로 등록한다.\n배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/helpers/hooks.py"}, "app.py": {"role": "Flask 앱을 조립하는 시작 파일. 전역 요청 한도(Limiter)와 CSRF 오류 처리가 여기에 있다.", "header": "app.py — 이 프로그램의 \"정문\" 역할을 하는 Flask 진입점\n지금까지 만든 db/(데이터 저장/조회), security/detector.py(판정), security/soar/(조치),\nnotify/alert.py(알림)는 전부 \"부품\"이었다. 이 파일은 그 부품들을 실제 웹 화면의\n버튼·주소(URL)와 연결해서, 사용자가 브라우저로 방문했을 때 실제로 동작하는\n\"완성된 웹사이트\"로 만들어주는 역할을 한다.\nFlask란? 파이썬으로 웹사이트(웹 서버)를 아주 적은 코드로 만들 수 있게\n도와주는 도구(프레임워크)다. \"이 주소로 누가 들어오면 이 함수를 실행해라\"\n는 규칙을 하나씩 등록해두면, 사용자가 그 주소로 접속했을 때 자동으로\n해당 함수가 실행되어 화면을 만들어 보여준다.\n실제 화면 라우트(회원가입/로그인/관리자/게시판/회원 대시보드 등)는 이제 이\n파일이 아니라 routes/ 아래 Blueprint들에 나뉘어 있다 — 이 파일에는 앱을\n만들고(Flask()), 공용 설정(세션/CSRF/요청 한도)을 하고, 그 Blueprint들을 등록하는\n\"조립\" 코드와, 요청 한도·CSRF 에러 핸들러만 남아있다. 모든 요청에 걸리는 관찰 훅\n(보안 헤더, 404 기록, 반복 접근·매크로 탐지)은 helpers/hooks.py에 있다.\n분리 배경과 각 파일이 어디로 갔는지는 docs/refactor/2026-09-15-file-split.md,\ndocs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/app.py"}, "config.py": {"role": "임계값·시간 창·잠금 시간·규칙값 등 프로젝트 공용 설정값을 한 곳에 모은 파일.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/config.py"}, "security/soar/observe.py": {"role": "알림·기록 조치 파일. 봇 감지·요청 거부(HIGH)를 기록한다.", "header": "security/soar/observe.py — 잠그지 않고 관찰만 하는 조치(알림 + 이벤트 기록)와 요청 거부 기록\n예전 soar.py(497줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from security import soar` 후 `soar.enforce_lockout(...)`으로\n쓴다(security/soar/__init__.py가 재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/soar/observe.py"}, "templates/signup.html": {"role": "회원가입 화면. 사람 눈에 안 보이는 허니팟 입력칸이 들어 있다.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/templates/signup.html"}, "helpers/request_utils.py": {"role": "봇 함정(허니팟) 확인과 요청 IP 확인을 담당하는 공용 도구.", "header": "helpers/request_utils.py — 요청 정보(IP, 허니팟) 읽기와 화면용 작은 변환 함수\n예전 helpers.py(314줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from helpers import ...`로 가져다 쓴다(helpers/__init__.py가\n재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/helpers/request_utils.py"}, "routes/auth.py": {"role": "routes/auth.py — 회원가입(/signup) + 감시 대상 로그인(/login) 원래 app.py의 \"회원가입 입력 검증 규칙\" / \"회원가입\" / \"감시 대상 로그인\" 세 섹션을 그대로 옮겨왔다. 배경은 docs/refactor/2026-09-15-file-split.md ", "header": "routes/auth.py — 회원가입(/signup) + 감시 대상 로그인(/login)\n원래 app.py의 \"회원가입 입력 검증 규칙\" / \"회원가입\" / \"감시 대상 로그인\"\n세 섹션을 그대로 옮겨왔다. 배경은 docs/refactor/2026-09-15-file-split.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/auth.py"}, "db/users.py": {"role": "회원 비밀번호 확인. 아이디가 없어도 같은 시간이 걸리게 '더미 해시'와 비교한다.", "header": "db/users.py — users 표 관련 함수 (회원가입 기능)\n— 감시 대상이 되는 가짜 로그인 화면(/login)에 실제로 가입해서 로그인하는\n\"일반 사용자\" 계정을 관리하는 기능. 관리자(admin_users)와는 완전히 별개 개념.\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/users.py"}, "db/admin.py": {"role": "관리자 비밀번호 확인. 회원과 같은 타이밍 방어를 쓴다.", "header": "db/admin.py — admin_users / admin_login_log 표 관련 함수\n— 관리자(대시보드에 로그인하는 사람) 계정과, 그 로그인 시도 기록을 관리하는 기능\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/admin.py"}, "services/geoip.py": {"role": "IP 위치 조회 부품. IP 형식이 아니면 외부 요청을 보내지 않는다(SSRF 방지).", "header": "services/geoip.py — IP 주소로 \"어느 나라, 어느 도시에서 접속했는지\" 알아내는 부품\nnotify/alert.py가 Slack이라는 외부 서비스와의 통신만 전담하는 것처럼, 이 파일은\nip-api.com이라는 외부 서비스와의 통신만 전담한다. db(Supabase)나\n화면 쪽(helpers/request_utils.py의 _attach_locations())은 이 파일이 내부적으로\n무엇을 하는지 몰라도, get_locations() 함수 하나만 부르면 위치 정보를 받을 수 있다.\n가장 중요한 설계 포인트는 \"캐싱\"이다. ip-api.com 무료 사용은 분당 45건까지만\n허용하는데, 대시보드가 5초마다 최근 로그인 시도를 다시 그리면서 그때마다\n새로 조회하면 순식간에 한도를 넘긴다. 그래서 한 번 조회한 IP는 db(db/geoip_cache.py)를 통해\nSupabase에 저장해두고, 다음부터는 외부 API 대신 그 저장값을 재사용한다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/services/geoip.py"}, "services/ip_utils.py": {"role": "IP 주소를 검증·정규화하는 순수 함수 모음.", "header": "services/ip_utils.py — 접속 IP를 \"탐지·잠금 단위\"로 정규화한다 (guide42)\n왜 필요한가: IPv6 사용자는 보통 /64 대역(앞 64비트가 같은 2^64개 주소)을 통째로 받아서 주소를\n바꾸는 비용이 거의 없다. 주소 하나를 단위로 세고 잠그면, 시도마다 주소를 바꾸는 것만으로 IP 잠금·\nIP 단위 탐지·요청 제한·영구 잠금이 모두 무력화된다. 그래서 IPv6는 대역(기본 /64)을 한 단위로 본다.\n203.0.113.10            → 203.0.113.10          (IPv4는 그대로)\n2001:db8:1:2:abcd::5    → 2001:db8:1:2::/64     (IPv6는 대역)\n::ffff:203.0.113.10     → 203.0.113.10          (IPv4가 들어 있는 IPv6는 IPv4로)\n::1                     → ::1                   (루프백은 그대로 — 로컬 개발 편의)\nhelpers.get_request_ip()가 이 함수를 거친 값을 돌려주므로, 그 값을 쓰는 로그인 실패 집계·IP 잠금·\n요청 제한·보안 이벤트·상관분석·IP 예외·복구/재설정 IP 한도가 전부 같은 단위로 동작한다.\nFlask에 의존하지 않는 순수 함수라 security/lockdown.py(허용 목록)와 scripts/management/unlock_ip.py도 같이 쓴다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/services/ip_utils.py"}}}</script>

  var PY = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?''')|([rbfRBF]{0,2}"(?:\\.|[^"\\\n])*"|[rbfRBF]{0,2}'(?:\\.|[^'\\\n])*')|\b(def|class|return|if|elif|else|for|while|import|from|as|try|except|finally|with|in|not|and|or|is|None|True|False|raise|pass|lambda|yield|global|nonlocal|assert|del|continue|break)\b|(@[A-Za-z_][\w.]*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(?=\()/g;

  var HT = /(<!--[\s\S]*?-->)|(\{[{%#][\s\S]*?[}%#]\})|(<\/?[A-Za-z][\w-]*)|("[^"\n]*")|(\/?>)/g;
  var HTC = [null,"t-c","t-a","t-k","t-s","t-k"];
  var JS = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\.|[^`\\])*`)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(const|let|var|function|return|if|else|for|while|import|from|export|default|async|await|try|catch|finally|new|class|extends|typeof|interface|type|null|undefined|true|false|throw|switch|case|break|continue|of|in|as)\b|(@[A-Za-z_]\w*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_$][\w$]*)(?=\()/g;
  var JSC = [null,"t-c","t-s","t-s","t-k","t-a","t-n","t-f"];
  var SQ = /(--[^\n]*|\/\*[\s\S]*?\*\/)|((?!))|('(?:''|[^'])*')|\b(select|from|where|insert|into|values|update|set|delete|create|table|index|alter|add|drop|on|conflict|do|nothing|and|or|not|null|default|primary|key|references|cascade|if|exists|as|order|by|group|limit|desc|asc|join|left|inner|count|returns|function|language|begin|end|return|with|union|all|distinct|in|is|true|false|unique|check|constraint|timestamptz|text|integer|bigint|boolean|interval|now|replace|trigger|view|policy|enable|row|level|security|using)\b|((?!))|\b(\d+(?:\.\d+)?)\b|\b([a-z_]\w*)(?=\()/gi;
  var SQC = [null,"t-c",null,"t-s","t-k",null,"t-n","t-f"];
  var SH = /(#[^\n]*)|((?!))|("(?:\\.|[^"\\\n])*"|'[^'\n]*')|\b(if|then|else|fi|for|do|done|while|case|esac|function|echo|export|python|pip|git|cd|run|name|on|jobs|steps|uses|with|env)\b|((?!))|\b(\d+)\b/g;
  var SHC = [null,"t-c",null,"t-s","t-k",null,"t-n"];
  function tokenize(code, lang){
    var re = PY, cls = PYC;
    if (lang === "html"){ re = HT; cls = HTC; }
    else if (lang === "js"){ re = JS; cls = JSC; }
    else if (lang === "sql"){ re = SQ; cls = SQC; }
    else if (lang === "sh"){ re = SH; cls = SHC; }
    var lines = [[]];
    function push(text, c){
      var parts = text.split("\n");
      parts.forEach(function(p, i){
        if (i > 0) lines.push([]);
        if (p) lines[lines.length-1].push([p, c]);
      });
    }
    var last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(code)) !== null){
      if (m.index > last) push(code.slice(last, m.index), null);
      var idx = 1; while (idx < m.length && m[idx] === undefined) idx++;
      push(m[0], cls[idx] || null);
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++;
    }
    if (last < code.length) push(code.slice(last), null);
    return lines;
  }

  function codeTable(block, hl){
    var lines = tokenize(block.code, block.lang);
    var tbody = el("tbody");
    var hlFirst = null;
    lines.forEach(function(segs, i){
      var no = block.start + i;
      var on = hl && no >= hl[0] && no <= hl[1];
      var td = el("td", {class:"tx"});
      segs.forEach(function(s){ td.appendChild(s[1] ? el("span", {class:s[1], text:s[0]}) : document.createTextNode(s[0])); });
      if (!segs.length) td.appendChild(document.createTextNode(" "));
      var tr = el("tr", on ? {class:"hl"} : null, [el("td", {class:"ln", text:String(no)}), td]);
      if (on && !hlFirst) hlFirst = tr;
      tbody.appendChild(tr);
    });
    var box = el("div", {class:"codebox"}, [el("table", {class:"code"}, [tbody])]);
    box._hlFirst = hlFirst;
    return box;
  }

  function copyText(text, btn){
    var done = function(){ var o = btn.textContent; btn.textContent = "복사됨 ✓"; setTimeout(function(){ btn.textContent = o; }, 1200); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
    function fallback(){
      var ta = el("textarea", {style:"position:fixed;opacity:0"}); ta.value = text; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); done(); } catch(e){} document.body.removeChild(ta);
    }
  }

  /* ---------- 패널 ---------- */
  function openPanel(){ document.body.classList.add("open"); }
  function closePanel(){ document.body.classList.remove("open"); }

  function showHint(){
    $("pTitle").textContent = "코드 보는 법";
    $("pSub").textContent = "카드나 파일 이름을 누르면 실제 코드가 여기에 열립니다.";
    var ul = el("ul", {class:"hint"}, [
      el("li", {text:"카드(상자)를 누르면 그 단계에서 실행되는 실제 함수 코드가 열려요."}),
      el("li", {text:"카드 안의 📄 파일 이름을 누르면 그 파일이 어떤 역할인지, 이 단원에서 쓰이는 함수가 무엇인지 보여줘요."}),
      el("li", {text:"ƒ 함수 이름을 누르면 해당 함수 코드로 바로 이동해요."}),
      el("li", {text:"노란색 줄이 지금 단계가 담당하는 부분이에요."}),
      el("li", {text:"db.함수() 처럼 적혀 있어도 실제 코드는 db/users.py 같은 다른 파일에 있어요. 카드에 그 '진짜 파일'을 표시하고, 코드 위에 찾아가는 길도 그려줘요."}),
      el("li", {text:"위쪽 ◀ ▶ 버튼으로 실행 순서대로 한 단계씩 따라갈 수 있어요."})
    ]);
    var b = $("pBody"); b.textContent = ""; b.appendChild(ul);
  }

  function renderAlias(a){
    if (!a) return null;
    return el("div", {class:"alias"}, [
      el("div", {text:"코드에는 이렇게 적혀 있지만, 실제 함수는 다른 파일에 있어요."}),
      el("div", {class:"route"}, [
        el("span", {class:"step", text:a.call}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step", text:a.via + " (창구)"}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step real", text:a.real})
      ])
    ]);
  }

  function selectNode(id, itemIdx){
    var n = nodeById(id); if (!n) return;
    state.node = id; state.item = itemIdx || 0; state.file = null;
    $("pTitle").textContent = n.title;
    $("pSub").textContent = n.plain;
    var body = $("pBody"); body.textContent = "";
    if (n.reject) body.appendChild(el("div", {class:"n-reject", text:n.reject, style:"margin:0 0 10px"}));
    if (n.items.length > 1){
      var tabs = el("div", {class:"itabs", role:"tablist"});
      n.items.forEach(function(it, i){
        tabs.appendChild(el("button", {class:"itab", role:"tab", "aria-selected":String(i === state.item), text:it.label,
          onclick:function(){ selectNode(id, i); }}));
      });
      body.appendChild(tabs);
    }
    var it = n.items[state.item];
    var block = D.blocks[it.block];
    var linesTxt = it.hl ? (it.hl[0] === it.hl[1] ? it.hl[0] + "줄" : it.hl[0] + "–" + it.hl[1] + "줄") : "";
    var fl = el("div", {class:"fileline"}, [
      el("button", {class:"chip file", onclick:function(){ selectFile(block.path); }, text:block.path}),
      el("span", {class:"lines", text: block.start + "–" + block.end + "줄 표시" + (linesTxt ? " · 노란색 " + linesTxt : "")}),
      el("span", {class:"spacer"}),
      el("button", {class:"btn", text:"복사", onclick:function(e){ copyText(block.code, e.currentTarget); }}),
      el("a", {class:"btn link", href:D.files[block.path].github + "#L" + block.start + "-L" + block.end, target:"_blank", rel:"noopener", text:"GitHub ↗"})
    ]);
    body.appendChild(fl);
    var al = renderAlias(block.alias); if (al) body.appendChild(al);
    var box = codeTable(block, it.hl);
    body.appendChild(box);
    if (it.hl) body.appendChild(el("p", {class:"legend-hl"}, [el("b", {text:"노란색"}), " = 이 카드가 담당하는 줄"]));
    refreshSelection();
    openPanel();
    if (box._hlFirst){
      var off = box._hlFirst.offsetTop - 60;
      box.scrollTop = Math.max(0, off);
    }
    updateStepper();
  }

  function selectFile(path){
    state.file = path; state.node = null;
    var f = D.files[path];
    $("pTitle").textContent = "📄 " + path;
    $("pSub").textContent = f.role;
    var body = $("pBody"); body.textContent = "";
    body.appendChild(el("div", {class:"fileline"}, [
      el("a", {class:"btn link", href:f.github, target:"_blank", rel:"noopener", text:"GitHub에서 파일 열기 ↗"})
    ]));
    body.appendChild(el("h3", {text:"이 단원에서 쓰이는 함수", style:"font-size:13.5px;margin:12px 0 0"}));
    var ul = el("ul", {class:"flist"}), seen = {};
    D.scenarios.forEach(function(sc, si){
      sc.nodes.forEach(function(n){
        n.items.forEach(function(it, ii){
          var b = D.blocks[it.block]; if (b.path !== path) return;
          var key = si + n.id + ii; if (seen[key]) return; seen[key] = 1;
          var li = el("li");
          li.appendChild(el("button", {onclick:function(){
            if (state.sc !== si) switchScenario(si);
            selectNode(n.id, ii); scrollToNode(n.id);
          }}, [
            el("span", {class:"mono", text:it.label}), el("small", {text:sc.name + " · " + n.title})
          ]));
          ul.appendChild(li);
        });
      });
    });
    body.appendChild(ul);
    if (f.header){
      var d = el("details", {class:"hdr"}, [el("summary", {text:"파일 맨 위 설명 주석 보기"}), el("pre", {text:f.header})]);
      body.appendChild(d);
    }
    refreshSelection();
    openPanel();
  }

  /* ---------- 흐름도 ---------- */
  var cols, colIndex, nodeEls = {};
  function renderStage(){
    var sc = scen();
    var used = {}; sc.nodes.forEach(function(n){ used[n.col] = 1; });
    cols = Object.keys(used).map(Number).sort(function(a,b){ return a-b; });
    colIndex = {}; cols.forEach(function(c, i){ colIndex[c] = i + 1; });
    var stage = $("stage");
    stage.textContent = "";
    stage.style.gridTemplateColumns = "repeat(" + cols.length + ", 196px)";
    nodeEls = {};

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "edges"); svg.id = "edges";
    svg.innerHTML = '<defs>' +
      '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-call" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '</defs>';
    stage.appendChild(svg);

    cols.forEach(function(c){
      stage.appendChild(el("div", {class:"colhead", style:"grid-column:" + colIndex[c] + ";grid-row:1", text:D.columns[c]}));
    });
    var cells = {};
    sc.nodes.forEach(function(n){
      var k = n.row + ":" + n.col;
      if (!cells[k]){
        cells[k] = el("div", {class:"cell", style:"grid-column:" + colIndex[n.col] + ";grid-row:" + (n.row + 2)});
        stage.appendChild(cells[k]);
      }
      var node = buildNode(n);
      nodeEls[n.id] = node;
      cells[k].appendChild(node);
    });
    $("intro").textContent = sc.intro;
    scheduleEdges();
  }

  function buildNode(n){
    var node = el("div", {class:"node " + n.kind, role:"button", tabindex:"0", "aria-pressed":"false", "data-id":n.id,
      onclick:function(e){ if (e.target.closest(".chip")) return; selectNode(n.id, 0); },
      onkeydown:function(e){ if ((e.key === "Enter" || e.key === " ") && !e.target.closest(".chip")){ e.preventDefault(); selectNode(n.id, 0); } }});
    var title = el("div", {class:"n-title", text:n.title});
    if (n.later) title.appendChild(el("span", {class:"tag-later", text:n.later + "에서 자세히"}));
    node.appendChild(title);
    if (n.kind !== "later" && n.plain) node.appendChild(el("div", {class:"n-plain", text:n.plain}));
    if (n.reject) node.appendChild(el("div", {class:"n-reject", text:n.reject}));
    var items = el("div", {class:"n-items"});
    // 같은 파일에 있는 함수는 파일 칩 하나 아래에 함수 칩을 나란히 놓는다
    var groups = [];
    n.items.forEach(function(it, i){
      var b = D.blocks[it.block], g = groups[groups.length - 1];
      if (g && g.path === b.path) g.list.push({it: it, i: i}); else groups.push({path: b.path, list: [{it: it, i: i}]});
    });
    groups.forEach(function(g){
      var row = el("div", {class:"n-item"});
      if (g.list.length === 1 && g.list[0].it.call) row.appendChild(el("div", {class:"n-call", text:brk(g.list[0].it.call)}));
      var chips = el("div", {class:"chips"}, [
        el("button", {class:"chip file", text:brk(g.path), title:"파일 설명 보기", onclick:function(){ selectFile(g.path); }})
      ]);
      g.list.forEach(function(x){
        chips.appendChild(el("button", {class:"chip " + (x.it.snippet ? "snip" : "fn"), text:x.it.label, title:(x.it.call ? x.it.call + " — " : "") + "코드 보기",
          onclick:function(){ selectNode(n.id, x.i); }}));
      });
      row.appendChild(chips);
      items.appendChild(row);
    });
    node.appendChild(items);
    return node;
  }

  function rectIn(elm, host){
    var a = elm.getBoundingClientRect(), h = host.getBoundingClientRect();
    return {l:a.left-h.left, r:a.right-h.left, t:a.top-h.top, b:a.bottom-h.top, cx:(a.left+a.right)/2-h.left, cy:(a.top+a.bottom)/2-h.top};
  }
  var raf = 0;
  function scheduleEdges(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(drawEdges); }
  function drawEdges(){
    var stage = $("stage"), svg = $("edges"), sc = scen();
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){ p.remove(); });
    Array.prototype.slice.call(stage.querySelectorAll(".elabel")).forEach(function(p){ p.remove(); });
    var svgNS = "http://www.w3.org/2000/svg";
    sc.edges.forEach(function(e){
      var a = nodeById(e.from), b = nodeById(e.to);
      var ea = nodeEls[e.from], eb = nodeEls[e.to]; if (!ea || !eb) return;
      var ra = rectIn(ea, stage), rb = rectIn(eb, stage), d, lx, ly;
      if (a.col === b.col){
        if (b.row - a.row <= 1){
          d = "M" + ra.cx + " " + ra.b + " V" + rb.t; lx = ra.cx; ly = (ra.b + rb.t) / 2;
        } else {
          var x = Math.min(ra.l, rb.l) - 30;
          d = "M" + ra.l + " " + ra.cy + " H" + x + " V" + rb.cy + " H" + rb.l; lx = x; ly = (ra.cy + rb.cy) / 2;
        }
      } else {
        var dir = b.col > a.col ? 1 : -1;
        var x1 = dir > 0 ? ra.r : ra.l, x2 = dir > 0 ? rb.l : rb.r;
        var xm = x2 - dir * 30;
        d = "M" + x1 + " " + ra.cy + " H" + xm + " V" + rb.cy + " H" + x2;
        lx = (x1 + x2) / 2; ly = ra.cy;
      }
      var kind = e.kind === "call" ? "call" : "flow";
      var p = document.createElementNS(svgNS, "path");
      p.setAttribute("d", d); p.setAttribute("class", "e " + kind);
      p.setAttribute("marker-end", "url(#" + (kind === "call" ? "ahc" : "ah") + ")");
      p.setAttribute("data-from", e.from); p.setAttribute("data-to", e.to);
      svg.appendChild(p);
      if (e.label && kind === "flow"){
        var lab = el("span", {class:"elabel", text:e.label});
        lab.style.left = lx + "px"; lab.style.top = ly + "px";
        stage.appendChild(lab);
      }
    });
    svg.setAttribute("width", stage.scrollWidth); svg.setAttribute("height", stage.scrollHeight);
    refreshSelection();
  }

  function refreshSelection(){
    Object.keys(nodeEls).forEach(function(id){ nodeEls[id].setAttribute("aria-pressed", String(id === state.node)); });
    var svg = $("edges"); if (!svg) return;
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){
      var on = state.node && (p.getAttribute("data-from") === state.node || p.getAttribute("data-to") === state.node);
      p.classList.toggle("active", !!on);
    });
  }
  function scrollToNode(id){
    var n = nodeEls[id]; if (n && n.scrollIntoView) n.scrollIntoView({block:"center", inline:"center", behavior:"smooth"});
  }

  /* ---------- 단계 이동 / 탭 ---------- */
  function stepIndex(){ return scen().steps.indexOf(state.node); }
  function updateStepper(){
    var steps = scen().steps, i = stepIndex();
    $("stepNo").textContent = i < 0 ? "– / " + steps.length : (i + 1) + " / " + steps.length;
    $("prev").disabled = i <= 0 && state.node !== null ? true : false;
    $("next").disabled = i >= steps.length - 1;
    if (state.node === null){ $("prev").disabled = true; $("next").disabled = false; }
  }
  function go(delta){
    var steps = scen().steps, i = stepIndex();
    var j = i < 0 ? 0 : Math.max(0, Math.min(steps.length - 1, i + delta));
    selectNode(steps[j], 0); scrollToNode(steps[j]);
  }
  function renderTabs(){
    var t = $("tabs"); t.textContent = "";
    D.scenarios.forEach(function(sc, i){
      t.appendChild(el("button", {class:"tab", role:"tab", "aria-selected":String(i === state.sc), text:sc.name, onclick:function(){ switchScenario(i); }}));
    });
  }
  function switchScenario(i){
    state.sc = i; state.node = null; state.file = null;
    renderTabs(); renderStage(); showHint(); updateStepper();
    try { history.replaceState(null, "", "#" + D.scenarios[i].id); } catch(e){}
  }

  /* ---------- 시작 ---------- */
  document.title = D.title + " — 코드 흐름도";
  $("title").textContent = D.title + " · 코드 흐름도";
  $("subtitle").textContent = D.subtitle;
  $("mdlink").setAttribute("href", D.mdFile);
  $("prev").addEventListener("click", function(){ go(-1); });
  $("next").addEventListener("click", function(){ go(1); });
  $("pClose").addEventListener("click", closePanel);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closePanel(); });
  $("theme").addEventListener("click", function(){
    var r = document.documentElement, cur = r.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  });
  window.addEventListener("resize", scheduleEdges);
  if (window.ResizeObserver) new ResizeObserver(scheduleEdges).observe($("stage"));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleEdges);

  var startId = (location.hash || "").replace("#", "");
  var startIdx = 0; D.scenarios.forEach(function(s, i){ if (s.id === startId) startIdx = i; });
  switchScenario(startIdx);
  // 화면 확인/테스트용 지름길: window.__flow.select("s7")
  window.__flow = { select: function(id, i){ selectNode(id, i || 0); }, file: selectFile, state: state };
})();
</script>
</body>
