# login-watchdog Docker 실습망의 진입점
# 외부 요청은 gateway만 받고 Flask 앱은 core 네트워크에서만 접근한다.

# 연결 용량(guide57). 예전에는 worker_processes가 없어 1개, worker_connections 1024였다. 프록시는 손님 연결 하나에
# 앱 쪽 연결 하나를 더 쓰므로 실제로는 약 512명분이라, IP별 30개 제한을 지키는 공격 상자 17개만으로도 정문이
# 가득 찼다. CPU 수만큼 worker를 띄우고 worker당 4096개로 늘린다. 파일 핸들 한도도 그만큼 올린다.
worker_processes auto;
worker_rlimit_nofile 16384;

events {
    worker_connections 4096;
}

http {
    # 출발지 IP별 동시 접속 수를 센다. 연결을 열어 놓고 아주 천천히 보내는 공격(Slowloris)은 SYN이
    # 거의 없고 포트도 하나라 L4 측정기에 걸리지 않으므로, 정문에서 직접 한 IP의 몫을 제한한다.
    limit_conn_zone $binary_remote_addr zone=lw_perip:10m;
    # 서버 전체 동시 연결 상한(guide57). 출발지를 바꿔 가며 연결을 붙잡는 공격이 worker를 다 채우기 전에
    # 429로 끊어, 정문 프로세스 자체가 새 연결을 못 받는 상태는 피한다.
    limit_conn_zone $server_name zone=lw_total:1m;

    # 쉬고 있는 keep-alive 연결이 자리를 오래 차지하지 않게 한다(기본 75초). 브라우저는 15초면 충분하다.
    keepalive_timeout 15s;
    # 시간이 다 된 연결은 FIN 대신 RST로 바로 끊어 커널 쪽 소켓 자원도 곧바로 돌려받는다.
    reset_timedout_connection on;

    server {
        listen 8080;
        server_name _;

        # 한 IP가 동시에 쓸 수 있는 연결은 30개까지(전체 상한 3000의 1%). 브라우저 한 대는
        # 보통 6개 안팎을 쓰므로 정상 사용에는 충분하고, 초과분은 429로 즉시 거절한다.
        limit_conn lw_perip 30;
        limit_conn lw_total 3000;
        limit_conn_status 429;

        # 헤더·본문을 느리게 보내며 연결을 붙잡는 시간을 줄인다(기본 60초). 요청 하나가 10초 안에
        # 도착하지 못하면 연결을 끊는다. proxy_read_timeout 등 앱 응답 대기 시간은 그대로 둔다.
        client_header_timeout 10s;
        client_body_timeout 10s;
        send_timeout 15s;

        # 센서·차단 프로그램 전용 내부 API는 바깥(edge, 공격 상자)에서 닿지 않게 한다.
        # shipper·fw-agent는 core 망에서 app:5000으로 바로 부르므로 이 차단의 영향을 받지 않는다.
        # 서명(HMAC)이 있어도 위조 요청이 수집 한도를 갉아먹을 수 있어서 입구에서 먼저 끊는다(강사 피드백 1).
        location ^~ /api/internal/ {
            return 404;
        }

        location / {
            proxy_pass http://app:5000;
            proxy_http_version 1.1;

            # Flask 앱에 원래 요청 정보를 전달한다.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # 사용자가 보낸 값을 이어 붙이지 않고 실제 연결 IP로 덮어쓴다.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}