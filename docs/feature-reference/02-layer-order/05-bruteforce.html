<title>5. 브루트포스 탐지 + 자동 IP 잠금 — 코드 흐름도</title>
<style>

    --border:#d9e0da; --accent:#0f6f66; --accent-soft:#e2ede9; --danger:#bf3b2b; --danger-soft:#f8e6e2;
    --edge:#7b8a82; --edge-call:#8a97a0;
    --k-screen:#767f78; --k-screen-soft:#eef0ee;
    --k-route:#2f5fd6;  --k-route-soft:#e7edfb;
    --k-helper:#b56b0c; --k-helper-soft:#f7ecd9;
    --k-db:#7a4fce;     --k-db-soft:#efe8fa;
    --k-config:#0f6f66; --k-config-soft:#e2ede9;
    --k-later:#9aa39d;  --k-later-soft:#f4f6f3;
    --code-bg:#fbfcfb; --code-hl:#fff3c4; --code-hl-bar:#e0a800; --code-gutter:#8a978f;
    --c-comment:#6b7d73; --c-str:#a1470f; --c-kw:#7a3fc0; --c-fn:#1f5fd0; --c-num:#0b7a6c; --c-deco:#b0306e;
    --shadow:0 1px 2px rgba(18,32,28,.06), 0 6px 20px rgba(18,32,28,.07);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
      --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
      --edge:#6f8178; --edge-call:#5d6f67;
      --k-screen:#9aa39d; --k-screen-soft:#1a221e;
      --k-route:#7fa2f2;  --k-route-soft:#182236;
      --k-helper:#e8a94c; --k-helper-soft:#31260f;
      --k-db:#b49bee;     --k-db-soft:#241c34;
      --k-config:#4fc9b8; --k-config-soft:#17332d;
      --k-later:#6b7a72;  --k-later-soft:#111a16;
      --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
      --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
    --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
    --edge:#6f8178; --edge-call:#5d6f67;
    --k-screen:#9aa39d; --k-screen-soft:#1a221e;
    --k-route:#7fa2f2;  --k-route-soft:#182236;
    --k-helper:#e8a94c; --k-helper-soft:#31260f;
    --k-db:#b49bee;     --k-db-soft:#241c34;
    --k-config:#4fc9b8; --k-config-soft:#17332d;
    --k-later:#6b7a72;  --k-later-soft:#111a16;
    --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
    --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
  button{font:inherit;color:inherit;cursor:pointer}
  code,.mono{font-family:var(--mono)}

  .app{display:flex;height:100vh;min-height:0}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{padding:14px 20px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
  .top h1{margin:0;font-size:19px;letter-spacing:-.01em}
  .top .sub{margin:2px 0 0;color:var(--ink-muted);font-size:13px}
  .top-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
  .tabs{display:flex;gap:6px}
  .tab{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:5px 14px;font-weight:600}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .tab[aria-selected="true"]{color:#06201b}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#06201b}}
  .spacer{flex:1}
  .btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:default}
  .stepper{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-muted)}
  .stepper b{color:var(--ink);min-width:42px;text-align:center}
  a.link{color:var(--accent);text-decoration:none;font-size:13px}
  a.link:hover{text-decoration:underline}

  .intro{margin:0;padding:10px 20px;color:var(--ink-muted);font-size:13px;border-bottom:1px solid var(--border);background:var(--surface-2)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 20px;font-size:12px;color:var(--ink-muted);border-bottom:1px solid var(--border)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .stage-wrap{flex:1;min-height:0;overflow:auto}
  .stage{position:relative;display:grid;gap:26px 46px;padding:22px 22px 60px;width:max-content;min-width:100%}
  .edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .edges path{fill:none;stroke:var(--edge);stroke-width:1.6}
  .edges path.call{stroke:var(--edge-call);stroke-dasharray:5 4}
  .edges path.active{stroke:var(--accent);stroke-width:2.4;stroke-dasharray:none}
  .edges .head{fill:var(--edge)}
  .edges .head-call{fill:var(--edge-call)}
  .elabel{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;
    background:var(--surface);border:1px solid var(--border);color:var(--ink-muted);white-space:nowrap;pointer-events:none}

  .colhead{font-size:12px;font-weight:700;color:var(--ink-muted);text-transform:none;border-bottom:2px solid var(--border);padding-bottom:6px;align-self:end}
  .cell{display:flex;flex-direction:column;gap:12px;align-self:center;justify-content:center;position:relative;z-index:1}

  .node{--k:var(--k-route);--ks:var(--k-route-soft);position:relative;background:var(--surface);border:1px solid var(--border);
    border-left:5px solid var(--k);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .08s, border-color .12s}
  .node:hover{transform:translateY(-1px);border-color:var(--k)}
  .node:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .node[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
  .node.screen{--k:var(--k-screen);--ks:var(--k-screen-soft)}
  .node.route{--k:var(--k-route);--ks:var(--k-route-soft)}
  .node.helper{--k:var(--k-helper);--ks:var(--k-helper-soft)}
  .node.db{--k:var(--k-db);--ks:var(--k-db-soft)}
  .node.config{--k:var(--k-config);--ks:var(--k-config-soft)}
  .node.later{--k:var(--k-later);--ks:var(--k-later-soft);background:var(--k-later-soft);box-shadow:none;border-style:dashed;border-left-style:solid;padding:8px 10px}
  .n-title{font-weight:700;font-size:13.5px;letter-spacing:-.01em}
  .n-plain{margin-top:3px;color:var(--ink-muted);font-size:12.5px}
  .n-reject{margin-top:6px;font-size:12px;color:var(--danger);background:var(--danger-soft);border-radius:6px;padding:3px 8px}
  .n-reject::before{content:"막히면 → ";font-weight:700}
  .n-items{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .n-item{display:flex;flex-direction:column;gap:3px}
  .n-call{overflow-wrap:anywhere;font-family:var(--mono);font-size:11.5px;color:var(--k);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{max-width:100%;text-align:left;overflow-wrap:anywhere;border:1px solid var(--border);background:var(--ks);color:var(--ink);border-radius:6px;padding:1px 7px;font-family:var(--mono);font-size:11px}
  .chip:hover{border-color:var(--k);color:var(--k)}
  .chip.file::before{content:"📄 "}
  .chip.fn::before{content:"ƒ ";color:var(--k);font-weight:700}
  .chip.snip::before{content:"▤ ";color:var(--k);font-weight:700}
  .tag-later{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--ink-muted);border:1px solid var(--border);border-radius:999px;padding:0 7px;background:var(--surface)}

  /* 코드 패널 */
  .panel{width:440px;flex:none;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
  .p-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
  .p-head h2{margin:0;font-size:15.5px;letter-spacing:-.01em}
  .p-head p{margin:4px 0 0;color:var(--ink-muted);font-size:13px}
  .p-close{display:none}
  .p-body{flex:1;min-height:0;overflow:auto;padding:12px 16px 24px}
  .hint{color:var(--ink-muted);font-size:13px}
  .hint li{margin:4px 0}
  .itabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .itab{border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:2px 9px;font-family:var(--mono);font-size:12px}
  .itab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .fileline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
  .fileline .path{font-family:var(--mono);font-size:12.5px;font-weight:700}
  .fileline .lines{font-family:var(--mono);font-size:12px;color:var(--ink-muted)}
  .alias{border:1px solid var(--border);background:var(--k-db-soft);border-radius:8px;padding:8px 10px;margin:0 0 10px;font-size:12.5px}
  .alias .route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px;font-family:var(--mono);font-size:12px}
  .alias .route span.step{padding:1px 7px;border-radius:6px;border:1px solid var(--border);background:var(--surface)}
  .alias .route span.real{border-color:var(--k-db);color:var(--k-db);font-weight:700}
  .alias .arrow{color:var(--ink-muted)}
  .codebox{border:1px solid var(--border);border-radius:8px;background:var(--code-bg);overflow:auto;max-height:62vh}
  table.code{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.2px;line-height:1.6}
  table.code td{padding:0 10px;vertical-align:top;white-space:pre}
  table.code td.ln{position:sticky;left:0;text-align:right;color:var(--code-gutter);user-select:none;background:var(--code-bg);border-right:1px solid var(--border);min-width:44px;padding-right:8px}
  table.code tr.hl td{background:var(--code-hl)}
  table.code tr.hl td.ln{background:var(--code-hl);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--code-hl-bar)}
  .t-c{color:var(--c-comment);font-style:italic}.t-d{color:var(--c-comment)}.t-s{color:var(--c-str)}.t-k{color:var(--c-kw);font-weight:600}
  .t-f{color:var(--c-fn)}.t-n{color:var(--c-num)}.t-a{color:var(--c-deco)}
  .legend-hl{margin:8px 0 0;font-size:12px;color:var(--ink-muted)}
  .legend-hl b{background:var(--code-hl);color:var(--ink);padding:0 6px;border-radius:4px}
  .flist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
  .flist button{width:100%;text-align:left;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:6px 10px}
  .flist button:hover{border-color:var(--accent)}
  .flist small{display:block;color:var(--ink-muted)}
  details.hdr{margin-top:12px;font-size:13px}
  details.hdr pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px;font-family:var(--sans);font-size:12.5px;color:var(--ink-muted)}

  @media (max-width:900px){
    .app{display:block;height:auto}
    .stage-wrap{max-height:none;overflow-x:auto}
    .panel{position:fixed;left:0;right:0;bottom:0;width:auto;height:62vh;border-left:0;border-top:2px solid var(--accent);
      box-shadow:0 -10px 30px rgba(0,0,0,.25);z-index:20;transform:translateY(105%);transition:transform .18s}
    body.open .panel{transform:none}
    .p-close{display:inline-block;position:absolute;right:12px;top:10px}
    .p-head{position:relative;padding-right:70px}
    .top{padding:12px 16px 8px}
    .stage{padding:16px 16px 70vh}
  }
  @media (prefers-reduced-motion: reduce){.node,.panel{transition:none}}
</style>
</head>

ount_lockouts 표에 저장합니다.", "reject": "", "later": "", "items": [{"block": "db/account_lockouts.py:create_account_lockout", "hl": null, "label": "create_account_lockout()", "call": "db.create_account_lockout()", "snippet": false}]}, {"id": "account_n11", "col": 1, "row": 4, "kind": "route", "title": "④ Slack 알림", "plain": "계정 이름·실패 횟수·시도한 IP 개수를 담아 보냅니다.", "reject": "", "later": "", "items": [{"block": "security/soar/lockouts.py:enforce_account_lockout", "hl": [76, 77], "label": "enforce_account_lockout()", "call": "soar.enforce_account_lockout()", "snippet": false}]}, {"id": "account_n12", "col": 2, "row": 4, "kind": "helper", "title": "계정 잠금 알림", "plain": "Slack으로 전송합니다.", "reject": "", "later": "", "items": [{"block": "notify/alert.py:send_account_lockout_alert", "hl": null, "label": "send_account_lockout_alert()", "call": null, "snippet": false}]}, {"id": "account_n13", "col": 1, "row": 5, "kind": "route", "title": "⑤ CRITICAL 이벤트 + 잠금 이력", "plain": "DISTRIBUTED_BRUTE_FORCE 로 기록하고, 계정 영구 승격 판단도 거칩니다.", "reject": "", "later": "", "items": [{"block": "security/soar/lockouts.py:enforce_account_lockout", "hl": [79, 90], "label": "enforce_account_lockout()", "call": "soar.enforce_account_lockout()", "snippet": false}]}, {"id": "account_n14", "col": 2, "row": 5, "kind": "later", "title": "보안 이벤트 기록", "plain": "상관분석 훅까지 호출합니다.", "reject": "", "later": "8단원", "items": [{"block": "security/soar/_events.py:_record_event", "hl": null, "label": "_record_event()", "call": null, "snippet": false}]}, {"id": "account_n15", "col": 2, "row": 5, "kind": "later", "title": "이력 · 영구 승격", "plain": "계정 영구 잠금 판단(16단원).", "reject": "", "later": "16단원", "items": [{"block": "security/lockdown.py:after_temporary_lock", "hl": null, "label": "after_temporary_lock()", "call": null, "snippet": false}]}], "edges": [{"from": "account_n1", "to": "account_n2", "label": "", "kind": "flow"}, {"from": "account_n2", "to": "account_n3", "label": "", "kind": "call"}, {"from": "account_n3", "to": "account_n4", "label": "", "kind": "call"}, {"from": "account_n2", "to": "account_n5", "label": "", "kind": "call"}, {"from": "account_n2", "to": "account_n6", "label": "", "kind": "flow"}, {"from": "account_n6", "to": "account_n7", "label": "", "kind": "call"}, {"from": "account_n7", "to": "account_n8", "label": "", "kind": "call"}, {"from": "account_n6", "to": "account_n9", "label": "", "kind": "flow"}, {"from": "account_n9", "to": "account_n10", "label": "", "kind": "call"}, {"from": "account_n9", "to": "account_n11", "label": "", "kind": "flow"}, {"from": "account_n11", "to": "account_n12", "label": "", "kind": "call"}, {"from": "account_n11", "to": "account_n13", "label": "", "kind": "flow"}, {"from": "account_n13", "to": "account_n14", "label": "", "kind": "call"}, {"from": "account_n13", "to": "account_n15", "label": "", "kind": "call"}], "steps": ["account_n1", "account_n2", "account_n6", "account_n9", "account_n11", "account_n13"]}], "blocks": {"routes/auth.py:login_submit": {"path": "routes/auth.py", "start": 196, "end": 315, "lang": "python", "code": "@auth_bp.route(\"/login\", methods=[\"POST\"])\ndef login_submit():\n    \"\"\"로그인 폼 제출을 처리한다. 이 함수 하나가 이 프로젝트의 핵심 흐름을 담당한다.\n\n    처리 순서:\n    1. 혹시 자동으로 풀어줘야 할 만료된 잠금(IP 단위 + 계정 단위)이 있으면 먼저 정리한다.\n    2. 이번 요청을 보낸 IP와 입력된 아이디를 알아낸다.\n    3. 이 IP가 지금 잠긴 상태이거나, 이 계정 자체가 (다른 IP들이 나눠서 공격해서)\n       잠긴 상태라면 아이디/비밀번호를 확인하지도 않고 곧바로 거부한다. 단, 영구 잠금된\n       IP는 이메일 복구로 예외를 받은 \"본인 + 본인 기기\"만 통과시킨다(guide33/34-a).\n    4. 잠긴 상태가 아니라면 실제로 아이디/비밀번호를 확인하고, 그 시도를 기록한다.\n    5. 실패했다면 \"혹시 이 IP가 수상한 수준(5회 초과)이 됐는지\"를 먼저 보고,\n       아니라면 \"혹시 이 계정이 여러 IP에 걸쳐 총합으로 수상한 수준(8회 초과)이\n       됐는지\"도 본다 — 전자는 soar.enforce_lockout(IP 잠금), 후자는\n       soar.enforce_account_lockout(계정 잠금)이 알림까지 같이 보낸다\n       (L7 공격 보강 계획 Tier 1: 분산/저속 브루트포스 대응). 둘 다 아직 기준치 아래지만\n       코앞이면 LLM 조기 경보를 판단한다(guide31).\n    6. 성공했다면 회원 세션을 만들어서 회원 대시보드로 이동시킨다(12단계에서 추가).\n    \"\"\"\n    # 1) 시간이 지나 자동으로 풀려야 할 잠금들을 정리 (IP 단위 + 계정 단위)\n    soar.try_release_expired_lockouts()\n    soar.try_release_expired_account_lockouts()\n\n    ip = get_request_ip()\n    username = request.form.get(\"username\", \"\")\n    password = request.form.get(\"password\", \"\")\n\n    # 허니팟 필드가 채워져 있으면 사람이 아니라 자동화 스크립트라고 보고,\n    # 자격 증명 확인/시도 기록 없이 즉시 거부한다 (L7 공격 보강 계획 Tier 3).\n    if is_bot_submission():\n        soar.notify_bot_detected(ip, request.path)\n        flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n        return render_template(\"login_form.html\", form_action=url_for(\"auth.login_submit\"))\n\n    # 2) 이미 잠긴 IP이거나, 이미 잠긴 계정이라면 검증 자체를 건너뛰고 즉시 거부\n    #    — 단, 영구 잠금된 IP는 \"이메일 복구로 예외를 받은 본인+본인 기기\"만 통과시킨다(guide33).\n    exemption = None\n    if detector.is_locked(ip):\n        if detector.get_ip_lock_state(ip) != detector.LOCK_STATE_PERMANENT:\n            flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n            return _login_form()\n        exemption = _find_ip_exemption(ip, username)\n        if exemption is None:\n            flash(\"이 네트워크는 차단되어 있습니다. 본인이라면 아래 '본인 인증으로 접속 허용'을 이용해주세요.\")\n            return _login_form(recovery_link=True)\n        # 예외가 있으면 IP 잠금 안내 없이 아래 계정 잠금 확인과 정상적인 비밀번호 확인으로 계속 진행한다.\n\n    if detector.is_account_locked(username):\n        flash(ACCOUNT_LOCKED_MESSAGE)\n        return _login_form(recovery_link=True)\n\n    success = db.verify_user_credentials(username, password)\n    db.log_attempt(ip, username, success)\n\n    if success:\n        # 관리자 세션(\"admin_username\")과는 완전히 다른 키(\"username\")를 쓴다 —\n        # 그래야 같은 브라우저에서 관리자 세션이 있더라도 서로 섞이지 않는다.\n        # user_id도 같이 저장해두는 이유는 member_login_required 문지기 뒤에서\n        # \"아이디\"가 아니라 변하지 않는 \"번호\"로 본인 행을 정확히 찾기 위해서다.\n        user = db.get_user_by_username(username)\n        session[\"username\"] = username\n        session[\"user_id\"] = user[\"id\"]\n        # 세션 세대 번호 — 나중에 비밀번호가 바뀌면 이 세션을 끊는 데 쓴다(guide35).\n        session[\"session_version\"] = user.get(\"session_version\") or 0\n        return redirect(url_for(\"member.member_dashboard\"))\n\n    # 영구 잠금 예외로 통과한 사용자가 연달아 실패하면 그 예외를 회수한다 — 예외는 \"본인이\n    # 비밀번호를 아는 상황\"을 전제로 한 출입증이라, 계속 틀리는 건 도용 신호로 본다.\n    # (예외 통과자의 실패는 IP 임계값 판정으로 넘기지 않는다 — 이 IP는 이미 영구 잠금 중이라\n    # enforce_lockout()이 5분 잠금 알림을 또 보내는 일이 없도록 하기 위해서다.)\n    if exemption is not None:\n        if db.count_recent_failures(ip) >= config.IP_EXEMPTION_MAX_FAILURES:\n            db.revoke_ip_exemption(exemption[\"id\"], \"예외 통과 후 연속 로그인 실패\")\n        flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n        return _login_form()\n\n    # 실패했다면, 먼저 이 IP가 방금 임계값을 넘었는지 확인한다.\n    suspicious, failure_count = detector.is_suspicious(ip)\n    if suspicious:\n        # 최근 실패에 쓰인 아이디가 몇 개였는지도 함께 세서, Slack 알림이 Brute\n        # Force(계정 1개 집중)와 Password Spraying(계정 여러 개 순회)을 구분해\n        # 표시할 수 있게 한다 (attack_response_state.md 구현 대상 #5).\n        distinct_usernames = detector.count_distinct_usernames(ip)\n        soar.enforce_lockout(ip, failure_count, distinct_usernames)\n        flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n    else:\n        # 아직 기준치(FAILURE_THRESHOLD)는 안 넘었지만 코앞이면, LLM에게 조기\n        # 경보 여부를 물어본다 (Track A, guide31). 공격자가 임계값을 살짝\n        # 피해 가려고 실패 횟수를 일부러 코앞에서 멈추는 패턴을 이 구간에서 잡는다.\n        if failure_count >= config.FAILURE_THRESHOLD - config.EARLY_WARNING_BAND:\n            distinct_usernames = detector.count_distinct_usernames(ip)\n            soar.consider_early_warning(\n                \"BRUTE_FORCE\", \"LOCK_IP\", \"ip\", ip, failure_count, config.FAILURE_THRESHOLD,\n                context_count=distinct_usernames,\n            )\n\n        # IP 단위로는 아직 수상하지 않더라도, 이 계정이 여러 IP에 걸쳐 나뉘어서\n        # 총합 기준으로 수상한 수준이 됐는지 확인한다 — 공격자가 IP를 돌려가며\n        # (봇넷/프록시 로테이션) 한 계정만 노리는 분산 브루트포스를 잡아낸다.\n        account_suspicious, account_failure_count = detector.is_account_suspicious(username)\n        if account_suspicious:\n            distinct_ips = detector.count_distinct_ips_by_username(username)\n            soar.enforce_account_lockout(username, account_failure_count, distinct_ips, ip)\n            flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n        else:\n            # 이 계정도 마찬가지로 임계값(ACCOUNT_FAILURE_THRESHOLD) 코앞이면\n            # 조기 경보 대상이다 — 여러 IP에 나눠 시도하되 각 IP·계정 총합\n            # 모두를 임계값 아래로 유지하려는 패턴을 잡아낸다.\n            if account_failure_count >= config.ACCOUNT_FAILURE_THRESHOLD - config.EARLY_WARNING_BAND:\n                distinct_ips = detector.count_distinct_ips_by_username(username)\n                soar.consider_early_warning(\n                    \"DISTRIBUTED_BRUTE_FORCE\", \"LOCK_ACCOUNT\", \"account\", username,\n                    account_failure_count, config.ACCOUNT_FAILURE_THRESHOLD,\n                    context_count=distinct_ips, context_ip=ip,\n                )\n            # 사용자 존재 여부(아이디가 없는지, 비밀번호만 틀렸는지)를 구분해서\n            # 알려주면 공격자에게 힌트를 주게 되므로, 항상 똑같은 문구로만 실패를 알린다.\n            flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n\n    return render_template(\"login_form.html\", form_action=url_for(\"auth.login_submit\"))", "alias": null}, "security/detector.py:is_locked": {"path": "security/detector.py", "start": 212, "end": 219, "lang": "python", "code": "def is_locked(ip: str) -> bool:\n    \"\"\"이 IP가 지금 이 순간 잠긴 상태인지 True/False로 알려준다.\n\n    실제 \"잠겨있는지\" 판단은 db.get_active_lockout()이 이미 하고 있으므로\n    (active=True 이면서 아직 풀릴 시각이 안 지난 것만 찾아줌),\n    여기서는 그 결과가 있는지(None이 아닌지)만 확인한다.\n    \"\"\"\n    return db.get_active_lockout(ip) is not None", "alias": null}, "db/lockouts.py:get_active_lockout": {"path": "db/lockouts.py", "start": 176, "end": 198, "lang": "python", "code": "def get_active_lockout(ip: str) -> dict | None:\n    \"\"\"이 IP가 \"지금 이 순간\" 실제로 잠겨있는지 확인하고, 잠겨있다면 그 잠금 정보를 돌려준다.\n\n    조건이 두 가지 다 맞아야 \"진짜로 잠긴 상태\"로 인정한다:\n    - active가 True (아직 해제되지 않았고)\n    - 영구 잠금(lock_type='PERMANENT', unlock_at이 NULL)이거나, unlock_at(풀리는\n      시각)이 지금보다 미래 (아직 시간이 안 지났고)\n\n    unlock_at만 보면 영구 잠금(NULL)이 \"안 잠김\"으로 판정되므로 or_ 조건이 필수다(guide33).\n\n    두 조건을 만족하는 기록이 없으면 None(없음)을 돌려준다.\n    \"\"\"\n    res = (\n        db.get_client()\n        .table(\"lockouts\")\n        .select(\"*\")\n        .eq(\"ip_address\", ip)\n        .eq(\"active\", True)\n        .or_(f\"lock_type.eq.PERMANENT,unlock_at.gt.{db._now_iso()}\")  # gt = \"~보다 미래\"\n        .limit(1)\n        .execute()\n    )\n    return res.data[0] if res.data else None  # 결과가 있으면 첫 번째 줄, 없으면 None", "alias": {"call": "db.get_active_lockout()", "via": "db/__init__.py", "real": "db/lockouts.py"}}, "security/detector.py:get_ip_lock_state": {"path": "security/detector.py", "start": 241, "end": 243, "lang": "python", "code": "def get_ip_lock_state(ip: str) -> str:\n    \"\"\"이 IP의 잠금 상태를 NONE / TEMPORARY / PERMANENT 중 하나로 알려준다.\"\"\"\n    return _state_from_row(db.get_active_lockout(ip))", "alias": null}, "security/detector.py:is_account_locked": {"path": "security/detector.py", "start": 73, "end": 79, "lang": "python", "code": "def is_account_locked(username: str) -> bool:\n    \"\"\"이 계정이 지금 이 순간 잠긴 상태인지 True/False로 알려준다.\n\n    is_locked(ip)의 계정 버전 — db.get_active_account_lockout()의 결과가\n    있는지(None이 아닌지)만 확인한다.\n    \"\"\"\n    return db.get_active_account_lockout(username) is not None", "alias": null}, "db/account_lockouts.py:get_active_account_lockout": {"path": "db/account_lockouts.py", "start": 147, "end": 163, "lang": "python", "code": "def get_active_account_lockout(username: str) -> dict | None:\n    \"\"\"이 계정이 \"지금 이 순간\" 실제로 잠겨있는지 확인하고, 잠겨있다면 그 잠금 정보를 돌려준다.\n\n    db.get_active_lockout()과 동일한 두 조건(active=True, 그리고 영구 잠금이거나\n    unlock_at이 미래)을 본다.\n    \"\"\"\n    res = (\n        db.get_client()\n        .table(\"account_lockouts\")\n        .select(\"*\")\n        .eq(\"username\", username)\n        .eq(\"active\", True)\n        .or_(f\"lock_type.eq.PERMANENT,unlock_at.gt.{db._now_iso()}\")\n        .limit(1)\n        .execute()\n    )\n    return res.data[0] if res.data else None", "alias": {"call": "db.get_active_account_lockout()", "via": "db/__init__.py", "real": "db/account_lockouts.py"}}, "db/users.py:verify_user_credentials": {"path": "db/users.py", "start": 73, "end": 90, "lang": "python", "code": "def verify_user_credentials(username: str, password: str) -> bool:\n    \"\"\"사용자가 로그인 화면에 입력한 아이디/비밀번호가 맞는지 확인한다.\n\n    동작 원리는 verify_admin_credentials와 동일 — 저장된 암호문과\n    \"지금 입력한 비밀번호를 암호화한 결과\"가 일치하는지만 비교한다.\n\n    타이밍 사이드채널 방지 (L7 공격 보강 계획 Tier 3): 예전에는 아이디가 없으면\n    check_password_hash()를 아예 건너뛰고 바로 False를 돌려줬다. 이 해시 비교는\n    일부러 느리게 설계된 연산이라, \"즉시 반환(아이디 없음)\"과 \"해시 비교 후\n    반환(비밀번호만 틀림)\" 사이에 응답 시간 차이가 생겨 공격자가 그 차이만으로\n    \"이 아이디가 존재하는가\"를 추측할 수 있었다(화면 메시지는 이미 통일돼\n    있었지만 타이밍까지는 못 가렸다). 아이디가 없을 때도 미리 만들어둔 더미\n    해시로 항상 같은 비교 연산을 거치게 해서 응답 시간을 균일화한다.\n    \"\"\"\n    user = get_user_by_username(username)\n    password_hash = user[\"password_hash\"] if user else _DUMMY_PASSWORD_HASH\n    result = check_password_hash(password_hash, password)\n    return result if user else False", "alias": {"call": "db.verify_user_credentials()", "via": "db/__init__.py", "real": "db/users.py"}}, "db/attempts.py:log_attempt": {"path": "db/attempts.py", "start": 19, "end": 26, "lang": "python", "code": "def log_attempt(ip: str, username: str, success: bool) -> None:\n    \"\"\"로그인 시도 한 건을 login_attempts 표에 새 줄로 저장한다.\n\n    CCTV처럼 \"누가 지나갔다\"는 기록을 계속 쌓기만 하고, 절대 지우거나 덮어쓰지 않는다.\n    \"\"\"\n    db.get_client().table(\"login_attempts\").insert(\n        {\"ip_address\": ip, \"username\": username, \"success\": success}\n    ).execute()", "alias": {"call": "db.log_attempt()", "via": "db/__init__.py", "real": "db/attempts.py"}}, "security/detector.py:is_suspicious": {"path": "security/detector.py", "start": 27, "end": 38, "lang": "python", "code": "def is_suspicious(ip: str) -> tuple[bool, int]:\n    \"\"\"이 IP가 \"수상한 상태\"인지 판단한다.\n\n    판단 기준: 최근 60초(config.DETECTION_WINDOW_SECONDS) 안에 실패한 횟수가\n    기준치(FAILURE_THRESHOLD, 기본 5회)를 \"초과\"했는가?\n\n    반환값은 (수상한가?, 실제 실패 횟수) 형태의 튜플(값 2개를 한 번에 묶어서 돌려주는 것).\n    예: (True, 6)  → \"수상함, 지금까지 6번 실패했음\"\n        (False, 3) → \"아직 수상하지 않음, 3번 실패했음\"\n    \"\"\"\n    failure_count = db.count_recent_failures(ip)\n    return failure_count > FAILURE_THRESHOLD, failure_count", "alias": null}, "db/attempts.py:count_recent_failures": {"path": "db/attempts.py", "start": 29, "end": 47, "lang": "python", "code": "def count_recent_failures(ip: str, window_seconds: int = config.DETECTION_WINDOW_SECONDS) -> int:\n    \"\"\"이 IP가 최근 몇 초(기본 60초) 안에 몇 번이나 로그인에 실패했는지 센다.\n\n    동작 순서:\n    1. \"지금 시각 - 60초\"를 계산해서 \"이 시각 이후의 기록만 보겠다\"는 기준선을 만든다.\n    2. login_attempts 표에서 \"이 IP\" + \"실패(success=False)\" + \"기준선 이후\"인 줄만 골라\n       개수를 센다.\n    \"\"\"\n    cutoff = (datetime.now(timezone.utc) - timedelta(seconds=window_seconds)).isoformat()\n    res = (\n        db.get_client()\n        .table(\"login_attempts\")\n        .select(\"id\", count=\"exact\")   # 실제 내용은 필요없고 \"개수\"만 알면 되므로 id만 요청\n        .eq(\"ip_address\", ip)          # 조건 1: IP가 일치하는 것만\n        .eq(\"success\", False)          # 조건 2: 실패한 시도만\n        .gte(\"attempted_at\", cutoff)   # 조건 3: 기준 시각 이후에 일어난 것만\n        .execute()\n    )\n    return res.count or 0  # 만약 count가 없으면(None) 0으로 처리", "alias": {"call": "db.count_recent_failures()", "via": "db/__init__.py", "real": "db/attempts.py"}}, "config.py:17-19": {"path": "config.py", "start": 17, "end": 19, "lang": "python", "code": "FAILURE_THRESHOLD = int(os.environ.get(\"FAILURE_THRESHOLD\", 5))\nDETECTION_WINDOW_SECONDS = int(os.environ.get(\"DETECTION_WINDOW_SECONDS\", 60))\nLOCKOUT_DURATION_SECONDS = int(os.environ.get(\"LOCKOUT_DURATION_SECONDS\", 300))", "alias": null}, "security/detector.py:count_distinct_usernames": {"path": "security/detector.py", "start": 98, "end": 103, "lang": "python", "code": "def count_distinct_usernames(ip: str) -> int:\n    \"\"\"soar.enforce_lockout이 잠금 알림에 \"몇 개의 서로 다른 아이디가 관련됐는지\"\n    (Brute Force인지 Password Spraying인지) 표시할 수 있도록, db가 센 값을\n    그대로 전달한다. is_suspicious()와 마찬가지로 login_attempts를 본다.\n    \"\"\"\n    return db.count_recent_distinct_usernames(ip)", "alias": null}, "db/attempts.py:count_recent_distinct_usernames": {"path": "db/attempts.py", "start": 50, "end": 70, "lang": "python", "code": "def count_recent_distinct_usernames(ip: str, window_seconds: int = config.DETECTION_WINDOW_SECONDS) -> int:\n    \"\"\"이 IP가 최근 몇 초(기본 60초) 안에 몇 개의 서로 다른 아이디로 로그인\n    실패를 시도했는지 센다.\n\n    count_recent_failures()는 \"몇 번\" 두드렸는지만 알려주지만, 이 값은 \"몇 개의\n    서로 다른 문(아이디)\"을 두드렸는지를 알려준다 — 1개면 계정 하나를 노린\n    전형적인 Brute Force, 2개 이상이면 여러 계정을 돌아가며 시도하는 Password\n    Spraying으로 의심할 수 있다 (soar.enforce_lockout이 Slack 알림에 이 값을\n    함께 표시해서 두 패턴을 구분해준다).\n    \"\"\"\n    cutoff = (datetime.now(timezone.utc) - timedelta(seconds=window_seconds)).isoformat()\n    res = (\n        db.get_client()\n        .table(\"login_attempts\")\n        .select(\"username\")\n        .eq(\"ip_address\", ip)\n        .eq(\"success\", False)\n        .gte(\"attempted_at\", cutoff)\n        .execute()\n    )\n    return len({row[\"username\"] for row in res.data})", "alias": {"call": "db.count_recent_distinct_usernames()", "via": "db/__init__.py", "real": "db/attempts.py"}}, "security/soar/lockouts.py:enforce_lockout": {"path": "security/soar/lockouts.py", "start": 17, "end": 58, "lang": "python", "code": "def enforce_lockout(\n    ip: str, failure_count: int, distinct_usernames: int, is_admin: bool = False\n) -> None:\n    \"\"\"이 IP에 실제로 잠금을 걸고, 그 사실을 Slack으로 알리고, CRITICAL 이벤트로 기록한다.\n\n    네 단계로 이루어진다:\n    1. db.create_lockout()으로 \"이 IP는 지금부터 5분간 잠김\"을 데이터베이스에 저장\n    2. alert.send_lockout_alert()로 \"IP, 실패 횟수, 조치 내용\"을 담은 알림을 전송\n    3. _record_event()로 위험등급(CRITICAL)과 함께 security_events에 기록하고 상관분석 훅 호출\n       (security-risk-response-summary.md 5절 — 관리자 대시보드/이력 조회용)\n    4. lockdown.after_temporary_lock()으로 잠금 이력을 남기고 영구 잠금 승격 여부 판단(guide33)\n\n    알림을 \"잠그는 순간에 딱 한 번만\" 보내는 이유: 만약 잠긴 상태에서도 계속\n    로그인을 시도할 때마다 매번 알림을 보내면, 관리자가 알림 폭탄을 맞아 정작\n    중요한 알림을 놓치게 된다(이른바 \"알림 피로\"). 그래서 \"새로 잠기는 순간\"에만 알린다.\n\n    distinct_usernames는 detector.count_distinct_usernames()(또는 관리자용)가 센\n    \"이 IP가 최근에 시도한 서로 다른 아이디 개수\"다 — 1개면 계정 하나에 집중된\n    Brute Force, 2개 이상이면 여러 계정을 돌아가며 두드리는 Password Spraying으로\n    의심할 수 있으므로, notify/alert.py가 Slack 메시지에 이 값으로 패턴을 구분해 보여준다.\n\n    is_admin은 이 잠금이 /login이 아니라 /admin/login에서 발생했는지를 나타낸다 —\n    관리자 로그인 무차별 대입은 Brute Force/Password Spraying과 별도의 event_type으로\n    기록하고, notify/alert.py의 Slack 메시지에도 그대로 표시한다.\n    \"\"\"\n    db.create_lockout(ip, failure_count)\n    alert.send_lockout_alert(\n        ip, failure_count, datetime.now(timezone.utc), distinct_usernames, is_admin\n    )\n\n    if is_admin:\n        event_type = \"ADMIN_BRUTE_FORCE\"\n    elif distinct_usernames > 1:\n        event_type = \"PASSWORD_SPRAYING\"\n    else:\n        event_type = \"BRUTE_FORCE\"\n    _record_event(event_type, \"CRITICAL\", ip, None, failure_count, \"LOCKED\")\n\n    # 잠금 이력을 남기고, 최근 기간 안에 N번째 잠금이면 영구 잠금으로 승격한다\n    # (guide33, T1/T5). 임시 잠금 알림·이벤트 기록이 모두 끝난 뒤에 실행해서, 영구\n    # 잠금 이벤트(PERMANENT_LOCK)가 같은 사건의 \"그 다음 단계\"로 기록되게 한다.\n    lockdown.after_temporary_lock(\"ip\", ip, event_type, failure_count)", "alias": {"call": "soar.enforce_lockout()", "via": "security/soar/__init__.py", "real": "security/soar/lockouts.py"}}, "db/lockouts.py:create_lockout": {"path": "db/lockouts.py", "start": 27, "end": 61, "lang": "python", "code": "def create_lockout(\n    ip: str, failure_count: int, duration_seconds: int = config.LOCKOUT_DURATION_SECONDS\n) -> None:\n    \"\"\"이 IP를 지금부터 `duration_seconds`(기본 300초=5분) 동안 잠근다.\n\n    upsert(업서트)란 \"이미 그 IP의 잠금 기록이 있으면 덮어쓰고,\n    없으면 새로 만든다\"는 뜻의 합성어(update + insert)다.\n    같은 IP가 두 번 잠기는 것을 걱정하지 않고 그냥 호출하면 되도록 설계했다.\n\n    영구 잠금(guide33) 보호: 지금 active인 PERMANENT 행은 건드리지 않고 그대로 둔다 —\n    5분짜리 임시 잠금이 영구 잠금을 \"강등\"시키면 안 된다. 반대로 이미 풀린(active=False)\n    영구 행을 다시 임시로 잠글 때는 lock_type/recoverable/permanent_reason/promoted_at을\n    TEMPORARY 값으로 명시해서 덮어쓴다 — payload에 안 적으면 lock_type이 PERMANENT로\n    남은 채 unlock_at만 채워져서 lockouts_permanent_unlock_chk 제약에 걸린다.\n    \"\"\"\n    existing = get_lockout_row(ip)\n    if existing and existing.get(\"active\") and existing.get(\"lock_type\") == \"PERMANENT\":\n        return\n\n    now = datetime.now(timezone.utc)\n    unlock_at = now + timedelta(seconds=duration_seconds)  # \"풀려날 시각\" = 지금 + 5분\n    db.get_client().table(\"lockouts\").upsert(\n        {\n            \"ip_address\": ip,\n            \"locked_at\": now.isoformat(),\n            \"unlock_at\": unlock_at.isoformat(),\n            \"failure_count\": failure_count,  # 몇 번 실패해서 잠겼는지 같이 기록\n            \"active\": True,                  # \"지금 잠긴 상태다\"라는 표시\n            \"lock_type\": \"TEMPORARY\",\n            \"recoverable\": \"EXEMPTION\",\n            \"permanent_reason\": None,\n            \"promoted_at\": None,\n        },\n        on_conflict=\"ip_address\",  # ip_address가 이미 표에 있으면 새로 만들지 않고 덮어씀\n    ).execute()", "alias": {"call": "db.create_lockout()", "via": "db/__init__.py", "real": "db/lockouts.py"}}, "notify/alert.py:send_lockout_alert": {"path": "notify/alert.py", "start": 58, "end": 104, "lang": "python", "code": "def send_lockout_alert(\n    ip: str, failure_count: int, locked_at: datetime, distinct_usernames: int, is_admin: bool = False\n) -> None:\n    \"\"\"IP 잠금이 발생했다는 사실을 Slack 채널에 메시지로 알린다.\n\n    동작 순서:\n    1. \"시각 / IP / 실패 횟수 / 공격 유형 / 조치 내용\"을 사람이 읽기 좋은 문장으로 조립한다.\n    2. .env에 SLACK_WEBHOOK_URL이 설정돼 있으면 그 주소로 실제 전송을 시도한다.\n    3. 설정돼 있지 않으면(아직 팀이 어느 Slack 채널을 쓸지 정하지 않은 상태),\n       전송 대신 터미널 화면에 같은 메시지를 출력해서 개발 중에도 확인 가능하게 한다.\n       → 나중에 SLACK_WEBHOOK_URL 값만 채워 넣으면, 이 함수는 코드 수정 없이\n         자동으로 \"진짜 Slack 전송\" 모드로 바뀐다.\n    4. 전송 중 네트워크 오류 등으로 실패하더라도, 이 실패가 로그인 기능 전체를\n       멈춰 세우면 안 되므로 예외(에러)를 붙잡아서 콘솔에 로그만 남기고 조용히 넘어간다.\n    \"\"\"\n    # config.LOCKOUT_DURATION_SECONDS(초 단위, 예: 300)를 분 단위로 바꿔서 메시지에 넣는다.\n    minutes = config.LOCKOUT_DURATION_SECONDS // 60\n\n    # is_admin이면 관리자 로그인(/admin/login)에서 발생한 잠금이므로, 계정 하나에 집중된\n    # 공격인지 여러 계정을 순회한 공격인지와 무관하게 별도 유형으로 표시한다 — 관리자\n    # 계정이 뚫리면 회원 삭제·잠금 해제까지 장악되므로 일반 회원 로그인 시도보다 우선순위가\n    # 높다는 걸 메시지만 보고도 바로 알 수 있게 하기 위해서다.\n    # distinct_usernames가 2개 이상이면 \"한 계정을 집중 공격\"이 아니라 \"여러 계정을\n    # 돌아가며 시도\"하는 것이므로, Brute Force와 구분해서 Password Spraying으로 표시한다.\n    if is_admin:\n        pattern_line = \"공격 유형: 관리자 로그인 무차별 대입\"\n    elif distinct_usernames > 1:\n        pattern_line = f\"공격 유형: Password Spraying 의심 (서로 다른 아이디 {distinct_usernames}개 시도)\"\n    else:\n        pattern_line = \"공격 유형: Brute Force (단일 계정 집중 시도)\"\n\n    # \":rotating_light:\"는 Slack에서 🚨(경광등) 이모지로 자동 변환되는 표기법이다.\n    # \"[CRITICAL]\"은 위험등급을 한눈에 보여준다(security-risk-response-summary.md 5-5절).\n    message = (\n        \":rotating_light: [CRITICAL] 로그인 워치독 알림\\n\"\n        f\"시각: {locked_at.strftime('%Y-%m-%d %H:%M:%S UTC')}\\n\"\n        f\"시도 IP: {ip}\\n\"\n        f\"실패 횟수: {failure_count}회\\n\"\n        f\"{pattern_line}\\n\"\n        f\"조치: {minutes}분간 IP 잠금 처리\"\n    )\n\n    # Slack 웹훅(Incoming Webhook)이란: Slack이 채널마다 발급해주는 전용 주소.\n    # 이 주소에 {\"text\": \"...\"} 형태의 데이터를 보내기만 하면 그 채널에 메시지가 올라온다.\n    # 로그인 절차나 복잡한 인증 없이 \"주소 하나 + 짧은 데이터 한 덩어리\"로 끝나는\n    # 가장 단순한 연동 방식이다.\n    _send_slack_message(message)", "alias": null}, "security/soar/_events.py:_record_event": {"path": "security/soar/_events.py", "start": 13, "end": 33, "lang": "python", "code": "def _record_event(\n    event_type: str,\n    severity: str,\n    ip: str,\n    path: str | None,\n    count: int,\n    action: str,\n    username: str | None = None,\n) -> None:\n    \"\"\"security_events에 이벤트를 기록하고, 곧바로 상관분석 훅(security/correlate.py)을\n    호출한다 (Track C guide27).\n\n    security/soar/ 안에서 직접 db.insert_security_event()를 부르는 곳을 여기 하나로\n    모아둔 이유: correlate.check_and_correlate()를 매번 손으로 챙겨 부르게\n    하면, 새 조치 함수를 추가할 때 상관분석 훅을 빠뜨리기 쉽다.\n    \"\"\"\n    if username is not None:\n        db.insert_security_event(event_type, severity, ip, path, count, action, username=username)\n    else:\n        db.insert_security_event(event_type, severity, ip, path, count, action)\n    correlate.check_and_correlate(ip, event_type, severity)", "alias": null}, "security/lockdown.py:after_temporary_lock": {"path": "security/lockdown.py", "start": 141, "end": 179, "lang": "python", "code": "def after_temporary_lock(\n    target_kind: str,\n    target_value: str,\n    source_event_type: str,\n    failure_count: int = 0,\n    triggering_ip: str = \"-\",\n) -> None:\n    \"\"\"임시 잠금이 방금 걸린 직후 호출된다: 이력을 한 줄 남기고, 최근 기간 안의 잠금\n    횟수가 기준 이상이면 영구 잠금으로 승격한다(T1/T2/T5).\n\n    횟수는 lock_history에서 센다 — lockouts는 같은 IP를 upsert로 덮어써서 횟수를 셀 수 없다.\n    \"\"\"\n    db.insert_lock_history(target_kind, target_value, \"TEMPORARY\", \"THRESHOLD\", source_event_type)\n    window = config.PERMANENT_LOCK_STRIKE_WINDOW_DAYS\n\n    if target_kind == \"ip\":\n        event_types = (\n            _ADMIN_LOGIN_EVENT_TYPES if source_event_type == \"ADMIN_BRUTE_FORCE\" else _USER_LOGIN_EVENT_TYPES\n        )\n        strikes = db.count_lock_history(\"ip\", target_value, window, event_types)\n        if strikes >= config.PERMANENT_LOCK_STRIKE_COUNT:\n            # 관리자 로그인 무차별 대입(T5)은 위험도가 가장 높아 이메일 복구 대상이 아니다.\n            recoverable = \"ADMIN_ONLY\" if source_event_type == \"ADMIN_BRUTE_FORCE\" else \"EXEMPTION\"\n            promote_ip(target_value, \"REPEAT_OFFENDER\", recoverable, strikes=strikes)\n        return\n\n    strikes = db.count_lock_history(\"account\", target_value, window)\n    row = db.get_account_lockout_row(target_value) or {}\n    # 이메일 복구 직후 보호관찰 기간(기본 24시간) 안에 다시 잠기면, 본인 인증 수단이\n    # 공격자에게 넘어갔을 수 있다고 보고 횟수와 무관하게 관리자 전용 영구 잠금으로 올린다.\n    if _in_probation(row):\n        promote_account(\n            target_value, \"REPEAT_OFFENDER\", \"ADMIN_ONLY\", triggering_ip=triggering_ip, strikes=strikes,\n            note=\"이메일 복구 보호관찰 기간 중 재잠금\",\n        )\n    elif strikes >= config.PERMANENT_LOCK_ACCOUNT_STRIKE_COUNT:\n        promote_account(\n            target_value, \"REPEAT_OFFENDER\", \"SELF\", triggering_ip=triggering_ip, strikes=strikes\n        )", "alias": null}, "security/detector.py:is_account_suspicious": {"path": "security/detector.py", "start": 54, "end": 63, "lang": "python", "code": "def is_account_suspicious(username: str) -> tuple[bool, int]:\n    \"\"\"이 계정(아이디)이 여러 IP에 걸쳐 분산 공격당하고 있는 상태인지 판단한다.\n\n    is_suspicious(ip)는 \"한 IP가 얼마나 실패했는가\"만 보므로, 공격자가 IP를\n    나눠 쓰면(봇넷/프록시 로테이션) 각 IP는 임계값을 넘기지 않는다. 이 함수는\n    IP와 무관하게 \"이 계정이 총 몇 번 실패당했는가\"(ACCOUNT_FAILURE_THRESHOLD,\n    기본 8회)를 기준으로 판단해서 그 빈틈을 메운다 (L7 공격 보강 계획 Tier 1).\n    \"\"\"\n    failure_count = db.count_recent_failures_by_username(username)\n    return failure_count > ACCOUNT_FAILURE_THRESHOLD, failure_count", "alias": null}, "db/attempts.py:count_recent_failures_by_username": {"path": "db/attempts.py", "start": 73, "end": 94, "lang": "python", "code": "def count_recent_failures_by_username(\n    username: str, window_seconds: int = config.DETECTION_WINDOW_SECONDS\n) -> int:\n    \"\"\"이 아이디가 최근 몇 초(기본 60초) 안에 (어느 IP에서 왔든) 몇 번이나\n    로그인에 실패했는지 센다.\n\n    count_recent_failures()는 IP 기준이라, 공격자가 IP를 여러 개 돌려가며\n    같은 계정만 노리면 IP 하나당 실패 횟수는 임계값을 넘지 않아 탐지를\n    피해간다. 이 함수는 IP와 무관하게 \"이 계정이 총 몇 번 공격당했는가\"를\n    세서 그 빈틈을 메운다 (config.ACCOUNT_FAILURE_THRESHOLD와 함께 쓰임).\n    \"\"\"\n    cutoff = (datetime.now(timezone.utc) - timedelta(seconds=window_seconds)).isoformat()\n    res = (\n        db.get_client()\n        .table(\"login_attempts\")\n        .select(\"id\", count=\"exact\")\n        .eq(\"username\", username)\n        .eq(\"success\", False)\n        .gte(\"attempted_at\", cutoff)\n        .execute()\n    )\n    return res.count or 0", "alias": {"call": "db.count_recent_failures_by_username()", "via": "db/__init__.py", "real": "db/attempts.py"}}, "config.py:28-28": {"path": "config.py", "start": 28, "end": 28, "lang": "python", "code": "ACCOUNT_FAILURE_THRESHOLD = int(os.environ.get(\"ACCOUNT_FAILURE_THRESHOLD\", 8))", "alias": null}, "security/detector.py:count_distinct_ips_by_username": {"path": "security/detector.py", "start": 66, "end": 70, "lang": "python", "code": "def count_distinct_ips_by_username(username: str) -> int:\n    \"\"\"soar.enforce_account_lockout이 \"몇 개의 서로 다른 IP에서 시도됐는지\"를\n    잠금 알림에 표시할 수 있도록, db가 센 값을 그대로 전달한다.\n    \"\"\"\n    return db.count_recent_distinct_ips_by_username(username)", "alias": null}, "db/attempts.py:count_recent_distinct_ips_by_username": {"path": "db/attempts.py", "start": 97, "end": 118, "lang": "python", "code": "def count_recent_distinct_ips_by_username(\n    username: str, window_seconds: int = config.DETECTION_WINDOW_SECONDS\n) -> int:\n    \"\"\"이 아이디에 대한 최근 로그인 실패 시도가 몇 개의 서로 다른 IP에서\n    왔는지 센다.\n\n    count_recent_distinct_usernames()(한 IP가 몇 개의 아이디를 시도했는지)의\n    반대 방향이다 — 한 계정에 몰리는 IP가 많을수록 분산 브루트포스(봇넷/\n    프록시 로테이션) 의심이 커진다는 걸 notify/alert.py가 메시지에 보여줄 수 있게\n    한다.\n    \"\"\"\n    cutoff = (datetime.now(timezone.utc) - timedelta(seconds=window_seconds)).isoformat()\n    res = (\n        db.get_client()\n        .table(\"login_attempts\")\n        .select(\"ip_address\")\n        .eq(\"username\", username)\n        .eq(\"success\", False)\n        .gte(\"attempted_at\", cutoff)\n        .execute()\n    )\n    return len({row[\"ip_address\"] for row in res.data})", "alias": {"call": "db.count_recent_distinct_ips_by_username()", "via": "db/__init__.py", "real": "db/attempts.py"}}, "security/soar/lockouts.py:enforce_account_lockout": {"path": "security/soar/lockouts.py", "start": 61, "end": 91, "lang": "python", "code": "def enforce_account_lockout(\n    username: str, failure_count: int, distinct_ip_count: int, triggering_ip: str\n) -> None:\n    \"\"\"이 계정에 실제로 잠금을 걸고, Slack으로 알리고, CRITICAL 이벤트로 기록한다.\n\n    enforce_lockout()(IP 잠금)과 짝을 이루는 계정 잠금 버전이다 — 공격이 여러\n    IP에 나뉘어 있어 IP 잠금만으로는 못 잡을 때, 계정 자체를 잠가서 막는다\n    (L7 공격 보강 계획 Tier 1: 분산/저속 브루트포스 대응).\n\n    triggering_ip는 \"잠금을 유발한 마지막 시도의 IP\"다 — 실제 잠금 판단\n    기준(계정 전체 실패 횟수, IP와 무관)과는 별개로, security_events에서\n    이벤트를 훑어보는 관리자가 \"가장 최근엔 어디서 왔는지\" 참고할 수 있게\n    남겨둔다.\n    \"\"\"\n    db.create_account_lockout(username, failure_count)\n    alert.send_account_lockout_alert(\n        username, failure_count, datetime.now(timezone.utc), distinct_ip_count\n    )\n    _record_event(\n        \"DISTRIBUTED_BRUTE_FORCE\",\n        \"CRITICAL\",\n        triggering_ip,\n        None,\n        failure_count,\n        \"ACCOUNT_LOCKED\",\n        username=username,\n    )\n    # 계정 잠금 이력 + 영구 승격 판단(guide33, T2). enforce_lockout()의 같은 자리 주석 참고.\n    lockdown.after_temporary_lock(\n        \"account\", username, \"DISTRIBUTED_BRUTE_FORCE\", failure_count, triggering_ip=triggering_ip\n    )", "alias": {"call": "soar.enforce_account_lockout()", "via": "security/soar/__init__.py", "real": "security/soar/lockouts.py"}}, "db/account_lockouts.py:create_account_lockout": {"path": "db/account_lockouts.py", "start": 33, "end": 63, "lang": "python", "code": "def create_account_lockout(\n    username: str, failure_count: int, duration_seconds: int = config.LOCKOUT_DURATION_SECONDS\n) -> None:\n    \"\"\"이 계정을 지금부터 `duration_seconds`(기본 300초=5분) 동안 잠근다.\n\n    db.create_lockout()과 동일하게 upsert를 써서, 같은 계정이 두 번 잠기는\n    것을 걱정하지 않고 그냥 호출하면 되도록 설계했다. 영구 잠금 보호 방식도 동일하다\n    (active인 PERMANENT 행은 그대로 두고, 풀린 영구 행은 TEMPORARY 값으로 덮어쓴다).\n    probation_until은 payload에 일부러 넣지 않는다 — 이메일 복구 직후 24시간 동안\n    다시 잠겼는지 판단하는 값이라 임시 잠금 upsert가 지우면 안 된다.\n    \"\"\"\n    existing = get_account_lockout_row(username)\n    if existing and existing.get(\"active\") and existing.get(\"lock_type\") == \"PERMANENT\":\n        return\n\n    now = datetime.now(timezone.utc)\n    unlock_at = now + timedelta(seconds=duration_seconds)\n    db.get_client().table(\"account_lockouts\").upsert(\n        {\n            \"username\": username,\n            \"locked_at\": now.isoformat(),\n            \"unlock_at\": unlock_at.isoformat(),\n            \"failure_count\": failure_count,\n            \"active\": True,\n            \"lock_type\": \"TEMPORARY\",\n            \"recoverable\": \"SELF\",\n            \"permanent_reason\": None,\n            \"promoted_at\": None,\n        },\n        on_conflict=\"username\",\n    ).execute()", "alias": {"call": "db.create_account_lockout()", "via": "db/__init__.py", "real": "db/account_lockouts.py"}}, "notify/alert.py:send_account_lockout_alert": {"path": "notify/alert.py", "start": 107, "end": 130, "lang": "python", "code": "def send_account_lockout_alert(\n    username: str, failure_count: int, locked_at: datetime, distinct_ip_count: int, is_admin: bool = False\n) -> None:\n    \"\"\"계정(아이디) 잠금이 발생했다는 사실을 Slack 채널에 메시지로 알린다.\n\n    send_lockout_alert()(IP 잠금)와 메시지 조립 구조는 같지만, 대상이 IP가\n    아니라 계정이다 — 여러 IP에 걸쳐 나뉘어 들어온 공격이 계정 전체 실패\n    횟수 기준으로 잠긴 경우이므로, \"몇 개의 IP가 관련됐는지\"를 함께 보여줘서\n    분산 브루트포스임을 한눈에 알 수 있게 한다.\n\n    is_admin=True면 관리자 계정 잠금(guide38)이다 — 대상이 관리자 계정이라는 점을\n    표시해서 회원 계정 잠금과 구분한다.\n    \"\"\"\n    minutes = config.LOCKOUT_DURATION_SECONDS // 60\n    target_label = \"관리자 계정\" if is_admin else \"대상 계정\"\n    message = (\n        \":rotating_light: [CRITICAL] 로그인 워치독 알림\\n\"\n        f\"시각: {locked_at.strftime('%Y-%m-%d %H:%M:%S UTC')}\\n\"\n        f\"{target_label}: {username}\\n\"\n        f\"실패 횟수: {failure_count}회 (서로 다른 IP {distinct_ip_count}개에서 분산 시도)\\n\"\n        \"공격 유형: 분산/저속 브루트포스 의심 (여러 IP가 한 계정을 나눠서 집중 공격)\\n\"\n        f\"조치: {minutes}분간 계정 잠금 처리\"\n    )\n    _send_slack_message(message)", "alias": null}}, "files": {"routes/auth.py": {"role": "로그인 요청을 받아 '확인 → 기록 → 판정 → 집행' 순서를 지휘하는 입구 파일.", "header": "routes/auth.py — 회원가입(/signup) + 감시 대상 로그인(/login)\n원래 app.py의 \"회원가입 입력 검증 규칙\" / \"회원가입\" / \"감시 대상 로그인\"\n세 섹션을 그대로 옮겨왔다. 배경은 docs/refactor/2026-09-15-file-split.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/auth.py"}, "security/detector.py": {"role": "판사 역할. DB에 '지금 상태가 어때?'만 물어 True/False를 돌려준다. 아무것도 저장·변경하지 않는다.", "header": "security/detector.py — \"판사\" 역할: 지금 이 IP가 수상한지, 지금 잠겨있는지만 판단한다\n이 파일은 데이터베이스의 상태를 절대 바꾸지 않는다(아무것도 저장/수정/삭제하지 않음).\n오직 db에게 \"지금 상태가 어때?\"라고 물어보고, 그 답을 바탕으로\nTrue/False 같은 \"판정 결과\"만 돌려준다.\n실제로 잠그거나 알림을 보내는 \"실행\"은 이 파일이 아니라 security/soar/가 담당한다\n(판단과 실행을 분리해두면, \"판단 기준만 바꾸고 싶다\" 같은 수정이 훨씬 쉬워진다).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/detector.py"}, "db/lockouts.py": {"role": "IP 잠금(lockouts 표)을 만들고 현재 잠금을 조회하는 저장소 파일.", "header": "db/lockouts.py — lockouts 표 관련 함수\n— \"지금 어떤 IP가 잠겨있고, 언제 풀리는지\"라는 \"현재 상태\"를 관리하는 기능\n(login_attempts가 \"지나간 일의 기록\"이라면, lockouts는 \"지금 이 순간의 상태판\")\ndb.get_client()/db._now_iso()를 통해 호출하는 이유는 db/attempts.py 상단\n설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/lockouts.py"}, "db/account_lockouts.py": {"role": "계정 잠금(account_lockouts 표)을 만들고 조회하는 저장소 파일.", "header": "db/account_lockouts.py — account_lockouts 표 관련 함수\n— \"지금 어떤 계정(아이디)이 잠겨있고, 언제 풀리는지\"라는 \"현재 상태\"를 관리한다.\ndb/lockouts.py(IP 단위 잠금)와 짝을 이루는 계정 단위 잠금이다 — 공격자가 여러\nIP로 나눠서(또는 느린 속도로) 같은 계정만 노리면 IP당 실패 횟수는 임계값을\n넘지 않아 lockouts로는 못 잡는다. 이 표는 IP와 무관하게 \"이 계정이 총 몇 번\n실패했는가\"를 기준으로 잠근다 (L7 공격 보강 계획 Tier 1).\ndb.get_client()를 통해 호출하는 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/account_lockouts.py"}, "db/users.py": {"role": "db/users.py — users 표 관련 함수 (회원가입 기능) — 감시 대상이 되는 가짜 로그인 화면(/login)에 실제로 가입해서 로그인하는 \"일반 사용자\" 계정을 관리하는 기능. 관리자(admin_users)와는 완전히 별개 개념. db.get_client() 호출 이유는 d", "header": "db/users.py — users 표 관련 함수 (회원가입 기능)\n— 감시 대상이 되는 가짜 로그인 화면(/login)에 실제로 가입해서 로그인하는\n\"일반 사용자\" 계정을 관리하는 기능. 관리자(admin_users)와는 완전히 별개 개념.\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/users.py"}, "db/attempts.py": {"role": "로그인 시도(login_attempts 표)를 기록하고 '최근 N초 실패 몇 번'을 세는 저장소 파일.", "header": "db/attempts.py — login_attempts 표 관련 함수\n— \"누가 언제 어떤 IP에서 로그인에 성공/실패했는지\"를 기록하고 조회하는 기능\n원래 db.py의 같은 이름 섹션을 그대로 옮겨왔다. 이 모듈은 내부에서 `import db`로\n패키지 최상위(db/__init__.py)를 다시 참조해서 db.get_client()를 호출한다 —\ndb.attempts.get_client가 아니라 이렇게 해야, 테스트가\nmonkeypatch.setattr(db, \"get_client\", ...)로 db 패키지의 get_client를 바꿔치기\n했을 때 이 파일의 함수들도 그 가짜 버전을 그대로 쓰게 된다(값을 미리 복사해서\n이 파일 안에 별도 이름으로 묶어두면 그 바꿔치기가 안 먹는다).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/attempts.py"}, "config.py": {"role": "임계값·시간 창·잠금 시간 같은 프로젝트 공용 설정값 모음.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/config.py"}, "security/soar/lockouts.py": {"role": "집행관 역할. 판정 결과대로 IP·계정을 실제로 잠그고, 알리고, 기록한다.", "header": "security/soar/lockouts.py — 잠금 집행(IP/회원 계정/관리자 계정)과 자동·수동 해제\n예전 soar.py(497줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from security import soar` 후 `soar.enforce_lockout(...)`으로\n쓴다(security/soar/__init__.py가 재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/soar/lockouts.py"}, "notify/alert.py": {"role": "Slack으로 알림을 보내는 파일. 외부 서비스와의 통신만 전담한다.", "header": "notify/alert.py — \"전화 교환원\" 역할: Slack에 실제로 메시지를 전송한다\n이 파일이 하는 일은 딱 하나, \"메시지를 조립해서 Slack 웹훅 주소로 던지는 것\"뿐이다.\n\"언제 알림을 보낼지\"를 결정하는 판단은 이 파일의 몫이 아니고 security/soar/(대부분),\nsecurity/correlate.py·lockdown.py, notify/mailer.py(메일 발송 실패)가 결정해서\n이 파일의 함수를 호출해줄 때만 동작한다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/notify/alert.py"}, "security/soar/_events.py": {"role": "보안 이벤트(위험등급)를 기록하고 상관분석 훅을 부르는 공용 함수. (8·9단원)", "header": "security/soar/_events.py — 보안 이벤트 기록 + 상관분석 훅 (아래 조치 함수들이 공유)\n예전 soar.py(497줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from security import soar` 후 `soar.enforce_lockout(...)`으로\n쓴다(security/soar/__init__.py가 재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/soar/_events.py"}, "security/lockdown.py": {"role": "임시 잠금 이력을 남기고 영구 잠금으로 올릴지 판단한다. (16단원)", "header": "security/lockdown.py — \"영구 출입금지 담당 부서\": 임시 잠금을 영구 잠금으로 올리고(승격),\n영구 잠금을 풀어주는(관리자 해제 / 이메일 복구) 로직 본체 (guide33 / guide34-a)\n왜 별도 모듈인가: security/soar/가 이미 security/correlate.py를 import하고 있어서, security/correlate.py가\nsecurity/soar/의 승격 함수를 직접 부르면 순환 import가 된다. 그래서 승격·해제 로직을 이\n파일 하나로 모으고, security/soar/와 security/correlate.py가 둘 다 이 파일만 import하게 한다.\n이 파일은 모듈 수준에서 db / alert / config / ip_utils만 import한다. 영구 잠금 이벤트를\n상관분석(correlate)에 흘려보내는 부분만 함수 안에서 늦게 import한다(순환 방지).\n설계 원칙 (docs의 permanent-lock 계획서 1.1 참고)\n- \"영구\"는 시간이 아니라 해제 조건의 문제다: 자동 만료가 없고 이메일 인증이나\n관리자 수동 해제로만 풀린다.\n- IP 영구 잠금은 이메일로 \"해제\"하지 않고 본인+본인 기기에게만 \"예외\"를 발급한다.\n- 허용 목록(PERMANENT_LOCK_IP_ALLOWLIST)의 IP는 절대 영구 잠그지 않는다(자충수 방지).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/lockdown.py"}}}</script>

  var PY = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?''')|([rbfRBF]{0,2}"(?:\\.|[^"\\\n])*"|[rbfRBF]{0,2}'(?:\\.|[^'\\\n])*')|\b(def|class|return|if|elif|else|for|while|import|from|as|try|except|finally|with|in|not|and|or|is|None|True|False|raise|pass|lambda|yield|global|nonlocal|assert|del|continue|break)\b|(@[A-Za-z_][\w.]*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(?=\()/g;

  var HT = /(<!--[\s\S]*?-->)|(\{[{%#][\s\S]*?[}%#]\})|(<\/?[A-Za-z][\w-]*)|("[^"\n]*")|(\/?>)/g;
  var HTC = [null,"t-c","t-a","t-k","t-s","t-k"];
  var JS = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\.|[^`\\])*`)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(const|let|var|function|return|if|else|for|while|import|from|export|default|async|await|try|catch|finally|new|class|extends|typeof|interface|type|null|undefined|true|false|throw|switch|case|break|continue|of|in|as)\b|(@[A-Za-z_]\w*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_$][\w$]*)(?=\()/g;
  var JSC = [null,"t-c","t-s","t-s","t-k","t-a","t-n","t-f"];
  var SQ = /(--[^\n]*|\/\*[\s\S]*?\*\/)|((?!))|('(?:''|[^'])*')|\b(select|from|where|insert|into|values|update|set|delete|create|table|index|alter|add|drop|on|conflict|do|nothing|and|or|not|null|default|primary|key|references|cascade|if|exists|as|order|by|group|limit|desc|asc|join|left|inner|count|returns|function|language|begin|end|return|with|union|all|distinct|in|is|true|false|unique|check|constraint|timestamptz|text|integer|bigint|boolean|interval|now|replace|trigger|view|policy|enable|row|level|security|using)\b|((?!))|\b(\d+(?:\.\d+)?)\b|\b([a-z_]\w*)(?=\()/gi;
  var SQC = [null,"t-c",null,"t-s","t-k",null,"t-n","t-f"];
  var SH = /(#[^\n]*)|((?!))|("(?:\\.|[^"\\\n])*"|'[^'\n]*')|\b(if|then|else|fi|for|do|done|while|case|esac|function|echo|export|python|pip|git|cd|run|name|on|jobs|steps|uses|with|env)\b|((?!))|\b(\d+)\b/g;
  var SHC = [null,"t-c",null,"t-s","t-k",null,"t-n"];
  function tokenize(code, lang){
    var re = PY, cls = PYC;
    if (lang === "html"){ re = HT; cls = HTC; }
    else if (lang === "js"){ re = JS; cls = JSC; }
    else if (lang === "sql"){ re = SQ; cls = SQC; }
    else if (lang === "sh"){ re = SH; cls = SHC; }
    var lines = [[]];
    function push(text, c){
      var parts = text.split("\n");
      parts.forEach(function(p, i){
        if (i > 0) lines.push([]);
        if (p) lines[lines.length-1].push([p, c]);
      });
    }
    var last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(code)) !== null){
      if (m.index > last) push(code.slice(last, m.index), null);
      var idx = 1; while (idx < m.length && m[idx] === undefined) idx++;
      push(m[0], cls[idx] || null);
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++;
    }
    if (last < code.length) push(code.slice(last), null);
    return lines;
  }

  function codeTable(block, hl){
    var lines = tokenize(block.code, block.lang);
    var tbody = el("tbody");
    var hlFirst = null;
    lines.forEach(function(segs, i){
      var no = block.start + i;
      var on = hl && no >= hl[0] && no <= hl[1];
      var td = el("td", {class:"tx"});
      segs.forEach(function(s){ td.appendChild(s[1] ? el("span", {class:s[1], text:s[0]}) : document.createTextNode(s[0])); });
      if (!segs.length) td.appendChild(document.createTextNode(" "));
      var tr = el("tr", on ? {class:"hl"} : null, [el("td", {class:"ln", text:String(no)}), td]);
      if (on && !hlFirst) hlFirst = tr;
      tbody.appendChild(tr);
    });
    var box = el("div", {class:"codebox"}, [el("table", {class:"code"}, [tbody])]);
    box._hlFirst = hlFirst;
    return box;
  }

  function copyText(text, btn){
    var done = function(){ var o = btn.textContent; btn.textContent = "복사됨 ✓"; setTimeout(function(){ btn.textContent = o; }, 1200); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
    function fallback(){
      var ta = el("textarea", {style:"position:fixed;opacity:0"}); ta.value = text; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); done(); } catch(e){} document.body.removeChild(ta);
    }
  }

  /* ---------- 패널 ---------- */
  function openPanel(){ document.body.classList.add("open"); }
  function closePanel(){ document.body.classList.remove("open"); }

  function showHint(){
    $("pTitle").textContent = "코드 보는 법";
    $("pSub").textContent = "카드나 파일 이름을 누르면 실제 코드가 여기에 열립니다.";
    var ul = el("ul", {class:"hint"}, [
      el("li", {text:"카드(상자)를 누르면 그 단계에서 실행되는 실제 함수 코드가 열려요."}),
      el("li", {text:"카드 안의 📄 파일 이름을 누르면 그 파일이 어떤 역할인지, 이 단원에서 쓰이는 함수가 무엇인지 보여줘요."}),
      el("li", {text:"ƒ 함수 이름을 누르면 해당 함수 코드로 바로 이동해요."}),
      el("li", {text:"노란색 줄이 지금 단계가 담당하는 부분이에요."}),
      el("li", {text:"db.함수() 처럼 적혀 있어도 실제 코드는 db/users.py 같은 다른 파일에 있어요. 카드에 그 '진짜 파일'을 표시하고, 코드 위에 찾아가는 길도 그려줘요."}),
      el("li", {text:"위쪽 ◀ ▶ 버튼으로 실행 순서대로 한 단계씩 따라갈 수 있어요."})
    ]);
    var b = $("pBody"); b.textContent = ""; b.appendChild(ul);
  }

  function renderAlias(a){
    if (!a) return null;
    return el("div", {class:"alias"}, [
      el("div", {text:"코드에는 이렇게 적혀 있지만, 실제 함수는 다른 파일에 있어요."}),
      el("div", {class:"route"}, [
        el("span", {class:"step", text:a.call}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step", text:a.via + " (창구)"}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step real", text:a.real})
      ])
    ]);
  }

  function selectNode(id, itemIdx){
    var n = nodeById(id); if (!n) return;
    state.node = id; state.item = itemIdx || 0; state.file = null;
    $("pTitle").textContent = n.title;
    $("pSub").textContent = n.plain;
    var body = $("pBody"); body.textContent = "";
    if (n.reject) body.appendChild(el("div", {class:"n-reject", text:n.reject, style:"margin:0 0 10px"}));
    if (n.items.length > 1){
      var tabs = el("div", {class:"itabs", role:"tablist"});
      n.items.forEach(function(it, i){
        tabs.appendChild(el("button", {class:"itab", role:"tab", "aria-selected":String(i === state.item), text:it.label,
          onclick:function(){ selectNode(id, i); }}));
      });
      body.appendChild(tabs);
    }
    var it = n.items[state.item];
    var block = D.blocks[it.block];
    var linesTxt = it.hl ? (it.hl[0] === it.hl[1] ? it.hl[0] + "줄" : it.hl[0] + "–" + it.hl[1] + "줄") : "";
    var fl = el("div", {class:"fileline"}, [
      el("button", {class:"chip file", onclick:function(){ selectFile(block.path); }, text:block.path}),
      el("span", {class:"lines", text: block.start + "–" + block.end + "줄 표시" + (linesTxt ? " · 노란색 " + linesTxt : "")}),
      el("span", {class:"spacer"}),
      el("button", {class:"btn", text:"복사", onclick:function(e){ copyText(block.code, e.currentTarget); }}),
      el("a", {class:"btn link", href:D.files[block.path].github + "#L" + block.start + "-L" + block.end, target:"_blank", rel:"noopener", text:"GitHub ↗"})
    ]);
    body.appendChild(fl);
    var al = renderAlias(block.alias); if (al) body.appendChild(al);
    var box = codeTable(block, it.hl);
    body.appendChild(box);
    if (it.hl) body.appendChild(el("p", {class:"legend-hl"}, [el("b", {text:"노란색"}), " = 이 카드가 담당하는 줄"]));
    refreshSelection();
    openPanel();
    if (box._hlFirst){
      var off = box._hlFirst.offsetTop - 60;
      box.scrollTop = Math.max(0, off);
    }
    updateStepper();
  }

  function selectFile(path){
    state.file = path; state.node = null;
    var f = D.files[path];
    $("pTitle").textContent = "📄 " + path;
    $("pSub").textContent = f.role;
    var body = $("pBody"); body.textContent = "";
    body.appendChild(el("div", {class:"fileline"}, [
      el("a", {class:"btn link", href:f.github, target:"_blank", rel:"noopener", text:"GitHub에서 파일 열기 ↗"})
    ]));
    body.appendChild(el("h3", {text:"이 단원에서 쓰이는 함수", style:"font-size:13.5px;margin:12px 0 0"}));
    var ul = el("ul", {class:"flist"}), seen = {};
    D.scenarios.forEach(function(sc, si){
      sc.nodes.forEach(function(n){
        n.items.forEach(function(it, ii){
          var b = D.blocks[it.block]; if (b.path !== path) return;
          var key = si + n.id + ii; if (seen[key]) return; seen[key] = 1;
          var li = el("li");
          li.appendChild(el("button", {onclick:function(){
            if (state.sc !== si) switchScenario(si);
            selectNode(n.id, ii); scrollToNode(n.id);
          }}, [
            el("span", {class:"mono", text:it.label}), el("small", {text:sc.name + " · " + n.title})
          ]));
          ul.appendChild(li);
        });
      });
    });
    body.appendChild(ul);
    if (f.header){
      var d = el("details", {class:"hdr"}, [el("summary", {text:"파일 맨 위 설명 주석 보기"}), el("pre", {text:f.header})]);
      body.appendChild(d);
    }
    refreshSelection();
    openPanel();
  }

  /* ---------- 흐름도 ---------- */
  var cols, colIndex, nodeEls = {};
  function renderStage(){
    var sc = scen();
    var used = {}; sc.nodes.forEach(function(n){ used[n.col] = 1; });
    cols = Object.keys(used).map(Number).sort(function(a,b){ return a-b; });
    colIndex = {}; cols.forEach(function(c, i){ colIndex[c] = i + 1; });
    var stage = $("stage");
    stage.textContent = "";
    stage.style.gridTemplateColumns = "repeat(" + cols.length + ", 196px)";
    nodeEls = {};

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "edges"); svg.id = "edges";
    svg.innerHTML = '<defs>' +
      '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-call" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '</defs>';
    stage.appendChild(svg);

    cols.forEach(function(c){
      stage.appendChild(el("div", {class:"colhead", style:"grid-column:" + colIndex[c] + ";grid-row:1", text:D.columns[c]}));
    });
    var cells = {};
    sc.nodes.forEach(function(n){
      var k = n.row + ":" + n.col;
      if (!cells[k]){
        cells[k] = el("div", {class:"cell", style:"grid-column:" + colIndex[n.col] + ";grid-row:" + (n.row + 2)});
        stage.appendChild(cells[k]);
      }
      var node = buildNode(n);
      nodeEls[n.id] = node;
      cells[k].appendChild(node);
    });
    $("intro").textContent = sc.intro;
    scheduleEdges();
  }

  function buildNode(n){
    var node = el("div", {class:"node " + n.kind, role:"button", tabindex:"0", "aria-pressed":"false", "data-id":n.id,
      onclick:function(e){ if (e.target.closest(".chip")) return; selectNode(n.id, 0); },
      onkeydown:function(e){ if ((e.key === "Enter" || e.key === " ") && !e.target.closest(".chip")){ e.preventDefault(); selectNode(n.id, 0); } }});
    var title = el("div", {class:"n-title", text:n.title});
    if (n.later) title.appendChild(el("span", {class:"tag-later", text:n.later + "에서 자세히"}));
    node.appendChild(title);
    if (n.kind !== "later" && n.plain) node.appendChild(el("div", {class:"n-plain", text:n.plain}));
    if (n.reject) node.appendChild(el("div", {class:"n-reject", text:n.reject}));
    var items = el("div", {class:"n-items"});
    // 같은 파일에 있는 함수는 파일 칩 하나 아래에 함수 칩을 나란히 놓는다
    var groups = [];
    n.items.forEach(function(it, i){
      var b = D.blocks[it.block], g = groups[groups.length - 1];
      if (g && g.path === b.path) g.list.push({it: it, i: i}); else groups.push({path: b.path, list: [{it: it, i: i}]});
    });
    groups.forEach(function(g){
      var row = el("div", {class:"n-item"});
      if (g.list.length === 1 && g.list[0].it.call) row.appendChild(el("div", {class:"n-call", text:brk(g.list[0].it.call)}));
      var chips = el("div", {class:"chips"}, [
        el("button", {class:"chip file", text:brk(g.path), title:"파일 설명 보기", onclick:function(){ selectFile(g.path); }})
      ]);
      g.list.forEach(function(x){
        chips.appendChild(el("button", {class:"chip " + (x.it.snippet ? "snip" : "fn"), text:x.it.label, title:(x.it.call ? x.it.call + " — " : "") + "코드 보기",
          onclick:function(){ selectNode(n.id, x.i); }}));
      });
      row.appendChild(chips);
      items.appendChild(row);
    });
    node.appendChild(items);
    return node;
  }

  function rectIn(elm, host){
    var a = elm.getBoundingClientRect(), h = host.getBoundingClientRect();
    return {l:a.left-h.left, r:a.right-h.left, t:a.top-h.top, b:a.bottom-h.top, cx:(a.left+a.right)/2-h.left, cy:(a.top+a.bottom)/2-h.top};
  }
  var raf = 0;
  function scheduleEdges(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(drawEdges); }
  function drawEdges(){
    var stage = $("stage"), svg = $("edges"), sc = scen();
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){ p.remove(); });
    Array.prototype.slice.call(stage.querySelectorAll(".elabel")).forEach(function(p){ p.remove(); });
    var svgNS = "http://www.w3.org/2000/svg";
    sc.edges.forEach(function(e){
      var a = nodeById(e.from), b = nodeById(e.to);
      var ea = nodeEls[e.from], eb = nodeEls[e.to]; if (!ea || !eb) return;
      var ra = rectIn(ea, stage), rb = rectIn(eb, stage), d, lx, ly;
      if (a.col === b.col){
        if (b.row - a.row <= 1){
          d = "M" + ra.cx + " " + ra.b + " V" + rb.t; lx = ra.cx; ly = (ra.b + rb.t) / 2;
        } else {
          var x = Math.min(ra.l, rb.l) - 30;
          d = "M" + ra.l + " " + ra.cy + " H" + x + " V" + rb.cy + " H" + rb.l; lx = x; ly = (ra.cy + rb.cy) / 2;
        }
      } else {
        var dir = b.col > a.col ? 1 : -1;
        var x1 = dir > 0 ? ra.r : ra.l, x2 = dir > 0 ? rb.l : rb.r;
        var xm = x2 - dir * 30;
        d = "M" + x1 + " " + ra.cy + " H" + xm + " V" + rb.cy + " H" + x2;
        lx = (x1 + x2) / 2; ly = ra.cy;
      }
      var kind = e.kind === "call" ? "call" : "flow";
      var p = document.createElementNS(svgNS, "path");
      p.setAttribute("d", d); p.setAttribute("class", "e " + kind);
      p.setAttribute("marker-end", "url(#" + (kind === "call" ? "ahc" : "ah") + ")");
      p.setAttribute("data-from", e.from); p.setAttribute("data-to", e.to);
      svg.appendChild(p);
      if (e.label && kind === "flow"){
        var lab = el("span", {class:"elabel", text:e.label});
        lab.style.left = lx + "px"; lab.style.top = ly + "px";
        stage.appendChild(lab);
      }
    });
    svg.setAttribute("width", stage.scrollWidth); svg.setAttribute("height", stage.scrollHeight);
    refreshSelection();
  }

  function refreshSelection(){
    Object.keys(nodeEls).forEach(function(id){ nodeEls[id].setAttribute("aria-pressed", String(id === state.node)); });
    var svg = $("edges"); if (!svg) return;
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){
      var on = state.node && (p.getAttribute("data-from") === state.node || p.getAttribute("data-to") === state.node);
      p.classList.toggle("active", !!on);
    });
  }
  function scrollToNode(id){
    var n = nodeEls[id]; if (n && n.scrollIntoView) n.scrollIntoView({block:"center", inline:"center", behavior:"smooth"});
  }

  /* ---------- 단계 이동 / 탭 ---------- */
  function stepIndex(){ return scen().steps.indexOf(state.node); }
  function updateStepper(){
    var steps = scen().steps, i = stepIndex();
    $("stepNo").textContent = i < 0 ? "– / " + steps.length : (i + 1) + " / " + steps.length;
    $("prev").disabled = i <= 0 && state.node !== null ? true : false;
    $("next").disabled = i >= steps.length - 1;
    if (state.node === null){ $("prev").disabled = true; $("next").disabled = false; }
  }
  function go(delta){
    var steps = scen().steps, i = stepIndex();
    var j = i < 0 ? 0 : Math.max(0, Math.min(steps.length - 1, i + delta));
    selectNode(steps[j], 0); scrollToNode(steps[j]);
  }
  function renderTabs(){
    var t = $("tabs"); t.textContent = "";
    D.scenarios.forEach(function(sc, i){
      t.appendChild(el("button", {class:"tab", role:"tab", "aria-selected":String(i === state.sc), text:sc.name, onclick:function(){ switchScenario(i); }}));
    });
  }
  function switchScenario(i){
    state.sc = i; state.node = null; state.file = null;
    renderTabs(); renderStage(); showHint(); updateStepper();
    try { history.replaceState(null, "", "#" + D.scenarios[i].id); } catch(e){}
  }

  /* ---------- 시작 ---------- */
  document.title = D.title + " — 코드 흐름도";
  $("title").textContent = D.title + " · 코드 흐름도";
  $("subtitle").textContent = D.subtitle;
  $("mdlink").setAttribute("href", D.mdFile);
  $("prev").addEventListener("click", function(){ go(-1); });
  $("next").addEventListener("click", function(){ go(1); });
  $("pClose").addEventListener("click", closePanel);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closePanel(); });
  $("theme").addEventListener("click", function(){
    var r = document.documentElement, cur = r.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  });
  window.addEventListener("resize", scheduleEdges);
  if (window.ResizeObserver) new ResizeObserver(scheduleEdges).observe($("stage"));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleEdges);

  var startId = (location.hash || "").replace("#", "");
  var startIdx = 0; D.scenarios.forEach(function(s, i){ if (s.id === startId) startIdx = i; });
  switchScenario(startIdx);
  // 화면 확인/테스트용 지름길: window.__flow.select("s7")
  window.__flow = { select: function(id, i){ selectNode(id, i || 0); }, file: selectFile, state: state };
})();
</script>
</body>
