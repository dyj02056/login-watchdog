int(\"[*] 상태 코드 집계\")\n\n    for status_code, count in sorted(status_counts.items()):\n        print(f\"    {status_code}: {count}회\")\n\n    return True", "alias": null}, "scripts/simulation/medium/macro_bot_sim.py:run": {"path": "scripts/simulation/medium/macro_bot_sim.py", "start": 98, "end": 117, "lang": "python", "code": "def run(base_url: str, username: str, password: str) -> None:\n    print(f\"[*] {base_url}에서 매크로/봇 패턴(서로 다른 API {len(TARGET_ENDPOINTS)}개 연속 호출)을 재현합니다\")\n\n    session = requests.Session()\n    dashboard_html = log_in(session, base_url, username, password)\n    csrf_token = fetch_csrf_token(dashboard_html)\n\n    call_target_endpoints(session, base_url, csrf_token)\n\n    # 콘솔 출력에는 em-dash(—) 같은 확장 문자를 넣지 않는다 — Windows 기본\n    # 콘솔(cp949)이 이 문자를 인코딩하지 못해 UnicodeEncodeError로 죽는다\n    # (실제로 이 스크립트를 처음 작성했을 때 이 문제로 실패했었다). 설명은\n    # 위 주석처럼 따로 적어두고, print()에는 일반 괄호/줄바꿈만 쓴다.\n    print(\n        \"[VERIFY] 서버가 6번의 호출을 전부 403(권한 없음)으로 거절했다면 정상입니다. \"\n        \"아무것도 실제로 삭제/변경되지 않았습니다.\\n\"\n        \"  Slack/콘솔 로그: [MEDIUM] '매크로/봇 의심' 확인\\n\"\n        \"  관리자 대시보드 또는 로그인된 GET /api/status로 security_events 확인\\n\"\n        \"  event_type=API_MACRO_PATTERN, severity=MEDIUM 확인\"\n    )", "alias": null}, "scripts/simulation/medium/honeypot_bot_sim.py:run": {"path": "scripts/simulation/medium/honeypot_bot_sim.py", "start": 35, "end": 72, "lang": "python", "code": "def run(base_url: str, login_attempts: int, signup_attempts: int, ip: str) -> bool:\n    session = new_session(ip)\n    ok = True\n\n    token = fetch_csrf(session, base_url, \"/login\")\n    print(f\"[*] POST {base_url}/login | 가짜 IP {ip} | 허니팟 칸을 채운 제출 {login_attempts}회\")\n    locked = False\n    for i in range(1, login_attempts + 1):\n        response = post_form(session, base_url, \"/login\",\n                             {\"username\": \"bot-user\", \"password\": \"bot-password\", HONEYPOT_FIELD: \"http://spam.example\"},\n                             token)\n        locked = locked or LOCK_MESSAGE in response.text\n        print(f\"    제출 {i}/{login_attempts} | 상태 {response.status_code}\")\n    if locked:\n        print(\"[FAIL] 허니팟 제출이 로그인 실패로 집계되어 잠금이 걸렸습니다. 허니팟이 먼저 걸러내지 못했습니다.\")\n        ok = False\n    else:\n        print(\"[OK] 잠금 문구가 한 번도 나오지 않았습니다. 허니팟 제출은 실패 횟수로 세지 않고 걸러졌습니다.\")\n\n    token = fetch_csrf(session, base_url, \"/signup\")\n    print(f\"[*] POST {base_url}/signup | 허니팟 칸을 채운 제출 {signup_attempts}회\")\n    caught = 0\n    for i in range(1, signup_attempts + 1):\n        response = post_form(session, base_url, \"/signup\",\n                             {\"username\": f\"bot{i}\", \"password\": \"Bot-password-1!\", \"password_confirm\": \"Bot-password-1!\",\n                              \"email\": f\"bot{i}@example.com\", HONEYPOT_FIELD: \"http://spam.example\"}, token)\n        caught += SIGNUP_BOT_MESSAGE in response.text\n        print(f\"    제출 {i}/{signup_attempts} | 상태 {response.status_code}\"\n              f\"{' | 허니팟 거절 문구 확인' if SIGNUP_BOT_MESSAGE in response.text else ''}\")\n    if caught == signup_attempts:\n        print(\"[OK] 가입 폼 제출이 전부 허니팟 거절 문구로 돌아왔습니다.\")\n    else:\n        print(f\"[FAIL] 허니팟 거절 문구가 {caught}/{signup_attempts}회만 나왔습니다.\")\n        ok = False\n\n    if ok:\n        print(\"  확인 위치: 대시보드 security_events의 event_type=BOT_DETECTED, severity=MEDIUM\")\n    return ok", "alias": null}, "docs/schema.sql:20-27": {"path": "docs/schema.sql", "start": 20, "end": 27, "lang": "sql", "code": "create table users (\n  id bigint generated always as identity primary key,\n  username text not null unique,\n  email text not null unique,\n  name text not null default '',\n  password_hash text not null,\n  created_at timestamptz not null default now()\n);", "alias": null}, "docs/schema.sql:62-67": {"path": "docs/schema.sql", "start": 62, "end": 67, "lang": "sql", "code": "create table admin_users (\n  id bigint generated always as identity primary key,\n  username text not null unique,\n  password_hash text not n mptz not null default now()\n);", "alias": null}, "docs/schema.sql:175-180": {"path": "docs/schema.sql", "start": 175, "end": 180, "lang": "sql", "code": "create table unauthorized_attempts (\n  id bigint generated always as identity primary key,\n  ip_address text not null,\n  path text not null,\n  attempted_at timestamptz not null default now()\n);", "alias": null}, "docs/schema.sql:188-193": {"path": "docs/schema.sql", "start": 188, "end": 193, "lang": "sql", "code": "create table page_access_attempts (\n  id bigint generated always as identity primary key,\n  ip_address text not null,\n  path text not null,\n  attempted_at timestamptz not null default now()\n);", "alias": null}, "docs/schema.sql:340-346": {"path": "docs/schema.sql", "start": 340, "end": 346, "lang": "sql", "code": "create table api_access_log (\n  id bigint generated always as identity primary key,\n  ip_address text not null,\n  path text not null,\n  method text not null,\n  requested_at timestamptz not null default now()\n);", "alias": null}, "docs/schema.sql:40-46": {"path": "docs/schema.sql", "start": 40, "end": 46, "lang": "sql", "code": "create table lockouts (\n  ip_address text primary key,\n  locked_at timestamptz not null default now(),\n  unlock_at timestamptz not null,\n  failure_count int not null,\n  active boolean not null default true\n);", "alias": null}, "docs/schema.sql:8-27": {"path": "docs/schema.sql", "start": 8, "end": 27, "lang": "sql", "code": "--   create table account_lockouts (\n--     username text primary key,\n--     locked_at timestamptz not null default now(),\n--     unlock_at timestamptz not null,\n--     failure_count int not null,\n--     active boolean not null default true\n--   );\n--   alter table security_events add column username text;\n\n-- 감시 대상 /login 화면에 실제로 가입해 로그인하는 사용자 계정\n-- name: 로그인 아이디(username)와 별개인 \"표시 이름\". 회원가입 때는 안 받고 기본값 ''(빈 문자열)로\n-- 시작하며, 회원 대시보드의 프로필 수정 화면에서 나중에 채워 넣는다(12단계 참고).\ncreate table users (\n  id bigint generated always as identity primary key,\n  username text not null unique,\n  email text not null unique,\n  name text not null default '',\n  password_hash text not null,\n  created_at timestamptz not null default now()\n);", "alias": null}, "docs/schema.sql:652-658": {"path": "docs/schema.sql", "start": 652, "end": 658, "lang": "sql", "code": "create table if not exists admin_account_lockouts (\n  username text primary key,\n  locked_at timestamptz not null default now(),\n  unlock_at timestamptz not null,\n  failure_count int not null,\n  active boolean not null default true\n);", "alias": null}, "docs/schema.sql:515-529": {"path": "docs/schema.sql", "start": 515, "end": 529, "lang": "sql", "code": "create table if not exists lock_history (\n  id bigint generated always as identity primary key,\n  target_kind text not null check (target_kind in ('ip', 'account')),\n  target_value text not null,\n  lock_type text not null check (lock_type in ('TEMPORARY', 'PERMANENT')),\n  trigger_reason text not null check (trigger_reason in\n    ('THRESHOLD', 'REPEAT_OFFENDER', 'SIEM_CRITICAL', 'SIEM_HIGH', 'NETWORK_IDS', 'ADMIN_MANUAL')),\n  source_event_type text,                                   -- BRUTE_FORCE / ADMIN_BRUTE_FORCE 등\n  incident_id bigint references security_incidents(id) on delete set null,\n  trigger_note text,                                        -- 관리자 수동 승격 사유 등\n  locked_at timestamptz not null default now(),\n  released_at timestamptz,\n  released_by text,                                         -- 'AUTO_EXPIRE' / 'EMAIL_RECOVERY' / 'admin:<아이디>' / 'script:<이름>'\n  release_note text\n);", "alias": null}, "docs/schema.sql:208-219": {"path": "docs/schema.sql", "start": 208, "end": 219, "lang": "sql", "code": "create table security_events (\n  id bigint generated always as identity primary key,\n  event_type text not null,\n  severity text not null check (severity in ('MEDIUM', 'HIGH', 'CRITICAL')),\n  ip_address text not null,\n  path text,\n  count int not null,\n  action text not null,\n  username text,\n  detected_at timestamptz not null default now(),\n  resolved_at timestamptz\n);", "alias": null}, "docs/schema.sql:300-308": {"path": "docs/schema.sql", "start": 300, "end": 308, "lang": "sql", "code": "create table security_incidents (\n  id bigint generated always as identity primary key,\n  ip_address text not null,\n  event_types text[] not null,\n  severity_max text not null check (severity_max in ('MEDIUM', 'HIGH', 'CRITICAL')),\n  status text not null check (status in ('OPEN', 'CLOSED')) default 'OPEN',\n  first_event_at timestamptz not null,\n  last_event_at timestamptz not null\n);", "alias": null}, "docs/schema.sql:360-392": {"path": "docs/schema.sql", "start": 360, "end": 392, "lang": "sql", "code": "create table access_requests (\n  request_id bigint generated always as identity primary key,\n  event_type text not null check (\n    event_type in (\n      'BRUTE_FORCE', 'DISTRIBUTED_BRUTE_FORCE', 'SIGNUP_RATE_LIMIT',\n      'WEB_SCANNING', 'UNAUTHORIZED_ACCESS', 'PAGE_ACCESS', 'API_MACRO_PATTERN'\n    )\n  ),\n  -- 승인됐을 때 실제로 실행할 조치. \"그 유형이 원래 임계값을 넘었을 때 하던\n  -- 조치\"와 정확히 같다 — 로그인/계정 브루트포스만 잠그고(LOCK_IP/LOCK_ACCOUNT),\n  -- 나머지 유형은 원래도 잠그지 않으므로 알림·기록만 한다(ALERT_ONLY).\n  pending_action text not null check (pending_action in ('LOCK_IP', 'LOCK_ACCOUNT', 'ALERT_ONLY')),\n  target_kind text not null check (target_kind in ('ip', 'account')),\n  target_value text not null,\n  -- Web Scanning/Unauthorized Access/반복 페이지 접근/회원가입 남용처럼 \"어느\n  -- 경로에서 관찰됐는지\"가 있는 유형만 채워진다. 로그인 브루트포스·매크로/봇처럼\n  -- 특정 경로 하나가 아니라 IP 전체의 패턴을 가리키는 유형은 null로 남긴다\n  -- (soar.py의 notify_macro_pattern이 path=None을 쓰는 것과 같은 이유).\n  path text,\n  count int not null,\n  threshold int not null,\n  -- LOCK_IP는 distinct_usernames(Brute Force/Password Spraying 구분),\n  -- LOCK_ACCOUNT는 distinct_ips(분산 정도)를 담는다. ALERT_ONLY 유형은 null.\n  context_count int,\n  -- LOCK_ACCOUNT(계정 잠금)를 승인 시 soar.enforce_account_lockout()에 넘길\n  -- \"이번 시도의 triggering_ip\"를 담는다. 그 외 유형은 null.\n  context_ip text,\n  llm_reason text not null,\n  status text not null check (status in ('PENDING', 'APPROVED', 'REJECTED')) default 'PENDING',\n  requested_at timestamptz not null default now(),\n  decided_by_admin_id bigint references admin_users(id),\n  decided_at timestamptz\n);", "alias": null}, "docs/schema.sql:545-560": {"path": "docs/schema.sql", "start": 545, "end": 560, "lang": "sql", "code": "create table if not exists recovery_requests (\n  id bigint generated always as identity primary key,\n  user_id bigint not null references users(id) on delete cascade,\n  target_kind text not null check (target_kind in ('ip', 'account')),\n  target_value text not null,\n  token_hash text not null unique,\n  code_hash text not null,\n  device_hash text,                                         -- 요청한 기기(lw_dev 쿠키)의 해시\n  requested_ip text not null,\n  status text not null default 'PENDING'\n    check (status in ('PENDING', 'VERIFIED', 'EXPIRED', 'REVOKED')),\n  code_attempts int not null default 0,\n  expires_at timestamptz not null,\n  created_at timestamptz not null default now(),\n  verified_at timestamptz\n);", "alias": null}, "docs/schema.sql:571-581": {"path": "docs/schema.sql", "start": 571, "end": 581, "lang": "sql", "code": "create table if not exists ip_lock_exemptions (\n  id bigint generated always as identity primary key,\n  ip_address text not null,\n  user_id bigint not null references users(id) on delete cascade,\n  device_hash text not null,\n  granted_via text not null check (granted_via in ('EMAIL_RECOVERY', 'ADMIN')),\n  status text not null default 'ACTIVE' check (status in ('ACTIVE', 'REVOKED', 'EXPIRED')),\n  granted_at timestamptz not null default now(),\n  expires_at timestamptz not null,\n  revoked_reason text\n);", "alias": null}, "docs/schema.sql:704-716": {"path": "docs/schema.sql", "start": 704, "end": 716, "lang": "sql", "code": "create table if not exists email_tokens (\n  id bigint generated always as identity primary key,\n  user_id bigint not null references users(id) on delete cascade,\n  purpose text not null check (purpose in ('EMAIL_VERIFY', 'EMAIL_CHANGE', 'PASSWORD_RESET')),\n  email text not null,                                      -- 이 토큰이 확인하는 주소(변경이면 새 주소)\n  token_hash text not null unique,\n  requested_ip text not null,\n  status text not null default 'PENDING'\n    check (status in ('PENDING', 'USED', 'EXPIRED', 'REVOKED')),\n  expires_at timestamptz not null,\n  created_at timestamptz not null default now(),\n  used_at timestamptz\n);", "alias": null}, "docs/schema.sql:117-124": {"path": "docs/schema.sql", "start": 117, "end": 124, "lang": "sql", "code": "create table posts (\n  id bigint generated always as identity primary key,\n  author_username text not null,\n  title text not null,\n  body text not null,\n  created_at timestamptz not null default now(),\n  updated_at timestamptz not null default now()\n);", "alias": null}, "docs/schema.sql:131-137": {"path": "docs/schema.sql", "start": 131, "end": 137, "lang": "sql", "code": "create table comments (\n  id bigint generated always as identity primary key,\n  post_id bigint not null references posts(id) on delete cascade,\n  author_username text not null,\n  body text not null,\n  created_at timestamptz not null default now()\n);", "alias": null}, "docs/schema.sql:141-145": {"path": "docs/schema.sql", "start": 141, "end": 145, "lang": "sql", "code": "create table post_attempts (\n  id bigint generated always as identity primary key,\n  ip_address text not null,\n  attempted_at timestamptz not null default now()\n);", "alias": null}, "docs/schema.sql:149-153": {"path": "docs/schema.sql", "start": 149, "end": 153, "lang": "sql", "code": "create table comment_attempts (\n  id bigint generated always as identity primary key,\n  ip_address text not null,\n  attempted_at timestamptz not null default now()\n);", "alias": null}, "docs/schema.sql:81-85": {"path": "docs/schema.sql", "start": 81, "end": 85, "lang": "sql", "code": "create table app_settings (\n  id int primary key default 1,\n  signup_enabled boolean not null default true,\n  constraint app_settings_singleton check (id = 1)\n);", "alias": null}, "docs/schema.sql:91-98": {"path": "docs/schema.sql", "start": 91, "end": 98, "lang": "sql", "code": "create table ip_locations (\n  ip_address text primary key,\n  country text,\n  region_name text,\n  city text,\n  lookup_failed boolean not null default false,\n  looked_up_at timestamptz not null default now()\n);", "alias": null}, "docs/schema.sql:923-929": {"path": "docs/schema.sql", "start": 923, "end": 929, "lang": "sql", "code": "create table if not exists log_daily_summary (\n  day date not null,\n  source text not null,\n  category text not null,\n  count bigint not null default 0,\n  primary key (day, source, category)\n);", "alias": null}, "docs/schema.sql:937-945": {"path": "docs/schema.sql", "start": 937, "end": 945, "lang": "sql", "code": "create table if not exists log_daily_breakdown (\n  day date not null,\n  source text not null,\n  dimension text not null\n    check (dimension in ('distinct_ips', 'failed_usernames', 'top_path', 'country')),\n  value text not null default '',\n  count bigint not null,\n  primary key (day, source, dimension, value)\n);", "alias": null}, "docs/schema.sql:948-951": {"path": "docs/schema.sql", "start": 948, "end": 951, "lang": "sql", "code": "create table if not exists log_summary_state (\n  id int primary key default 1 check (id = 1),\n  last_summarized_day date\n);", "alias": null}}, "files": {"app.py": {"role": "Flask 앱을 만들고 화면(Blueprint)을 등록하는 시작 파일.", "header": "app.py — 이 프로그램의 \"정문\" 역할을 하는 Flask 진입점\n지금까지 만든 db/(데이터 저장/조회), security/detector.py(판정), security/soar/(조치),\nnotify/alert.py(알림)는 전부 \"부품\"이었다. 이 파일은 그 부품들을 실제 웹 화면의\n버튼·주소(URL)와 연결해서, 사용자가 브라우저로 방문했을 때 실제로 동작하는\n\"완성된 웹사이트\"로 만들어주는 역할을 한다.\nFlask란? 파이썬으로 웹사이트(웹 서버)를 아주 적은 코드로 만들 수 있게\n도와주는 도구(프레임워크)다. \"이 주소로 누가 들어오면 이 함수를 실행해라\"\n는 규칙을 하나씩 등록해두면, 사용자가 그 주소로 접속했을 때 자동으로\n해당 함수가 실행되어 화면을 만들어 보여준다.\n실제 화면 라우트(회원가입/로그인/관리자/게시판/회원 대시보드 등)는 이제 이\n파일이 아니라 routes/ 아래 Blueprint들에 나뉘어 있다 — 이 파일에는 앱을\n만들고(Flask()), 공용 설정(세션/CSRF/요청 한도)을 하고, 그 Blueprint들을 등록하는\n\"조립\" 코드와, 요청 한도·CSRF 에러 핸들러만 남아있다. 모든 요청에 걸리는 관찰 훅\n(보안 헤더, 404 기록, 반복 접근·매크로 탐지)은 helpers/hooks.py에 있다.\n분리 배경과 각 파일이 어디로 갔는지는 docs/refactor/2026-09-15-file-split.md,\ndocs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/app.py"}, "routes/auth.py": {"role": "routes/auth.py — 회원가입(/signup) + 감시 대상 로그인(/login) 원래 app.py의 \"회원가입 입력 검증 규칙\" / \"회원가입\" / \"감시 대상 로그인\" 세 섹션을 그대로 옮겨왔다. 배경은 docs/refactor/2026-09-15-file-split.md ", "header": "routes/auth.py — 회원가입(/signup) + 감시 대상 로그인(/login)\n원래 app.py의 \"회원가입 입력 검증 규칙\" / \"회원가입\" / \"감시 대상 로그인\"\n세 섹션을 그대로 옮겨왔다. 배경은 docs/refactor/2026-09-15-file-split.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/auth.py"}, "routes/member.py": {"role": "routes/member.py — 회원 대시보드 (/dashboard) — 전부 member_login_required로 보호됨 이름이 \"/admin/dashboard\"와 비슷해 보이지만 완전히 다른 화면이다. 회원은 본인 계정에 관한 정보만 볼 수 있고, 다른 회원 정보나 관리자 기능", "header": "routes/member.py — 회원 대시보드 (/dashboard) — 전부 member_login_required로 보호됨\n이름이 \"/admin/dashboard\"와 비슷해 보이지만 완전히 다른 화면이다. 회원은\n본인 계정에 관한 정보만 볼 수 있고, 다른 회원 정보나 관리자 기능(잠긴 IP,\n전체 회원 목록 등)에는 접근할 수 없다 — member_login_required와\nlogin_required가 서로 다른 세션 키를 확인하기 때문에 이 구분이 코드 수준에서\n강제된다.\n원래 app.py의 \"회원 대시보드\" 섹션을 그대로 옮겨왔다. 배경은\ndocs/refactor/2026-09-15-file-split.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/member.py"}, "routes/board.py": {"role": "routes/board.py — 게시판 (/board) — 전부 member_login_required로 보호됨 (회원 전용, 결정 #1) login_required/member_login_required는 \"로그인 여부\"만 확인하고 \"이 글/댓글이 내 것인지\"는 확인하지 않으므로, 수", "header": "routes/board.py — 게시판 (/board) — 전부 member_login_required로 보호됨 (회원 전용, 결정 #1)\nlogin_required/member_login_required는 \"로그인 여부\"만 확인하고 \"이 글/댓글이\n내 것인지\"는 확인하지 않으므로, 수정/삭제 라우트마다 _is_post_owner() 등으로\n직접 소유권을 검사한다 — 관리자는 routes/admin/manage.py의 /api/board/*/delete를 통해\n별도로 전체 글/댓글을 삭제할 수 있다(docs/board-comment/plan_board.md 5-3절 참고).\n원래 app.py의 \"게시판\" 섹션을 그대로 옮겨왔다. 배경은\ndocs/refactor/2026-09-15-file-split.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/board.py"}, "services/geoip.py": {"role": "services/geoip.py — IP 주소로 \"어느 나라, 어느 도시에서 접속했는지\" 알아내는 부품 notify/alert.py가 Slack이라는 외부 서비스와의 통신만 전담하는 것처럼, 이 파일은 ip-api.com이라는 외부 서비스와의 통신만 전담한다. db(Supabase)나 ", "header": "services/geoip.py — IP 주소로 \"어느 나라, 어느 도시에서 접속했는지\" 알아내는 부품\nnotify/alert.py가 Slack이라는 외부 서비스와의 통신만 전담하는 것처럼, 이 파일은\nip-api.com이라는 외부 서비스와의 통신만 전담한다. db(Supabase)나\n화면 쪽(helpers/request_utils.py의 _attach_locations())은 이 파일이 내부적으로\n무엇을 하는지 몰라도, get_locations() 함수 하나만 부르면 위치 정보를 받을 수 있다.\n가장 중요한 설계 포인트는 \"캐싱\"이다. ip-api.com 무료 사용은 분당 45건까지만\n허용하는데, 대시보드가 5초마다 최근 로그인 시도를 다시 그리면서 그때마다\n새로 조회하면 순식간에 한도를 넘긴다. 그래서 한 번 조회한 IP는 db(db/geoip_cache.py)를 통해\nSupabase에 저장해두고, 다음부터는 외부 API 대신 그 저장값을 재사용한다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/services/geoip.py"}, "security/detector.py": {"role": "security/detector.py — \"판사\" 역할: 지금 이 IP가 수상한지, 지금 잠겨있는지만 판단한다 이 파일은 데이터베이스의 상태를 절대 바꾸지 않는다(아무것도 저장/수정/삭제하지 않음). 오직 db에게 \"지금 상태가 어때?\"라고 물어보고, 그 답을 바탕으로 True/Fals", "header": "security/detector.py — \"판사\" 역할: 지금 이 IP가 수상한지, 지금 잠겨있는지만 판단한다\n이 파일은 데이터베이스의 상태를 절대 바꾸지 않는다(아무것도 저장/수정/삭제하지 않음).\n오직 db에게 \"지금 상태가 어때?\"라고 물어보고, 그 답을 바탕으로\nTrue/False 같은 \"판정 결과\"만 돌려준다.\n실제로 잠그거나 알림을 보내는 \"실행\"은 이 파일이 아니라 security/soar/가 담당한다\n(판단과 실행을 분리해두면, \"판단 기준만 바꾸고 싶다\" 같은 수정이 훨씬 쉬워진다).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/detector.py"}, "security/soar/lockouts.py": {"role": "security/soar/lockouts.py — 잠금 집행(IP/회원 계정/관리자 계정)과 자동·수동 해제 예전 soar.py(497줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접 가리키지 않고 예전처럼 `from security import soar` 후 `", "header": "security/soar/lockouts.py — 잠금 집행(IP/회원 계정/관리자 계정)과 자동·수동 해제\n예전 soar.py(497줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from security import soar` 후 `soar.enforce_lockout(...)`으로\n쓴다(security/soar/__init__.py가 재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/soar/lockouts.py"}, "security/soar/observe.py": {"role": "security/soar/observe.py — 잠그지 않고 관찰만 하는 조치(알림 + 이벤트 기록)와 요청 거부 기록 예전 soar.py(497줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접 가리키지 않고 예전처럼 `from security import soa", "header": "security/soar/observe.py — 잠그지 않고 관찰만 하는 조치(알림 + 이벤트 기록)와 요청 거부 기록\n예전 soar.py(497줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from security import soar` 후 `soar.enforce_lockout(...)`으로\n쓴다(security/soar/__init__.py가 재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/soar/observe.py"}, "security/correlate.py": {"role": "security/correlate.py — \"형사\" 역할: 흩어진 개별 신고(security_events)들을 보고 \"이거 같은 출처가 벌인 하나의 사건 아니야?\"를 판단한다 (Track C guide27, SIEM 상관분석) security/soar/가 security_events에 ", "header": "security/correlate.py — \"형사\" 역할: 흩어진 개별 신고(security_events)들을 보고\n\"이거 같은 출처가 벌인 하나의 사건 아니야?\"를 판단한다 (Track C guide27, SIEM 상관분석)\nsecurity/soar/가 security_events에 새 이벤트를 기록할 때마다 이 모듈의\ncheck_and_correlate()를 호출한다. security/detector.py와 동일한 원칙으로, 이 파일도\n\"판단\"만 하고(사건으로 묶어야 하는가?) 실제 저장/병합은 db 패키지(db/incidents.py)에\n맡긴다 — security/soar/가 db에게 조치를 맡기는 것과 같은 구조다.\nPLAYBOOKS(Track C guide28, SOAR 플레이북)도 이 파일에 둔다. security/soar/가 이미\nsecurity/correlate.py를 import하고 있어서, 플레이북 실행을 security/soar/ 쪽에 두고\nsecurity/correlate.py가 그걸 호출하게 하면 반대 방향 import가 생겨 순환 참조가 된다.\nsecurity/correlate.py는 사건이 얼마나 심각해졌는지 이미 알고 있는 유일한 곳이므로,\n여기서 곧바로 notify/alert.py를 불러 실행하는 것이 security/soar/가 notify/alert.py를 직접\n부르는 것과 같은 자연스러운 구조다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/correlate.py"}, "security/soar/early_warning.py": {"role": "security/soar/early_warning.py — LLM 조기 경보와 관리자 승인/반려 (Track A, guide31) 예전 soar.py(497줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접 가리키지 않고 예전처럼 `from security impo", "header": "security/soar/early_warning.py — LLM 조기 경보와 관리자 승인/반려 (Track A, guide31)\n예전 soar.py(497줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from security import soar` 후 `soar.enforce_lockout(...)`으로\n쓴다(security/soar/__init__.py가 재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/soar/early_warning.py"}, "services/llm_client.py": {"role": "services/llm_client.py — Groq(LLM) 호출을 담당하는 유일한 창구 (Track A, guide31) 원래 scripts/management/daily_report.py 안에만 있던 Groq 호출 로직(재시도, 타임아웃, 에러 처리)을 이 파일로 옮겨 일반화했다.", "header": "services/llm_client.py — Groq(LLM) 호출을 담당하는 유일한 창구 (Track A, guide31)\n원래 scripts/management/daily_report.py 안에만 있던 Groq 호출 로직(재시도, 타임아웃,\n에러 처리)을 이 파일로 옮겨 일반화했다. daily_report.py의 \"하루치 리포트\n요약\"과 security/soar/의 \"임계값 코앞 조기 경보 판단\"이 똑같은 Groq 호출 부품을\n재사용하게 된다 — db 패키지가 \"데이터베이스와 대화하는 유일한 창구\"인 것과\n같은 원칙으로, 이 파일이 \"Groq와 대화하는 유일한 창구\"가 된다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/services/llm_client.py"}, "routes/admin/status.py": {"role": "routes/admin/status.py — 관리자 대시보드 화면(/admin/dashboard)과 대시보드 폴링 API(/api/status) 예전 routes/admin.py(798줄)를 기능 묶음별로 나눈 조각 중 하나다. Blueprint(admin_bp)는 routes/admi", "header": "routes/admin/status.py — 관리자 대시보드 화면(/admin/dashboard)과 대시보드 폴링 API(/api/status)\n예전 routes/admin.py(798줄)를 기능 묶음별로 나눈 조각 중 하나다. Blueprint(admin_bp)는\nroutes/admin/__init__.py에서 하나만 만들고, 이 파일은 거기에 라우트를 붙이기만 한다\n— 그래서 엔드포인트 이름(url_for(\"admin.xxx\"))은 나누기 전과 똑같다.\n배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/admin/status.py"}, "helpers/auth.py": {"role": "helpers/auth.py — 관리자/회원 세션과 로그인·권한 문지기(데코레이터) 예전 helpers.py(314줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접 가리키지 않고 예전처럼 `from helpers import ...`로 가져다 쓴다(helpers/", "header": "helpers/auth.py — 관리자/회원 세션과 로그인·권한 문지기(데코레이터)\n예전 helpers.py(314줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from helpers import ...`로 가져다 쓴다(helpers/__init__.py가\n재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/helpers/auth.py"}, "scripts/management/tune_thresholds.py": {"role": "임계값 튜닝 리포트(14단원) 스크립트.", "header": "tune_thresholds.py — 최근 N일간 CRITICAL(IP/계정 잠금) 이벤트 중, 관리자가\n자동 만료(LOCKOUT_DURATION_SECONDS)를 다 기다리지 않고 훨씬 빨리 수동으로\n풀어준 비율을 집계해서, 지금 탐지 임계값이 너무 예민한 건 아닌지 점검하는\n리포트 스크립트 (Track C guide30, 임계값 튜닝)\n\"조기 해제\"란? IP/계정을 잠근 뒤(CRITICAL 이벤트), 자동으로 풀릴 시각이 되기도\n전에 관리자가 대시보드의 \"즉시 해제\" 버튼이나 scripts/management/unlock_ip.py로 먼저\n풀어준 경우를 말한다. 이 비율이 높으면 \"정상 사용자까지 잠그고 있어서\n관리자가 계속 수동으로 풀어주고 있다\"는 신호로 볼 수 있다 — 그렇다면\nFAILURE_THRESHOLD 같은 임계값을 더 느슨하게 조정하는 걸 검토해야 한다.\n판단 기준: resolved_at - detected_at 간격이 config.LOCKOUT_DURATION_SECONDS의\n--early-release-ratio(기본 50%) 미만이면 \"조기 해제\"로 분류한다. 관리자가\n정확히 언제 버튼을 눌렀는지 초 단위로 알 수는 없지만, 자동 만료 시간의\n절반도 안 돼서 풀렸다면 \"자동 만료를 기다리지 않았다\"고 봐도 무방하다.\n이 스크립트는 새 표를 만들지 않고 기존 security_events만 조회한다 — 다른\n조사·조치 스크립트와 달리 서버에 아무 영향도 주지 않는 완전한 읽기 전용 도구다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/management/tune_thresholds.py"}, "helpers/hooks.py": {"role": "helpers/hooks.py — 모든 요청에 걸리는 공용 훅: 보안 헤더, 404 기록(Web Scanning), 반복 페이지 접근·매크로 API 패턴 관찰 원래 app.py에 @app.after_request / @app.errorhandler(404) / @app.before_re", "header": "helpers/hooks.py — 모든 요청에 걸리는 공용 훅: 보안 헤더, 404 기록(Web Scanning),\n반복 페이지 접근·매크로 API 패턴 관찰\n원래 app.py에 @app.after_request / @app.errorhandler(404) / @app.before_request\n데코레이터로 직접 달려 있었다. app.py가 앱 \"조립\"(설정·Blueprint 등록·요청 한도)에만\n집중하도록 이 파일로 옮겼고, app.py는 register_request_hooks(app) 한 줄로 등록한다.\n배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/helpers/hooks.py"}, "helpers/request_utils.py": {"role": "helpers/request_utils.py — 요청 정보(IP, 허니팟) 읽기와 화면용 작은 변환 함수 예전 helpers.py(314줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접 가리키지 않고 예전처럼 `from helpers import ...`로 가져다", "header": "helpers/request_utils.py — 요청 정보(IP, 허니팟) 읽기와 화면용 작은 변환 함수\n예전 helpers.py(314줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from helpers import ...`로 가져다 쓴다(helpers/__init__.py가\n재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/helpers/request_utils.py"}, "security/lockdown.py": {"role": "security/lockdown.py — \"영구 출입금지 담당 부서\": 임시 잠금을 영구 잠금으로 올리고(승격), 영구 잠금을 풀어주는(관리자 해제 / 이메일 복구) 로직 본체 (guide33 / guide34-a) 왜 별도 모듈인가: security/soar/가 이미 security/", "header": "security/lockdown.py — \"영구 출입금지 담당 부서\": 임시 잠금을 영구 잠금으로 올리고(승격),\n영구 잠금을 풀어주는(관리자 해제 / 이메일 복구) 로직 본체 (guide33 / guide34-a)\n왜 별도 모듈인가: security/soar/가 이미 security/correlate.py를 import하고 있어서, security/correlate.py가\nsecurity/soar/의 승격 함수를 직접 부르면 순환 import가 된다. 그래서 승격·해제 로직을 이\n파일 하나로 모으고, security/soar/와 security/correlate.py가 둘 다 이 파일만 import하게 한다.\n이 파일은 모듈 수준에서 db / alert / config / ip_utils만 import한다. 영구 잠금 이벤트를\n상관분석(correlate)에 흘려보내는 부분만 함수 안에서 늦게 import한다(순환 방지).\n설계 원칙 (docs의 permanent-lock 계획서 1.1 참고)\n- \"영구\"는 시간이 아니라 해제 조건의 문제다: 자동 만료가 없고 이메일 인증이나\n관리자 수동 해제로만 풀린다.\n- IP 영구 잠금은 이메일로 \"해제\"하지 않고 본인+본인 기기에게만 \"예외\"를 발급한다.\n- 허용 목록(PERMANENT_LOCK_IP_ALLOWLIST)의 IP는 절대 영구 잠그지 않는다(자충수 방지).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/lockdown.py"}, "routes/recovery.py": {"role": "routes/recovery.py — 이메일 인증으로 영구 잠금을 풀거나(계정) 본인 기기만 통과시키는(IP) 복구 화면 4개 (guide34-a) GET  /recovery           아이디 입력 폼 POST /recovery/request   복구 메일 발송 (항상 같은 응답", "header": "routes/recovery.py — 이메일 인증으로 영구 잠금을 풀거나(계정) 본인 기기만 통과시키는(IP)\n복구 화면 4개 (guide34-a)\nGET  /recovery           아이디 입력 폼\nPOST /recovery/request   복구 메일 발송 (항상 같은 응답)\nGET  /recovery/verify    메일 링크가 여는 확인 화면 (토큰을 소비하지 않음)\nPOST /recovery/verify    토큰/6자리 코드를 소비하고 실제로 해제·예외 발급\n보안 원칙 (계획서 1.3-C)\n- 계정 존재 여부를 숨긴다: 아이디가 없든, 잠기지 않았든, 복구 대상이 아니든 항상 같은\n문구·비슷한 응답 시간으로 답한다.\n- 메일 보안 스캐너가 링크를 먼저 GET으로 열어도 토큰이 닳지 않게, GET은 확인 화면만\n보여주고 토큰은 POST에서만 소비한다.\n- 링크는 request.host_url(공격자가 조작 가능한 Host 헤더)이 아니라 PUBLIC_BASE_URL로만 만든다.\n- 토큰·코드는 SHA-256 해시만 저장하고, 비교는 hmac.compare_digest로 한다.\n- IP 복구는 \"복구를 요청한 그 기기\"에서만 완료된다(피해자의 메일 링크를 공격자의 요청과\n엮어서 공격자 기기에 예외를 발급받는 시나리오 차단).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/recovery.py"}, "services/email_verification.py": {"role": "services/email_verification.py — \"이메일 담당\": 이메일 인증 / 이메일 변경 확인 링크를 만들고 처리한다 (guide40) 왜 필요한가: 비밀번호 재설정(guide41)은 \"계정을 되찾는 메일\"이라 확인된 주소로만 보내야 한다. 그런데 지금까지 가입 이메일은", "header": "services/email_verification.py — \"이메일 담당\": 이메일 인증 / 이메일 변경 확인 링크를 만들고 처리한다 (guide40)\n왜 필요한가: 비밀번호 재설정(guide41)은 \"계정을 되찾는 메일\"이라 확인된 주소로만 보내야 한다.\n그런데 지금까지 가입 이메일은 형식만 검사했고(오타·남의 주소 그대로 저장), 이메일 변경은 세션만\n있으면 비밀번호 확인도 없이 바로 됐다(세션 탈취 → 이메일 바꿔치기 → 계정 탈취). 이 모듈이\n1) 가입 직후·대시보드에서 인증 링크를 보내고(EMAIL_VERIFY → users.email_status = VERIFIED)\n2) 이메일 변경을 \"새 주소로 보낸 링크를 눌러야 반영\"되게 하고(EMAIL_CHANGE), 바뀌면 옛 주소로 알린다.\n원칙은 영구 잠금 복구(routes/recovery.py)와 같다 — 토큰은 해시만 저장, 링크는 PUBLIC_BASE_URL로만,\nGET은 확인 화면만(메일 스캐너가 미리 열어도 안 닳게) 실제 처리는 POST에서 조건부 1회 소비.\n메일 링크를 눌렀다는 것 자체가 그 메일함의 주인이라는 증거라서, 처리하면 VERIFIED가 된다.\n비밀번호 재설정(guide41)도 같은 표(email_tokens, PASSWORD_RESET)와 같은 원칙으로 이 파일이 처리한다 —\n단, 재설정 메일은 \"계정을 되찾는 메일\"이라 VERIFIED 주소에만 보낸다.\n라우트(routes/member.py, routes/email.py, routes/auth.py, routes/password.py, routes/recovery.py)는 \"언제\" 부를지만 정하고, 실제\n판단·발송은 전부 이 파일이 한다 — notify/alert.py·notify/mailer.py처럼 결과를 예외 대신 값으로 돌려준다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/services/email_verification.py"}, "db/_client.py": {"role": "db/_client.py — Supabase 연결과 공용 시각 헬퍼 원래 db.py 최상단에 있던 부분을 그대로 옮겨왔다. db 패키지의 다른 모든 모듈(attempts.py, users.py 등)이 이 파일의 get_client()/_now_iso()를 쓴다.", "header": "db/_client.py — Supabase 연결과 공용 시각 헬퍼\n원래 db.py 최상단에 있던 부분을 그대로 옮겨왔다. db 패키지의 다른 모든\n모듈(attempts.py, users.py 등)이 이 파일의 get_client()/_now_iso()를 쓴다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/_client.py"}, "tests/test_config.py": {"role": "자동 테스트 파일. 해당 기능이 의도대로 동작하는지 pytest 로 검증한다.", "header": "test_config.py — \"회귀 테스트(regression test)\"\n회귀 테스트란: 기획서에서 정해둔 숫자(5회, 60초, 300초)를 나중에 누군가\n실수로 바꿔도 곧바로 알아챌 수 있게, \"이 값들은 항상 이래야 한다\"고\n못 박아두는 테스트다. 로직을 검증하는 게 아니라 \"숫자 자체\"를 지킨다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/tests/test_config.py"}, "tests/test_detector.py": {"role": "자동 테스트 파일. 해당 기능이 의도대로 동작하는지 pytest 로 검증한다.", "header": "test_detector.py — security/detector.py(판사 역할)가 진짜 Supabase 없이도\n올바르게 판단하는지 확인하는 단위 테스트\nmonkeypatch란? pytest가 기본으로 제공하는 도구로, 테스트가 끝나면 자동으로\n원래 상태로 되돌려주는 \"임시 부품 교체\"다. 여기서는 db.count_recent_failures와\ndb.get_active_lockout을 \"내가 정해준 값을 그대로 돌려주는 가짜 함수\"로 잠깐\n바꿔치기해서, 진짜 데이터베이스에 접속하지 않고도 security/detector.py의 판정\n로직(부등호 비교, None 여부 확인)만 순수하게 확인한다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/tests/test_detector.py"}, "tests/test_soar.py": {"role": "자동 테스트 파일. 해당 기능이 의도대로 동작하는지 pytest 로 검증한다.", "header": "test_soar.py — security/soar/ 패키지(집행관 역할)가 db / notify/alert.py를 올바른 순서와\n조건으로 호출하는지 확인하는 단위 테스트\n여기서 확인하고 싶은 건 \"정말로 Slack에 메시지가 갔는가\"가 아니라\n\"security/soar/가 db.create_lockout과 alert.send_lockout_alert를 올바르게,\n올바른 값으로, 올바른 순서로 호출하는가\"이다. 그래서 진짜 함수 대신\n\"호출된 사실을 기록만 해두는 가짜 함수\"로 바꿔치기해서 확인한다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/tests/test_soar.py"}, "tests/test_correlate.py": {"role": "자동 테스트 파일. 해당 기능이 의도대로 동작하는지 pytest 로 검증한다.", "header": "test_correlate.py — security/correlate.py(형사 역할)가 \"사건으로 묶어야 하는가\"를\n올바르게 판단하는지 확인하는 단위 테스트 (Track C guide27, SIEM 상관분석)\n여기서는 db가 진짜로 뭘 저장하는지가 아니라, security/correlate.py가 db의\n함수들을 올바른 조건에서, 올바른 값으로 부르는지만 확인한다 — test_soar.py와\n같은 스타일.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/tests/test_correlate.py"}, "tests/test_app.py": {"role": "자동 테스트 파일. 해당 기능이 의도대로 동작하는지 pytest 로 검증한다.", "header": "test_app.py — Flask 테스트 클라이언트로 실제 라우트(/login, /admin/*, /api/*)를\n검증하는 통합 테스트\n지금까지의 테스트(test_detector.py, test_db.py 등)는 함수 하나하나를 따로\n떼어내 검증하는 \"단위 테스트\"였다. guide08_testing.md도 \"진짜 서버 없이\n코드만 자동으로 검증\"으로 범위를 단위 테스트에 의도적으로 한정해뒀었다.\n하지만 단위 테스트만으로는 \"라우트 등록이 맞는지\", \"login_required 문지기가\n실제로 막아주는지\", \"CSRF 토큰 없이 폼을 제출하면 정말 거부되는지\" 같은\n부품들이 \"조립됐을 때\"의 동작은 확인할 수 없다 — 부품 하나하나가 멀쩡해도\n조립이 잘못되면(예: 데코레이터를 빼먹음) 개별 테스트는 여전히 통과하기\n때문이다. Flask의 test_client()는 진짜 네트워크 서버를 띄우지 않고도 이\n\"조립된 상태\"를 검증할 수 있게 해준다.\ndb/detector/soar/geoip 쪽 실제 Supabase 접속은 conftest.py의 flask_app\nfixture가 이미 막아뒀고(가짜 환경변수 + ensure_bootstrap_admin 무력화),\n각 테스트는 그 테스트가 실제로 거치는 함수만 monkeypatch로 가짜 응답을\n채워넣는다 — 나머지 함수가 호출되면 진짜 Supabase로 네트워크 요청이 나가\n테스트가 느려지거나 실패하므로, \"이 테스트에 필요한 것만\" 최소한으로 막는다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/tests/test_app.py"}, "tests/test_helpers.py": {"role": "자동 테스트 파일. 해당 기능이 의도대로 동작하는지 pytest 로 검증한다.", "header": "test_helpers.py — helpers/request_utils.py의 get_request_ip()/is_bot_submission()이\n올바르게 판단하는지 확인하는 단위 테스트 (L7 공격 보강 계획 Tier 3)\nget_request_ip()는 request.remote_addr/request.headers를 읽어야 하므로,\nflask_app.test_request_context()로 \"가짜 요청이 지금 들어온 척\"하는 상황을\n만들어서 그 안에서 호출한다. conftest.py의 flask_app fixture를 그대로\n재사용한다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/tests/test_helpers.py"}, "tests/test_geoip.py": {"role": "자동 테스트 파일. 해당 기능이 의도대로 동작하는지 pytest 로 검증한다.", "header": "test_geoip.py — services/geoip.py가 캐시를 올바르게 활용하는지, 문자열을 올바르게\n조립하는지 확인하는 단위 테스트\n여기서는 진짜 ip-api.com에 접속하지 않는다. requests.get 자체를 가짜로\n바꿔치기해서 \"외부 API가 이런 응답을 줬다고 치자\"는 상황을 만들고,\ndb.get_cached_ip_locations / db.save_ip_location도 가짜로 바꿔서 진짜\nSupabase 없이 \"캐시에 있었다/없었다\"는 상황을 마음대로 조작한다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/tests/test_geoip.py"}, "tests/test_permanent_lock.py": {"role": "자동 테스트 파일. 해당 기능이 의도대로 동작하는지 pytest 로 검증한다.", "header": "test_permanent_lock.py — 영구 잠금(guide33)의 승격·해제·DB 보호 로직 단위 테스트\nsecurity/lockdown.py(승격/해제 본체), security/soar/·security/correlate.py의 연결 지점, db/lockouts.py·\ndb/account_lockouts.py의 \"영구 잠금 보호\"를 확인한다. 다른 테스트들과 같은 방식으로\n진짜 Supabase 대신 db/alert 함수를 \"호출 기록용 가짜\"로 바꿔치기한다.\n이 파일은 conftest.py의 영구 잠금 기본 stub(autouse)을 꺼야 실제 함수를 테스트할 수\n있어서 real_lockdown 마커를 단다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/tests/test_permanent_lock.py"}, "tests/test_recovery.py": {"role": "자동 테스트 파일. 해당 기능이 의도대로 동작하는지 pytest 로 검증한다.", "header": "test_recovery.py — 이메일 복구(guide34-a): mailer, /recovery 4개 엔드포인트, 영구 잠금 상태의\n로그인/가입 판정(예외 통과·회수)을 검증한다.\n진짜 SMTP/Supabase 대신 (1) smtplib.SMTP를 가짜로, (2) db 함수를 메모리 저장소로\n바꿔치기해서 \"복구 요청 → 메일 → 링크/코드 → 해제\" 전체 흐름을 코드로 재현한다.\n이 파일은 영구 잠금 기본 stub(autouse)을 꺼야 해서 real_lockdown 마커를 단다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/tests/test_recovery.py"}, "tests/test_password_reset.py": {"role": "자동 테스트 파일. 해당 기능이 의도대로 동작하는지 pytest 로 검증한다.", "header": "test_password_reset.py — 비밀번호 찾기(재설정) (guide41)\n- 요청: 인증된(VERIFIED) 계정에만 메일, 아이디 없음·미인증·반송·한도는 메일 없이 같은 화면,\nIP 빈도 제한, 허니팟, 프로필에서 넘어올 때 아이디 미리 채우기\n- 재설정: GET은 소비 안 함, 형식이 틀리면 링크가 닳지 않음, 성공하면 세션 세대 번호가 올라\n다른 기기 로그아웃 + 알림, 재사용·이메일 변경 후의 옛 링크는 무효\n- 용도 분리: 재설정 토큰은 /email/confirm에서, 인증 토큰은 /password/reset에서 쓰이지 않는다", "github": "https://github.com/dyj02056/login-watchdog/blob/main/tests/test_password_reset.py"}, "tests/test_db.py": {"role": "자동 테스트 파일. 해당 기능이 의도대로 동작하는지 pytest 로 검증한다.", "header": "test_db.py — db 패키지(db/admin.py)의 verify_admin_credentials()가 비밀번호를 정확히\n구분해내는지 확인하는 단위 테스트\n이 함수는 내부에서 Supabase에 접속(get_client())해야 하는데, 테스트에서는\n진짜로 접속하고 싶지 않다. 그래서 \"Supabase 클라이언트인 척하는 가짜 객체\n(FakeSupabaseClient)\"를 만들어서 db.get_client()가 그 가짜 객체를 돌려주도록\n바꿔치기한다. 진짜 db 코드(verify_admin_credentials 자체)는 손대지 않고\n그대로 실행시키면서, 그 코드가 딛고 서는 \"바닥(Supabase 연결)\"만 가짜로\n깔아주는 방식이다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/tests/test_db.py"}, "tests/test_polling.py": {"role": "자동 테스트 파일. 해당 기능이 의도대로 동작하는지 pytest 로 검증한다.", "header": "test_polling.py — 대시보드·게시글 화면 폴링 줄이기 (guide45)\n폴링 부품(public/js/polling.js)의 동작 자체(숨기면 멈춤, 돌아오면 즉시 갱신, 요청 겹침\n없음, 실패해도 계속)는 가짜 브라우저 환경의 Node 스크립트로 검증했다 — 이 프로젝트에는\n자바스크립트 테스트 환경이 없다. 여기서는 그 부품이 제대로 연결돼 있는지와 서버 쪽 변경을 지킨다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/tests/test_polling.py"}, "scripts/simulation/_sim_common.py": {"role": "공격 시뮬레이터. 로컬 서버에 가짜 공격을 보내 탐지가 일어나는지 확인한다(내 컴퓨터 서버에만 실행되는 안전장치 포함).", "header": "scripts/simulation/_sim_common.py — 공격 시뮬레이션 스크립트(*_sim.py)가 같이 쓰는 작은 도우미\nbruteforce_sim / macro_bot_sim / repeated_access_sim / spam_sim이 똑같은\nis_local_host()를, signup_abuse_sim / spam_sim이 똑같은 CSRF 토큰 추출기를 각자\n복사해 들고 있어서 한 곳으로 모았다(docs/refactor/2026-10-09-module-plan.md 5단계).\n시뮬레이션 스크립트는 `python scripts/xxx_sim.py`로 실행하므로 scripts/ 폴더가\nsys.path 맨 앞에 들어가 `from _sim_common import ...`로 바로 가져올 수 있다.\n파일 이름 앞의 밑줄(_)은 \"직접 실행하는 스크립트가 아니라 부품\"이라는 표시다.\n다른 시뮬레이션(password_spraying_sim / web_scanning_sim / unauthorized_access_sim)은\n루프백 판정·응답 검증을 더 엄격하게 따로 구현하고 있어서 여기로 합치지 않았다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/simulation/_sim_common.py"}, "scripts/simulation/critical/bruteforce_sim.py": {"role": "공격 시뮬레이터. 로컬 서버에 가짜 공격을 보내 탐지가 일어나는지 확인한다(내 컴퓨터 서버에만 실행되는 안전장치 포함).", "header": "bruteforce_sim.py — /login에 대한 브루트포스 공격을 흉내내서, IP 잠금이\n정말로 6번째 시도에서 걸리는지 자동으로 확인하는 검증 스크립트\nresearch.md(공격 시뮬레이션 절)와 plan.md(검증 절차)에 적힌 스펙:\n1) 일부러 틀린 비밀번호로 /login에 POST 요청을 5회 순차 전송한다\n(config.FAILURE_THRESHOLD 기본값 5회 = \"60초 안에 5번 틀리면 잠금\").\n2) 6번째 요청을 한 번 더 보내서, 응답 본문에 \"잠긴 계정\" 문구가\n포함되는지 확인한다 — 포함되면 잠금이 정상 동작한 것이다.\n안전 원칙(research.md에 명시): 이 스크립트는 팀이 소유한 로컬 서버(기본값\nhttp://127.0.0.1:5000)만 대상으로 한다. 실제 서비스나 타인의 서버에 이\n스크립트를 실행하는 것은 절대 금지된다 — 그래서 --host로 localhost/127.0.0.1이\n아닌 주소를 지정하면 --i-know-what-im-doing 플래그 없이는 실행을 거부한다.\n--ip 옵션(선택): 로컬 환경에서는 팀원 전원이 똑같이 127.0.0.1로 접속하게\n되어 \"서로 다른 공격자 IP에서 왔다\"는 상황을 재현할 수 없다. helpers/request_utils.py의\nget_request_ip()는 config.TRUST_FORWARDED_FOR가 true일 때만(데모 전용 설정)\nX-Forwarded-For 헤더 값을 진짜 접속 IP처럼 믿어주므로, 이 옵션을 쓰면 그\n헤더에 원하는 IP를 실어 보내 \"가짜 공격자 IP\"를 흉내낼 수 있다. 단, 대상\n서버의 TRUST_FORWARDED_FOR가 false(운영 환경의 기본값이자 권장값)라면 서버가\n이 헤더를 무시하고 진짜 접속 IP를 그대로 쓰므로 이 옵션은 아무 효과가 없다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/simulation/critical/bruteforce_sim.py"}, "scripts/simulation/critical/distributed_bruteforce_sim.py": {"role": "공격 시뮬레이터. 로컬 서버에 가짜 공격을 보내 탐지가 일어나는지 확인한다(내 컴퓨터 서버에만 실행되는 안전장치 포함).", "header": "distributed_bruteforce_sim.py — \"분산 브루트포스(DISTRIBUTED_BRUTE_FORCE)\"를 흉내 내서,\nIP가 아니라 \"계정 단위\" 잠금이 걸리는지 확인하는 검증 스크립트 (Tier 1: 분산/저속 대응)\n분산 브루트포스란? 한 계정만 노리되 IP를 계속 바꿔가며 시도하는 공격이다(봇넷·프록시 로테이션).\n각 IP는 몇 번 틀리지 않아 \"IP당 5회 초과\" 규칙(bruteforce_sim.py가 확인하는 IP 잠금)을 피해 가지만,\n서버는 IP와 무관하게 \"그 계정이 총 몇 번 틀렸는가\"(ACCOUNT_FAILURE_THRESHOLD, 기본 8회 초과)도\n세기 때문에 결국 계정이 잠긴다.\n동작 요약:\n1) 가짜 IP --ips개(기본 3개) 각각이 같은 아이디에 틀린 비밀번호를 --per-ip번(기본 3번)씩 번갈아 시도한다.\nIP당 횟수는 IP 잠금 기준(5회) 아래로 유지하고, 전체 합(기본 9회)만 계정 기준(8회)을 넘긴다.\n2) 마지막에 \"한 번도 실패한 적 없는 새 IP\"로 같은 아이디를 한 번 더 시도한다.\n그 IP는 깨끗한데도 계정 잠금 안내가 나오면 IP가 아니라 \"계정\"이 잠긴 것이다 → 성공.\n안전 원칙: 로컬 서버(기본 http://127.0.0.1:5000)만 대상으로 한다. 가짜 IP는 서버의\nTRUST_FORWARDED_FOR=true일 때만 반영된다(꺼져 있으면 모든 요청이 한 IP로 보여 IP 잠금이 먼저 걸린다).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/simulation/critical/distributed_bruteforce_sim.py"}, "scripts/simulation/critical/admin_bruteforce_sim.py": {"role": "공격 시뮬레이터. 로컬 서버에 가짜 공격을 보내 탐지가 일어나는지 확인한다(내 컴퓨터 서버에만 실행되는 안전장치 포함).", "header": "admin_bruteforce_sim.py — 관리자 로그인(/admin/login)에 대한 브루트포스(ADMIN_BRUTE_FORCE)를\n흉내 내서, IP 잠금이 걸리는지 확인하는 검증 스크립트\n관리자 계정이 뚫리면 회원 삭제·잠금 해제 등 전부 장악당하므로 /admin/login도 /login과 같은 IP 잠금\n(60초 안에 5회 \"초과\" 실패 → 잠금)을 적용한다. 영구 잠금까지 올라가면 이메일 복구 없이 관리자만 풀 수 있다.\n동작 요약:\n1) 가짜 IP 하나로 /admin/login에 틀린 비밀번호를 --attempts번(기본 6번) 연속 제출한다.\n2) 잠금이 걸렸다면 그다음 시도(--attempts + 1번째)는 비밀번호 확인도 없이 잠금 문구로 거절된다 → 성공.\n안전 원칙: 로컬 서버만 대상으로 한다. 이 시뮬레이션이 잠그는 것은 가짜 IP뿐이라 관리자 본인은 영향이 없다\n(서버의 TRUST_FORWARDED_FOR=true일 때). 꺼져 있으면 실제 접속 IP가 잠기니, 그때는 unlock_ip.py로 풀어야 한다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/simulation/critical/admin_bruteforce_sim.py"}, "scripts/simulation/critical/admin_distributed_bruteforce_sim.py": {"role": "공격 시뮬레이터. 로컬 서버에 가짜 공격을 보내 탐지가 일어나는지 확인한다(내 컴퓨터 서버에만 실행되는 안전장치 포함).", "header": "admin_distributed_bruteforce_sim.py — 관리자 계정에 대한 분산 브루트포스\n(ADMIN_DISTRIBUTED_BRUTE_FORCE)를 흉내 내서, 관리자 \"계정 단위\" 잠금이 걸리는지 확인하는 검증 스크립트\n(guide38)\ndistributed_bruteforce_sim.py(회원)의 관리자 버전이다. 한 관리자 아이디를 여러 IP에서 나눠 시도하면\nIP당 실패는 5회 이하라 IP 잠금은 피하지만, 15분(ADMIN_ACCOUNT_DETECTION_WINDOW_SECONDS) 안의 총 실패가\nADMIN_ACCOUNT_FAILURE_THRESHOLD(기본 8회)를 \"초과\"하면 그 아이디가 5분간 계정 단위로 잠긴다.\n아이디가 실제로 있든 없든 같은 기준·같은 문구로 잠가서 관리자 아이디 존재 여부가 드러나지 않는다.\n동작 요약:\n1) 가짜 IP --ips개(기본 3개)가 같은 관리자 아이디에 틀린 비밀번호를 --per-ip번(기본 3번)씩 번갈아 시도한다.\n2) 한 번도 실패한 적 없는 새 IP로 같은 아이디를 한 번 더 시도한다. 깨끗한 IP인데도 잠금 문구가\n나오면 IP가 아니라 아이디가 잠긴 것이다 → 성공.\n안전 원칙: 로컬 서버만 대상. 가짜 IP는 서버의 TRUST_FORWARDED_FOR=true일 때만 반영된다. 허용 목록\n(PERMANENT_LOCK_IP_ALLOWLIST, 관리자 PC) IP는 계정 잠금을 건너뛰므로 가짜 IP(문서용 대역)를 쓴다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/simulation/critical/admin_distributed_bruteforce_sim.py"}, "scripts/simulation/critical/permanent_lock_sim.py": {"role": "공격 시뮬레이터. 로컬 서버에 가짜 공격을 보내 탐지가 일어나는지 확인한다(내 컴퓨터 서버에만 실행되는 안전장치 포함).", "header": "permanent_lock_sim.py — 상습 공격자가 임시 잠금을 반복해서 받다가 \"영구 잠금(PERMANENT)\"으로 올라가는\n에스컬레이션(T1: REPEAT_OFFENDER)을 흉내 내서, 서버가 실제로 영구 차단하는지 확인하는 검증 스크립트\n(guide33)\n임시 잠금(기본 5분)은 시간이 지나면 풀린다. 그런데 같은 IP가 30일(PERMANENT_LOCK_STRIKE_WINDOW_DAYS) 안에\n임시 잠금을 PERMANENT_LOCK_STRIKE_COUNT번(기본 2번) 받으면 서버는 \"상습범\"으로 보고 자동 만료가 없는\n영구 잠금으로 올린다. 허용 목록(PERMANENT_LOCK_IP_ALLOWLIST) IP는 절대 영구 잠그지 않으므로 가짜 IP를 쓴다.\n동작 요약:\n1) 가짜 IP로 /login에 틀린 비밀번호를 6번 보내 첫 번째 임시 잠금을 건다.\n2) 임시 잠금이 자동으로 풀릴 때까지 기다린다(--wait-seconds, 기본 LOCKOUT_DURATION_SECONDS 300초 + 여유 5초).\n3) 다시 6번 보내 두 번째 임시 잠금을 건다 → 서버가 상습범으로 판단해 영구 잠금으로 올린다.\n4) 한 번 더 시도했을 때 \"이 네트워크는 차단되어 있습니다\"(영구 잠금 문구)가 나오면 성공.\n안전 원칙: 로컬 서버만 대상. 가짜 IP는 서버의 TRUST_FORWARDED_FOR=true일 때만 반영된다. 영구 잠금은\n자동으로 풀리지 않으니 시연 뒤에는 `python scripts/management/unlock_ip.py --ip <IP> --permanent`로 푼다.\n5분 넘게 기다리기 싫으면 서버를 LOCKOUT_DURATION_SECONDS=10 같은 값으로 띄우고 --wait-seconds 12를 쓴다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/simulation/critical/permanent_lock_sim.py"}, "scripts/simulation/critical/incident_correlation_sim.py": {"role": "공격 시뮬레이터. 로컬 서버에 가짜 공격을 보내 탐지가 일어나는지 확인한다(내 컴퓨터 서버에만 실행되는 안전장치 포함).", "header": "incident_correlation_sim.py — 한 IP가 정찰 → 침투 시도 → 브루트포스를 차례로 벌이는 \"다단계 공격\"을\n흉내 내서, 서버가 흩어진 이벤트를 하나의 사건(incident)으로 묶고 영구 차단까지 하는지 확인하는 검증 스크립트\n(guide27 SIEM 상관분석 / guide28 SOAR 플레이북 / guide33 T3)\n서버는 같은 IP가 5분(INCIDENT_CORRELATION_WINDOW_MINUTES) 안에 서로 다른 종류의 이벤트를 2개 이상 남기면\n사건으로 묶고, 최고 위험등급이 CRITICAL이면서 종류가 3개 이상이면 에스컬레이션 알림(CRITICAL_MULTI_STAGE)을\n보낸다. CRITICAL 사건이 되면 그 IP를 즉시 영구 잠금으로 올린다(T3).\n동작 요약 (모두 같은 가짜 IP):\n1) 정찰: 없는 경로를 11번 요청 → WEB_SCANNING (MEDIUM)\n2) 침투 시도: 로그인 없이 /api/status를 11번 요청 → UNAUTHORIZED_ACCESS (MEDIUM)\n3) 공격: /login에 틀린 비밀번호 6번 → BRUTE_FORCE (CRITICAL)\n4) 한 번 더 시도했을 때 \"이 네트워크는 차단되어 있습니다\"(영구 잠금 문구)가 나오면 성공.\n안전 원칙: 로컬 서버만 대상. 가짜 IP는 서버의 TRUST_FORWARDED_FOR=true일 때만 반영된다. 시연 뒤에는\n`python scripts/management/unlock_ip.py --ip <IP> --permanent`로 영구 잠금을 푼다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/simulation/critical/incident_correlation_sim.py"}, "scripts/simulation/critical/password_spraying_sim.py": {"role": "공격 시뮬레이터. 로컬 서버에 가짜 공격을 보내 탐지가 일어나는지 확인한다(내 컴퓨터 서버에만 실행되는 안전장치 포함).", "header": "password_spraying_sim.py — \"패스워드 스프레이(Password Spraying)\" 공격을\n흉내 내서, 우리 서버가 이를 탐지하는지 확인하는 검증 스크립트\n패스워드 스프레이란? 브루트포스(한 계정에 비밀번호를 수십 번 바꿔가며\n시도)와 반대로, \"같은 비밀번호 하나\"를 \"서로 다른 여러 아이디\"에 돌아가며\n시도하는 공격이다. 계정 하나만 노리지 않으므로 \"한 계정에 5번 틀리면\n잠금\" 같은 단순한 규칙은 피해갈 수 있는데, 대신 \"같은 IP·같은 세션에서\n짧은 시간에 서로 다른 아이디로 여러 번 실패\"라는 패턴이 남는다. 이\n스크립트는 바로 그 패턴을 재현해서 서버가 알아채는지 확인한다.\n동작 요약:\n1) 하나의 세션(=하나의 접속)을 계속 유지한 채, /login에 POST로 로그인을\n시도한다.\n2) 매 요청마다 \"아이디\"는 바꾸지만 \"비밀번호\"는 항상 똑같은(일부러 틀린)\n값을 쓴다 — IP와 세션도 고정한다.\n3) 기본 6번 시도하며, FAILURE_THRESHOLD(5)를 넘는 6번째 요청이\n\"이쯤이면 서버가 의심해야 하는 시점\"이다.\n4) 실제로 로그인 페이지가 CSRF 토큰(위조 방지용 1회용 값)을 요구하므로,\n매번 로그인 폼을 먼저 GET으로 열어서 토큰을 받아온 뒤 그 토큰을\n포함해 POST를 보낸다 — 실제 브라우저 사용자와 똑같은 절차를 따른다.\n안전 원칙: 기본적으로 로컬 서버(loopback: 127.0.0.1/localhost)만 대상으로\n허용하며, 그 외 주소는 --i-know-what-im-doing 플래그 없이는 거부한다.\n비밀번호나 CSRF 토큰 같은 민감한 값은 화면에 그대로 출력하지 않고\n<REDACTED>(가림 처리)로 바꿔서 보여준다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/simulation/critical/password_spraying_sim.py"}, "scripts/simulation/high/signup_abuse_sim.py": {"role": "공격 시뮬레이터. 로컬 서버에 가짜 공격을 보내 탐지가 일어나는지 확인한다(내 컴퓨터 서버에만 실행되는 안전장치 포함).", "header": "signup_abuse_sim.py\n목적:\n짧은 시간 동안 서로 다른 계정의 회원가입 요청을 반복하여\n자동화된 계정 생성 남용(Signup Flooding) 패턴을 발생시킨다.\n담당 범위:\n이 프로그램은 비정상적인 회원가입 요청을 발생시키는 역할만 담당한다.\n탐지, 기록, 경고 및 차단은 서버의 탐지 프로그램에서 처리한다.\n기본 시나리오:\n1. GET /signup으로 CSRF 토큰과 세션 쿠키 획득\n(CSRF 토큰이란: 다른 사이트가 사용자 몰래 이 사이트에 요청을 대신\n보내는 것을 막기 위해, 서버가 화면을 열 때마다 한 번씩 발급하는\n1회용 비밀 값이다. 이 토큰 없이 POST를 보내면 서버가 거절한다.)\n2. 고유한 아이디와 이메일을 생성\n3. POST /signup 요청을 짧은 간격으로 DEFAULT_ATTEMPTS(기본 3)회 전송\n서버 임계값과의 관계:\nconfig.py의 SIGNUP_RATE_LIMIT 기본값은 5다(\"60초 안에 같은 IP가 5번\n넘게 가입을 시도하면 거부\"). 임계값을 실제로 \"초과\"시키려면\n5+1=6번 이상 보내야 하므로, 이 목적으로 쓰려면 run()을 호출할 때\nattempts=6 이상으로 지정해야 한다. 기본값 3은 정상적인 소량 가입만\n재현하며, 별도의 --attempts 같은 커맨드라인 옵션은 없으므로 값을\n바꾸려면 아래 DEFAULT_ATTEMPTS 상수나 run() 호출부를 직접 수정한다.\n안전 원칙:\n실제 테스트 계정이 DB에 생성되므로 로컬 또는 팀 소유 테스트 서버에서만\n사용해야 한다. 테스트 후 생성된 계정은 관리자 화면에서 삭제한다.\n허니팟:\nwebsite 필드가 채워지면 서버가 즉시 봇으로 판단한다.\n이번 시나리오는 회원가입 빈도 제한을 시험하므로 website는 비워둔다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/simulation/high/signup_abuse_sim.py"}, "scripts/simulation/high/spam_sim.py": {"role": "공격 시뮬레이터. 로컬 서버에 가짜 공격을 보내 탐지가 일어나는지 확인한다(내 컴퓨터 서버에만 실행되는 안전장치 포함).", "header": "spam_sim.py\n목적:\n테스트 계정으로 로그인한 뒤 짧은 시간 동안 게시글을 반복 등록하여\n스팸성 데이터 대량 유입 패턴을 발생시키는 시뮬레이션 프로그램이다.\n담당 범위:\n이 프로그램은 스팸 게시글 작성 요청을 발생시키는 역할만 담당한다.\n서버의 탐지·기록·차단 여부는 탐지 프로그램에서 처리한다.\n기본 동작:\n1. GET /login 요청으로 CSRF 토큰과 세션 쿠키 획득\n2. POST /login 요청으로 테스트 계정 로그인\n3. GET /board/new 요청으로 게시글 작성용 CSRF 토큰 획득\n4. POST /board/new 요청을 짧은 간격으로 DEFAULT_ATTEMPTS(기본 6)회 반복 전송\n서버 임계값과의 관계:\nconfig.py의 POST_RATE_LIMIT 기본값은 5다(\"같은 IP가 60초 안에\n게시글을 5번 넘게 작성하면 거부\"). 임계값을 실제로 \"초과\"시키려면\n5+1=6번 이상 보내야 하는데, 이 스크립트의 기본 6회가 정확히 그\n지점이다. 즉 1~5번째 요청은 정상적으로 통과하고, 6번째 요청에서\n서버가 거부해야 정상 동작이다.\n이 스크립트가 하지 않는 것:\n댓글 작성(COMMENT_RATE_LIMIT)이나 회원가입(SIGNUP_RATE_LIMIT) 반복은\n다루지 않는다. 오직 \"로그인한 사용자의 게시글 작성 남용\"만 재현한다.\n주의:\n실제 게시글 데이터가 생성되므로 반드시 로컬 서버와 테스트 계정을 사용한다.\n테스트 후 생성된 게시글은 관리자 화면에서 삭제한다.\n허니팟:\n이 프로젝트는 website 필드가 채워져 있으면 봇으로 판단한다.\n게시글 스팸 시나리오에서는 website를 빈 문자열로 전송한다.\nUSERNAME: bot09211242321\nPASSWORD 설정: True", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/simulation/high/spam_sim.py"}, "scripts/simulation/high/comment_spam_sim.py": {"role": "공격 시뮬레이터. 로컬 서버에 가짜 공격을 보내 탐지가 일어나는지 확인한다(내 컴퓨터 서버에만 실행되는 안전장치 포함).", "header": "comment_spam_sim.py — 로그인한 계정이 댓글을 짧은 시간에 반복 등록하는 \"댓글 도배(COMMENT_RATE_LIMIT)\"를\n흉내 내서, 댓글 작성 한도가 정말로 막아주는지 확인하는 검증 스크립트 (spam_sim.py의 댓글 버전)\n서버는 같은 IP가 1분 안에 댓글을 COMMENT_RATE_LIMIT번(기본 10번) 쓰면 그다음부터 거부하고\nCOMMENT_RATE_LIMIT(HIGH) 이벤트로 남긴다.\n동작 요약:\n1) 테스트 계정으로 로그인한다(--username/--password 또는 SPAM_TEST_USERNAME/SPAM_TEST_PASSWORD).\n2) 댓글을 달 게시글이 필요하다. --post-id를 주면 그 글을 쓰고, 생략하면 \"[COMMENT-SPAM-TEST]\" 글을 하나 만든다.\n3) 댓글을 --attempts번(기본 12번) 연속 작성한다. 한도를 넘긴 요청은 \"너무 많은 댓글 작성 시도\" 안내와\n함께 거부되므로 그 문구가 나오면 성공.\n안전 원칙: 로컬 서버만 대상. 테스트 글과 댓글은 제목/본문에 \"[COMMENT-SPAM-TEST]\"가 붙어 있어서 관리자\n화면에서 쉽게 찾아 지울 수 있다. 실제 회원 계정이 아니라 테스트 계정으로만 실행한다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/simulation/high/comment_spam_sim.py"}, "scripts/simulation/high/http_flood_sim.py": {"role": "공격 시뮬레이터. 로컬 서버에 가짜 공격을 보내 탐지가 일어나는지 확인한다(내 컴퓨터 서버에만 실행되는 안전장치 포함).", "header": "http_flood_sim.py — \"HTTP 플러딩(대량 요청 도배, HTTP_FLOOD)\"을 흉내 내서, 전역 요청 한도가\n정말로 429(요청이 너무 많음)로 막아주는지 확인하는 검증 스크립트 (Tier 2)\n로그인·가입·글쓰기 같은 \"폼 제출\"에는 각자의 한도가 있지만, 일반 GET 페이지는 예전에 아무리 요청이 쏟아져도\n다 받아줬다. 그래서 같은 IP가 1분(GLOBAL_RATE_LIMIT_PER_MINUTE, 기본 120회)에 전체 요청을 합쳐서 한도를\n넘기면 429로 거절하고 HTTP_FLOOD(HIGH) 이벤트로 남긴다.\n동작 요약:\n1) 가짜 IP 하나로 --path(기본 /login)에 GET을 --requests번(기본 130번, 한도 120 + 여유) 최대한 빠르게 보낸다.\n2) 어느 순간부터 429가 돌아오면 성공. 처음 429가 나온 번째와 총 429 개수를 보여준다.\n안전 원칙: 로컬 서버만 대상. 가짜 IP는 서버의 TRUST_FORWARDED_FOR=true일 때만 반영된다(꺼져 있으면 실제 IP가\n1분간 막힌다). 요청은 가볍지만 한도가 1분 단위이므로, 같은 IP로 반복 실행하면 1분 뒤에 다시 하는 게 좋다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/simulation/high/http_flood_sim.py"}, "scripts/simulation/high/recovery_flood_sim.py": {"role": "공격 시뮬레이터. 로컬 서버에 가짜 공격을 보내 탐지가 일어나는지 확인한다(내 컴퓨터 서버에만 실행되는 안전장치 포함).", "header": "recovery_flood_sim.py — 복구·비밀번호 찾기·이메일 확인 같은 \"메일을 보내거나 코드를 확인하는\" 엔드포인트를\n짧은 시간에 두드려 폭주시키는 공격을 흉내 내서, 엔드포인트별 좁은 요청 한도(429)가 걸리는지 확인하는 검증\n스크립트 (guide37 / guide40 / guide41 / guide43)\n이 엔드포인트들은 전역 한도(분당 120회)보다 훨씬 좁은 한도를 따로 가진다. 복구 요청은 응답마다 고정 시간\n함수를 붙잡고, 이메일·비밀번호 재설정은 남의 주소로 메일을 계속 보내게 만드는 \"메일 폭탄\"에 쓰일 수 있어서다.\n한도를 넘기면 429로 거절하고 HTTP_FLOOD(HIGH) 이벤트로 남긴다.\n--target recovery        POST /recovery/request   분당 5회  (RECOVERY_REQUEST_RATE_LIMIT_PER_MINUTE)\n--target recovery-verify POST /recovery/verify    분당 10회 (RECOVERY_VERIFY_RATE_LIMIT_PER_MINUTE)\n--target password-forgot POST /password/forgot    분당 10회 (PASSWORD_RESET_RATE_LIMIT_PER_MINUTE)\n--target password-reset  POST /password/reset     분당 10회 (PASSWORD_RESET_RATE_LIMIT_PER_MINUTE)\n--target email-confirm   POST /email/confirm      분당 10회 (EMAIL_CONFIRM_RATE_LIMIT_PER_MINUTE)\n동작 요약:\n1) 가짜 IP 하나로 선택한 엔드포인트에 폼을 --attempts번(기본: 한도 + 3번) 연속 제출한다.\n2) 한도를 넘은 요청이 429로 거절되면 성공. 처음 429가 나온 번째를 보여준다.\n안전 원칙: 로컬 서버만 대상. 존재하지 않는 아이디/가짜 토큰만 보내므로 실제로 메일이 나가거나 계정이 바뀌지\n않는다(429 이전의 일반 응답도 \"처리했다\"는 고정 문구만 돌려준다). 가짜 IP는 TRUST_FORWARDED_FOR=true일 때만 반영된다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/simulation/high/recovery_flood_sim.py"}, "scripts/simulation/medium/web_scanning_sim.py": {"role": "공격 시뮬레이터. 로컬 서버에 가짜 공격을 보내 탐지가 일어나는지 확인한다(내 컴퓨터 서버에만 실행되는 안전장치 포함).", "header": "web_scanning_sim.py — \"웹 스캐닝(Web Scanning)\" 공격을 흉내 내서, 우리 서버의\n탐지 로직이 실제로 알림을 울리는지 확인하는 검증 스크립트\n웹 스캐닝이란? 공격자가 로그인도 하지 않은 채 \"/admin.php\", \"/.env\",\n\"/wp-login.php\" 같은, 흔히 취약한 서버에 존재하는 경로들을 무작위로 여러 번\n두드려보며 \"혹시 이 서버에 뚫을 수 있는 부분이 있나?\"를 탐색하는 행위다.\n이 스크립트는 그런 행동을 안전하게 재현해서, 우리 서버가 \"누군가 스캐닝\n중이다\"라고 알아채는지 눈으로 확인하기 위해 만들어졌다.\n동작 요약:\n1) 로그인이나 쿠키 없이, 존재하지 않는 경로로 GET 요청을 11번 순서대로 보낸다.\n2) 경로는 실제 스캐너들이 즐겨 찾는 이름들(TARGETS 목록)을 뒤에 무작위 값을\n붙여서 절대 진짜로 존재하지 않게 만든다 — 그래서 항상 404(없음) 응답을\n기대한다.\n3) 11번 모두 404가 나오고, 전체 소요 시간이 서버의 탐지 시간창(기본 60초)\n안에 들어오면 \"탐지 조건을 재현했다\"고 보고, 이후 실제로 서버가 알림을\n울렸는지는 사람이 직접 로그/Slack/대시보드를 보고 확인해야 한다.\n안전 원칙: 표준 라이브러리만 사용하며(외부 패키지 설치 불필요), 기본 대상은\n로컬 서버(http://127.0.0.1:5000)다. 남의 서버나 실제 운영 중인 서비스에는\n절대 실행하면 안 된다 — 소유하고 있거나 테스트 허락을 받은 서버에서만 쓴다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/simulation/medium/web_scanning_sim.py"}, "scripts/simulation/medium/unauthorized_access_sim.py": {"role": "공격 시뮬레이터. 로컬 서버에 가짜 공격을 보내 탐지가 일어나는지 확인한다(내 컴퓨터 서버에만 실행되는 안전장치 포함).", "header": "unauthorized_access_sim.py — 로그인하지 않은 사람이 관리자 전용 API를\n계속 두드려볼 때, 우리 서버가 \"인가되지 않은 접근(Unauthorized Access)\"으로\n탐지하는지 확인하는 검증 스크립트\n인가되지 않은 접근이란? 로그인 세션(쿠키)도, 어떤 인증 정보도 없는 상태로\n원래 로그인한 사람만 볼 수 있어야 할 API(예: /api/status)를 반복해서\n요청하는 행위다. 정상적인 사용자라면 이런 요청을 보낼 이유가 없으므로,\n짧은 시간 안에 여러 번 발생하면 공격 시도로 의심할 수 있다.\n동작 요약:\n1) 로그인 쿠키가 전혀 없는 \"새 세션\"을 만든다(진짜 브라우저로 한 번도\n로그인하지 않은 사람인 척한다).\n2) 그 세션으로 /api/status에 GET 요청을 11번 순서대로 보낸다.\n3) 서버가 매번 401(인증 안 됨)로 제대로 거절하는지 확인하고, 11번째\n요청(=임계값 10회를 초과한 시점)에서 서버가 \"의심스럽다\"고 판단해\n알림을 울렸는지는 사람이 직접 로그/Slack/대시보드로 확인해야 한다.\n안전 원칙: 기본 대상은 로컬 서버(http://127.0.0.1:5000)이며, 본인이\n소유했거나 테스트 허락을 받은 서버에서만 실행해야 한다. 인증 정보(쿠키,\nAuthorization 헤더 등)를 절대 함께 보내지 않도록 전송 직전에 다시 한번\n검사한다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/simulation/medium/unauthorized_access_sim.py"}, "scripts/simulation/medium/repeated_access_sim.py": {"role": "공격 시뮬레이터. 로컬 서버에 가짜 공격을 보내 탐지가 일어나는지 확인한다(내 컴퓨터 서버에만 실행되는 안전장치 포함).", "header": "repeated_access_sim.py\n목적:\n동일한 IP에서 같은 페이지로 짧은 시간 동안 GET 요청을 반복하여\n비정상적인 고빈도 페이지 접근 패턴을 발생시키는 시뮬레이션 프로그램이다.\n담당 범위:\n이 프로그램은 반복 접근 요청을 발생시키는 역할만 담당한다.\n탐지, 기록, 경고, 차단 여부는 서버의 탐지 프로그램에서 처리한다.\n기본 동작:\n- 대상 서버: http://127.0.0.1:5000\n- 대상 경로: /\n- 요청 횟수: 21회\n- 요청 간격: 0.1초\n- 동일한 requests.Session을 사용하여 같은 사용자의 반복 접근을 표현한다.\n왜 하필 21회인가?\n서버 설정(config.py)의 PAGE_ACCESS_ALERT_THRESHOLD 기본값이 20이다.\n즉 \"같은 IP가 같은 페이지를 60초 안에 20번 넘게 요청하면 의심한다\"는\n뜻이므로, 그 기준을 \"넘기는\" 지점까지 확인하려면 20+1=21번을 보내야\n한다. 로그인 실패 잠금 검증과 같은 이유로 \"초과\"를 기준으로 삼는다:\n정상 사용자가 실수로 몇 번 더 새로고침해도 곧바로 잠기지 않도록 여유를\n주기 때문이다. --attempts로 이 값을 바꾸면 검증하려는 횟수도 함께\n바뀌므로, 서버의 PAGE_ACCESS_ALERT_THRESHOLD 값과 맞춰서 사용해야 한다.\n안전 원칙:\n기본적으로 localhost, 127.0.0.1, ::1만 실행할 수 있다.\n팀이 소유한 외부 테스트 서버에 실행하려면\n--i-know-what-im-doing 옵션을 명시적으로 추가해야 한다.\n--------------------------------------------------------------------------\n사용법\n--------------------------------------------------------------------------\n1. 기본 실행\npython .\\scripts\\repeated_access_sim.py\n2. /login 페이지에 30회 반복 요청\npython .\\scripts\\repeated_access_sim.py --path /login --attempts 30\n3. 요청 사이에 0.5초 간격 적용\npython .\\scripts\\repeated_access_sim.py --interval 0.5\n4. 대기 시간 없이 50회 요청\npython .\\scripts\\repeated_access_sim.py --attempts 50 --interval 0\n5. 가짜 공격자 IP를 X-Forwarded-For 헤더에 포함\npython .\\scripts\\repeated_access_sim.py --ip 192.0.2.10\n주의:\n--ip 옵션은 대상 Flask 서버의 TRUST_FORWARDED_FOR=true 설정이\n활성화된 로컬 데모 환경에서만 실제 접속 IP처럼 반영된다.\n6. 팀이 소유한 외부 테스트 서버에 실행\npython .\\scripts\\repeated_access_sim.py `\n--host https://test.example.com `\n--path /login `\n--attempts 21 `\n--i-know-what-im-doing\n실제 서비스나 허가받지 않은 타인의 서버에는 절대 실행하지 않는다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/simulation/medium/repeated_access_sim.py"}, "scripts/simulation/medium/macro_bot_sim.py": {"role": "공격 시뮬레이터. 로컬 서버에 가짜 공격을 보내 탐지가 일어나는지 확인한다(내 컴퓨터 서버에만 실행되는 안전장치 포함).", "header": "macro_bot_sim.py — 짧은 시간 안에 서로 다른 관리자 API 여러 개를 옮겨 다니며\n호출하는 \"매크로/봇\" 패턴을 흉내내서, 매크로/봇 탐지 로직(Track C guide29)이\n실제로 알림을 울리는지 확인하는 검증 스크립트\n매크로/봇 패턴이란? 사람이 화면을 눌러가며 기능을 하나씩 쓰는 것과 달리,\n스크립트가 짧은 시간 안에 여러 API를 기계적으로 순서대로 호출하는 행위다.\n이 스크립트는 이미 만들어져 있는 관리자 계정으로 로그인한 뒤, 서로 다른\n관리자 API 6개를 순서대로 호출해서 그 패턴을 재현한다\n(config.MACRO_DISTINCT_API_THRESHOLD 기본값 5를 \"초과\"하려면 최소 6개가 필요하다).\n안전 원칙: 실제로 뭔가를 삭제/변경하지 않는 것을 목표로 한다. --username/--password로\nsecurity_viewer 역할 계정(대시보드 조회 말고는 아무 권한도 없음, guide26 참고)을\n넘기면 서버가 6번의 호출을 전부 403(권한 없음)으로 거절한다 — before_request\n훅(helpers/hooks.py의 track_api_access())은 실제 뷰 함수가 실행되기 훨씬 전에 먼저\n실행되므로, 403으로 거절되는 요청도 매크로/봇 탐지 로그에는 정상적으로\n기록된다. 계정이 없다면 먼저 다음처럼 만든다:\npython scripts/management/create_admin.py --username macro_test --password <비밀번호> --role security_viewer\nbruteforce_sim.py/web_scanning_sim.py와 동일한 원칙으로, 팀이 소유한 로컬\n서버(기본값 http://127.0.0.1:5000)만 대상으로 한다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/simulation/medium/macro_bot_sim.py"}, "scripts/simulation/medium/honeypot_bot_sim.py": {"role": "공격 시뮬레이터. 로컬 서버에 가짜 공격을 보내 탐지가 일어나는지 확인한다(내 컴퓨터 서버에만 실행되는 안전장치 포함).", "header": "honeypot_bot_sim.py — 폼의 모든 칸을 기계적으로 채우는 \"봇\"을 흉내 내서, 허니팟(BOT_DETECTED)이\n걸러내는지 확인하는 검증 스크립트 (Tier 3)\n허니팟이란? 로그인·가입·글쓰기 폼에 CSS로 화면에서 안 보이게 숨겨둔 입력칸(\"website\")이다. 사람은 보이지\n않으니 항상 비워 두지만, 폼의 모든 칸을 채우는 자동화 스크립트는 이 칸까지 채운다. 값이 들어 있으면 서버는\n자격 증명을 확인하거나 실패 횟수에 넣지도 않고 곧바로 거절하며 BOT_DETECTED(MEDIUM) 이벤트로 남긴다.\n동작 요약:\n1) 가짜 IP 하나로 /login에 허니팟 칸을 채운 폼을 --login-attempts번(기본 8번) 제출한다.\n진짜 틀린 비밀번호였다면 6번째에 IP가 잠겼겠지만, 허니팟이 먼저 걸러내면 실패로 세지 않으므로\n8번을 보내도 잠금 문구가 한 번도 나오지 않아야 한다.\n2) 같은 방식으로 /signup에 --signup-attempts번(기본 3번) 제출한다. 허니팟에 걸리면 가입 한도를 쓰지 않고\n\"일시적인 오류가 발생했습니다\" 안내만 돌려준다(이 문구는 허니팟에서만 나온다).\n3) 두 조건이 모두 맞으면 성공.\n안전 원칙: 로컬 서버만 대상. 실제 계정이 만들어지거나 로그인되지 않는다(전부 거절). 가짜 IP는 서버의\nTRUST_FORWARDED_FOR=true일 때만 반영된다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/scripts/simulation/medium/honeypot_bot_sim.py"}, "docs/schema.sql": {"role": "DB 전체 정의 파일(표·함수·예약 작업). 부록의 'DB 표 지도'가 여기서 표 정의를 보여준다.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/docs/schema.sql"}}}</script>
<script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var $ = function(id){ return document.getElementById(id); };
  var KIND_LABEL = {screen:"화면 · 도착지", route:"routes", helper:"판단", db:"db", config:"설정값", later:"다른 단원"};

  var state = { sc: 0, node: null, item: 0, file: null };

  function el(tag, attrs, kids){
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function brk(t){ return t.replace(/([\/._])/g, "$1\u200b"); }
  function scen(){ return D.scenarios[state.sc]; }
  function nodeById(id){ return scen().nodes.filter(function(n){ return n.id === id; })[0]; }
  function fnName(label){ return label; }

  /* ---------- 간단 문법 강조 ---------- */
  var PY = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?''')|([rbfRBF]{0,2}"(?:\\.|[^"\\\n])*"|[rbfRBF]{0,2}'(?:\\.|[^'\\\n])*')|\b(def|class|return|if|elif|else|for|while|import|from|as|try|except|finally|with|in|not|and|or|is|None|True|False|raise|pass|lambda|yield|global|nonlocal|assert|del|continue|break)\b|(@[A-Za-z_][\w.]*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(?=\()/g;
  var PYC = [null,"t-c","t-d","t-s","t-k","t-a","t-n","t-f"];
  var HT = /(<!--[\s\S]*?-->)|(\{[{%#][\s\S]*?[}%#]\})|(<\/?[A-Za-z][\w-]*)|("[^"\n]*")|(\/?>)/g;
  var HTC = [null,"t-c","t-a","t-k","t-s","t-k"];
  var JS = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\.|[^`\\])*`)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(const|let|var|function|return|if|else|for|while|import|from|export|default|async|await|try|catch|finally|new|class|extends|typeof|interface|type|null|undefined|true|false|throw|switch|case|break|continue|of|in|as)\b|(@[A-Za-z_]\w*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_$][\w$]*)(?=\()/g;
  var JSC = [null,"t-c","t-s","t-s","t-k","t-a","t-n","t-f"];
  var SQ = /(--[^\n]*|\/\*[\s\S]*?\*\/)|((?!))|('(?:''|[^'])*')|\b(select|from|where|insert|into|values|update|set|delete|create|table|index|alter|add|drop|on|conflict|do|nothing|and|or|not|null|default|primary|key|references|cascade|if|exists|as|order|by|group|limit|desc|asc|join|left|inner|count|returns|function|language|begin|end|return|with|union|all|distinct|in|is|true|false|unique|check|constraint|timestamptz|text|integer|bigint|boolean|interval|now|replace|trigger|view|policy|enable|row|level|security|using)\b|((?!))|\b(\d+(?:\.\d+)?)\b|\b([a-z_]\w*)(?=\()/gi;
  var SQC = [null,"t-c",null,"t-s","t-k",null,"t-n","t-f"];
  var SH = /(#[^\n]*)|((?!))|("(?:\\.|[^"\\\n])*"|'[^'\n]*')|\b(if|then|else|fi|for|do|done|while|case|esac|function|echo|export|python|pip|git|cd|run|name|on|jobs|steps|uses|with|env)\b|((?!))|\b(\d+)\b/g;
  var SHC = [null,"t-c",null,"t-s","t-k",null,"t-n"];
  function tokenize(code, lang){
    var re = PY, cls = PYC;
    if (lang === "html"){ re = HT; cls = HTC; }
    else if (lang === "js"){ re = JS; cls = JSC; }
    else if (lang === "sql"){ re = SQ; cls = SQC; }
    else if (lang === "sh"){ re = SH; cls = SHC; }
    var lines = [[]];
    function push(text, c){
      var parts = text.split("\n");
      parts.forEach(function(p, i){
        if (i > 0) lines.push([]);
        if (p) lines[lines.length-1].push([p, c]);
      });
    }
    var last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(code)) !== null){
      if (m.index > last) push(code.slice(last, m.index), null);
      var idx = 1; while (idx < m.length && m[idx] === undefined) idx++;
      push(m[0], cls[idx] || null);
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++;
    }
    if (last < code.length) push(code.slice(last), null);
    return lines;
  }

  function codeTable(block, hl){
    var lines = tokenize(block.code, block.lang);
    var tbody = el("tbody");
    var hlFirst = null;
    lines.forEach(function(segs, i){
      var no = block.start + i;
      var on = hl && no >= hl[0] && no <= hl[1];
      var td = el("td", {class:"tx"});
      segs.forEach(function(s){ td.appendChild(s[1] ? el("span", {class:s[1], text:s[0]}) : document.createTextNode(s[0])); });
      if (!segs.length) td.appendChild(document.createTextNode(" "));
      var tr = el("tr", on ? {class:"hl"} : null, [el("td", {class:"ln", text:String(no)}), td]);
      if (on && !hlFirst) hlFirst = tr;
      tbody.appendChild(tr);
    });
    var box = el("div", {class:"codebox"}, [el("table", {class:"code"}, [tbody])]);
    box._hlFirst = hlFirst;
    return box;
  }

  function copyText(text, btn){
    var done = function(){ var o = btn.textContent; btn.textContent = "복사됨 ✓"; setTimeout(function(){ btn.textContent = o; }, 1200); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
    function fallback(){
      var ta = el("textarea", {style:"position:fixed;opacity:0"}); ta.value = text; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); done(); } catch(e){} document.body.removeChild(ta);
    }
  }

  /* ---------- 패널 ---------- */
  function openPanel(){ document.body.classList.add("open"); }
  function closePanel(){ document.body.classList.remove("open"); }

  function showHint(){
    $("pTitle").textContent = "코드 보는 법";
    $("pSub").textContent = "카드나 파일 이름을 누르면 실제 코드가 여기에 열립니다.";
    var ul = el("ul", {class:"hint"}, [
      el("li", {text:"카드(상자)를 누르면 그 단계에서 실행되는 실제 함수 코드가 열려요."}),
      el("li", {text:"카드 안의 📄 파일 이름을 누르면 그 파일이 어떤 역할인지, 이 단원에서 쓰이는 함수가 무엇인지 보여줘요."}),
      el("li", {text:"ƒ 함수 이름을 누르면 해당 함수 코드로 바로 이동해요."}),
      el("li", {text:"노란색 줄이 지금 단계가 담당하는 부분이에요."}),
      el("li", {text:"db.함수() 처럼 적혀 있어도 실제 코드는 db/users.py 같은 다른 파일에 있어요. 카드에 그 '진짜 파일'을 표시하고, 코드 위에 찾아가는 길도 그려줘요."}),
      el("li", {text:"위쪽 ◀ ▶ 버튼으로 실행 순서대로 한 단계씩 따라갈 수 있어요."})
    ]);
    var b = $("pBody"); b.textContent = ""; b.appendChild(ul);
  }

  function renderAlias(a){
    if (!a) return null;
    return el("div", {class:"alias"}, [
      el("div", {text:"코드에는 이렇게 적혀 있지만, 실제 함수는 다른 파일에 있어요."}),
      el("div", {class:"route"}, [
        el("span", {class:"step", text:a.call}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step", text:a.via + " (창구)"}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step real", text:a.real})
      ])
    ]);
  }

  function selectNode(id, itemIdx){
    var n = nodeById(id); if (!n) return;
    state.node = id; state.item = itemIdx || 0; state.file = null;
    $("pTitle").textContent = n.title;
    $("pSub").textContent = n.plain;
    var body = $("pBody"); body.textContent = "";
    if (n.reject) body.appendChild(el("div", {class:"n-reject", text:n.reject, style:"margin:0 0 10px"}));
    if (n.items.length > 1){
      var tabs = el("div", {class:"itabs", role:"tablist"});
      n.items.forEach(function(it, i){
        tabs.appendChild(el("button", {class:"itab", role:"tab", "aria-selected":String(i === state.item), text:it.label,
          onclick:function(){ selectNode(id, i); }}));
      });
      body.appendChild(tabs);
    }
    var it = n.items[state.item];
    var block = D.blocks[it.block];
    var linesTxt = it.hl ? (it.hl[0] === it.hl[1] ? it.hl[0] + "줄" : it.hl[0] + "–" + it.hl[1] + "줄") : "";
    var fl = el("div", {class:"fileline"}, [
      el("button", {class:"chip file", onclick:function(){ selectFile(block.path); }, text:block.path}),
      el("span", {class:"lines", text: block.start + "–" + block.end + "줄 표시" + (linesTxt ? " · 노란색 " + linesTxt : "")}),
      el("span", {class:"spacer"}),
      el("button", {class:"btn", text:"복사", onclick:function(e){ copyText(block.code, e.currentTarget); }}),
      el("a", {class:"btn link", href:D.files[block.path].github + "#L" + block.start + "-L" + block.end, target:"_blank", rel:"noopener", text:"GitHub ↗"})
    ]);
    body.appendChild(fl);
    var al = renderAlias(block.alias); if (al) body.appendChild(al);
    var box = codeTable(block, it.hl);
    body.appendChild(box);
    if (it.hl) body.appendChild(el("p", {class:"legend-hl"}, [el("b", {text:"노란색"}), " = 이 카드가 담당하는 줄"]));
    refreshSelection();
    openPanel();
    if (box._hlFirst){
      var off = box._hlFirst.offsetTop - 60;
      box.scrollTop = Math.max(0, off);
    }
    updateStepper();
  }

  function selectFile(path){
    state.file = path; state.node = null;
    var f = D.files[path];
    $("pTitle").textContent = "📄 " + path;
    $("pSub").textContent = f.role;
    var body = $("pBody"); body.textContent = "";
    body.appendChild(el("div", {class:"fileline"}, [
      el("a", {class:"btn link", href:f.github, target:"_blank", rel:"noopener", text:"GitHub에서 파일 열기 ↗"})
    ]));
    body.appendChild(el("h3", {text:"이 단원에서 쓰이는 함수", style:"font-size:13.5px;margin:12px 0 0"}));
    var ul = el("ul", {class:"flist"}), seen = {};
    D.scenarios.forEach(function(sc, si){
      sc.nodes.forEach(function(n){
        n.items.forEach(function(it, ii){
          var b = D.blocks[it.block]; if (b.path !== path) return;
          var key = si + n.id + ii; if (seen[key]) return; seen[key] = 1;
          var li = el("li");
          li.appendChild(el("button", {onclick:function(){
            if (state.sc !== si) switchScenario(si);
            selectNode(n.id, ii); scrollToNode(n.id);
          }}, [
            el("span", {class:"mono", text:it.label}), el("small", {text:sc.name + " · " + n.title})
          ]));
          ul.appendChild(li);
        });
      });
    });
    body.appendChild(ul);
    if (f.header){
      var d = el("details", {class:"hdr"}, [el("summary", {text:"파일 맨 위 설명 주석 보기"}), el("pre", {text:f.header})]);
      body.appendChild(d);
    }
    refreshSelection();
    openPanel();
  }

  /* ---------- 흐름도 ---------- */
  var cols, colIndex, nodeEls = {};
  function renderStage(){
    var sc = scen();
    var used = {}; sc.nodes.forEach(function(n){ used[n.col] = 1; });
    cols = Object.keys(used).map(Number).sort(function(a,b){ return a-b; });
    colIndex = {}; cols.forEach(function(c, i){ colIndex[c] = i + 1; });
    var stage = $("stage");
    stage.textContent = "";
    stage.style.gridTemplateColumns = "repeat(" + cols.length + ", 196px)";
    nodeEls = {};

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "edges"); svg.id = "edges";
    svg.innerHTML = '<defs>' +
      '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-call" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '</defs>';
    stage.appendChild(svg);

    cols.forEach(function(c){
      stage.appendChild(el("div", {class:"colhead", style:"grid-column:" + colIndex[c] + ";grid-row:1", text:D.columns[c]}));
    });
    var cells = {};
    sc.nodes.forEach(function(n){
      var k = n.row + ":" + n.col;
      if (!cells[k]){
        cells[k] = el("div", {class:"cell", style:"grid-column:" + colIndex[n.col] + ";grid-row:" + (n.row + 2)});
        stage.appendChild(cells[k]);
      }
      var node = buildNode(n);
      nodeEls[n.id] = node;
      cells[k].appendChild(node);
    });
    $("intro").textContent = sc.intro;
    scheduleEdges();
  }

  function buildNode(n){
    var node = el("div", {class:"node " + n.kind, role:"button", tabindex:"0", "aria-pressed":"false", "data-id":n.id,
      onclick:function(e){ if (e.target.closest(".chip")) return; selectNode(n.id, 0); },
      onkeydown:function(e){ if ((e.key === "Enter" || e.key === " ") && !e.target.closest(".chip")){ e.preventDefault(); selectNode(n.id, 0); } }});
    var title = el("div", {class:"n-title", text:n.title});
    if (n.later) title.appendChild(el("span", {class:"tag-later", text:n.later + "에서 자세히"}));
    node.appendChild(title);
    if (n.kind !== "later" && n.plain) node.appendChild(el("div", {class:"n-plain", text:n.plain}));
    if (n.reject) node.appendChild(el("div", {class:"n-reject", text:n.reject}));
    var items = el("div", {class:"n-items"});
    // 같은 파일에 있는 함수는 파일 칩 하나 아래에 함수 칩을 나란히 놓는다
    var groups = [];
    n.items.forEach(function(it, i){
      var b = D.blocks[it.block], g = groups[groups.length - 1];
      if (g && g.path === b.path) g.list.push({it: it, i: i}); else groups.push({path: b.path, list: [{it: it, i: i}]});
    });
    groups.forEach(function(g){
      var row = el("div", {class:"n-item"});
      if (g.list.length === 1 && g.list[0].it.call) row.appendChild(el("div", {class:"n-call", text:brk(g.list[0].it.call)}));
      var chips = el("div", {class:"chips"}, [
        el("button", {class:"chip file", text:brk(g.path), title:"파일 설명 보기", onclick:function(){ selectFile(g.path); }})
      ]);
      g.list.forEach(function(x){
        chips.appendChild(el("button", {class:"chip " + (x.it.snippet ? "snip" : "fn"), text:x.it.label, title:(x.it.call ? x.it.call + " — " : "") + "코드 보기",
          onclick:function(){ selectNode(n.id, x.i); }}));
      });
      row.appendChild(chips);
      items.appendChild(row);
    });
    node.appendChild(items);
    return node;
  }

  function rectIn(elm, host){
    var a = elm.getBoundingClientRect(), h = host.getBoundingClientRect();
    return {l:a.left-h.left, r:a.right-h.left, t:a.top-h.top, b:a.bottom-h.top, cx:(a.left+a.right)/2-h.left, cy:(a.top+a.bottom)/2-h.top};
  }
  var raf = 0;
  function scheduleEdges(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(drawEdges); }
  function drawEdges(){
    var stage = $("stage"), svg = $("edges"), sc = scen();
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){ p.remove(); });
    Array.prototype.slice.call(stage.querySelectorAll(".elabel")).forEach(function(p){ p.remove(); });
    var svgNS = "http://www.w3.org/2000/svg";
    sc.edges.forEach(function(e){
      var a = nodeById(e.from), b = nodeById(e.to);
      var ea = nodeEls[e.from], eb = nodeEls[e.to]; if (!ea || !eb) return;
      var ra = rectIn(ea, stage), rb = rectIn(eb, stage), d, lx, ly;
      if (a.col === b.col){
        if (b.row - a.row <= 1){
          d = "M" + ra.cx + " " + ra.b + " V" + rb.t; lx = ra.cx; ly = (ra.b + rb.t) / 2;
        } else {
          var x = Math.min(ra.l, rb.l) - 30;
          d = "M" + ra.l + " " + ra.cy + " H" + x + " V" + rb.cy + " H" + rb.l; lx = x; ly = (ra.cy + rb.cy) / 2;
        }
      } else {
        var dir = b.col > a.col ? 1 : -1;
        var x1 = dir > 0 ? ra.r : ra.l, x2 = dir > 0 ? rb.l : rb.r;
        var xm = x2 - dir * 30;
        d = "M" + x1 + " " + ra.cy + " H" + xm + " V" + rb.cy + " H" + x2;
        lx = (x1 + x2) / 2; ly = ra.cy;
      }
      var kind = e.kind === "call" ? "call" : "flow";
      var p = document.createElementNS(svgNS, "path");
      p.setAttribute("d", d); p.setAttribute("class", "e " + kind);
      p.setAttribute("marker-end", "url(#" + (kind === "call" ? "ahc" : "ah") + ")");
      p.setAttribute("data-from", e.from); p.setAttribute("data-to", e.to);
      svg.appendChild(p);
      if (e.label && kind === "flow"){
        var lab = el("span", {class:"elabel", text:e.label});
        lab.style.left = lx + "px"; lab.style.top = ly + "px";
        stage.appendChild(lab);
      }
    });
    svg.setAttribute("width", stage.scrollWidth); svg.setAttribute("height", stage.scrollHeight);
    refreshSelection();
  }

  function refreshSelection(){
    Object.keys(nodeEls).forEach(function(id){ nodeEls[id].setAttribute("aria-pressed", String(id === state.node)); });
    var svg = $("edges"); if (!svg) return;
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){
      var on = state.node && (p.getAttribute("data-from") === state.node || p.getAttribute("data-to") === state.node);
      p.classList.toggle("active", !!on);
    });
  }
  function scrollToNode(id){
    var n = nodeEls[id]; if (n && n.scrollIntoView) n.scrollIntoView({block:"center", inline:"center", behavior:"smooth"});
  }

  /* ---------- 단계 이동 / 탭 ---------- */
  function stepIndex(){ return scen().steps.indexOf(state.node); }
  function updateStepper(){
    var steps = scen().steps, i = stepIndex();
    $("stepNo").textContent = i < 0 ? "– / " + steps.length : (i + 1) + " / " + steps.length;
    $("prev").disabled = i <= 0 && state.node !== null ? true : false;
    $("next").disabled = i >= steps.length - 1;
    if (state.node === null){ $("prev").disabled = true; $("next").disabled = false; }
  }
  function go(delta){
    var steps = scen().steps, i = stepIndex();
    var j = i < 0 ? 0 : Math.max(0, Math.min(steps.length - 1, i + delta));
    selectNode(steps[j], 0); scrollToNode(steps[j]);
  }
  function renderTabs(){
    var t = $("tabs"); t.textContent = "";
    D.scenarios.forEach(function(sc, i){
      t.appendChild(el("button", {class:"tab", role:"tab", "aria-selected":String(i === state.sc), text:sc.name, onclick:function(){ switchScenario(i); }}));
    });
  }
  function switchScenario(i){
    state.sc = i; state.node = null; state.file = null;
    renderTabs(); renderStage(); showHint(); updateStepper();
    try { history.replaceState(null, "", "#" + D.scenarios[i].id); } catch(e){}
  }

  /* ---------- 시작 ---------- */
  document.title = D.title + " — 코드 흐름도";
  $("title").textContent = D.title + " · 코드 흐름도";
  $("subtitle").textContent = D.subtitle;
  $("mdlink").setAttribute("href", D.mdFile);
  $("prev").addEventListener("click", function(){ go(-1); });
  $("next").addEventListener("click", function(){ go(1); });
  $("pClose").addEventListener("click", closePanel);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closePanel(); });
  $("theme").addEventListener("click", function(){
    var r = document.documentElement, cur = r.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  });
  window.addEventListener("resize", scheduleEdges);
  if (window.ResizeObserver) new ResizeObserver(scheduleEdges).observe($("stage"));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleEdges);

  var startId = (location.hash || "").replace("#", "");
  var startIdx = 0; D.scenarios.forEach(function(s, i){ if (s.id === startId) startIdx = i; });
  switchScenario(startIdx);
  // 화면 확인/테스트용 지름길: window.__flow.select("s7")
  window.__flow = { select: function(id, i){ selectNode(id, i || 0); }, file: selectFile, state: state };
})();
</script>
</body>
</html>
