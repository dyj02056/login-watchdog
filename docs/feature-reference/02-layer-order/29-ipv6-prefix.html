<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>29. IPv6 /64 대역 단위 정규화 — 코드 흐름도</title>
<style>
  :root{
    --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eaefe9; --ink:#12201c; --ink-muted:#5a6b63;
    --border:#d9e0da; --accent:#0f6f66; --accent-soft:#e2ede9; --danger:#bf3b2b; --danger-soft:#f8e6e2;
    --edge:#7b8a82; --edge-call:#8a97a0;
    --k-screen:#767f78; --k-screen-soft:#eef0ee;
    --k-route:#2f5fd6;  --k-route-soft:#e7edfb;
    --k-helper:#b56b0c; --k-helper-soft:#f7ecd9;
    --k-db:#7a4fce;     --k-db-soft:#efe8fa;
    --k-config:#0f6f66; --k-config-soft:#e2ede9;
    --k-later:#9aa39d;  --k-later-soft:#f4f6f3;
    --code-bg:#fbfcfb; --code-hl:#fff3c4; --code-hl-bar:#e0a800; --code-gutter:#8a978f;
    --c-comment:#6b7d73; --c-str:#a1470f; --c-kw:#7a3fc0; --c-fn:#1f5fd0; --c-num:#0b7a6c; --c-deco:#b0306e;
    --shadow:0 1px 2px rgba(18,32,28,.06), 0 6px 20px rgba(18,32,28,.07);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
      --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
      --edge:#6f8178; --edge-call:#5d6f67;
      --k-screen:#9aa39d; --k-screen-soft:#1a221e;
      --k-route:#7fa2f2;  --k-route-soft:#182236;
      --k-helper:#e8a94c; --k-helper-soft:#31260f;
      --k-db:#b49bee;     --k-db-soft:#241c34;
      --k-config:#4fc9b8; --k-config-soft:#17332d;
      --k-later:#6b7a72;  --k-later-soft:#111a16;
      --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
      --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1512; --surface:#141e1a; --surface-2:#1b2620; --ink:#e7efe9; --ink-muted:#93a49c;
    --border:#28352e; --accent:#4fc9b8; --accent-soft:#17332d; --danger:#ec7a6a; --danger-soft:#3a1d19;
    --edge:#6f8178; --edge-call:#5d6f67;
    --k-screen:#9aa39d; --k-screen-soft:#1a221e;
    --k-route:#7fa2f2;  --k-route-soft:#182236;
    --k-helper:#e8a94c; --k-helper-soft:#31260f;
    --k-db:#b49bee;     --k-db-soft:#241c34;
    --k-config:#4fc9b8; --k-config-soft:#17332d;
    --k-later:#6b7a72;  --k-later-soft:#111a16;
    --code-bg:#0f1713; --code-hl:#3a3210; --code-hl-bar:#e8a94c; --code-gutter:#5f7068;
    --c-comment:#7f9388; --c-str:#e9a27a; --c-kw:#c3a1f5; --c-fn:#8db3ff; --c-num:#6fd6c6; --c-deco:#f08ab8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
  button{font:inherit;color:inherit;cursor:pointer}
  code,.mono{font-family:var(--mono)}

  .app{display:flex;height:100vh;min-height:0}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{padding:14px 20px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
  .top h1{margin:0;font-size:19px;letter-spacing:-.01em}
  .top .sub{margin:2px 0 0;color:var(--ink-muted);font-size:13px}
  .top-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
  .tabs{display:flex;gap:6px}
  .tab{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:5px 14px;font-weight:600}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .tab[aria-selected="true"]{color:#06201b}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#06201b}}
  .spacer{flex:1}
  .btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:default}
  .stepper{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-muted)}
  .stepper b{color:var(--ink);min-width:42px;text-align:center}
  a.link{color:var(--accent);text-decoration:none;font-size:13px}
  a.link:hover{text-decoration:underline}

  .intro{margin:0;padding:10px 20px;color:var(--ink-muted);font-size:13px;border-bottom:1px solid var(--border);background:var(--surface-2)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 20px;font-size:12px;color:var(--ink-muted);border-bottom:1px solid var(--border)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .stage-wrap{flex:1;min-height:0;overflow:auto}
  .stage{position:relative;display:grid;gap:26px 46px;padding:22px 22px 60px;width:max-content;min-width:100%}
  .edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .edges path{fill:none;stroke:var(--edge);stroke-width:1.6}
  .edges path.call{stroke:var(--edge-call);stroke-dasharray:5 4}
  .edges path.active{stroke:var(--accent);stroke-width:2.4;stroke-dasharray:none}
  .edges .head{fill:var(--edge)}
  .edges .head-call{fill:var(--edge-call)}
  .elabel{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;
    background:var(--surface);border:1px solid var(--border);color:var(--ink-muted);white-space:nowrap;pointer-events:none}

  .colhead{font-size:12px;font-weight:700;color:var(--ink-muted);text-transform:none;border-bottom:2px solid var(--border);padding-bottom:6px;align-self:end}
  .cell{display:flex;flex-direction:column;gap:12px;align-self:center;justify-content:center;position:relative;z-index:1}

  .node{--k:var(--k-route);--ks:var(--k-route-soft);position:relative;background:var(--surface);border:1px solid var(--border);
    border-left:5px solid var(--k);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .08s, border-color .12s}
  .node:hover{transform:translateY(-1px);border-color:var(--k)}
  .node:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .node[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
  .node.screen{--k:var(--k-screen);--ks:var(--k-screen-soft)}
  .node.route{--k:var(--k-route);--ks:var(--k-route-soft)}
  .node.helper{--k:var(--k-helper);--ks:var(--k-helper-soft)}
  .node.db{--k:var(--k-db);--ks:var(--k-db-soft)}
  .node.config{--k:var(--k-config);--ks:var(--k-config-soft)}
  .node.later{--k:var(--k-later);--ks:var(--k-later-soft);background:var(--k-later-soft);box-shadow:none;border-style:dashed;border-left-style:solid;padding:8px 10px}
  .n-title{font-weight:700;font-size:13.5px;letter-spacing:-.01em}
  .n-plain{margin-top:3px;color:var(--ink-muted);font-size:12.5px}
  .n-reject{margin-top:6px;font-size:12px;color:var(--danger);background:var(--danger-soft);border-radius:6px;padding:3px 8px}
  .n-reject::before{content:"막히면 → ";font-weight:700}
  .n-items{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .n-item{display:flex;flex-direction:column;gap:3px}
  .n-call{overflow-wrap:anywhere;font-family:var(--mono);font-size:11.5px;color:var(--k);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{max-width:100%;text-align:left;overflow-wrap:anywhere;border:1px solid var(--border);background:var(--ks);color:var(--ink);border-radius:6px;padding:1px 7px;font-family:var(--mono);font-size:11px}
  .chip:hover{border-color:var(--k);color:var(--k)}
  .chip.file::before{content:"📄 "}
  .chip.fn::before{content:"ƒ ";color:var(--k);font-weight:700}
  .chip.snip::before{content:"▤ ";color:var(--k);font-weight:700}
  .tag-later{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--ink-muted);border:1px solid var(--border);border-radius:999px;padding:0 7px;background:var(--surface)}

  /* 코드 패널 */
  .panel{width:440px;flex:none;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
  .p-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
  .p-head h2{margin:0;font-size:15.5px;letter-spacing:-.01em}
  .p-head p{margin:4px 0 0;color:var(--ink-muted);font-size:13px}
  .p-close{display:none}
  .p-body{flex:1;min-height:0;overflow:auto;padding:12px 16px 24px}
  .hint{color:var(--ink-muted);font-size:13px}
  .hint li{margin:4px 0}
  .itabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .itab{border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:2px 9px;font-family:var(--mono);font-size:12px}
  .itab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .fileline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
  .fileline .path{font-family:var(--mono);font-size:12.5px;font-weight:700}
  .fileline .lines{font-family:var(--mono);font-size:12px;color:var(--ink-muted)}
  .alias{border:1px solid var(--border);background:var(--k-db-soft);border-radius:8px;padding:8px 10px;margin:0 0 10px;font-size:12.5px}
  .alias .route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px;font-family:var(--mono);font-size:12px}
  .alias .route span.step{padding:1px 7px;border-radius:6px;border:1px solid var(--border);background:var(--surface)}
  .alias .route span.real{border-color:var(--k-db);color:var(--k-db);font-weight:700}
  .alias .arrow{color:var(--ink-muted)}
  .codebox{border:1px solid var(--border);border-radius:8px;background:var(--code-bg);overflow:auto;max-height:62vh}
  table.code{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.2px;line-height:1.6}
  table.code td{padding:0 10px;vertical-align:top;white-space:pre}
  table.code td.ln{position:sticky;left:0;text-align:right;color:var(--code-gutter);user-select:none;background:var(--code-bg);border-right:1px solid var(--border);min-width:44px;padding-right:8px}
  table.code tr.hl td{background:var(--code-hl)}
  table.code tr.hl td.ln{background:var(--code-hl);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--code-hl-bar)}
  .t-c{color:var(--c-comment);font-style:italic}.t-d{color:var(--c-comment)}.t-s{color:var(--c-str)}.t-k{color:var(--c-kw);font-weight:600}
  .t-f{color:var(--c-fn)}.t-n{color:var(--c-num)}.t-a{color:var(--c-deco)}
  .legend-hl{margin:8px 0 0;font-size:12px;color:var(--ink-muted)}
  .legend-hl b{background:var(--code-hl);color:var(--ink);padding:0 6px;border-radius:4px}
  .flist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
  .flist button{width:100%;text-align:left;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:6px 10px}
  .flist button:hover{border-color:var(--accent)}
  .flist small{display:block;color:var(--ink-muted)}
  details.hdr{margin-top:12px;font-size:13px}
  details.hdr pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px;font-family:var(--sans);font-size:12.5px;color:var(--ink-muted)}

  @media (max-width:900px){
    .app{display:block;height:auto}
    .stage-wrap{max-height:none;overflow-x:auto}
    .panel{position:fixed;left:0;right:0;bottom:0;width:auto;height:62vh;border-left:0;border-top:2px solid var(--accent);
      box-shadow:0 -10px 30px rgba(0,0,0,.25);z-index:20;transform:translateY(105%);transition:transform .18s}
    body.open .panel{transform:none}
    .p-close{display:inline-block;position:absolute;right:12px;top:10px}
    .p-head{position:relative;padding-right:70px}
    .top{padding:12px 16px 8px}
    .stage{padding:16px 16px 70vh}
  }
  @media (prefers-reduced-motion: reduce){.node,.panel{transition:none}}
</style>
</head>

lock": "security/lockdown.py:is_ip_allowlisted", "hl": [41, 42], "label": "is_ip_allowlisted()", "call": null, "snippet": false}]}, {"id": "same_n3", "col": 2, "row": 1, "kind": "helper", "title": "정규화", "plain": "양쪽 모두 같은 함수를 거칩니다.", "reject": "", "later": "", "items": [{"block": "services/ip_utils.py:normalize_ip", "hl": null, "label": "normalize_ip()", "call": null, "snippet": false}]}, {"id": "same_n4", "col": 1, "row": 2, "kind": "route", "title": "② 위치 조회는 대역의 대표 주소로", "plain": "대역 키(…/64)로는 외부 서비스에 물을 수 없으므로 대표(네트워크) 주소로 조회합니다. IP 도 대역도 아니면 외부 요청을 보내지 않습니다.", "reject": "", "later": "", "items": [{"block": "services/ip_utils.py:lookup_address", "hl": [60, 64], "label": "lookup_address()", "call": null, "snippet": false}]}, {"id": "same_n5", "col": 2, "row": 2, "kind": "later", "title": "외부 위치 조회", "plain": "4단원.", "reject": "", "later": "4단원", "items": [{"block": "services/geoip.py:_fetch_location", "hl": null, "label": "_fetch_location()", "call": null, "snippet": false}]}], "edges": [{"from": "same_n1", "to": "same_n2", "label": "", "kind": "flow"}, {"from": "same_n2", "to": "same_n3", "label": "", "kind": "call"}, {"from": "same_n2", "to": "same_n4", "label": "", "kind": "flow"}, {"from": "same_n4", "to": "same_n5", "label": "", "kind": "call"}], "steps": ["same_n1", "same_n2", "same_n4"]}], "blocks": {"helpers/request_utils.py:get_request_ip": {"path": "helpers/request_utils.py", "start": 48, "end": 83, "lang": "python", "code": "def get_request_ip() -> str:\n    \"\"\"이번 요청을 보낸 사람의 IP 주소를 알아낸다.\n\n    보통은 request.remote_addr(브라우저가 서버에 직접 연결한 진짜 주소)를 쓴다.\n    다만 config.TRUST_FORWARDED_FOR가 켜져 있을 때만(데모/시연 전용 설정) 예외적으로\n    X-Forwarded-For 헤더 값을 대신 신뢰한다 — 로컬 데모 환경에서는 팀원 전원이\n    같은 127.0.0.1(내 컴퓨터 자신을 가리키는 특수 주소)로 접속하게 되어 서로 다른\n    공격자 IP를 흉내낼 수 없기 때문에, 시뮬레이션 스크립트가 \"나는 1.2.3.4에서\n    왔다\"고 헤더로 주장하면 그걸 믿어주는 우회로를 마련해둔 것이다.\n    실제 운영 서비스에서는 이 헤더를 함부로 신뢰하면 공격자가 IP를 속여\n    잠금을 피해갈 수 있으므로 위험하다 — 그래서 기본값은 꺼짐(False)이다.\n\n    SSRF 방지 (L7 공격 보강 계획 Tier 3): 이 값은 이후 services/geoip.py가 외부\n    위치 조회 API 주소에 그대로 끼워 넣는 데 쓰인다. X-Forwarded-For는\n    클라이언트가 보내는 값이라 형식 검증 없이 그대로 신뢰하면, TRUST_FORWARDED_FOR\n    를 켠 환경에서 그 문자열이 외부 요청 주소에 섞여 들어갈 수 있다.\n    ipaddress.ip_address()로 \"진짜 IP 형식인가\"부터 확인하고, 아니면 헤더값을\n    버리고 원래 접속 IP(request.remote_addr)로 되돌아간다.\n\n    IPv6 대역 단위 (guide42): 돌려주는 값은 ip_utils.normalize_ip()를 거친 \"탐지·잠금 단위\"다 —\n    IPv4는 그대로, IPv6는 /64 대역(예: 2001:db8:1:2::/64)이다. IPv6 사용자는 대역 안에서 주소를\n    거의 공짜로 바꿀 수 있어서, 주소 하나 단위로 세면 IP 잠금·요청 제한이 모두 우회되기 때문이다.\n    이 함수 하나만 바꾸면 이 값을 쓰는 탐지·잠금·요청 제한·이벤트가 전부 같은 단위로 동작한다.\n    \"\"\"\n    if config.TRUST_FORWARDED_FOR:\n        forwarded = request.headers.get(\"X-Forwarded-For\")\n        if forwarded:\n            # 이 헤더는 \"1.2.3.4, 5.6.7.8\"처럼 여러 IP가 콤마로 이어질 수 있어서\n            # 맨 앞(가장 처음 요청을 보낸 곳) 값만 잘라서 쓴다.\n            candidate = forwarded.split(\",\")[0].strip()\n            try:\n                ipaddress.ip_address(candidate)\n            except ValueError:\n                return normalize_ip(request.remote_addr)\n            return normalize_ip(candidate)\n    return normalize_ip(request.remote_addr)", "alias": null}, "services/ip_utils.py:normalize_ip": {"path": "services/ip_utils.py", "start": 29, "end": 54, "lang": "python", "code": "def normalize_ip(raw: str | None) -> str | None:\n    \"\"\"접속 IP(또는 이미 정규화된 대역 문자열)를 탐지·잠금 단위 문자열로 바꾼다.\n    IP 형식이 아니면 그대로 돌려준다 — 형식 검증은 호출부(get_request_ip)의 몫이다.\"\"\"\n    if not raw:\n        return raw\n    if \"/\" in raw:\n        # 이미 대역 형태(\"2001:db8:1:2::/64\")로 들어온 값 — 허용 목록·해제 스크립트 입력 등.\n        try:\n            network = ipaddress.ip_network(raw, strict=False)\n        except ValueError:\n            return raw\n        if network.version == 6:\n            return str(ipaddress.ip_network(f\"{network.network_address}/{_prefix_length()}\", strict=False))\n        return str(network)\n\n    try:\n        address = ipaddress.ip_address(raw)\n    except ValueError:\n        return raw\n    if address.version == 4:\n        return str(address)\n    if address.ipv4_mapped is not None:\n        return str(address.ipv4_mapped)\n    if address.is_loopback:\n        return str(address)\n    return str(ipaddress.ip_network(f\"{address}/{_prefix_length()}\", strict=False))", "alias": null}, "services/ip_utils.py:_prefix_length": {"path": "services/ip_utils.py", "start": 23, "end": 26, "lang": "python", "code": "def _prefix_length() -> int:\n    \"\"\"IPv6 대역 길이. 설정값이 1~128 밖이면 기본 64를 쓴다.\"\"\"\n    length = config.IPV6_PREFIX_LENGTH\n    return length if 1 <= length <= 128 else 64", "alias": null}, "config.py:192-192": {"path": "config.py", "start": 192, "end": 192, "lang": "python", "code": "IPV6_PREFIX_LENGTH = int(os.environ.get(\"IPV6_PREFIX_LENGTH\", 64))", "alias": null}, "routes/auth.py:login_submit": {"path": "routes/auth.py", "start": 196, "end": 315, "lang": "python", "code": "@auth_bp.route(\"/login\", methods=[\"POST\"])\ndef login_submit():\n    \"\"\"로그인 폼 제출을 처리한다. 이 함수 하나가 이 프로젝트의 핵심 흐름을 담당한다.\n\n    처리 순서:\n    1. 혹시 자동으로 풀어줘야 할 만료된 잠금(IP 단위 + 계정 단위)이 있으면 먼저 정리한다.\n    2. 이번 요청을 보낸 IP와 입력된 아이디를 알아낸다.\n    3. 이 IP가 지금 잠긴 상태이거나, 이 계정 자체가 (다른 IP들이 나눠서 공격해서)\n       잠긴 상태라면 아이디/비밀번호를 확인하지도 않고 곧바로 거부한다. 단, 영구 잠금된\n       IP는 이메일 복구로 예외를 받은 \"본인 + 본인 기기\"만 통과시킨다(guide33/34-a).\n    4. 잠긴 상태가 아니라면 실제로 아이디/비밀번호를 확인하고, 그 시도를 기록한다.\n    5. 실패했다면 \"혹시 이 IP가 수상한 수준(5회 초과)이 됐는지\"를 먼저 보고,\n       아니라면 \"혹시 이 계정이 여러 IP에 걸쳐 총합으로 수상한 수준(8회 초과)이\n       됐는지\"도 본다 — 전자는 soar.enforce_lockout(IP 잠금), 후자는\n       soar.enforce_account_lockout(계정 잠금)이 알림까지 같이 보낸다\n       (L7 공격 보강 계획 Tier 1: 분산/저속 브루트포스 대응). 둘 다 아직 기준치 아래지만\n       코앞이면 LLM 조기 경보를 판단한다(guide31).\n    6. 성공했다면 회원 세션을 만들어서 회원 대시보드로 이동시킨다(12단계에서 추가).\n    \"\"\"\n    # 1) 시간이 지나 자동으로 풀려야 할 잠금들을 정리 (IP 단위 + 계정 단위)\n    soar.try_release_expired_lockouts()\n    soar.try_release_expired_account_lockouts()\n\n    ip = get_request_ip()\n    username = request.form.get(\"username\", \"\")\n    password = request.form.get(\"password\", \"\")\n\n    # 허니팟 필드가 채워져 있으면 사람이 아니라 자동화 스크립트라고 보고,\n    # 자격 증명 확인/시도 기록 없이 즉시 거부한다 (L7 공격 보강 계획 Tier 3).\n    if is_bot_submission():\n        soar.notify_bot_detected(ip, request.path)\n        flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n        return render_template(\"login_form.html\", form_action=url_for(\"auth.login_submit\"))\n\n    # 2) 이미 잠긴 IP이거나, 이미 잠긴 계정이라면 검증 자체를 건너뛰고 즉시 거부\n    #    — 단, 영구 잠금된 IP는 \"이메일 복구로 예외를 받은 본인+본인 기기\"만 통과시킨다(guide33).\n    exemption = None\n    if detector.is_locked(ip):\n        if detector.get_ip_lock_state(ip) != detector.LOCK_STATE_PERMANENT:\n            flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n            return _login_form()\n        exemption = _find_ip_exemption(ip, username)\n        if exemption is None:\n            flash(\"이 네트워크는 차단되어 있습니다. 본인이라면 아래 '본인 인증으로 접속 허용'을 이용해주세요.\")\n            return _login_form(recovery_link=True)\n        # 예외가 있으면 IP 잠금 안내 없이 아래 계정 잠금 확인과 정상적인 비밀번호 확인으로 계속 진행한다.\n\n    if detector.is_account_locked(username):\n        flash(ACCOUNT_LOCKED_MESSAGE)\n        return _login_form(recovery_link=True)\n\n    success = db.verify_user_credentials(username, password)\n    db.log_attempt(ip, username, success)\n\n    if success:\n        # 관리자 세션(\"admin_username\")과는 완전히 다른 키(\"username\")를 쓴다 —\n        # 그래야 같은 브라우저에서 관리자 세션이 있더라도 서로 섞이지 않는다.\n        # user_id도 같이 저장해두는 이유는 member_login_required 문지기 뒤에서\n        # \"아이디\"가 아니라 변하지 않는 \"번호\"로 본인 행을 정확히 찾기 위해서다.\n        user = db.get_user_by_username(username)\n        session[\"username\"] = username\n        session[\"user_id\"] = user[\"id\"]\n        # 세션 세대 번호 — 나중에 비밀번호가 바뀌면 이 세션을 끊는 데 쓴다(guide35).\n        session[\"session_version\"] = user.get(\"session_version\") or 0\n        return redirect(url_for(\"member.member_dashboard\"))\n\n    # 영구 잠금 예외로 통과한 사용자가 연달아 실패하면 그 예외를 회수한다 — 예외는 \"본인이\n    # 비밀번호를 아는 상황\"을 전제로 한 출입증이라, 계속 틀리는 건 도용 신호로 본다.\n    # (예외 통과자의 실패는 IP 임계값 판정으로 넘기지 않는다 — 이 IP는 이미 영구 잠금 중이라\n    # enforce_lockout()이 5분 잠금 알림을 또 보내는 일이 없도록 하기 위해서다.)\n    if exemption is not None:\n        if db.count_recent_failures(ip) >= config.IP_EXEMPTION_MAX_FAILURES:\n            db.revoke_ip_exemption(exemption[\"id\"], \"예외 통과 후 연속 로그인 실패\")\n        flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n        return _login_form()\n\n    # 실패했다면, 먼저 이 IP가 방금 임계값을 넘었는지 확인한다.\n    suspicious, failure_count = detector.is_suspicious(ip)\n    if suspicious:\n        # 최근 실패에 쓰인 아이디가 몇 개였는지도 함께 세서, Slack 알림이 Brute\n        # Force(계정 1개 집중)와 Password Spraying(계정 여러 개 순회)을 구분해\n        # 표시할 수 있게 한다 (attack_response_state.md 구현 대상 #5).\n        distinct_usernames = detector.count_distinct_usernames(ip)\n        soar.enforce_lockout(ip, failure_count, distinct_usernames)\n        flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n    else:\n        # 아직 기준치(FAILURE_THRESHOLD)는 안 넘었지만 코앞이면, LLM에게 조기\n        # 경보 여부를 물어본다 (Track A, guide31). 공격자가 임계값을 살짝\n        # 피해 가려고 실패 횟수를 일부러 코앞에서 멈추는 패턴을 이 구간에서 잡는다.\n        if failure_count >= config.FAILURE_THRESHOLD - config.EARLY_WARNING_BAND:\n            distinct_usernames = detector.count_distinct_usernames(ip)\n            soar.consider_early_warning(\n                \"BRUTE_FORCE\", \"LOCK_IP\", \"ip\", ip, failure_count, config.FAILURE_THRESHOLD,\n                context_count=distinct_usernames,\n            )\n\n        # IP 단위로는 아직 수상하지 않더라도, 이 계정이 여러 IP에 걸쳐 나뉘어서\n        # 총합 기준으로 수상한 수준이 됐는지 확인한다 — 공격자가 IP를 돌려가며\n        # (봇넷/프록시 로테이션) 한 계정만 노리는 분산 브루트포스를 잡아낸다.\n        account_suspicious, account_failure_count = detector.is_account_suspicious(username)\n        if account_suspicious:\n            distinct_ips = detector.count_distinct_ips_by_username(username)\n            soar.enforce_account_lockout(username, account_failure_count, distinct_ips, ip)\n            flash(\"잠긴 계정입니다. 잠시 후 다시 시도해주세요.\")\n        else:\n            # 이 계정도 마찬가지로 임계값(ACCOUNT_FAILURE_THRESHOLD) 코앞이면\n            # 조기 경보 대상이다 — 여러 IP에 나눠 시도하되 각 IP·계정 총합\n            # 모두를 임계값 아래로 유지하려는 패턴을 잡아낸다.\n            if account_failure_count >= config.ACCOUNT_FAILURE_THRESHOLD - config.EARLY_WARNING_BAND:\n                distinct_ips = detector.count_distinct_ips_by_username(username)\n                soar.consider_early_warning(\n                    \"DISTRIBUTED_BRUTE_FORCE\", \"LOCK_ACCOUNT\", \"account\", username,\n                    account_failure_count, config.ACCOUNT_FAILURE_THRESHOLD,\n                    context_count=distinct_ips, context_ip=ip,\n                )\n            # 사용자 존재 여부(아이디가 없는지, 비밀번호만 틀렸는지)를 구분해서\n            # 알려주면 공격자에게 힌트를 주게 되므로, 항상 똑같은 문구로만 실패를 알린다.\n            flash(\"아이디 또는 비밀번호가 올바르지 않습니다.\")\n\n    return render_template(\"login_form.html\", form_action=url_for(\"auth.login_submit\"))", "alias": null}, "security/detector.py:is_suspicious": {"path": "security/detector.py", "start": 27, "end": 38, "lang": "python", "code": "def is_suspicious(ip: str) -> tuple[bool, int]:\n    \"\"\"이 IP가 \"수상한 상태\"인지 판단한다.\n\n    판단 기준: 최근 60초(config.DETECTION_WINDOW_SECONDS) 안에 실패한 횟수가\n    기준치(FAILURE_THRESHOLD, 기본 5회)를 \"초과\"했는가?\n\n    반환값은 (수상한가?, 실제 실패 횟수) 형태의 튜플(값 2개를 한 번에 묶어서 돌려주는 것).\n    예: (True, 6)  → \"수상함, 지금까지 6번 실패했음\"\n        (False, 3) → \"아직 수상하지 않음, 3번 실패했음\"\n    \"\"\"\n    failure_count = db.count_recent_failures(ip)\n    return failure_count > FAILURE_THRESHOLD, failure_count", "alias": null}, "db/attempts.py:count_recent_failures": {"path": "db/attempts.py", "start": 29, "end": 47, "lang": "python", "code": "def count_recent_failures(ip: str, window_seconds: int = config.DETECTION_WINDOW_SECONDS) -> int:\n    \"\"\"이 IP가 최근 몇 초(기본 60초) 안에 몇 번이나 로그인에 실패했는지 센다.\n\n    동작 순서:\n    1. \"지금 시각 - 60초\"를 계산해서 \"이 시각 이후의 기록만 보겠다\"는 기준선을 만든다.\n    2. login_attempts 표에서 \"이 IP\" + \"실패(success=False)\" + \"기준선 이후\"인 줄만 골라\n       개수를 센다.\n    \"\"\"\n    cutoff = (datetime.now(timezone.utc) - timedelta(seconds=window_seconds)).isoformat()\n    res = (\n        db.get_client()\n        .table(\"login_attempts\")\n        .select(\"id\", count=\"exact\")   # 실제 내용은 필요없고 \"개수\"만 알면 되므로 id만 요청\n        .eq(\"ip_address\", ip)          # 조건 1: IP가 일치하는 것만\n        .eq(\"success\", False)          # 조건 2: 실패한 시도만\n        .gte(\"attempted_at\", cutoff)   # 조건 3: 기준 시각 이후에 일어난 것만\n        .execute()\n    )\n    return res.count or 0  # 만약 count가 없으면(None) 0으로 처리", "alias": {"call": "db.count_recent_failures()", "via": "db/__init__.py", "real": "db/attempts.py"}}, "security/detector.py:is_locked": {"path": "security/detector.py", "start": 212, "end": 219, "lang": "python", "code": "def is_locked(ip: str) -> bool:\n    \"\"\"이 IP가 지금 이 순간 잠긴 상태인지 True/False로 알려준다.\n\n    실제 \"잠겨있는지\" 판단은 db.get_active_lockout()이 이미 하고 있으므로\n    (active=True 이면서 아직 풀릴 시각이 안 지난 것만 찾아줌),\n    여기서는 그 결과가 있는지(None이 아닌지)만 확인한다.\n    \"\"\"\n    return db.get_active_lockout(ip) is not None", "alias": null}, "app.py:125-130": {"path": "app.py", "start": 125, "end": 130, "lang": "python", "code": "limiter = Limiter(\n    key_func=get_request_ip,\n    app=app,\n    default_limits=[f\"{config.GLOBAL_RATE_LIMIT_PER_MINUTE} per minute\"],\n    default_limits_exempt_when=lambda: request.endpoint in PAGE_ACCESS_EXCLUDED_ENDPOINTS,\n)", "alias": null}, "security/lockdown.py:is_ip_allowlisted": {"path": "security/lockdown.py", "start": 36, "end": 42, "lang": "python", "code": "def is_ip_allowlisted(ip: str) -> bool:\n    \"\"\"이 IP가 \"절대 영구 잠그지 않는 목록\"(관리자 PC 등)에 있는지.\n\n    양쪽을 같은 단위로 정규화해서 비교한다(guide42) — 요청 IP는 IPv6면 /64 대역 키로 들어오므로,\n    .env에 관리자 PC의 IPv6 전체 주소를 적어도 같은 대역이면 허용 목록으로 인정된다.\"\"\"\n    key = normalize_ip(ip)\n    return any(normalize_ip(entry) == key for entry in config.PERMANENT_LOCK_IP_ALLOWLIST)", "alias": null}, "services/ip_utils.py:lookup_address": {"path": "services/ip_utils.py", "start": 57, "end": 68, "lang": "python", "code": "def lookup_address(key: str) -> str | None:\n    \"\"\"위치 조회(geoip)에 넘길 실제 주소. 대역 키면 대표 주소(네트워크 주소)를, IP면 그대로,\n    둘 다 아니면 None(조회하지 않음 — 외부 요청 주소에 이상한 문자열이 섞이지 않게).\"\"\"\n    if \"/\" in key:\n        try:\n            return str(ipaddress.ip_network(key, strict=False).network_address)\n        except ValueError:\n            return None\n    try:\n        return str(ipaddress.ip_address(key))\n    except ValueError:\n        return None", "alias": null}, "services/geoip.py:_fetch_location": {"path": "services/geoip.py", "start": 23, "end": 69, "lang": "python", "code": "def _fetch_location(ip: str) -> dict:\n    \"\"\"ip-api.com에 실제로 물어봐서 이 IP의 국가/지역/도시를 알아낸다.\n\n    이 함수는 캐시를 전혀 신경 쓰지 않는다 — \"무조건 새로 조회한다\"는 역할만\n    한다. 캐시를 먼저 확인할지 말지는 이 함수를 부르는 get_locations()가 결정한다.\n\n    실패하는 경우가 세 가지 있다:\n    1. ip가 애초에 올바른 IP 형식이 아닌 경우 (SSRF 방지, 아래 설명)\n    2. 네트워크 자체가 안 되거나 응답이 이상한 경우 (requests.RequestException)\n    3. 127.0.0.1 같은 사설/예약된 IP라서 애초에 위치가 없는 경우\n       (ip-api.com이 {\"status\": \"fail\", \"message\": \"reserved range\"} 같은\n       응답을 돌려준다)\n    세 경우 다 \"조회 실패\"로 취급하고, 국가/지역/도시는 전부 None으로 채운다.\n\n    SSRF 방지 (L7 공격 보강 계획 Tier 3): ip는 보통 helpers.get_request_ip()가\n    돌려준 값인데, config.TRUST_FORWARDED_FOR=true(데모 전용 설정)일 때는 그\n    값이 클라이언트가 보낸 X-Forwarded-For 헤더에서 그대로 온다. 이 함수가\n    ip 값을 검증 없이 _API_URL.format(ip=ip)에 그대로 꽂아 외부로 요청을\n    보내므로, 헤더에 URL 조작을 노린 문자열이 들어오면 그 문자열이 그대로\n    외부 요청 주소에 섞여 들어갈 수 있었다. ip_utils.lookup_address()로 \"진짜\n    IP(또는 IP 대역) 형식인가\"만 먼저 확인하고, 아니면 요청 자체를 보내지 않는다.\n    \"\"\"\n    # IPv6는 /64 대역 키로 들어온다(guide42) — 대역이면 대표 주소(네트워크 주소)로 조회한다.\n    # IP도 대역도 아니면 외부로 요청을 보내지 않는다(위 SSRF 방지 설명).\n    lookup_ip = lookup_address(ip)\n    if lookup_ip is None:\n        return {\"country\": None, \"region_name\": None, \"city\": None, \"lookup_failed\": True}\n\n    try:\n        response = requests.get(\n            _API_URL.format(ip=lookup_ip),\n            params={\"fields\": \"status,country,regionName,city\"},\n            timeout=5,\n        )\n        data = response.json()\n    except requests.RequestException:\n        return {\"country\": None, \"region_name\": None, \"city\": None, \"lookup_failed\": True}\n\n    if data.get(\"status\") != \"success\":\n        return {\"country\": None, \"region_name\": None, \"city\": None, \"lookup_failed\": True}\n\n    return {\n        \"country\": data.get(\"country\"),\n        \"region_name\": data.get(\"regionName\"),\n        \"city\": data.get(\"city\"),\n        \"lookup_failed\": False,\n    }", "alias": null}}, "files": {"helpers/request_utils.py": {"role": "요청 IP 를 알아내는 유일한 함수 get_request_ip() 가 있는 공용 도구.", "header": "helpers/request_utils.py — 요청 정보(IP, 허니팟) 읽기와 화면용 작은 변환 함수\n예전 helpers.py(314줄)를 기능 묶음별로 나눈 조각 중 하나다. 다른 파일은 이 파일을 직접\n가리키지 않고 예전처럼 `from helpers import ...`로 가져다 쓴다(helpers/__init__.py가\n재내보내기). 배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/helpers/request_utils.py"}, "services/ip_utils.py": {"role": "IP 주소를 검증·정규화하는 순수 함수 모음. Flask 에 의존하지 않아 다른 곳에서도 같이 쓴다.", "header": "services/ip_utils.py — 접속 IP를 \"탐지·잠금 단위\"로 정규화한다 (guide42)\n왜 필요한가: IPv6 사용자는 보통 /64 대역(앞 64비트가 같은 2^64개 주소)을 통째로 받아서 주소를\n바꾸는 비용이 거의 없다. 주소 하나를 단위로 세고 잠그면, 시도마다 주소를 바꾸는 것만으로 IP 잠금·\nIP 단위 탐지·요청 제한·영구 잠금이 모두 무력화된다. 그래서 IPv6는 대역(기본 /64)을 한 단위로 본다.\n203.0.113.10            → 203.0.113.10          (IPv4는 그대로)\n2001:db8:1:2:abcd::5    → 2001:db8:1:2::/64     (IPv6는 대역)\n::ffff:203.0.113.10     → 203.0.113.10          (IPv4가 들어 있는 IPv6는 IPv4로)\n::1                     → ::1                   (루프백은 그대로 — 로컬 개발 편의)\nhelpers.get_request_ip()가 이 함수를 거친 값을 돌려주므로, 그 값을 쓰는 로그인 실패 집계·IP 잠금·\n요청 제한·보안 이벤트·상관분석·IP 예외·복구/재설정 IP 한도가 전부 같은 단위로 동작한다.\nFlask에 의존하지 않는 순수 함수라 security/lockdown.py(허용 목록)와 scripts/management/unlock_ip.py도 같이 쓴다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/services/ip_utils.py"}, "config.py": {"role": "임계값·시간 창·잠금 시간·규칙값 등 프로젝트 공용 설정값을 한 곳에 모은 파일.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/config.py"}, "routes/auth.py": {"role": "routes/auth.py — 회원가입(/signup) + 감시 대상 로그인(/login) 원래 app.py의 \"회원가입 입력 검증 규칙\" / \"회원가입\" / \"감시 대상 로그인\" 세 섹션을 그대로 옮겨왔다. 배경은 docs/refactor/2026-09-15-file-split.md ", "header": "routes/auth.py — 회원가입(/signup) + 감시 대상 로그인(/login)\n원래 app.py의 \"회원가입 입력 검증 규칙\" / \"회원가입\" / \"감시 대상 로그인\"\n세 섹션을 그대로 옮겨왔다. 배경은 docs/refactor/2026-09-15-file-split.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/auth.py"}, "security/detector.py": {"role": "security/detector.py — \"판사\" 역할: 지금 이 IP가 수상한지, 지금 잠겨있는지만 판단한다 이 파일은 데이터베이스의 상태를 절대 바꾸지 않는다(아무것도 저장/수정/삭제하지 않음). 오직 db에게 \"지금 상태가 어때?\"라고 물어보고, 그 답을 바탕으로 True/Fals", "header": "security/detector.py — \"판사\" 역할: 지금 이 IP가 수상한지, 지금 잠겨있는지만 판단한다\n이 파일은 데이터베이스의 상태를 절대 바꾸지 않는다(아무것도 저장/수정/삭제하지 않음).\n오직 db에게 \"지금 상태가 어때?\"라고 물어보고, 그 답을 바탕으로\nTrue/False 같은 \"판정 결과\"만 돌려준다.\n실제로 잠그거나 알림을 보내는 \"실행\"은 이 파일이 아니라 security/soar/가 담당한다\n(판단과 실행을 분리해두면, \"판단 기준만 바꾸고 싶다\" 같은 수정이 훨씬 쉬워진다).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/detector.py"}, "db/attempts.py": {"role": "db/attempts.py — login_attempts 표 관련 함수 — \"누가 언제 어떤 IP에서 로그인에 성공/실패했는지\"를 기록하고 조회하는 기능 원래 db.py의 같은 이름 섹션을 그대로 옮겨왔다. 이 모듈은 내부에서 `import db`로 패키지 최상위(db/__init__.", "header": "db/attempts.py — login_attempts 표 관련 함수\n— \"누가 언제 어떤 IP에서 로그인에 성공/실패했는지\"를 기록하고 조회하는 기능\n원래 db.py의 같은 이름 섹션을 그대로 옮겨왔다. 이 모듈은 내부에서 `import db`로\n패키지 최상위(db/__init__.py)를 다시 참조해서 db.get_client()를 호출한다 —\ndb.attempts.get_client가 아니라 이렇게 해야, 테스트가\nmonkeypatch.setattr(db, \"get_client\", ...)로 db 패키지의 get_client를 바꿔치기\n했을 때 이 파일의 함수들도 그 가짜 버전을 그대로 쓰게 된다(값을 미리 복사해서\n이 파일 안에 별도 이름으로 묶어두면 그 바꿔치기가 안 먹는다).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/attempts.py"}, "app.py": {"role": "Flask 앱을 만들고 화면(Blueprint)·훅·보안 설정을 조립하는 시작 파일.", "header": "app.py — 이 프로그램의 \"정문\" 역할을 하는 Flask 진입점\n지금까지 만든 db/(데이터 저장/조회), security/detector.py(판정), security/soar/(조치),\nnotify/alert.py(알림)는 전부 \"부품\"이었다. 이 파일은 그 부품들을 실제 웹 화면의\n버튼·주소(URL)와 연결해서, 사용자가 브라우저로 방문했을 때 실제로 동작하는\n\"완성된 웹사이트\"로 만들어주는 역할을 한다.\nFlask란? 파이썬으로 웹사이트(웹 서버)를 아주 적은 코드로 만들 수 있게\n도와주는 도구(프레임워크)다. \"이 주소로 누가 들어오면 이 함수를 실행해라\"\n는 규칙을 하나씩 등록해두면, 사용자가 그 주소로 접속했을 때 자동으로\n해당 함수가 실행되어 화면을 만들어 보여준다.\n실제 화면 라우트(회원가입/로그인/관리자/게시판/회원 대시보드 등)는 이제 이\n파일이 아니라 routes/ 아래 Blueprint들에 나뉘어 있다 — 이 파일에는 앱을\n만들고(Flask()), 공용 설정(세션/CSRF/요청 한도)을 하고, 그 Blueprint들을 등록하는\n\"조립\" 코드와, 요청 한도·CSRF 에러 핸들러만 남아있다. 모든 요청에 걸리는 관찰 훅\n(보안 헤더, 404 기록, 반복 접근·매크로 탐지)은 helpers/hooks.py에 있다.\n분리 배경과 각 파일이 어디로 갔는지는 docs/refactor/2026-09-15-file-split.md,\ndocs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/app.py"}, "security/lockdown.py": {"role": "영구 잠금 로직 파일. 허용 목록 IP 도 같은 단위로 비교한다.", "header": "security/lockdown.py — \"영구 출입금지 담당 부서\": 임시 잠금을 영구 잠금으로 올리고(승격),\n영구 잠금을 풀어주는(관리자 해제 / 이메일 복구) 로직 본체 (guide33 / guide34-a)\n왜 별도 모듈인가: security/soar/가 이미 security/correlate.py를 import하고 있어서, security/correlate.py가\nsecurity/soar/의 승격 함수를 직접 부르면 순환 import가 된다. 그래서 승격·해제 로직을 이\n파일 하나로 모으고, security/soar/와 security/correlate.py가 둘 다 이 파일만 import하게 한다.\n이 파일은 모듈 수준에서 db / alert / config / ip_utils만 import한다. 영구 잠금 이벤트를\n상관분석(correlate)에 흘려보내는 부분만 함수 안에서 늦게 import한다(순환 방지).\n설계 원칙 (docs의 permanent-lock 계획서 1.1 참고)\n- \"영구\"는 시간이 아니라 해제 조건의 문제다: 자동 만료가 없고 이메일 인증이나\n관리자 수동 해제로만 풀린다.\n- IP 영구 잠금은 이메일로 \"해제\"하지 않고 본인+본인 기기에게만 \"예외\"를 발급한다.\n- 허용 목록(PERMANENT_LOCK_IP_ALLOWLIST)의 IP는 절대 영구 잠그지 않는다(자충수 방지).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/lockdown.py"}, "services/geoip.py": {"role": "IP 위치 조회 부품. 대역 키면 대표 주소로 조회한다.", "header": "services/geoip.py — IP 주소로 \"어느 나라, 어느 도시에서 접속했는지\" 알아내는 부품\nnotify/alert.py가 Slack이라는 외부 서비스와의 통신만 전담하는 것처럼, 이 파일은\nip-api.com이라는 외부 서비스와의 통신만 전담한다. db(Supabase)나\n화면 쪽(helpers/request_utils.py의 _attach_locations())은 이 파일이 내부적으로\n무엇을 하는지 몰라도, get_locations() 함수 하나만 부르면 위치 정보를 받을 수 있다.\n가장 중요한 설계 포인트는 \"캐싱\"이다. ip-api.com 무료 사용은 분당 45건까지만\n허용하는데, 대시보드가 5초마다 최근 로그인 시도를 다시 그리면서 그때마다\n새로 조회하면 순식간에 한도를 넘긴다. 그래서 한 번 조회한 IP는 db(db/geoip_cache.py)를 통해\nSupabase에 저장해두고, 다음부터는 외부 API 대신 그 저장값을 재사용한다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/services/geoip.py"}}}</script>
<script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var $ = function(id){ return document.getElementById(id); };
  var KIND_LABEL = {screen:"화면 · 도착지", route:"routes", helper:"판단", db:"db", config:"설정값", later:"다른 단원"};

  var state = { sc: 0, node: null, item: 0, file: null };

  function el(tag, attrs, kids){
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function brk(t){ return t.replace(/([\/._])/g, "$1\u200b"); }
  function scen(){ return D.scenarios[state.sc]; }
  function nodeById(id){ return scen().nodes.filter(function(n){ return n.id === id; })[0]; }
  function fnName(label){ return label; }

  /* ---------- 간단 문법 강조 ---------- */
  var PY = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?''')|([rbfRBF]{0,2}"(?:\\.|[^"\\\n])*"|[rbfRBF]{0,2}'(?:\\.|[^'\\\n])*')|\b(def|class|return|if|elif|else|for|while|import|from|as|try|except|finally|with|in|not|and|or|is|None|True|False|raise|pass|lambda|yield|global|nonlocal|assert|del|continue|break)\b|(@[A-Za-z_][\w.]*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(?=\()/g;
  var PYC = [null,"t-c","t-d","t-s","t-k","t-a","t-n","t-f"];
  var HT = /(<!--[\s\S]*?-->)|(\{[{%#][\s\S]*?[}%#]\})|(<\/?[A-Za-z][\w-]*)|("[^"\n]*")|(\/?>)/g;
  var HTC = [null,"t-c","t-a","t-k","t-s","t-k"];
  var JS = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\.|[^`\\])*`)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(const|let|var|function|return|if|else|for|while|import|from|export|default|async|await|try|catch|finally|new|class|extends|typeof|interface|type|null|undefined|true|false|throw|switch|case|break|continue|of|in|as)\b|(@[A-Za-z_]\w*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_$][\w$]*)(?=\()/g;
  var JSC = [null,"t-c","t-s","t-s","t-k","t-a","t-n","t-f"];
  var SQ = /(--[^\n]*|\/\*[\s\S]*?\*\/)|((?!))|('(?:''|[^'])*')|\b(select|from|where|insert|into|values|update|set|delete|create|table|index|alter|add|drop|on|conflict|do|nothing|and|or|not|null|default|primary|key|references|cascade|if|exists|as|order|by|group|limit|desc|asc|join|left|inner|count|returns|function|language|begin|end|return|with|union|all|distinct|in|is|true|false|unique|check|constraint|timestamptz|text|integer|bigint|boolean|interval|now|replace|trigger|view|policy|enable|row|level|security|using)\b|((?!))|\b(\d+(?:\.\d+)?)\b|\b([a-z_]\w*)(?=\()/gi;
  var SQC = [null,"t-c",null,"t-s","t-k",null,"t-n","t-f"];
  var SH = /(#[^\n]*)|((?!))|("(?:\\.|[^"\\\n])*"|'[^'\n]*')|\b(if|then|else|fi|for|do|done|while|case|esac|function|echo|export|python|pip|git|cd|run|name|on|jobs|steps|uses|with|env)\b|((?!))|\b(\d+)\b/g;
  var SHC = [null,"t-c",null,"t-s","t-k",null,"t-n"];
  function tokenize(code, lang){
    var re = PY, cls = PYC;
    if (lang === "html"){ re = HT; cls = HTC; }
    else if (lang === "js"){ re = JS; cls = JSC; }
    else if (lang === "sql"){ re = SQ; cls = SQC; }
    else if (lang === "sh"){ re = SH; cls = SHC; }
    var lines = [[]];
    function push(text, c){
      var parts = text.split("\n");
      parts.forEach(function(p, i){
        if (i > 0) lines.push([]);
        if (p) lines[lines.length-1].push([p, c]);
      });
    }
    var last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(code)) !== null){
      if (m.index > last) push(code.slice(last, m.index), null);
      var idx = 1; while (idx < m.length && m[idx] === undefined) idx++;
      push(m[0], cls[idx] || null);
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++;
    }
    if (last < code.length) push(code.slice(last), null);
    return lines;
  }

  function codeTable(block, hl){
    var lines = tokenize(block.code, block.lang);
    var tbody = el("tbody");
    var hlFirst = null;
    lines.forEach(function(segs, i){
      var no = block.start + i;
      var on = hl && no >= hl[0] && no <= hl[1];
      var td = el("td", {class:"tx"});
      segs.forEach(function(s){ td.appendChild(s[1] ? el("span", {class:s[1], text:s[0]}) : document.createTextNode(s[0])); });
      if (!segs.length) td.appendChild(document.createTextNode(" "));
      var tr = el("tr", on ? {class:"hl"} : null, [el("td", {class:"ln", text:String(no)}), td]);
      if (on && !hlFirst) hlFirst = tr;
      tbody.appendChild(tr);
    });
    var box = el("div", {class:"codebox"}, [el("table", {class:"code"}, [tbody])]);
    box._hlFirst = hlFirst;
    return box;
  }

  function copyText(text, btn){
    var done = function(){ var o = btn.textContent; btn.textContent = "복사됨 ✓"; setTimeout(function(){ btn.textContent = o; }, 1200); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
    function fallback(){
      var ta = el("textarea", {style:"position:fixed;opacity:0"}); ta.value = text; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); done(); } catch(e){} document.body.removeChild(ta);
    }
  }

  /* ---------- 패널 ---------- */
  function openPanel(){ document.body.classList.add("open"); }
  function closePanel(){ document.body.classList.remove("open"); }

  function showHint(){
    $("pTitle").textContent = "코드 보는 법";
    $("pSub").textContent = "카드나 파일 이름을 누르면 실제 코드가 여기에 열립니다.";
    var ul = el("ul", {class:"hint"}, [
      el("li", {text:"카드(상자)를 누르면 그 단계에서 실행되는 실제 함수 코드가 열려요."}),
      el("li", {text:"카드 안의 📄 파일 이름을 누르면 그 파일이 어떤 역할인지, 이 단원에서 쓰이는 함수가 무엇인지 보여줘요."}),
      el("li", {text:"ƒ 함수 이름을 누르면 해당 함수 코드로 바로 이동해요."}),
      el("li", {text:"노란색 줄이 지금 단계가 담당하는 부분이에요."}),
      el("li", {text:"db.함수() 처럼 적혀 있어도 실제 코드는 db/users.py 같은 다른 파일에 있어요. 카드에 그 '진짜 파일'을 표시하고, 코드 위에 찾아가는 길도 그려줘요."}),
      el("li", {text:"위쪽 ◀ ▶ 버튼으로 실행 순서대로 한 단계씩 따라갈 수 있어요."})
    ]);
    var b = $("pBody"); b.textContent = ""; b.appendChild(ul);
  }

  function renderAlias(a){
    if (!a) return null;
    return el("div", {class:"alias"}, [
      el("div", {text:"코드에는 이렇게 적혀 있지만, 실제 함수는 다른 파일에 있어요."}),
      el("div", {class:"route"}, [
        el("span", {class:"step", text:a.call}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step", text:a.via + " (창구)"}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step real", text:a.real})
      ])
    ]);
  }

  function selectNode(id, itemIdx){
    var n = nodeById(id); if (!n) return;
    state.node = id; state.item = itemIdx || 0; state.file = null;
    $("pTitle").textContent = n.title;
    $("pSub").textContent = n.plain;
    var body = $("pBody"); body.textContent = "";
    if (n.reject) body.appendChild(el("div", {class:"n-reject", text:n.reject, style:"margin:0 0 10px"}));
    if (n.items.length > 1){
      var tabs = el("div", {class:"itabs", role:"tablist"});
      n.items.forEach(function(it, i){
        tabs.appendChild(el("button", {class:"itab", role:"tab", "aria-selected":String(i === state.item), text:it.label,
          onclick:function(){ selectNode(id, i); }}));
      });
      body.appendChild(tabs);
    }
    var it = n.items[state.item];
    var block = D.blocks[it.block];
    var linesTxt = it.hl ? (it.hl[0] === it.hl[1] ? it.hl[0] + "줄" : it.hl[0] + "–" + it.hl[1] + "줄") : "";
    var fl = el("div", {class:"fileline"}, [
      el("button", {class:"chip file", onclick:function(){ selectFile(block.path); }, text:block.path}),
      el("span", {class:"lines", text: block.start + "–" + block.end + "줄 표시" + (linesTxt ? " · 노란색 " + linesTxt : "")}),
      el("span", {class:"spacer"}),
      el("button", {class:"btn", text:"복사", onclick:function(e){ copyText(block.code, e.currentTarget); }}),
      el("a", {class:"btn link", href:D.files[block.path].github + "#L" + block.start + "-L" + block.end, target:"_blank", rel:"noopener", text:"GitHub ↗"})
    ]);
    body.appendChild(fl);
    var al = renderAlias(block.alias); if (al) body.appendChild(al);
    var box = codeTable(block, it.hl);
    body.appendChild(box);
    if (it.hl) body.appendChild(el("p", {class:"legend-hl"}, [el("b", {text:"노란색"}), " = 이 카드가 담당하는 줄"]));
    refreshSelection();
    openPanel();
    if (box._hlFirst){
      var off = box._hlFirst.offsetTop - 60;
      box.scrollTop = Math.max(0, off);
    }
    updateStepper();
  }

  function selectFile(path){
    state.file = path; state.node = null;
    var f = D.files[path];
    $("pTitle").textContent = "📄 " + path;
    $("pSub").textContent = f.role;
    var body = $("pBody"); body.textContent = "";
    body.appendChild(el("div", {class:"fileline"}, [
      el("a", {class:"btn link", href:f.github, target:"_blank", rel:"noopener", text:"GitHub에서 파일 열기 ↗"})
    ]));
    body.appendChild(el("h3", {text:"이 단원에서 쓰이는 함수", style:"font-size:13.5px;margin:12px 0 0"}));
    var ul = el("ul", {class:"flist"}), seen = {};
    D.scenarios.forEach(function(sc, si){
      sc.nodes.forEach(function(n){
        n.items.forEach(function(it, ii){
          var b = D.blocks[it.block]; if (b.path !== path) return;
          var key = si + n.id + ii; if (seen[key]) return; seen[key] = 1;
          var li = el("li");
          li.appendChild(el("button", {onclick:function(){
            if (state.sc !== si) switchScenario(si);
            selectNode(n.id, ii); scrollToNode(n.id);
          }}, [
            el("span", {class:"mono", text:it.label}), el("small", {text:sc.name + " · " + n.title})
          ]));
          ul.appendChild(li);
        });
      });
    });
    body.appendChild(ul);
    if (f.header){
      var d = el("details", {class:"hdr"}, [el("summary", {text:"파일 맨 위 설명 주석 보기"}), el("pre", {text:f.header})]);
      body.appendChild(d);
    }
    refreshSelection();
    openPanel();
  }

  /* ---------- 흐름도 ---------- */
  var cols, colIndex, nodeEls = {};
  function renderStage(){
    var sc = scen();
    var used = {}; sc.nodes.forEach(function(n){ used[n.col] = 1; });
    cols = Object.keys(used).map(Number).sort(function(a,b){ return a-b; });
    colIndex = {}; cols.forEach(function(c, i){ colIndex[c] = i + 1; });
    var stage = $("stage");
    stage.textContent = "";
    stage.style.gridTemplateColumns = "repeat(" + cols.length + ", 196px)";
    nodeEls = {};

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "edges"); svg.id = "edges";
    svg.innerHTML = '<defs>' +
      '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-call" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '</defs>';
    stage.appendChild(svg);

    cols.forEach(function(c){
      stage.appendChild(el("div", {class:"colhead", style:"grid-column:" + colIndex[c] + ";grid-row:1", text:D.columns[c]}));
    });
    var cells = {};
    sc.nodes.forEach(function(n){
      var k = n.row + ":" + n.col;
      if (!cells[k]){
        cells[k] = el("div", {class:"cell", style:"grid-column:" + colIndex[n.col] + ";grid-row:" + (n.row + 2)});
        stage.appendChild(cells[k]);
      }
      var node = buildNode(n);
      nodeEls[n.id] = node;
      cells[k].appendChild(node);
    });
    $("intro").textContent = sc.intro;
    scheduleEdges();
  }

  function buildNode(n){
    var node = el("div", {class:"node " + n.kind, role:"button", tabindex:"0", "aria-pressed":"false", "data-id":n.id,
      onclick:function(e){ if (e.target.closest(".chip")) return; selectNode(n.id, 0); },
      onkeydown:function(e){ if ((e.key === "Enter" || e.key === " ") && !e.target.closest(".chip")){ e.preventDefault(); selectNode(n.id, 0); } }});
    var title = el("div", {class:"n-title", text:n.title});
    if (n.later) title.appendChild(el("span", {class:"tag-later", text:n.later + "에서 자세히"}));
    node.appendChild(title);
    if (n.kind !== "later" && n.plain) node.appendChild(el("div", {class:"n-plain", text:n.plain}));
    if (n.reject) node.appendChild(el("div", {class:"n-reject", text:n.reject}));
    var items = el("div", {class:"n-items"});
    // 같은 파일에 있는 함수는 파일 칩 하나 아래에 함수 칩을 나란히 놓는다
    var groups = [];
    n.items.forEach(function(it, i){
      var b = D.blocks[it.block], g = groups[groups.length - 1];
      if (g && g.path === b.path) g.list.push({it: it, i: i}); else groups.push({path: b.path, list: [{it: it, i: i}]});
    });
    groups.forEach(function(g){
      var row = el("div", {class:"n-item"});
      if (g.list.length === 1 && g.list[0].it.call) row.appendChild(el("div", {class:"n-call", text:brk(g.list[0].it.call)}));
      var chips = el("div", {class:"chips"}, [
        el("button", {class:"chip file", text:brk(g.path), title:"파일 설명 보기", onclick:function(){ selectFile(g.path); }})
      ]);
      g.list.forEach(function(x){
        chips.appendChild(el("button", {class:"chip " + (x.it.snippet ? "snip" : "fn"), text:x.it.label, title:(x.it.call ? x.it.call + " — " : "") + "코드 보기",
          onclick:function(){ selectNode(n.id, x.i); }}));
      });
      row.appendChild(chips);
      items.appendChild(row);
    });
    node.appendChild(items);
    return node;
  }

  function rectIn(elm, host){
    var a = elm.getBoundingClientRect(), h = host.getBoundingClientRect();
    return {l:a.left-h.left, r:a.right-h.left, t:a.top-h.top, b:a.bottom-h.top, cx:(a.left+a.right)/2-h.left, cy:(a.top+a.bottom)/2-h.top};
  }
  var raf = 0;
  function scheduleEdges(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(drawEdges); }
  function drawEdges(){
    var stage = $("stage"), svg = $("edges"), sc = scen();
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){ p.remove(); });
    Array.prototype.slice.call(stage.querySelectorAll(".elabel")).forEach(function(p){ p.remove(); });
    var svgNS = "http://www.w3.org/2000/svg";
    sc.edges.forEach(function(e){
      var a = nodeById(e.from), b = nodeById(e.to);
      var ea = nodeEls[e.from], eb = nodeEls[e.to]; if (!ea || !eb) return;
      var ra = rectIn(ea, stage), rb = rectIn(eb, stage), d, lx, ly;
      if (a.col === b.col){
        if (b.row - a.row <= 1){
          d = "M" + ra.cx + " " + ra.b + " V" + rb.t; lx = ra.cx; ly = (ra.b + rb.t) / 2;
        } else {
          var x = Math.min(ra.l, rb.l) - 30;
          d = "M" + ra.l + " " + ra.cy + " H" + x + " V" + rb.cy + " H" + rb.l; lx = x; ly = (ra.cy + rb.cy) / 2;
        }
      } else {
        var dir = b.col > a.col ? 1 : -1;
        var x1 = dir > 0 ? ra.r : ra.l, x2 = dir > 0 ? rb.l : rb.r;
        var xm = x2 - dir * 30;
        d = "M" + x1 + " " + ra.cy + " H" + xm + " V" + rb.cy + " H" + x2;
        lx = (x1 + x2) / 2; ly = ra.cy;
      }
      var kind = e.kind === "call" ? "call" : "flow";
      var p = document.createElementNS(svgNS, "path");
      p.setAttribute("d", d); p.setAttribute("class", "e " + kind);
      p.setAttribute("marker-end", "url(#" + (kind === "call" ? "ahc" : "ah") + ")");
      p.setAttribute("data-from", e.from); p.setAttribute("data-to", e.to);
      svg.appendChild(p);
      if (e.label && kind === "flow"){
        var lab = el("span", {class:"elabel", text:e.label});
        lab.style.left = lx + "px"; lab.style.top = ly + "px";
        stage.appendChild(lab);
      }
    });
    svg.setAttribute("width", stage.scrollWidth); svg.setAttribute("height", stage.scrollHeight);
    refreshSelection();
  }

  function refreshSelection(){
    Object.keys(nodeEls).forEach(function(id){ nodeEls[id].setAttribute("aria-pressed", String(id === state.node)); });
    var svg = $("edges"); if (!svg) return;
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){
      var on = state.node && (p.getAttribute("data-from") === state.node || p.getAttribute("data-to") === state.node);
      p.classList.toggle("active", !!on);
    });
  }
  function scrollToNode(id){
    var n = nodeEls[id]; if (n && n.scrollIntoView) n.scrollIntoView({block:"center", inline:"center", behavior:"smooth"});
  }

  /* ---------- 단계 이동 / 탭 ---------- */
  function stepIndex(){ return scen().steps.indexOf(state.node); }
  function updateStepper(){
    var steps = scen().steps, i = stepIndex();
    $("stepNo").textContent = i < 0 ? "– / " + steps.length : (i + 1) + " / " + steps.length;
    $("prev").disabled = i <= 0 && state.node !== null ? true : false;
    $("next").disabled = i >= steps.length - 1;
    if (state.node === null){ $("prev").disabled = true; $("next").disabled = false; }
  }
  function go(delta){
    var steps = scen().steps, i = stepIndex();
    var j = i < 0 ? 0 : Math.max(0, Math.min(steps.length - 1, i + delta));
    selectNode(steps[j], 0); scrollToNode(steps[j]);
  }
  function renderTabs(){
    var t = $("tabs"); t.textContent = "";
    D.scenarios.forEach(function(sc, i){
      t.appendChild(el("button", {class:"tab", role:"tab", "aria-selected":String(i === state.sc), text:sc.name, onclick:function(){ switchScenario(i); }}));
    });
  }
  function switchScenario(i){
    state.sc = i; state.node = null; state.file = null;
    renderTabs(); renderStage(); showHint(); updateStepper();
    try { history.replaceState(null, "", "#" + D.scenarios[i].id); } catch(e){}
  }

  /* ---------- 시작 ---------- */
  document.title = D.title + " — 코드 흐름도";
  $("title").textContent = D.title + " · 코드 흐름도";
  $("subtitle").textContent = D.subtitle;
  $("mdlink").setAttribute("href", D.mdFile);
  $("prev").addEventListener("click", function(){ go(-1); });
  $("next").addEventListener("click", function(){ go(1); });
  $("pClose").addEventListener("click", closePanel);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closePanel(); });
  $("theme").addEventListener("click", function(){
    var r = document.documentElement, cur = r.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  });
  window.addEventListener("resize", scheduleEdges);
  if (window.ResizeObserver) new ResizeObserver(scheduleEdges).observe($("stage"));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleEdges);

  var startId = (location.hash || "").replace("#", "");
  var startIdx = 0; D.scenarios.forEach(function(s, i){ if (s.id === startId) startIdx = i; });
  switchScenario(startIdx);
  // 화면 확인/테스트용 지름길: window.__flow.select("s7")
  window.__flow = { select: function(id, i){ selectNode(id, i || 0); }, file: selectFile, state: state };
})();
</script>
</body>
</html>
