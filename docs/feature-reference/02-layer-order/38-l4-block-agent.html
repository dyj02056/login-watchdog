 "title": "조건부 UPDATE (+ version 일치)", "plain": "60초 차단에 대한 늦은 ACK가 그 사이 바뀐 영구 차단을 '적용 완료'로 만들지 못합니다.", "reject": "", "later": "", "items": [{"block": "db/network_blocks.py:update_network_block_if_status", "hl": null, "label": "update_network_block_if_status()", "call": null, "snippet": false}]}, {"id": "ack_n5", "col": 1, "row": 2, "kind": "route", "title": "② FAILED는 이유를 장부에 남긴다", "plain": "적용·해제가 실패하면 오류 문자열(최대 500자)을 last_error에 저장해 관리자 화면에서 원인을 볼 수 있게 합니다. 실패한 행은 다음 요청에서 재사용됩니다.", "reject": "", "later": "", "items": [{"block": "routes/internal/blocks.py:ack_block", "hl": [253, 266], "label": "ack_block()", "call": null, "snippet": false}]}], "edges": [{"from": "ack_n1", "to": "ack_n2", "label": "", "kind": "flow"}, {"from": "ack_n2", "to": "ack_n3", "label": "", "kind": "call"}, {"from": "ack_n2", "to": "ack_n4", "label": "", "kind": "call"}, {"from": "ack_n2", "to": "ack_n5", "label": "", "kind": "flow"}], "steps": ["ack_n1", "ack_n2", "ack_n5"]}, {"id": "release", "name": "관리자 영구 해제와 L4 해제", "intro": "영구 잠금을 풀 때는 앱 잠금(L7)과 정문 차단(L4) 두 군데를 모두 풀어야 합니다. 앱 잠금만 풀고 정문 차단이 남으면 화면은 '해제됨'인데 사용자는 여전히 접속하지 못합니다.", "nodes": [{"id": "release_n1", "col": 0, "row": 0, "kind": "screen", "title": "관리자 영구 해제 (super_admin)", "plain": "대시보드 또는 scripts/management/unlock_ip.py --permanent.", "reject": "", "later": "", "items": [{"block": "routes/admin/locks.py:api_permanent_locks_release", "hl": [152, 152], "label": "api_permanent_locks_release()", "call": null, "snippet": false}]}, {"id": "release_n2", "col": 1, "row": 1, "kind": "helper", "title": "① 앱 잠금(L7) 해제 + L4 해제 요청", "plain": "release()가 앱 잠금을 풀고 같은 흐름에서 request_unblock으로 L4 해제도 요청합니다. L4 요청 실패는 앱 잠금 해제를 되돌리지 않고 로그만 남깁니다.", "reject": "", "later": "", "items": [{"block": "security/lockdown.py:release", "hl": [272, 275], "label": "release()", "call": null, "snippet": false}]}, {"id": "release_n3", "col": 2, "row": 1, "kind": "helper", "title": "PENDING_REMOVE로 바꾸기", "plain": "해제도 '새 요청'이라 version을 올려, 해제 직전에 읽힌 옛 차단의 늦은 ACK가 덮어쓰지 못하게 합니다. fw-agent가 다음 폴링(2초)에서 ipset del 후 REMOVED를 보고합니다.", "reject": "", "later": "", "items": [{"block": "security/netblock.py:request_unblock", "hl": null, "label": "request_unblock()", "call": null, "snippet": false}]}, {"id": "release_n4", "col": 1, "row": 2, "kind": "helper", "title": "② 해제가 실패했을 때 남은 L4 해제를 이어서", "plain": "release()가 L4 실패를 삼키기 때문에 결과를 따로 확인합니다. 네 가지 결과: NONE(원래 없음) · REQUESTED(해제 요청됨) · REMOVED(이미 해제) · FAILED(요청 기록 실패). FAILED면 같은 해제를 다시 실행하면 이어서 처리합니다. 상태만 보고 필요할 때만 요청하므로 몇 번 불러도 안전합니다.", "reject": "", "later": "", "items": [{"block": "security/lockdown.py:ensure_l4_released", "hl": [298, 312], "label": "ensure_l4_released()", "call": null, "snippet": false}]}], "edges": [{"from": "release_n1", "to": "release_n2", "label": "", "kind": "flow"}, {"from": "release_n2", "to": "release_n3", "label": "", "kind": "call"}, {"from": "release_n2", "to": "release_n4", "label": "", "kind": "flow"}], "steps": ["release_n1", "release_n2", "release_n4"]}], "blocks": {"security/playbooks.py:_block_l4_ttl": {"path": "security/playbooks.py", "start": 74, "end": 78, "lang": "python", "code": "def _block_l4_ttl(playbook, ctx, results):\n    # CONNECTED와 None의 조합은 영구 차단이므로 TTL 경로는 증거를 고정한다.\n    return (_required(ctx, \"ip\"), \"NET_FLOOD\"), dict(\n        evidence=\"SPOOFABLE\", ttl_seconds=None, requested_by=f\"playbook:{playbook}\"\n    )", "alias": null}, "security/netblock.py:request_block": {"path": "security/netblock.py", "start": 150, "end": 304, "lang": "python", "code": "def request_block(\n    ip: str,\n    reason: str,\n    evidence: str,\n    ttl_seconds: int | None = None,\n    requested_by: str = \"playbook\",\n) -> bool:\n    \"\"\"network_blocks에 '막아라'를 기록한다. 실제로 바뀌었을 때만 True.\n\n    reason은 계약서 K12 값, evidence는 'SPOOFABLE' 또는 'CONNECTED'.\n    TTL 계산(기본 × 2^반복, 상한)은 이 함수만 한다 — 플레이북은 ttl_seconds를 넘기지 않는다(K7).\n    \"\"\"\n    # 1. 입력 검증 — 거절할 때마다 이유를 한 줄 남긴다(플레이북 결과가 SKIPPED/False일 때\n    #    서버 로그에서 왜 그랬는지 바로 찾을 수 있게).\n    if not ip or \"/\" in ip:\n        # 대역 차단은 같은 NAT 뒤 정상 사용자까지 막으므로 받지 않는다.\n        print(f\"[netblock] 거부: 잘못된 IP 형식 또는 대역 ('{ip}')\")\n        return False\n\n    try:\n        parsed_ip = ipaddress.ip_address(ip)\n        if parsed_ip.version == 6:\n            # fw-agent의 lw_block은 hash:ip(IPv4) 집합이다. 앱의 IPv6 키(/64 대역, guide42)는\n            # 대역이라 위 '/' 규칙과도 맞지 않는다.\n            print(f\"[netblock] 거부: IPv6 차단 미지원 ('{ip}')\")\n            return False\n    except ValueError:\n        print(f\"[netblock] 거부: IP 해석 실패 ('{ip}')\")\n        return False\n\n    if is_infrastructure_ip(ip):\n        # 위조된 출발지로 우리 core·gateway 주소를 막게 만드는 공격을 여기서 끊는다(guide57).\n        print(f\"[netblock] 거부: 인프라·특수 주소 ('{ip}')\")\n        return False\n\n    if evidence not in _VALID_EVIDENCES:\n        print(f\"[netblock] 거부: 잘못된 evidence ('{evidence}')\")\n        return False\n\n    if reason not in _VALID_REASONS:\n        print(f\"[netblock] 거부: 잘못된 reason ('{reason}')\")\n        return False\n\n    if lockdown.is_ip_allowlisted(ip):\n        # 관리자 PC·Docker 게이트웨이(172.28.0.1 등)를 정문에서 막으면 시연 중 화면에 들어갈 수\n        # 없다. 앱 잠금(L7)과 같은 목록을 써서 두 계층의 예외가 어긋나지 않게 한다.\n        print(f\"[netblock] 거부: 허용 목록 IP ('{ip}')\")\n        return False\n\n    if ttl_seconds is not None and (isinstance(ttl_seconds, bool) or not isinstance(ttl_seconds, int)):\n        print(f\"[netblock] 거부: ttl_seconds가 정수가 아님 ({ttl_seconds!r})\")\n        return False\n\n    if ttl_seconds is not None and ttl_seconds <= 0:\n        # 0을 그대로 두면 fw-agent에서 ipset timeout 0(= 만료 없음)이 되어 영구 차단으로 바뀐다.\n        print(f\"[netblock] 거부: ttl_seconds가 0 이하 ({ttl_seconds})\")\n        return False\n\n    # 2. TTL 및 expires_at 계산\n    now = _now_utc()\n    expires_dt: datetime | None = None\n\n    if evidence == \"SPOOFABLE\":\n        # 위조 가능한 증거는 영구 차단 금지(상위 계획서 P2). 남의 주소를 사칭한 SYN만으로\n        # 그 주소의 주인이 영원히 막히면 안 되기 때문이다.\n        if ttl_seconds is None:\n            # 최근 NET_BLOCK_REPEAT_DAYS일 동안 실제로 막혔던 횟수(NET_BLOCKED 이벤트)만큼 2배씩.\n            # '요청' 횟수가 아니라 '실제 적용' 횟수를 세므로, 거절·실패한 요청은 늘리지 않는다.\n            since_dt = now - timedelta(days=config.NET_BLOCK_REPEAT_DAYS)\n            recent_count = db.count_recent_net_blocked_events(ip, _isoformat_utc(since_dt))\n            calculated_ttl = config.NET_BLOCK_DEFAULT_TTL_SECONDS * (2 ** recent_count)\n            ttl = min(calculated_ttl, config.NET_BLOCK_MAX_TTL_SECONDS)\n        else:\n            ttl = min(ttl_seconds, config.NET_BLOCK_MAX_TTL_SECONDS)\n        expires_dt = now + timedelta(seconds=ttl)\n    else:  # CONNECTED\n        if ttl_seconds is None:\n            expires_dt = None  # 영구(expires_at=NULL). CR-01 킬체인 전용(K7 block_l4).\n        else:\n            # 계약서는 CONNECTED+TTL의 상한을 정하지 않았지만, 일부러 TTL을 준 요청은 '임시'라는\n            # 뜻이므로 SPOOFABLE과 같은 상한을 둔다. 영구가 필요하면 ttl_seconds=None으로 부른다.\n            ttl = min(ttl_seconds, config.NET_BLOCK_MAX_TTL_SECONDS)\n            expires_dt = now + timedelta(seconds=ttl)\n\n    expires_at = _isoformat_utc(expires_dt) if expires_dt is not None else None\n    now_iso = _isoformat_utc(now)\n\n    # 3. DB 기존 행 조회 및 상태 전이\n    # Supabase REST에는 트랜잭션이 없으므로 '읽은 상태 그대로일 때만 갱신'(조건부 UPDATE)과\n    # 기본 키(ip_address) 충돌로 동시 요청을 정리한다(AGENTS.md 10번).\n    existing = db.get_network_block(ip)\n\n    if existing is None:\n        new_row = {\n            \"ip_address\": ip,\n            \"status\": \"PENDING_APPLY\",\n            \"reason\": reason,\n            \"evidence\": evidence,\n            \"expires_at\": expires_at,\n            \"requested_by\": requested_by,\n            \"requested_at\": now_iso,\n            \"applied_at\": None,\n            \"removed_at\": None,\n            \"last_error\": None,\n        }\n        inserted = db.insert_network_block(new_row)\n        if inserted:\n            return True\n        # 동시 요청으로 insert 실패 시(다른 스레드가 먼저 넣음) 한 번 다시 읽어 아래 규칙으로 처리\n        existing = db.get_network_block(ip)\n        if existing is None:\n            return False\n\n    current_status = existing.get(\"status\")\n\n    if current_status in _ACTIVE_STATUSES:\n        # 이미 막혀 있으면 더 강한 요청일 때만 갱신(멱등). 같은 SYN Flood 경보가 몇 초 간격으로\n        # 여러 번 와도 TTL이 매번 늘어나거나 fw-agent가 같은 IP를 반복 처리하지 않게 한다.\n        if not _is_stronger(expires_dt, existing.get(\"expires_at\")):\n            return False\n\n        # 한 번이라도 연결 완성 증거가 있었으면 그 사실을 잃지 않는다.\n        merged_evidence = \"CONNECTED\" if (existing.get(\"evidence\") == \"CONNECTED\" or evidence == \"CONNECTED\") else evidence\n        update_fields = {\n            \"status\": \"PENDING_APPLY\",  # fw-agent가 새 TTL로 다시 add하게 한다\n            \"reason\": reason,\n            \"evidence\": merged_evidence,\n            \"expires_at\": expires_at,\n            \"requested_by\": requested_by,\n            \"requested_at\": now_iso,\n            \"applied_at\": None,\n            \"removed_at\": None,\n            \"last_error\": None,\n        }\n        return _update_with_version(ip, current_status, existing, _with_retry_reset(existing, update_fields))\n\n    if current_status in _REUSABLE_STATUSES:\n        # 해제됐거나 실패한 행은 같은 행을 새 요청으로 재사용한다(기본 키가 ip_address라 새 행을\n        # 만들 수 없다). 과거 기록은 security_events의 NET_BLOCKED 이력으로 남아 있다.\n        update_fields = {\n            \"status\": \"PENDING_APPLY\",\n            \"reason\": reason,\n            \"evidence\": evidence,\n            \"expires_at\": expires_at,\n            \"requested_by\": requested_by,\n            \"requested_at\": now_iso,\n            \"applied_at\": None,\n            \"removed_at\": None,\n            \"last_error\": None,\n        }\n        return _update_with_version(ip, current_status, existing, _with_retry_reset(existing, update_fields))\n\n    # 알 수 없는 상태(표 제약상 나오면 안 됨)는 건드리지 않는다.\n    print(f\"[netblock] 거부: 알 수 없는 기존 상태 ('{ip}', status={current_status!r})\")\n    return False", "alias": null}, "security/lockdown.py:is_ip_allowlisted": {"path": "security/lockdown.py", "start": 36, "end": 42, "lang": "python", "code": "def is_ip_allowlisted(ip: str) -> bool:\n    \"\"\"이 IP가 \"절대 영구 잠그지 않는 목록\"(관리자 PC 등)에 있는지.\n\n    양쪽을 같은 단위로 정규화해서 비교한다(guide42) — 요청 IP는 IPv6면 /64 대역 키로 들어오므로,\n    .env에 관리자 PC의 IPv6 전체 주소를 적어도 같은 대역이면 허용 목록으로 인정된다.\"\"\"\n    key = normalize_ip(ip)\n    return any(normalize_ip(entry) == key for entry in config.PERMANENT_LOCK_IP_ALLOWLIST)", "alias": null}, "db/network_blocks.py:count_recent_net_blocked_events": {"path": "db/network_blocks.py", "start": 69, "end": 79, "lang": "python", "code": "def count_recent_net_blocked_events(ip: str, since_iso: str) -> int:\n    res = (\n        db.get_client()\n        .table(\"security_events\")\n        .select(\"id\", count=\"exact\")\n        .eq(\"event_type\", \"NET_BLOCKED\")\n        .eq(\"ip_address\", ip)\n        .gte(\"detected_at\", since_iso)\n        .execute()\n    )\n    return res.count or 0", "alias": null}, "config.py:305-307": {"path": "config.py", "start": 305, "end": 307, "lang": "python", "code": "NET_BLOCK_DEFAULT_TTL_SECONDS = int(os.environ.get(\"NET_BLOCK_DEFAULT_TTL_SECONDS\", 3600))\nNET_BLOCK_MAX_TTL_SECONDS = int(os.environ.get(\"NET_BLOCK_MAX_TTL_SECONDS\", 21600))\nNET_BLOCK_REPEAT_DAYS = int(os.environ.get(\"NET_BLOCK_REPEAT_DAYS\", 30))", "alias": null}, "security/netblock.py:_is_stronger": {"path": "security/netblock.py", "start": 133, "end": 147, "lang": "python", "code": "def _is_stronger(new_expires: datetime | None, cur_expires_raw: str | None) -> bool:\n    \"\"\"새 요청이 기존 차단보다 '더 강한지'(계약서 K7 멱등 규칙).\n\n    더 강함 = 기존이 영구가 아니고, (새 요청이 영구이거나 새 만료 시각이 더 늦음).\n    기존 만료 값이 있는데 해석할 수 없으면 더 강한 것으로 본다 — 깨진 값을 올바른 값으로\n    바로잡는 쪽이, 깨진 값 때문에 차단 연장을 영영 못 하는 것보다 안전하다.\n    \"\"\"\n    if cur_expires_raw is None:\n        return False  # 기존이 영구면 어떤 요청도 더 강하지 않다.\n    if new_expires is None:\n        return True  # 기존은 TTL, 새 요청은 영구.\n    cur_expires = _parse_iso(cur_expires_raw)\n    if cur_expires is None:\n        return True\n    return new_expires > cur_expires", "alias": null}, "security/netblock.py:_update_with_version": {"path": "security/netblock.py", "start": 314, "end": 326, "lang": "python", "code": "def _update_with_version(ip: str, current_status: str, existing: dict, fields: dict) -> bool:\n    \"\"\"읽은 행 그대로일 때만 바꾸고, version 칸이 있으면 1 올린다(요청 번호).\n\n    fw-agent는 GET /blocks에서 받은 version을 ACK에 그대로 돌려준다. 요청이 바뀔 때마다 번호가\n    달라지므로, 60초 차단에 대한 늦은 ACK가 그 사이 바뀐 영구 차단을 \"적용 완료\"로 만들지 못한다\n    (10/26 강사 피드백 4). guide56 실행 전 DB(version 칸 없음)에서는 예전처럼 상태만 조건으로 쓴다.\n    \"\"\"\n    if \"version\" not in existing:\n        return db.update_network_block_if_status(ip, [current_status], fields)\n    version = int(existing.get(\"version\") or 0)\n    return db.update_network_block_if_status(\n        ip, [current_status], {**fields, \"version\": version + 1}, expected_version=version,\n    )", "alias": null}, "db/network_blocks.py:update_network_block_if_status": {"path": "db/network_blocks.py", "start": 47, "end": 66, "lang": "python", "code": "def update_network_block_if_status(\n    ip: str, from_statuses: list[str], fields: dict, expected_version: int | None = None,\n) -> bool:\n    \"\"\"상태가 from_statuses 중 하나일 때만 바꾼다. expected_version을 주면 version도 같아야 바꾼다.\n\n    상태만으로는 \"60초 차단 요청\"과 그 사이 바뀐 \"영구 차단 요청\"이 둘 다 PENDING_APPLY라 구분되지\n    않는다. 요청마다 올리는 version(guide56)을 함께 조건에 걸어, 늦게 온 옛 요청의 ACK가 새 요청을\n    완료시키지 못하게 한다(10/26 강사 피드백 4).\n    \"\"\"\n    query = (\n        db.get_client()\n        .table(\"network_blocks\")\n        .update(fields)\n        .eq(\"ip_address\", ip)\n        .in_(\"status\", from_statuses)\n    )\n    if expected_version is not None:\n        query = query.eq(\"version\", expected_version)\n    res = query.execute()\n    return bool(res.data)", "alias": null}, "netwatch/fw_agent/fw_agent.py:AgentClient.get_blocks": {"path": "netwatch/fw_agent/fw_agent.py", "start": 347, "end": 366, "lang": "python", "code": "    def get_blocks(self) -> list[dict[str, Any]]:\n        \"\"\"K9 ① GET /api/internal/blocks — 원하는 상태 목록을 받는다.\n\n        응답 모양: {\"generated_at\": \"...\", \"blocks\": [{\"ip\", \"status\", \"ttl_seconds\"}, ...]}.\n        GET은 본문이 없으므로 빈 바이트 b\"\"로 서명한다(K3).\n        \"\"\"\n        headers = sign_headers(self.secret, b\"\")\n        resp = self.session.get(f\"{self.base_url}/api/internal/blocks\", headers=headers, timeout=3)\n        resp.raise_for_status()\n        data = resp.json()\n        # 응답이 이상한 모양이면 루프가 죽지 않도록 빈 목록 대신 예외로 올린다 — 빈 목록을\n        # 돌려주면 다음 reconcile이 '막을 게 없다'고 판단해 기존 차단을 모두 지워 버린다.\n        # \"blocks\" 칸이 아예 없는 응답도 같다: 기본값 []로 받으면 정상적인 '막을 것 없음'과 구분되지\n        # 않으므로(10/26 강사 피드백), 칸이 있고 목록일 때만 받아들인다. 진짜 빈 목록은 \"blocks\": [] 로 온다.\n        if not isinstance(data, dict) or \"blocks\" not in data:\n            raise ValueError(\"blocks 응답에 blocks 칸이 없음\")\n        blocks = data[\"blocks\"]\n        if not isinstance(blocks, list):\n            raise ValueError(\"blocks 응답이 목록이 아님\")\n        return blocks", "alias": null}, "routes/internal/blocks.py:list_blocks": {"path": "routes/internal/blocks.py", "start": 113, "end": 188, "lang": "python", "code": "@internal_bp.route(\"/blocks\", methods=[\"GET\"])\ndef list_blocks():\n    \"\"\"fw-agent가 2초마다 가져가는 차단 목록(계약서 K9 ①).\n\n    응답 전에 만료된 차단을 REMOVED로 바꾼다(지연 만료). 앱에 별도 스케줄러가 없으므로\n    agent가 묻는 이 순간이 만료를 정리하기 가장 확실한 시점이다.\"\"\"\n    if verify_request({\"fw-agent\"}) is None:\n        return jsonify(error=\"unauthorized\"), 401\n\n    # 0. 대역 값이 있는데 형식이 틀리면 아무것도 내보내지 않는다(guide57). 예전에는 경고만 찍고 거르지 않은\n    #    목록을 내보내, 오타 하나로 다른 PC 대역의 차단까지 이 PC 정문에 걸렸다. fw-agent는 503을 오류로 보고\n    #    마지막 상태를 유지하고, 그 사이 poll_failures 알림이 울린다.\n    #    값이 아예 비어 있으면 예전처럼 거르지 않는다(계약서 K1) — 대신 아래 2번에서 인프라 주소는 항상 뺀다.\n    edge = _edge_network()\n    if config.NET_EDGE_SUBNET and edge is None:\n        print(f\"[blocks] 설정 오류: NET_EDGE_SUBNET 형식이 틀림 ('{config.NET_EDGE_SUBNET}')\")\n        return jsonify(error=\"misconfigured\"), 503\n    if config.LW_NODE_NAME and edge is None:\n        print(f\"[blocks] 경고: LW_NODE_NAME={config.LW_NODE_NAME}인데 NET_EDGE_SUBNET이 비어 대역으로 거르지 않습니다\")\n\n    now_dt = datetime.now(timezone.utc)\n    now_iso = now_dt.isoformat()\n\n    # 1. 지연 만료 처리\n    expired_rows = db.list_expired_network_blocks(now_iso)\n    for row in expired_rows:\n        ip = row[\"ip_address\"]\n        cur_status = row[\"status\"]\n        if db.update_network_block_if_status(ip, [cur_status], {\"status\": \"REMOVED\", \"removed_at\": now_iso}):\n            net_ingest.resolve_net_blocked(ip)\n            # 공격이 아직 진행 중이면 바로 다시 막는다. 아래 2번 조회가 새 PENDING_APPLY를 같은 응답에\n            # 싣기 때문에, 다음 분의 경보를 기다리지 않아도 된다(10/29 공백 보완). 관리자 수동 차단은 제외.\n            if row.get(\"reason\") == \"NET_FLOOD\":\n                correlate.reblock_on_expiry(ip)\n\n    # 1-2. 적용 실패 재시도(guide57). 어떤 오류도 목록 응답을 깨지 않게 삼킨다.\n    try:\n        _retry_failed_applies(now_dt)\n    except Exception as error:\n        print(f\"[blocks] 적용 재시도 처리 오류: {type(error).__name__}\")\n\n    # 2. 원하는 차단 목록 조회 및 서브넷 필터링\n    desired = db.list_desired_network_blocks()\n    if edge is not None:\n        desired = [r for r in desired if ipaddress.ip_address(r[\"ip_address\"]) in edge]\n    # request_block이 인프라 주소를 거절하지만, 예전에 들어간 행이나 손으로 넣은 행도 내보내지 않는다(guide57).\n    desired = [r for r in desired if not netblock.is_infrastructure_ip(r[\"ip_address\"])]\n\n    # 3. 항목별 ttl_seconds 계산\n    blocks_res = []\n    for r in desired:\n        ip = r[\"ip_address\"]\n        st = r[\"status\"]\n        exp_str = r.get(\"expires_at\")\n\n        ttl_sec = None\n        if st in (\"PENDING_APPLY\", \"APPLIED\") and exp_str:\n            exp_dt = _parse_iso(exp_str)\n            if exp_dt:\n                rem = (exp_dt - now_dt).total_seconds()\n                if rem <= 0:\n                    continue\n                ttl_sec = math.ceil(rem)\n\n        item = {\n            \"ip\": ip,\n            \"status\": st,\n            \"ttl_seconds\": ttl_sec\n        }\n        # 요청 번호(guide56). fw-agent가 ACK에 그대로 돌려줘 \"어느 요청의 완료인지\"를 구분한다.\n        # version 칸이 없는 DB(guide56 실행 전)에서는 칸을 빼서 예전 응답 모양을 그대로 둔다.\n        if \"version\" in r:\n            item[\"version\"] = r[\"version\"]\n        blocks_res.append(item)\n\n    return jsonify({\"generated_at\": now_iso, \"blocks\": blocks_res})", "alias": null}, "db/network_blocks.py:list_desired_network_blocks": {"path": "db/network_blocks.py", "start": 82, "end": 90, "lang": "python", "code": "def list_desired_network_blocks() -> list[dict]:\n    res = (\n        db.get_client()\n        .table(\"network_blocks\")\n        .select(\"*\")\n        .in_(\"status\", [\"PENDING_APPLY\", \"APPLIED\", \"PENDING_REMOVE\"])\n        .execute()\n    )\n    return res.data or []", "alias": null}, "security/net_ingest.py:resolve_net_blocked": {"path": "security/net_ingest.py", "start": 100, "end": 105, "lang": "python", "code": "def resolve_net_blocked(ip: str) -> None:\n    \"\"\"fw-agent가 REMOVED를 보고했거나 TTL이 만료됐을 때 부른다.\n\n    그 IP의 미해결 NET_BLOCKED만 해결 처리한다(다른 이벤트는 건드리지 않음).\n    \"\"\"\n    db.resolve_net_blocked_events(ip)", "alias": null}, "netwatch/fw_agent/fw_agent.py:process_blocks": {"path": "netwatch/fw_agent/fw_agent.py", "start": 509, "end": 597, "lang": "python", "code": "def process_blocks(\n    blocks: list[dict[str, Any]],\n    backend: FirewallBackend,\n    client: Any,\n    allowlist: list[str],\n    edge_network: ipaddress.IPv4Network | None = None,\n) -> dict[str, int | None]:\n    \"\"\"받은 목록 한 번을 처리하고, \"지금 ipset에 있어야 할 IP와 남은 TTL\"을 돌려준다.\n\n    계약서 K9 ①의 agent 동작:\n      - PENDING_APPLY  → ipset add 후 ack APPLIED (실패하면 ack FAILED + 오류 문자열)\n      - PENDING_REMOVE → ipset del 후 ack REMOVED (실패하면 ack FAILED)\n      - APPLIED        → 여기서는 건드리지 않는다. 실제로 빠져 있으면 reconcile(60초)이 다시 넣는다.\n        2초마다 ipset list를 부르지 않으려는 것이다(요청서 C1-3 5번).\n    방화벽 반영 실패와 ack 전송 실패를 따로 다루는 이유: ipset add는 성공했는데 ack만 실패했을 때\n    FAILED를 보고하면 앱은 '못 막았다'고 기록하고, 이 IP를 desired에서 빼면 reconcile이 실제\n    차단까지 지워 버린다. 그래서 ack 실패는 로그만 남기고 desired에 그대로 두어 다음 폴링에서\n    다시 보고하게 한다.\n    \"\"\"\n    desired: dict[str, int | None] = {}\n\n    for block in blocks:\n        if not isinstance(block, dict):\n            print(f\"[fw-agent] 무시: 목록 항목이 객체가 아님 ({block!r})\")\n            continue\n\n        ip = _parse_ipv4(block.get(\"ip\"))\n        status = block.get(\"status\")\n        if ip is None:\n            # ack로 알릴 수도 없다(앱이 ip 칸 오류로 400을 돌려준다). 로그만 남기고 건너뛴다.\n            print(f\"[fw-agent] 무시: 잘못된 ip ({block.get('ip')!r})\")\n            continue\n\n        ttl_ok, ttl = _parse_ttl(block.get(\"ttl_seconds\"))\n        # 요청 번호(guide56). 정수가 아니면 없는 것으로 보고 예전처럼 ack한다.\n        version = block.get(\"version\")\n        if isinstance(version, bool) or not isinstance(version, int):\n            version = None\n\n        if _is_ip_allowlisted(ip, allowlist):\n            # 허용 목록 IP는 어떤 상태로 와도 막지 않는다. PENDING_APPLY만 FAILED로 알려\n            # 앱의 장부가 '대기 중'으로 계속 남지 않게 한다. reconcile이 집합에서도 지운다.\n            if status == _STATUS_PENDING_APPLY:\n                _safe_ack(client, ip, \"FAILED\", \"allowlisted\", version=version)\n            continue\n\n        refusal = _refusal_reason(ip, edge_network)\n        if refusal is not None:\n            # 우리 인프라나 대역 밖 주소는 어떤 상태로 와도 막지 않는다(guide57). 허용 목록과 같은 방식이다.\n            if status == _STATUS_PENDING_APPLY:\n                _safe_ack(client, ip, \"FAILED\", refusal, version=version)\n            continue\n\n        if status == _STATUS_PENDING_APPLY:\n            if not ttl_ok:\n                _safe_ack(client, ip, \"FAILED\", f\"invalid ttl_seconds: {block.get('ttl_seconds')!r}\", version=version)\n                continue\n            try:\n                backend.add(ip, ttl)\n            except Exception as e:\n                err_msg = str(e)\n                print(f\"[fw-agent] add 차단 실패 ({ip}): {err_msg}\")\n                _safe_ack(client, ip, \"FAILED\", err_msg, version=version)\n                continue\n            desired[ip] = ttl\n            _safe_ack(client, ip, \"APPLIED\", version=version)\n\n        elif status == _STATUS_PENDING_REMOVE:\n            try:\n                backend.remove(ip)\n            except Exception as e:\n                err_msg = str(e)\n                print(f\"[fw-agent] remove 해제 실패 ({ip}): {err_msg}\")\n                _safe_ack(client, ip, \"FAILED\", err_msg, version=version)\n                continue\n            _safe_ack(client, ip, \"REMOVED\", version=version)\n\n        elif status == _STATUS_APPLIED:\n            if not ttl_ok:\n                # 남은 시간이 이상한 APPLIED는 desired에서 빼서 reconcile이 집합에서 지우게 한다.\n                # 영구로 잘못 다시 넣는 것보다 잠시 풀리는 쪽이 안전하다(P2).\n                print(f\"[fw-agent] 무시: APPLIED의 ttl_seconds가 잘못됨 ({ip}, {block.get('ttl_seconds')!r})\")\n                continue\n            desired[ip] = ttl\n\n        else:\n            print(f\"[fw-agent] 무시: 알 수 없는 status ({ip}, {status!r})\")\n\n    return desired", "alias": null}, "netwatch/fw_agent/fw_agent.py:_parse_ttl": {"path": "netwatch/fw_agent/fw_agent.py", "start": 398, "end": 414, "lang": "python", "code": "def _parse_ttl(value: Any) -> tuple[bool, int | None]:\n    \"\"\"ttl_seconds 칸을 (올바른가, 값)으로 바꾼다.\n\n    - None → (True, None): 영구 차단(또는 PENDING_REMOVE).\n    - 1 이상의 정수 → (True, 그 값).\n    - 그 밖(0 이하, 문자열, bool 등) → (False, None).\n    0 이하를 따로 거르는 이유: ipset에서 timeout 0은 '만료 없음'이라, 잘못 넘어온 0이 그대로\n    들어가면 위조 가능한 증거(SPOOFABLE)의 TTL 차단이 영구 차단으로 바뀐다(상위 계획서 P2 위반).\n    앱은 남은 초가 0 이하인 행을 빼고 보내지만(K9 ①), 여기서 한 번 더 막는다.\n    \"\"\"\n    if value is None:\n        return True, None\n    if isinstance(value, bool) or not isinstance(value, int):\n        return False, None\n    if value <= 0:\n        return False, None\n    return True, value", "alias": null}, "netwatch/fw_agent/fw_agent.py:IptablesBackend.add": {"path": "netwatch/fw_agent/fw_agent.py", "start": 216, "end": 227, "lang": "python", "code": "    def add(self, ip: str, timeout: int | None) -> None:\n        \"\"\"IP를 집합에 넣는다. timeout=None이면 0(만료 없음 = 영구).\n\n        \"-exist\"를 붙이는 이유: 이미 있는 IP를 다시 넣어도 오류가 나지 않고 timeout만 새 값으로\n        바뀐다. 2초마다 같은 PENDING_APPLY를 받아도(ack가 늦게 반영된 경우) 안전하다.\n        \"\"\"\n        to_val = str(timeout or 0)\n        code, err = self.runner.run(\n            [\"ipset\", \"add\", self.set_name, ip, \"timeout\", to_val, \"-exist\"]\n        )\n        if code != 0:\n            raise RuntimeError(f\"ipset add failed for {ip}: {err}\")", "alias": null}, "netwatch/fw_agent/fw_agent.py:IptablesBackend.ensure_ready": {"path": "netwatch/fw_agent/fw_agent.py", "start": 175, "end": 214, "lang": "python", "code": "    def ensure_ready(self) -> None:\n        \"\"\"시작할 때 한 번: 집합과 DROP 규칙이 없으면 만든다. 이미 있으면 아무것도 바꾸지 않는다.\n\n        - \"timeout 0\"으로 만드는 이유: 집합이 항목별 timeout을 지원하게 하면서, 기본값은\n          '만료 없음'으로 둔다. 영구 차단(CONNECTED)은 add에서 timeout 0을 넘긴다.\n        - \"-exist\": 컨테이너가 재시작돼도 기존 집합(이미 막힌 IP)을 지우지 않고 그대로 쓴다.\n        - iptables는 -C(확인)로 규칙이 이미 있는지 본 뒤 없을 때만 -I로 맨 앞에 넣는다.\n          재시작할 때마다 같은 규칙이 겹겹이 쌓이지 않게 하려는 것이다.\n        - raw PREROUTING에도 같은 DROP을 둔다. raw는 연결 추적(conntrack)보다 앞이라, 차단된 IP의\n          패킷마다 연결 추적 항목을 만들고 조회하는 일을 건너뛴다. INPUT에서 버린 패킷도 표에 확정되지는\n          않아 표가 차오르지는 않는다(10/29 Docker 실측: INPUT만으로 SYN 3000개를 버려도 nf_conntrack_count\n          증가 0) — 그래서 효과는 SYN Flood 때 패킷당 처리량을 줄이는 정도다.\n          INPUT 규칙은 raw 규칙이 실패하거나 지워졌을 때의 예비로 그대로 둔다. 그래서 raw 실패는\n          시작을 막지 않고 경고만 남긴다 — INPUT만으로도 차단 자체는 된다.\n        \"\"\"\n        # 1. ipset 생성\n        code, err = self.runner.run(\n            [\"ipset\", \"create\", self.set_name, \"hash:ip\", \"timeout\", \"0\", \"-exist\"]\n        )\n        if code != 0:\n            raise RuntimeError(f\"ipset create failed: {err}\")\n\n        # 2. raw PREROUTING 규칙(연결 추적 전 차단). INPUT 규칙보다 먼저 확인한다.\n        raw_rule = [\"PREROUTING\", \"-m\", \"set\", \"--match-set\", self.set_name, \"src\", \"-j\", \"DROP\"]\n        raw_chk, _ = self.runner.run([\"iptables\", \"-t\", \"raw\", \"-C\", *raw_rule])\n        if raw_chk != 0:\n            raw_ins, raw_err = self.runner.run([\"iptables\", \"-t\", \"raw\", \"-I\", raw_rule[0], \"1\", *raw_rule[1:]])\n            if raw_ins != 0:\n                print(f\"[fw-agent] 경고: raw PREROUTING 규칙을 넣지 못해 INPUT 규칙만 씁니다: {raw_err}\")\n\n        # 3. filter INPUT 규칙 확인 및 없으면 삽입\n        chk_code, _ = self.runner.run(\n            [\"iptables\", \"-C\", \"INPUT\", \"-m\", \"set\", \"--match-set\", self.set_name, \"src\", \"-j\", \"DROP\"]\n        )\n        if chk_code != 0:\n            ins_code, ins_err = self.runner.run(\n                [\"iptables\", \"-I\", \"INPUT\", \"1\", \"-m\", \"set\", \"--match-set\", self.set_name, \"src\", \"-j\", \"DROP\"]\n            )\n            if ins_code != 0:\n                raise RuntimeError(f\"iptables insert failed: {ins_err}\")", "alias": null}, "netwatch/fw_agent/fw_agent.py:reconcile": {"path": "netwatch/fw_agent/fw_agent.py", "start": 600, "end": 660, "lang": "python", "code": "def reconcile(\n    desired: dict[str, int | None] | None,\n    backend: FirewallBackend,\n    allowlist: list[str] | None = None,\n    received_at: float | None = None,\n    now: float | None = None,\n    edge_network: ipaddress.IPv4Network | None = None,\n) -> None:\n    \"\"\"실제 ipset과 원하는 상태(desired)를 전부 비교해 어긋난 것(drift)을 바로잡는다.\n\n    누가 손으로 ipset del을 했거나, 컨테이너가 재시작됐거나, ack가 유실된 경우를 60초 안에\n    맞추려는 것이다(상위 계획서 2.6). 집합에 있는데 desired에 없거나 허용 목록인 IP는 지우고,\n    desired에 있는데 집합에 없는 IP는 남은 TTL로 다시 넣는다.\n\n    desired가 None이면(아직 한 번도 목록을 받지 못함) 아무것도 하지 않는다. 시작 직후 앱이\n    응답하지 않을 때 빈 desired로 비교하면 재시작 전부터 있던 차단을 전부 지워 버리기 때문이다\n    (\"앱이 응답하지 않으면 마지막 상태 유지\" — 요청서 C1-3 7번).\n\n    received_at(목록을 받은 time.monotonic() 시각)을 주면 TTL을 \"남은 초\"가 아니라 \"언제까지\"로 본다.\n    앱이 멈춰 목록이 오래 갱신되지 않는 동안 커널이 TTL 항목을 정상적으로 지웠는데, 옛 목록의 남은 초로\n    다시 넣으면 10초 차단이 60초마다 끝없이 되살아난다(10/26 강사 피드백 2). 그래서 다시 넣을 때는\n    \"받은 시각 + 남은 초 - 지금\"을 쓰고, 이미 지난 차단은 넣지 않고 desired에서도 뺀다.\n    monotonic 시계를 쓰는 이유: PC 시계가 바뀌어도 경과 시간이 흔들리지 않는다.\n    received_at 없이 부르면 예전처럼 받은 남은 초를 그대로 쓴다.\n    \"\"\"\n    if desired is None:\n        print(\"[fw-agent] reconcile 건너뜀: 아직 앱에서 목록을 받지 못함\")\n        return\n\n    allowlist = allowlist or []\n    current_ips = backend.list_ips()\n\n    for ip in current_ips:\n        refused = _parse_ipv4(ip) is not None and _refusal_reason(ip, edge_network) is not None\n        if _is_ip_allowlisted(ip, allowlist) or refused or ip not in desired:\n            try:\n                backend.remove(ip)\n            except Exception as e:\n                print(f\"[fw-agent] reconcile remove 실패 ({ip}): {e}\")\n\n    if received_at is not None:\n        elapsed = (time.monotonic() if now is None else now) - received_at\n    else:\n        elapsed = 0.0\n\n    for ip, ttl in list(desired.items()):\n        if _is_ip_allowlisted(ip, allowlist) or ip in current_ips:\n            continue\n        if _refusal_reason(ip, edge_network) is not None:\n            continue\n        if ttl is not None and received_at is not None:\n            remaining = math.ceil(ttl - elapsed)\n            if remaining <= 0:\n                # 정해진 시각이 지난 TTL 차단 — 커널이 지운 것이 맞으므로 다시 넣지 않는다.\n                del desired[ip]\n                continue\n            ttl = remaining\n        try:\n            backend.add(ip, ttl)\n        except Exception as e:\n            print(f\"[fw-agent] reconcile add 실패 ({ip}): {e}\")", "alias": null}, "netwatch/fw_agent/fw_agent.py:AgentClient.ack": {"path": "netwatch/fw_agent/fw_agent.py", "start": 368, "end": 380, "lang": "python", "code": "    def ack(self, ip: str, status: str, error: str | None = None, version: int | None = None) -> dict[str, Any]:\n        \"\"\"K9 ② POST /api/internal/blocks/ack — 반영 결과를 보고한다.\n\n        본문은 {\"ip\", \"status\", \"error\"} 세 칸을 항상 보낸다(error는 성공이면 null).\n        앱은 '이전 상태가 맞을 때만' 바꾸므로(조건부 UPDATE) 같은 ack를 두 번 보내도 안전하다.\n        \"\"\"\n        if error is not None:\n            error = error[:_MAX_ERROR_LEN]\n        payload: dict[str, Any] = {\"ip\": ip, \"status\": status, \"error\": error}\n        # 목록에서 받은 요청 번호를 그대로 돌려준다(guide56). 앱은 같은 번호의 요청일 때만 상태를 바꾼다.\n        if version is not None:\n            payload[\"version\"] = version\n        return self._post_json(\"/api/internal/blocks/ack\", payload)", "alias": null}, "routes/internal/blocks.py:ack_block": {"path": "routes/internal/blocks.py", "start": 191, "end": 268, "lang": "python", "code": "@internal_bp.route(\"/blocks/ack\", methods=[\"POST\"])\ndef ack_block():\n    \"\"\"fw-agent의 반영 확인(APPLIED·REMOVED·FAILED, 계약서 K9 ②).\n\n    상태 전이는 조건부 UPDATE로만 한다 — 같은 보고가 두 번 와도(재전송) 두 번째는\n    changed=false가 되어 NET_BLOCKED가 중복 기록되지 않는다(멱등).\"\"\"\n    if verify_request({\"fw-agent\"}) is None:\n        return jsonify(error=\"unauthorized\"), 401\n\n    data = request.get_json(silent=True)\n    # [C1-1·C1-2 보완] 본문이 JSON 객체가 아니면(목록·문자열 등) .get()에서 500이 나므로 400으로 거절한다.\n    if not isinstance(data, dict):\n        return jsonify(error=\"invalid\", field=\"body\"), 400\n    ip = data.get(\"ip\")\n    status = data.get(\"status\")\n    error = data.get(\"error\")\n\n    # 입력 검증\n    if not ip or not isinstance(ip, str):\n        return jsonify(error=\"invalid\", field=\"ip\"), 400\n    try:\n        parsed_ip = ipaddress.ip_address(ip)\n        if parsed_ip.version == 6:\n            return jsonify(error=\"invalid\", field=\"ip\"), 400\n    except ValueError:\n        return jsonify(error=\"invalid\", field=\"ip\"), 400\n\n    if config.NET_EDGE_SUBNET:\n        try:\n            subnet = ipaddress.ip_network(config.NET_EDGE_SUBNET, strict=False)\n            if parsed_ip not in subnet:\n                return jsonify(error=\"invalid\", field=\"ip\"), 400\n        except ValueError:\n            pass\n\n    if status not in (\"APPLIED\", \"REMOVED\", \"FAILED\"):\n        return jsonify(error=\"invalid\", field=\"status\"), 400\n\n    if error is not None:\n        if not isinstance(error, str):\n            error = str(error)\n        error = error[:500]\n\n    # version이 있으면 그 요청 번호의 행일 때만 상태를 바꾼다(10/26 강사 피드백 4). 없으면(옛 agent) 예전처럼.\n    version = data.get(\"version\")\n    if version is not None and (isinstance(version, bool) or not isinstance(version, int) or version < 0):\n        return jsonify(error=\"invalid\", field=\"version\"), 400\n    cond = {} if version is None else {\"expected_version\": version}\n\n    now_iso = datetime.now(timezone.utc).isoformat()\n    changed = False\n\n    if status == \"APPLIED\":\n        changed = db.update_network_block_if_status(ip, [\"PENDING_APPLY\"], {\"status\": \"APPLIED\", \"applied_at\": now_iso}, **cond)\n        if changed:\n            row = db.get_network_block(ip)\n            reason = row.get(\"reason\", \"NET_FLOOD\") if row else \"NET_FLOOD\"\n            net_ingest.record_net_blocked(ip, reason)\n    elif status == \"REMOVED\":\n        changed = db.update_network_block_if_status(ip, [\"PENDING_REMOVE\"], {\"status\": \"REMOVED\", \"removed_at\": now_iso}, **cond)\n        if changed:\n            net_ingest.resolve_net_blocked(ip)\n    elif status == \"FAILED\":\n        # 적용 실패(PENDING_APPLY → FAILED)와 해제 실패(PENDING_REMOVE → FAILED)를 나눠서 바꾼다(guide57).\n        # 적용 실패만 failed_at을 적어 재시도 후보로 삼고 Slack으로 알린다 — 해제 실패 행은 reconcile이\n        # ipset에서 빼므로 다시 시도할 일이 없다. failed_at 칸이 없는 DB에서는 예전 칸만 쓴다.\n        fields = {\"status\": \"FAILED\", \"last_error\": error}\n        row = db.get_network_block(ip)\n        apply_fields = dict(fields)\n        if row is not None and \"failed_at\" in row:\n            apply_fields[\"failed_at\"] = now_iso\n        changed = db.update_network_block_if_status(ip, [\"PENDING_APPLY\"], apply_fields, **cond)\n        if changed:\n            _notify_block_failed(ip, error, gave_up=False)\n        else:\n            changed = db.update_network_block_if_status(ip, [\"PENDING_REMOVE\"], fields, **cond)\n\n    return jsonify({\"changed\": changed})", "alias": null}, "security/net_ingest.py:record_net_blocked": {"path": "security/net_ingest.py", "start": 88, "end": 97, "lang": "python", "code": "def record_net_blocked(ip: str, reason: str) -> None:\n    \"\"\"fw-agent가 APPLIED를 보고한 순간 부른다. NET_BLOCKED(CRITICAL)를 기록한다.\n\n    같은 IP에 미해결 NET_BLOCKED가 이미 있으면 새로 만들지 않는다(멱등).\n    교차 계층 규칙의 입력으로 쓰지 않는다(계약서 K6).\n    reason은 로그·알림용이며 이벤트 칸에는 넣지 않는다.\n    \"\"\"\n    if db.get_unresolved_security_event(ip, \"NET_BLOCKED\"):\n        return\n    _record_event(\"NET_BLOCKED\", \"CRITICAL\", ip, None, 1, \"L4_BLOCKED\", source=\"NET\", layer=\"L4\")", "alias": null}, "routes/admin/locks.py:api_permanent_locks_release": {"path": "routes/admin/locks.py", "start": 134, "end": 173, "lang": "python", "code": "@admin_bp.route(\"/api/permanent-locks/release\", methods=[\"POST\"])\n@require_permission(\"release_permanent_lock\")\ndef api_permanent_locks_release():\n    \"\"\"대시보드 영구 잠금 카드의 \"영구 해제\" 버튼이 호출하는 API(super_admin 전용).\n\n    사유(note)가 비어 있으면 거부한다 — \"누가 언제 왜 풀었는지\"가 lock_history에 남아야 하기\n    때문이다. 해제한 관리자는 요청 본문이 아니라 로그인 세션에서 가져온다(본문은 위조 가능).\n    \"\"\"\n    data = request.get_json(silent=True) or {}\n    kind = data.get(\"target_kind\")\n    value = (data.get(\"target_value\") or \"\").strip()\n    note = (data.get(\"note\") or \"\").strip()\n    if kind not in _PERMANENT_LOCK_KINDS or not value:\n        return jsonify({\"success\": False, \"error\": \"target_kind(ip/account)와 target_value가 필요합니다.\"}), 400\n    if not note:\n        return jsonify({\"success\": False, \"error\": \"해제 사유(note)를 입력해야 합니다.\"}), 400\n\n    actor = f\"admin:{session['admin_username']}\"\n    released = lockdown.release(kind, value, actor, note)\n    if kind != \"ip\":\n        if not released:\n            return jsonify({\"success\": False, \"error\": \"영구 잠금 상태가 아닌 대상입니다.\"}), 404\n        return jsonify({\"success\": True})\n\n    # IP는 앱 잠금(L7)과 정문 차단(L4) 두 단계다. release()가 L4 해제 실패를 삼키므로 결과를 따로 확인하고,\n    # L7이 이미 풀린 재시도여도 남은 L4 해제는 이어서 한다(10/26 강사 피드백 5). 응답 모양은 예전과 같은\n    # {\"success\": true}를 기본으로 두고, 알릴 것이 있을 때만 l7·l4 칸을 붙인다.\n    l4 = lockdown.ensure_l4_released(value, actor)\n    if l4 == \"FAILED\":\n        error = (\"앱 잠금은 해제됐지만 네트워크(L4) 차단 해제 요청이 실패했습니다. 잠시 뒤 같은 해제를 다시 실행하세요.\"\n                 if released else \"네트워크(L4) 차단 해제 요청이 실패했습니다. 잠시 뒤 다시 실행하세요.\")\n        return jsonify({\"success\": False, \"l7\": \"RELEASED\" if released else \"NOT_LOCKED\", \"l4\": l4, \"error\": error}), 502\n    if not released and l4 != \"REQUESTED\":\n        return jsonify({\"success\": False, \"error\": \"영구 잠금 상태가 아닌 대상입니다.\"}), 404\n    body = {\"success\": True}\n    if not released:\n        body[\"l7\"] = \"NOT_LOCKED\"\n    if l4 != \"NONE\":\n        body[\"l4\"] = l4\n    return jsonify(body)", "alias": null}, "security/lockdown.py:release": {"path": "security/lockdown.py", "start": 238, "end": 276, "lang": "python", "code": "def release(target_kind: str, target_value: str, actor: str, note: str) -> bool:\n    \"\"\"관리자(또는 운영 스크립트)가 영구 잠금을 완전히 푼다. 실제로 풀렸을 때만 True.\n\n    actor는 호출부가 형식을 정해서 넘긴다 — 대시보드는 'admin:<관리자 아이디>',\n    터미널 스크립트는 'script:unlock_ip' 같은 값이다(lock_history.released_by에 그대로 기록).\n\n    영구 잠금이 아닌 대상(이미 풀렸거나 임시 잠금)이면 False — 호출부가 404/409로 응답한다.\n    푼 사람(actor)과 사유를 lock_history에 남기고 Slack에도 알린다.\n    연관 보안 이벤트는 정리하지만, 연관 사건(security_incidents)은 닫지 않는다 —\n    사건 해결은 관리자의 \"검토 끝\" 판단이라 별개다(guide32).\n    L4 차단도 함께 해제 요청(Track D, C2-2).\n    \"\"\"\n    if target_kind == \"ip\":\n        released = db.release_permanent_lockout(target_value)\n        if released:\n            db.resolve_security_events_for_ip(target_value)\n    else:\n        released = db.release_permanent_account_lockout(target_value)\n        if released:\n            db.resolve_security_events_for_username(target_value)\n    if not released:\n        return False\n\n    db.mark_lock_released(target_kind, target_value, actor, note)\n    if target_kind == \"ip\":\n        # 앱 잠금만 풀고 정문(L4, fw-agent의 ipset) 차단을 남겨 두면 관리자가 풀어 준 IP가\n        # 여전히 접속하지 못한다. 그래서 같은 해제 흐름에서 L4 해제도 요청한다.\n        # netblock이 lockdown.is_ip_allowlisted를 쓰므로 파일 맨 위에서 import하면 순환 import가\n        # 되어, 필요할 때 함수 안에서 불러온다.\n        # False는 \"L4 차단이 원래 없던 IP\"라는 뜻이라 오류가 아니다. 예외가 나도 앱 잠금 해제는\n        # 이미 끝났으니 반환값·Slack 알림은 그대로 두고 한 줄만 남긴다.\n        try:\n            from security import netblock\n\n            netblock.request_unblock(target_value, actor)\n        except Exception as exc:\n            print(f\"[lockdown] L4 차단 해제 요청 실패 (ip='{target_value}', actor='{actor}'): {exc}\")\n    alert.send_permanent_release_alert(target_kind, target_value, actor, note)\n    return True", "alias": null}, "security/netblock.py:request_unblock": {"path": "security/netblock.py", "start": 329, "end": 362, "lang": "python", "code": "def request_unblock(ip: str, actor: str) -> bool:\n    \"\"\"PENDING_APPLY/APPLIED인 행을 PENDING_REMOVE로 바꾼다. 바뀌었을 때만 True.\n\n    실제 ipset del은 fw-agent가 다음 폴링(2초)에서 하고 ack REMOVED를 보낸다. 이미 해제됐거나\n    행이 없으면 False(멱등) — 관리자 해제(lockdown.release, C2-2)가 L4 차단이 없는 IP에 대해\n    불러도 오류가 아니다. actor(예: \"admin:alice\")는 누가 풀었는지 서버 로그로 남기려고 받는다.\n    \"\"\"\n    if not ip or \"/\" in ip:\n        print(f\"[netblock] request_unblock 거부: 잘못된 IP 형식 ('{ip}'), actor='{actor}'\")\n        return False\n\n    try:\n        ipaddress.ip_address(ip)\n    except ValueError:\n        print(f\"[netblock] request_unblock 거부: IP 해석 실패 ('{ip}'), actor='{actor}'\")\n        return False\n\n    # version 칸(guide56)이 있으면 해제도 \"새 요청\"으로 보고 1 올린다 — 그래야 해제 직전에 읽힌 옛 차단\n    # 요청의 늦은 ACK(FAILED 등)가 이 해제 요청을 덮어쓰지 못한다. 읽기가 실패하면 예전 방식으로 바꾼다.\n    try:\n        row = db.get_network_block(ip)\n    except Exception:\n        row = None\n    if row is not None and \"version\" in row:\n        if row.get(\"status\") not in _ACTIVE_STATUSES:\n            res = False\n        else:\n            res = _update_with_version(ip, row[\"status\"], row, {\"status\": \"PENDING_REMOVE\"})\n    else:\n        res = db.update_network_block_if_status(\n            ip, list(_ACTIVE_STATUSES), {\"status\": \"PENDING_REMOVE\"}\n        )\n    print(f\"[netblock] request_unblock 요청 처리 (ip='{ip}', actor='{actor}', result={res})\")\n    return res", "alias": null}, "security/lockdown.py:ensure_l4_released": {"path": "security/lockdown.py", "start": 279, "end": 315, "lang": "python", "code": "def ensure_l4_released(ip: str, actor: str) -> str:\n    \"\"\"IP의 L4(정문 ipset) 차단이 해제됐거나 해제 요청된 상태인지 확인하고, 아니면 다시 요청한다.\n\n    release()는 앱 잠금(L7)을 먼저 풀고 L4 해제 실패는 로그만 남긴다. 그러면 화면은 \"해제됨\"인데\n    사용자는 여전히 정문에서 막히고, 다시 해제를 눌러도 L7이 이미 풀려 release()가 False로 끝나\n    L4까지 가지 않는다(10/26 강사 피드백 5). 그래서 관리자 해제 API·운영 스크립트가 release() 뒤에\n    이 함수를 따로 불러 L4 결과를 확인하고, 남은 단계만 이어서 처리한다. 상태만 보고 필요할 때만\n    요청하므로 몇 번 불러도 안전하다(멱등).\n\n    돌려주는 값:\n      \"NONE\"      — L4 차단이 원래 없거나(행 없음) 적용 실패(FAILED)로 실제로 막혀 있지 않음\n      \"REQUESTED\" — 해제 요청됨(PENDING_REMOVE). fw-agent가 2초 안에 ipset에서 뺀다\n      \"REMOVED\"   — 이미 해제 완료\n      \"FAILED\"    — 해제 요청을 기록하지 못함(DB 오류 등). 같은 해제를 다시 실행하면 이어서 처리한다\n    \"\"\"\n    # netblock이 이 모듈의 is_ip_allowlisted를 쓰므로 위에서 import하면 순환 import가 된다(release와 같음).\n    from security import netblock\n\n    try:\n        row = db.get_network_block(ip)\n        status = row.get(\"status\") if row else None\n        if status is None or status == \"FAILED\":\n            return \"NONE\"\n        if status == \"REMOVED\":\n            return \"REMOVED\"\n        if status == \"PENDING_REMOVE\":\n            return \"REQUESTED\"\n        if netblock.request_unblock(ip, actor):\n            return \"REQUESTED\"\n        # 조건부 UPDATE가 안 맞음 = 그 사이 다른 요청이 상태를 바꿨다. 다시 읽어 결과를 정한다.\n        row = db.get_network_block(ip)\n        if row and row.get(\"status\") in (\"PENDING_REMOVE\", \"REMOVED\"):\n            return \"REQUESTED\" if row[\"status\"] == \"PENDING_REMOVE\" else \"REMOVED\"\n        return \"FAILED\"\n    except Exception as exc:\n        print(f\"[lockdown] L4 해제 확인 실패 (ip='{ip}', actor='{actor}'): {type(exc).__name__}\")\n        return \"FAILED\"", "alias": null}}, "files": {"security/playbooks.py": {"role": "Track D 대응 절차서 실행기(37단원). 차단 단계가 request_block을 부른다.", "header": "security/playbooks.py — Track D 대응 절차서(플레이북): 규칙이 맞으면 조치를 순서대로 실행한다\n담당: 역할 B (B2-2). 단계와 기록의 실패를 격리해 다음 조치를 보장한다.\n플레이북·단계 이름은 docs/track-d/contracts.md 계약서 K12, 넘겨받는 ctx 모양은 K8이 기준이다.\n판단(B)과 실행(C)을 나눈다: 이 파일은 \"어떤 조치를 어떤 순서로\"만 정하고, 실제 차단·메일·알림은\n역할 C의 조치 함수가 스스로 검증하며 실행한다.\n기존 복합 공격 알림(security/correlate.py의 PLAYBOOKS[\"CRITICAL_MULTI_STAGE\"])은 옮기지 않는다 —\n이 파일은 Track D 플레이북만 담당한다(계약서 K12).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/playbooks.py"}, "security/netblock.py": {"role": "L4 차단 요청 창구. network_blocks 표에 '원하는 상태'를 적을 뿐 실제 차단은 하지 않는다. TTL 계산과 멱등 규칙을 이 함수 하나가 맡는다.", "header": "security/netblock.py — L4(iptables/ipset) 차단 요청 장부에 \"막아라/풀어라\"를 적는 함수\n담당: 역할 C (C0-2 구현).\n함수 모양은 docs/track-d/contracts.md 계약서 K7이 기준이다.\n이 파일은 network_blocks 표에 원하는 상태만 기록한다. 실제 방화벽 반영은 같은 Docker 단지의\nfw-agent가 내부 API로 목록을 가져가서 한다(앱이 방화벽 권한을 갖지 않게 하기 위해).\n모든 함수는 여러 번 불려도 결과가 같고(멱등), 허용 목록·주소 형식을 스스로 검사한다 —\n판단하는 쪽(플레이북)이 잘못된 주소를 넘겨도 여기서 한 번 더 막는다.\nimport 규칙(계약서 K7): config, db, security.lockdown만 쓴다. lockdown은 release() 안에서(C2-2)\n함수 안 import로 이 파일을 부르므로, 여기서 lockdown을 모듈째 import해도\n순환이 생기지 않는다. lockdown.is_ip_allowlisted(...)처럼 모듈 이름을 거쳐 부르는 것은\n테스트에서 monkeypatch로 바꿔 끼울 수 있게 하기 위해서다.\n사용하는 DB 함수(C1-1에서 db/network_blocks.py에 만들었다):\ndb.get_network_block / db.insert_network_block / db.update_network_block_if_status /\ndb.count_recent_net_blocked_events", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/netblock.py"}, "security/lockdown.py": {"role": "영구 잠금 로직 파일. 관리자가 영구 해제할 때 L4 해제도 함께 요청한다.", "header": "security/lockdown.py — \"영구 출입금지 담당 부서\": 임시 잠금을 영구 잠금으로 올리고(승격),\n영구 잠금을 풀어주는(관리자 해제 / 이메일 복구) 로직 본체 (guide33 / guide34-a)\n왜 별도 모듈인가: security/soar/가 이미 security/correlate.py를 import하고 있어서, security/correlate.py가\nsecurity/soar/의 승격 함수를 직접 부르면 순환 import가 된다. 그래서 승격·해제 로직을 이\n파일 하나로 모으고, security/soar/와 security/correlate.py가 둘 다 이 파일만 import하게 한다.\n이 파일은 모듈 수준에서 db / alert / config / ip_utils만 import한다. 영구 잠금 이벤트를\n상관분석(correlate)에 흘려보내는 부분만 함수 안에서 늦게 import한다(순환 방지).\n설계 원칙 (docs의 permanent-lock 계획서 1.1 참고)\n- \"영구\"는 시간이 아니라 해제 조건의 문제다: 자동 만료가 없고 이메일 인증이나\n관리자 수동 해제로만 풀린다.\n- IP 영구 잠금은 이메일로 \"해제\"하지 않고 본인+본인 기기에게만 \"예외\"를 발급한다.\n- 허용 목록(PERMANENT_LOCK_IP_ALLOWLIST)의 IP는 절대 영구 잠그지 않는다(자충수 방지).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/lockdown.py"}, "db/network_blocks.py": {"role": "network_blocks(차단 장부) 표 조회·기록 모음. 조건부 UPDATE로 동시 요청을 정리한다.", "header": "db/network_blocks.py — network_blocks 표: L4 차단 요청·상태 전이 (계약서 K7·K9·K11)\n담당: 역할 C. Track D 뼈대 PR(I0-1)이 빈 모듈로 만들고, C1-1~C2-1에서 함수를 채웠다.\n새 DB 함수는 이 파일에 만들고, 이름을 아래 __all__ 목록에 추가한다. 그러면\ndb/__init__.py가 \"from .network_blocks import *\"로 자동으로 다시 내보내므로, 다른 파일에서\n바로 db.함수이름(...)으로 쓸 수 있다 — 세 사람이 공용 파일(db/__init__.py)을 고치지\n않아도 되게 하려는 장치다(team-plan 01 3.2).\ndb.get_client() 호출 이유는 db/attempts.py 상단 설명 참고(import db 후 db.get_client()).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/db/network_blocks.py"}, "config.py": {"role": "임계값·시간 창·잠금 시간·규칙값 등 프로젝트 공용 설정값을 한 곳에 모은 파일.", "header": "", "github": "https://github.com/dyj02056/login-watchdog/blob/main/config.py"}, "netwatch/fw_agent/fw_agent.py": {"role": "gateway와 같은 네트워크에서 도는 차단 프로그램. 앱에서 목록을 받아 가(pull) ipset에 넣고 빼며, 앱을 import하지 않는 독립 프로그램.", "header": "netwatch/fw_agent/fw_agent.py — L4 차단 실행 및 동기화 에이전트 (계약서 K3, K9)\n담당: 역할 C (C1-3).\n앱은 network_blocks 표에 \"막아야 할 목록\"(원하는 상태)만 적고, 이 프로그램이 그 목록을\n앱 내부 API로 받아 가(pull) gateway 네임스페이스의 ipset(lw_block)에 실제로 넣고 뺀다.\n왜 DB를 직접 읽지 않고 앱 내부 API를 거치나: 이 컨테이너는 방화벽을 바꾸는 NET_ADMIN 권한을\n갖는다. 여기에 Supabase 키까지 주면 이 컨테이너 하나가 털렸을 때 DB 전체가 털린다(상위 계획서\nP6·V7). 그래서 NET_AGENT_SECRET 서명(K3)만 들고 앱에 \"목록 주세요 / 반영했어요\"만 말한다.\n왜 앱 코드(db, config 등)를 import하지 않나: 이 파일은 app과 다른 컨테이너(fw-agent)에서 돈다.\n이미지에는 이 파일과 requests만 들어 있으므로, 서명 규칙(K3)도 여기에 직접 구현하고 테스트로\nB의 sign()과 같은 값이 나오는지 확인한다.\n시험하기 쉽게 나눈 구성:\nsign_headers      — K3 서명 헤더\nCommandRunner     — 실제 명령 실행(SubprocessRunner) / 기록만 하는 가짜(FakeRunner)\nFirewallBackend   — ipset·iptables 조작(IptablesBackend). 나중에 AWS 등으로 바꿀 때 파일 1개만 추가\nAgentClient       — 앱 내부 API 호출(K9 ①②③)\nprocess_blocks    — 받은 목록 한 번 처리(2초마다)\nreconcile         — 실제 ipset과 원하는 상태 전체 비교(60초마다, drift 보정)", "github": "https://github.com/dyj02056/login-watchdog/blob/main/netwatch/fw_agent/fw_agent.py"}, "routes/internal/blocks.py": {"role": "fw-agent 전용 차단 목록 창구. GET /blocks(목록 + 만료 정리), POST /blocks/ack(적용·해제 결과 보고).", "header": "routes/internal/blocks.py — fw-agent 전용 차단 목록 창구 (계약서 K9 ①②)\nGET  /api/internal/blocks      — 지금 막아야 할 IP 목록(원하는 상태 전체)\nPOST /api/internal/blocks/ack  — fw-agent가 실제로 반영했다는 확인 보고\n담당: 역할 C (C1-2). fw-agent만 부를 수 있다(보낸이 \"fw-agent\"). 서명이 없거나 틀리면 401.\n앱은 \"원하는 상태\"만 장부(network_blocks)에 적고, 실제 ipset 반영은 fw-agent가 한다(P6 —\nNET_ADMIN 권한 컨테이너에 DB 키를 주지 않기 위해). 그래서 이 창구가 장부와 agent를 잇는다.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/internal/blocks.py"}, "security/net_ingest.py": {"role": "수집한 경보를 보안 이벤트로 올리고, 실제 L4 차단이 적용·해제될 때 NET_BLOCKED를 기록·해결하는 파일.", "header": "security/net_ingest.py — 네트워크 경보를 보안 이벤트로 올리고, 실제 L4 차단(NET_BLOCKED)을 기록한다\nHIGH 경보는 기존 미해결 이벤트의 bump 경로를, MEDIUM은 공통 기록 경로를 사용한다.\n함수 모양은 docs/track-d/contracts.md 계약서 K5·K6이 기준이다.\n역할 C(차단 목록 창구)가 fw-agent의 반영 보고를 받을 때 아래 두 함수를 부른다. C는\n\"from security import net_ingest\" 후 net_ingest.record_net_blocked(...)처럼 모듈 이름을 거쳐\n부른다 — 그래야 테스트에서 이 함수를 가짜로 바꿔 끼울 수 있다(B1-2 머지 전에는 C의 테스트가 이 방식으로 먼저 돌았다).", "github": "https://github.com/dyj02056/login-watchdog/blob/main/security/net_ingest.py"}, "routes/admin/locks.py": {"role": "관리자 잠금 해제 API(IP·계정). 영구 해제에서 앱 잠금(L7)과 L4 해제를 함께 처리한다.", "header": "routes/admin/locks.py — 잠금 해제·영구 잠금·IP 예외·복구 요청 관리 API\n예전 routes/admin.py(798줄)를 기능 묶음별로 나눈 조각 중 하나다. Blueprint(admin_bp)는\nroutes/admin/__init__.py에서 하나만 만들고, 이 파일은 거기에 라우트를 붙이기만 한다\n— 그래서 엔드포인트 이름(url_for(\"admin.xxx\"))은 나누기 전과 똑같다.\n배경은 docs/refactor/2026-10-09-module-plan.md 참고.", "github": "https://github.com/dyj02056/login-watchdog/blob/main/routes/admin/locks.py"}}}</script>
<script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var $ = function(id){ return document.getElementById(id); };
  var KIND_LABEL = {screen:"화면 · 도착지", route:"routes", helper:"판단", db:"db", config:"설정값", later:"다른 단원"};

  var state = { sc: 0, node: null, item: 0, file: null };

  /* ---------- 사용자 설정(브라우저에 기억 · 막혀 있어도 동작) ---------- */
  function loadPref(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }
  function savePref(k, v){ try { if (v === null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, v); } catch(e){} }
  var prefs = { wrap: loadPref("lw-code-wrap") !== "0" };   // 기본: 줄바꿈 켜짐

  function el(tag, attrs, kids){
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function brk(t){ return t.replace(/([\/._])/g, "$1\u200b"); }
  function scen(){ return D.scenarios[state.sc]; }
  function nodeById(id){ return scen().nodes.filter(function(n){ return n.id === id; })[0]; }
  function fnName(label){ return label; }

  /* ---------- 간단 문법 강조 ---------- */
  var PY = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?''')|([rbfRBF]{0,2}"(?:\\.|[^"\\\n])*"|[rbfRBF]{0,2}'(?:\\.|[^'\\\n])*')|\b(def|class|return|if|elif|else|for|while|import|from|as|try|except|finally|with|in|not|and|or|is|None|True|False|raise|pass|lambda|yield|global|nonlocal|assert|del|continue|break)\b|(@[A-Za-z_][\w.]*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(?=\()/g;
  var PYC = [null,"t-c","t-d","t-s","t-k","t-a","t-n","t-f"];
  var HT = /(<!--[\s\S]*?-->)|(\{[{%#][\s\S]*?[}%#]\})|(<\/?[A-Za-z][\w-]*)|("[^"\n]*")|(\/?>)/g;
  var HTC = [null,"t-c","t-a","t-k","t-s","t-k"];
  var JS = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\.|[^`\\])*`)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(const|let|var|function|return|if|else|for|while|import|from|export|default|async|await|try|catch|finally|new|class|extends|typeof|interface|type|null|undefined|true|false|throw|switch|case|break|continue|of|in|as)\b|(@[A-Za-z_]\w*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_$][\w$]*)(?=\()/g;
  var JSC = [null,"t-c","t-s","t-s","t-k","t-a","t-n","t-f"];
  var SQ = /(--[^\n]*|\/\*[\s\S]*?\*\/)|((?!))|('(?:''|[^'])*')|\b(select|from|where|insert|into|values|update|set|delete|create|table|index|alter|add|drop|on|conflict|do|nothing|and|or|not|null|default|primary|key|references|cascade|if|exists|as|order|by|group|limit|desc|asc|join|left|inner|count|returns|function|language|begin|end|return|with|union|all|distinct|in|is|true|false|unique|check|constraint|timestamptz|text|integer|bigint|boolean|interval|now|replace|trigger|view|policy|enable|row|level|security|using)\b|((?!))|\b(\d+(?:\.\d+)?)\b|\b([a-z_]\w*)(?=\()/gi;
  var SQC = [null,"t-c",null,"t-s","t-k",null,"t-n","t-f"];
  var SH = /(#[^\n]*)|((?!))|("(?:\\.|[^"\\\n])*"|'[^'\n]*')|\b(if|then|else|fi|for|do|done|while|case|esac|function|echo|export|python|pip|git|cd|run|name|on|jobs|steps|uses|with|env)\b|((?!))|\b(\d+)\b/g;
  var SHC = [null,"t-c",null,"t-s","t-k",null,"t-n"];
  function tokenize(code, lang){
    var re = PY, cls = PYC;
    if (lang === "html"){ re = HT; cls = HTC; }
    else if (lang === "js"){ re = JS; cls = JSC; }
    else if (lang === "sql"){ re = SQ; cls = SQC; }
    else if (lang === "sh"){ re = SH; cls = SHC; }
    var lines = [[]];
    function push(text, c){
      var parts = text.split("\n");
      parts.forEach(function(p, i){
        if (i > 0) lines.push([]);
        if (p) lines[lines.length-1].push([p, c]);
      });
    }
    var last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(code)) !== null){
      if (m.index > last) push(code.slice(last, m.index), null);
      var idx = 1; while (idx < m.length && m[idx] === undefined) idx++;
      push(m[0], cls[idx] || null);
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++;
    }
    if (last < code.length) push(code.slice(last), null);
    return lines;
  }

  function codeTable(block, hl){
    var lines = tokenize(block.code, block.lang);
    var tbody = el("tbody");
    var hlFirst = null;
    lines.forEach(function(segs, i){
      var no = block.start + i;
      var on = hl && no >= hl[0] && no <= hl[1];
      var td = el("td", {class:"tx"});
      segs.forEach(function(s){ td.appendChild(s[1] ? el("span", {class:s[1], text:s[0]}) : document.createTextNode(s[0])); });
      if (!segs.length) td.appendChild(document.createTextNode(" "));
      var tr = el("tr", on ? {class:"hl"} : null, [el("td", {class:"ln", text:String(no)}), td]);
      if (on && !hlFirst) hlFirst = tr;
      tbody.appendChild(tr);
    });
    var box = el("div", {class:"codebox"}, [el("table", {class:"code"}, [tbody])]);
    box._hlFirst = hlFirst;
    return box;
  }

  function copyText(text, btn){
    var done = function(){ var o = btn.textContent; btn.textContent = "복사됨 ✓"; setTimeout(function(){ btn.textContent = o; }, 1200); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
    function fallback(){
      var ta = el("textarea", {style:"position:fixed;opacity:0"}); ta.value = text; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); done(); } catch(e){} document.body.removeChild(ta);
    }
  }

  /* ---------- 패널 ---------- */
  function openPanel(){ document.body.classList.add("open"); }
  function closePanel(){ document.body.classList.remove("open"); }

  function showHint(){
    $("pTitle").textContent = "코드 보는 법";
    $("pSub").textContent = "카드나 파일 이름을 누르면 실제 코드가 여기에 열립니다.";
    var ul = el("ul", {class:"hint"}, [
      el("li", {text:"카드(상자)를 누르면 그 단계에서 실행되는 실제 함수 코드가 열려요."}),
      el("li", {text:"카드 안의 📄 파일 이름을 누르면 그 파일이 어떤 역할인지, 이 단원에서 쓰이는 함수가 무엇인지 보여줘요."}),
      el("li", {text:"ƒ 함수 이름을 누르면 해당 함수 코드로 바로 이동해요."}),
      el("li", {text:"노란색 줄이 지금 단계가 담당하는 부분이에요."}),
      el("li", {text:"db.함수() 처럼 적혀 있어도 실제 코드는 db/users.py 같은 다른 파일에 있어요. 카드에 그 '진짜 파일'을 표시하고, 코드 위에 찾아가는 길도 그려줘요."}),
      el("li", {text:"위쪽 ◀ ▶ 버튼으로 실행 순서대로 한 단계씩 따라갈 수 있어요."})
    ]);
    var b = $("pBody"); b.textContent = ""; b.appendChild(ul);
  }

  function renderAlias(a){
    if (!a) return null;
    return el("div", {class:"alias"}, [
      el("div", {text:"코드에는 이렇게 적혀 있지만, 실제 함수는 다른 파일에 있어요."}),
      el("div", {class:"route"}, [
        el("span", {class:"step", text:a.call}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step", text:a.via + " (창구)"}), el("span", {class:"arrow", text:"→"}),
        el("span", {class:"step real", text:a.real})
      ])
    ]);
  }

  function selectNode(id, itemIdx){
    var n = nodeById(id); if (!n) return;
    state.node = id; state.item = itemIdx || 0; state.file = null;
    $("pTitle").textContent = n.title;
    $("pSub").textContent = n.plain;
    var body = $("pBody"); body.textContent = "";
    if (n.reject) body.appendChild(el("div", {class:"n-reject", text:n.reject, style:"margin:0 0 10px"}));
    if (n.items.length > 1){
      var tabs = el("div", {class:"itabs", role:"tablist"});
      n.items.forEach(function(it, i){
        tabs.appendChild(el("button", {class:"itab", role:"tab", "aria-selected":String(i === state.item), text:it.label,
          onclick:function(){ selectNode(id, i); }}));
      });
      body.appendChild(tabs);
    }
    var it = n.items[state.item];
    var block = D.blocks[it.block];
    var linesTxt = it.hl ? (it.hl[0] === it.hl[1] ? it.hl[0] + "줄" : it.hl[0] + "–" + it.hl[1] + "줄") : "";
    var fl = el("div", {class:"fileline"}, [
      el("button", {class:"chip file", onclick:function(){ selectFile(block.path); }, text:block.path}),
      el("span", {class:"lines", text: block.start + "–" + block.end + "줄 표시" + (linesTxt ? " · 노란색 " + linesTxt : "")}),
      el("span", {class:"spacer"}),
      el("button", {class:"btn", id:"wrapBtn", "aria-pressed":String(prefs.wrap), title:"긴 줄을 화면 너비에 맞춰 줄바꿈", text:"줄바꿈", onclick:function(e){
        prefs.wrap = !prefs.wrap; savePref("lw-code-wrap", prefs.wrap ? "1" : "0");
        e.currentTarget.setAttribute("aria-pressed", String(prefs.wrap));
        var bx = document.querySelector("#pBody .codebox"); if (bx) bx.classList.toggle("wrap", prefs.wrap);
      }}),
      el("button", {class:"btn", text:"복사", onclick:function(e){ copyText(block.code, e.currentTarget); }}),
      el("a", {class:"btn link", href:D.files[block.path].github + "#L" + block.start + "-L" + block.end, target:"_blank", rel:"noopener", text:"GitHub ↗"})
    ]);
    body.appendChild(fl);
    var al = renderAlias(block.alias); if (al) body.appendChild(al);
    var box = codeTable(block, it.hl);
    if (prefs.wrap) box.classList.add("wrap");
    body.appendChild(box);
    if (it.hl) body.appendChild(el("p", {class:"legend-hl"}, [el("b", {text:"노란색"}), " = 이 카드가 담당하는 줄"]));
    refreshSelection();
    openPanel();
    if (box._hlFirst){
      var off = box._hlFirst.offsetTop - 60;
      box.scrollTop = Math.max(0, off);
    }
    updateStepper();
  }

  function selectFile(path){
    state.file = path; state.node = null;
    var f = D.files[path];
    $("pTitle").textContent = "📄 " + path;
    $("pSub").textContent = f.role;
    var body = $("pBody"); body.textContent = "";
    body.appendChild(el("div", {class:"fileline"}, [
      el("a", {class:"btn link", href:f.github, target:"_blank", rel:"noopener", text:"GitHub에서 파일 열기 ↗"})
    ]));
    body.appendChild(el("h3", {text:"이 단원에서 쓰이는 함수", style:"font-size:13.5px;margin:12px 0 0"}));
    var ul = el("ul", {class:"flist"}), seen = {};
    D.scenarios.forEach(function(sc, si){
      sc.nodes.forEach(function(n){
        n.items.forEach(function(it, ii){
          var b = D.blocks[it.block]; if (b.path !== path) return;
          var key = si + n.id + ii; if (seen[key]) return; seen[key] = 1;
          var li = el("li");
          li.appendChild(el("button", {onclick:function(){
            if (state.sc !== si) switchScenario(si);
            selectNode(n.id, ii); scrollToNode(n.id);
          }}, [
            el("span", {class:"mono", text:it.label}), el("small", {text:sc.name + " · " + n.title})
          ]));
          ul.appendChild(li);
        });
      });
    });
    body.appendChild(ul);
    if (f.header){
      var d = el("details", {class:"hdr"}, [el("summary", {text:"파일 맨 위 설명 주석 보기"}), el("pre", {text:f.header})]);
      body.appendChild(d);
    }
    refreshSelection();
    openPanel();
  }

  /* ---------- 흐름도 ---------- */
  var cols, colIndex, nodeEls = {};
  function renderStage(){
    var sc = scen();
    var used = {}; sc.nodes.forEach(function(n){ used[n.col] = 1; });
    cols = Object.keys(used).map(Number).sort(function(a,b){ return a-b; });
    colIndex = {}; cols.forEach(function(c, i){ colIndex[c] = i + 1; });
    var stage = $("stage");
    stage.textContent = "";
    stage.style.gridTemplateColumns = "repeat(" + cols.length + ", 196px)";
    nodeEls = {};

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "edges"); svg.id = "edges";
    svg.innerHTML = '<defs>' +
      '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-call" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>' +
      '</defs>';
    stage.appendChild(svg);

    cols.forEach(function(c){
      stage.appendChild(el("div", {class:"colhead", style:"grid-column:" + colIndex[c] + ";grid-row:1", text:D.columns[c]}));
    });
    var cells = {};
    sc.nodes.forEach(function(n){
      var k = n.row + ":" + n.col;
      if (!cells[k]){
        cells[k] = el("div", {class:"cell", style:"grid-column:" + colIndex[n.col] + ";grid-row:" + (n.row + 2)});
        stage.appendChild(cells[k]);
      }
      var node = buildNode(n);
      nodeEls[n.id] = node;
      cells[k].appendChild(node);
    });
    $("intro").textContent = sc.intro;
    scheduleEdges();
  }

  function buildNode(n){
    var node = el("div", {class:"node " + n.kind, role:"button", tabindex:"0", "aria-pressed":"false", "data-id":n.id,
      onclick:function(e){ if (e.target.closest(".chip")) return; selectNode(n.id, 0); },
      onkeydown:function(e){ if ((e.key === "Enter" || e.key === " ") && !e.target.closest(".chip")){ e.preventDefault(); selectNode(n.id, 0); } }});
    var title = el("div", {class:"n-title", text:n.title});
    if (n.later) title.appendChild(el("span", {class:"tag-later", text:n.later + "에서 자세히"}));
    node.appendChild(title);
    if (n.kind !== "later" && n.plain) node.appendChild(el("div", {class:"n-plain", text:n.plain}));
    if (n.reject) node.appendChild(el("div", {class:"n-reject", text:n.reject}));
    var items = el("div", {class:"n-items"});
    // 같은 파일에 있는 함수는 파일 칩 하나 아래에 함수 칩을 나란히 놓는다
    var groups = [];
    n.items.forEach(function(it, i){
      var b = D.blocks[it.block], g = groups[groups.length - 1];
      if (g && g.path === b.path) g.list.push({it: it, i: i}); else groups.push({path: b.path, list: [{it: it, i: i}]});
    });
    groups.forEach(function(g){
      var row = el("div", {class:"n-item"});
      if (g.list.length === 1 && g.list[0].it.call) row.appendChild(el("div", {class:"n-call", text:brk(g.list[0].it.call)}));
      var chips = el("div", {class:"chips"}, [
        el("button", {class:"chip file", text:brk(g.path), title:"파일 설명 보기", onclick:function(){ selectFile(g.path); }})
      ]);
      g.list.forEach(function(x){
        chips.appendChild(el("button", {class:"chip " + (x.it.snippet ? "snip" : "fn"), text:x.it.label, title:(x.it.call ? x.it.call + " — " : "") + "코드 보기",
          onclick:function(){ selectNode(n.id, x.i); }}));
      });
      row.appendChild(chips);
      items.appendChild(row);
    });
    node.appendChild(items);
    return node;
  }

  function rectIn(elm, host){
    var a = elm.getBoundingClientRect(), h = host.getBoundingClientRect();
    return {l:a.left-h.left, r:a.right-h.left, t:a.top-h.top, b:a.bottom-h.top, cx:(a.left+a.right)/2-h.left, cy:(a.top+a.bottom)/2-h.top};
  }
  var raf = 0;
  function scheduleEdges(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(drawEdges); }
  function drawEdges(){
    var stage = $("stage"), svg = $("edges"), sc = scen();
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){ p.remove(); });
    Array.prototype.slice.call(stage.querySelectorAll(".elabel")).forEach(function(p){ p.remove(); });
    var svgNS = "http://www.w3.org/2000/svg";
    sc.edges.forEach(function(e){
      var a = nodeById(e.from), b = nodeById(e.to);
      var ea = nodeEls[e.from], eb = nodeEls[e.to]; if (!ea || !eb) return;
      var ra = rectIn(ea, stage), rb = rectIn(eb, stage), d, lx, ly;
      if (a.col === b.col){
        if (b.row - a.row <= 1){
          d = "M" + ra.cx + " " + ra.b + " V" + rb.t; lx = ra.cx; ly = (ra.b + rb.t) / 2;
        } else {
          var x = Math.min(ra.l, rb.l) - 30;
          d = "M" + ra.l + " " + ra.cy + " H" + x + " V" + rb.cy + " H" + rb.l; lx = x; ly = (ra.cy + rb.cy) / 2;
        }
      } else {
        var dir = b.col > a.col ? 1 : -1;
        var x1 = dir > 0 ? ra.r : ra.l, x2 = dir > 0 ? rb.l : rb.r;
        var xm = x2 - dir * 30;
        d = "M" + x1 + " " + ra.cy + " H" + xm + " V" + rb.cy + " H" + x2;
        lx = (x1 + x2) / 2; ly = ra.cy;
      }
      var kind = e.kind === "call" ? "call" : "flow";
      var p = document.createElementNS(svgNS, "path");
      p.setAttribute("d", d); p.setAttribute("class", "e " + kind);
      p.setAttribute("marker-end", "url(#" + (kind === "call" ? "ahc" : "ah") + ")");
      p.setAttribute("data-from", e.from); p.setAttribute("data-to", e.to);
      svg.appendChild(p);
      if (e.label && kind === "flow"){
        var lab = el("span", {class:"elabel", text:e.label});
        lab.style.left = lx + "px"; lab.style.top = ly + "px";
        stage.appendChild(lab);
      }
    });
    svg.setAttribute("width", stage.scrollWidth); svg.setAttribute("height", stage.scrollHeight);
    refreshSelection();
  }

  function refreshSelection(){
    Object.keys(nodeEls).forEach(function(id){ nodeEls[id].setAttribute("aria-pressed", String(id === state.node)); });
    var svg = $("edges"); if (!svg) return;
    Array.prototype.slice.call(svg.querySelectorAll("path.e")).forEach(function(p){
      var on = state.node && (p.getAttribute("data-from") === state.node || p.getAttribute("data-to") === state.node);
      p.classList.toggle("active", !!on);
    });
  }
  function scrollToNode(id){
    var n = nodeEls[id]; if (n && n.scrollIntoView) n.scrollIntoView({block:"center", inline:"center", behavior:"smooth"});
  }

  /* ---------- 단계 이동 / 탭 ---------- */
  function stepIndex(){ return scen().steps.indexOf(state.node); }
  function updateStepper(){
    var steps = scen().steps, i = stepIndex();
    $("stepNo").textContent = i < 0 ? "– / " + steps.length : (i + 1) + " / " + steps.length;
    $("prev").disabled = i <= 0 && state.node !== null ? true : false;
    $("next").disabled = i >= steps.length - 1;
    if (state.node === null){ $("prev").disabled = true; $("next").disabled = false; }
  }
  function go(delta){
    var steps = scen().steps, i = stepIndex();
    var j = i < 0 ? 0 : Math.max(0, Math.min(steps.length - 1, i + delta));
    selectNode(steps[j], 0); scrollToNode(steps[j]);
  }
  function renderTabs(){
    var t = $("tabs"); t.textContent = "";
    D.scenarios.forEach(function(sc, i){
      t.appendChild(el("button", {class:"tab", role:"tab", "aria-selected":String(i === state.sc), text:sc.name, onclick:function(){ switchScenario(i); }}));
    });
  }
  function switchScenario(i){
    state.sc = i; state.node = null; state.file = null;
    renderTabs(); renderStage(); showHint(); updateStepper();
    try { history.replaceState(null, "", "#" + D.scenarios[i].id); } catch(e){}
  }

  /* ---------- 시작 ---------- */
  document.title = D.title + " — 코드 흐름도";
  $("title").textContent = D.title + " · 코드 흐름도";
  $("subtitle").textContent = D.subtitle;
  $("mdlink").setAttribute("href", D.mdFile);
  $("prev").addEventListener("click", function(){ go(-1); });
  $("next").addEventListener("click", function(){ go(1); });
  $("pClose").addEventListener("click", closePanel);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closePanel(); });
  $("theme").addEventListener("click", function(){
    var r = document.documentElement, cur = r.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  });
  window.addEventListener("resize", scheduleEdges);
  if (window.ResizeObserver){ var ro = new ResizeObserver(scheduleEdges); ro.observe($("stage")); ro.observe($("stageWrap")); }

  /* ---------- 코드 패널 너비: 자동 기본값 + 드래그/키보드 조절 + 기억 ---------- */
  var MIN_PANEL = 360, MIN_MAIN = 420, SPLIT_KEY = "lw-panel-w";
  var splitter = $("splitter");
  function maxPanel(){ return Math.max(MIN_PANEL, Math.min(window.innerWidth * 0.75, window.innerWidth - MIN_MAIN - 6)); }
  function clampPanel(w){ return Math.round(Math.min(maxPanel(), Math.max(MIN_PANEL, w))); }
  // 흐름도가 실제로 차지하는 너비(가장 넓은 탭 기준)를 빼고 남는 공간을 패널에 준다
  function autoPanelWidth(){
    var most = 1;
    D.scenarios.forEach(function(sc){ var u = {}; sc.nodes.forEach(function(n){ u[n.col] = 1; }); most = Math.max(most, Object.keys(u).length); });
    var natural = most * 196 + (most - 1) * 46 + 44 + 24;
    return clampPanel(Math.max(440, window.innerWidth - natural - 6));
  }
  var savedW = parseInt(loadPref(SPLIT_KEY), 10);
  var userSet = savedW > 0;
  function setPanelW(w, persist){
    w = clampPanel(w);
    document.documentElement.style.setProperty("--panel-w", w + "px");
    splitter.setAttribute("aria-valuenow", String(w)); splitter.setAttribute("aria-valuemin", String(MIN_PANEL)); splitter.setAttribute("aria-valuemax", String(Math.round(maxPanel())));
    if (persist){ userSet = true; savePref(SPLIT_KEY, String(w)); }
    scheduleEdges();
  }
  function currentW(){ return $("panel").getBoundingClientRect().width; }
  setPanelW(userSet ? savedW : autoPanelWidth(), false);
  window.addEventListener("resize", function(){ setPanelW(userSet ? currentW() : autoPanelWidth(), false); });
  splitter.addEventListener("pointerdown", function(e){
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault(); splitter.setPointerCapture(e.pointerId); document.body.classList.add("dragging");
    function move(ev){ setPanelW(window.innerWidth - ev.clientX, false); }
    function up(ev){
      splitter.removeEventListener("pointermove", move); splitter.removeEventListener("pointerup", up); splitter.removeEventListener("pointercancel", up);
      try { splitter.releasePointerCapture(ev.pointerId); } catch(x){}
      document.body.classList.remove("dragging"); setPanelW(currentW(), true);
    }
    splitter.addEventListener("pointermove", move); splitter.addEventListener("pointerup", up); splitter.addEventListener("pointercancel", up);
  });
  splitter.addEventListener("keydown", function(e){
    var step = (e.shiftKey ? 72 : 24);
    if (e.key === "ArrowLeft"){ e.preventDefault(); setPanelW(currentW() + step, true); }
    else if (e.key === "ArrowRight"){ e.preventDefault(); setPanelW(currentW() - step, true); }
    else if (e.key === "Home"){ e.preventDefault(); setPanelW(MIN_PANEL, true); }
    else if (e.key === "End"){ e.preventDefault(); setPanelW(maxPanel(), true); }
  });
  splitter.addEventListener("dblclick", function(){ userSet = false; savePref(SPLIT_KEY, null); setPanelW(autoPanelWidth(), false); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleEdges);

  var startId = (location.hash || "").replace("#", "");
  var startIdx = 0; D.scenarios.forEach(function(s, i){ if (s.id === startId) startIdx = i; });
  switchScenario(startIdx);
  // 화면 확인/테스트용 지름길: window.__flow.select("s7")
  window.__flow = { select: function(id, i){ selectNode(id, i || 0); }, file: selectFile, state: state };
})();
</script>
</body>
</html>
