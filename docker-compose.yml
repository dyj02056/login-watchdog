# 공격 상자는 edge에만 연결한다. 일회용 실행법은 README용 최종 보고에 정리한다.

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: login-watchdog-gateway
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./netwatch/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    sysctls:
      net.ipv4.tcp_syncookies: "1"
    networks:
      edge:
        ipv4_address: "${LW_EDGE_PREFIX}.10"
      core:
        ipv4_address: "172.30.0.10"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: login-watchdog-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # gateway(nginx)가 X-Forwarded-For를 $remote_addr로 덮어써 넘기므로, 이 값을 켜야 공격 상자마다
      # 다른 출발지 IP(.101~.103·일회용 .111 등)가 앱에 보인다. 끄면 모든 요청이 gateway core 주소로 보여
      # brute가 그 주소를 잠가 모두 차단된다. 옆문 위조는 아래 TRUSTED_PROXY_IPS가 막는다(C0-1).
      TRUST_FORWARDED_FOR: "true"
      TRUSTED_PROXY_IPS: "172.30.0.10"
      PUBLIC_BASE_URL: "http://localhost:8080"
      MAIL_BACKEND: "smtp"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      # .env에 배포용 Gmail 값(SMTP_USE_SSL=true)이 남아 있어도 SSL 없는 Mailpit(1025)으로 보내게 고정한다.
      SMTP_USE_SSL: "false"
      # .env에 배포용 Gmail 계정(SMTP_USER·SMTP_PASSWORD)이 남아 있으면 mailer가 로그인을 시도하는데, Mailpit은
      # 인증을 지원하지 않아 모든 메일이 "SMTP AUTH extension not supported"로 실패한다(10/26 C3-1 S6 FAIL).
      # 그래서 단지 안에서는 계정을 비워 로그인 없이 보내게 고정한다. .env의 값은 Vercel용이라 그대로 둔다.
      SMTP_USER: ""
      SMTP_PASSWORD: ""
    expose:
      - "5000"
    depends_on:
      - mailpit
    networks:
      - core
      - egress

  mailpit:
    image: axllent/mailpit:latest
    container_name: login-watchdog-mailpit
    restart: unless-stopped
    expose:
      - "1025"
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      # 앱은 core로 메일을 보낸다. core는 internal이라 Docker가 포트를 공개하지 않으므로,
      # 브라우저에서 8025 화면을 열 수 있게 외부 연결이 되는 egress에도 붙인다.
      - core
      - egress

  # Suricata IDS(A1-1) — gateway 네임스페이스의 edge 트래픽을 감시해 eve.json에 쓴다.
  # 감시 인터페이스는 entrypoint.sh가 ${LW_EDGE_PREFIX}.10이 붙은 쪽으로 고른다(계약서 K1).
  sensor:
    image: jasonish/suricata:7.0.17
    network_mode: "service:gateway"
    depends_on:
      - gateway
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    environment:
      SENSOR_IFACE: ${SENSOR_IFACE:-eth1}
      LW_EDGE_PREFIX: ${LW_EDGE_PREFIX}
      # shipper로 전송된 EVE 로그가 무한히 커지지 않게 50MiB에서 비운다.
      EVE_MAX_BYTES: ${EVE_MAX_BYTES:-52428800}
    entrypoint:
      - /bin/sh
      - /etc/suricata/custom/entrypoint.sh
    volumes:
      # Windows에서도 실행 권한 문제를 피하기 위해 /bin/sh로 직접 실행한다.
      - ./netwatch/suricata:/etc/suricata/custom:ro

      # eve.json은 l4-detector·shipper와 공유한다.
      - eve:/var/log/suricata

      # ET Open은 최초 한 번만 받고 이후 컨테이너 재시작 시 재사용한다.
      - suricata-rules:/var/lib/suricata/rules
    restart: unless-stopped

  # Scapy L4 측정기(A1-2) — SYN 비율·서로 다른 포트 수를 세어 l4.json에 쓴다.
  l4-detector:
    build:
      context: ./netwatch/l4_detector
      dockerfile: Dockerfile
    network_mode: "service:gateway"
    depends_on:
      - gateway
    cap_add:
      - NET_RAW
    environment:
      SENSOR_IFACE: ${SENSOR_IFACE:-eth1}
      LW_EDGE_PREFIX: ${LW_EDGE_PREFIX}
      # Scapy JSON Lines 로그가 무한히 커지지 않게 10MiB에서 비운다.
      L4_MAX_BYTES: ${L4_MAX_BYTES:-10485760}
    volumes:
      # Suricata eve.json과 같은 볼륨에 l4.json을 써서 shipper가 두 파일을 함께 읽게 한다.
      - eve:/var/log/suricata
    restart: unless-stopped

  # eve.json·l4.json을 읽어 앱 수집 창구로 보내는 배달원 shipper(A1-3).
  shipper:
    build:
      # 루트 .dockerignore가 netwatch/를 통째로 빼므로(앱 이미지용), 이 폴더를 빌드 컨텍스트로 쓴다.
      context: ./netwatch/shipper
      dockerfile: Dockerfile
    depends_on:
      - app
      - sensor
      - l4-detector
    environment:
      NET_INGEST_URL: ${NET_INGEST_URL:-http://app:5000/api/internal/net-events}
      NET_INGEST_SECRET: ${NET_INGEST_SECRET}
      APP_INTERNAL_URL: ${APP_INTERNAL_URL:-http://app:5000}
      EVE_PATH: /var/log/suricata/eve.json
      L4_PATH: /var/log/suricata/l4.json
      # 센서 정지 판단 기준(초, A2-3). 여기서 넘기지 않으면 .env에 적어도 컨테이너가 받지 못한다
      SHIPPER_STALL_SECONDS: ${SHIPPER_STALL_SECONDS:-120}
    volumes:
      - eve:/var/log/suricata:ro
    networks:
      - core
    restart: unless-stopped

  # L4 차단 실행기 fw-agent(C1-3) — 앱 내부 API를 HMAC으로 폴링해 gateway 네임스페이스의
  # ipset lw_block을 고친다. .env 전체를 넘기지 않고 필요한 변수만 준다(계획 P6 — NET_ADMIN 컨테이너에 DB 키 금지).
  fw-agent:
    build:
      context: ./netwatch/fw_agent
      dockerfile: Dockerfile
    network_mode: "service:gateway"
    depends_on:
      - gateway
      - app
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      APP_INTERNAL_URL: "http://app:5000"
      NET_AGENT_SECRET: ${NET_AGENT_SECRET}
      PERMANENT_LOCK_IP_ALLOWLIST: ${PERMANENT_LOCK_IP_ALLOWLIST}
      # 이 PC의 edge 대역(guide57). fw-agent가 대역 밖·core·gateway 주소를 넣지 않고 거부하는 기준이다.
      NET_EDGE_SUBNET: ${NET_EDGE_SUBNET:-}
    restart: unless-stopped

  attacker-1:
    build:
      context: .
      dockerfile: netwatch/attacker/Dockerfile
    image: lw-attacker:latest
    profiles:
      - attack
    cap_add:
      - NET_RAW
    environment:
      TARGET_URL: "http://${LW_EDGE_PREFIX}.10:8080"
    networks:
      edge:
        ipv4_address: "${LW_EDGE_PREFIX}.101"

  attacker-2:
    build:
      context: .
      dockerfile: netwatch/attacker/Dockerfile
    image: lw-attacker:latest
    profiles:
      - attack
    cap_add:
      - NET_RAW
    environment:
      TARGET_URL: "http://${LW_EDGE_PREFIX}.10:8080"
    networks:
      edge:
        ipv4_address: "${LW_EDGE_PREFIX}.102"

  attacker-3:
    build:
      context: .
      dockerfile: netwatch/attacker/Dockerfile
    image: lw-attacker:latest
    profiles:
      - attack
    cap_add:
      - NET_RAW
    environment:
      TARGET_URL: "http://${LW_EDGE_PREFIX}.10:8080"
    networks:
      edge:
        ipv4_address: "${LW_EDGE_PREFIX}.103"

networks:
  edge:
    name: lw_edge
    driver: bridge
    ipam:
      config:
        - subnet: "${LW_EDGE_PREFIX}.0/24"
          gateway: "${LW_EDGE_PREFIX}.1"

  core:
    name: login-watchdog-core
    driver: bridge
    internal: true
    ipam:
      config:
        # 172.29.0.0/24는 Docker Desktop(4.91, WSL2)이 VM 내부 통신에 쓰는 대역이라
        # 겹치면 호스트↔엔진 연결이 끊겨 "Network Creating"에서 멈춘다. 그래서 172.30을 쓴다.
        - subnet: "172.30.0.0/24"

  egress:
    name: login-watchdog-egress
    driver: bridge

volumes:
  # 센서 기록(eve.json·l4.json) 공유 볼륨 — sensor·l4-detector가 쓰고 shipper가 읽는다.
  eve: {}
  suricata-rules:
