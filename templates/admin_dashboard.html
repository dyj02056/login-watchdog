<!--
  admin_dashboard.html — 관리자 모니터링 화면의 "뼈대" (주소: /admin/dashboard)

  중요한 특징: 이 화면 안의 표들은 처음엔 전부 비어있다. 화면이 열리자마자
  public/js/dashboard/main.js가 /api/status를 호출해서 데이터를 받아온 뒤,
  자바스크립트가 직접 표 안에 <tr> 줄들을 만들어 채워넣는다. 그래서 이 HTML
  파일 자체에는 실제 로그 데이터가 전혀 적혀있지 않다 — 오직 "표의 틀"만 있다.

  12단계부터 회원 전용 화면(member_dashboard.html 등)이 /dashboard 주소를
  대신 쓰게 되면서, 이 파일은 /admin/dashboard로 옮겨졌다.
-->
<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>로그인 워치독 — 관리자 대시보드</title>
    <!-- dashboard/actions.js가 fetch()로 /api/unlock, /api/users/delete 같은 상태 변경 API를
         호출할 때 이 meta 태그의 값을 읽어서 X-CSRFToken 헤더에 실어 보낸다. 폼과
         달리 fetch() 요청에는 hidden input을 넣을 수 없으므로, 이렇게 화면 어딘가에
         값을 심어두고 자바스크립트가 꺼내 쓰는 방식을 쓴다(CSRF 방어, 2번째 보안 수정). -->
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <!-- dashboard/main.js(공용 폴링 부품 polling.js)가 몇 밀리초마다 /api/status를 다시 부를지. config.py의
         ADMIN_DASHBOARD_POLL_MS 값을 routes/admin/status.py의 admin_dashboard()가 그대로 내려준다(board_detail.html의
         data-poll-interval-ms와 같은 목적, 화면마다 관례가 다른 이유는
         csrf-token처럼 이미 meta 태그로 값을 내려주는 화면이라 그 패턴을 따름). -->
    <meta name="poll-interval-ms" content="{{ poll_interval_ms }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
    <header class="topbar">
        <h1>로그인 워치독 관리자 대시보드</h1>
        <div class="topbar-actions">
            <button id="theme-toggle" type="button" class="theme-toggle">다크 모드</button>
            <!-- 로그아웃은 "링크"가 아니라 "폼 버튼"으로 만든다. 로그아웃처럼 서버 상태를
                 바꾸는 동작은 GET(단순 조회) 대신 POST로 보내는 것이 안전한 관례이기 때문이다. -->
            <form method="post" action="{{ url_for('admin.admin_logout') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="logout-btn">로그아웃</button>
            </form>
        </div>
    </header>

    <main>
        <section>
            <h2>회원가입 설정</h2>
            <!-- id="signup-status" : dashboard/render/tables.js가 여기 현재 상태(허용/중단)를 문구로 채우고,
                 id="signup-toggle-btn" 버튼을 누르면 반대 상태로 바꾸는 API를 호출한다. -->
            <p>현재 상태: <span id="signup-status">확인 중...</span></p>
            <button id="signup-toggle-btn" type="button">불러오는 중...</button>
        </section>

{% include "admin_dashboard/_security.html" %}

{% include "admin_dashboard/_locks.html" %}

{% include "admin_dashboard/_records.html" %}
    </main>

    <!-- 사유 입력 모달(guide33) — "영구 해제"처럼 사유가 꼭 필요한 조치에서 dashboard/utils.js의
         askNote()가 연다. 사유가 비어 있으면 [확인]이 눌려도 닫히지 않는다. -->
    <dialog id="note-dialog" class="note-dialog">
        <form id="note-dialog-form" method="dialog">
            <p id="note-dialog-message"></p>
            <textarea id="note-dialog-input" rows="3" maxlength="200" placeholder="사유를 입력하세요"></textarea>
            <p id="note-dialog-error" class="note-dialog-error" hidden>사유를 입력해야 합니다.</p>
            <div class="note-dialog-actions">
                <button type="button" id="note-dialog-cancel">취소</button>
                <button type="submit" id="note-dialog-confirm">확인</button>
            </div>
        </form>
    </dialog>

    <!-- 이 화면의 동작(5초마다 새로고침, 해제 버튼 클릭 처리 등)은 public/js/dashboard/
         디렉터리 아래 파일들(state/utils/render/api/actions/events/main.js, render/*.js)로
         나뉘어 있다 — 원래는 dashboard.js 한 파일이었다(분리 배경:
         docs/refactor/2026-09-15-file-split.md, docs/refactor/2026-10-09-module-plan.md).
         type="module"로 불러오면 브라우저가 main.js의 import 구문을 따라가며 나머지
         파일을 전부 알아서 불러온다. 모듈 스크립트는 기본적으로 defer처럼 동작해서
         (화면 요소가 먼저 다 그려진 뒤 실행됨) 맨 아래 둘 필요는 없지만, 기존 관례를
         그대로 유지했다. -->
    <script type="module" src="{{ url_for('static', filename='js/dashboard/main.js') }}"></script>
</body>
</html>
