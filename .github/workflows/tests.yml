# ============================================================================
# tests.yml — GitHub Actions로 pytest를 자동 실행하는 CI(지속적 통합) 워크플로우
#
# 지금까지는 "테스트를 통과했는지"를 개발자가 로컬에서 pytest를 직접 돌려봐야만
# 알 수 있었다 — 누군가 깜빡하고 실행을 안 해본 채로 커밋/PR을 올리면, 망가진
# 코드가 그대로 main 브랜치에 들어갈 수 있었다. 이 워크플로우를 추가하면 push나
# PR이 생길 때마다 GitHub이 자동으로(사람 손을 거치지 않고) 깨끗한 가상 환경에서
# pytest를 실행하고, 그 결과(성공/실패)를 PR 화면에 체크마크로 보여준다.
#
# 진짜 Supabase 자격 증명은 여기 전혀 필요 없다 — tests/conftest.py의 flask_app
# fixture가 가짜 환경변수(SECRET_KEY 등)를 스스로 채워넣고 db.ensure_bootstrap_admin()도
# 무력화해두었으므로(진짜 네트워크 접속 시도 자체가 없음), 이 워크플로우는 그냥
# "pip install → pytest 실행"만 하면 된다.
# ============================================================================

name: pytest

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: pytest 실행
        run: pytest tests/ -v

  # Next.js 화면(web/)을 타입 검사·빌드하고, 저장소에 올려 둔 빌드 결과(spa/, public/_next)가 최신인지 확인한다.
  # 소스를 고치고 `npm run build`를 안 돌린 채 커밋하면 배포 화면이 옛 모습으로 남기 때문이다.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: 의존성 설치
        working-directory: web
        run: npm ci

      - name: 타입 검사
        working-directory: web
        run: npm run typecheck

      - name: 빌드
        working-directory: web
        run: npm run build

      # 운영체제·폰트 내려받기 시점에 따라 해시가 달라질 수 있어 경고로만 둔다(실패해도 작업은 통과).
      - name: 빌드 결과가 커밋된 것과 같은지 확인
        continue-on-error: true
        run: git diff --exit-code --stat -- spa public/_next
