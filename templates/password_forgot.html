<!--
  password_forgot.html — 비밀번호 찾기(재설정 메일 요청) 화면 (guide41)

  아이디를 입력하면 routes/password.py의 password_forgot_submit()이 재설정 메일을 보낸다.
  계정이 있든 없든, 이메일이 인증됐든 아니든 응답 문구는 항상 같다(계정 존재 여부 노출 방지).
-->
<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>로그인 워치독 — 비밀번호 찾기</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
    <button id="theme-toggle" type="button" class="theme-toggle theme-toggle--floating">다크 모드</button>

    <div class="auth-card">
        <h1>비밀번호 찾기</h1>

        <p class="recovery-note">
            아이디를 입력하면 <strong>인증된 이메일</strong>로 비밀번호 재설정 링크를 보내드립니다.
            이메일 인증을 하지 않았다면 메일이 가지 않으니 관리자에게 문의해주세요.
        </p>

        {% if message %}
            <ul class="flash-list">
                <li>{{ message }}</li>
            </ul>
        {% endif %}

        <form method="post" action="{{ url_for('password.password_forgot_submit') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- 허니팟(봇 탐지)용 숨김 필드 — helpers.is_bot_submission() 참고. -->
            <div class="hp-field" aria-hidden="true">
                <label for="website">웹사이트</label>
                <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
            </div>

            <label for="username">아이디</label>
            <input type="text" id="username" name="username" value="{{ username }}" required>

            <button type="submit">재설정 메일 보내기</button>
        </form>

        <div class="auth-links">
            <a href="{{ url_for('auth.login') }}">로그인으로 돌아가기</a>
        </div>
    </div>
</body>
</html>
